<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>学习笔记 · 2027考研政治</title>
<style>
  :root{--paper:#f5f0e6;--card:#fffdf8;--ink:#20262b;--soft:#465058;--muted:#81796b;--line:#ded4c3;--jade:#2f6b56;--jade-soft:#e4efe8;--red:#a44437;--serif:"Songti SC","STSong",serif;--sans:"PingFang SC","Microsoft YaHei",sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  button,input{font:inherit}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px clamp(14px,4vw,40px);background:rgba(255,253,248,.95);border-bottom:1px solid var(--line)}
  .seal{width:42px;height:42px;border-radius:11px;background:var(--jade);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:19px;text-decoration:none}
  h1{margin:0;font-family:var(--serif);font-size:20px;font-weight:500}.sub{margin:3px 0 0;color:var(--muted);font-size:10px}
  .actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fffefb;border-radius:999px;padding:7px 11px;font-size:11px;color:var(--soft);cursor:pointer;text-decoration:none}
  .btn.primary{background:var(--jade);color:#fff;border-color:var(--jade)}
  .wrap{max-width:950px;margin:0 auto;padding:18px clamp(12px,3vw,24px) 60px}
  #q{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--card);outline:none;margin-bottom:12px}
  .note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px}
  .note .meta{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:10px;flex-wrap:wrap}
  .pill{background:var(--jade-soft);color:var(--jade);border-radius:999px;padding:2px 7px}
  .note .stem{font-size:13px;line-height:1.8;margin:6px 0;color:var(--soft)}
  .note .my{font-size:13px;line-height:1.8;white-space:pre-wrap;border-left:3px solid var(--jade);padding-left:9px;margin:7px 0;color:var(--ink)}
  .note details{margin-top:6px;color:var(--muted);font-size:11px;line-height:1.7}.note summary{cursor:pointer}
  .note .del{border:0;background:transparent;color:var(--red);font-size:10px;cursor:pointer;margin-left:auto}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:50px 10px}
</style>
</head>
<body>
<header class="topbar">
  <a class="seal" href="index.html" aria-label="返回">记</a>
  <div><h1>学习笔记</h1><p class="sub">AI 解析收藏 · 错因 · 记忆口诀</p></div>
  <div class="actions"><button class="btn primary" id="export" type="button">导出 JSON</button><label class="btn" for="import">导入 JSON</label><input id="import" type="file" accept="application/json" hidden><button class="btn" id="clear" type="button">清空</button></div>
</header>
<main class="wrap">
  <input id="q" placeholder="搜题目、笔记内容…" autocomplete="off">
  <div id="list"></div>
</main>
<script src="global-search.js"></script>
<script>
const KEY="kaoyan-study-notes-v1";
const $=s=>document.querySelector(s);
let notes={};
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function load(){try{notes=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){notes={};}}
function save(){localStorage.setItem(KEY,JSON.stringify(notes));}
function render(){
  const q=$("#q").value.trim();
  const arr=Object.values(notes).filter(n=>!q||((n.stem||"")+(n.note||"")+(n.ai||"")).includes(q)).sort((a,b)=>(b.at||0)-(a.at||0));
  $("#list").innerHTML=arr.length?arr.map(n=>`<article class="note"><div class="meta"><span class="pill">${esc(n.module||"笔记")}</span><span>${new Date(n.at||Date.now()).toLocaleString()}</span><span>答案 ${esc(n.answer||"")}</span><button class="del" data-id="${esc(n.qid)}" type="button">删除</button></div><p class="stem">${esc(n.stem||"")}</p><div class="my">${esc(n.note||"")}</div>${n.ai?`<details><summary>查看当时的 AI 解析</summary><div style="white-space:pre-wrap">${esc(n.ai)}</div></details>`:""}</article>`).join(""):'<div class="empty">还没有笔记。做题时点「AI解析」，在面板里写笔记即可保存到这里。</div>';
}
$("#q").addEventListener("input",render);
$("#list").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(!b)return;if(!confirm("删除这条笔记？"))return;delete notes[b.dataset.id];save();render();});
$("#export").onclick=()=>{const blob=new Blob([JSON.stringify(notes,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="kaoyan-politics-notes.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$("#import").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&typeof d==="object"){notes=Object.assign(notes,d);save();render();}}catch(err){alert("JSON 格式不对");}};r.readAsText(f);};
$("#clear").onclick=()=>{if(!confirm("清空全部笔记？建议先导出备份。"))return;notes={};save();render();};
load();render();
</script>
</body>
</html>
