<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>背诵手册 · 2027考研政治</title>
<style>
  :root { --paper:#f5f0e6; --card:#fffdf8; --ink:#20262b; --soft:#465058; --muted:#81796b; --line:#ded4c3; --jade:#2f6b56; --jade-soft:#e4efe8; --serif:"Songti SC","STSong","Noto Serif CJK SC",serif; --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); }
  button,input { font:inherit; }
  .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:12px clamp(14px,4vw,40px); background:rgba(255,253,248,.95); border-bottom:1px solid var(--line); backdrop-filter:blur(12px); }
  .seal { width:42px; height:42px; border-radius:11px; background:var(--jade); color:#fff; display:grid; place-items:center; font-family:var(--serif); font-size:19px; text-decoration:none; }
  h1 { margin:0; font-family:var(--serif); font-size:clamp(17px,2.2vw,22px); font-weight:500; }
  .sub { margin:3px 0 0; color:var(--muted); font-size:10px; }
  .wrap { max-width:1080px; margin:0 auto; padding:18px clamp(12px,3vw,28px) 60px; }
  .searchbox { display:flex; gap:8px; margin:14px 0 8px; }
  #q { flex:1; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:12px 14px; font-size:14px; outline:none; }
  #q:focus { border-color:var(--jade); }
  #go { border:0; border-radius:12px; padding:0 18px; background:var(--jade); color:#fff; cursor:pointer; }
  .tabs { display:flex; gap:7px; margin:10px 0 4px; flex-wrap:wrap; }
  .tab { border:1px solid var(--line); background:transparent; border-radius:999px; padding:6px 12px; font-size:12px; color:var(--soft); cursor:pointer; }
  .tab.on { background:var(--jade); color:#fff; border-color:var(--jade); }
  .hint { color:var(--muted); font-size:11px; line-height:1.7; margin:8px 0 14px; }
  .results { display:grid; gap:10px; }
  .result { border:1px solid var(--line); background:var(--card); border-radius:14px; padding:13px 15px; cursor:pointer; }
  .result:hover { border-color:#b8cabb; }
  .result .meta { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:10px; }
  .pill { background:var(--jade-soft); color:var(--jade); border-radius:999px; padding:2px 7px; }
  .result h3 { margin:5px 0 4px; font-size:14px; font-weight:600; }
  .result p { margin:0; color:var(--soft); font-size:12px; line-height:1.8; }
  .empty { padding:40px 10px; color:var(--muted); text-align:center; font-size:13px; }
  dialog { width:min(94vw,760px); max-height:86vh; border:1px solid var(--line); border-radius:16px; background:var(--card); color:var(--ink); padding:0; }
  dialog::backdrop { background:rgba(32,38,43,.4); }
  .sheet-head { position:sticky; top:0; display:flex; justify-content:space-between; gap:12px; align-items:center; padding:13px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  .sheet-head h3 { margin:0; font-family:var(--serif); font-size:16px; font-weight:500; }
  .icon { border:0; background:transparent; font-size:22px; color:var(--muted); cursor:pointer; }
  .page-img { display:block; width:100%; height:auto; max-height:82vh; object-fit:contain; background:#eee; }
  .page-text { padding:16px 20px 28px; white-space:pre-wrap; line-height:2; font-size:14px; color:var(--soft); }
  .page-text[hidden], .page-img[hidden] { display:none; }
  .page-nav { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:8px 12px; border-bottom:1px solid var(--line); background:#fffefb; font-size:11px; color:var(--muted); }
  .page-nav select, .page-nav input { border:1px solid var(--line); border-radius:7px; background:#fff; padding:5px 7px; font-size:11px; color:var(--ink); }
  .page-nav input { width:64px; }
  .page-nav button { border:1px solid var(--line); border-radius:7px; background:#fff; padding:5px 8px; font-size:11px; color:var(--soft); cursor:pointer; }
  .page-nav .pos { margin-left:auto; }

  .reader { position:fixed; inset:0; z-index:80; background:var(--paper); display:flex; flex-direction:column; }
  .reader[hidden] { display:none; }
  .reader-bar { position:sticky; top:0; z-index:5; display:flex; gap:7px; align-items:center; flex-wrap:wrap; padding:9px clamp(10px,3vw,22px); background:rgba(255,253,248,.97); border-bottom:1px solid var(--line); backdrop-filter:blur(10px); }
  .reader-bar button { border:1px solid var(--line); border-radius:8px; background:#fffefb; color:var(--soft); padding:6px 9px; font-size:11px; cursor:pointer; }
  .reader-bar button.on { background:var(--jade); color:#fff; border-color:var(--jade); }
  .reader-bar input { width:62px; border:1px solid var(--line); border-radius:8px; padding:6px; font-size:11px; }
  .reader-pos { margin-left:auto; font-size:11px; color:var(--muted); }
  .reader-body { flex:1; overflow:auto; padding:12px 10px 70px; scroll-behavior:smooth; }
  .page-wrap { max-width:900px; margin:0 auto 12px; position:relative; background:#fff; border:1px solid #e8e1d4; border-radius:5px; overflow:hidden; aspect-ratio:900 / 1274; }
  .page-wrap img { display:block; width:100%; height:auto; min-height:100%; object-fit:contain; background:#fff; }
  .page-wrap .pno { position:absolute; top:6px; left:6px; background:rgba(255,253,248,.9); border:1px solid #ddd3c1; color:#81796b; border-radius:999px; padding:1px 6px; font-size:9px; pointer-events:none; }
  .page-wrap .ptext { padding:10px 14px; font-size:11px; line-height:1.8; color:#465058; white-space:pre-wrap; border-top:1px solid #eee6d8; background:#fffefb; }
  .page-wrap.loading::after { content:"加载中…"; position:absolute; inset:0; display:grid; place-items:center; color:#b0a797; font-size:12px; }
  @media (max-width:600px){ .topbar{padding:10px 14px} .searchbox{position:sticky;top:64px;z-index:10;background:var(--paper);padding:6px 0} }
</style>
</head>
<body>
<header class="topbar">
  <a class="seal" href="index.html" aria-label="返回">背</a>
  <div><h1>背诵手册 · 知识点检索</h1><p class="sub">27肖秀荣 上册 + 下册 · 搜知识点或直接翻页</p></div>
  <button class="tab" id="direct-open" type="button" style="margin-left:auto">📖 直接查看</button>
</header>
<main class="wrap">
  <div class="searchbox"><input id="q" placeholder="输入知识点，如：社会基本矛盾、全过程人民民主" autocomplete="off"><button id="go">搜索</button></div>
  <div class="tabs"><button class="tab on" data-vol="all">全部</button><button class="tab" data-vol="上册">上册</button><button class="tab" data-vol="下册">下册</button></div>
  <p class="hint">搜到后点卡片查看该页 OCR 原文。页码是 PDF 页，和电子书页码一致；OCR 可能有少量错字，以原书为准。</p>
  <div id="results" class="results"></div>
</main>
<section class="reader" id="reader" hidden>
  <div class="reader-bar">
    <button id="reader-back" type="button">← 返回检索</button>
    <button id="rvol-up" type="button">上册</button>
    <button id="rvol-down" type="button">下册</button>
    <span id="reader-pos" class="reader-pos"></span>
    <input id="reader-jump" type="number" min="1" placeholder="页码">
    <button id="reader-jump-go" type="button">跳页</button>
    <button id="reader-text-toggle" type="button">显示文字</button>
  </div>
  <div class="reader-body" id="reader-body"></div>
</section>
<dialog id="page-dialog"><div class="sheet-head"><h3 id="page-title"></h3><div><button class="tab" id="view-toggle" type="button">看文字</button> <button class="icon" data-close type="button">×</button></div></div><div class="page-nav">
    <select id="view-vol"><option value="up">上册</option><option value="down">下册</option></select>
    <button id="prev-page" type="button">← 上一页</button>
    <button id="next-page" type="button">下一页 →</button>
    <input id="jump-page" type="number" min="1" placeholder="页码">
    <button id="jump-go" type="button">跳页</button>
    <span class="pos" id="page-pos"></span>
  </div>
  <img id="page-img" class="page-img" alt="背诵手册页面"><div id="page-text" class="page-text" hidden></div></dialog>
<script src="handbook-data.js"></script>
<script src="handbook-page.js"></script>
<script>
const DATA = window.HANDBOOK_INDEX || [];
let currentPage = null;
function showImg(p){const img=$('#page-img');img.alt='加载中…';loadHandbookPage(p).then(src=>{img.src=src;img.hidden=false;}).catch(e=>{img.alt='图片加载失败：'+e.message;});}
function pagesOf(volKey){ return DATA.filter(p=>p.volKey===volKey).sort((a,b)=>a.pdfPage-b.pdfPage); }
function renderNav(p){
  const list=pagesOf(p.volKey);
  $('#view-vol').value=p.volKey;
  $('#page-pos').textContent=`${p.volume} · 第 ${p.pdfPage} / ${list.length ? list[list.length-1].pdfPage : '?'} 页`;
  $('#jump-page').value=p.pdfPage;
}
function openPage(p){
  currentPage=p;
  $('#page-title').textContent=`${p.volume} · PDF 第 ${p.pdfPage} 页 · ${p.heading||''}`;
  showImg(p);
  $('#page-text').textContent=p.text;
  $('#page-text').hidden=true;
  $('#view-toggle').textContent='看文字';
  renderNav(p);
  if(!$('#page-dialog').open) $('#page-dialog').showModal();
}
function stepPage(delta){
  if(!currentPage) return;
  const list=pagesOf(currentPage.volKey);
  const i=list.findIndex(p=>p.id===currentPage.id);
  const j=i+delta;
  if(j<0||j>=list.length) return;
  openPage(list[j]);
}

const $ = s => document.querySelector(s);
let vol = 'all';
function norm(s){ return String(s||'').replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,''); }
function tokens(q){ q=norm(q); if(q.length<2) return q?[q]:[]; const out=[]; for(let i=0;i<q.length-1;i++) out.push(q.slice(i,i+2)); if(q.length<=6) out.push(q); return [...new Set(out)]; }
function score(text, q, ts){ const t=norm(text); let s=0; if(q && t.includes(q)) s+=q.length*8; for(const x of ts){ let i=0,c=0; while((i=t.indexOf(x,i))>=0){c++;i+=x.length;} s+=Math.min(c,6)*x.length; } return s; }
function snippet(text, q){ const t=String(text||'').replace(/\s+/g,''); if(!q) return t.slice(0,150); const i=t.indexOf(q); if(i<0) return t.slice(0,150); return (i>40?'…':'')+t.slice(Math.max(0,i-40),i+130)+'…'; }
function search(){
  const q=norm($('#q').value); const ts=tokens(q); const list=[];
  for(const p of DATA){ if(vol!=='all'&&p.volume!==vol) continue; const s=score(p.text,q,ts); if(s>0) list.push([s,p]); }
  list.sort((a,b)=>b[0]-a[0]);
  const box=$('#results');
  if(!q){ box.innerHTML='<div class="empty">输入一个知识点开始搜索，例如“社会基本矛盾”“全过程人民民主”“新发展理念”。</div>'; return; }
  if(!list.length){ box.innerHTML='<div class="empty">没有找到，换一个关键词试试。</div>'; return; }
  box.innerHTML=list.slice(0,20).map(([s,p])=>`<article class="result" data-id="${p.id}"><div class="meta"><span class="pill">${p.volume}</span><span>PDF 第 ${p.pdfPage} 页</span><span>${esc(p.heading||'')}</span></div><h3>${esc(p.heading||'相关知识点')}</h3><p>${esc(snippet(p.text,q))}</p></article>`).join('');
}
function esc(v){ return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
$('#go').addEventListener('click',search);
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter') search(); });
let readerVol = null, readerObserver = null, readerText = false;
function readerPages(){ return pagesOf(readerVol || 'up'); }
function mountReader(vol){
  readerVol = vol;
  $('#rvol-up').classList.toggle('on', vol==='up');
  $('#rvol-down').classList.toggle('on', vol==='down');
  const box = $('#reader-body');
  box.innerHTML = '';
  const pages = pagesOf(vol);
  if(readerObserver) readerObserver.disconnect();
  readerObserver = new IntersectionObserver(entries=>{
    for(const en of entries){
      if(!en.isIntersecting) continue;
      const el = en.target;
      if(!el.dataset.loaded) loadReaderPage(el);
      $('#reader-pos').textContent = `${el.dataset.vol === 'up' ? '上册' : '下册'} · 第 ${el.dataset.page} / ${pages.length} 页`;
    }
  }, {root: box, rootMargin: '900px 0px'});
  for(const p of pages){
    const el = document.createElement('div');
    el.className='page-wrap loading';
    el.dataset.id=p.id; el.dataset.vol=p.volKey; el.dataset.page=p.pdfPage;
    el.innerHTML = `<span class="pno">${p.volume} · 第 ${p.pdfPage} 页</span><img alt="背诵手册第${p.pdfPage}页" loading="lazy">`;
    box.appendChild(el);
    readerObserver.observe(el);
  }
  box.scrollTop = 0;
}
function loadReaderPage(el){
  el.dataset.loaded='1';
  const p = DATA.find(x=>x.id===el.dataset.id);
  if(!p) return;
  const img = el.querySelector('img');
  loadHandbookPage(p).then(src=>{ img.src=src; el.classList.remove('loading'); }).catch(()=>{ el.classList.remove('loading'); img.alt='页面图片加载失败'; });
}
function openReader(p){
  currentPage=p;
  $('#reader').hidden = false;
  document.body.style.overflow='hidden';
  if(!readerVol || readerVol!==p.volKey) mountReader(p.volKey);
  requestAnimationFrame(()=>{
    const el = document.querySelector(`.page-wrap[data-id="${p.id}"]`);
    if(el) el.scrollIntoView({block:'start'});
    const pos = document.querySelector('#reader-pos');
    if(pos) pos.textContent = `${p.volume} · 第 ${p.pdfPage} / ${pagesOf(p.volKey).length} 页`;
  });
}
function closeReader(){
  $('#reader').hidden = true;
  document.body.style.overflow='';
}
$('#direct-open').addEventListener('click',()=>{ if(currentPage) openReader(currentPage); else { const first=pagesOf('up')[0]; if(first) openReader(first); } });
$('#reader-back').addEventListener('click',closeReader);
$('#rvol-up').addEventListener('click',()=>{mountReader('up');});
$('#rvol-down').addEventListener('click',()=>{mountReader('down');});
$('#reader-jump-go').addEventListener('click',()=>{const n=Number($('#reader-jump').value);if(!n)return;const p=pagesOf(readerVol||'up').find(x=>x.pdfPage===n);if(p)openReader(p);else alert('这一册没有第 '+n+' 页');});
$('#reader-jump').addEventListener('keydown',e=>{if(e.key==='Enter')$('#reader-jump-go').click();});
$('#reader-text-toggle').addEventListener('click',()=>{readerText=!readerText;$('#reader-text-toggle').textContent=readerText?'隐藏文字':'显示文字';document.querySelectorAll('.page-wrap').forEach(el=>{if(readerText&&!el.querySelector('.ptext')){const p=DATA.find(x=>x.id===el.dataset.id);if(p){const t=document.createElement('div');t.className='ptext';t.textContent=p.text;el.appendChild(t);}}else if(!readerText){const t=el.querySelector('.ptext');if(t)t.remove();}});});
$('#prev-page').addEventListener('click',()=>stepPage(-1));
$('#next-page').addEventListener('click',()=>stepPage(1));
$('#view-vol').addEventListener('change',e=>{ const list=pagesOf(e.target.value); if(list.length) openPage(list[0]); });
$('#jump-go').addEventListener('click',()=>{ const n=Number($('#jump-page').value); if(!currentPage||!n) return; const p=pagesOf(currentPage.volKey).find(x=>x.pdfPage===n); if(p) openPage(p); else alert('这一册没有第 '+n+' 页'); });
$('#jump-page').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#jump-go').click(); });
search();
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); b.classList.add('on'); vol=b.dataset.vol; search(); }));
$('#results').addEventListener('click',e=>{ const card=e.target.closest('[data-id]'); if(!card) return; const p=DATA.find(x=>x.id===card.dataset.id); if(!p) return; openReader(p); });
document.querySelector('[data-close]').addEventListener('click',()=>$('#page-dialog').close());
$('#view-toggle').addEventListener('click',()=>{ const img=$('#page-img'), txt=$('#page-text'); const showText=!img.hidden; img.hidden=showText; txt.hidden=!showText; $('#view-toggle').textContent=showText?'看图片':'看文字'; });
search();
const pageParam = new URLSearchParams(location.search).get("page");
if (pageParam) {
  const p = DATA.find(x => x.id === pageParam);
  if (p) openReader(p);
}
</script>
<script src="global-search.js"></script>
</body>
</html>
