<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>错题分析 · 考研政治</title>
<style>
  :root{--paper:#f5f0e6;--card:#fffdf8;--ink:#20262b;--soft:#465058;--muted:#81796b;--line:#ded4c3;--jade:#2f6b56;--jade-soft:#e4efe8;--red:#a44437;--red-soft:#f7e7e1;--serif:"Songti SC","STSong",serif;--sans:"PingFang SC","Microsoft YaHei",sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  button,select,a{font:inherit}
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:11px;padding:11px clamp(14px,4vw,40px);background:rgba(255,253,248,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
  .seal{width:42px;height:42px;border-radius:11px;background:var(--jade);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:19px;text-decoration:none}
  h1{margin:0;font-family:var(--serif);font-size:19px;font-weight:500}.sub{font-size:10px;color:var(--muted);margin:3px 0 0}
  .tabs{display:flex;gap:5px;margin-left:12px}.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:11px;color:var(--soft);cursor:pointer;text-decoration:none}.tab.on{background:var(--jade);color:#fff;border-color:var(--jade)}
  .practice{margin-left:auto;font-size:11px;color:var(--jade);border:1px solid var(--line);border-radius:999px;padding:7px 11px;text-decoration:none;background:#fffefb}
  .wrap{max-width:980px;margin:0 auto;padding:18px clamp(12px,3vw,24px) 70px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row label{font-size:11px;color:var(--muted)}
  select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fffefb;color:var(--ink);font-size:13px}
  .hint{font-size:11px;color:var(--muted);line-height:1.8;margin:8px 0 0}
  .grid{display:grid;grid-template-columns:repeat(11,1fr);gap:7px;margin:14px 0}
  .cell{height:42px;border:1px solid var(--line);border-radius:9px;background:#fffefb;color:var(--soft);font-size:13px;cursor:pointer;transition:all .12s}
  .cell:hover{border-color:var(--jade)}
  .cell.sel{background:var(--red-soft);border-color:#d9a99d;color:#8d3b2f;font-weight:600;box-shadow:inset 0 0 0 1px #d9a99d}
  .cell.multi{border-style:dashed}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  .actions{display:flex;gap:9px;align-items:center;margin-top:8px}
  .btn{border:0;border-radius:9px;padding:9px 16px;background:var(--jade);color:#fff;font-size:12px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghostbtn{background:transparent;border:1px solid var(--line);color:var(--soft)}
  #status{font-size:11px;color:var(--muted)}
  .item{background:#fffefb;border:1px solid #e5ded0;border-radius:12px;padding:11px 13px;margin-bottom:10px}
  .item .top{display:flex;gap:7px;align-items:center;font-size:10px;color:var(--muted)}
  .pill{background:var(--jade-soft);color:var(--jade);border-radius:999px;padding:2px 8px}
  .item .stem{font-size:12px;line-height:1.7;color:var(--soft);margin:6px 0}
  .item .ans{font-size:11px;color:var(--jade);margin-bottom:4px}
  .item .ai{font-size:12px;line-height:1.85;color:var(--soft);white-space:pre-wrap}
  .empty{text-align:center;color:var(--muted);font-size:12px;padding:24px 10px}
  @media(max-width:700px){.topbar{flex-wrap:wrap}.practice{order:5}.grid{grid-template-columns:repeat(8,1fr)}.cell{height:38px}.tabs{margin-left:0}}

  .related{margin-top:9px;border-top:1px dashed #e5ded0;padding-top:8px}
  .rel-title{font-size:10px;color:#2f6b56;letter-spacing:.06em;margin:7px 0 4px}
  .rel-link{display:block;border:1px solid #e5ded0;border-radius:8px;padding:6px 8px;margin-bottom:4px;text-decoration:none;color:inherit;background:#faf8f1}
  .rel-link:hover{border-color:#2f6b56}
  .rel-link b{display:block;font-size:10.5px;color:#2f6b56}
  .rel-link span{display:block;font-size:10px;color:#465058;line-height:1.55;margin-top:1px}
  .rel-link em{display:block;font-size:9.5px;color:#81796b;font-style:normal;line-height:1.5;margin-top:2px}
  .pdf-modal{position:fixed;inset:0;z-index:140;background:rgba(20,24,26,.72);display:flex;align-items:center;justify-content:center;padding:18px}
  .pdf-modal iframe{width:min(920px,96vw);height:92vh;border:0;border-radius:10px;background:#fff}
  .pdf-modal button{position:fixed;top:14px;right:18px;border:0;background:#fff;border-radius:50%;width:38px;height:38px;font-size:22px;cursor:pointer}
</style>
</head>
<body>
<header class="topbar">
  <a class="seal" href="index.html" aria-label="返回">错</a>
  <div><h1 id="title">错题分析</h1><p class="sub" id="sub">点出错的题号，一起交给 AI 解析</p></div>
  <div class="tabs"><a class="tab" id="tab-xiaoba" href="wrong.html?module=xiaoba">肖八</a><a class="tab" id="tab-zhenti" href="wrong.html?module=zhenti">近10年真题</a></div>
  <a class="practice" id="practice" href="index.html">进入逐题练习 →</a>
</header>
<main class="wrap">
  <section class="card">
    <div class="row"><label for="paper">选择试卷</label><select id="paper"></select><span class="hint" id="paper-hint"></span></div>
    <p class="hint">直接点击这张卷子里做错的题号；可以多选，选完点下面「开始 AI 解析」。单选 1–16，多选 17–33。</p>
    <div class="grid" id="grid"></div>
    <div class="legend"><span><i class="dot" style="background:#fffefb;border:1px solid #ded4c3"></i>未选</span><span><i class="dot" style="background:#f7e7e1;border:1px solid #d9a99d"></i>已选错题</span><span>虚线 = 多选</span></div>
    <div class="actions"><button class="btn" id="run" type="button" disabled>开始 AI 解析</button><button class="btn ghostbtn" id="clear" type="button">清空选择</button><span id="status">未选择题目</span></div>
  </section>
  <section id="results"></section>
</main>
<script src="handbook-data.js"></script>
<script src="xiao1000-index.js"></script>
<script src="global-search.js"></script>
<script>
const AI_ENDPOINT="https://detailed-grasshopper-d9a0e9b307d-1420335919.ap-shanghai.app.tcloudbase.com/grade";
const AI_CODE="essay2026";
const CACHE_KEY="kaoyan-batch-ai-v1";
const $=s=>document.querySelector(s);
let moduleType = new URLSearchParams(location.search).get("module")==="zhenti" ? "zhenti" : "xiaoba";
let sections=[], selected=new Set(), cache={};
try{cache=JSON.parse(localStorage.getItem(CACHE_KEY)||"{}")||{};}catch(e){cache={};}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function loadData(){
  const src=moduleType==="zhenti"?"zhenti-full-data.js":"xiaoba-full-data.js";
  return new Promise(resolve=>{
    if((moduleType==="zhenti"&&window.ZHENTI_SECTIONS)||(moduleType==="xiaoba"&&window.XIAOBA_SECTIONS)) return resolve();
    const s=document.createElement("script");s.src=src;s.onload=resolve;s.onerror=resolve;document.head.appendChild(s);
  }).then(()=>{sections=moduleType==="zhenti"?(window.ZHENTI_SECTIONS||[]):(window.XIAOBA_SECTIONS||[]);});
}
function paper(){const sel=$("#paper");return sections.find(s=>s.id===sel.value)||sections[0];}
function renderPapers(){
  $("#title").textContent=moduleType==="zhenti"?"近10年真题 · 错题分析":"肖八 · 错题分析";
  $("#sub").textContent=moduleType==="zhenti"?"点出这一年的错题号，一起交给 AI 解析":"点出这一套的错题号，一起交给 AI 解析";
  $("#tab-xiaoba").classList.toggle("on",moduleType==="xiaoba");
  $("#tab-zhenti").classList.toggle("on",moduleType==="zhenti");
  $("#practice").href=moduleType==="zhenti"?"zhenti.html":"xiaoba.html";
  $("#paper").innerHTML=sections.map(s=>`<option value="${esc(s.id)}">${esc(s.title)}（${s.questions.length}题）</option>`).join("");
  $("#paper-hint").textContent="";
  selected.clear();renderGrid();$("#results").innerHTML="";
}
function renderGrid(){
  const sec=paper(); if(!sec)return;
  $("#grid").innerHTML=sec.questions.map(q=>`<button type="button" class="cell ${selected.has(q.num)?"sel":""} ${q.type==="multiple"?"multi":""}" data-n="${q.num}">${q.num}</button>`).join("");
  $("#grid").querySelectorAll(".cell").forEach(b=>b.onclick=()=>{const n=Number(b.dataset.n);selected.has(n)?selected.delete(n):selected.add(n);renderGrid();update();});
  $("#paper-hint").textContent=`${sec.questions.length} 题`;
  update();
}
function update(){
  const n=selected.size;$("#run").disabled=!n;$("#status").textContent=n?`已选 ${n} 题`:"未选择题目";
}
function qFor(sec,num){return sec.questions.find(q=>Number(q.num)===num);}
function nrm(v){return String(v||"").replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,"");}
function bg(v){v=nrm(v);if(v.length<2)return v?[v]:[];const a=[];for(let i=0;i<v.length-1;i++)a.push(v.slice(i,i+2));return [...new Set(a)];}
function score(text,q,gs){const t=nrm(text);let n=0;if(t.includes(q))n+=q.length*8;for(const x of gs){let p=0,c=0;while((p=t.indexOf(x,p))>=0){c++;p+=x.length;}n+=Math.min(c,5)*x.length;}return n;}
function topHB(q){const base=nrm(String(q.stem||"").slice(0,90));const gs=bg(base);return (window.HANDBOOK_INDEX||[]).map(p=>[score(p.text+" "+(p.heading||""),base,gs),p]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,2).map(x=>x[1]);}
function topXQ(q){const base=nrm(String(q.stem||"").slice(0,90));const gs=bg(base);return (window.XIAO1000_INDEX||[]).map(p=>[score(p.stem+" "+(p.chapter||""),base,gs),p]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,4).map(x=>x[1]);}
function cut(v,n){v=String(v||"").replace(/\s+/g," ");return v.length>n?v.slice(0,n)+"…":v;}
function hbHTML(list){if(!list.length)return '<div class="rel-title">背诵手册定位</div><div style="font-size:10px;color:#81796b">未找到明显对应页，以原书目录为准。</div>';return '<div class="rel-title">背诵手册定位</div>'+list.map(p=>`<a class="rel-link" href="#" data-hb="${esc(p.id)}"><b>${esc(p.volume)} · PDF 第 ${p.pdfPage} 页</b><span>${esc(cut(p.heading||"",50))}</span><em>${esc(cut(p.text,80))}</em></a>`).join("");}
function xqHTML(list){if(!list.length)return '<div class="rel-title">肖1000相关专题</div><div style="font-size:10px;color:#81796b">暂无匹配，可在肖1000里搜同章节。</div>';return '<div class="rel-title">肖1000相关专题</div>'+list.map(p=>`<a class="rel-link" href="#" data-xq data-sec="${esc(p.section)}" data-q="${esc(p.id)}"><b>${esc(p.sectionTitle)} · 第 ${p.id.split("-").pop()} 题</b><span>${esc(cut(p.stem,75))}</span></a>`).join("");}
function promptFor(q,hand,rel){
  const opts=["A","B","C","D"].map(l=>l+". "+String(q.options[l]||"").slice(0,50)).join("；");
  const hb=hand.map(p=>`【${p.volume} PDF第${p.pdfPage}页】${String(p.text||"").slice(0,220)}`).join("\n");
  const xq=rel.map(r=>`（${r.sectionTitle} 第${r.id.split("-").pop()}题）${String(r.stem||"").slice(0,80)}`).join("\n");
  return ("请忽略作文批改场景，作为考研政治老师分析这道选择题。不要编造页码。题目："+String(q.stem||"").slice(0,500)+" 选项："+opts+" 正确答案："+(q.answer||"")+"。背诵手册片段："+(hb||"无")+"。肖1000相关题："+(xq||"无")+"。请输出：1.考点 2.为什么选 3.干扰项/易错点 4.对应手册：必须写出上面给出的PDF页码和关键词，说明怎么记 5.巩固建议。300字以内。").slice(0,1450);
}
function ask(q,hand,rel){const key=q.id+"-hb2";if(cache[key]&&cache[key].text)return Promise.resolve(cache[key].text);return fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","x-access-code":AI_CODE},body:JSON.stringify({mode:"chat",question:promptFor(q,hand,rel),context:{type:"big",promptText:"考研政治错题解析",essayText:"",grade:{score:"",band:"",issues:[],deductions:[]}},history:[]})}).then(r=>r.json().catch(()=>({})).then(d=>{if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d;})).then(d=>{const t=String(d.answer||"").trim();if(!t)throw new Error("AI 没有返回内容");cache[key]={text:t,at:Date.now()};try{localStorage.setItem(CACHE_KEY,JSON.stringify(cache));}catch(e){}return t;});}
function showPage(p){const old=document.querySelector(".pdf-modal");if(old)old.remove();const box=document.createElement("div");box.className="pdf-modal";const src=(p.volKey==="up"?"handbook-up.pdf":"handbook-down.pdf")+"#page="+p.pdfPage+"&toolbar=0";box.innerHTML='<button type="button" aria-label="关闭">×</button><iframe title="背诵手册页面" src="'+src+'"></iframe>';document.body.appendChild(box);box.querySelector("button").onclick=()=>box.remove();box.onclick=e=>{if(e.target===box)box.remove();};}
$("#results").addEventListener("click",e=>{const h=e.target.closest("[data-hb]");if(h){e.preventDefault();const p=(window.HANDBOOK_INDEX||[]).find(x=>x.id===h.dataset.hb);if(p)showPage(p);return;}const x=e.target.closest("[data-xq]");if(x){e.preventDefault();location.href="xiao1000.html?section="+encodeURIComponent(x.dataset.sec)+"&q="+encodeURIComponent(x.dataset.q)+"&back="+encodeURIComponent(location.href);}});
async function run(){
  const sec=paper();if(!sec)return;
  const nums=[...selected].sort((a,b)=>a-b);const qs=nums.map(n=>qFor(sec,n)).filter(Boolean);
  const data=qs.map(q=>({q,hand:topHB(q),rel:topXQ(q)}));
  $("#results").innerHTML=data.map(d=>{const q=d.q;return `<article class="item" data-id="${esc(q.id)}"><div class="top"><span class="pill">第 ${q.num} 题</span><span>${q.type==="multiple"?"多选":"单选"}</span></div><p class="stem">${esc(cut(q.stem,120))}</p><div class="ans">正确答案：${esc(q.answer||"")}</div><div class="related">${hbHTML(d.hand)}${xqHTML(d.rel)}</div><div class="ai">排队中…</div></article>`;}).join("");
  $("#status").textContent=`正在解析 0 / ${qs.length}`;
  for(let i=0;i<data.length;i++){const d=data[i],el=$(`.item[data-id="${d.q.id}"] .ai`);if(el)el.textContent="解析中…";try{const t=await ask(d.q,d.hand,d.rel);if(el)el.textContent=t;}catch(e){if(el)el.textContent="AI 暂时不可用："+(e.message||"网络错误");}$("#status").textContent=`正在解析 ${i+1} / ${data.length}`;}
  $("#status").textContent=`解析完成 · 共 ${data.length} 题`;
}
$("#paper").addEventListener("change",()=>{selected.clear();renderGrid();$("#results").innerHTML="";});
$("#clear").onclick=()=>{selected.clear();renderGrid();$("#results").innerHTML="";};
$("#run").onclick=run;
loadData().then(renderPapers);
</script>
</body>
</html>
