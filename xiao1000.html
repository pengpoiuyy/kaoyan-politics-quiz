生活既充满活力又\n安定有序", "B": "作为最广泛的爱国统一战线组织，有利于最大限度把全体中华儿女的智慧和力量汇聚起来", "C": "作为社会主义协商民主的重要渠道和专门协商机构，有利于促进科学决策、有效施策，提升\n国家治理效能", "D": "作为中国共产党领导的政治组织，有利于完善人民当家作主的制度体系"}, "answer": "BCD"}, {"id": "p3m-74", "num": 74, "type": "multiple", "stem": "习近平指出：“有事好商量，众人的事情由众人商量，找到全社会意愿和要求的最大公约数，是\n人民民主的真谛。”协商民主是实践全过程人民民主的重要形式，是", "options": {"A": "我国社会主义民主政治的特有形式和独特优势", "B": "党的群众路线在政治领域的重要体现", "C": "中国共产党领导人民有效治理国家、保证人民当家作主的重要制度安排", "D": "新时代我国民主政治领域具有重大创新意义的标志性成果"}, "answer": "ABC"}, {"id": "p3m-75", "num": 75, "type": "multiple", "stem": "基层民主是全过程人民民主的重要体现。我国基层民主有多种多样的形式，如以村民委员会为\n组织形态的农村村民自治、以社区居民委员会为组织形态的城市居民自治、以职工代表大会为\n组织依托的企事业单位职工自治等。发展基层民主", "options": {"A": "是实现人民有效政治参与的重要渠道", "B": "是人民当家作主的有效途径", "C": "是社会主义民主最广泛的实践", "D": "彰显了人民当家作主的广泛性、真实性、有效性"}, "answer": "ABCD"}, {"id": "p3m-76", "num": 76, "type": "multiple", "stem": "新时代统战工作取得的最大成果，就是在实践中形成了关于做好新时代党的统一战线工作的重\n要思想，就加强和改进统战工作提出了一系列新理念新思想新战略。必须充分发挥统一战线的\n重要法宝作用。统一战线是", "options": {"A": "中国共产党区别于其他任何政党的显著标志", "B": "党克敌制胜、执政兴国的重要法宝", "C": "团结海内外全体中华儿女实现中华民族伟大复兴的重要法宝", "D": "党的总路线总政策的重要组成部分"}, "answer": "BCD"}, {"id": "p3m-77", "num": 77, "type": "multiple", "stem": "统一战线是我国新民主主义革命的三大法宝之一。新时代，统一战线面临的时和势、肩负的使\n命和任务发生了重大变化，但统一战线仍然是重要法宝，我们要深刻理解发展壮大新时代爱国\n统一战线的重要意义。统一战线", "options": {"A": "在维护国家主权、安全、发展利益上的作用更加重要", "B": "在围绕中心、服务大局上的作用更加重要", "C": "在增强党的阶级基础、扩大党的群众基础上的作用更加重要", "D": "在团结国际社会共同反对霸权主义、单边主义的斗争中的作用更加重要"}, "answer": "ABC"}, {"id": "p3m-78", "num": 78, "type": "multiple", "stem": "民族团结是我国各族人民的生命线，中华民族共同体意识是民族团结之本。对中华民族形成起\n决定作用的是对中华民族共同体的认同，而不是种族、血缘、地域、宗教等因素。只有铸牢中\n华民族共同体意识，才能", "options": {"A": "构建起维护国家统一和民族团结的坚固思想长城", "B": "增进各民族对中华民族的自觉认同，夯实我国民族关系发展的思想基础", "C": "有效应对实现中华民族伟大复兴过程中民族领域可能发生的风险挑战", "D": "为党和国家兴旺发达、长治久安提供重要思想保证\n第九章 全面依法治国(结合第五部分第六章的内容进行复习)"}, "answer": "ABCD"}, {"id": "p3m-79", "num": 79, "type": "multiple", "stem": "法律是治国之重器，法治是国家治理体系和治理能力的重要依托。历史和现实告诉我们，法治\n兴则国兴，法治强则国强。全面依法治国，是", "options": {"A": "完善和发展中国特色社会主义制度的重要方面", "B": "推进国家治理体系和治理能力现代化的重要方面", "C": "坚持和发展中国特色社会主义的本质要求", "D": "坚持和发展中国特色社会主义的重要保障"}, "answer": "ABCD"}, {"id": "p3m-81", "num": 81, "type": "multiple", "stem": "中国特色社会主义法治道路是全面依法治国的唯一正确道路。坚持和拓展中国特色社会主义法\n治道路，必须毫不动摇坚持的原则有", "options": {"A": "坚持中国共产党的领导", "B": "坚持以人民为中心", "C": "坚持法律面前人人平等", "D": "坚持依法治国和以德治国相结合"}, "answer": "ABCD"}, {"id": "p3m-82", "num": 82, "type": "multiple", "stem": "建设法治中国，是全面建设社会主义现代化国家的重要组成部分。加快建设法治中国，必须坚\n持统筹兼顾、把握重点、整体谋划，更加注重系统性、整体性、协同性。法治中国建设的工作\n布局是", "options": {"A": "坚持依法治国、依法执政、依法行政共同推进", "B": "坚持法治国家、法治政府、法治社会一体建设", "C": "坚持科学立法、严格执法、公正司法、全民守法", "D": "坚持统筹推进国内法治和涉外法治\n新思想·多选\n新思想多选\n第十章 建设社会主义文化强国"}, "answer": "ABD"}, {"id": "p3m-83", "num": 83, "type": "multiple", "stem": "文化是一个国家、一个民族的灵魂。国家的富强，民族的振兴，无不伴随着文化的历史性进步。\n国家强大、民族兴盛、社会发展，不仅需要高度发达的物质文明，也需要高度繁荣的精神文明。\n文化繁荣兴盛是", "options": {"A": "实现中华民族伟大复兴的精神支撑", "B": "建设社会主义现代化强国的应有之义", "C": "满足人民日益增长的美好生活需要的内在要求", "D": "在世界文化激荡中站稳脚跟的前提基础"}, "answer": "ABCD"}, {"id": "p3m-84", "num": 84, "type": "multiple", "stem": "中国式现代化是物质文明和精神文明相协调的现代化，全面建成社会主义现代化强国必然要求\n建设社会主义文化强国。文化是", "options": {"A": "统筹推进“五位一体”总体布局、协调推进“四个全面”战略布局的重要内容", "B": "推动高质量发展的重要支点", "C": "满足人民日益增长的美好生活需要的重要因素", "D": "战胜前进道路上各种风险挑战的重要力量源泉"}, "answer": "ABCD"}, {"id": "p3m-85", "num": 85, "type": "multiple", "stem": "2024年8月21日，在外交部发言人主持的例行记者会上，有记者问，中国游戏《黑神话：悟\n空》全球火爆推出，其中的中国文化元素令玩家印象深刻，请问发言人有何评论?外交部发言\n人表示：“我不了解电子游戏，但是感谢你让我关注到这款游戏。从名字看，这款游戏取材于中\n国古典文学名著《西游记》,我想这也反映了中国文化的吸引力。”中华优秀传统文化是", "options": {"A": "我们坚定文化自信的深厚基础", "B": "中华民族的根和魂", "C": "最深厚的文化软实力", "D": "我们在世界文化激荡中站稳脚跟的根基"}, "answer": "ABCD"}, {"id": "p3m-86", "num": 86, "type": "multiple", "stem": "中华文明源远流长、博大精深，是世界上唯一绵延不断且以国家形态发展至今的伟大文明。中\n华文明是", "options": {"A": "中华民族独特的精神标识", "B": "当代中国文化的根基", "C": "维系全世界华人的精神纽带", "D": "中国文化创新的宝藏"}, "answer": "ABCD"}, {"id": "p3m-87", "num": 87, "type": "multiple", "stem": "2025年春节档，《哪吒之魔童闹海》燃爆大银幕。影片自上映以来，屡屡刷新中国影史、世界\n影史多项纪录。2025年是中国电影诞生120周年。《哪吒之魔童闹海》作为全球电影票房排行\n榜前10名中唯一的非好莱坞影片，为中国电影诞生120周年献上了一份沉甸甸的厚礼，也激发\n了中华儿女的民族自豪感和文化自信心。《哪吒之魔童闹海》国际版海报上那句“我偏要踏出一\n条自己的路”,正是今天中国人坚定文化自信的写照。我们坚定文化自信的底气在于", "options": {"A": "中华优秀传统文化是我们坚定文化自信的深厚基础", "B": "党带领人民在伟大斗争中孕育的革命文化和社会主义先进文化是我们坚定文化自信的坚强基石", "C": "中国特色社会主义伟大实践是我们坚定文化自信的现实基础", "D": "全人类共同价值是我们坚定文化自信的价值基础"}, "answer": "ABC"}, {"id": "p3m-88", "num": 88, "type": "multiple", "stem": "中国特色社会主义文化发展道路，是推动社会主义文化繁荣兴盛的唯一正确道路。全面建设社\n会主义现代化国家，必须坚持中国特色社会主义文化发展道路。决定社会主义文化事业前途命\n运的关键是", "options": {"A": "坚持为人民服务", "B": "坚持为社会主义服务", "C": "坚持百花齐放", "D": "坚持百家争鸣"}, "answer": "AB"}, {"id": "p3m-89", "num": 89, "type": "multiple", "stem": "2023年10月7日至8日，全国宣传思想文化工作会议在北京召开。会议的最重要成果是首次\n捉出并阐释习近平文化思想。习近平文化思想", "options": {"A": "既有文化理论观点上的创新和突破，又有文化工作布局上的部署要求", "B": "明确了新时代文化建设的路线图和任务书", "C": "标志着我们党对中国特色社会主义文化建设规律的认识达到了新高度", "D": "表明我们党的历史自信、文化自信达到了新高度"}, "answer": "ABCD"}, {"id": "p3m-90", "num": 90, "type": "multiple", "stem": "核心价值观是一个民族赖以维系的精神纽带，是一个国家共同的思想道德基础。社会主义核心\n价值观", "options": {"A": "体现了社会主义本质要求", "B": "继承了中华优秀传统文化", "C": "吸收了世界文明有益成果", "D": "体现了时代精神"}, "answer": "ABCD"}, {"id": "p3m-91", "num": 91, "type": "multiple", "stem": "海纳百川，有容乃大。文明的繁荣、人类的进步，离不开求同存异、开放包容，离不开文明交流、\n互学互鉴。中华文明自古就以开放包容闻名于世。中华文明具有突出的包容性，从根本上决定了", "options": {"A": "中华民族交往交流交融的历史取向", "B": "中国各宗教信仰多元并存的和谐格局", "C": "中华文化对世界文明兼收并蓄的开放胸怀", "D": "中国不断追求文明交流互鉴而不搞文化霸权"}, "answer": "ABC"}, {"id": "p3m-92", "num": 92, "type": "multiple", "stem": "英国哲学家罗素这样评价中国文化中的和平传统：“中国至高无上的伦理品质中的一些东西，现\n代世界极为需要”,“若能够被世界采纳，地球上肯定比现在有更多的欢乐祥和”。中华文明历来\n崇尚“以和邦国”“和而不同”“以和为贵”,中华民族的血液中没有侵略他人、称王称霸的基\n因。中华文明具有的和平性，从根本上决定了中国", "options": {"A": "始终是世界和平的建设者、全球发展的贡献者、国际秩序的维护者", "B": "不断追求文明交流互鉴而不搞文化霸权", "C": "不会把自己的价值观念与政治体制强加于人", "D": "坚持合作、不搞对抗，决不搞“党同伐异”的小圈子"}, "answer": "ABCD"}, {"id": "p3m-93", "num": 93, "type": "multiple", "stem": "2025年春节档，《哪吒之魔童闹海》燃爆大银幕。影片自上映以来，屡屡刷新中国影史、世界\n影史多项纪录，并成功登顶全球动画电影票房榜首，打破了长期以来好莱坞对全球动画市场的\n垄断。《哪吒之魔童闹海》的导演饺子认为，影片成功的关键在于满足了观众对传统题材现代化\n表达的需求。这启示我们，不断提升中华文化影响力，必须", "options": {"A": "推动中华优秀传统文化创造性转化和创新性发展", "B": "使中华民族最基本的文化基因同当代中国相适应、同现代社会相协调、同现实文化相融通", "C": "把跨越时空、超越国界、富有永恒魅力、具有当代价值的文化精神弘扬起来", "D": "加强国际传播能力建设，全面提升国际传播效能"}, "answer": "ABCD"}, {"id": "p3m-94", "num": 94, "type": "multiple", "stem": "近年来，在免签政策的带动下，越来越多的外国人入境旅游，世界对了解中国、走近中国的兴\n趣与日俱增，中国文化也在出海的过程中越来越自信。比如，“悟空”曾常被译为MonkeyKing,\n而在《黑神话：悟空》游戏中，则直接使用“Wukong”,构建中国话语和中国叙事体系的尝\n试，高扬着文化主体性。然而，在跨文化传播中，有个“文化折扣”的概念。比如，《哪吒之魔\n童闹海》电影中“反抗命运、自我觉醒”的主题引起普遍共鸣，但诸如风火轮、金箍棒等意象，\n也形成天然的理解困境。这从一个侧面说明，融通中外是一项艰巨的任务，也是中国文化走出\n去必须面对的难题。中国文化走出去的实践说明", "options": {"A": "要提高国家文化软实力，就必须使当代中国价值观念走向世界", "B": "面向世界是中国特色社会主义文化建设的根本方向", "C": "讲好中国故事、传播好中国声音，要以我为主、以理服人、以情动人", "D": "一个大国发展兴盛，必然要求文化传播力、文明影响力大幅提升\n第十一章 以保障和改善民生为重点加强社会建设"}, "answer": "ACD"}, {"id": "p3m-96", "num": 96, "type": "multiple", "stem": "习近平指出，以人民为中心是我们党的根本执政理念，让人民生活幸福是“国之大者”。全面建\n设社会主义现代化国家，出发点和落脚点是让人民生活越过越好。要增进民生福祉，扎实推进\n各项民生事业，使改革发展成果更多更公平惠及全体人民。增进民生福祉是", "options": {"A": "坚持立党为公、执政为民的本质要求", "B": "社会主义生产的根本目的", "C": "全面建设社会主义现代化国家的应有之义", "D": "推动高质量发展的战略基点"}, "answer": "ABC"}, {"id": "p3m-97", "num": 97, "type": "multiple", "stem": "党的十八大以来，党中央坚持把就业工作摆在治国理政的突出位置，强化就业优先政策，健全\n就业促进机制，有效应对各种压力挑战，为民生改善和经济发展提供了重要支撑。国家如此重\n视就业，是因为就业是", "options": {"A": "民生改善的“温度计”", "B": "经济发展的“晴雨表”", "C": "劳动者获得收入、提高生活水平的基本途径", "D": "支撑宏观经济和微观经济运行的“基本盘”"}, "answer": "ABCD"}, {"id": "p3m-98", "num": 98, "type": "multiple", "stem": "新时代的10多年，我国建成了世界上规模最大的社会保障体系。2012年到2025年，基本养老\n保险参保人数从7.9亿人增加到10.76亿人，基本医疗保险参保人数从5.4亿人增加到13.31\n亿人，社会保障网越织越密。社会保障", "options": {"A": "是保障和改善民生、维护社会公平、增进人民福祉的基本制度保障", "B": "是促进经济社会发展、实现广大人民群众共享改革发展成果的重要制度安排", "C": "是第三次分配制度的重要组成部分", "D": "发挥着民生保障安全网、收入分配调节器、经济运行减震器的作用"}, "answer": "ABD"}, {"id": "p3m-99", "num": 99, "type": "multiple", "stem": "社会治理是国家治理的重要领域，推进社会治理现代化是推进国家治理体系和治理能力现代化\n的重要内容。新时代加强和创新社会治理，要求坚持", "options": {"A": "系统治理", "B": "依法治理", "C": "综合治理", "D": "源头治理"}, "answer": "ABCD"}, {"id": "p3m-101", "num": 101, "type": "multiple", "stem": "保护自然就是保护人类，建设生态文明就是造福人类。生态文明之所以重要，是因为", "options": {"A": "生态环境变化直接影响文明的兴衰演替", "B": "生态文明是人类文明发展的历史趋势", "C": "生态文明建设是重大经济问题", "D": "生态文明建设是关系党的使命宗旨的重大政治问题、关系民生福祉的重大社会问题"}, "answer": "ABCD"}, {"id": "p3m-102", "num": 102, "type": "multiple", "stem": "山水意象体现了中华先贤对自然的审美和认知，“青山看不厌，流水趣何长”“白云黄鹤自来\n去，绿水青山无古今”等诗句，表达了中国古人对自然的热爱、敬畏与赞美。2002年，习近\n平在福建担任省长时就提出福建要建成中国第一个生态省。到浙江工作后，他于2005年又提\n出“绿水青山就是金山银山”,如今这已成为中国人民的共识。“绿水青山就是金山银山”理\n念之所以成为全国人民的共识，根本就在于这一重要理念", "options": {"A": "以“两个结合”的鲜明特质继承发展了马克思主义生态观、发展观", "B": "深深根植于中华民族深厚的生态文化基因之中", "C": "与时俱进地彰显出时代价值", "D": "巳经成为引领发展的第一动力"}, "answer": "ABC"}, {"id": "p3m-103", "num": 103, "type": "multiple", "stem": "绿水青山就是金山银山理念是立足自身国情和发展实践形成的中国自主生态文明建设理论，符\n合人类社会发展规律和生态文明建设规律，在实践中展现出强大的真理力量和独特的思想魅\n力。绿水青山就是金山银山理念", "options": {"A": "创新和突破了现代环境经济理论", "B": "推进和拓展了中国式现代化道路", "C": "传承和发展了中华优秀传统生态文化", "D": "推动和创造了人类文明新形态"}, "answer": "ABCD"}, {"id": "p3m-104", "num": 104, "type": "multiple", "stem": "党的十八大以来，我们把生态文明建设作为关系中华民族永续发展的根本大计，开展了一系列\n开创性工作，决心之大、力度之大、成效之大前所未有，生态文明建设从理论到实践都发生了\n历史性、转折性、全局性变化，美丽中国建设迈出重大步伐。我们实现", "options": {"A": "由重点整治到系统治理的重大转变", "B": "由被动应对到主动作为的重大转变", "C": "由全球环境治理参与者到引领者的重大转变", "D": "由实践探索到科学理论指导的重大转变"}, "answer": "ABCD"}, {"id": "p3m-105", "num": 105, "type": "multiple", "stem": "新时代我国生态文明建设的重大成就表现在", "options": {"A": "生态文明建设战略地位更加凸显", "B": "生态文明制度体系更加健全", "C": "污染防治和生态保护更加有力", "D": "生态环境保护结构性、根源性、趋势性压力得到根本缓解\n第十三章 维护和塑造国家安全"}, "answer": "ABC"}, {"id": "p3m-107", "num": 107, "type": "multiple", "stem": "统筹发展和安全，是党和国家的一项基础性工作，是我们党治国理政的一个重大原则。之所以\n要统筹发展和安全，是因为发展和安全是两件大事，是一体之两翼、驱动之双轮，必须同步推\n进。以下说法正确的有", "options": {"A": "发展解决的是动力问题，是推动国家和民族赓续绵延的根本支撑", "B": "安全解决的是保障问题，是确保国家和民族行稳致远的坚强柱石", "C": "发展具有基础性、根本性，是解决安全问题的总钥匙，发展就是最大的安全", "D": "安全是发展的条件和保障，没有国家安全，发展取得的成果也可能毁于一旦"}, "answer": "ABCD"}, {"id": "p3m-110", "num": 110, "type": "multiple", "stem": "政治安全与人民安全、国家利益至上是有机统一的。以下说法正确的有", "options": {"A": "政治安全是维护人民安全和国家利益的根本保证", "B": "人民安全居于中心地位", "C": "国家利益至上是实现政治安全和人民安全的要求和原则", "D": "要把三者统一起来，确保实现党的长期执政、人民安居乐业、国家长治久安"}, "answer": "ABCD"}, {"id": "p3m-115", "num": 115, "type": "multiple", "stem": "“一国两制”立足中国国情，把原则性和灵活性、现实性和长远性、一致性和差异性统一起\n来，凝结了中国共产党人为解决国家统一问题展现出的超凡勇气和卓越智慧，是前无古人的伟\n大创举。“一国两制”", "options": {"A": "是中国特色社会主义制度创新的重要成果", "B": "是中国共产党领导人民实现祖国和平统一的伟大构想", "C": "包含了中华文化中的和合理念", "D": "为国际社会解决类似问题提供了新思路、新方案\n第十四章 建设巩固国防和强大人民军队\n111.习近平指出：“我们捍卫和平、维护安全、慑止战争的手段和选择有多种多样，但军事手段始\n112.进入新时代，以习近平同志为核心的党中央着眼实现中华民族伟大复兴这个国家和民族最高利\n113.中华民族实现伟大复兴，中国人民实现更加美好生活，必须加快把人民军队建设成为世界一流\n114.90多年来，人民军队之所以能够始终保持强大的凝聚力、向心力、战斗力，经受住各种考验，\n第十五章 坚持“一国两制”和推进祖国完全统一\n终是保底手段。”只有以强大军事实力为后盾\n益，对人民军队使命任务作出新定位、提出新要求，概括起来就是\n军队。新时代加强军队建设的聚焦点和着力点是\n不断从胜利走向胜利，最根本的就是靠党的坚强领导。实践证明，听党指挥是"}, "answer": "ABCD"}, {"id": "p3m-116", "num": 116, "type": "multiple", "stem": "“一国两制”构想获得了有关各方的一致认可，实现了港澳平稳过渡、和平回归，洗刷了民族\n百年耻辱，完成了实现祖国完全统一的重要一步。“一国两制”伟大构想体现了", "options": {"A": "中国共产党的政治智慧和开拓创新的勇气", "B": "中华民族追求统一、反对分裂、爱好和平的精神特质", "C": "中国特色社会主义制度的先进性质", "D": "尊重差异、求同存异的思维方式"}, "answer": "ABCD"}, {"id": "p3m-117", "num": 117, "type": "multiple", "stem": "“一国两制”是党领导人民实现祖国和平统一的一项重要制度，是国家的一项基本国策。“一\n国两制”的根本宗旨是", "options": {"A": "维护国家主权、安全、发展利益", "B": "保持香港、澳门长期繁荣稳定", "C": "维护台海和平稳定", "D": "增强中华儿女对伟大祖国的认同感"}, "answer": "AB"}, {"id": "p3m-118", "num": 118, "type": "multiple", "stem": "“一国两制”方针是一个完整的体系。关于“一国”和“两制”的关系，以下说法正确的有", "options": {"A": "“一国”是实行“两制”的前提和基础", "B": "“两制”从属和派生于“一国”,并统一于“一国”之内", "C": "“一国”是根，根深才能叶茂；“一国”是本，本固才能枝荣", "D": "“一国”之内的“两制”等量齐观、比肩并列"}, "answer": "ABC"}, {"id": "p3m-119", "num": 119, "type": "multiple", "stem": "准确把握“一国两制”的科学内涵，必须坚持中央全面管治权和保障特别行政区高度自治权相\n统一。我国是单一制国家，中央对包括香港、澳门特别行政区在内的所有地方行政区域拥有全\n面管治权。全面管治权与高度自治权在本质上是统一的。以下说法正确的有", "options": {"A": "全面管治权是授权特别行政区高度自治的前提和基础", "B": "高度自治权是中央行使全面管治权的体现", "C": "它们之间是源与流、本与末的关系", "D": "特别行政区不存在所谓“剩余权力”"}, "answer": "ABCD"}, {"id": "p3m-121", "num": 121, "type": "multiple", "stem": "民族复兴、国家统一是大势所趋、大义所在、民心所向。以下说法正确的有", "options": {"A": "中华文明具有突出的统一性，国家统一永远是中国核心利益的核心", "B": "台湾问题因民族弱乱而产生，必将随着民族复兴而解决", "C": "实现祖国完全统一是不可阻挡的历史潮流", "D": "在中华民族的发展进程中，追求统一、反对分裂始终是全民族的主流价值观"}, "answer": "ABCD"}, {"id": "p3m-122", "num": 122, "type": "multiple", "stem": ",坚持走和平发展道路，是我们党根据时代发展潮流和我国根本利益作出的战略抉择。走和平发\n展道路", "options": {"A": "是由中国共产党性质宗旨和我国社会主义制度决定的", "B": "是基于中国历史文化传统作出的必然选择", "C": "是新时代对外工作的总目标", "D": "符合历史潮流、顺应世界大势\n第十六章 中国特色大国外交和推动构建人类命运共同体\n新思想-多选\n新思想·分析"}, "answer": "ABD"}, {"id": "p3m-123", "num": 123, "type": "multiple", "stem": "构建人类命运共同体，就是为了造福各国人民，促进世界和平，实现共同繁荣和发展。共建\n“一带一路”", "options": {"A": "是对中国与世界实现开放共赢路径的顶层设计", "B": "是推动构建人类命运共同体的实践平台", "C": "根植历史、更面向未来，源于中国、更属于世界", "D": "追求的是发展，崇尚的是共赢，传递的是希望\n第十七章 全面从严治党"}, "answer": "ABCD"}, {"id": "p3m-124", "num": 124, "type": "multiple", "stem": "党要管党、从严治党，是党的建设的一贯要求和根本方针。全面从严治党是", "options": {"A": "党永葆生机活力、走好新的赶考之路的必由之路", "B": "新时代党的建设的鲜明主题", "C": "党的政治建设的首要任务", "D": "新时代党的自我革命的伟大实践"}, "answer": "ABD"}, {"id": "p3m-125", "num": 125, "type": "multiple", "stem": "全面从严治党是一项管党治党的系统工程，客观上需要一个布局合理、内容科学、要素齐备、\n统一高效的全面从严治党体系。要落实新时代党的建设总要求，把全的要求、严的基调、治的\n理念落实到全面从严治党全过程，坚持", "options": {"A": "内容上全涵盖", "B": "对象上全覆盖", "C": "责任上全链条", "D": "制度上全贯通"}, "answer": "ABCD"}, {"id": "p3m-126", "num": 126, "type": "multiple", "stem": "党的政治建设是党的根本性建设。党的政治建设的首要任务是", "options": {"A": "保证全党服从中央", "B": "时刻保持解决大党独有难题的清醒和坚定", "C": "维护党中央权威和集中统一领导", "D": "以伟大自我革命引领伟大社会革命"}, "answer": "AC"}, {"id": "p3m-127", "num": 127, "type": "multiple", "stem": "习近平在谈到作风建设时，曾引用泰山挑山工不敢在“快活三里”久留的故事。“快活三里”\n是泰山半腰的一段平路，游客喜欢在此歇脚，挑山工却不敢停留太久，因为他们知道休息时间\n长了，腿就会“发懒”,再上“十八盘”就更困难了。习近平引用这个故事，旨在告诫广大党\n员干部", "options": {"A": "要警惕承平日久环境下追求安逸享乐而意志消沉", "B": "作风建设永远在路上，不能有歇歇脚、松口气的念头", "C": "作风建设必须一鼓作气，不能打持久战", "D": "必须始终保持艰苦奋斗、负重前行的精神状态"}, "answer": "ABD"}]}, {"id": "p4s", "title": "第四部分 史纲 · 单选", "part": 4, "type": "single", "questions": [{"id": "p4s-1", "num": 1, "type": "single", "stem": "鸦片战争以后，由于西方列强入侵和封建统治腐败，中国逐步成为半殖民地半封建社会，国家蒙\n辱、人民蒙难、文明蒙尘，中华民族遭受了前所未有的劫难。所谓半殖民地，是相对于\n①完全的封建社会而言的\n②完全的殖民地而言的\n③独立国家而言的\n④资本主义国家而言的", "options": {"A": "①③", "B": "②③", "C": "①④", "D": "②④"}, "answer": "B"}, {"id": "p4s-2", "num": 2, "type": "single", "stem": "从鸦片战争开始，到1949年中华人民共和国成立前，中国都属于半殖民地半封建社会。半殖民\n地半封建社会性质，决定了近代中国社会矛盾呈现错综复杂的状况。在诸多社会矛盾中，贯穿中\n国半殖民地半封建社会的始终，并对近代中国社会的发展变化起着决定性作用的矛盾是\n①帝国主义和中华民族的矛盾\n②工人阶级和资产阶级的矛盾\n③封建主义和人民大众的矛盾\n④各帝国主义国家在中国争夺的矛盾", "options": {"A": "①②", "B": "②③", "C": "①③", "D": "③④"}, "answer": "C"}, {"id": "p4s-4", "num": 4, "type": "single", "stem": "清朝政府同外国侵略者签订的第一个不平等条约是", "options": {"A": "《南京条约》", "B": "《北京条约》", "C": "《天津条约》", "D": "《马关条约》"}, "answer": "A"}, {"id": "p4s-5", "num": 5, "type": "single", "stem": "中国沦为半殖民地半封建社会的过程中，最早出现的一个新的社会阶级是", "options": {"A": "官僚买办资产阶级", "B": "民族资产阶级", "C": "工人阶级", "D": "资产阶级"}, "answer": "C"}, {"id": "p4s-6", "num": 6, "type": "single", "stem": "孙中山在谈到义和团运动的时候曾经说过，义和团“用大刀、肉体和联军相搏，虽然被联军打死\n了几万人，伤亡枕藉，还是前仆后继，其勇锐之气殊不可当，真是令人惊奇佩服。所以经过那次\n血战之后，外国人才知道中国还有民族思想，这种民族是不可消灭的”。孙中山的这段话告诉我\n们一个不容抹杀的基本的历史事实，即义和团运动", "options": {"A": "扭转了中国在对抗帝国主义侵略中的被动局面", "B": "阻止了中国的半殖民地化进程", "C": "在粉碎帝国主义列强瓜分中国的斗争中发挥了重大的历史作用", "D": "有力地打击了外国侵略势力，成为了中国旧式农民战争的最高峰"}, "answer": "C"}, {"id": "p4s-7", "num": 7, "type": "single", "stem": "从鸦片战争开始，外国资本-帝国主义不断入侵中国。但是，帝国主义列强始终不能灭亡和瓜分\n中国。帝国主义列强不能灭亡和瓜分近代中国的根本原因是", "options": {"A": "帝国主义列强之间的矛盾", "B": "晚清政府的军事抵抗", "C": "中华民族进行的不屈不挠的反侵略斗争", "D": "中国资产阶级开始登上历史舞台"}, "answer": "C"}, {"id": "p4s-8", "num": 8, "type": "single", "stem": "近代以来中华民族面临着争得民族独立、人民解放和实现国家富强、人民幸福两大历史任务。无\n数的志士仁人，一代又一代的中国人，为此进行了不屈不挠、英勇顽强的斗争。近代以来的历史\n表明，要争得民族独立和人民解放，必须首先", "options": {"A": "发展民族工商业", "B": "集中力量进行现代化建设", "C": "学习外国先进的军事和科学技术", "D": "进行反帝反封建的民主革命"}, "answer": "D"}, {"id": "p4s-9", "num": 9, "type": "single", "stem": "帝国主义列强掀起瓜分中国的狂潮是在", "options": {"A": "中日甲午战争爆发后", "B": "第一次鸦片战争爆发后", "C": "八国联军侵华战争爆发后", "D": "第二次鸦片战争爆发后"}, "answer": "A"}, {"id": "p4s-10", "num": 10, "type": "single", "stem": "资本-帝国主义侵略、压迫中国人民的过程，同时也是中国人民反抗它们的侵略、压迫的过程。\n中国近代史上中国人民第一次大规模的反侵略武装斗争是", "options": {"A": "三元里人民的抗英斗争", "B": "太平天国的抗击洋枪队斗争", "C": "台湾高山族人民的抗日斗争", "D": "义和团的抗击八国联军斗争"}, "answer": "A"}, {"id": "p4s-11", "num": 11, "type": "single", "stem": "从1840年至1919年的80年间，中国人民对外来侵略进行了英勇顽强的反抗。但历次的反侵略\n战争，都是以中国失败、中国政府被迫签订丧权辱国的条约而告结束的。近代中国反侵略战争\n屡遭失败的最重要的原因是", "options": {"A": "社会制度腐败", "B": "军事战略错误", "C": "经济技术落后", "D": "思想观念保守"}, "answer": "A"}, {"id": "p4s-12", "num": 12, "type": "single", "stem": "帝国主义的侵略给中华民族带来了巨大的灾难。但是，列强发动的侵华战争以及中国反侵略战\n争的失败，从反面教育了中国人民，极大地促进了中国人的思考、探索和奋起。以下属于中日\n甲午战争爆发后提出的口号的是", "options": {"A": "“师夷长技以制夷”", "B": "“睁眼看世界”", "C": "“振兴中华”", "D": "“自强”“求富”"}, "answer": "C"}, {"id": "p4s-13", "num": 13, "type": "single", "stem": "甲午战争后，严复翻译的《天演论》所宣传的重要思想是", "options": {"A": "“师夷长技以制夷”", "B": "“中学为体，西学为用”", "C": "“物竞天择，适者生存”", "D": "“天下兴亡，匹夫有责”"}, "answer": "C"}, {"id": "p4s-14", "num": 14, "type": "single", "stem": "《天朝田亩制度》是太平天国定都天京后颁布的最能体现太平天国社会理想和这次农民起义特\n色的纲领性文件；《资政新篇》是太平天国后期颁布的社会发展方案。二者的共同点在于", "options": {"A": "都主张向西方学习先进的制度", "B": "都主张在中国发展资本主义", "C": "都在实践中得到贯彻", "D": "都具有反封建的进步性"}, "answer": "D"}, {"id": "p4s-16", "num": 16, "type": "single", "stem": "洋务派继承了魏源“师夷长技以制夷”的思想，提出“自强”“求富”的主张，通过所掌握的\n因家权力集中力量优先发展", "options": {"A": "官办企业", "B": "民用企业", "C": "军事工业", "D": "邮政铁路"}, "answer": "C"}, {"id": "p4s-17", "num": 17, "type": "single", "stem": "洋务派所标榜的洋务运动的目标是", "options": {"A": "“自强”“求富”", "B": "“师夷长技以制夷”", "C": "“中学为体，西学为用”", "D": "“振兴中华”\n第二章 不同社会力量对国家出路的早期探索"}, "answer": "A"}, {"id": "p4s-18", "num": 18, "type": "single", "stem": "洋务运动期间，洋务派兴办的民用企业中，采取官督商办方式的企业基本上是", "options": {"A": "买办官僚性质的", "B": "封建主义性质的", "C": "半封建半殖民地性质的", "D": "资本主义性质的"}, "answer": "D"}, {"id": "p4s-19", "num": 19, "type": "single", "stem": "中国近代教育开始于", "options": {"A": "洋务运动时期", "B": "戊戌维新运动时期", "C": "辛亥革命时期", "D": "新文化运动时期"}, "answer": "A"}, {"id": "p4s-20", "num": 20, "type": "single", "stem": "甲午战争一役，洋务派经营多年的北洋海军全军覆没，标志着以“自强”“求富”为目标的洋\n务运动的失败。决定洋务运动必然失败命运的原因是", "options": {"A": "洋务运动具有封建性", "B": "洋务运动对列强具有依赖性", "C": "洋务企业的管理具有腐朽性", "D": "资产阶级维新派的强烈反对"}, "answer": "A"}, {"id": "p4s-21", "num": 21, "type": "single", "stem": "近代中国资产阶级思想与封建主义思想的第一次正面交锋是", "options": {"A": "“师夷长技以制夷”主张的提出", "B": "洋务派与顽固派的论战", "C": "维新派与守旧派的论战", "D": "新文化运动倡导者对以孔子为代表的“往圣先贤”的猛烈抨击"}, "answer": "C"}, {"id": "p4s-22", "num": 22, "type": "single", "stem": "在维新派与守旧派之间的激烈论战中，守旧派认为“民权之说，无一益而有百害”,“民权之说\n一倡，愚民必喜，乱民必作，纪纲不行，大乱四起。”维新派则运用西方资产阶级政治学说，对\n封建君主专制制度作了批判。谭嗣同指出：“君末也；民本也。”严复甚至认为，国家是“民之公\n产”,王侯将相不过是“通国之公仆隶”,而专制帝王则是“窃国者耳”。这说明维新派主张", "options": {"A": "只有“兴民权改民主”,才是中国的唯一出路", "B": "推翻帝制，实行共和", "C": "进行社会革命", "D": "兴民权、设议院，实行君主立宪"}, "answer": "D"}, {"id": "p4s-23", "num": 23, "type": "single", "stem": "甲午战争后，维新运动迅速兴起。针对洋务派提出的“中体西用”的方针，维新派指出，体与\n用是不可分的。中学有中学的“体”与“用”,西学有西学的“体”与“用”,把中学之“体”\n与西学之“用”凑在一起，就如同让“牛体”产生“马用”一样荒谬。维新派与洋务派分歧的\n实质是", "options": {"A": "要不要进行社会革命", "B": "要不要以革命手段推翻清王朝", "C": "要不要在中国兴办近代企业", "D": "要不要学习西方的政治制度与思想文化"}, "answer": "D"}, {"id": "p4s-24", "num": 24, "type": "single", "stem": "洋务运动是在19世纪60年代初第二次鸦片战争结束后，在清政府镇压太平天国起义与捻军起\n义的过程中兴起的。维新运动发生于19世纪90年代。维新运动与洋务运动的主要不同点在于", "options": {"A": "洋务运动只学习西方技术，维新运动主张学习西方政治制度", "B": "洋务运动依靠封建统治阶级中的部分成员，维新运动依靠下层群众", "C": "洋务运动维护封建统治，维新运动否定封建主义", "D": "洋务运动实现了预期目标，维新运动昙花一现\n第三章 辛亥革命与君主专制制度的终结"}, "answer": "A"}, {"id": "p4s-25", "num": 25, "type": "single", "stem": "清政府于1901年宣布实行“新政”以后，又于1906年宣布“预备仿行宪政”,并于1908年颁\n布了《钦定宪法大纲》,制定了预备立宪期为9年的君主立宪方案。清政府改革的根本目的在于", "options": {"A": "延续清王朝的反动统治", "B": "发展资本主义", "C": "缓和阶级矛盾", "D": "挽救民族危机\n史纲-单选"}, "answer": "A"}, {"id": "p4s-26", "num": 26, "type": "single", "stem": "1905年8月20日，孙中山和黄兴、宋教仁等人在日本东京成立中国同盟会。同盟会以《民报》\n为机关报、并确定了革命纲领。同盟会的成立，标志着", "options": {"A": "关于革命与改良的辩论以革命派的胜利而告结束", "B": "孙中山组建的第一个革命团体的诞生", "C": "中国人民在精神上由被动变为主动，中国革命的面貌焕然一新", "D": "中国资产阶级民主革命进入了一个新的阶段"}, "answer": "D"}, {"id": "p4s-29", "num": 29, "type": "single", "stem": "1905年11月，在同盟会机关报《民报》发刊词中，孙中山将同盟会的纲领概括为三大主义，\n即民族主义、民权主义、民生主义，后被称为三民主义。其中民生主义指的是“平均地权”,所\n采用的方法是", "options": {"A": "征收地价税和土地增价归公", "B": "将土地所有权分给农民", "C": "废除封建土地所有制，但保留资产阶级的土地", "D": "核定全国土地，按照“耕者有其田”的原则平分给农民"}, "answer": "A"}, {"id": "p4s-31", "num": 31, "type": "single", "stem": "1956年，毛泽东在《纪念孙中山先生》一文中指出：“纪念伟大的革命先行者孙中山先生!纪\n念他在中国民主革命准备时期，以鲜明的中国革命民主派立场，同中国改良派作了尖锐的斗争。\n他在这一场斗争中是中国革命民主派的旗帜。”1905年至1907年间资产阶级革命派和改良派论\n战的焦点是", "options": {"A": "要不要以革命手段推翻清王朝", "B": "要不要推翻帝制，实行共和", "C": "要不要反对外国帝国主义列强的侵略", "D": "要不要进行社会革命"}, "answer": "A"}, {"id": "p4s-32", "num": 32, "type": "single", "stem": "中国资产阶级革命派与改良派的根本不同之处在于，资产阶级革命派\n①在踏上革命道路之时就高举起民主革命的旗帜\n②始终重视广泛动员人民群众的力量\n③最先制定了明确的反帝反封建的革命纲领\n④选择了以武装起义推翻清王朝统治的斗争方式", "options": {"A": "①②", "B": "②③", "C": "③④", "D": "①④"}, "answer": "D"}, {"id": "p4s-33", "num": 33, "type": "single", "stem": "1840年鸦片战争以后，西方列强在中华大地上恣意妄为，封建统治者孱弱无能，中国逐步成为\n半殖民地半封建社会，国家蒙辱、人民蒙难、文明蒙尘，中国人民和中华民族遭受了前所未有\n的劫难。英雄的中国人民始终没有屈服，在救亡图存的道路上一次次抗争、一次次求索，展现\n了不畏强暴、自强不息的顽强意志。其中，拉开了近代以来中国发生的深刻社会变革序幕的事\n件是", "options": {"A": "新文化运动", "B": "五四运动", "C": "中国共产党成立", "D": "辛亥革命"}, "answer": "D"}, {"id": "p4s-34", "num": 34, "type": "single", "stem": "毛泽东说过，“民国元年的《中华民国临时约法》,在那个时期是一个比较好的东西；当然，是\n不完全的、有缺点的”。这里之所以说《中华民国临时约法》“在那个时期是一个比较好的东\n西”,是因为它", "options": {"A": "以根本大法的形式否定了封建土地所有制", "B": "带有革命性、民主性", "C": "是中国近代历史上第一个比较系统的发展资本主义的方案", "D": "明确拒绝承认清政府与列强所订的一切不平等条约"}, "answer": "B"}, {"id": "p4s-35", "num": 35, "type": "single", "stem": "“无量头颅无量血，可怜购得假共和”,这是辛亥革命亲历者的血泪之作。辛亥革命“只把一个\n皇帝赶跑”,中国仍旧在帝国主义和封建主义的压迫之下，反帝反封建的革命任务并没有完成。\n辛亥革命之所以失败，从根本上说，是因为", "options": {"A": "中国民族资产阶级的软弱性和妥协性", "B": "没有提出彻底的反帝反封建的革命纲领", "C": "没有坚强的革命政党作为团结一切革命力量的强有力的核心", "D": "在帝国主义时代，在半殖民地半封建的中国，资本主义的建国方案行不通"}, "answer": "C"}, {"id": "p4s-37", "num": 37, "type": "single", "stem": "袁世凯窃夺辛亥革命的果实之后，建立了代表大地主和买办资产阶级利益的北洋军阀反动政权。\n袁世凯当权时，北洋政府统治下的中国在形式上是统一的。在1916年袁世凯称帝败亡之后，中\n国陷入了军阀割据的局面。这种局面的形成有其深刻的原因，主要是\n①中国主要是地方性的农业经济而没有形成统一的资本主义市场\n②帝国主义国家在中国采取划分势力范围的分裂剥削政策\n③尊孔复古思潮与民主共和思想反复拉锯造成了文化上的混乱\n④民族矛盾超过阶级矛盾成为当时中国社会的主要矛盾", "options": {"A": "①②", "B": "①③", "C": "②④", "D": "③④\n第四章 中国共产党成立和中国革命新局面"}, "answer": "A"}, {"id": "p4s-38", "num": 38, "type": "single", "stem": "新文化运动的倡导者猛烈抨击以孔子为代表的“往圣先贤”,大力提倡新道德、反对旧道德，提\n倡新文学、反对旧文学，包括提倡白话文、反对文言文。新文化运动的倡导者批判孔学，是\n为了", "options": {"A": "给中国发展资本主义扫清障碍", "B": "促进马克思主义在中国的传播及其同中国工人运动的结合", "C": "否定中国的全部传统文化", "D": "推翻清政府这个“洋人的朝廷”"}, "answer": "A"}, {"id": "p4s-39", "num": 39, "type": "single", "stem": "新文化运动的倡导者猛烈抨击以孔子为代表的“往圣先贤”。通过批判孔学，动摇了封建正统思\n想的统治地位，在中国社会掀起一股思想解放的潮流。五四前新文化运动的侣导者所使用的主\n要武器是\n①马克思主义的民主与科学理论\n②个性解放思想\n③中华优秀传统文化的民本思想\n④进化论观点", "options": {"A": "①②", "B": "②③", "C": "③④", "D": "②④"}, "answer": "D"}, {"id": "p4s-40", "num": 40, "type": "single", "stem": "1919年5月爆发的五四运动，是中国近代史上一个划时代的事件。关于五四运动，以下说法正\n确的是", "options": {"A": "改变了中国半殖民地半封建社会的性质，中国革命从此进入新民主主义革命时期", "B": "工人阶级开始代替资产阶级成了资产阶级民主革命的主力军", "C": "促进了新思想的传播，为新文化运动的兴起准备了理论基础", "D": "表现了反帝反封建的彻底性"}, "answer": "D"}, {"id": "p4s-41", "num": 41, "type": "single", "stem": "1919年5月爆发的五四运动，是中国近代史上的一个划时代的事件。这场运动中提出了“改造\n强盗世界，不认秘密外交，实行民族自决”和“另起炉灶，组织新政府”这样的口号。这表明", "options": {"A": "中国人民对帝国主义的认识进到了理性的认识阶段", "B": "五四运动是一次真正的群众运动", "C": "以学生为主体的中国青年是近代中国最革命的阶级", "D": "中国人民的民族意识开始普遍觉醒"}, "answer": "A"}, {"id": "p4s-42", "num": 42, "type": "single", "stem": "从1860年到1937年，不到100年的时间里，中国首都三次被外敌攻陷，中国人民身处“覆屋\n之下、漏舟之中、薪火之上”。民族危机激发了中华民族的觉醒，增强了中华民族的凝聚力。实\n现了中国人民和中华民族自鸦片战争以来第一次全面觉醒的历史事件是", "options": {"A": "辛亥革命", "B": "甲午战争", "C": "维新运动", "D": "五四运动"}, "answer": "D"}, {"id": "p4s-43", "num": 43, "type": "single", "stem": "五四运动是中国近现代史上具有划时代意义的一个重大事件，以磅礴之力鼓动了中国人民和中\n华民族实现民族复兴的志向和信心。五四运动孕育了五四精神，五四精神的核心是", "options": {"A": "民主和科学", "B": "追求真理", "C": "追求进步", "D": "爱国主义"}, "answer": "D"}, {"id": "p4s-44", "num": 44, "type": "single", "stem": "十月革命发生在其国情与中国相同或近似的俄国，因而对中国的先进分子具有特殊吸引力。青\n年毛泽东说，“我看俄国式的革命，是无可如何的山穷水尽诸路皆走不通了的一个变计”,“只此\n方法较之别的改造方法所含可能的性质为多”。十月革命发生时的俄国国情与中国“相同或近\n似”是指\n①半殖民地半封建的社会性质\n②“三座大山”阻碍了社会进步和发展\n③封建压迫严重\n④经济文化落后", "options": {"A": "①②", "B": "①④", "C": "②④", "D": "③④"}, "answer": "B"}, {"id": "p4s-47", "num": 47, "type": "single", "stem": "在中国早期马克思主义者的队伍中，李大钊是代表人物。1919年8月，李大钊在《再论问题与\n主义》一文中指出：“一个社会主义者，为使他的主义在世界上发生一些影响，必须要研究怎么\n可以把他的理想尽量应用于环绕着他的实境。”在《我的马克思主义观》一文中，他一方面肯定\n马克思主义是“世界改造原动的学说”,具有普遍意义；另一方面又指出，“马氏的学说，实在\n是一个时代的产物”,我们不可以不考虑我们的环境“就那样整个拿来，应用于我们生存的社\n会”。这说明，中国早期马克思主义者", "options": {"A": "开始认识到必须把改造国民性置于优先地位", "B": "已在实际上初步形成了马克思主义应当与中国具体实际相结合的思想", "C": "仍然在马克思主义与社会民主主义等流派中进行反复比较", "D": "明确提出马克思主义时代化的任务"}, "answer": "B"}, {"id": "p4s-48", "num": 48, "type": "single", "stem": "近代以后中国人民的反帝反封建斗争之所以屡遭挫折和失败，最重要的原因就是", "options": {"A": "没能够充分地发动群众", "B": "中国人民的民族意识没有普遍觉醒", "C": "没有先进的坚强的政党作为凝聚力量的领导核心", "D": "没有把阶级矛盾当作中国社会最主要的矛盾"}, "answer": "C"}, {"id": "p4s-49", "num": 49, "type": "single", "stem": "中共一大确定党的名称为“中国共产党”。大会通过了中国共产党第一个纲领，明确“革命军队\n必须与无产阶级一起推翻资本家阶级的政权”,“承认无产阶级专政，直到阶级斗争结束”,“消\n灭资本家私有制”,以及联合第三国际。大会在讨论实际工作计划时，决定首先", "options": {"A": "集中精力研究和宣传马克思主义", "B": "集中精力组织农民", "C": "集中精力组织工人", "D": "集中精力介绍俄国“十月革命”"}, "answer": "C"}, {"id": "p4s-50", "num": 50, "type": "single", "stem": "在1922年召开的中共二大上，中国共产党第一次明确提出了", "options": {"A": "新民主主义革命总路线", "B": "无产阶级领导权", "C": "土地革命的总路线", "D": "反帝反封建的民主革命纲领"}, "answer": "D"}, {"id": "p4s-51", "num": 51, "type": "single", "stem": "在新民主主义革命时期，中国共产党与国民党实行过两次合作，第一次是建立国民革命联合战\n线，第二次是建立抗日民族统一战线。以下选项中正确反映第一次国共合作的是", "options": {"A": "广泛的民族性和复杂的阶级矛盾", "B": "国共双方有政权有军队的合作", "C": "合作双方采取党外合作的组织形式", "D": "合作双方具有共同的政治基础"}, "answer": "D"}, {"id": "p4s-53", "num": 53, "type": "single", "stem": "1924年1月，中国国民党第一次全国代表大会在广州召开，大会通过的宜言对三民主义作出了\n新的解释。新三民主义成为第一次国共合作的政治基础，究其原因，是由于新三民主义的政纲", "options": {"A": "把民生主义概括为“平均地权”", "B": "把斗争的矛头直接指向北洋军阀", "C": "体现了联俄、联共、扶助农工三大革命政策", "D": "同中国共产党在民主革命阶段的纲领基本一致"}, "answer": "D"}, {"id": "p4s-54", "num": 54, "type": "single", "stem": "1924年国共合作的形成，加快了中国革命前进的步伐，1925年出现了全国范围的大革命高潮。\n掀起这一大革命高潮的起点是", "options": {"A": "五卅运动", "B": "省港大罢工", "C": "国民政府在广州建立", "D": "北伐战争开始"}, "answer": "A"}, {"id": "p4s-56", "num": 56, "type": "single", "stem": "1924年国共合作的形成，加快了中国革命前进的步伐。1926年7月，以推翻北洋军阀统治为目\n标的北伐战争开始。1927年3月，国民革命军占领南京。1927年4月12日，蒋介石在上海发\n动反共政变，同年7月15日，汪精卫在武汉召开“分共”会议，并在其辖区内对共产党员和革\n命群众实行搜捕和屠杀，国共合作全面破裂，大革命最终失败。所谓大革命的失败，主要是指", "options": {"A": "北洋军阀的统治没有被推翻", "B": "反帝反封建的革命任务没有完成", "C": "国共合作全面破裂", "D": "工人农民运动转入低潮\n第五章 中国革命的新道路"}, "answer": "B"}, {"id": "p4s-57", "num": 57, "type": "single", "stem": "1928年12月29日张学良从东北发出通告，宣布“遵守三民主义，服从国民政府，改易旗帜”。\n北洋军阀不再作为独立的政治力量继续存在，国民党在全国范围内建立了自己的统治。国民党\n政府的统治同北洋军阀的统治没有本质的区别，这是因为", "options": {"A": "国民党所实行的是代表地主阶级、买办性大资产阶级利益的一党专政和军事独裁统治", "B": "国民党所实行的是代表民族资产阶级利益的一党专政和军事独裁统治", "C": "国民党反动集团内部派系林立，外部则与地方实力派之间矛盾重重、冲突不断", "D": "国民党只是在形式上暂时地统一了中国"}, "answer": "A"}, {"id": "p4s-58", "num": 58, "type": "single", "stem": "在大革命失败的危急关头，中共八七会议确定的方针是", "options": {"A": "推翻北洋军阀黑暗统治", "B": "开辟农村革命根据地", "C": "土地革命和武装起义", "D": "建立工农民主统一战线"}, "answer": "C"}, {"id": "p4s-59", "num": 59, "type": "single", "stem": "土地革命战争时期，党从残酷的现实中认识到，没有革命的武装就无法战胜武装的反革命，就\n无法夺取中国革命胜利，就无法改变中国人民和中华民族的命运，必须以武装的革命反对武装\n的反革命。党领导举行了南昌起义、秋收起义、广州起义和其他许多地区起义。其中，秋收起\n义不同于南昌起义的特点有\n①以攻占敌人控制比较薄弱的农村为目标\n②公开打出了“工农革命军”的旗帜\n③是中国共产党独立领导的革命战争\n④不仅是军队的行动，而且有数量众多的工农武装参加", "options": {"A": "①②", "B": "①③", "C": "②④", "D": "③④"}, "answer": "C"}, {"id": "p4s-61", "num": 61, "type": "single", "stem": "在新民主主义革命时期，对中国革命具有决定意义的新起点是", "options": {"A": "从领导工人运动转向武装斗争", "B": "从进攻大城市转为向农村进军", "C": "从工农武装割据转为建立全国性政权", "D": "从游击战争转向正面战场"}, "answer": "B"}, {"id": "p4s-62", "num": 62, "type": "single", "stem": "1927年9月9日，毛泽东等领导的湘赣边界秋收起义爆发。起义军公开打出了“工农革命军”\n的旗帜，在攻打中心城市长沙受挫后，毛泽东果断改变计划，决定向敌人控制比较薄弱的农村\n转移。9月29日，毛泽东领导起义军在江西永新县三湾村进行了著名的三湾改编，确立了", "options": {"A": "土地革命的方针", "B": "支部建在连上的原则", "C": "民主集中制原则", "D": "思想建党、政治建军原则"}, "answer": "B"}, {"id": "p4s-63", "num": 63, "type": "single", "stem": "1929年12月，红四军党的第九次代表大会在福建上杭县古田村召开(史称古田会议)。大会通\n过了毛泽东起草的古田会议决议。古田会议决议是中国共产党和红军建设的纲领性文献，是党\n和人民军队建设史上的重要里程碑。古田会议创造性地解决了在农村环境中、在党组织和军队\n以农民为主要成分的条件下\n①如何保持党的无产阶级先锋队性质的重大问题\n②如何建设党领导的新型人民军队的重大问题\n③如何建设革命根据地的重大问题\n④如何找到新的革命道路的重大问题", "options": {"A": "②③", "B": "①②④", "C": "①②", "D": "②③④"}, "answer": "C"}, {"id": "p4s-64", "num": 64, "type": "single", "stem": "在大革命失败、白色恐怖极其严重的条件下，中国革命之所以能够得到坚持和发展，根本原因\n就在于中国共产党", "options": {"A": "紧紧地依靠农民，领导农民进行了土地制度的革命", "B": "吸取了大革命失败的教训，进行了武装起义", "C": "建立了国民革命联合战线，扩大了革命队伍", "D": "确立了思想建党、政治建军原则"}, "answer": "A"}, {"id": "p4s-67", "num": 67, "type": "single", "stem": "1934年10月，中共中央、中革军委率中央红军主力等8.6万余人踏上战略转移的漫漫征程，\n开始了世界历史上前所未有的壮举——长征。中央红军进行长征的直接原因是\n①民族矛盾已经上升为主要矛盾\n②停止内战，北上抗日\n③红军在第五次反“围剿”作战中遭到失败④红军已无在原地扭转战局的可能", "options": {"A": "①②", "B": "①③", "C": "②③", "D": "③④"}, "answer": "D"}, {"id": "p4s-68", "num": 68, "type": "single", "stem": "中国共产党的100年，是矢志践行初心使命的100年，是筚路蓝缕奠基立业的100年，是创造\n辉煌开辟未来的100年。开启了中国共产党独立自主解决中国革命实际问题的新阶段的会议是", "options": {"A": "八七会议", "B": "遵义会议", "C": "瓦窑堡会议", "D": "党的六届六中全会"}, "answer": "B"}, {"id": "p4s-69", "num": 69, "type": "single", "stem": "中国共产党在长征途中召开的遵义会议，集中解决了在当时具有决定意义的", "options": {"A": "军事向题和组织问题", "B": "政治问题和路线问题", "C": "战略问题和战术问题", "D": "思想问题和作风问题"}, "answer": "A"}, {"id": "p4s-70", "num": 70, "type": "single", "stem": "红军长征到达陕北后，毛泽东、党中央用很大精力总结历史经验，加强共产党自身的思想理论\n建设。以毛泽东为主要代表的中共中央所进行的理论工作，对党的政治路线、军事路线和思想\n路线作了系统阐述，在理论上武装了全党，为即将到来的全民族抗日战争从思想上、政治上和\n组织上奠定了坚实基础。毛泽东系统地说明党的政治策略上的诸问题的著作是", "options": {"A": "《中国革命战争的战略问题》", "B": "《论反对日本帝国主义的策略》", "C": "《论持久战》", "D": "《中国革命和中国共产党》\n第六章 中华民族的抗日战争"}, "answer": "B"}, {"id": "p4s-71", "num": 71, "type": "single", "stem": "1931年9月18日，日本发动九一八事变，武装侵占中国东北。中国人民在九一八事变后开始\n的局部抗日战争", "options": {"A": "揭开了世界反法西斯战争的序幕", "B": "宣告了抗日民族统一战线的形成", "C": "开始了中国抗战的战略防御阶段", "D": "标志着全民族抗战的开始"}, "answer": "A"}, {"id": "p4s-72", "num": 72, "type": "single", "stem": "华北事变发生后，中国共产党组织领导的一二·九运动标志着", "options": {"A": "中国人民局部抗日战争的开始", "B": "中国人民抗日救亡运动新高潮的到来", "C": "中国抗日民族统一战线的形成", "D": "中国抗日战争进入全民族抗战的新时期"}, "answer": "B"}, {"id": "p4s-73", "num": 73, "type": "single", "stem": "1935年，电影《风云儿女》一公映，主题歌《义勇军进行曲》便成为时代的最强音。歌曲发出\n了中华民族不甘沦亡的怒吼，吹响了中华儿女万众一心、血战到底的战斗号角。《义勇军进行\n曲》之所以发出“中华民族到了最危险的时候”的呐喊，最重要的原因是", "options": {"A": "国民党政府长期奉行“攘外必先安内”方针，对日本的大举侵略一再退让", "B": "国际联盟和英美等国政府采取对日姑息、纵容的政策", "C": "日本大举侵华，妄图把中国变为其独占的殖民地", "D": "中国长期缺乏有力的国际援助"}, "answer": "C"}, {"id": "p4s-74", "num": 74, "type": "single", "stem": "1935年12月，中共中央在陕北瓦窑堡召开政治局扩大会议，提出党的基本策略任务是", "options": {"A": "建立广泛的抗日民族统一战线", "B": "在根据地实行减租减息的土地政策", "C": "在敌后广泛开展游击战和运动战", "D": "保持党在思想上、政治上和组织上的独立性"}, "answer": "A"}, {"id": "p4s-75", "num": 75, "type": "single", "stem": "1936年12月初，蒋介石到达西安，逼迫张学良、杨虎城攻打陕甘的红军。12月12日凌晨，张\n学良、杨虎城在屡次劝谏无效的情况下，发动了西安事变。事变后，张、杨联合发表通电，提\n出了改组南京政府、停止一切内战、开放民众爱国运动等八项抗日主张。中国共产党从民族大\n义出发，确定促成事变和平解决的基本方针，并派周恩来等到西安，参加谈判，迫使蒋介石作\n出“停止剿共，联红抗日”的承诺。西安事变的和平解决", "options": {"A": "标志着中国进入全民族抗战阶段", "B": "成为中国人民抗日战争的起点", "C": "标志着抗日民族统一战线的正式形成", "D": "成为时局转换的枢纽，国内和平初步实现"}, "answer": "D"}, {"id": "p4s-78", "num": 78, "type": "single", "stem": "中国抗日战争进入全民族抗战阶段是在", "options": {"A": "九一八事变后", "B": "一·二八事变后", "C": "华北事变后", "D": "卢沟桥事变后"}, "answer": "D"}, {"id": "p4s-81", "num": 81, "type": "single", "stem": "“三三制”民主政权是共产党领导的抗日民族统一战线性质的政权，是一切赞成抗日又赞成民\n主的人们的政权，是几个革命阶级联合起来对于汉奸和反动派的民主专政。“三三制”是指抗\n日民主政府在工作人员分配上实行“三三制”原则，即共产党员、党外进步人士和中间派各占\n1/3。以下属于“三三制”原则中所说的中间派的是", "options": {"A": "小资产阶级", "B": "农民阶级", "C": "开明绅士", "D": "地方实力派"}, "answer": "C"}, {"id": "p4s-82", "num": 82, "type": "single", "stem": "抗日战争时期，为克服根据地面临的严重困难局面，毛泽东提出的经济工作和财政工作总方\n针是", "options": {"A": "“自己动手，丰衣足食”", "B": "“发展经济，保障供给”", "C": "“减租减息”", "D": "“精兵简政”"}, "answer": "B"}, {"id": "p4s-83", "num": 83, "type": "single", "stem": "1941年5月，毛泽东作了《改造我们的学习》的报告，整风运动首先在党的高级干部中进行。\n1942年2月，毛泽东先后作了《整顿党的作风》和《反对党八股》的讲演，整风运动在全党范\n围普遍展开。整风运动最主要的任务是", "options": {"A": "反对“左”倾机会主义，端正党的政治路线", "B": "反对宗派主义以整顿党风", "C": "反对主观主义以整顿学风", "D": "反对党八股以整顿文风"}, "answer": "C"}, {"id": "p4s-84", "num": 84, "type": "single", "stem": ",党的七大在党的历史上具有重要里程碑意义，标志着我们党在政治上、思想上、组织上走向了\n成熟。“在政治上”的成熟是指", "options": {"A": "党形成了一支高举毛泽东旗帜的久经考验的政治家集团", "B": "党确立了毛泽东思想在全党的指导地位，把毛泽东思想写入了党章", "C": "为党后来不断从胜利走向胜利指明了正确方向、开辟了正确道路", "D": "全党团结在毛泽东的旗帜下，实现了党的空前统一和团结"}, "answer": "D"}, {"id": "p4s-85", "num": 85, "type": "single", "stem": "中国人民的抗日战争从1931年开始，到1945年结束，前后经历了14年的浴血奋战。在世界反\n法西斯战争的进程中，中国人民的抗日战争被称为“最早的抗争，最后的胜利”。成为抗日战争\n取得完全胜利的重要标志的是", "options": {"A": "中国参加联合国制宪会议，成为联合国的创始国和五个常任理事国之一", "B": "日本天皇裕仁发布《终战诏书》,日本无条件投降", "C": "日本代表在东京湾美军军舰密苏里号上签署向同盟国的投降书", "D": "台湾以及澎湖列岛重归中国主权管轴"}, "answer": "D"}, {"id": "p4s-86", "num": 86, "type": "single", "stem": "1945年10月25日，中国政府宣告“恢复对台湾行使主权”,并在台北举行“中国战区台湾省\n受降仪式”。此前，国际上已经有了一系列具有国际法律效力的文件，从法律上确认台湾是中国\n领土的一部分。这些具有国际法律效力的文件有\n①《开罗宜言》\n②《波茨坦公告》\n③《日本投降书》\n④《雅尔塔协定》", "options": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④"}, "answer": "A"}, {"id": "p4s-88", "num": 88, "type": "single", "stem": "中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点是", "options": {"A": "红军长征的胜利", "B": "抗日战争的胜利", "C": "解放战争的胜利", "D": "抗美援朝战争的胜利\n第七章 为建立新中国而奋斗"}, "answer": "B"}, {"id": "p4s-89", "num": 89, "type": "single", "stem": "1945年8月25日，中共中央在《对目前时局的宣言》中明确提出的口号是", "options": {"A": "巩固国内和平，实现民主改革", "B": "和平、民主、团结", "C": "打倒蒋介石，解放全中国", "D": "独立、自由、和平"}, "answer": "B"}, {"id": "p4s-90", "num": 90, "type": "single", "stem": "1945年10月10日，重庆谈判双方签署《政府与中共代表会谈纪要》,即双十协定，确认和平\n建国的基本方针，同意“长期合作，坚决避免内战”。1946年1月10日，政治协商会议在重庆\n开幕。会议通过了政府组织案等五项协议。政协会议闭幕的第二天，中共中央发出党内指示，\n要求全党准备为坚决实现政协协议而奋斗。同时提出，必须提高警惕，注意“阵地的保持与继\n续取得”,做好进行自卫战争的准备，并指出，目前解放区的中心工作是", "options": {"A": "放手发动群众，壮大人民力量", "B": "进行土地改革", "C": "发展生产，保障供给", "D": "练兵、减租与生产"}, "answer": "D"}, {"id": "p4s-91", "num": 91, "type": "single", "stem": "1947年6月底，根据中共中央的决策和部署，刘伯承、邓小平率领的晋冀鲁豫野战军主力，实\n施中央突破，千里跃进大别山。随后，陈毅、粟裕指挥的华东野战军主力为东路，挺进苏鲁豫\n皖地区。陈赓、谢富治指挥的晋冀鲁豫野战军一部为西路，挺进豫西。三路大军相互策应，机\n动歼敌，这标志着", "options": {"A": "蒋介石20年反革命统治由发展到消灭的转折点", "B": "人民解放军在数量上已经超过国民党军队", "C": "100多年来帝国主义在中国的统治由发展到消灭的转折点", "D": "人民解放战争战略进攻的序幕由此揭开"}, "answer": "D"}, {"id": "p4s-92", "num": 92, "type": "single", "stem": "1947年12月，中共中央在陕北米脂县杨家沟召开会议，制定了夺取全国胜利的行动纲领。毛\n泽东指出，中国革命已经发展到了一个历史的转折点，这是", "options": {"A": "中国革命重心从农村转向城市的标志", "B": "中国共产党和中国革命事业从挫折走向胜利的伟大转折", "C": "中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点", "D": "100多年来帝国主义在中国的统治由发展到消灭的转折点"}, "answer": "D"}, {"id": "p4s-93", "num": 93, "type": "single", "stem": "中国各民主党派从成立的时候起，大多同中国共产党建立了不同程度的合作关系，并在斗争实\n践中逐步发展了这种关系。这是因为", "options": {"A": "中国各民主党派形成时的社会基础与中国共产党的社会基础是一致的", "B": "中国各民主党派的政纲同中国共产党的新民主主义革命政纲基本上一致", "C": "中国各民主党派的建国方案同中国共产党的建国方案大体相同", "D": "中国各民主党派同中国共产党一起都参加了大革命时期的斗争，有合作的基础"}, "answer": "B"}, {"id": "p4s-94", "num": 94, "type": "single", "stem": "1948年1月，沈钧儒先生在香港主持召开民盟一届三中全会。会议通过了新的政治纲领和宣\n言，公开宣布同中国共产党携手合作，为彻底摧毁国民党反动政府，实现民主、和平、独立、\n统一的新中国而奋斗。沈钧儒在会议中指出，“民盟在国共两党之间不能保持中立了，中间道路\n也行不通”,要“与共产党实行密切的合作”。民盟一届三中全会是民盟的一个重大历史转折点，\n它抛弃了“中间路线”,坚定地选择了中国共产党、新民主主义，为民盟之后参加新政协、参与\n新政权奠定了思想和组织基础。“中间道路也行不通”是因为", "options": {"A": "中国在抗日战争胜利后面临的是两种命运、两个前途的尖锐斗争", "B": "鼓吹“中间路线”的人所提倡的方案实际上与国民党所实行的是一致的", "C": "抗战胜利改变了中国半殖民地半封建的社会性质，中国人民的民族意识普遍觉醒", "D": "帝国主义势力空前强大，正在集中力量干涉中国革命"}, "answer": "A"}, {"id": "p4s-95", "num": 95, "type": "single", "stem": "1949年1月22日，李济深、沈钧儒等民主党派的领导人和著名的无党派民主人士55人联合发\n表《对时局的意见》,一致认定中共提出的关于召开政治协商会议、成立联合政府的主张“符合\n于全国人民大众的要求”,恳切表示“愿在中共领导下，献其绵薄，共策进行，以期中国人民民\n主革命之迅速成功，独立、自由、和平、幸福的新中国之早日实现”。1949年春，毛泽东在同\n有关人士谈话时提出，民主党派应“积极参政，共同建设新中国”,这", "options": {"A": "揭开了中国共产党同各党派、各团体、各族各界人士协商建国的序幕", "B": "奠定了中国共产党领导的多党合作和政治协商制度的基础", "C": "标志着民主党派地位的根本变化", "D": "表明中国各民主党派和无党派民主人士公开自愿接受中国共产党的领导"}, "answer": "C"}, {"id": "p4s-97", "num": 97, "type": "single", "stem": "中国革命的发生和胜利不是偶然的，而是有着深刻的社会根源和雄厚的群众基础。由于帝国主\n义、封建主义、官僚资本主义的残酷压迫，中国人民走上了反帝、反封建、反官僚资本主义斗\n争的伟大道路。在中国革命过程中，曾经被人称作“开万国未有之奇”的一种现象是", "options": {"A": "工人阶级成为革命的领导力量", "B": "农民、城市小资产阶级群众是革命的主要力量", "C": "封建势力同外国侵略势力相勾结", "D": "随着斗争的发展，民族资产阶级也逐步向共产党靠拢"}, "answer": "D"}, {"id": "p4s-98", "num": 98, "type": "single", "stem": "中国革命的胜利、结束了100多年来中华民族遭受资本-帝国主义侵略和中国各族人民遭受\n资本一帝国主义同封建统治阶级联合压迫与剥削的历史，结束了国家战乱频仍、四分五裂的局\n面。中国革命之所以能够走上胜利发展的道路，从根本上说，是由于有了", "options": {"A": "一支人民的军队", "B": "广泛的统一战线", "C": "一条正确的革命道路", "D": "中国共产党的领导"}, "answer": "D"}, {"id": "p4s-99", "num": 99, "type": "single", "stem": "“作风建设永远在路上”。在波澜壮阔的历史进程中，中国共产党始终十分重视党的作风建设。\n在中共七届二中全会上，毛泽东强调必须保持的党的作风是", "options": {"A": "理论和实践相结合的作风", "B": "谦虚、谨慎、不骄、不躁和艰苦奋斗的作风", "C": "和人民群众紧密地联系在一起的作风", "D": "自我批评的作风"}, "answer": "B"}, {"id": "p4s-101", "num": 101, "type": "single", "stem": "《论人民民主专政》是毛泽东在中国新民主主义革命取得决定性胜利、全国性政权即将建立的\n时刻，为纪念中国共产党成立28周年而撰写的文章。文章论述了即将成立的中华人民共和国\n的国家性质，各阶级在国家中的地位及其相互关系，国家对内、对外政策等。《论人民民主专\n政》这篇文章\n①奠定了新中国国家政权的理论基础和一定发展阶段上的政策基础\n②为即将成立的新中国作了政治理论准备\n③与中共七届二中全会的决议一起构成了《中国人民政治协商会议共同纲领》的基础\n④是中国共产党人开始探索适合中国国情的社会主义建设道路的标志", "options": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④\n第八章 中华人民共和国的成立与中国社会主义建设道路的探索"}, "answer": "A"}, {"id": "p4s-102", "num": 102, "type": "single", "stem": "新民主主义社会不是一个独立的社会形态，而是由新民主主义转变到社会主义的过渡性的社会\n形态。新民主主义社会存在着五种经济成分，其中，属于过渡形式的经济成分的是", "options": {"A": "国营经济和合作社经济", "B": "私人资本主义经济和国家资本主义经济", "C": "合作社经济和国家资本主义经济", "D": "个体经济和合作社经济"}, "answer": "C"}, {"id": "p4s-110", "num": 110, "type": "single", "stem": "对资本主义工商业的社会主义改造经历了三个步骤。第一步，主要实行初级形式的国家资本主\n义，国家在私营工业中实行委托加工、计划订货、统购包销，企业利润的分配方式为“四马分\n肥”,这", "options": {"A": "是社会主义成分同资本主义成分在企业内部的合作", "B": "使得企业的生产和经营开始纳入国家计划的轨道", "C": "改变了工人在企业中的地位，使企业具有了半社会主义性质", "D": "限制了资本主义的剥削，企业的生产关系已经发生了根本的变化"}, "answer": "B"}, {"id": "p4s-111", "num": 111, "type": "single", "stem": "我国对资本主义工商业的社会主义改造，采取了从低级到高级的国家资本主义的过渡形式。其\n中第二步主要实行个别企业的公私合营，这些企业", "options": {"A": "仍然是资本主义性质的企业", "B": "是具有了社会主义因素的企业", "C": "是半社会主义性质的企业", "D": "是社会主义国营性质的企业"}, "answer": "C"}, {"id": "p4s-112", "num": 112, "type": "single", "stem": "1954年9月15日，第一届全国人民代表大会第一次会议顺利开幕。9月28日，会议在完成预\n定的议程后胜利闭幕。这次会议是我国人民民主建设的重要里程碑，标志着新中国", "options": {"A": "人民民主专政制度的确立", "B": "根本政治制度的正式确立", "C": "新型政党制度的正式确立", "D": "国家结构形式的正式确立"}, "answer": "B"}, {"id": "p4s-113", "num": 113, "type": "single", "stem": "制定一部切实可行的发展国民经济的中期计划，是完成过渡时期总路线规定的工业化主体任务\n的重要步骤。为准备进行有计划的经济建设，我国从1951年着手编制第一个五年计划。1955\n年7月召开的一届全国人大二次会议通过了这个计划。“一五”计划确定的经济建设指导方针\n突出的核心要点是集中主要力量", "options": {"A": "发展重工业，建立国家工业化和国防现代化的初步基础", "B": "发展交通运输业、轻工业、农业和商业，相应地培养建设人才", "C": "保证国民经济中社会主义成分的比重稳步增长", "D": "保证在发展生产的基础上逐步提高人民的物质生活和文化生活的水平"}, "answer": "A"}, {"id": "p4s-114", "num": 114, "type": "single", "stem": "中国进入社会主义社会的最主要的标志是", "options": {"A": "社会主义经济制度的确立", "B": "中华人民共和国的成立", "C": "党在过渡时期总路线的提出", "D": "国民经济第一个五年计划的实施"}, "answer": "A"}, {"id": "p4s-115", "num": 115, "type": "single", "stem": "以毛泽东为主要代表的中国共产党人开始探索适合中国国情的社会主义建设道路的标志是", "options": {"A": "《论十大关系》的报告", "B": "中共八大路线的制定", "C": "《关于正确处理人民内部矛盾的问题》的发表", "D": "国民经济第一个五年计划的实施"}, "answer": "A"}, {"id": "p4s-116", "num": 116, "type": "single", "stem": "1957年2月，毛泽东作了《关于正确处理人民内部矛盾的问题》的报告，阐明社会主义社会\n的重大理论问题。毛泽东提出，必须区分社会主义社会两类不同性质的社会矛盾，把正确处理\n人民内部矛盾作为国家政治生活的主题。解决人民内部矛盾用民主的方法，说服教育的方法。\n对于物质利益、分配方面的人民内部矛盾，毛泽东提出的方针是", "options": {"A": "统筹兼顾、适当安排", "B": "“惩前毖后、治病救人”", "C": "“长期共存、互相监督”", "D": "“团结—批评—团结”"}, "answer": "A"}, {"id": "p4s-117", "num": 117, "type": "single", "stem": "1956年社会主义改造基本完成以后，中国进入社会主义初级阶段。社会主义初级阶段在发展\n过程中会呈现不同的阶段性特征。1956年召开的中共八大指出，社会主义基本制度在我国已\n经基本上建立起来了，我国国内的主要矛盾是", "options": {"A": "无产阶级和资产阶级的矛盾", "B": "人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾", "C": "人民日益增长的物质文化需要同落后的社会生产之间的矛盾", "D": "人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾"}, "answer": "B"}, {"id": "p4s-118", "num": 118, "type": "single", "stem": "1956年9月15日至27日，中国共产党第八次全国代表大会在北京举行。中共八大正确分析\n了国内形势和主要矛盾的变化，明确提出新形势下党和人民的主要任务。大会宣布，社会主义\n制度在我国已经基本上建立起来，国内主要矛盾已经是人民对于经济文化迅速发展的需要同当\n前经济文化不能满足人民需要的状况之间的矛盾；还有阶级斗争，还要加强人民民主专政，但\n根本任务已经是", "options": {"A": "实现马克思主义同中国具体实际的“第二次结合”", "B": "在新的生产关系下保护和发展生产力", "C": "正确处理人民内部矛盾", "D": "探索什么是社会主义，怎样建设社会主义"}, "answer": "B"}, {"id": "p4s-120", "num": 120, "type": "single", "stem": "1956年9月15日至27日，中国共产党第八次全国代表大会在北京举行。中共八大正确分析\n了国内形势和主要矛盾的变化，明确提出新形势下党和人民的主要任务。大会肯定“三个主\n体，三个补充”思想，即以国家经营和集体经营、计划生产、国家市场三者为主体，以个体经\n营、自由生产、自由市场三者为补充。这", "options": {"A": "在理论上完全突破了苏联计划经济模式", "B": "为克服苏联模式弊端提供了重要启示", "C": "初步形成了社会主义市场经济体制", "D": "对过渡时期总路线的提出具有重要意义\n第九章 改革开放与中国特色社会主义的开创和发展"}, "answer": "B"}, {"id": "p4s-121", "num": 121, "type": "single", "stem": "1978年5月10日，中央党校内部刊物《理论动态》刊登《实践是检验真理的唯一标准》一\n文。第二天，《光明日报》以特约评论员名义公开发表这篇文章，新华社向全国转发。文章发\n表后产生强烈反响，引发了关于真理标准问题的大讨论。这场深刻而广泛的马克思主义思想解\n放运动", "options": {"A": "成为正本清源、拨乱反正和改革开放的思想先导", "B": "重新确立了实事求是的思想路线", "C": "是解放思想、开辟新时期新道路的宣言书", "D": "标志着党在指导思想上的拨乱反正胜利完成"}, "answer": "A"}, {"id": "p4s-123", "num": 123, "type": "single", "stem": "1979年3月30日，邓小平在党的理论工作务虚会上发表《坚持四项基本原则》的讲话。他指\n出：坚持社会主义道路，坚持人民民主专政，坚持共产党的领导，坚持马克思列宁主义、毛泽\n东思想这四项基本原则，“是实现四个现代化的根本前提”。“如果动摇了这四项基本原则中的\n任何一项，那就动摇了整个社会主义事业，整个现代化建设事业。”他还提出一个重要思想：\n“现在搞建设，也要适合中国情况，走出一条中国式的现代化道路。”这表明", "options": {"A": "中国共产党所领导的改革开放从一开始就具有明确的社会主义方向", "B": "中国式现代化只能基于自身国情，不能借鉴他国经验", "C": "“中国特色社会主义”从此成为我们党的全部理论和实践创新的主题", "D": "马克思主义同中国实际“第二次结合”任务的正式提出"}, "answer": "A"}, {"id": "p4s-124", "num": 124, "type": "single", "stem": "从1979年11月起，在邓小平主持下，中共中央着手起草《关于建国以来党的若干历史问题的\n决议》。邓小平对《决议》的起草提出了指导原则，其中，最核心的一条是", "options": {"A": "对建国30年来历史上的大事，要进行实事求是的分析", "B": "宜粗不宜细，总结过去是为了引导大家团结一致向前看", "C": "确立毛泽东同志的历史地位，坚持和发展毛泽东思想", "D": "走自己的路，开辟中国特色社会主义道路"}, "answer": "C"}, {"id": "p4s-125", "num": 125, "type": "single", "stem": "《关于建国以来党的若干历史问题的决议》对于新时期我国社会主要矛盾作出正确判断，指出\n社会主义改造基本完成以后，我国所要解决的主要矛盾是", "options": {"A": "人民日益增长的物质文化需要同落后的社会生产之间的矛盾", "B": "人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾", "C": "人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾", "D": "人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾"}, "answer": "A"}, {"id": "p4s-127", "num": 127, "type": "single", "stem": "为了实现中华民族伟大复兴，中国共产党团结带领中国人民，创造了新民主主义革命的伟大成\n就、社会主义革命和建设的伟大成就、改革开放和社会主义现代化建设的伟大成就、新时代中\n国特色社会主义的伟大成就。其中，为实现中华民族伟大复兴提供了更为完善的制度保证、更\n为坚实的物质基础、更为主动的精神力量的是", "options": {"A": "新民主主义革命的伟大成就", "B": "社会主义革命和建设的伟大成就", "C": "改革开放和社会主义现代化建设的伟大成就", "D": "新时代中国特色社会主义的伟大成就"}, "answer": "D"}, {"id": "p4s-128", "num": 128, "type": "single", "stem": "党的十九大报告提出新时代党的建设总要求，提出要全面推进党的政治建设、思想建设、组织\n建设、作风建设、纪律建设，其中摆在首位的是", "options": {"A": "政治建设", "B": "思想建设", "C": "组织建设", "D": "作风建设"}, "answer": "A"}, {"id": "p4s-129", "num": 129, "type": "single", "stem": "2025年是“十四五”规划收官之年。科学制定和接续实施五年规划，是我们党治国理政一条\n重要经验，也是中国特色社会主义一个重要政治优势。从“一五”到“十四五”,一以贯之的\n主题是", "options": {"A": "不断提高人民生活水平", "B": "不断壮大我国综合国力", "C": "不断推进中华民族伟大复兴", "D": "把我国建设成为社会主义现代化国家"}, "answer": "D"}]}, {"id": "p4m", "title": "第四部分 史纲 · 多选", "part": 4, "type": "multiple", "questions": [{"id": "p4m-1", "num": 1, "type": "multiple", "stem": "鸦片战争是中国近代史的起点。鸦片战争之所以成为中国近代史的起点，是因为鸦片战争之后，\n随着外国资本主义的入侵", "options": {"A": "中国的封建社会逐步成为半殖民地半封建社会", "B": "中国人民逐渐开始了反帝反封建的资产阶级民主革命", "C": "中国人民对帝国主义的认识进到理性的阶段", "D": "中国工人阶级开始以独立的姿态登上历史舞台"}, "answer": "ABD"}, {"id": "p4m-2", "num": 2, "type": "multiple", "stem": "近代以来中华民族面临的两大历史任务，就是争得民族独立、人民解放和实现国家富强、人民幸\n福。关于两大历史任务，以下说法正确的是", "options": {"A": "两大历史任务的内容与实现方式都不一样", "B": "前一个任务为后一个任务创造必要的前提", "C": "后一个任务是前一个任务的最终目的和必然要求", "D": "两大历史任务分别由辛亥革命和新民主主义革命实现\n第一章 进入近代后中华民族的磨难与抗争"}, "answer": "ABD"}, {"id": "p4m-3", "num": 3, "type": "multiple", "stem": "资本-帝国主义列强对中国的侵略，首先和主要的是进行军事侵略。此外，还对中国实行政治控\n制、经济掠夺和文化渗透。为了统治中国，资本-帝国主义列强在政治上采取的主要方式有", "options": {"A": "控制中国的内政、外交", "B": "镇压中国人民的反抗", "C": "控制中国的通商口岸", "D": "扶植、收买代理人"}, "answer": "ABD"}, {"id": "p4m-4", "num": 4, "type": "multiple", "stem": "电影《南京照相馆》导演、编剧申奥在《人民日报》发表题为《让历史真相不被掩盖和遗忘》\n的文章，他提到：侵华日军在中国发起的不仅是一场热战，更是一场舆论战、文化战。电影中，\n孙中山先生题字的牌匾被肆意涂抹，井上大佐的办公室摆满抢夺来的古玩字画⋯⋯这些都捣示了\n列强文化侵略的意图。鸦片战争以后，资本-帝国主义列强在对中国实行军事侵略、政治控制、\n经济掠夺的同时，还对中国进行文化渗透。其进行文化渗透的目的是", "options": {"A": "宣扬殖民主义奴化思想", "B": "麻醉中国人民的精神", "C": "摧毁中国人的民族自尊心和自信心", "D": "镇压中国人民的反抗"}, "answer": "ABC"}, {"id": "p4m-5", "num": 5, "type": "multiple", "stem": "19世纪70至80年代，帝国主义列强从侵占中国周边邻国发展到蚕食中国边疆地区，使中国陷入\n“边疆危机”。“边疆危机”的主要表现有", "options": {"A": "英国从印度侵入西藏，从缅甸入侵云南", "B": "法国从越南侵犯广西", "C": "俄国从中亚入侵新疆", "D": "日本吞并琉球、侵犯中国台湾"}, "answer": "ABCD"}, {"id": "p4m-6", "num": 6, "type": "multiple", "stem": "受到鸦片战争失败的强烈刺激，中国官吏和知识分子中少数爱国的有识之士，开始注意了解国际\n形势，研究外国史地，总结失败教训，寻找救国的道路和御敌的方法。郑观应在所著《盛世危\n言》中提出了一系列具有重要的思想启蒙意义的主张，主要有", "options": {"A": "大力发展民族工商业", "B": "同西方国家进行“商战”", "C": "设立议院", "D": "实行共和制度"}, "answer": "ABC"}, {"id": "p4m-7", "num": 7, "type": "multiple", "stem": "19世纪70年代以后，王韬、薛福成、马建忠、郑观应等人不仅主张学习西方的科学技术，同时\n也要求吸纳西方的政治、经济学说。他们的共同特点是具有", "options": {"A": "比较强烈的反对外国侵略的爱国思想", "B": "追求中国独立富强的爱国思想", "C": "追求实行民主共和制度的思想", "D": "一定程度反对封建专制的民主思想"}, "answer": "ABD"}, {"id": "p4m-8", "num": 8, "type": "multiple", "stem": "130多年前爆发的中日甲午战争是中国近代史上的一个重要时间节点。甲午战争中国战败的影响有", "options": {"A": "中国开始陷入“边疆危机”", "B": "中国人开始有了普遍的民族意识的觉醒", "C": "帝国主义列强对中国的争夺和瓜分达到高潮", "D": "标志着以“自强”“求富”为目标的洋务运动的失败"}, "answer": "BCD"}, {"id": "p4m-9", "num": 9, "type": "multiple", "stem": "鸦片战争以后，中国还只是少数人有朦胧的民族觉醒意识。中日甲午战争以后，中国人才开始有\n了普遍的民族意识的觉醒。甲午战争促成中国人民的民族意识开始普遍觉醒的主要原因在于", "options": {"A": "甲午战败和《马关条约》的签订给中国造成了深重的民族灾难", "B": "中国的惨败彻底打破了中国传统的夷夏观念", "C": "甲午战争以后，先进的中国人开始睁眼看世界了", "D": "传统的“天朝上国”的优越感已经荡然无存\n第二章 不同社会力量对国家出路的早期探索"}, "answer": "ABD"}, {"id": "p4m-10", "num": 10, "type": "multiple", "stem": "《天朝田亩制度》是最能体现太平天国社会理想和这次农民起义特色的纲领性文件。《资政新\n篇》是太平天国后期颁布的社会发展方案。《资政新篇》", "options": {"A": "提出了一个以解决土地问题为中心的比较完整的社会改革方案", "B": "体现了太平天国起义具有不同于以往农民战争的新的历史特点", "C": "足中国近代历史上第一个比较系统的发展资本主义的方案", "D": "反映了太平天国某些领导人在后期试图通过向外国学习来寻求出路的一种努力"}, "answer": "BCD"}, {"id": "p4m-11", "num": 11, "type": "multiple", "stem": "在半殖民地半封建的中国，太平天国农民起义及其失败表明", "options": {"A": "农民具有伟大的苹命潜力", "B": "农民自身不能担负起领导反帝反封建斗争取得胜利的重任", "C": "单纯的农民战争不可能完成争取民族独立和人民解放的历史任务", "D": "单纯的农民战争对反帝反封建斗争是没有意义的"}, "answer": "ABC"}, {"id": "p4m-12", "num": 12, "type": "multiple", "stem": "19世纪60—90年代，洋务派举办的洋务事业归纳起来主要有", "options": {"A": "兴办近代企业", "B": "建立新式海陆军", "C": "创办新式学堂，派遣留学生", "D": "颁布商法商律，奖励工商"}, "answer": "ABC"}, {"id": "p4m-13", "num": 13, "type": "multiple", "stem": "洋务运动失败的原因主要是", "options": {"A": "洋务运动具有封建性", "B": "洋务运动对列强具有依赖性", "C": "洋务企业的管理具有腐朽性", "D": "洋务运动的指导思想具有激进性"}, "answer": "ABC"}, {"id": "p4m-14", "num": 14, "type": "multiple", "stem": "洋务运动是在19世纪60年代初第二次鸦片战争结束后，在清政府镇压太平天国起义与捻军起\n义的过程中兴起的。洋务运动历时30多年，虽然因北洋海军在甲午战争一役全军覆没而告失\n败，但是，洋务运动仍然有它的历史作用，表现在", "options": {"A": "开办了一批新式学堂，派出了最早的官派留学生，这是中国近代教育的开始", "B": "裁撤绿营，建立新军，巩固了国防和边防", "C": "传统的“重本抑末”等观念受到冲击，社会风气和价值观念开始变化", "D": "客观上对中国的早期工业和民族资本主义的发展起了某些促进作用"}, "answer": "ACD"}, {"id": "p4m-15", "num": 15, "type": "multiple", "stem": "下列关于戊戌维新运动中维新派与守旧派论战的表述正确的有", "options": {"A": "论战的实质是资产阶级思想与封建主义思想在中国的第一次正面交锋", "B": "论战主要围绕要不要变法，要不要兴民权、设议院，实行君主立宪，要不要废八股、改科举\n和兴西学等问题展开", "C": "论战所涉及的领域十分广泛，进一步开阔了新型知识分子的眼界，解放了人们长期受到束缚\n的思想", "D": "通过论战，划清了革命与改良的界限，维新变法政治运动的帷幕随之拉开"}, "answer": "ABC"}, {"id": "p4m-16", "num": 16, "type": "multiple", "stem": "19世纪90年代末中国出现戊戌维新运动不是偶然的，它的发生有着深刻的历史背景，主要是", "options": {"A": "中国民族资本主义已经成为中国经济的主要形式", "B": "新兴的民族资产阶级迫切要求为在中国发展资本主义开辟道路", "C": "甲午战争惨败造成的新的民族危机激发了新的民族觉醒", "D": "资产阶级改良思想在中国迅速传播"}, "answer": "BCD"}, {"id": "p4m-17", "num": 17, "type": "multiple", "stem": "1898年的“百日维新”如同昙花一现，只经历了103天就天折了。除京师大学堂(北京大学的\n前身)被保留下来以外，其余新政措施大都被废除。戊戌维新运动的失败，主要是由于维新派\n自身的局限和以慈禧太后为首的强大的守旧势力的反对。具体说来，主要有", "options": {"A": "民族资产阶级力量弱小，又没有发动群众", "B": "维新派触及了封建主义的经济基础——封建土地所有制，导致守旧派强烈反扑", "C": "维新派没有突破“中体西用”思想的局限，不敢触动君主专制制度", "D": "维新派虽然大声疾呼救亡图存，却又幻想西方列强能帮助自己变法维新"}, "answer": "AD"}, {"id": "p4m-18", "num": 18, "type": "multiple", "stem": "19世纪90年代，维新派与守旧派开展了一场实质上是资产阶级思想与封建主义思想在中国的\n第一次正面交锋的论战。这场论战围绕的主要问题是", "options": {"A": "要不要变法", "B": "要不要实行民主共和", "C": "要不要废八股、改科举和兴西学", "D": "要不要实行君主立宪"}, "answer": "AC"}, {"id": "p4m-19", "num": 19, "type": "multiple", "stem": "戊戌维新运动是一次爱国救亡运动，维新派在民族危亡的关键时刻", "options": {"A": "高举救亡图存的旗帜", "B": "要求通过变法，发展资本主义，使中国走上富强的道路", "C": "成功地建立起存在百日的君主立宪制度", "D": "其政治实践和思想理论，贯穿着强烈的爱国主义精神，推动了中华民族的觉醒"}, "answer": "ABD"}, {"id": "p4m-20", "num": 20, "type": "multiple", "stem": "戊戌维新虽然失败了，但它在中国近代史上仍然有着重大的历史意义。戊戌维新运动是一次爱\n国救亡运动，是一场资产阶级性质的政治改良运动，更是一场思想启蒙运动。维新派大力传播\n西方资产阶级的社会政治学说和自然科学知识，宣传自由平等、社会进化观念，批判封建君权\n和封建纲常伦理，从而", "options": {"A": "把顽固的封建主义思想壁垒打开了一个缺口", "B": "有利于民主思想在中国的传播和人们的思想解放", "C": "使民主共和的观念开始深入人心", "D": "使得资产阶级新文化开始打破封建文化独占文化阵地的局面\n第三章 辛亥革命与君主专制制度的终结"}, "answer": "ABD"}, {"id": "p4m-21", "num": 21, "type": "multiple", "stem": "鸦片战争以后，西方列强野蛮入侵，封建统治腐朽无能，国家战乱不已，人民饥寒交迫，中国\n人民和中华民族遭受世所罕见的深重苦难。要实现民族独立、人民解放和国家富强、人民幸福，\n就必须推翻封建专制统治，对中国社会进行根本变革。辛亥革命的发生，是", "options": {"A": "当时民族危机加深、社会矛盾激化的结果", "B": "当时中国人民争取民族独立、振兴中华深切愿望的集中反映", "C": "中国民族资产阶级登上政治舞台的第一次表演", "D": "当时中国人民为救亡图存而前赴后继顽强斗争的集中体现"}, "answer": "ABD"}, {"id": "p4m-22", "num": 22, "type": "multiple", "stem": "1905年至1907年间，资产阶级革命派与改良派分别以《民报》《新民丛报》为主要舆论阵地，\n展开了一场大论战。这场论战的主要内容包括", "options": {"A": "要不要以革命手段推翻清王朝", "B": "要不要废八股、改科举和兴西学", "C": "要不要推翻帝制，实行共和", "D": "要不要进行社会革命"}, "answer": "ACD"}, {"id": "p4m-23", "num": 23, "type": "multiple", "stem": "1905年至1907年间革命派与改良派论战的意义是", "options": {"A": "划清了革命与改良的界限", "B": "传播了民主革命思想", "C": "促进了革命形势的发展", "D": "改变了以往只有觉悟的革命者而缺少觉醒的人民大众的斗争状况"}, "answer": "ABC"}, {"id": "p4m-24", "num": 24, "type": "multiple", "stem": "1905年至1907年间发生的资产阶级革命派与改良派的论战，也暴露了革命派在思想理论方面\n的弱点，主要表现在革命派", "options": {"A": "对“革命是否会招致帝国主义干涉”的问题不敢作出理直气壮的正面回答", "B": "所说的“国民”,主要还是指资产阶级及其知识分子，而不是广大的劳动群众", "C": "反对贫苦农民“夺富人之田为己有”", "D": "只是希望通过“有秩序的革命”来避免动乱和帝国主义的干涉"}, "answer": "ABCD"}, {"id": "p4m-25", "num": 25, "type": "multiple", "stem": "1905年8月，中国同盟会正式成立。同盟会以《民报》为机关报，并确定了革命纲领。1905\n年11月，在同盟会机关报《民报》发刊词中，孙中山将同盟会的纲领概括为三大主义，即民族\n主义、民权主义、民生主义，后被称为三民主义。孙中山的三民主义学说", "options": {"A": "初步描绘出中国还不曾有过的资产阶级共和国方案", "B": "是一个比较完整而明确的资产阶级民主革命纲领", "C": "从正面鲜明地提出反对帝国主义的主张", "D": "对推动革命的发展产生了重大而积极的影响"}, "answer": "ABD"}, {"id": "p4m-26", "num": 26, "type": "multiple", "stem": "1956年，毛泽东在《纪念孙中山先生》一文中指出，纪念伟大的革命先行者孙中山先生，“纪\n念他在辛亥革命时期，领导人民推翻帝制、建立共和国的丰功伟绩。”辛亥革命", "options": {"A": "是资产阶级领导的以反对封建君主专制制度、建立资产阶级共和国为目的的革命", "B": "实现了中国人民和中华民族自鸦片战争以来的第一次全面觉醒", "C": "是中国人民为救亡图存、振兴中华而奋起革命的一座里程碑", "D": "是一次比较完全意义上的资产阶级民主革命"}, "answer": "ACD"}, {"id": "p4m-27", "num": 27, "type": "multiple", "stem": "习近平总书记在纪念辛亥革命110周年大会上的讲话中指出，孙中山先生和辛亥革命先驱为中\n华民族建立的历史功绩彪炳千秋，在辛亥革命中英勇奋斗和壮烈牺牲的志士们名垂青史，辛亥\n革命永远是中华民族伟大复兴征程上一座巍然屹立的里程碑。辛亥革命", "options": {"A": "传播了民主共和的理念，打开了中国进步潮流的闸门", "B": "撼动了反动统治秩序的根基，在中华大地上建立起亚洲第一个共和制国家", "C": "推动了中国社会变革，点亮了实现中华民族伟大复兴的灯塔", "D": "极大促进了中华民族的思想解放"}, "answer": "ABD"}, {"id": "p4m-28", "num": 28, "type": "multiple", "stem": "辛亥革命与戊戌变法的共同点有", "options": {"A": "都是自上而下的救亡运动", "B": "都主张在中国发展资本主义", "C": "都主张改革君主专制制度", "D": "都未提出彻底的反帝反封建的纲领"}, "answer": "BD"}, {"id": "p4m-29", "num": 29, "type": "multiple", "stem": "辛亥革命之所以失败，从主观方面来说，在于它的领导者资产阶级革命派本身存在着许多弱点\n和错误，主要是", "options": {"A": "没有提出彻底的反帝反封建的革命纲领", "B": "不能充分发动和依靠人民群众", "C": "不能建立坚强的革命政党", "D": "资本主义的建国方案行不通"}, "answer": "ABC"}, {"id": "p4m-31", "num": 31, "type": "multiple", "stem": "孙中山先生是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱，一生以革命为\n己任，立志救国救民，为中华民族作出了彪炳史册的贡献。孙中山先生的丰功伟绩表现在", "options": {"A": "领导了辛亥革命，结束了统治中国几千年的君主专制制度", "B": "把旧三民主义发展为新三民主义，实行联俄、联共、扶助农工三大政策", "C": "发动了以推翻北洋军阀统治为目标的北伐战争", "D": "坚决反对军阀分裂割据，坚定维护民主共和制度和国家完整统一\n第四章 中国共产党成立和中国革命新局面"}, "answer": "ABD"}, {"id": "p4m-32", "num": 32, "type": "multiple", "stem": "新文化运动是从1915年9月陈独秀在上海创办《青年杂志》(后改名《新青年》)开始的。新\n文化运动是生动活泼的、前进的、革命的，具有重要的意义。新文化运动", "options": {"A": "通过批判孔学，动摇了封建正统思想的统治地位", "B": "在社会上掀起思想解放潮流，冲决了禁锢人们思想的闸门", "C": "是资产阶级新文化开始打破封建文化独占文化阵地局面的起点", "D": "提倡民主、反对专制，提倡科学、反对迷信盲从，是切中时弊的"}, "answer": "ABD"}, {"id": "p4m-33", "num": 33, "type": "multiple", "stem": "五四以前的新文化运动主要是资产阶级民主主义的新文化反对封建主义的旧文化的斗争，五四\n以后的新文化运动则发展到了一个新阶段，马克思主义开始逐步在思想文化领域中发挥指导作\n用。这主要是指中国先进分子在接受马克思主义之后", "options": {"A": "没有抛弃而是继承了五四运动的民主和科学的精神并赋予它们新的含义", "B": "克服了以往启蒙者的弱点，有力推动了反封建的启蒙运动", "C": "以唯物史观为武器从反对封建思想入手，进而提出必须反对产生封建思想的社会制度", "D": "依靠进步报刊的传播，把改造国民性置于优先地位"}, "answer": "ABC"}, {"id": "p4m-34", "num": 34, "type": "multiple", "stem": "毛泽东指出，俄罗斯以民众大联合打倒贵族、驱逐富人的事实，使全世界为之震动。革命浪潮\n风起云涌，“异军特起，更有中华长城渤海之间，发生了‘五四’运动”。这表明", "options": {"A": "俄国十月革命是五四运动的直接导火线", "B": "五四运动是在新的时代条件和社会历史条件下发生的", "C": "十月革命使中国人看到了民族解放的新希望", "D": "只有社会主义才能救中国成为当时全社会的普遍共识"}, "answer": "BC"}, {"id": "p4m-35", "num": 35, "type": "multiple", "stem": "1919年爆发的五四运动，是中国近代史上一个划时代的事件，在近代以来中华民族追求民族独\n立和发展进步的历史进程中具有里程碑意义。五四运动", "options": {"A": "是中国旧民主主义革命走向新民主主义革命的转折点，成为中国新民主主义革命的开端", "B": "以全民族的力量高举起爱国主义的伟大旗帜，孕育了以爱国、进步、民主、科学为主要内容\n的伟大五四精神", "C": "以全民族的行动激发了追求真理、追求进步的伟大觉醒，实现了中国人民和中华民族自鸦片\n战争以来的第一次全面觉醒", "D": "以全民族的搏击培育了永久奋斗的伟大传统，标志着中国青年成为推动中国社会变革的急先锋"}, "answer": "ABCD"}, {"id": "p4m-36", "num": 36, "type": "multiple", "stem": "由于五四运动是在新的社会历史条件下发生的，它具有以辛亥革命为代表的旧民主主义革命所\n不具备的历史特点。五四运动", "options": {"A": "是一场以先进青年知识分子为先锋、广大人民群众参加的彻底反帝反封建的伟大爱国革命\n运动", "B": "是一场中国人民为拯救民族危亡、捍卫民族尊严、凝聚民族力量而掀起的伟大社会革命运动", "C": "是一场传播新思想、新文化、新知识的伟大思想启蒙运动和新文化运动", "D": "以磅礴之力鼓动了中国人民和中华民族实现民族复兴的志向和信心"}, "answer": "ABCD"}, {"id": "p4m-37", "num": 37, "type": "multiple", "stem": "五四运动是中国旧民主主义革命走向新民主主义革命的转折点，在近代以来中华民族追求民族\n独立和发展进步的历史进程中具有里程碑意义。五四运动具有", "options": {"A": "彻底反帝反封建的革命性", "B": "追求救国强国真理的进步性", "C": "各族各界群众积极参与的广泛性", "D": "街头抗争与议会斗争相结合的创造性"}, "answer": "ABC"}, {"id": "p4m-38", "num": 38, "type": "multiple", "stem": "在十月革命后、五四运动前后的中国思想界，产生了一批赞成俄国十月社会主义革命、具有初\n步共产主义思想的知识分子。社会主义开始在中国形成一股有相当影响的思想潮流。以下说法\n中，正确反映这个时期实际情况的有", "options": {"A": "在各种社会主义思想中，马克思主义从一开始就占据了优势", "B": "最初人们对社会主义只是一种朦胧的向往", "C": "以五四运动为起点，封建文化独占文化阵地的局面开始被打破", "D": "李大钊发表《我的马克思主义观》,标志着马克思主义在中国进入比较系统的传播阶段"}, "answer": "BD"}, {"id": "p4m-39", "num": 39, "type": "multiple", "stem": "毛泽东同志当年曾指出，“五四运动时中国无产阶级开始有了觉悟，五四运动发生在一九一九\n年，一九二一年便产生了中国共产党”,“我们研究党史，只从一九二一年起还不能完全说明向\n题⋯⋯从五四运动说起可能更好”。习近平深刻指出，认识和把握五四运动“要坚持大历史观”。\n这些所要论述，深刻揭示了五四运动与中国共产党成立的历史关联。五四运动", "options": {"A": "促进了马克思主义在中国的传播", "B": "促进了马克思主义同中国工人运动的结合", "C": "为中国共产党的成立作了思想上、干部上的准备", "D": "为新的革命力量、革命文化、革命斗争登上历史舞台创造了条件"}, "answer": "ABCD"}, {"id": "p4m-40", "num": 40, "type": "multiple", "stem": "1920年，陈望道翻译的首个中文全译本《共产党宣言》在中国面世，立即受到工人阶级和先进\n知识分子的热烈欢迎，初版印了千余本很快销售一空。毛泽东后来回忆起他青年时代信仰马克\n思主义的经过时，曾谈及他在这个时期读过陈望道翻译的《共产党宣言》。1920年之所以会在\n中国出版首个中文全译本《共产党宣言》,并很快销售一空，是因为", "options": {"A": "当时的中国社会需要马克思主义", "B": "马克思主义提供了中国革命的具体方案", "C": "十月革命推动中国的先进分子从资产阶级民主主义转向社会主义", "D": "五四运动以后社会主义思潮在中国蓬勃兴起，马克思主义开始在知识界广泛传播"}, "answer": "ACD"}, {"id": "p4m-41", "num": 41, "type": "multiple", "stem": "五四运动以后，在李大钊等的影响和当时形势的推动下，一批爱国的进步青年，走上了马克思\n主义的道路。为适应中国社会发展和革命发展的需要，早期马克思主义者在中国掀起了一场研\n究、传播马克思主义的思想运动。中国早期马克思主义思想运动的特点是", "options": {"A": "重视对马克思主义基本理论的学习，从一开始就坚持了马克思主义的革命原则和正确方向", "B": "明确提出了“马克思主义的中国化”的命题", "C": "注意从中国实际出发，学习、运用马克思主义的理论去研究和解决中国面临的实际问题", "D": "开始提出知识分子应当同劳动群众相结合的思想，主张知识分子“向农村去”“到民间去”"}, "answer": "ACD"}, {"id": "p4m-42", "num": 42, "type": "multiple", "stem": "1920年8月，中国共产党的最早组织在上海成立。之后，在北京、武汉、长沙、济南、广州，\n都成立了共产党早期组织。在日本、法国成立了由留学生和华侨中先进分子组成的共产党早期\n组织。早期党的地方组织的形成，为中国共产党的创建准备了组织基础。中国共产党的早期组\n织之所以首先在上海诞生，是因为", "options": {"A": "上海是中国工人阶级最密集的中心城市", "B": "身居上海的陈独秀在中国大地上率先举起了马克思主义旗帜", "C": "在上海成立了中国最早学习和研究马克思主义的团体——马克思学说研究会", "D": "上海的工人阶级最早以独立的政治力量登上历史舞台"}, "answer": "AD"}, {"id": "p4m-43", "num": 43, "type": "multiple", "stem": "随着中国工人阶级开始作为独立的政治力量登上历史舞台和马克思主义在中国的逐步传播，建\n立一个以马克思主义为指导的工人阶级政党的任务被提上了日程。1920年8月，共产党早期组\n织在上海《新青年》编辑部成立。同年10月，李大钊等在北京成立共产党早期组织。从1920\n年秋至1921年春，武汉、长沙、济南、广州，都成立了共产党早期组织。在日本、法国成立了\n由留学生和华侨中先进分子组成的共产党早期组织。中国共产党早期组织成立后，进行多方面\n的活动，使在中国创建共产党的条件基本具备了。共产党早期组织成立后，着重进行的工作主\n要有", "options": {"A": "研究和宜传马克思主义，研究中国实际问题", "B": "到工人中去进行宣传和组织工作", "C": "提出反帝反封建的民主革命纲领", "D": "进行关于建党问题的讨论和实际组织工作"}, "answer": "ABD"}, {"id": "p4m-44", "num": 44, "type": "multiple", "stem": "中国共产党这个中国近代以来最伟大的创业团队，是1921年在上海的一座石库门小楼里集结出发\n的。当年这里是望志路106号，1943年至今是兴业路76号。由“望志”而“兴业”,是历史的巧\n合，也寓意着历史的必然。中国共产党是在特定的社会历史条件下成立的。中国共产党一开始", "options": {"A": "就把党的工作重心放在农村", "B": "就义无反顾地肩负起实现中华民族伟大复兴的历史使命", "C": "就是一个区别于第二国际旧式社会改良党的新型工人阶级革命政党", "D": "就是一个以马克思列宁主义理论为基础的党"}, "answer": "BCD"}, {"id": "p4m-46", "num": 46, "type": "multiple", "stem": "1922年7月，中共二大制定的民主革命纲领是", "options": {"A": "打倒军阀", "B": "统一中国为真正民主共和国", "C": "推翻国际帝国主义的压迫", "D": "建立劳农专政的政治，铲除私有财产制度"}, "answer": "ABC"}, {"id": "p4m-47", "num": 47, "type": "multiple", "stem": "1922年8月，中共中央一些领导人在杭州开会，讨论国共合作问题。1923年1月，共产国际执\n委会作出《关于中国共产党与国民党的关系问题的决议》,对国共合作起了推动作用。1923年6\n月在广州举行的中国共产党第三次全国代表大会", "options": {"A": "正确估计了孙中山的革命立场和国民党进行改革的可能性", "B": "强调组成“民主主义的联合战线”,明确提出了统一战线政策", "C": "决定共产党员以个人身份加入国民党，以实现国共合作", "D": "明确规定共产党员加入国民党时，党必须在政治上、思想上、组织上保持自己的独立性"}, "answer": "ACD"}, {"id": "p4m-48", "num": 48, "type": "multiple", "stem": "为了加强对日益高涨的革命运动的领导，1925年1月，中国共产党第四次全国代表大会在上海\n举行。中共四大的重大历史功绩在于", "options": {"A": "提出了中国无产阶级在民主革命中的领导权问题", "B": "提出了工农联盟问题", "C": "对中国民主革命的内容作了更加完整的规定", "D": "具体回答了如何正确处理同资产阶级争夺领导权过程中遇到的复杂问题"}, "answer": "ABC"}, {"id": "p4m-49", "num": 49, "type": "multiple", "stem": "1925年5月，英、日等国军警在上海制造枪杀中国民众的五卅惨案，导致五卅运动爆发。以此\n为起点，掀起了全国范围的大革命高潮。五卅运动", "options": {"A": "是中国工人运动史上持续时间最长的一次政治大罢工", "B": "冲破了长期笼罩全国的沉闷的政治空气，大大促进了群众的觉醒", "C": "显示了各革命阶级、各阶层民众在无产阶级领导下联合斗争的巨大威力", "D": "给了帝国主义和军阀势力一次前所未有的打击"}, "answer": "BCD"}, {"id": "p4m-50", "num": 50, "type": "multiple", "stem": "1924年至1927年中国反帝反封建的革命，之所以被称作大革命，是因为与以往任何一次革命\n包括辛亥革命和五四运动相比，有很大的不同，主要是", "options": {"A": "群众的动员程度更为广泛", "B": "斗争的规模更加宏伟", "C": "革命的社会内涵更为深刻", "D": "革命的背景更加复杂"}, "answer": "ABC"}, {"id": "p4m-51", "num": 51, "type": "multiple", "stem": "大革命是在国共合作的条件下进行的，没有国共合作，不会在短时间内掀起这样一场革命。在\n这场革命中，中国共产党起着独特的、不可代替的作用。没有中国共产党，不会有这场大革命。\n中国共产党在大革命中的独特的、不可代替的作用表现在", "options": {"A": "中国共产党是大革命的政治口号——反对帝国主义、反对军阀——的提出者", "B": "中国共产党是国共合作的倡导者和统一战线的领导者", "C": "中国共产党是人民群众的主要发动者和组织者", "D": "中国共产党帮助和推动了国民革命军的建立\nJ2027考研政治1000题》>试题分册"}, "answer": "ACD"}, {"id": "p4m-52", "num": 52, "type": "multiple", "stem": "大革命失败的原因是", "options": {"A": "反革命力量强大，蒋介石集团、汪精卫集团先后叛变革命", "B": "党当时处于幼年时期，不善于将马列主义基本原理同中国革命具体实际结合起来", "C": "党的中央领导机关在大革命的后期犯了以陈独秀为代表的右倾机会主义的错误", "D": "共产国际对中国革命作出了一些错误的指导"}, "answer": "ABCD"}, {"id": "p4m-53", "num": 53, "type": "multiple", "stem": "1927年4月12日，蒋介石在上海发动反共政变。同年7月15日，汪精卫在武汉召开“分共”\n会议，并在其辖区内对共产党员和革命群众实行搜捕和屠杀，国共合作全面破裂，大革命最终\n失败。大革命虽然失败了，但它的历史意义仍然是不可磨灭的。正是在这个时期，中国共产党\n人进行了轰轰烈烈的革命工作，领导了全国反帝反封建的伟大斗争，在中国革命史上写下了光\n荣的一页，同时", "options": {"A": "开始探索马克思主义中国化的途径", "B": "初步提出了新民主主义革命的基本思想", "C": "开始建立人民民主统一战线", "D": "开始懂得进行土地革命和掌握革命武装的重要性\n第五章 中国革命的新道路"}, "answer": "ABD"}, {"id": "p4m-55", "num": 55, "type": "multiple", "stem": "在革命的危急关头，1927年7月中旬，中共中央政治局临时常委会决定", "options": {"A": "将党所掌握和影响的部队向南昌集中，准备起义", "B": "组织湘、鄂、赣、粤四省的农民发动秋收起义", "C": "召集中央紧急会议，讨论和决定大革命失败后的新方针", "D": "确定了土地革命和武装起义的方针"}, "answer": "ABC"}, {"id": "p4m-57", "num": 57, "type": "multiple", "stem": "1930年5月毛泽东在《反对本本主义》一文中提出和阐述的重要思想有", "options": {"A": "没有调查，没有发言权", "B": "中国革命斗争的胜利要靠中国同志了解中国情况", "C": "不做正确的调查同样没有发言权", "D": "关心群众生活，注意工作方法"}, "answer": "AB"}, {"id": "p4m-58", "num": 58, "type": "multiple", "stem": "1928年10月和11月，毛泽东写了《中国的红色政权为什么能够存在?》和《井冈山的斗争》\n两篇文章，论证了红色政权能够长期存在并发展的主客观条件，提出了工农武装割据的思想。\n1930年1月，毛泽东在《星星之火，可以燎原》一文中进一步阐明了中国革命只能走与资本主\n义国家不同的道路。这些论述，提出了党把工作重心由城市转移到农村，在农村开展游击战争，\n深入进行土地革命，建立和发展红色政权，待条件成熟时再夺取全国政权的中国革命新道路的\n思想。农村包围城市、武装夺取政权的理论", "options": {"A": "是对1927年大革命失败后中国共产党领导的红军和根据地斗争经验的科学概括", "B": "是在同当时党内盛行的把马克思主义教条化的错误倾向作坚决斗争的基础上逐步形成的", "C": "是在共产国际的直接指导和借鉴苏联经验的基础上逐步形成的", "D": "标志着中国化的马克思主义即毛泽东思想的初步形成"}, "answer": "ABD"}, {"id": "p4m-59", "num": 59, "type": "multiple", "stem": "1931年11月，中华苏维埃第一次全国代表大会在江西瑞金召开。大会通过了《中华苏维埃共\n和国宪法大纲》以及土地法令、劳动法等，选举产生了中华苏维埃共和国中央执行委员会，成\n立了中华苏维埃共和国临时中央政府，毛泽东当选为主席。中华苏维埃共和国", "options": {"A": "是中国历史上第一个全国性的各个革命阶级联合专政的政权", "B": "是中国共产党在局部地区执政的重要尝试", "C": "扩大了党和红色政权的影响，一定程度上加强了对处于被分割状态的各根据地的中枢指挥作用", "D": "推动了各根据地的政权、经济、文化教育和党的自身建设，开创了土地革命战争新局面"}, "answer": "BCD"}, {"id": "p4m-60", "num": 60, "type": "multiple", "stem": "1935年1月，中共中央政治局在长征途中举行遵义会议，这在党的历史上是一个生死攸关的转\n折点。遵义会议", "options": {"A": "标志着中国共产党在政治上开始走向成熟", "B": "使实事求是的思想路线在全党范围确立起来", "C": "确立党中央的正确领导，创造性地制定和实施符合中国革命特点的战略策略", "D": "开启了党独立自主解决中国革命实际问题的新阶段"}, "answer": "ACD"}, {"id": "p4m-61", "num": 61, "type": "multiple", "stem": "1934年9月上旬，国民党军队加紧对中央革命根据地腹地发动进攻，红军已无在原地扭转战局\n的可能。10月，中共中央、中革军委率中央红军主力等8.6万余人踏上战略转移的漫漫征程，\n开始了世界历史上前所未有的壮举。中国工农红军长征是一次理想信念的伟大远征，是一次检\n验真理的伟大远征，是一次唤醒民众的伟大远征，是一次开创新局的伟大远征。长征的胜利", "options": {"A": "极大地促进了党在政治上和思想上的成熟", "B": "是中国革命转危为安的关键", "C": "标志着党在政治上、思想上、组织上走向成熟", "D": "是中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点\n第六章 中华民族的抗日战争"}, "answer": "AB"}, {"id": "p4m-62", "num": 62, "type": "multiple", "stem": "1931年9月18日深夜，日本关东军按照精心策划，炸毁沈阳柳条湖“南满铁路”路轨，并嫁\n祸于中国军队，日军以此为借口，炮轰中国东北军北大营，制造了震惊中外的九一八事变。面\n对日本的野蛮侵略，中国人民奋起抵抗。中国人民在白山黑水间的奋起抵抗", "options": {"A": "揭开了世界反法西斯战争的序幕", "B": "标志着中国由此进入全民族抗战阶段", "C": "成为中国人民抗日战争的起点", "D": "直接促成了国共两党的第二次合作"}, "answer": "AC"}, {"id": "p4m-63", "num": 63, "type": "multiple", "stem": "1935年12月，中共中央在陕北瓦窑堡召开政治局扩大会议，讨论全国政治形势和党的策略路\n线问题、军事战略问题。会议批评并克服了党内长期存在的“左”倾冒险主义、关门主义错误\n倾向，明确提出党的基本策略任务是建立广泛的抗日民族统一战线。瓦窑堡会议是从第五次反\n“围剩”失败到全民族抗战兴起过程中召开的一次重要会议，它表明", "options": {"A": "党在新的历史时期将要到来时掌握了政治上的主动权", "B": "党开始努力解决政治路线问题", "C": "党正在从中国的实际情况出发，创造性地开展工作", "D": "实事求是的思想路线在全党范围确立起来"}, "answer": "ABC"}, {"id": "p4m-64", "num": 64, "type": "multiple", "stem": "1937年8月，中国共产党在陕北洛川召开政治局扩大会议(洛川会议)。会议强调要争取抗战\n胜利的关键在于使已经发动的抗战成为全面的全民族抗战。会议通过《中国共产党抗日救国十\n大纲领》,提出必须实行全国军事总动员、全国人民总动员；必须改革政治机构，给人民以充分\n的抗日民主权利，并适当改善工农大众生活。洛川会议制定的党的全面抗战路线", "options": {"A": "把实行全民族抗战与争取人民民主、改善人民生活结合起来", "B": "把反对外敌入侵与推进社会进步统一起来", "C": "正确处理了民族矛盾与阶级矛盾的关系", "D": "确立了建立广泛的抗日民族统一战线的新策略"}, "answer": "ABCD"}, {"id": "p4m-67", "num": 67, "type": "multiple", "stem": "从传统的战争理论看来，游击战争是个战术问题。但是，在中国人民抗日战争中，游击战被提\n到战略地位，具有全局性意义。以下说法正确的有", "options": {"A": "在战略防御阶段，游击战争担负了抗击日军战略进攻的主要任务", "B": "游击战争主要是在外线单独作战，而不是在内线配合正规军的战役作战", "C": "在民族战争条件下，游击战争能够大规模地进行", "D": "在长期的不断削弱敌人、壮大自己的斗争中，游击军和游击战必将向正规军和运动战发展"}, "answer": "BCD"}, {"id": "p4m-68", "num": 68, "type": "multiple", "stem": "为了实现全面抗战路线和持久战战略总方针，毛泽东首次将游击战提高到战略地位。在极为艰\n苦的反“扫荡”、反“滑乡”斗争中，敌后军民创造了很多极为有效、灵活多样的歼敌方法，如\n伏击战、破袭战、地雷战、地道战、麻雀战等，使日军犹如困兽，陷入人民战争的汪洋大海。\n独立自主的游击战争", "options": {"A": "实质上是抗日战争中时间最长、战斗战役持续不断的一场特殊战略大会战", "B": "是人民军队发挥政治优势和军事优势最好的作战形式", "C": "是坚持持久抗战、最终彻底战胜日本侵略者的唯一正确的政治军事方针", "D": "始终是国民党正面战场正规战的重要辅助力量"}, "answer": "ABC"}, {"id": "p4m-70", "num": 70, "type": "multiple", "stem": "抗日战争相持阶段到来以后，由于以蒋介石为代表的国民党亲英美派开始推行消极抗日、积极\n反共的政策，团结抗战的局面逐步发生严重危机，出现了中途妥协和内部分裂两大危险。针对\n这种情况，为了坚决揭露打击汪精卫集团的叛国投降活动，继续争取同蒋介石集团合作抗日，\n1939年7月，中国共产党明确提出的口号有", "options": {"A": "“坚持抗战到底，反对中途妥协”", "B": "“巩固国内团结，反对内部分裂”", "C": "“坚持全面抗战，反对限共溶共”", "D": "“力求全国进步，反对向后倒退”"}, "answer": "ABD"}, {"id": "p4m-71", "num": 71, "type": "multiple", "stem": "中国共产党在抗日民族统一战线中坚持的策略总方针是", "options": {"A": "发展进步势力", "B": "争取中间势力", "C": "消灭反动势力", "D": "孤立顽固势力"}, "answer": "ABD"}, {"id": "p4m-72", "num": 72, "type": "multiple", "stem": "抗日民族统一战线中的中间势力包括", "options": {"A": "民族资产阶级", "B": "城市小资产阶级", "C": "地方实力派", "D": "开明绅士"}, "answer": "ACD"}, {"id": "p4m-73", "num": 73, "type": "multiple", "stem": "为了抗日民族统一战线的坚持、扩大和巩固，中国共产党制定了“发展进步势力，争取中间势\n力，孤立顽固势力”的策略总方针。同顽固派作斗争必须坚持", "options": {"A": "有节", "B": "有理", "C": "有利", "D": "有力"}, "answer": "ABC"}, {"id": "p4m-74", "num": 74, "type": "multiple", "stem": "1938年9月29日至11月6日，中国共产党扩大的六届六中全会在延安召开。这是一次具有重\n大历史意义的会议，毛泽东后来在党的七大上说：“六中全会是决定中国之命运的。”党的六届\n六中全会的重要性体现在", "options": {"A": "基本纠正了王明在抗日民族统一战线上的“左”倾错误", "B": "进一步巩固了毛泽东在全党的领导地位", "C": "统一了全党的思想和步调，推动了各项工作迅速发展", "D": "毛泽东在全会上明确提出了“马克思主义的中国化”命题"}, "answer": "BCD"}, {"id": "p4m-76", "num": 76, "type": "multiple", "stem": "1942年2月，毛泽东先后作了《整顿党的作风》和《反对党八股》的讲演，整风运动在全党范\n围普遍展开。在全党开展整风运动，原因在于", "options": {"A": "由于条件的限制，遵义会议以来对曾经给党的事业造成严重危害的主观主义、教条主义，没\n有来得及从思想上进行认真的清理", "B": "随着党的队伍的扩大，一大批出身农民和其他小资产阶级的新党员身上存在着各种非无产阶\n级思想", "C": "共产国际解散给党带来的不利影响也需要应对", "D": "老党员要适应新形势，也需要进一步提高自己\nJ 2027考研政治1000题>>>试题分册"}, "answer": "ABD"}, {"id": "p4m-77", "num": 77, "type": "multiple", "stem": "1941年5月，毛泽东作了《改造我们的学习》的报告。整风运动首先在党的高级干部中进行。\n1942年2月，毛泽东先后作了《整顿党的作风》和《反对党八股》的讲演，整风运动在全党范\n围普遍展开。任弼时在《学习毛泽东整顿三风报告的笔记》中记录了参加整风运动的体会：“毛\n泽东同志整顿三风报告中，关于反对主观主义的主要精神，是正确地提出了对待马列主义态度\n问题。告诉我们学习马列主义，不是学它的字句，而是要学会用它的立场、观点和方法去解决\n革命中的实际问题，找出革命的发展规律，来便于我们具体决定政策。”整风运动", "options": {"A": "使实事求是的思想路线在全党范围确立起来", "B": "以党的六届七中全会原则通过《关于若干历史问题的决议》而胜利结束", "C": "开始了马克思主义与中国实际的“第一次结合”", "D": "是一次深刻的马克思主义思想教育运动和思想解放运动"}, "answer": "ABD"}, {"id": "p4m-78", "num": 78, "type": "multiple", "stem": "在深入总结历史经验的基础上，1944年5月21日至1945年4月20日，中共扩大的六届七中\n全会在延安召开。会议原则通过了《关于若干历史问题的决议》,对建党以后特别是党的六届四\n中全会至遵义会议前这一段党的历史及其经验教训进行了总结，对党的若干重大历史问题作出\n结论。《关于若干历史问题的决议》", "options": {"A": "使全党特别是党的高级干部对中国革命基本问题的认识达到了一致，增强了全党团结", "B": "充分肯定了确立毛泽东在全党领导地位的重大意义", "C": "为党的七大胜利召开创造了充分条件，有力促进了中国革命事业发展", "D": "开启了党独立自主解决中国革命实际问题的新阶段"}, "answer": "ABC"}, {"id": "p4m-79", "num": 79, "type": "multiple", "stem": "1945年4月23日至6月11日，中国共产党第七次全国代表大会在延安举行。这次大会以“团\n结的大会，胜利的大会”载入党的史册。中共七大", "options": {"A": "制定了党的政治路线和新民主主义国家在政治、经济、文化方面的纲领", "B": "标志着我们党在政治上、思想上、组织上走向了成熟", "C": "把党成立以来的历史经验概括为三大法宝", "D": "把毛泽东思想确立为党的指导思想并写入党章"}, "answer": "ABD"}, {"id": "p4m-80", "num": 80, "type": "multiple", "stem": "1945年4月23日至6月11日，中国共产党第七次全国代表大会在延安举行。毛泽东在会上作\n了题为《论联合政府》的书面报告和《愚公移山》的闭幕词。中共七大制定了“放手发动群\n众，壮大人民力量，在我党的领导下，打败日本侵略者，解放全国人民，建立一个新民主主义\n的中国”的政治路线，总结党的建设的历史经验，把党在长期奋斗中形成的优良作风概括为", "options": {"A": "艰苦奋斗的作风", "B": "理论和实践相结合的作风", "C": "和人民群众紧密地联系在一起的作风", "D": "自我批评的作风"}, "answer": "BCD"}, {"id": "p4m-81", "num": 81, "type": "multiple", "stem": "1945年，包括台湾同胞在内的全体中华儿女前仆后继、浴血奋战，取得中国人民抗日战争暨世\n界反法西斯战争的伟大胜利，台湾随之光复，重回祖国怀抱。台湾光复是", "options": {"A": "中国人民抗日战争胜利的重要成果", "B": "中国政府恢复对台湾行使主权的重要铁证", "C": "台湾作为中国一部分的历史事实和法理链条的重要一环", "D": "两岸同胞的共同荣光和全体中华几女的民族记忆"}, "answer": "ABCD"}, {"id": "p4m-82", "num": 82, "type": "multiple", "stem": "中国人民的抗日战争从1931年开始，到1945年结束，前后经历了14年的浴血奋战。在世界反\n法西斯战争的进程中，中国人民的抗日战争被称为“最早的抗争，最后的胜利”。中国人民抗日\n战争的伟大胜利，是", "options": {"A": "近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放斗争", "B": "中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点", "C": "世界反法西斯战争胜利的重要组成部分", "D": "中国人民的胜利、世界人民的胜利"}, "answer": "ABCD"}, {"id": "p4m-83", "num": 83, "type": "multiple", "stem": "在艰苦卓绝的抗日战争中，全体中华儿女为国家生存而战、为民族复兴而战、为人类正义而战，\n社会动员之广泛，民族觉醒之深刻，战斗意志之顽强，必胜信念之坚定，都达到了空前的高度。\n中国人民以铮铮铁骨战强敌、以血肉之躯筑长城、以前仆后继赴国难，谱写了惊天地、泣鬼神\n的雄壮史诗。中国人民抗日战争的伟大胜利", "options": {"A": "彻底粉碎了日本军国主义殖民奴役中国的图谋，彻底洗刷了近代以来抗击外来侵略屡战屡败\n的民族耻辱", "B": "对世界各国夺取反法西斯战争的胜利，维护世界和平产生了巨大影响", "C": "坚定了中国人民追求民族独立、自由、解放的意志，开启了古老中国凤凰涅槃、浴火重生的\n历史新征程", "D": "促进了中华民族的大团结，形成了伟大的抗战精神"}, "answer": "ABCD"}, {"id": "p4m-84", "num": 84, "type": "multiple", "stem": "抗日战争的伟大胜利，是近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放斗争。\n当年一个积贫积弱的国家，能够战胜不可一世的日本军国主义，原因在于", "options": {"A": "以爱国主义为核心的民族精神是中国人民抗日战争胜利的决定因素", "B": "中国共产党的中流砥柱作用是中国人民抗日战争胜利的关键", "C": "全民族抗战是中国人民抗日战争胜利的重要法宝", "D": "世界反法西斯力量为中国人民提供了宝贵的人力物力支持"}, "answer": "ABCD"}, {"id": "p4m-85", "num": 85, "type": "multiple", "stem": "中国共产党的中流砥柱作用是中国人民抗日战争胜利的关键。中国共产党的中流砥柱作用体\n现在", "options": {"A": "在日本帝国主义加紧侵略我国、民族危机空前严重的关头，率先高举武装抗日旗帜", "B": "促成西安事变和平解决，对推动国共再次合作、团结抗日起了重大历史作用", "C": "坚持全面抗战路线，提出和实施持久战的战略总方针和一整套人民战争的战略战术", "D": "开辟广大敌后战场和抗日根据地，领导八路军、新四军、东北抗日联军和其他人民抗日武装\n英勇作战\n第七章 为建立新中国而奋斗"}, "answer": "ABCD"}, {"id": "p4m-86", "num": 86, "type": "multiple", "stem": "抗日战争胜利后，蒋介石集团的既定方针是以武力消灭共产党及其领导的人民军队和解放区政\n权。但是，1945年8月，蒋介石还是连发三电，邀请毛泽东赴重庆谈判。这是因为", "options": {"A": "全国人民强烈要求和平、反对内战", "B": "国民党的军队大部分远在西南、西北后方", "C": "国民党完成内战部署需要相当的时间", "D": "国际上苏联、美国等都表示希望中国能够实行和平建国"}, "answer": "ABCD"}, {"id": "p4m-87", "num": 87, "type": "multiple", "stem": ",1945年8月，蒋介石连发三电，邀请毛泽东赴重庆谈判。其目的在于", "options": {"A": "满足全国人民强烈要求和平的愿望，建立和平、民主的新中国", "B": "以此敷衍国内外舆论，掩盖其正在进行的内战准备", "C": "诱使中共交出人民军队和解放区政权，以期不战而控制全中国", "D": "如果谈判不成，即放手发动内战，并把战争责任转嫁给中国共产党"}, "answer": "BCD"}, {"id": "p4m-88", "num": 88, "type": "multiple", "stem": "1945年8月25日，中共中央发表《对目前时局的宣言》,明确提出和平、民主、团结的口号。\n中共中央之所以提出这个口号，是因为", "options": {"A": "希望通过和平途径对中国进行政治社会的改革", "B": "中国人民在经历了长期战争后有和平建国的强烈要求", "C": "需要时间来争取外援以进行经济建设", "D": "人民力量的强大，加上其他条件，有可能造成和平发展的新阶段"}, "answer": "ABD"}, {"id": "p4m-89", "num": 89, "type": "multiple", "stem": "1946年6月26日，国民党军以进攻中原解放区为起点，挑起了全面内战。为打退国民党对解\n放区的军事进攻，中共中央指出，必须", "options": {"A": "在国际上奉行“一边倒”的外交方针以争取社会主义阵营的广泛支持", "B": "争取一切可以争取的人，在党的领导下建立最广泛的人民民主统一战线", "C": "采取集中优势兵力、各个歼灭敌人的作战原则", "D": "立即以主力打到外线去，将战争引向国民党统治区域"}, "answer": "BC"}, {"id": "p4m-90", "num": 90, "type": "multiple", "stem": "全面内战爆发时，中国共产党清醒估计国内外形势，坚决认定，我们必须打败蒋介石，而且能\n够打败他。我们能够打败蒋介石，是因为", "options": {"A": "蒋介石军事力量的优势和美国的援助，只是临时起作用的因素", "B": "蒋介石发动的战争的反人民性质，人心的向背，是经常起作用的因素", "C": "各民主党派和无党派民主人士公开自愿接受中国共产党的领导，决心走人民革命的道路", "D": "人民解放军的战争所具有的爱国的、正义的、革命的性质，必然要获得全国人民的拥护"}, "answer": "ABD"}, {"id": "p4m-91", "num": 91, "type": "multiple", "stem": "毛泽东指出：“如果我们能够普遍地彻底地解决土地问题，我们就获得了足以战胜一切敌人的最\n基本的条件。”解放战争时期，为推动解放区土改运动进一步发展，1947年7月至9月，中国\n共产党在西柏坡召开全国土地会议，制定和通过了《中国土地法大纲》。土地制度改革", "options": {"A": "是中国共产党领导广大农民从根本上摧毁中国封建制度根基的社会大变革", "B": "使人民解放战争获得源源不断的人力、物力支援", "C": "为打败蒋介石、建立新中国奠定了深厚的群众基础", "D": "为当代中国的一切发展进步提供了根本政治保障"}, "answer": "ABC"}, {"id": "p4m-92", "num": 92, "type": "multiple", "stem": "1949年3月召开的中共七届二中全会是新中国成立前中国共产党召开的一次十分重要的会议。\n毛泽东在会议上提出了“两个务必”的思想，即“务必使同志们继续地保持谦虚、谨慎、不骄、\n不躁的作风，务必使同志们继续地保持艰苦奋斗的作风”。这次会议", "options": {"A": "规定了党在全国胜利后在政治、经济、外交方面应当采取的基本政策", "B": "指出了中国由农业国转变为工业国、由新民主主义社会转变为社会主义社会的发展方向", "C": "提出要掌握斗争的方向，不要四面出击", "D": "标志着中国革命重心从农村转向城市"}, "answer": "AB"}, {"id": "p4m-93", "num": 93, "type": "multiple", "stem": "中国共产党与民主党派的合作，对于中国人民解放事业的发展起到了积极的作用。促成中国共\n产党与民主党派团结合作的因素有", "options": {"A": "民主党派主张的“中间路线”与中国共产党主张的新民主主义道路是基本一致的", "B": "中国共产党对各民主党派采取了积极的争取和团结的政策", "C": "民主党派主张爱国、反对卖国，主张民主、反对独裁", "D": "民主党派在斗争的实践中自愿地接受了中国共产党的领导"}, "answer": "BCD"}, {"id": "p4m-94", "num": 94, "type": "multiple", "stem": "1949年9月21日，中国人民政治协商会议第一届全体会议在北平(北京)隆重开幕。毛泽东\n在开幕词中向全世界豪迈地宣告：“我们的工作将写在人类的历史上，它将表明：占人类总数四\n分之一的中国人从此站立起来了。”这次会议", "options": {"A": "完成了创建新中国的任务", "B": "通过了社会主义类型的临时宪法《中国人民政治协商会议共同纲领》", "C": "开启了中国共产党领导各党派团体和各族各界人士协商建国、共创伟业的新纪元", "D": "标志着中国共产党领导的多党合作和政治协商制度正式确立"}, "answer": "ACD"}, {"id": "p4m-95", "num": 95, "type": "multiple", "stem": "随着国民党反动统治的覆灭和中华人民共和国的成立，中国新民主主义革命赢得了基本的胜利。\n中国革命胜利具有的伟大意义在于", "options": {"A": "实现了中国人民梦寐以求的民族独立和人民解放", "B": "从根本上改变了中国社会的发展方向，为实现中华民族伟大复兴开辟了广阔道路", "C": "是继俄国十月社会主义革命和世界反法西斯战争胜利后世界历史中最重大的事件", "D": "毛泽东思想和中国革命道路对于马克思列宁主义的发展是一个重大的贡献\n第八章 中华人民共和国的成立与中国社会主义建设道路的探索"}, "answer": "ABCD"}, {"id": "p4m-97", "num": 97, "type": "multiple", "stem": "新民主主义革命的胜利，中华人民共和国的成立，实现了中国从几千年封建专制政治向人民民\n主的伟大飞跃，实现了中国高度统一和各民族空前团结。中国人从此站立起来了，从此把命运\n牢牢掌握在自己手中，成为国家、社会和自己命运的主人，中华民族发展进步从此开启了新纪\n元。新民主主义革命的胜利，中华人民共和国的成立", "options": {"A": "彻底结束了旧中国半殖民地半封建社会的历史", "B": "彻底结束了极少数剥削者统治广大劳动人民的历史", "C": "彻底结束了旧中国一盘散沙的局面", "D": "彻底废除了列强强加给中国的不平等条约和帝国主义在中国的一切特权"}, "answer": "ABCD"}, {"id": "p4m-98", "num": 98, "type": "multiple", "stem": "新中国成立初期，面临着许多严重的困难和紧迫的问题。这对于刚刚执掌全国政权的中国共产\n党来说，是新的严峻考验。中国共产党和人民政府采取一系列积极稳健的政策措施，有条不紊\n地领导全国各族人民进行捍卫巩固新政权、建设新中国的伟大斗争。新中国成立初期面临的严\n峻考验有", "options": {"A": "能不能保卫住革命胜利成果，巩固新生人民政权", "B": "能不能战胜严重经济困难，迅速恢复和发展国民经济", "C": "能不能巩固民族独立，维护国家主权和安全", "D": "能不能经受住全国执政的新考验，继续保持优良传统和作风"}, "answer": "ABCD"}, {"id": "p4m-99", "num": 99, "type": "multiple", "stem": "经过艰苦卓绝的战斗，中朝军队战胜武装到牙齿的强敌，打破了美军不可战胜的神话，迫使不\n可一世的侵略者于1953年7月27日在停战协定上签字。抗美援朝战争的伟大胜利", "options": {"A": "打出了国威军威，打出了中国人民的精气神", "B": "捍卫了新中国安全，彰显了新中国大国地位", "C": "使新中国在错综复杂的国内国际环境中站稳了脚跟", "D": "是中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点"}, "answer": "ABC"}, {"id": "p4m-101", "num": 101, "type": "multiple", "stem": "新中国成立后的最初三年，在着重完成民主革命的遗留任务的同时，社会主义革命的任务实际\n上也已经开始实行了。以下属于开始实行社会主义革命任务表现的有", "options": {"A": "在全国开展镇压反革命的运动", "B": "没收官僚资本，确立社会主义国营经济的领导地位", "C": "开始将资本主义纳入国家资本主义轨道", "D": "在新解放区进行土改"}, "answer": "BC"}, {"id": "p4m-102", "num": 102, "type": "multiple", "stem": "从1953年开始，在过渡时期总路线的指引下，中国共产党领导人民开始进行有计划的社会主\n义建设和有系统的社会主义改造。当时中国之所以要着力进行和可能进行社会主义改造，主要\n是因为", "options": {"A": "社会主义工业化是国家独立富强的首要条件", "B": "资本主义经济力量弱小，发展困难，不可能成为中国工业起飞的基础", "C": "对个体农业进行社会主义改造，是保证工业发展、实现国家工业化的一个必要条件", "D": "当时的国际环境也促使中国选择社会主义"}, "answer": "ABCD"}, {"id": "p4m-103", "num": 103, "type": "multiple", "stem": "在进行社会主义改造、向社会主义过渡的进程中，中国共产党积累了丰富的历史经验，包括坚\n持社会主义工业化建设与社会主义改造同时并举，采取积极引导、逐步过渡的方式及用和平方\n法进行改造。在以下逐步过渡的方式中，在性质上属于半社会主义性质的形式是", "options": {"A": "手工业供销合作社", "B": "全行业的公私合营", "C": "初级农业生产合作社", "D": "个别企业的公私合营"}, "answer": "ACD"}, {"id": "p4m-105", "num": 105, "type": "multiple", "stem": "中华人民共和国成立、社会主义制度的建立", "options": {"A": "是中国历史上最深刻最伟大的社会变革", "B": "为当代中国一切发展进步奠定了根本政治前提和制度基础", "C": "为中国发展富强、中国人民生活富裕奠定了坚实基础", "D": "实现了中华民族由不断衰落到根本扭转命运、持续走向繁荣富强的伟大飞跃"}, "answer": "ABCD"}, {"id": "p4m-107", "num": 107, "type": "multiple", "stem": "1954年9月，中华人民共和国的缔造者们，同经过普选产生的1200多名全国人大代表一道，\n召开了第一届全国人民代表大会第一次会议，讨论并通过了《中华人民共和国宪法》。《中华人\n民共和国宪法》", "options": {"A": "巩固了中国人民革命胜利的历史成果和新中国成立以来政治上、经济上的新胜利", "B": "把实际生活中已经发生的重大社会变革用法律的形式肯定下来", "C": "是中国走向社会主义民主和法制建设的一个良好开端", "D": "是中国进入社会主义社会最主要的标志"}, "answer": "ABC"}, {"id": "p4m-108", "num": 108, "type": "multiple", "stem": "毛泽东提出，处理中国共产党与民主党派的关系，应坚持的方针是", "options": {"A": "长期共存", "B": "互相监督", "C": "肝胆相照", "D": "荣辱与共"}, "answer": "AB"}, {"id": "p4m-111", "num": 111, "type": "multiple", "stem": "1964年底，周恩来在三届全国人大一次会议上郑重提出实现“四个现代化”的历史任务。中\n央还确定分两步走实现现代化的战略构想，即从第三个五年计划开始，第一步，经过三个五年\n计划时期，建立一个独立的、比较完整的工业体系和国民经济体系；第二步，全面实现农业、\n工业、国防和科学技术的现代化，使中国经济走在世界前列。到1978年，我国建立起了独立\n的、比较完整的工业体系和国民经济体系。独立的、比较完整的工业体系和国民经济体系的\n建立", "options": {"A": "从根本上解决了工业化中“从无到有”的问题", "B": "使中国在赢得政治上的独立后赢得了经济上的独立", "C": "为中国以后的发展奠定了牢固的物质技术基础", "D": "为中国同世界各国在平等互利的原则下发展对外贸易和经济往来创建了前提"}, "answer": "ABCD"}, {"id": "p4m-112", "num": 112, "type": "multiple", "stem": "从新中国成立到改革开放前夕，党领导人民完成社会主义革命，消灭一切剥削制度", "options": {"A": "实现了中华民族有史以来最为广泛而深刻的社会变革", "B": "实现了一穷二白、人口众多的东方大国大步迈进社会主义社会的伟大飞跃", "C": "为在新的历史时期开创中国特色社会主义提供了宝贵经验、理论准备、物质基础", "D": "向世界庄严宣告，只有社会主义才能救中国，只有社会主义才能发展中国\n第九章 改革开放与中国特色社会主义的开创和发展"}, "answer": "ABCD"}, {"id": "p4m-113", "num": 113, "type": "multiple", "stem": "改革开放和社会主义现代化建设新时期，党面临的主要任务是", "options": {"A": "继续探索中国建设社会主义的正确道路", "B": "解放和发展社会生产力", "C": "使人民摆脱贫困、尽快富裕起来", "D": "为实现中华民族伟大复兴提供充满新的活力的体制保证和快速发展的物质条件"}, "answer": "ABCD"}, {"id": "p4m-114", "num": 114, "type": "multiple", "stem": ",1978年12月，邓小平在为党的十一届三中全会做准备的中央工作会议上发表了《解放思想，\n实事求是，团结一致向前看》的重要讲话，这个讲话", "options": {"A": "实际上是党的十一届三中全会的主题报告", "B": "是解放思想、开辟新时期新道路的宣言书", "C": "标志着党在指导思想上的拨乱反正胜利完成", "D": "为党的十一届三中全会实现具有划时代意义的伟大转折奠定了重要基础"}, "answer": "ABD"}, {"id": "p4m-115", "num": 115, "type": "multiple", "stem": "1978年12月，党召开十一届三中全会，实现了新中国成立以来党的历史上具有深远意义的伟\n大转折。党的十一届三中全会", "options": {"A": "重新确立解放思想、实事求是的思想路线", "B": "停止使用“以阶级斗争为纲”的错误提法", "C": "作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策", "D": "成为正本清源、拨乱反正和改革开放的思想先导"}, "answer": "ABC"}, {"id": "p4m-116", "num": 116, "type": "multiple", "stem": "1981年，党的十一届六中全会通过的《关于建国以来党的若干历史问题的决议》,彻底否定了\n“文化大革命”,对新中国成立以来的重大历史事件和重要历史人物作出了基本结论，科学地评\n价了毛泽东和毛泽东思想的历史地位，对毛泽东思想的科学体系和活的灵魂(实事求是、群众\n路线、独立自主)作了概括，强调毛泽东思想是我们党的宝贵的精神财富，它将长期指导我们\n的行动。《关于建国以来党的若干历史问题的决议》", "options": {"A": "重新确立解放思想、实事求是的思想路线", "B": "明确社会主义改造基本完成以后我国所要解决的主要矛盾", "C": "标志着党在指导思想上的拨乱反正胜利完成", "D": "实质上初步提出了在中国建设什么样的社会主义和怎样建设社会主义的问题"}, "answer": "BCD"}, {"id": "p4m-117", "num": 117, "type": "multiple", "stem": "1992年，邓小平在视察南方的谈话中阐述了一系列重要思想，其中最主要的有", "options": {"A": "关于社会主义初级阶段基本经济制度的思想", "B": "关于发展才是硬道理的思想", "C": "关于社会主义本质的思想", "D": "关于计划和市场都是经济手段的思想"}, "answer": "BCD"}, {"id": "p4m-118", "num": 118, "type": "multiple", "stem": "1992年1月18日至2月21日，邓小平先后到武昌、深圳、珠海、上海等地视察，发表了一\n系列重要谈话，即南方谈话。邓小平的南方谈话", "options": {"A": "从理论上深刻回答了长期困扰和束缚人们思想的许多重大问题", "B": "是把改革开放和现代化建设推向新阶段的又一个解放思想、实事求是的宣言书", "C": "对之后召开的党的十四大具有十分重要的指导作用", "D": "开启了我国改革开放和社会主义现代化建设新时期\n第十章 中国特色社会主义进入新时代"}, "answer": "ABC"}, {"id": "p4m-119", "num": 119, "type": "multiple", "stem": "党的十八大以来，中国特色社会主义进入新时代。党面临的主要任务是", "options": {"A": "实现第一个百年奋斗目标", "B": "开启实现第二个百年奋斗目标新征程", "C": "为实现中华民族伟大复兴提供充满新的活力的体制保证和快速发展的物质条件", "D": "朝着实现中华民族伟大复兴的宏伟目标继续前进"}, "answer": "ABD"}]}, {"id": "p5s", "title": "第五部分 思法 · 单选", "part": 5, "type": "single", "questions": [{"id": "p5s-1", "num": 1, "type": "single", "stem": "法律是成文的道德，道德是内心的法律。法律和思想道德的共同点在于", "options": {"A": "都发挥引领和教化作用", "B": "都发挥规范和强制作用", "C": "都提供思想指引和价值基础", "D": "都属于上层建筑的重要组成部分"}, "answer": "ABCD"}, {"id": "p5s-2", "num": 2, "type": "single", "stem": "在网络世界里，一句恶毒的话语、一个带节奏的帖子、一个随意剪切的视频，经过一次次传播\n后，影响可能被无限放大，给受害者及其家庭造成毁灭性打击。身处“人人都有麦克风”的网络\n社会，在享受多元表达的同时，每个人都可能成为网络暴力的受害者。如何有效治理网络暴力，\n成为社会治理面临的重要挑战。除了从道德层面进行教育和引导，倡导大家提高素质，尊重社会\n公德和伦理道德，还应该通过更加完善的法律制度保护受害者，追责施暴者，震慑违法行为，切\n实维护好广大网民的合法权益。整治网络暴力，共建清朗网络家园，既要靠道德，又要靠法律，\n这是因为", "options": {"A": "法律和道德都具有规范社会行为、维护社会秩序的作用", "B": "法律和道德两种规范的实现方式相同", "C": "法律和道德两种规范的实施载体相同", "D": "法律和道德两种规范调节的领域相同"}, "answer": "ABCD"}, {"id": "p5s-3", "num": 3, "type": "single", "stem": "道德和法律是维护社会秩序的两种重要手段。下列关于二者关系的说法中，正确的是", "options": {"A": "法律是道德形成的基础，能够为道德规范的制定提供依据", "B": "凡是道德所反对和谴责的行为，必定是法律所制裁的行为", "C": "法律的调节更具有广泛性，能够渗透到道德不能调节的领域", "D": "凡是法律所禁止和制裁的行为，通常也是道德所反对和谴责的行为\n第一章 领悟人生真谛 把握人生方向"}, "answer": "ABC"}, {"id": "p5s-4", "num": 4, "type": "single", "stem": "人生观是人们关于人生目的、人生态度、人生价值等问题的总观点和总看法。对人的认识，核心\n在于认识", "options": {"A": "人的本质", "B": "人的属性", "C": "人的行为", "D": "人的阶级关系"}, "answer": "ABCD"}, {"id": "p5s-5", "num": 5, "type": "single", "stem": "人生观主要是通过人生目的、人生态度和人生价值三个方面体现出来的。其中核心是", "options": {"A": "人生目的", "B": "人生态度", "C": "人生价值", "D": "人生意义"}, "answer": "ABD"}, {"id": "p5s-6", "num": 6, "type": "single", "stem": "爱因斯坦说过：“一个人的价值，应该看他贡献什么,而不应当看他取得什么。”这句话的启示是", "options": {"A": "人的自我价值是无足轻重的", "B": "人的自我价值与社会价值不能同时实现", "C": "社会价值是人的唯一价值", "D": "人的价值在于奉献而不在于索取"}, "answer": "D"}, {"id": "p5s-7", "num": 7, "type": "single", "stem": "“为掩护战友身负重伤的扫雷英雄”杜富国，“用爱照亮山区女孩人生梦想的教育燃灯者”张桂\n梅，“为莫高窟研究保护倾尽一生的敦煌女儿”樊锦诗，“60多年深藏功名的战斗英雄”张富\n清，以及在黄山风景区分别从事环卫保洁和迎客松守护工作的“中国好人”李培生、胡晓春等\n平凡英雄，他们最可贵的地方就是在平凡的工作中创造了不平凡的业绩。他们的事迹告诉我们，\n评价人生价值的根本尺度，是看一个人的", "options": {"A": "劳动以及通过劳动对社会和他人作出的贡献", "B": "个人社会地位的高低", "C": "个人成绩的大小", "D": "实践活动是否符合社会发展的客观规律，是否促进了历史的进步"}, "answer": "D"}, {"id": "p5s-8", "num": 8, "type": "single", "stem": "认识和处理人生问题的重要着眼点和出发点是", "options": {"A": "个人与群众的关系问题", "B": "个人与社会的关系问题", "C": "个人与国家的关系问题", "D": "个人与集体的关系问题"}, "answer": "B"}, {"id": "p5s-9", "num": 9, "type": "single", "stem": "个人与社会的关系，最根本的是", "options": {"A": "人的自然属性与社会属性的关系", "B": "个人需要与社会需要的关系", "C": "享受个人权利与承担社会责任的关系", "D": "个人利益与社会利益的关系"}, "answer": "ABCD"}, {"id": "p5s-10", "num": 10, "type": "single", "stem": "“塞翁失马，焉知非福”,这句话对我们辩证对待人生矛盾的启示是", "options": {"A": "不要拘泥于个人利益的得失", "B": "不要满足于一时的得", "C": "不要惧怕一时的失", "D": "要树立正确的幸福观\n第二章 追求远大理想 坚定崇高信念"}, "answer": "C"}, {"id": "p5s-15", "num": 15, "type": "single", "stem": "孙中山先生说，做人最大的事情，“就是要知道怎么样爱国”。习近平指出：“爱国，是人世间最\n深沉、最持久的情感，是一个人立德之源、立功之本。”“气节也好，人格也好，爱国是第一位\n的。”检验一个人对祖国忠诚程度的试金石是", "options": {"A": "对民族利益共同体的自觉认同", "B": "对祖国大好河山的热爱程度", "C": "对祖国灿烂文化的认同程度", "D": "对民族优良传统的熟悉程度"}, "answer": "A"}, {"id": "p5s-16", "num": 16, "type": "single", "stem": "爱国主义是具体的、现实的。当代中国爱国主义精神最重要的体现是", "options": {"A": "维护祖国统一和民族团结", "B": "坚持爱国和爱党、爱社会主义相统一", "C": "尊重和传承中华民族历史文化", "D": "坚持立足中国又面向世界"}, "answer": "B"}, {"id": "p5s-17", "num": 17, "type": "single", "stem": "1935年，在中华民族危急存亡之际，著名教育家张伯苓在南开大学开学典礼上问了三个问题：\n“你是中国人吗?你爱中国吗?你愿意中国好吗?”振奋了师生爱国斗志。习近平强调，这三个\n问题是历史之问，更是时代之问、未来之问，我们要一代一代问下去、答下去!新时代爱国主\n义教育的鲜明主题是", "options": {"A": "全面建成社会主义现代化强国、实现中华民族伟大复兴", "B": "维护祖国统一和民族团结", "C": "广泛开展党史、国史、改革开放史教育", "D": "大力弘扬民族精神和时代精神"}, "answer": "A"}, {"id": "p5s-19", "num": 19, "type": "single", "stem": "富强、民主、文明、和谐，这一价值追求回答了我们", "options": {"A": "要建设什么样的国家的重大问题", "B": "要建设什么样的社会的重大问题", "C": "要建设什么样的政府的重大问题", "D": "要培育什么样的公民的重大问题"}, "answer": "A"}, {"id": "p5s-20", "num": 20, "type": "single", "stem": "自由、平等、公正、法治，这一价值追求回答了我们要建设什么样的社会的重大问题，反映了\n人们对美好社会的期望和憧憬，是", "options": {"A": "衡量现代社会是否高度发展、充满活力、和谐有序的重要标志", "B": "判断社会性质的主要标准", "C": "社会进步的根本内容", "D": "衡量社会进步的根本尺度"}, "answer": "A"}, {"id": "p5s-21", "num": 21, "type": "single", "stem": "人民当家作主的社会主义制度，为社会主义核心价值观的真正实现奠定了根本的制度前提和制\n度保障，使得自由、民主、公正等价值观“不是装饰品，不是用来做摆设的，而是要用来解决\n人民要解决的问题的”。这体现的是社会主义核心价值观具有的", "options": {"A": "先进性", "B": "人民性", "C": "普适性", "D": "真实性"}, "answer": "D"}, {"id": "p5s-22", "num": 22, "type": "single", "stem": "社会主义核心价值观的根本特性是", "options": {"A": "先进性", "B": "人民性", "C": "普适性", "D": "真实性"}, "answer": "A"}, {"id": "p5s-24", "num": 24, "type": "single", "stem": "道德属于上层建筑的范畴，是一种特殊的社会意识形态。作为人类社会特有的一种社会现象，\n道德是人类社会发展到一定阶段的必然产物。道德起源的第一个历史前提是", "options": {"A": "意识", "B": "劳动", "C": "情感欲望", "D": "动物本能"}, "answer": "B"}, {"id": "p5s-25", "num": 25, "type": "single", "stem": "恩格斯说：“人们自觉地或不自觉地，归根到底总是从他们阶级地位所依据的实际关系中——从\n他们进行生产和交换的经济关系中，获得自己的伦理观念。”这说明，道德的产生、发展和变\n化，归根结底源于", "options": {"A": "社会意识形态", "B": "社会经济关系", "C": "社会存在", "D": "社会的阶级关系"}, "answer": "B"}, {"id": "p5s-26", "num": 26, "type": "single", "stem": "道德具有多方面的功能和效力。通过评价等方式，指导和纠正人们的行为和实践活动、协调社\n会关系和人际关系的功效与能力，是道德的", "options": {"A": "认识功能", "B": "调节功能", "C": "导向功能", "D": "规范功能"}, "answer": "B"}, {"id": "p5s-27", "num": 27, "type": "single", "stem": "道德调节的主要形式是", "options": {"A": "道德评价", "B": "社会舆论", "C": "传统习俗", "D": "内心信念"}, "answer": "A"}, {"id": "p5s-28", "num": 28, "type": "single", "stem": "道德发挥作用的性质是由", "options": {"A": "社会发展的历史阶段决定的", "B": "道德所反映的经济基础、代表的阶级利益决定的", "C": "道德的性质决定的", "D": "上层建筑的性质决定的"}, "answer": "B"}, {"id": "p5s-29", "num": 29, "type": "single", "stem": "集体主义可以增强一个人恪尽职守、担当任事的责任心，可以激发一个人面对困难和危险不退\n缩的战斗力，赋予一个人光辉的人格、英雄的风范。集体主义最高层次的道德要求是", "options": {"A": "先公后私、先人后己", "B": "顾全大局、遵纪守法", "C": "无私奉献、一心为公", "D": "热爱祖国、诚实劳动"}, "answer": "C"}, {"id": "p5s-31", "num": 31, "type": "single", "stem": "中国革命道德是指中国共产党人、人民军队、一切先进分子和人民群众在中国革命、建设、改\n革中所形成的优秀道德，是马克思主义与中国革命、建设、改革的伟大实践相结合的产物，是\n中华民族极其宝贵的道德财富。中国革命道德的灵魂是", "options": {"A": "坚持社会主义和共产主义理想信念", "B": "全心全意为人民服务", "C": "始终把革命利益放在首位", "D": "修身自律、保持节操"}, "answer": "A"}, {"id": "p5s-32", "num": 32, "type": "single", "stem": "记者在采访诺贝尔生理学或医学奖得主、中国女药学家屠呦呦时问她：“你在小鼠和猴子身上测\n试了青蒿素，证明它是有效的之后，你自己也服了药。你害怕吗?”屠呦呦答：“我们担心药物\n是否安全。我和两位同事服了药，表明药不会死人。我认为这是我作为药物化学家的责任和工\n作的一部分。”屠呦呦的回答展现了崇高的社会主义职业道德。社会主义职业道德的最高层次的\n要求是", "options": {"A": "诚实守信", "B": "办事公道", "C": "热情服务", "D": "奉献社会"}, "answer": "D"}, {"id": "p5s-33", "num": 33, "type": "single", "stem": "从业人员在职业活动中做到公平、公正，不损公肥私，不以权谋私，不假公济私，这是职业道德中", "options": {"A": "爱岗敬业的要求", "B": "热情服务的要求", "C": "办事公道的要求", "D": "奉献社会的要求"}, "answer": "C"}, {"id": "p5s-34", "num": 34, "type": "single", "stem": "习近平指出：“家庭是社会的基本细胞，是人生的第一所学校。不论时代发生多大变化，不论生\n活格局发生多大变化，我们都要重视家庭建设，注重家庭、注重家教、注重家风。”以下符合家\n庭美德的选项有", "options": {"A": "“远亲不如近邻”", "B": "“君子成人之美”", "C": "“为善最乐”", "D": "“博施济众”"}, "answer": "A"}, {"id": "p5s-35", "num": 35, "type": "single", "stem": "在社会道德建设中具有基础性作用的是", "options": {"A": "社会公德", "B": "职业道德", "C": "家庭美德", "D": "个人品德"}, "answer": "D"}, {"id": "p5s-36", "num": 36, "type": "single", "stem": "“吾
