方式下，规则只能\n作为没有规则性的盲目起作用的平均数规律来为自己开辟道路。”这说明，从较长时间来看", "options": {"A": "价格高于价值的部分和价格低于价值的部分能够相抵", "B": "垄断高价高于生产价格的部分和垄断低价低于生产价格的部分能够相抵", "C": "商品的平均价格和价值是相一致的", "D": "商品价格的波动会逐渐减小直到完全消失"}, "answer": "AC"}, {"id": "p1m-124", "num": 124, "type": "multiple", "stem": "价值规律是商品经济的基本经济规律，它贯穿于商品经济的全部过程。价值规律的作用表现在", "options": {"A": "自发地调节生产资料和劳动力在社会各生产部门之间的分配比例", "B": "自发地调节雇佣工人与资本家之间的利益再分配", "C": "自发地刺激社会生产力的发展", "D": "自发地调节社会收入的分配"}, "answer": "ACD"}, {"id": "p1m-125", "num": 125, "type": "multiple", "stem": "消费者的下列经济行为中，属于货币执行支付手段职能的有", "options": {"A": "购买商品房，合同约定房价30万元", "B": "按购房合同约定，第二年付房款10万元", "C": "缴纳房屋契税9000元", "D": "在装饰材料市场现购材料5万元"}, "answer": "BC"}, {"id": "p1m-126", "num": 126, "type": "multiple", "stem": "在以私有制为基础的商品经济中，商品生产者的劳动具有两重性：既是具有社会性质的社会劳\n动，又是具有私人性质的私人劳动。私人劳动和社会劳动的矛盾", "options": {"A": "构成私有制基础上商品经济的基本矛盾", "B": "决定着商品经济的本质及发展过程", "C": "是商品经济其他一切矛盾的基础", "D": "决定着商品生产者的命运"}, "answer": "ABCD"}, {"id": "p1m-127", "num": 127, "type": "multiple", "stem": "通过对商品关系的深刻分析，马克思阐明了商品的二因素和生产商品的劳动的二重性及其相互\n关系、价值的质和量的规定性及其变化规律、价值形式的发展和货币的起源、商品经济的基本\n矛盾和基本规律及其作用，形成了科学的劳动价值论。马克思劳动价值论的重大意义在于", "options": {"A": "首次提出了劳动创造价值的观点", "B": "揭示了私有制条件下商品经济的基本矛盾", "C": "为剩余价值论的创立奠定了基础", "D": "揭示了商品经济的一般规律，对理解社会主义市场经济具有指导意义"}, "answer": "BCD"}, {"id": "p1m-128", "num": 128, "type": "multiple", "stem": "马克思指出：“资本主义社会的经济结构是从封建社会的经济结构中产生的。后者的解体使前\n者的要素得到解放。”随着社会生产力的提高特别是封建社会后期商品经济的迅速发展，封建\n生产关系越来越成为生产力发展的障碍。资本主义萌芽于14世纪末15世纪初地中海沿岸的一\n些城市。资本主义产生的途径有", "options": {"A": "从小商品经济中分化出来", "B": "从商人和高利贷者转化而来", "C": "用暴力手段剥夺农民的土地", "D": "用暴力手段掠夺货币财富"}, "answer": "AB"}, {"id": "p1m-129", "num": 129, "type": "multiple", "stem": "劳动力是特殊的商品。除了其自身独有的特点以外，劳动力商品与其他商品的共同点有", "options": {"A": "它们都具有使用价值和价值", "B": "它们的价值都是由工人在劳动过程中再生产出来的", "C": "它们都具有价值增殖的功能", "D": "它们都属于历史范畴"}, "answer": "AD"}, {"id": "p1m-137", "num": 137, "type": "multiple", "stem": "马克思之所以把以生产资料形态存在的资本称为不变资本，是因为这部分资本在生产过程中", "options": {"A": "不转变自己的物质形态", "B": "不改变自己的价值量", "C": "不是一次性转移其全部价值", "D": "不发生增殖"}, "answer": "BD"}, {"id": "p1m-139", "num": 139, "type": "multiple", "stem": "在资本主义商品生产条件下，每个资本家总是力图不断改进技术，改善经营管理，提高劳动生\n产率。率先提高劳动生产率的企业", "options": {"A": "其个别劳动时间少于社会必要劳动时间", "B": "生产商品的个别价值低于社会价值", "C": "可以获得超额剩余价值", "D": "在商品交换时不受价值规律制约"}, "answer": "ABC"}, {"id": "p1m-140", "num": 140, "type": "multiple", "stem": "在资本主义商品生产的条件下，每个资本家总是力图不断改进技术，改善经营管理，从而获得\n超额剩余价值。各个资本家追求超额剩余价值的结果是", "options": {"A": "整个资本家阶级普遍获得相对剩余价值", "B": "劳动力商品的价值增加", "C": "全社会劳动生产率的提高", "D": "剩余劳动时间缩短"}, "answer": "AC"}, {"id": "p1m-141", "num": 141, "type": "multiple", "stem": "第二次世界大战以后，资本主义生产中的自动化程度加强。自动化生产线的广泛使用，使直接\n从事生产操作的工人大大减少，甚至出现了少数所谓的“无人工厂”。这意味着，在生产自动\n化条件下", "options": {"A": "剩余价值生产所使用的生产工具更加先进", "B": "技术和科学成为独立的剩余价值源泉", "C": "资本的有机构成进一步降低", "D": "劳动的复杂程度和强度日益提高"}, "answer": "AD"}, {"id": "p1m-142", "num": 142, "type": "multiple", "stem": "马克思关于资本积累的学说是剩余价值理论的重要组成部分。资本积累是", "options": {"A": "资本主义扩大再生产的源泉", "B": "资本主义经济危机爆发的根本原因", "C": "社会财富占有两极分化的重要原因", "D": "资本主义社会失业现象产生的根源"}, "answer": "ACD"}, {"id": "p1m-146", "num": 146, "type": "multiple", "stem": "关于资本有机构成，以下说法正确的有", "options": {"A": "由生产的技术水平所决定的生产资料和劳动力之间的比例叫作资本的有机构成", "B": "在资本主义生产过程中资本有机构成的提高是一般趋势", "C": "资本有机构成的提高不可避免地形成相对过剩人口", "D": "资本有机构成是反映资本家对工人剥削程度的根本标准"}, "answer": "BC"}, {"id": "p1m-147", "num": 147, "type": "multiple", "stem": "产业资本循环不断进行的基本前提条件是", "options": {"A": "三种职能形式在时间上继起", "B": "三种职能形式在空间上并存", "C": "商品资本循环顺利进行", "D": "生产资本循环顺利进行"}, "answer": "AB"}, {"id": "p1m-149", "num": 149, "type": "multiple", "stem": "社会再生产的顺利进行，要求", "options": {"A": "生产中所耗费的资本在价值上得到补偿", "B": "实际生产过程中所耗费的生产资料和消费资料得到实物的替换", "C": "两大部类内部各个产业部门之间保持一定的比例关系", "D": "两大部类之间保持一定的比例关系"}, "answer": "ABCD"}, {"id": "p1m-150", "num": 150, "type": "multiple", "stem": "关于资本主义工资，以下说法正确的有", "options": {"A": "工资的形式主要有计时工资和计件工资", "B": "其本质是劳动力的价值或价格", "C": "在当代资本主义国家，工人的实际工资呈现不断降低的趋势", "D": "掩盖了资本主义的剥削关系"}, "answer": "ABD"}, {"id": "p1m-151", "num": 151, "type": "multiple", "stem": "下列现象中掩盖资本主义剥削关系实质或程度的有", "options": {"A": "工资表现为“劳动的价格”", "B": "剩余价值取得了利润的形态", "C": "利润转化为平均利润", "D": "资本家与工人形式上的“自由”“平等”的关系"}, "answer": "ABCD"}, {"id": "p1m-152", "num": 152, "type": "multiple", "stem": "在现实的资本主义经济生活中，资本家把剩余价值看作全部预付资本的产物或增加额，这就使得", "options": {"A": "剩余价值转化为利润", "B": "商品价值转化为生产价格", "C": "剩余价值与可变资本的关系被掩盖了", "D": "利润率总是大于剩余价值率"}, "answer": "AC"}, {"id": "p1m-153", "num": 153, "type": "multiple", "stem": "资本主义生产的目的是获得利润。不同生产部门的资本家之间为了得到尽可能多的利润必然展\n开激烈的竞争从而导致利润平均化。平均利润形成后", "options": {"A": "商品价值就转化为生产价格", "B": "价值规律的实现形式发生了变化", "C": "生产价格不再随着商品价值的变化而变动", "D": "每一个部门获得的利润都等于该部门生产的剩余价值"}, "answer": "AB"}, {"id": "p1m-155", "num": 155, "type": "multiple", "stem": "“要赢得选举，需要两样东西，一是金钱，第二个我就记不得了。”100多年前美国竞选专家\n马克·汉纳的话，不仅道出了当初的真相，而且至今依然不断被事实所证明。据统计，2024\n年美国总统选举竟选总开销至少达到159亿美元，是美国史上最贵选举。以上材料说明", "options": {"A": "资本主义的民主是金钱操纵下的民主", "B": "资本主义政治制度中的选举事实上是有钱人的游戏", "C": "法律名义上的平等掩盖着事实上的不平等", "D": "资本主义政治制度始终阻碍着社会进步和社会生产力的大幅度发展"}, "answer": "ABC"}, {"id": "p1m-157", "num": 157, "type": "multiple", "stem": "资产阶级在长期的反对封建专制主义和宗教神学的斗争中逐步形成和发展起来的各种资产阶级\n的思想理论和观念，在资本主义国家产生之后由统治阶级根据自己政治统治的需要，形成了资\n本主义国家的意识形态。资本主义国家的意识形态", "options": {"A": "是全体社会成员的共同意识", "B": "大部分内容是没有阶级性的", "C": "为资本主义的经济基础服务", "D": "是资产阶级的阶级意识的集中体现\n第五章 资本主义的发展及其趋势"}, "answer": "CD"}, {"id": "p1m-158", "num": 158, "type": "multiple", "stem": "关于生产集中和资本集中及其后果，以下认识正确的有", "options": {"A": "生产集中和资本集中是资本家追求剩余价值的结果", "B": "生产集中和资本集中发展到一定阶段必然引起垄断", "C": "生产集中和资本集中是最简单的、初级的垄断组织形式", "D": "自由竞争引起生产集中和资本集中"}, "answer": "ABD"}, {"id": "p1m-159", "num": 159, "type": "multiple", "stem": "垄断并不能消除竞争，反而使竞争变得更加复杂和剧烈。垄断条件下的竞争包括", "options": {"A": "垄断组织内部的竞争", "B": "垄断组织之间的竞争", "C": "垄断组织同非垄断组织之间的竞争", "D": "垄断资本家集团之间的竞争"}, "answer": "ABCD"}, {"id": "p1m-161", "num": 161, "type": "multiple", "stem": ",自由竞争引起生产集中和资本集中，生产集中和资本集中发展到一定阶段必然引起垄断，这是资本\n主义发展的客观规律。但是，垄断并不能消除竞争，反而使竞争变得更加复杂和激烈。这是因为", "options": {"A": "垄断没有消除产生竞争的经济条件", "B": "垄断必须通过竞争来维持", "C": "垄断并不是作为自由竞争的对立面产生的", "D": "任何垄断组织都不可能把包罗万象的社会生产全部包下来"}, "answer": "ABD"}, {"id": "p1m-162", "num": 162, "type": "multiple", "stem": "金融资本是由工业垄断资本和银行垄断资本融合在一起而形成的一种垄断资本。金融资本形成\n的主要途径包括", "options": {"A": "金融联系", "B": "资本参与", "C": "行政干预", "D": "人事参与"}, "answer": "ABD"}, {"id": "p1m-165", "num": 165, "type": "multiple", "stem": "垄断利润主要是通过垄断组织制定的垄断价格来实现的。但是，垄断价格的产生没有否定价值\n规律，这是因为，从全社会看", "options": {"A": "整个社会商品的价值仍然是由生产它们的社会必要劳动时间决定的", "B": "垄断低价低于原材料生产价格的部分仍然等于垄断高价高于出售商品生产价格的部分", "C": "垄断价格既不能增加也不能减少整个社会所生产的价值总量", "D": "商品的价格总额仍然等于商品的价值总额"}, "answer": "ACD"}, {"id": "p1m-167", "num": 167, "type": "multiple", "stem": "国家垄断资本主义的主要形式有", "options": {"A": "国家所有并直接经营企业", "B": "国家与私人共有、合营企业", "C": "国家通过多种形式参与私人垄断资本的再生产过程", "D": "宏观调节和微观规制"}, "answer": "ABCD"}, {"id": "p1m-169", "num": 169, "type": "multiple", "stem": "20世纪70年代初，由于资本主义发展不平衡的加深和国际货币体系内在矛盾的激化，布雷顿\n森林体系崩溃。随后，西方国家普遍走上金融自由化和金融创新的道路。金融垄断资本通过形\n形色色的金融衍生工具在金融市场呼风唤雨、巧取豪夺，使财富以惊人的速度膨胀。在金融垄\n断资本的推动下", "options": {"A": "金融业在国民经济中的地位大幅上升", "B": "实体经济部门不得不把利润的一部分投向金融领域", "C": "制造业就业人数严重减少，以金融为核心的服务业就业人数逐步增加", "D": "虚拟经济越来越脱离实体经济"}, "answer": "ABCD"}, {"id": "p1m-170", "num": 170, "type": "multiple", "stem": "垄断资本在国内建立了垄断统治后，必然要把其统治势力扩展到国外，建立国际垄断统治。垄\n断资本向世界范围扩展的基本形式有", "options": {"A": "技术资本输出", "B": "借贷资本输出", "C": "生产资本输出", "D": "商品资本输出"}, "answer": "BCD"}, {"id": "p1m-171", "num": 171, "type": "multiple", "stem": "垄断资本在国内建立了垄断统治后，必然要把其统治势力扩展到国外，建立国际垄断统治。垄\n断资本向世界范围扩展的主要经济动因是", "options": {"A": "将国内过剩的资本输出，以便在国外谋求高额利润", "B": "将部分非要害的技术转移到国外，以取得在别国的垄断优势", "C": "争夺商品销售市场，确保原材料和能源的可靠来源", "D": "转移经济危机风险，化解生产社会化与生产资料资本主义私人占有之间的矛盾"}, "answer": "ABC"}, {"id": "p1m-172", "num": 172, "type": "multiple", "stem": "各资本主义国家的垄断组织，通过订立协议建立起国际垄断资本的联盟，即国际垄断同盟，以\n便在世界范围形成垄断，并在经济上瓜分世界。以下说法正确的有", "options": {"A": "国际垄断同盟在经济上瓜分世界是通过垄断组织间的协议实现的", "B": "早期的国际垄断同盟主要是跨国公司", "C": "当代国际垄断同盟的形式以国际卡特尔和国家垄断资本主义的国际联盟为主", "D": "国家垄断资本主义的国际联盟是由一些资本主义国家的政府出面缔结协定所组成的国际经\n济集团"}, "answer": "AD"}, {"id": "p1m-173", "num": 173, "type": "multiple", "stem": "导致经济全球化迅猛发展的因素主要有", "options": {"A": "科学技术的进步和生产力的发展", "B": "跨国公司的发展", "C": "各国经济体制的变革和国际经济组织的发展", "D": "发展中国家的斗争"}, "answer": "ABC"}, {"id": "p1m-174", "num": 174, "type": "multiple", "stem": "经济全球化是指在生产不断发展、科技加速进步、社会分工和国际分工不断深化、生产的社会\n化和国际化程度不断提高的情况下，世界各国、各地区的经济活动越来越超出某一国家和地区\n的范围而相互联系、相互依存的过程。以下说法正确的有", "options": {"A": "经济全球化可以带来巨大的分工利益，推动世界生产力的发展", "B": "不仅发达国家从中受益，一些发展中国家在参与经济全球化进程中也得到了快速发展", "C": "在经济全球化进程中，资金、技术等生产要素可以在国际社会流动和优化配置", "D": "国际金融危机是经济全球化发展的必然产物"}, "answer": "ABC"}, {"id": "p1m-175", "num": 175, "type": "multiple", "stem": ",经济全球化是一把“双刃剑”,它在促进经济发展的同时也带来了一些负面影响，主要表现有", "options": {"A": "发达国家与发展中国家在经济全球化进程中的地位和收益不平等、不平衡", "B": "加剧了发展中国家资源短缺和环境污染", "C": "一定程度上增加了经济风险", "D": "使发展中国家丧失了更多的就业机会"}, "answer": "ABC"}, {"id": "p1m-176", "num": 176, "type": "multiple", "stem": "第二次世界大战后，资本主义生产资料所有制发生了新的变化，国家资本所有制形成并发挥重\n要作用。国家资本所有制", "options": {"A": "取代法人资本所有制成为居主导地位的资本所有制形式", "B": "主要存在于基础设施和公共事业部门", "C": "对整个社会经济的发展有着重要的影响", "D": "体现着总资本家剥削雇佣劳动者的关系"}, "answer": "BCD"}, {"id": "p1m-178", "num": 178, "type": "multiple", "stem": "第二次世界大战后资本主义国家在劳资关系和分配关系上出现的变化有", "options": {"A": "职工参与决策", "B": "终身雇佣、职工持股", "C": "建立并实施了普及化、全民化的社会福利制度", "D": "建立职工选举管理者制度"}, "answer": "ABC"}, {"id": "p1m-179", "num": 179, "type": "multiple", "stem": "第二次世界大战后，资本主义国家为尽快恢复国民经济，在继续发挥市场机制主导性作用的同\n时，开始对经济进行全面干预。但是，从20世纪70年代起，随着资本主义经济陷入滞胀和新\n自由主义思潮的泛滥，西方国家普遍走上强化市场调节、弱化政府干预的道路，即", "options": {"A": "通过国有企业私有化来提升经济竞争力", "B": "通过福利制度改革，减少政府的财政负担", "C": "通过政治制度多元化，扩大公民权利", "D": "通过放松对经济和金融的管制，释放经济活力"}, "answer": "ABD"}, {"id": "p1m-181", "num": 181, "type": "multiple", "stem": "第二次世界大战后，由于多种社会因素的影响，资本主义发生了一系列变化。其中在政治制度\n上的变化有", "options": {"A": "政治制度出现多元化的趋势，公民权利有所扩大", "B": "通过建立政策咨询机构等方式允许民众直接参与政策的制定和执行", "C": "普遍加强了法治建设，以便协调社会各阶级、阶层的利益", "D": "改良主义政党在政治舞台上的影响日益扩大"}, "answer": "ACD"}, {"id": "p1m-185", "num": 185, "type": "multiple", "stem": "进入21世纪以来，资本主义呈现出一些新变化、新特征。科技创新加速资本主义生产方式变\n化，这表现在", "options": {"A": "产业结构的调整", "B": "生产组织和劳动形式的变化", "C": "社会阶级层级结构呈现复杂性、多样化", "D": "新经济形态的出现"}, "answer": "ABD"}, {"id": "p1m-186", "num": 186, "type": "multiple", "stem": "进入21世纪以来，资本主义呈现出一些新变化、新特征。国际金融垄断资本主义影响日益显\n现，国际金融资本的垄断成为当代资本主义最突出、最鲜明、最主要的特征，这表现在", "options": {"A": "金融垄断寡头化", "B": "金融垄断国际化", "C": "经济虚拟化", "D": "产业空心化"}, "answer": "ABCD"}, {"id": "p1m-187", "num": 187, "type": "multiple", "stem": "当前，百年变局加速演进，国际格局和国际体系深刻调整，全球治理体系深刻变革，国际力量\n对比正在发生近代以来最具革命性的变化，世界进入新的动荡变革期。资本主义社会问题加速\n积累，资本主义国家内部的矛盾和冲突日益明显，表现为", "options": {"A": "经济发展失调", "B": "政治体制失灵", "C": "社会融合机制失效", "D": "生态领域失控"}, "answer": "ABC"}, {"id": "p1m-189", "num": 189, "type": "multiple", "stem": "长期以来，西方国家标榜民主并不遗余力地向外输出民主，但近年来移植西式民主的国家陷入\n动荡，西方国家本身也出现了某些治理危机，暴露出西式民主的弊端和局限，具体表现在", "options": {"A": "西式选举往往难以选贤", "B": "政党利益可能凌驾于国家利益之上", "C": "“民主陷阱”会阻碍国家治理", "D": "传统精英政治走向衰落"}, "answer": "ABCD"}, {"id": "p1m-190", "num": 190, "type": "multiple", "stem": "资本积累的本质，就是资本家不断地利用无偿占有的工人创造的剩余价值来扩大自己的资本规\n模，从而进一步扩大和加强对工人的剥削和统治。资本的不断积累", "options": {"A": "必然提高生产的社会化程度", "B": "在客观上势必导致生产集中和资本集中", "C": "为否定资本主义制度自身准备了物质条件", "D": "必然不断增强资本家个人在管理中的地位和作用\n第六章 社会主义的发展及其规律"}, "answer": "ABC"}, {"id": "p1m-191", "num": 191, "type": "multiple", "stem": "社会主义从空想发展到科学，是因为马克思、恩格斯在新的历史条件下创立了", "options": {"A": "唯物史观", "B": "剩余价值学说", "C": "无产阶级革命学说", "D": "无产阶级政党学说"}, "answer": "AB"}, {"id": "p1m-192", "num": 192, "type": "multiple", "stem": "19世纪初期以圣西门、傅立叶、欧文为代表的批判的空想社会主义者，他们", "options": {"A": "在理论上致力于对社会制度的分析", "B": "对资本主义旧制度的辛辣批判，包含着许多切中要害的见解", "C": "对社会主义新制度的描绘，闪烁着诸多天才的火花", "D": "阐明了资本主义制度下雇佣奴隶制的本质，为启发工人觉悟提供了极为宝贵的材料"}, "answer": "ABC"}, {"id": "p1m-193", "num": 193, "type": "multiple", "stem": "科学社会主义自产生之后，逐步与工人运动相结合，指导无产阶级政党的革命斗争，并在这个\n过程中不断完善和发展。1864年，国际工人协会(第一国际)应运而生。1871年巴黎公社革\n命爆发。巴黎公社革命", "options": {"A": "是第一国际精神的产儿", "B": "是无产阶级夺取政权的第一次伟大尝试", "C": "证明了社会主义革命可以首先在一个或者几个国家获得胜利", "D": "使社会主义从理想变为现实"}, "answer": "AB"}, {"id": "p1m-197", "num": 197, "type": "multiple", "stem": "1921年3月，俄共(布)召开十大，毅然决定从战时共产主义政策过渡到实行新经济政策。\n俄共(布)十大决定实行新经济政策，是因为", "options": {"A": "国家从战争转入和平经济建设时期，战时共产主义政策无法调动生产者尤其是农民的积极性", "B": "国民经济已濒临崩溃，国内发生严重的经济和政治危机", "C": "如不改变政策，执政党将会失去广大群众，丢掉阶级基础", "D": "需要为实行农业集体化摸索经验"}, "answer": "ABC"}, {"id": "p1m-198", "num": 198, "type": "multiple", "stem": "1921年3月，俄共(布)召开十大，毅然决定从战时共产主义政策过渡到实行新经济政策。\n这一决定，表明列宁的社会主义建设思想发生了重大转变，对俄国这样一个小农占优势的国家\n如何走向社会主义又有了新的认识，标志着列宁正在探索一条符合俄国国情的建设社会主义的\n道路。新经济政策的主要内容有", "options": {"A": "取消粮食税制以调动农民的积极性", "B": "允许私人自由贸易，恢复商品货币关系", "C": "允许私人小工业企业发展", "D": "采取一些国家资本主义的形式来发展生产"}, "answer": "BCD"}, {"id": "p1m-199", "num": 199, "type": "multiple", "stem": "1921年3月，俄共(布)召开十大，毅然决定从战时共产主义政策过渡到实行以发展商品经\n济为主要特征的新经济政策。新经济政策的实施", "options": {"A": "完成了农业合作化，在广大农村建立起了社会主义的制度基础", "B": "扭转了国家的严重危机，改善了工人、农民和其他劳动者的物质文化生活", "C": "活跃了苏维埃的城乡经济，发展了生产，大大加强了苏维埃的社会主义经济基础", "D": "标志着苏联模式开始形成"}, "answer": "BC"}, {"id": "p1m-201", "num": 201, "type": "multiple", "stem": "在俄国社会主义革命取得胜利的初期，特别是实行新经济政策期间，列宁对苏维埃俄国如何建\n设社会主义进行了深刻的理论思考，提出了许多精辟的论述。列宁对马克思主义的重大贡献，\n也是他留给后人的最宝贵的思想遗产是", "options": {"A": "能够正视国情，面对一系列新情况和新问题，不拘泥于书本上已有的结论，而是“根据经\n验来谈论社会主义”", "B": "一切从实际出发，尊重千百万群众的实践，勇于探索，大胆创新", "C": "努力把马克思主义基本原理同俄国的具体实际相结合，探索出一条适合俄国国情的社会主\n义道路", "D": "实现了工业化和农业集体化，形成了建设社会主义的苏联模式"}, "answer": "ABC"}, {"id": "p1m-202", "num": 202, "type": "multiple", "stem": "列宁晚年虽然病魔缠身，但仍然没有停止对社会主义事业的思考。他在口授的《日记摘录》\n《论合作社》《论我国革命》《我们怎样改组工农检查院》《宁肯少些，但要好些》等被人们称\n为“政治遗嘱”的文章和书信中，对十月革命以来所走过的道路进行了深入的思考，提出了建\n设社会主义的新构想。这些思想主要包括", "options": {"A": "用合作社的形式将农民引向社会主义道路", "B": "发展大工业，实现工业化和电气化", "C": "学习和利用资本主义的一切东西", "D": "进行文化革命，大力发展文化教育事业"}, "answer": "ABD"}, {"id": "p1m-205", "num": 205, "type": "multiple", "stem": "“由于历史进程的曲折而不得不开始社会主义革命的那个国家愈落后，它由旧的资本主义关系\n过渡到社会主义关系就愈困难。”列宁的这段话说明，无产阶级及其政党可以在经济文化相对\n落后的国家取得政权，建立起崭新的社会主义制度，但是，在这样的国家建设社会主义必然具\n有长期性。其原因主要有", "options": {"A": "生产力发展状况的制约", "B": "经济基础和上层建筑发展状况的制约", "C": "国际环境的严峻挑战", "D": "改良主义政党在政治舞台上的影响日益扩大"}, "answer": "ABC"}, {"id": "p1m-207", "num": 207, "type": "multiple", "stem": "社会主义发展道路具有多样性，无产阶级执政党必须领导本国人民，努力探索适合自己国情的\n社会主义发展道路。探索社会主义发展道路，必须", "options": {"A": "坚持对待马克思主义的科学态度", "B": "从当时当地的历史条件出发，坚持“走自己的路”", "C": "充分吸收人类一切优秀文明成果", "D": "坚持问题导向，从马克思主义经典作家的著作中寻找具体问题的答案"}, "answer": "ABC"}, {"id": "p1m-208", "num": 208, "type": "multiple", "stem": "习近平指出：“社会主义从来都是在开拓中前进的。”这是对社会主义历史进程的全面总结，也\n是对社会主义事业发展的深刻启示。社会主义在开拓中前进，是因为", "options": {"A": "社会主义是亿万人民群众的伟大实践", "B": "社会主义是崭新的事业，社会主义实践是一个不断探索的过程", "C": "实践探索中出现某种曲折并不改变社会主义的前进趋势", "D": "推进社会主义实践发展必须有开拓奋进的精神状态\n第七章 共产主义崇高理想及其最终实现"}, "answer": "ABCD"}, {"id": "p1m-210", "num": 210, "type": "multiple", "stem": "马克思、恩格斯关于未来社会的预测，是在科学地批判和剖析资本主义社会的过程中作出的。\n马克思、恩格斯对资本主义批判的高明之处在于", "options": {"A": "不是只看到资本主义社会的弊端，而是进一步揭示出弊端的根源和资本主义发展中自我否\n定的力量", "B": "发现资本主义的矛盾运动中孕育着的新社会因素，并以此对未来社会特点作出预见", "C": "既从资本主义社会中寻找灵感，更从社会主义社会的建设与发展中寻找启示", "D": "先指出未来社会的一般特征，再对各种细节作具体描绘"}, "answer": "AB"}, {"id": "p1m-211", "num": 211, "type": "multiple", "stem": "实现人的自由而全面的发展，是马克思主义追求的根本价值目标，也是共产主义社会的根本特\n征。共产主义社会中人的自由而全面的发展指的是", "options": {"A": "全体社会成员的发展，即每一个人的发展", "B": "社会不存在矛盾，人与人之间形成事实上的平等", "C": "社会发展与个人发展实现了真正的统一", "D": "社会发展不再以牺牲某些个人的发展为代价"}, "answer": "ACD"}, {"id": "p1m-212", "num": 212, "type": "multiple", "stem": "1894年，恩格斯在回答意大利人卡内帕提出的要求尽量用简短的字句来表述未来的社会主义\n纪元的基本思想时指出，除了从《共产党宣言》中摘出下面一段话外，再也找不出合适的了，\n这就是：“代替那存在着阶级和阶级对立的资产阶级旧社会的，将是这样一个联合体，在那里，\n每个人的自由发展是一切人的自由发展的条件。”这里所说的自由发展是指", "options": {"A": "建立在个体高度自由自觉基础上的全面发展", "B": "实现了人的“自由个性”的发展", "C": "摆脱了自然经济条件下对“人的依赖关系”和商品经济条件下对“物的依赖性”", "D": "随心所欲、不受任何限制的发展"}, "answer": "ABC"}]}, {"id": "p2s", "title": "第二部分 毛中特 · 单选", "part": 2, "type": "single", "questions": [{"id": "p2s-1", "num": 1, "type": "single", "stem": "中国共产党的历史，是一部不断推进马克思主义中国化时代化的历史，是一部不断推进理论创\n新、进行理论创造的历史。标志着“马克思主义的中国化”这一命题正式提出的是", "options": {"A": "遵义会议", "B": "党的六届六中全会", "C": "瓦窑堡会议", "D": "党的七大"}, "answer": "B"}, {"id": "p2s-3", "num": 3, "type": "single", "stem": "毛泽东思想是在我国新民主主义革命、社会主义革命和社会主义建设的实践过程中，在总结我国\n革命和建设正反两方面历史经验的基础上，逐步形成和发展起来的。标志着毛泽东思想开始萌芽\n的是", "options": {"A": "关于新民主主义革命基本思想的提出", "B": "关于农村包围城市、武装夺取政权的思想的提出", "C": "反对本本主义的提出", "D": "马克思主义中国化命题的明确提出"}, "answer": "A"}, {"id": "p2s-4", "num": 4, "type": "single", "stem": "毛泽东思想是在总结我国革命和建设正反两方面历史经验的基础上，逐步形成和发展起来的。毛\n泽东思想初步形成的标志是提出并深入阐述", "options": {"A": "实事求是的思想路线", "B": "农村包围城市、武装夺取政权的思想", "C": "新民主主义理论", "D": "中国革命的首要问题"}, "answer": "B"}, {"id": "p2s-5", "num": 5, "type": "single", "stem": "毛泽东思想是马克思主义中国化时代化第一次历史性飞跃的理论成果，以独创性的理论丰富和发\n展了马克思列宁主义。最能体现毛泽东思想理论本质特点的思想内容是", "options": {"A": "贯穿于毛泽东思想科学体系中的立场、观点和方法", "B": "毛泽东思想在表达方式上具有的鲜明民族特色", "C": "毛泽东思想所确立的马克思主义中国化时代化的前进方向", "D": "全心全意为人民服务的根本宗旨和自力更生、艰苦奋斗的革命精神\n第一章 毛泽东思想及其历史地位"}, "answer": "A"}, {"id": "p2s-6", "num": 6, "type": "single", "stem": "毛泽东思想不是在个别的方面，而是在许多方面以其独创性理论丰富和发展了马克思列宁主义，\n构成一个博大精深的科学思想体系。它紧紧围绕的主题是", "options": {"A": "战争与革命", "B": "什么是社会主义、怎样建设社会主义", "C": "中国特色社会主义", "D": "中国革命和建设"}, "answer": "D"}, {"id": "p2s-7", "num": 7, "type": "single", "stem": "独立自主是毛泽东思想的活的灵魂三个基本方面的内容之一。坚持独立自主也是中国共产党百年\n奋斗的十大历史经验之一。独立自主是", "options": {"A": "中华民族精神之魂", "B": "中国共产党的最大政治优势", "C": "一个国家、一个民族发展进步的不竭动力", "D": "中国共产党区别于其他政党的显著标志"}, "answer": "A"}, {"id": "p2s-8", "num": 8, "type": "single", "stem": "独立自主是中国共产党、中华人民共和国立党立国的重要原则，是我们党从中国实际出发、依靠\n党和人民力量进行革命、建设、改革的必然结论。毛泽东独立自主思想最初的明确表述来自", "options": {"A": "《星星之火，可以燎原》", "B": "《反对本本主义》", "C": "《中国社会各阶级的分析》", "D": "《湖南农民运动考察报告》\n第二章 新民主主义革命理论"}, "answer": "B"}, {"id": "p2s-9", "num": 9, "type": "single", "stem": "认清中国国情，是解决中国革命问题的基本前提。近代中国最基本的国情是", "options": {"A": "中国是一个半殖民地半封建的社会", "B": "中国的政治经济发展不平衡", "C": "中国是东方的大国", "D": "中国是一个农民占人口多数的国家"}, "answer": "A"}, {"id": "p2s-10", "num": 10, "type": "single", "stem": "认清中国国情，是解决中国革命问题的基本前提。1939年毛泽东在《中国革命和中国共产党》\n中指出，中国是在许多帝国主义国家的统治或半统治之下，实际上处于长期的不统一状态，再\n加上土地广大，其结果是", "options": {"A": "帝国主义侵略势力日益成为直接统治中国的决定性力量", "B": "封建经济在社会经济生活中占着显然的优势", "C": "经济、政治和文化的发展表现出极端的不平衡", "D": "资产阶级成为资本-帝国主义压迫、奴役中国人民的社会基础"}, "answer": "C"}, {"id": "p2s-11", "num": 11, "type": "single", "stem": "解放战争时期，毛泽东在《在晋绥干部会议上的讲话》中对新民主主义革命的总路线作了完整\n的概括。这里所说的“完整”是指在革命对象中增加了", "options": {"A": "帝国主义", "B": "封建主义", "C": "民族资本主义", "D": "官僚资本主义"}, "answer": "D"}, {"id": "p2s-12", "num": 12, "type": "single", "stem": "中国民主主义革命经历了旧民主主义革命和新民主主义革命两个阶段，“旧”阶段转变到“新”\n阶段的根本标志是", "options": {"A": "中国革命领导阶级的变化", "B": "中国革命主要对象的变化", "C": "中国革命基本性质的变化", "D": "中国社会主要矛盾的变化"}, "answer": "A"}, {"id": "p2s-13", "num": 13, "type": "single", "stem": "中国革命的中心问题是", "options": {"A": "农民土地问题", "B": "统一战线问题", "C": "武装斗争问题", "D": "领导权问题"}, "answer": "D"}, {"id": "p2s-14", "num": 14, "type": "single", "stem": "“因为中国资产阶级根本上与剥削农民的豪绅地主相联结相混合，中国革命要推翻豪绅地主阶\n级，便不能不同时推翻资产阶级。”这一观点属于", "options": {"A": "“毕其功于一役”的观点", "B": "“二次革命论”的观点", "C": "民主主义革命是社会主义革命必要准备的观点", "D": "中国革命分“两步走”的观点"}, "answer": "A"}, {"id": "p2s-15", "num": 15, "type": "single", "stem": "“统帅革命的资产阶级，联合革命的无产阶级，实行资产阶级民主革命。”这一观点的错误实质\n在于", "options": {"A": "抹杀农民阶级的革命性", "B": "夸大资产阶级的作用", "C": "放弃无产阶级的领导权", "D": "忽视武装斗争的重要性"}, "answer": "C"}, {"id": "p2s-16", "num": 16, "type": "single", "stem": "在民主革命和社会主义革命的关系问题上，中国共产党党内曾经出现过不同的观点和主张，其\n中属于右倾错误的是", "options": {"A": "“毕其功于一役”", "B": "“二次革命论”", "C": "“无间断”革命", "D": "中国革命分“两步走”"}, "answer": "B"}, {"id": "p2s-17", "num": 17, "type": "single", "stem": "新民主主义革命理论的核心问题是", "options": {"A": "分清敌友", "B": "农民问题", "C": "无产阶级领导权", "D": "土地问题"}, "answer": "C"}, {"id": "p2s-19", "num": 19, "type": "single", "stem": "新民主主义革命的主要内容是", "options": {"A": "从根本上推翻反动腐朽的政治上层建筑，变革阻碍生产力发展的生产关系", "B": "没收官僚资产阶级的垄断资本归新民主主义国家所有", "C": "没收封建地主阶级的土地归农民所有", "D": "推翻帝国主义、封建主义和官僚资本主义的统治"}, "answer": "C"}, {"id": "p2s-20", "num": 20, "type": "single", "stem": "在半殖民地半封建的中国，地主占有土地、将土地出租给农民，通过收取地租来剥削农民，土\n地制度极不合理。因此，要改变中国贫穷落后的面貌，必须进行土地革命。土地改革的主要和\n直接任务，就是", "options": {"A": "限制富农剥削，发展农村生产力", "B": "没收地主土地归国家所有，分配给农民使用", "C": "把农民组织起来，开展互助合作", "D": "满足贫雇农群众的要求"}, "answer": "D"}, {"id": "p2s-21", "num": 21, "type": "single", "stem": "1940年，毛泽东在《新民主主义论》中，阐述了新民主主义的政治、经济和文化。1945年，\n他在党的七大所作的政治报告《论联合政府》中，进一步把新民主主义的政治、经济和文化与\n党的基本纲领联系起来，进行了具体阐述，形成了新民主主义的基本纲领。新民主主义经济纲\n领中极具特色的一项内容是", "options": {"A": "没收封建地主阶级的土地归农民所有", "B": "没收官僚资产阶级的垄断资本归新民主主义的国家所有", "C": "没收帝国主义在华资本归新民主主义的国家所有", "D": "保护民族工商业"}, "answer": "D"}, {"id": "p2s-22", "num": 22, "type": "single", "stem": "新民主主义文化就是无产阶级领导的人民大众的反帝反封建的文化，即民族的科学的大众的文\n化。其中“民族的”,就其内容说，是指", "options": {"A": "具有鲜明的民族风格、民族形式和民族特色", "B": "具有中国作风和中国气派", "C": "反对帝国主义压迫，主张中华民族的尊严和独立", "D": "反对封建思想和迷信思想\n2027 考研政治1000 题>>>试题分册"}, "answer": "C"}, {"id": "p2s-23", "num": 23, "type": "single", "stem": "中国革命走农村包围城市、武装夺取政权的道路，根本在于处理好", "options": {"A": "土地革命、武装斗争、农村革命根据地建设三者之间的关系", "B": "统一战线、武装斗争、党的建设三者之间的关系", "C": "工人阶级、农民阶级、民族资产阶级三者之间的关系", "D": "进步势力、中间势力、顽固势力三者之间的关系"}, "answer": "A"}, {"id": "p2s-24", "num": 24, "type": "single", "stem": "半殖民地半封建社会的社会性质，决定了近代中国不可能是一个独立的民主国家，外部没有民\n族独立，而受帝国主义压迫；内部没有起码的资产阶级民主，反动统治阶级凭借强大的反革命\n武装对人民实行独裁恐怖统治。这种社会性质决定了中国革命的主要形式是", "options": {"A": "争取民主", "B": "农民运动", "C": "武装斗争", "D": "工人运动"}, "answer": "C"}, {"id": "p2s-25", "num": 25, "type": "single", "stem": "1939年7月7日，是卢沟桥事变爆发2周年纪念日，华北联大在延安举行开学典礼，校长成仿\n吾请毛泽东作报告。毛泽东以他特有的广征博引方式发表讲话，他说：“当年姜子牙下昆仑山，\n元始天尊赠了他杏黄旗、四不象和打神鞭三样法宝。现在你们出发上前线，我也赠给你们三样\n法宝。”毛泽东赠给的“三样法宝”是指", "options": {"A": "土地革命、武装斗争、农村革命根据地建设", "B": "统一战线、武装斗争、党的建设", "C": "实事求是、群众路线、独立自主", "D": "理论联系实际、密切联系群众、批评与自我批评"}, "answer": "B"}, {"id": "p2s-26", "num": 26, "type": "single", "stem": "中国革命建立最广泛的统一战线不仅是必要的，而且是可能的，这种可能是由", "options": {"A": "中国半殖民地半封建社会的阶级状况所决定的", "B": "半殖民地半封建的中国社会的交织在一起的诸多矛盾所决定的", "C": "中国革命的长期性、残酷性及其发展的不平衡性所决定的", "D": "战争与革命的时代主题所决定的"}, "answer": "B"}, {"id": "p2s-27", "num": 27, "type": "single", "stem": "新民主主义革命时期，党领导的革命统一战线包含着两个联盟。其中作为统一战线的基础的联\n盟是", "options": {"A": "工人阶级同城市小资产阶级的联盟", "B": "工人阶级同农民阶级、广大知识分子及其他劳动者的联盟", "C": "工人阶级同农民阶级、小资产阶级和民族资产阶级的联盟", "D": "工人阶级同可以合作的非劳动人民的联盟"}, "answer": "B"}, {"id": "p2s-28", "num": 28, "type": "single", "stem": "毛泽东思想关于党的建设理论中，始终放在党的建设的首位的是", "options": {"A": "加强党的思想建设", "B": "加强党的组织建设", "C": "加强党员的党性修养", "D": "保持党的优良作风\n第三章 社会主义改造理论"}, "answer": "A"}, {"id": "p2s-29", "num": 29, "type": "single", "stem": "新民主主义社会在经济上实行国营经济、合作社经济、个体经济、私人资本主义经济和国家资\n本主义经济五种经济成分并存的经济制度。五种经济成分中，在国民经济中居于领导地位的是", "options": {"A": "国营经济", "B": "个体经济", "C": "国家资本主义经济", "D": "私人资本主义经济"}, "answer": "A"}, {"id": "p2s-30", "num": 30, "type": "single", "stem": "建国初期，随着全国土地改革的基本完成，国内的主要矛盾是", "options": {"A": "人民大众同帝国主义、封建主义和国民党反动派残余势力之间的矛盾", "B": "工人阶级和资产阶级的矛盾", "C": "生产力与生产关系的矛盾和经济基础与上层建筑的矛盾", "D": "人民日益增长的物质文化需要同落后的社会生产之间的矛盾"}, "answer": "B"}, {"id": "p2s-31", "num": 31, "type": "single", "stem": "党在过渡时期总路线的主要内容被概括为“一化三改”,也曾被比喻为鸟的“主体”和“两\n翼”。“主体”是指", "options": {"A": "对农业的社会主义改造", "B": "对手工业的社会主义改造", "C": "对资本主义工商业的社会主义改造", "D": "社会主义工业化"}, "answer": "D"}, {"id": "p2s-32", "num": 32, "type": "single", "stem": "对农业的社会主义改造，是三大改造中首先进行的。以毛泽东同志为主要代表的中国共产党人\n根据马克思列宁主义关于农业社会主义改造的基本原理，从我国农村实际出发，制定并实行了\n一整套适合中国特点的对农业进行社会主义改造的方针、政策和办法。农业社会主义改造遵循\n的原则是", "options": {"A": "积极领导、稳步前进", "B": "区别对象、积极引导、逐步过渡", "C": "自愿互利、典型示范和国家帮助", "D": "既反保守又反冒进"}, "answer": "C"}, {"id": "p2s-33", "num": 33, "type": "single", "stem": "在农业合作化进程中，具有半社会主义性质的组织形式是", "options": {"A": "临时互助组", "B": "常年互助组", "C": "初级合作社", "D": "高级合作社"}, "answer": "C"}, {"id": "p2s-34", "num": 34, "type": "single", "stem": "我国对资本主义工商业的社会主义改造经历了三个步骤。其中，在实行个别企业的公私合营中，\n企业利润分配上采取的办法是", "options": {"A": "定股定息", "B": "“四马分肥”", "C": "和平赎买", "D": "公私兼顾"}, "answer": "B"}, {"id": "p2s-35", "num": 35, "type": "single", "stem": "我国对资本主义工商业的社会主义改造，采取了从低级到高级的国家资本主义的过渡形式。其\n中第二步主要实行个别企业的公私合营，这些企业的性质", "options": {"A": "仍然是资本主义性质的企业", "B": "是具有了社会主义因素的企业", "C": "是半社会主义性质的企业", "D": "是社会主义国营性质的企业"}, "answer": "C"}, {"id": "p2s-36", "num": 36, "type": "single", "stem": "我国对资本主义工商业的社会主义改造经历了三个步骤。第一步实行初级形式的国家资本主义；\n第二步实行个别企业的公私合营；第三步实行全行业的公私合营。在这些步骤中，同资本家在\n企业外部的合作是指", "options": {"A": "实行初级形式的国家资本主义", "B": "实行个别企业的公私合营", "C": "实行全行业的公私合营", "D": "实行“四马分肥”"}, "answer": "A"}, {"id": "p2s-37", "num": 37, "type": "single", "stem": "邓小平曾经指出：“我们的社会主义改造是搞得成功的，很了不起。这是毛泽东同志对马克思列\n宁主义的一个重大贡献。”之所以说我国社会主义改造的基本完成是一个伟大的历史性胜利，是\n因为如此复杂、困难和深刻的社会变革\n①没有造成生产力的破坏，反而促进了工农业和整个国民经济的发展\n②没有追求纯粹的单一的社会主义经济成分，反而深刻认识到在社会主义改造基本完成以后，\n公有制经济可以和非公有制经济共同发展\n③没有引起巨大的社会动荡，反而极大地加强了人民的团结\n④没有导致对什么是社会主义的理解产生混乱，反而在此过程中形成了对我国社会主义发展阶\n段问题的科学理论", "options": {"A": "①②", "B": "②③", "C": "①③", "D": "②④\n第四章 社会主义建设道路初步探索的理论成果"}, "answer": "C"}, {"id": "p2s-38", "num": 38, "type": "single", "stem": "成为党探索中国社会主义建设道路良好开端的文章，是毛泽东发表的", "options": {"A": "《论人民民主专政》", "B": "《论十大关系》", "C": "《纪念孙中山先生》", "D": "《关于正确处理人民内部矛盾的问题》"}, "answer": "B"}, {"id": "p2s-40", "num": 40, "type": "single", "stem": "毛泽东在《论十大关系》中提出的中国社会主义建设的基本方针是", "options": {"A": "不要四面出击", "B": "积极引导，稳步前进", "C": "调动一切积极因素为社会主义事业服务", "D": "实现工业、农业、国防和科学技术的现代化"}, "answer": "C"}, {"id": "p2s-41", "num": 41, "type": "single", "stem": "1957年2月，毛泽东作了《关于正确处理人民内部矛盾的问题》的报告，系统论述了社会主义\n社会矛盾的理论。毛泽东强调，社会主义国家政治生活的主题是", "options": {"A": "正确区分和处理两类不同性质矛盾的问题", "B": "正确处理人民内部矛盾的问题", "C": "正确处理敌我矛盾的问题", "D": "正确认识和处理阶级斗争的问题"}, "answer": "B"}, {"id": "p2s-42", "num": 42, "type": "single", "stem": "1957年2月，毛泽东作了《关于正确处理人民内部矛盾的问题》的报告，指出：“在社会主义\n社会中，基本的矛盾仍然是生产关系和生产力之间的矛盾，上层建筑和经济基础之间的矛盾。”\n社会主义社会的基本矛盾同以往社会的基本矛盾“具有根本不同的性质和情况”。这里所说的\n“不同的”“情况”是指", "options": {"A": "社会主义社会的矛盾反映在政治上可以划分为敌我矛盾和人民内部矛盾", "B": "社会主义社会基本矛盾运动是“又相适应又相矛盾”", "C": "社会主义社会的基本矛盾既是对抗性的又是非对抗性的", "D": "社会主义社会的所有矛盾都必须采用民主的方法来解决"}, "answer": "B"}, {"id": "p2s-43", "num": 43, "type": "single", "stem": "1957年2月，毛泽东作了《关于正确处理人民内部矛盾的问题》的报告，阐明社会主义社会的\n重大理论问题。毛泽东指出，用民主的方法解决人民内部矛盾，这是一个总方针。针对人民内\n部矛盾在具体实践中的不同情况，毛泽东提出了一系列具体方针、原则。在政治思想领域，毛\n泽东提出的解决人民内部矛盾的具体方针是", "options": {"A": "“团结—批评—团结”", "B": "“惩前毖后、治病救人”", "C": "“长期共存、互相监督”", "D": "统筹兼顾、适当安排"}, "answer": "A"}, {"id": "p2s-44", "num": 44, "type": "single", "stem": "20世纪50年代中期，毛泽东明确提出要走一条有别于苏联的中国工业化道路。走中国工业化道\n路主要是强调要正确处理", "options": {"A": "信息化和工业化的关系", "B": "工业化和农业现代化的关系", "C": "农业现代化和城镇化的关系", "D": "重工业和轻工业、农业的关系"}, "answer": "D"}, {"id": "p2s-45", "num": 45, "type": "single", "stem": "在中国特色社会主义理论体系的形成过程中，邓小平在党的十二大上提出的一个具有里程碑意\n义的重大命题是", "options": {"A": "什么是社会主义、怎样建设社会主义", "B": "建设有中国特色的社会主义", "C": "改革是中国的第二次革命", "D": "中国问题的关键在于党"}, "answer": "B"}, {"id": "p2s-46", "num": 46, "type": "single", "stem": "邓小平理论是逐步形成和发展起来的。邓小平理论逐步走向成熟始于", "options": {"A": "党的十一届三中全会", "B": "党的十二大", "C": "党的十三大", "D": "1992年南方谈话\n第五章 中国特色社会主义理论体系的形成发展\n第六章 邓小平理论"}, "answer": "D"}, {"id": "p2s-47", "num": 47, "type": "single", "stem": "邓小平在领导改革开放和现代化建设这一新的革命过程中，不断提出和反复思考的首要的基本\n的理论问题是", "options": {"A": "什么是社会主义、怎样建设社会主义", "B": "建设什么样的党、怎样建设党", "C": "实现什么样的发展、怎样发展", "D": "坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义"}, "answer": "A"}, {"id": "p2s-49", "num": 49, "type": "single", "stem": "在邓小平指导下，党的十一届三中全会重新确立解放思想、实事求是的思想路线，停止使用\n“以阶级斗争为纲”的错误提法，作出把党和国家工作中心转移到经济建设上来、实行改革开放\n的历史性决策，开启了改革开放和社会主义现代化建设新时期，实现了党的历史上具有深远意\n义的伟大转折。党在改革开放和社会主义现代化建设新时期实现的最根本的拨乱反正是", "options": {"A": "坚持四项基本原则", "B": "坚持改革开放", "C": "坚持以经济建设为中心", "D": "坚持中国特色社会主义"}, "answer": "C"}, {"id": "p2s-50", "num": 50, "type": "single", "stem": "邓小平明确指出：“改革是中国的第二次革命。”所谓第二次革命，是与中国共产党领导的第一\n次革命相对而言的。社会主义改革的性质是", "options": {"A": "社会主义基本制度的改革", "B": "社会主义经济运行方式的改变", "C": "社会主义原有体制的修补", "D": "社会主义制度的自我完善和发展"}, "answer": "D"}, {"id": "p2s-51", "num": 51, "type": "single", "stem": "1992年党的十四大之所以能够明确地把建立社会主义市场经济体制作为我国经济体制改革目\n标，是因为在社会主义可以实行市场经济的理论上有了重大突破。这个重大突破就是认识到", "options": {"A": "市场经济是有国家宏观调控的经济", "B": "市场经济是法治经济", "C": "市场经济与计划经济是可以结合的", "D": "市场经济本身不具有制度属性"}, "answer": "D"}, {"id": "p2s-52", "num": 52, "type": "single", "stem": "社会主义市场经济理论认为，计划经济与市场经济属于", "options": {"A": "不同的资源配置手段", "B": "不同的经济增长方式", "C": "不同的经济制度的范畴", "D": "不同的生产关系的范畴\n第七章“三个代表”重要思想"}, "answer": "A"}]}, {"id": "p2m", "title": "第二部分 毛中特 · 多选", "part": 2, "type": "multiple", "questions": [{"id": "p2m-1", "num": 1, "type": "multiple", "stem": "1938年，毛泽东在党的六届六中全会上所作的《论新阶段》的政治报告中最先提出了“马克思\n主义的中国化”这个命题。这是党首次明确提出“马克思主义的中国化”的重大命题。既然马克\n思主义是科学的理论，是当时中国人选择的救国救民的真理，那么按他的理论照着做就行了，为\n什么还要提出马克思主义中国化时代化呢?这是因为找到了马克思主义这个崭新的思想武器，并\n不意味着就能够自然而然地解决中国革命所面临的问题。推进马克思主义中国化时代化", "options": {"A": "是马克思主义理论本身发展的内在要求", "B": "是解决中国实际问题和时代问题的客观需要", "C": "才能真正解决教条主义和经验主义的问题", "D": "才能找到放之四海而皆准的革命和建设模式"}, "answer": "ABC"}, {"id": "p2m-2", "num": 2, "type": "multiple", "stem": "19世纪末，恩格斯在讨论美国工人运动的时候，曾就社会主义工人党如何结合美国实际发表了看\n法，认为这个“移自外域”的党要加速自身的胜利，就“必须完全脱下它的外国服装”“必须学\n习英语”。恩格斯无疑道出了马克思主义传播和发展的真谛。马克思主义要在中国发挥跨越时空\n的思想伟力，也必须“穿中国服装”“讲中国话”。1938年，毛泽东在党的六届六中全会上作了\n《论新阶段》的报告，正式提出了“马克思主义的中国化”这一命题。毛泽东强调", "options": {"A": "没有抽象的马克思主义，只有具体的马克思主义", "B": "马克思主义的中国化就是使中国的每一实践都与马克思主义理论相符合", "C": "马克思主义的中国化使马克思主义在其每一表现中带着中国的特性", "D": "马克思主义的中国化即是说按照中国的特点去应用它\n第一章 毛泽东思想及其历史地位"}, "answer": "ACD"}, {"id": "p2m-3", "num": 3, "type": "multiple", "stem": "大革命时期，毛泽东关于新民主主义革命的基本思想的提出，标志着毛泽东思想开始萌芽。毛泽\n东关于新民主主义革命的基本思想的内容是", "options": {"A": "分析了中国社会各阶级在革命中的地位和作用", "B": "明确指出无产阶级领导农民斗争的极端重要性", "C": "解决了无产阶级领导权的中心问题，即如何领导农民斗争的问题", "D": "提出了“工农武装割据”的思想"}, "answer": "ABC"}, {"id": "p2m-4", "num": 4, "type": "multiple", "stem": "实事求是是毛泽东思想的基本点，是毛泽东思想的精髓。在实事求是思想路线提出和确立的过程\n中，毛泽东提出的相关观点有", "options": {"A": "没有调查，没有发言权", "B": "我们要坚持用马克思主义之“矢”去射中国革命之“的”", "C": "一个党，一个国家，一个民族，如果一切从本本出发，那它就不能前进", "D": "不唯上、不唯书、只唯实，交换、比较、反复"}, "answer": "AB"}, {"id": "p2m-5", "num": 5, "type": "multiple", "stem": "新中国成立的开国大典前，围绕军乐团演奏什么曲目，一度众说纷纭，提议用德国乐曲、苏联乐\n曲、美国乐曲的意见都有。最终，毛泽东拍板：要听自己的乐曲，走自己的路。走自己的路，也\n就是独立自主。独立自主是毛泽东思想活的灵魂的三个基本方面的内容之一，是", "options": {"A": "中华民族的优良传统", "B": "中国共产党、中华人民共和国立党立国的重要原则", "C": "党从中国实际出发、依靠党和人民力量进行革命、建设、改革的必然结论", "D": "党的生命线和根本工作路线"}, "answer": "ABC"}, {"id": "p2m-6", "num": 6, "type": "multiple", "stem": "邓小平在谈到毛泽东思想的时候指出：“这个思想，从历史上证明了是好的。中国的革命，不是由\n别的思想引导到胜利的，而是由毛泽东思想引导到胜利的。革命胜利以后，也正是在毛泽东思想的\n指导下，我们的社会主义建设才获得了这样伟大的成就，并且继续胜利地前进着。”毛泽东思想是", "options": {"A": "马克思主义中国化时代化的第一个重大理论成果", "B": "中国革命和建设的科学指南", "C": "中国共产党和中国人民宝贵的精神财富", "D": "党必须长期坚持的指导思想\n第二章 新民主主义革命理论"}, "answer": "ABCD"}, {"id": "p2m-7", "num": 7, "type": "multiple", "stem": "新民主主义革命与旧民主主义革命相比有新的内容和特点，集中表现在新民主主义革命", "options": {"A": "处于世界无产阶级社会主义革命的时代，是世界无产阶级社会主义革命的一部分", "B": "革命的领导力量是中国无产阶级及其先锋队——中国共产党", "C": "革命的指导思想是马克思列宁主义", "D": "革命的前途是社会主义而不是资本主义"}, "answer": "ABCD"}, {"id": "p2m-9", "num": 9, "type": "multiple", "stem": ",毛泽东把新民主主义革命和社会主义革命比喻为文章的上篇和下篇。“两篇文章，上篇与下篇，\n只有上篇做好，下篇才能做好”。毛泽东这段话的含义是", "options": {"A": "民主主义革命是社会主义革命的必要准备", "B": "社会主义革命是民主主义革命的必然趋势", "C": "在民主主义革命和社会主义革命中间要经历一个独立的资本主义发展阶段", "D": "“一次革命论”是错误的，“二次革命论”是正确的"}, "answer": "AB"}, {"id": "p2m-10", "num": 10, "type": "multiple", "stem": "关于新民主主义政治纲领规定的新民主主义国家，以下说法正确的有", "options": {"A": "国体是各革命阶级联合专政", "B": "政体是实行民主集中制的人民代表大会制度", "C": "新民主主义共和国是一定历史时期的国家形式，是过渡的形式", "D": "人民当家作主是新民主主义国家制度的核心内容和基本准则"}, "answer": "ABCD"}, {"id": "p2m-11", "num": 11, "type": "multiple", "stem": "新民主主义经济纲领的内容是", "options": {"A": "没收封建地主阶级的土地归农民所有", "B": "没收官僚资产阶级的垄断资本归新民主主义的国家所有", "C": "保护民族工商业", "D": "没收外国在华资本归新民主主义的国家所有"}, "answer": "ABC"}, {"id": "p2m-12", "num": 12, "type": "multiple", "stem": "1948年，毛泽东在《在晋绥干部会议上的讲话》中，在新民主主义革命总路线的革命对象中增\n加了“官僚资本主义”。把官僚资本主义作为民主革命的对象，是因为官僚资本主义", "options": {"A": "是资本主义，党作为中国无产阶级的先锋队必须带领人民消灭资本主义剥削制度", "B": "背靠帝国主义，充当帝国主义的买办，是买办的、封建的国家垄断资本主义", "C": "同大地主、大资产阶级的反革命国家政权密切结合着，成为国民党统治的经济基础", "D": "严重束缚了中国社会生产力的发展，对中国社会进步起着严重的阻碍作用"}, "answer": "BCD"}, {"id": "p2m-13", "num": 13, "type": "multiple", "stem": "新民主主义革命的对象是帝国主义、封建主义和官僚资本主义，它不是一般地消灭资本主义和\n资产阶级，“它只推翻帝国主义和汉奸反动派在中国的统治，而不破坏任何尚能参加反帝反封建\n的资本主义成分”。在新民主主义条件下保护民族工商业，发展资本主义，这是因为", "options": {"A": "同官僚资产阶级相比，民族资产阶级与帝国主义和封建主义联系较少", "B": "民族资本主义经济是一种与新生产力相联系的先进的生产方式和经济成分", "C": "让私人资本主义经济在不能操纵国计民生的范围内获得发展的便利，有益于社会向前发展", "D": "民族资本家经营的企业在中国社会经济中占主要地位，保护民族工商业有利于社会稳定"}, "answer": "ABC"}, {"id": "p2m-14", "num": 14, "type": "multiple", "stem": "当年，蒋介石在南京宣称，谁控制了北平、上海、广州等城市，谁就控制了中国；毛泽东在井\n冈山说，谁赢得了农民，谁就会赢得中国。1926年，毛泽东曾在广州农民运动讲习所任所长，\n培养了300多名学员，他们奔赴各地领导农民运动。仿佛是巧合——讲习所内展示的红色锦旗\n依旧赫然：“农为党本”。按当时体例从右向左书写的四个大字，今天从左向右读来就是“本党\n为农”。党之所以如此重视农民，是因为", "options": {"A": "农民是中国革命的主力军", "B": "新民主主义革命实质上就是党领导下的农民革命", "C": "中国革命战争实质上就是党领导下的农民战争", "D": "农民阶级是近代中国最革命最进步的阶级"}, "answer": "ABC"}, {"id": "p2m-15", "num": 15, "type": "multiple", "stem": "1938年11月，毛泽东在《战争和战略问题》中明确指出：“共产党的任务，基本地不是经过长\n期合法斗争以进入起义和战争，也不是先占城市后取乡村，而是走相反的道路。”中国走农村包\n围城市、武装夺取政权道路的依据是", "options": {"A": "无产阶级是革命的领导阶级", "B": "农民占全国人口的绝大多数，是无产阶级可靠的同盟军和革命的主力军", "C": "当时的中国内无民主制度而受封建主义的压迫，外无民族独立而受帝国主义的压迫", "D": "在半殖民地半封建的近代中国，封建主义和人民大众的矛盾是各种矛盾中最主要的矛盾"}, "answer": "BC"}, {"id": "p2m-17", "num": 17, "type": "multiple", "stem": "中国革命走农村包围城市、武装夺取政权的道路，必须处理好土地革命、武装斗争、农村革命\n根据地建设三者之间的关系。以下内容正确的有", "options": {"A": "土地革命是中国革命的基本内容", "B": "武装斗争是中国革命的主要形式", "C": "农村革命根据地是中国革命的战略阵地", "D": "统一战线是进行武装斗争和开展土地革命的依托"}, "answer": "ABC"}, {"id": "p2m-18", "num": 18, "type": "multiple", "stem": "近代中国社会的阶级结构是“两头小中间大”,“中间”是指", "options": {"A": "无产阶级", "B": "农民阶级", "C": "民族资产阶级", "D": "城市小资产阶级"}, "answer": "BCD"}, {"id": "p2m-19", "num": 19, "type": "multiple", "stem": "新民主主义革命时期，以国共合作为基础所建立的统一战线有", "options": {"A": "国民革命联合战线", "B": "工农民主统一战线", "C": "抗日民族统一战线", "D": "人民民主统一战线"}, "answer": "AC"}, {"id": "p2m-20", "num": 20, "type": "multiple", "stem": "武装斗争是中国革命的特点和优点之一。总结党在新民主主义革命时期开展武装斗争的革命经\n验，建设人民军队，要", "options": {"A": "坚持党对军队的绝对领导", "B": "建设全心全意为人民服务的人民军队", "C": "开展革命的政治工作", "D": "坚持正确的战略战术原则"}, "answer": "ABCD"}, {"id": "p2m-21", "num": 21, "type": "multiple", "stem": "开展革命的政治工作是党在新民主主义革命时期建设人民军队的经验之一。人民军队政治工作\n的基本原则包括", "options": {"A": "支部建在连上的原则", "B": "官兵一致的原则", "C": "军民一致的原则", "D": "瓦解敌军和优待俘虏的原则"}, "answer": "BCD"}, {"id": "p2m-22", "num": 22, "type": "multiple", "stem": "毛泽东在中共七大上总结的中国共产党区别于其他任何政党的显著标志有", "options": {"A": "谦虚、谨慎、不骄、不躁的作风", "B": "理论和实践相结合的作风", "C": "自我批评的作风", "D": "和人民群众紧密地联系在一起的作风"}, "answer": "BCD"}, {"id": "p2m-23", "num": 23, "type": "multiple", "stem": "中国共产党要领导革命取得胜利，必须不断加强党的思想建设、组织建设和作风建设。新民主\n主义革命时期党的建设的主要经验有", "options": {"A": "必须把思想建设始终放在党的建设的首位，以无产阶级思想克服和改造各种非无产阶级思想", "B": "必须重视党的组织建设和作风建设", "C": "必须联系党的政治路线加强党的建设", "D": "注意党的执政能力建设\n第三章 社会主义改造理论"}, "answer": "ABC"}, {"id": "p2m-24", "num": 24, "type": "multiple", "stem": ",新民主主义社会是", "options": {"A": "中国由新民主主义转变到社会主义的过渡性社会形态", "B": "无产阶级推翻资产阶级建立政权过程中必然经历的一个独立的社会形态", "C": "属于社会主义体系的逐步过渡到社会主义社会的过渡性质的社会", "D": "既有社会主义因素又有非社会主义因素存在的社会"}, "answer": "ACD"}, {"id": "p2m-25", "num": 25, "type": "multiple", "stem": "新中国成立初期，中国处于新民主主义社会。新民主主义社会有五种经济成分，其中主要的经\n济成分是", "options": {"A": "社会主义经济", "B": "个体经济", "C": "资本主义经济", "D": "封建地主经济"}, "answer": "ABC"}, {"id": "p2m-26", "num": 26, "type": "multiple", "stem": "新民主主义时期三种不同性质的经济成分及与之相联系的三种基本的阶级力量之间的矛盾，集\n中表现为", "options": {"A": "社会主义和资本主义两条道路的矛盾", "B": "工人阶级和资产阶级两个阶级的矛盾", "C": "计划经济和市场经济的矛盾", "D": "人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾"}, "answer": "AB"}, {"id": "p2m-27", "num": 27, "type": "multiple", "stem": "对于新民主主义向社会主义的过渡，毛泽东及党的其他领导人经历了从“一举过渡”到“并举\n过渡”的转变。1952年底，中共中央开始酉酝酿并于1953年正式提出了党在过渡时期的总路线。\n党提出过渡时期的总路线，不仅有理论依据，而且有充分的现实依据。党提出过渡时期总路线\n的现实依据有", "options": {"A": "社会主义的国营经济在国家经济生活中实际上已居于相对强大的地位", "B": "广大农民有走互助合作道路的要求，以及农业互助合作组织显示出增产的优越性", "C": "国家在利用和限制资本主义工商业的过程中积累了经验", "D": "当时的国际形势有利于中国向社会主义过渡"}, "answer": "ABCD"}, {"id": "p2m-28", "num": 28, "type": "multiple", "stem": "党在过渡时期的总路线，将马克思列宁主义关于过渡时期的理论在中国进一步具体化了，形成\n了中国化的过渡时期理论，为中国社会主义改造提供了行动指南。党在过渡时期的总路线", "options": {"A": "是社会主义建设和社会主义改造同时并举的路线", "B": "体现了社会主义工业化和社会主义改造的紧密结合", "C": "体现了解放生产力与发展生产力的有机统一", "D": "体现了变革生产关系与发展生产力的有机统一"}, "answer": "ABCD"}, {"id": "p2m-29", "num": 29, "type": "multiple", "stem": "在社会主义改造中，我国创造性地开辟了一条适合中国情况的对资本主义工商业进行社会主义\n改造的道路，主要有", "options": {"A": "用和平赎买的方法改造资本主义工商业", "B": "采取从低级到高级的国家资本主义的过渡形式", "C": "把资本主义工商业者改造成为自食其力的社会主义劳动者", "D": "遵循自愿互利、典型示范和国家帮助的原则"}, "answer": "ABC"}, {"id": "p2m-30", "num": 30, "type": "multiple", "stem": "我国对个体手工业的社会主义改造，采取了类似改造个体农业的逐步过渡的方法。以下逐步过\n渡的形式中，在性质上相一致的过渡形式是", "options": {"A": "手工业供销合作社", "B": "手工业供销小组", "C": "手工业生产合作社", "D": "初级农业生产合作社"}, "answer": "AD"}, {"id": "p2m-31", "num": 31, "type": "multiple", "stem": "我国之所以能够采取赎买的方式对资本主义工商业进行和平改造，其原因在于", "options": {"A": "民族资产阶级具有两面性", "B": "中国共产党与民族资产阶级长期保持着统一战线的关系", "C": "我国已经有了人民民主专政的国家政权和掌握了国家经济命脉的强大的社会主义国营经济", "D": "国家对粮食和工业原料的统购统销，以及资本主义企业中工人群众对资本家的监督"}, "answer": "ABCD"}, {"id": "p2m-32", "num": 32, "type": "multiple", "stem": "在党的七届二中全会上，毛泽东将“国家和私人合作的国家资本主义经济”作为新中国的几种\n主要的经济成分之一。在新中国社会主义改造过程中，中国共产党采用国家资本主义的方式开\n展对资本主义工商业的社会主义改造，即通过在一定的时期内有步骤地、有区别地把一切对国\n计民生有利的、而又为国家所需要的资本主义企业基本上改造为国家资本主义企业，并有计划\n地稳步地使低级形式的国家资本主义向高级形式的国家资本主义发展。国家资本主义", "options": {"A": "是与社会主义直接相联系的、国家直接控制和支配下的资本主义经济", "B": "不是一种独立的经济形态", "C": "其性质取决于生产力的发展水平", "D": "是个体经济向社会主义集体经济过渡的形式"}, "answer": "AB"}, {"id": "p2m-33", "num": 33, "type": "multiple", "stem": "我国对资本主义工商业的改造采取赎买的方针，所谓赎买就是", "options": {"A": "国家有偿地将私营企业改变为国营企业", "B": "由国家支付一笔巨额补偿资金", "C": "让资本家在一定年限内从企业经营所得中获取一部分利润", "D": "国家把私营企业改变为集体企业"}, "answer": "AC"}, {"id": "p2m-34", "num": 34, "type": "multiple", "stem": "我国对资本主义工商业的社会主义改造经历了三个步骤：第一步实行初级形式的国家资本主义；\n第二步实行个别企业的公私合营；第三步实行全行业的公私合营。从个别企业的公私合营到全\n行业公私合营，是", "options": {"A": "党和国家对资本主义工商业采取利用、限制、改造政策的必然趋势", "B": "经济运行中计划不断强化的必然结果", "C": "保证国家重点建设顺利进行的必然要求", "D": "彻底完成民主革命遗留任务的必要前提"}, "answer": "ABC"}, {"id": "p2m-35", "num": 35, "type": "multiple", "stem": "把资本主义工商业者改造成为自食其力的社会主义劳动者，是适合中国情况的对资本主义工商\n业进行社会主义改造的道路的主要内容之一，它的优点在于", "options": {"A": "通过改造阶级成分的方式达到从整体上消灭资产阶级的目的", "B": "对企业的改造和对人的改造相结合", "C": "改造资本家个人与消灭他们所属的资产阶级相结合", "D": "既避免了激烈的阶级对抗，减少了改造的阻力，又推动了生产力的发展和社会的进步"}, "answer": "ABCD"}, {"id": "p2m-36", "num": 36, "type": "multiple", "stem": "我国在对个体农业进行社会主义改造的过程中，成功地开辟了一条适合我国情况的农业社会主\n义改造道路，其内容主要有", "options": {"A": "积极引导农民组织起来，走互助合作道路", "B": "遵循自愿互利、典型示范、国家帮助的原则", "C": "坚持积极领导、稳步前进的方针，采取循序渐进的步骤", "D": "在有条件的地区推广农业生产责任制"}, "answer": "ABC"}, {"id": "p2m-37", "num": 37, "type": "multiple", "stem": "在一个几亿人口的大国中比较顺利地实现了如此复杂、困难和深刻的社会主义改造，不仅没有\n造成生产力的破坏，反而促进了工农业和整个国民经济的发展；不仅没有引起巨大的社会动荡，\n反而极大地加强了人民的团结，并且是在人民普遍拥护的情况下完成的。这些情况说明，我国\n社会主义改造的基本完成的确是一个伟大的历史性胜利。我国社会主义改造的成功经验在于", "options": {"A": "坚持“一举过渡”", "B": "坚持社会主义工业化建设与社会主义改造同时并举", "C": "采取积极引导、逐步过渡的方式", "D": "用和平方法进行改造"}, "answer": "BCD"}, {"id": "p2m-38", "num": 38, "type": "multiple", "stem": "1956年底，我国对农业、手工业和资本主义工商业的社会主义改造基本完成，我国社会经济结\n构发生了根本变化，社会主义公有制已成为我国社会的经济基础，标志着中国历史上长达数千\n年的阶级剥削制度的结束和社会主义基本制度的确立。在中国确立社会主义基本制度是中国共\n产党百年奋斗的伟大成就之一。社会主义基本制度的确立", "options": {"A": "是中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了制度基础", "B": "实现了马克思主义同中国实际的“第二次结合”", "C": "极大地促进了我国社会生产力的发展", "D": "使广大劳动人民真正成为国家的主人，这是中国几千年来阶级关系的最根本变革\n第四章 社会主义建设道路初步探索的理论成果"}, "answer": "ACD"}, {"id": "p2m-39", "num": 39, "type": "multiple", "stem": "1956年，毛泽东提出探索马克思主义同中国实际即社会主义建设实际的“第二次结合”,这说\n明中国共产党", "options": {"A": "开始探索适合中国特点的社会主义建设道路", "B": "开始摆脱单一的苏联模式", "C": "开始重新认识“什么是社会主义、怎样建设社会主义”", "D": "开始明确社会主义基本制度建立后还要通过改革进一步解放生产力"}, "answer": "AB"}, {"id": "p2m-41", "num": 41, "type": "multiple", "stem": "1957年2月，毛泽东作了《关于正确处理人民内部矛盾的问题》的报告，系统论述了社会主义\n社会矛盾的理论。毛泽东指出", "options": {"A": "矛盾是普遍存在的，社会主义社会同样充满着矛盾", "B": "社会主义社会的基本矛盾仍然是生产关系和生产力之间、上层建筑和经济基础之间的矛盾，\n它同以往社会的基本矛盾性质是一样的", "C": "社会主义社会的矛盾反映在政治上可以划分为敌我矛盾和人民内部矛盾这两类性质完全不同\n的矛盾，正确处理人民内部矛盾是国家政治生活的主题", "D": "社会主义社会的基本矛盾可以通过社会主义制度本身的自我调整和自我完善得到解决"}, "answer": "ACD"}, {"id": "p2m-42", "num": 42, "type": "multiple", "stem": "1957年2月，毛泽东在《关于正确处理人民内部矛盾的问题》的报告中提出了一系列正确处理\n人民内部矛盾的具体方针、原则，主要有", "options": {"A": "统筹兼顾、适当安排", "B": "有理、有利、有节", "C": "“百花齐放、百家争鸣”", "D": "“长期共存、互相监督”"}, "answer": "ACD"}, {"id": "p2m-43", "num": 43, "type": "multiple", "stem": "走中国工业化道路的思想是党在社会主义建设道路初步探索中取得的理论成果之一。毛泽东所\n说的中国工业化道路，就是正确处理重工业和轻工业、农业的关系，也就是他在《论十大关系》\n中论述的第一大关系。为此，毛泽东提出了以农业为基础，以工业为主导，以农轻重为序发展\n国民经济的总方针，以及一整套“两条腿走路”的工业化发展思路，即", "options": {"A": "重工业和轻工业同时并举", "B": "中央工业和地方工业同时并举", "C": "沿海工业和内地工业同时并举", "D": "外资企业和内资企业同时并举"}, "answer": "ABC"}, {"id": "p2m-44", "num": 44, "type": "multiple", "stem": "以毛泽东为核心的第一代中央领导集体在创建新中国和探索适合中国情况的社会主义建设道路\n过程中，形成了一系列重要的理论，主要有", "options": {"A": "在社会主义经济建设方面，实行以农业为基础，以工业为主导，以农轻重为序发展国民经济\n的总方针", "B": "社会主义可以分为不发达的社会主义和比较发达的社会主义两个阶段，后一阶段可能比前一\n阶段需要更长的时间", "C": "应当采取“两步走”的发展战略，把中国建设成为一个具有现代农业、现代工业、现代国防\n和现代科学技术的社会主义强国", "D": "发展面向现代化、面向世界、面向未来的，民族的科学的大众的社会主义文化"}, "answer": "ABC"}, {"id": "p2m-45", "num": 45, "type": "multiple", "stem": "以毛泽东同志为主要代表的中国共产党人对社会主义建设道路的初步探索", "options": {"A": "彻底摆脱了苏联模式的影响", "B": "巩固和发展了我国的社会主义制度", "C": "丰富了科学社会主义的理论和实践", "D": "为开创中国特色社会主义提供了宝贵经验、理论准备、物质基础\n第五章 中国特色社会主义理论体系的形成发展"}, "answer": "BCD"}, {"id": "p2m-46", "num": 46, "type": "multiple", "stem": "实践没有止境，理论创新也没有止境。改革开放以来，我们党继续推进马克思主义中国化时代\n化，形成和发展了中国特色社会主义理论体系。中国特色社会主义理论体系逐步形成和发展的\n社会历史条件是", "options": {"A": "对国际形势深刻变化和世界发展新趋势的深刻把握", "B": "对建设社会主义正反两方面经验的认真总结", "C": "对我国发展历史方位的科学判断", "D": "对中国特色社会主义建设实践经验的科学总结"}, "answer": "ABCD"}, {"id": "p2m-47", "num": 47, "type": "multiple", "stem": "中国特色社会主义理论体系是中国共产党长期探索的伟大理论创造，开辟了马克思主义中国化\n时代化新境界。中国特色社会主义理论体系是", "options": {"A": "全党全国各族人民团结奋斗的共同思想基础", "B": "战胜来自政治、经济、社会和自然界等一切风险和挑战的精神支柱", "C": "全面推进中华民族伟大复兴的根本指针", "D": "我们党最可宝贵的政治和精神财富\n第六章 邓小平理论"}, "answer": "ABCD"}, {"id": "p2m-48", "num": 48, "type": "multiple", "stem": "邓小平关于社会主义本质的科学概括，对于我们在坚持社会主义基本制度的基础上推进改革，\n指导改革沿着合乎社会主义本质要求的方向发展，对于建设中国特色社会主义，具有重大的政\n治意义、理论意义和实践意义。这一科学概括", "options": {"A": "既坚持了科学社会主义的基本原则，又赋予其鲜明的时代特色", "B": "反映了人民的利益和时代的要求", "C": "廓清了不合乎时代进步和社会发展规律的模糊观念", "D": "摆脱了长期以来拘泥于具体模式而忽略社会主义本质的错误倾向"}, "answer": "ABCD"}, {"id": "p2m-49", "num": 49, "type": "multiple", "stem": "党的十一届三中全会以后，以邓小平同志为主要代表的中国共产党人重新确立并丰富发展了实\n事求是的思想路线，提出了一系列有利于增强党的团结和调动一切积极因素的方针政策。党的\n思想路线的重新确立，解决了一系列重大理论和实践问题。具体来说就是，坚持解放思想、实\n事求是", "options": {"A": "有力推动和保证了拨乱反正的进行", "B": "破除了僵化的社会主义模式观念，坚持走自己的路", "C": "一切从社会主义初级阶段的实际出发", "D": "坚持以“三个有利于”作为检验一切工作是非得失的根本标准"}, "answer": "ABCD"}, {"id": "p2m-50", "num": 50, "type": "multiple", "stem": "社会主义制度建立以后，也有一个如何认清国情、正确判断我国社会所处历史方位的问题。社\n会主义初级阶段理论", "options": {"A": "揭示了当代中国的历史方位，为建设中国特色社会主义提供了总依据", "B": "是对马克思主义关于社会主义发展阶段理论的重大发展和重大突破", "C": "使我们党对社会主义建设的长期性、复杂性、艰巨性有了更加清醒的认识", "D": "正确回答了邓小平理论首要的基本的理论问题"}, "answer": "ABC"}, {"id": "p2m-51", "num": 51, "type": "multiple", "stem": "改革是一项崭新的事业，是一个大试验。判断改革和各方面工作的是非得失，归根到底，主要\n看是否有利于", "options": {"A": "发展社会主义社会的生产力", "B": "增强社会主义国家的综合国力", "C": "提高人民生活水平", "D": "完善社会主义的生产关系"}, "answer": "ABC"}, {"id": "p2m-52", "num": 52, "type": "multiple", "stem": "在南方谈话中，邓小平明确提出：“计划经济不等于社会主义，资本主义也有计划；市场经济不等\n于资本主义，社会主义也有市场。”邓小平这一重要论断蕴含着的社会主义市场经济理论的内涵有", "options": {"A": "计划经济和市场经济不是划分社会制度的标志", "B": "计划和市场都是经济手段", "C": "市场经济作为资源配置手段本身不具有制度属性", "D": "市场经济和不同的社会制度结合所表现出的性质是相同的"}, "answer": "ABC"}, {"id": "p2m-53", "num": 53, "type": "multiple", "stem": "1992年，针对人们思想中普遍存在的疑虑，邓小平南方谈话重申了深化改革、加速发展的必要\n性和重要性，并从中国实际出发，站在时代的高度，深刻地总结了十多年改革开放的经验教训，\n在一系列重大的理论和实践问题上，提出了一系列重要论断。这些重要论断包括", "options": {"A": "社会主义可以搞市场经济", "B": "不坚持社会主义，不改革开放，不发展经济，不改善人民生活，就没有出路", "C": "“三个有利于”标准", "D": "革命是解放生产力，改革也是解放生产力"}, "answer": "ABD"}, {"id": "p2m-55", "num": 55, "type": "multiple", "stem": "发展是党执政兴国的第一要务。关于正确认识和处理改革、发展、稳定的关系，以下说法正确\n的有", "options": {"A": "改革是动力，发展是目的，稳定是前提", "B": "要把改革的力度、发展的速度和社会可承受的程度统一起来", "C": "把不断改善人民生活作为处理改革、发展、稳定关系的重要结合点", "D": "在社会稳定中推进改革发展，通过改革发展促进社会稳定"}, "answer": "ABCD"}, {"id": "p2m-57", "num": 57, "type": "multiple", "stem": "“三个代表”重要思想最鲜明的特点和最突出的贡献，在于用一系列紧密联系、相互贯通的新\n思想新观点新论断", "options": {"A": "进一步回答了什么是社会主义、怎样建设社会主义的问题", "B": "创造性回答了建设什么样的党、怎样建设党的问题", "C": "继承和发展了马克思列宁主义、毛泽东思想、邓小平理论", "D": "深化了我们对新的时代条件下推进中国特色社会主义事业、加强党的建设的规律的认识\n第八章 科学发展观"}, "answer": "ABCD"}, {"id": "p2m-58", "num": 58, "type": "multiple", "stem": "科学发展观创造性回答了新形势下实现什么样的发展、怎样发展等重大问题。科学发展观的集\n中概括是", "options": {"A": "第一要义是发展", "B": "核心立场是以人为本", "C": "基本要求是全面协调可持续", "D": "根本方法是统筹兼顾"}, "answer": "ABCD"}, {"id": "p2m-59", "num": 59, "type": "multiple", "stem": "科学发展观最鲜明的精神实质是", "options": {"A": "解放思想", "B": "实事求是", "C": "与时俱进", "D": "求真务实"}, "answer": "ABCD"}]}, {"id": "p3s", "title": "第三部分 习概 · 单选", "part": 3, "type": "single", "questions": [{"id": "p3s-1", "num": 1, "type": "single", "stem": "“十个明确”“十四个坚持”“十三个方面成就”“六个必须坚持”内在贯通、有机统一，共同构\n成了习近平新时代中国特色社会主义思想的科学体系。其中，构成了这一思想体系的四梁八柱，\n发挥着统摄作用的是", "options": {"A": "“十个明确”", "B": "“十四个坚持”", "C": "“十三个方面成就”", "D": "“六个必须坚持”"}, "answer": "A"}, {"id": "p3s-2", "num": 2, "type": "single", "stem": "党的二十大提出的“六个必须坚持”,是习近平新时代中国特色社会主义思想的世界观、方法论\n和贯穿其中的立场观点方法的重要体现。在这“六个必须坚持”中，必须坚持自信自立是", "options": {"A": "根本价值立场", "B": "内在精神特质", "C": "鲜明理论品格", "D": "重要实践要求\n第一章 新时代坚持和发展中国特色社会主义"}, "answer": "B"}, {"id": "p3s-3", "num": 3, "type": "single", "stem": "新时代坚持和发展中国特色社会主义，必须坚定道路自信、理论自信、制度自信、文化自信。我\n们坚定“四个自信”的理论支撑和根本依据是", "options": {"A": "世界百年变局加速演进", "B": "江山就是人民，人民就是江山", "C": "实现中华民族伟大复兴进入不可逆转的历史进程", "D": "社会主义必然代替资本主义的客观规律"}, "answer": "D"}, {"id": "p3s-4", "num": 4, "type": "single", "stem": "坚定中国特色社会主义道路自信、理论自信、制度自信，说到底是要坚定", "options": {"A": "政治自信", "B": "历史自信", "C": "战略自信", "D": "文化自信"}, "answer": "D"}, {"id": "p3s-5", "num": 5, "type": "single", "stem": "中国特色社会主义进入新时代，是长期以来特别是党的十八大以来我们党领导人民不懈奋斗的必\n然结果，是我们党在科学把握形势和实践发展变化基础上作出的重大判断。新时代是我国发展新\n的历史方位，标志着中国特色社会主义事业进入了新的发展阶段。中国特色社会主义进入新时代\n重大判断的基本依据是", "options": {"A": "我国社会主要矛盾发生新变化", "B": "党的主要任务发生新变化", "C": "中国和世界关系发生新变化", "D": "发展理念和思路发生新变化"}, "answer": "A"}, {"id": "p3s-6", "num": 6, "type": "single", "stem": "“四个全面”战略布局，是新的时代条件下坚持和发展中国特色社会主义、推进改革开放和社会主\n义现代化建设的战略抉择。“四个全面”战略布局既有战略目标又有战略举措，每个“全面”之间\n具有紧密的内在逻辑，是一个整体战略部署的有序展开。在“四个全面”中居于引领地位的是", "options": {"A": "全面深化改革", "B": "全面依法治国", "C": "全面从严治党", "D": "全面建设社会主义现代化国家\n第二章 以中国式现代化全面推进中华民族伟大复兴"}, "answer": "D"}, {"id": "p3s-7", "num": 7, "type": "single", "stem": "习近平指出：“中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特\n征，更有基于自己国情的中国特色。”党的二十大集中概括了中国式现代化五个方面的中国特色，\n深刻揭示了中国式现代化的科学内涵，这是理论概括，也是实践要求。关于中国式现代化，以下\n内容正确的是\n①人口规模巨大的现代化是中国式现代化的显著特征\n②全体人民共同富裕的现代化是中国式现代化的本质特征\n③既要物质富足、也要精神富有，是中国式现代化的崇高追求\n④促进人与自然和谐共生，是中国式现代化区别于西方现代化的显著标志", "options": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④"}, "answer": "A"}, {"id": "p3s-8", "num": 8, "type": "single", "stem": "在长期实践过程中，党领导人民不懈探索现代化道路，取得了社会主义现代化建设的伟大成就，\n用几十年时间走完了发达国家几百年走过的工业化历程。我国现代化建设的出发点和落脚点是", "options": {"A": "完善和发展中国特色社会主义制度", "B": "增进民生福祉、促进社会公平", "C": "实现人民对美好生活的向往", "D": "实现高质量发展\n第三章 坚持党的全面领导"}, "answer": "C"}, {"id": "p3s-13", "num": 13, "type": "single", "stem": "习近平指出：“时代是出卷人，我们是答卷人，人民是阅卷人。”我们党做好一切工作的价值取\n向和根本标准是", "options": {"A": "促进国民经济发展", "B": "维护国家长治久安", "C": "增强国际影响力", "D": "让群众满意\n新思想·单选\n新思想·单选"}, "answer": "D"}, {"id": "p3s-14", "num": 14, "type": "single", "stem": "发展是党执政兴国的第一要务。发展的出发点和落脚点是", "options": {"A": "满足人民对美好生活的新期待", "B": "不断实现理论和实践上的创新突破", "C": "完善中国特色社会主义制度", "D": "推进国家治理体系和治理能力现代化"}, "answer": "A"}, {"id": "p3s-15", "num": 15, "type": "single", "stem": "实现现代化是近代以来中国人民孜孜以求的宏愿。中国共产党团结带领中国人民追求民族复兴\n的历史，也是一部不断探索现代化道路的历史。现代化的最终目标是实现", "options": {"A": "中华民族伟大复兴", "B": "物质财富极大丰富", "C": "社会关系高度和谐", "D": "人自由而全面的发展\n第五章 全面深化改革开放"}, "answer": "D"}, {"id": "p3s-16", "num": 16, "type": "single", "stem": "改革开放是当代中国最显著的特征、最壮丽的气象。习近平强调：“改革开放是决定当代中国命\n运的关键一招，也是决定实现‘两个一百年’奋斗目标、实现中华民族伟大复兴的关键一招。”\n改革开放的鲜明特征和首要任务是", "options": {"A": "解放思想", "B": "解放和发展社会生产力", "C": "解放和增强社会活力", "D": "以创新的思维和办法解决前进中的问题"}, "answer": "B"}, {"id": "p3s-17", "num": 17, "type": "single", "stem": "全面深化改革开放，不是某个领域某个方面的变革，而是涉及党和国家事业发展全局的体制机\n制变革。全面深化改革开放的主线是", "options": {"A": "重要领域和关键环节改革", "B": "经济体制改革", "C": "制度建设", "D": "统筹改革、发展、稳定"}, "answer": "C"}, {"id": "p3s-19", "num": 19, "type": "single", "stem": "在全面深化改革开放中，我们坚持了正确方法论，这是改革取得成就的原因之一。在改革方法\n论中，富有中国特色、符合中国国情的改革方法是", "options": {"A": "摸着石头过河", "B": "加强顶层设计", "C": "统筹改革发展稳定", "D": "重大改革于法有据"}, "answer": "A"}, {"id": "p3s-20", "num": 20, "type": "single", "stem": "正确处理好改革、发展、稳定的关系，是我国改革开放的一条重要经验。正确处理改革、发展、\n稳定关系的结合点是", "options": {"A": "不断开辟发展新领域、新赛道", "B": "人的自由而全面的发展", "C": "坚持守正创新", "D": "改善人民生活"}, "answer": "D"}, {"id": "p3s-21", "num": 21, "type": "single", "stem": "当前和今后一个时期是以中国式现代化全面推进强国建设、民族复兴伟业的关键时期。中国式现代化\n是在改革开放中不断推进的，也必将在改革开放中开辟广阔前景。进一步全面深化改革，必须\n①以推进中国式现代化为主题\n②以深化经济体制改革为重点\n③以文化体制改革为牵引\n④以制度建设为主线", "options": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④"}, "answer": "B"}, {"id": "p3s-24", "num": 24, "type": "single", "stem": "党的十八大以来，我们党对经济社会发展提出了许多重大理论和战略，其中最重要、最主要的是", "options": {"A": "供给侧结构性改革", "B": "以人民为中心的发展思想", "C": "新发展理念", "D": "推动高质量发展"}, "answer": "C"}, {"id": "p3s-25", "num": 25, "type": "single", "stem": "发展理念是发展行动的先导，是发展思路、发展方式、发展着力点的集中体现。发展理念从根\n本上决定着发展成效乃至成败。新发展阶段必须坚定不移贯彻创新、协调、绿色、开放、共享\n的新发展理念。其中，创新是", "options": {"A": "引领发展的第一动力", "B": "国家繁荣发展的必由之路", "C": "持续健康发展的内在要求", "D": "中国特色社会主义的本质要求"}, "answer": "A"}, {"id": "p3s-26", "num": 26, "type": "single", "stem": "高质量发展是新时代我国经济社会发展的鲜明主题，是全面建设社会主义现代化国家的首要任\n务。推动高质量发展的主线是", "options": {"A": "改革创新", "B": "实施扩大内需战略", "C": "深化供给侧结构性改革", "D": "加快构建新发展格局"}, "answer": "C"}, {"id": "p3s-27", "num": 27, "type": "single", "stem": "高质量发展是全面建设社会主义现代化国家的首要任务。推动高质量发展的战略基点是", "options": {"A": "加快实现高水平科技自立自强", "B": "加快构建新发展格局", "C": "推进农业现代化", "D": "更好统筹质的有效提升和量的合理增长"}, "answer": "B"}, {"id": "p3s-28", "num": 28, "type": "single", "stem": "《中华人民共和国国民经济和社会发展第十五个五年规划纲要》全面部署了“十五五”时期改\n革发展任务，其中一项就是“加快构建高水平社会主义市场经济体制，增强高质量发展动力”。\n构建高水平社会主义市场经济体制，关键是要处理好", "options": {"A": "政府和市场的关系", "B": "企业和市场的关系", "C": "中央和地方的关系", "D": "消费者和生产者的关系"}, "answer": "A"}, {"id": "p3s-29", "num": 29, "type": "single", "stem": "全面建成新发展格局任重道远，必须坚持问题导向和系统观念，着力破除制约加快构建新发展\n格局的主要矛盾和问题，不断扬优势、补短板、强弱项。要坚持把发展经济的着力点放在", "options": {"A": "制度创新上", "B": "乡村振兴上", "C": "对外开放上", "D": "实体经济上"}, "answer": "D"}, {"id": "p3s-30", "num": 30, "type": "single", "stem": "构建新发展格局，是根据我国发展阶段、发展环境、条件变化，特别是基于我国比较优势变化，\n审时度势作出的重大决策，是关系我国发展全局的重大战略任务。构建新发展格局最本质的特\n征是", "options": {"A": "实现高水平的自立自强", "B": "推动实施扩大内需战略同深化供给侧结构性改革有机结合", "C": "推动产业链供应链优化升级", "D": "建设现代化经济体系"}, "answer": "A"}, {"id": "p3s-31", "num": 31, "type": "single", "stem": "构建新发展格局是事关全局的系统性、深层次变革，是立足当前、着眼长远的战略谋划，是适\n应我国发展新阶段要求、塑造国际合作和竞争新优势的必然选择。构建新发展格局的重要前提\n和保障是", "options": {"A": "充分挖掘内需潜力", "B": "夯实我国经济发展的根基", "C": "促进区域协调发展", "D": "牢牢守住安全发展这条底线\n新思想·单选\n新思想·单选"}, "answer": "D"}, {"id": "p3s-32", "num": 32, "type": "single", "stem": "新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有高科技、高效\n能、高质量特征、符合新发展理念的先进生产力质态。新质生产力的显著特点是创新，这种创\n新包括\n①生产资料所有制和产品分配层面的创新\n②技术和业态模式层面的创新\n③管理和制度层面的创新\n④价值观和意识形态层面的创新", "options": {"A": "①②", "B": "①③", "C": "②④", "D": "②③"}, "answer": "D"}, {"id": "p3s-33", "num": 33, "type": "single", "stem": "新质生产力由技术革命性突破、生产要素创新性配置、产业深度转型升级而催生，以劳动者、\n劳动资料、劳动对象及其优化组合的跃升为基本内涵。新质生产力的核心标志是", "options": {"A": "全要素生产率大幅提升", "B": "创新和质优", "C": "稳定的产业链供应链", "D": "催生新产业、新模式、新动能"}, "answer": "A"}, {"id": "p3s-34", "num": 34, "type": "single", "stem": "加快建设以实体经济为支撑的现代化产业体系，关系我们在未来发展和国际竞争中赢得战略主\n动。支撑我国国际竞争力的基石是", "options": {"A": "大力发展战略性新兴产业", "B": "保持优势产业的领先地位", "C": "构建优质高效的服务业新体系", "D": "构建现代化基础设施体系"}, "answer": "B"}, {"id": "p3s-35", "num": 35, "type": "single", "stem": "脱贫摘帽不是终点，而是新生活、新奋斗的起点。接下来要做好乡村振兴这篇大文章，让乡亲\n们生活越来越美好。实施乡村振兴战略的总方针是", "options": {"A": "农业农村现代化", "B": "坚持农业农村优先发展", "C": "产业兴旺、生态宜居、乡风文明、治理有效、生活富裕", "D": "建立健全城乡融合发展体制机制和政策体系"}, "answer": "B"}, {"id": "p3s-36", "num": 36, "type": "single", "stem": "我国发展最大的不平衡是城乡发展不平衡，最大的不充分是农村发展不充分。必须坚持把解决\n好“三农”问题作为全党工作重中之重，扎实推进乡村全面振兴。推进乡村全面振兴的基础是", "options": {"A": "农业农村现代化", "B": "发展乡村特色产业", "C": "持续深化农村科技和改革创新", "D": "建立健全城乡融合发展体制"}, "answer": "B"}, {"id": "p3s-37", "num": 37, "type": "single", "stem": "促进区域协调发展，是贯彻新发展理念的重要内容，也是实现高质量发展的必然要求。新形势\n下促进区域协调发展，要深入实施区域协调发展战略、区域重大战略、主体功能区战略。以下\n属于区域协调发展战略的是", "options": {"A": "高标准、高质量建设雄安新区", "B": "推进长江经济带发展", "C": "推进粤港澳大湾区建设", "D": "鼓励东部地区加快推进现代化"}, "answer": "D"}, {"id": "p3s-38", "num": 38, "type": "single", "stem": "城镇化是现代化的必由之路，是解决农业、农村、农民问题的重要途径，是推动区域协调发展\n的有力支撑，是扩大内需和促进产业升级的重要抓手。新型城镇化的首要任务是", "options": {"A": "进一步深化户籍制度改革", "B": "推进公共服务共建共享", "C": "推进农业转移人口市民化", "D": "强化产业分工协作\n第七章 社会主义现代化建设的教育、科技、人才战略"}, "answer": "C"}, {"id": "p3s-39", "num": 39, "type": "single", "stem": ",教育是国之大计、党之大计，是功在当代、利在千秋的德政工程。建成教育强国是近代以来中\n华民族梦寐以求的美好愿望，是实现以中国式现代化全面推进强国建设、民族复兴伟业的\n①先导任务\n②坚实基础\n③战略支撑\n④鲜明标识", "options": {"A": "①②④", "B": "②③④", "C": "①③④", "D": "①②③"}, "answer": "D"}, {"id": "p3s-40", "num": 40, "type": "single", "stem": "教育是国之大计、党之大计，是功在当代、利在千秋的德政工程。教育的根本任务是", "options": {"A": "人民满意", "B": "价值观塑造", "C": "立德树人", "D": "为国育才"}, "answer": "C"}, {"id": "p3s-41", "num": 41, "type": "single", "stem": "教育是国家经济社会发展的支撑力量，在国家发展中始终具有基础性、先导性、全局性地位。\n建设高质量教育体系，办好人民满意的教育，根本在于", "options": {"A": "深化教育综合改革", "B": "确立科学的教育评价体系", "C": "落实学校办学自主权", "D": "建立健全更加合理高效的教育资源配置机制"}, "answer": "A"}, {"id": "p3s-42", "num": 42, "type": "single", "stem": "科技是国之利器，国家赖之以强，企业赖之以嬴，人民生活赖之以好。中国要强，中国人民生活\n要好，必须有强大科技。创新始终是一个国家、一个民族发展的不竭动力。科技创新的源头是", "options": {"A": "国家战略科技力量", "B": "现代工程技术、颠覆性技术创新", "C": "关键共性技术、前沿引领技术创新", "D": "基础研究\n第八章 发展全过程人民民主"}, "answer": "D"}, {"id": "p3s-43", "num": 43, "type": "single", "stem": "制度优势是一个政党、一个国家的最大优势。坚定中国特色社会主义制度自信，首先要", "options": {"A": "坚定对社会主义基本经济制度的自信", "B": "坚定对中国特色社会主义政治制度的自信", "C": "坚定对中国传统文化的自信", "D": "坚定对马克思主义在意识形态领域指导地位的根本制度的自信"}, "answer": "B"}, {"id": "p3s-44", "num": 44, "type": "single", "stem": "中国特色社会主义政治发展道路，是近代以来中国人民长期奋斗历史逻辑、理论逻辑、实践逻\n辑的必然结果，是坚持党的本质属性、践行党的根本宗旨的必然要求。走中国特色社会主义政\n治发展道路，最根本的是", "options": {"A": "坚持人民当家作主", "B": "坚持党的领导", "C": "坚持以人民为中心", "D": "坚持独立自主"}, "answer": "B"}, {"id": "p3s-45", "num": 45, "type": "single", "stem": "新时代我国民主政治领域具有重大创新意义的标志性成果是", "options": {"A": "协商民主", "B": "中国特色社会主义政治发展道路", "C": "党内民主", "D": "全过程人民民主"}, "answer": "D"}, {"id": "p3s-46", "num": 46, "type": "single", "stem": "多民族是我国的一大特色，也是我国发展的一大有利因素。中华民族和各民族的关系，是一个\n大家庭和家庭成员的关系，各民族的关系是一个大家庭里不同成员的关系。民族团结之本是", "options": {"A": "民族区域自治制度", "B": "各民族共同团结奋斗、共同繁荣发展", "C": "保障少数民族当家作主，管理本民族、本地区事务的权利", "D": "中华民族共同体意识"}, "answer": "D"}, {"id": "p3s-47", "num": 47, "type": "single", "stem": "统一战线是中国共产党夺取革命、建设、改革事业胜利的重要法宝，也是实现中华民族伟大复\n兴的重要法宝。统战工作的本质要求是", "options": {"A": "大团结大联合", "B": "围绕中心、服务大局", "C": "在尊重多样性中寻求一致性", "D": "统一思想"}, "answer": "A"}, {"id": "p3s-48", "num": 48, "type": "single", "stem": "统一战线是凝聚人心、汇聚力量的强大法宝。统一战线最鲜明的特征(或：统一战线最核心最\n根本的问题)是", "options": {"A": "人民至上", "B": "求同存异", "C": "党的领导", "D": "团结奋斗"}, "answer": "C"}, {"id": "p3s-49", "num": 49, "type": "single", "stem": "新时代，统一战线面临的时和势、肩负的使命和任务发生了重大变化。新时代爱国统一战线的\n历史责任是", "options": {"A": "高举爱国主义、社会主义旗帜", "B": "促进中华儿女大团结", "C": "坚持和完善中国特色社会主义制度", "D": "巩固和维护国家安全的民心基础\n新思想·单选\n新思想·单选\n第九章 全面依法治国(结合第五部分第六章的内容进行复习)"}, "answer": "B"}, {"id": "p3s-50", "num": 50, "type": "single", "stem": "习近平指出：“全面推进依法治国，必须走对路。如果路走错了，南辕北辙了，那再提什么要求\n和举措也都没有意义了。”我们党领导人民长期探索走出的中国特色社会主义法治道路，是全面\n依法治国的唯一正确道路。中国特色社会主义法治之魂是", "options": {"A": "依法治国和以德治国相结合", "B": "以人民为中心", "C": "党的领导", "D": "法律面前人人平等"}, "answer": "C"}, {"id": "p3s-51", "num": 51, "type": "single", "stem": "全面依法治国是“四个全面”战略布局的重要内容之一。推进全面依法治国，根本目的是", "options": {"A": "依法保障人民权益", "B": "努力让人民群众在每一个司法案件中感受到公平正义", "C": "提高依法执政水平", "D": "保证法律面前人人平等"}, "answer": "A"}, {"id": "p3s-52", "num": 52, "type": "single", "stem": "走中国特色社会主义法治道路，必须坚持法律面前人人平等。平等是", "options": {"A": "推进全面依法治国的根本目的", "B": "我们的法治同西方资本主义国家的法治最大的区别", "C": "社会主义法律的基本属性", "D": "全面依法治国的关键"}, "answer": "C"}, {"id": "p3s-53", "num": 53, "type": "single", "stem": "全面推进依法治国涉及很多方面，在实际工作中必须有一个总揽全局、牵引各方的总抓手，这\n个总抓手就是", "options": {"A": "建设中国特色社会主义法治体系", "B": "建设社会主义法治国家", "C": "坚持依法治国、依法执政、依法行政共同推进", "D": "坚持法治国家、法治政府、法治社会一体建设"}, "answer": "A"}, {"id": "p3s-54", "num": 54, "type": "single", "stem": "坚持依法治国首先要坚持依宪治国，坚持依法执政首先要坚持依宪执政。坚持依宪治国、依宪\n执政，作为首要任务的是", "options": {"A": "全面贯彻实施宪法", "B": "法治国家建设", "C": "法治社会建设", "D": "法治政府建设"}, "answer": "A"}, {"id": "p3s-55", "num": 55, "type": "single", "stem": "全面依法治国是国家治理的一场深刻革命，关系党执政兴国，关系人民幸福安康，关系党和国\n家长治久安。全面依法治国的重点任务和主体工程是", "options": {"A": "法治国家建设", "B": "法治政府建设", "C": "法治社会建设", "D": "依法行政\n第十章 建设社会主义文化强国"}, "answer": "B"}, {"id": "p3s-56", "num": 56, "type": "single", "stem": "文化是一个国家、一个民族的灵魂。国家的富强，民族的振兴，无不伴随着文化的历史性进步。\n建设社会主义文化强国，推动社会主义文化繁荣兴盛，关键在于", "options": {"A": "坚定中国特色社会主义文化自信", "B": "坚持马克思主义在意识形态领域的指导地位", "C": "以社会主义核心价值观引领文化建设", "D": "缩小城乡公共文化服务差距"}, "answer": "A"}, {"id": "p3s-57", "num": 57, "type": "single", "stem": "哲学社会科学是人们认识世界、改造世界的重要工具，是推动历史发展和社会进步的重要力量。\n当代中国哲学社会科学区别于其他哲学社会科学的根本标志是", "options": {"A": "坚持以马克思主义为指导", "B": "坚持正确的政治方向", "C": "坚持党性原则", "D": "坚持以人民为中心"}, "answer": "A"}, {"id": "p3s-58", "num": 58, "type": "single", "stem": "新闻舆论工作是治国理政、定国安邦的大事。做好新闻舆论工作的第一位要求是", "options": {"A": "做大做强主流舆论阵地", "B": "管好用好互联网", "C": "提高新闻舆论传播力、引导力、影响力、公信力", "D": "坚持正确的政治方向"}, "answer": "D"}, {"id": "p3s-59", "num": 59, "type": "single", "stem": "电影《南京照相馆》上映13天，票房超过17亿元。调查显示，《南京照相馆》的观众满意度\n居2025年电影首位。《南京照相馆》的表达，“新”在摆脱了宏大叙事容易“见事不见人”的\n窠白，开阔了对主旋律和重大题材的理解。该片集中笔墨“写”普通人在生死关头的大义与坚\n守，及其背后的精神脉络与人文底色。电影主创以正确的二战史观、严肃的创作态度，传递当\n代青年对历史真相的探求与思考，唤起全民族共同记忆，有力呼应了中国人民抗日战争暨世界\n反法西斯战争胜利80周年的重大主题。《南京照相馆》的成功启示我们，创新创造是", "options": {"A": "繁荣发展社会主义文化的重要方针", "B": "文化的生命所在、文化的本质特征", "C": "推动社会主义文化繁荣兴盛的唯一正确道路", "D": "决定社会主义文化事业前途命运的关键"}, "answer": "B"}, {"id": "p3s-61", "num": 61, "type": "single", "stem": "随着我国社会主要矛盾的转化，人民对美好生活的向往越来越强烈，对精神文化生活更加看重，\n文化需求高品质、个性化的特点更加明显。满足人民精神文化需求、保障人民文化权益的基本\n途径是", "options": {"A": "繁荣发展文化事业和文化产业", "B": "推动中华优秀传统文化创造性转化、创新性发展", "C": "提升国家文化软实力", "D": "保护好、传承好文化遗产\n第十一章 以保障和改善民生为重点加强社会建设"}, "answer": "A"}, {"id": "p3s-62", "num": 62, "type": "single", "stem": "全面建设社会主义现代化国家，是一项伟大而艰巨的事业，前途光明，任重道远。全面建设社\n会主义现代化国家，出发点和落脚点是", "options": {"A": "让人民生活越过越好", "B": "国家富强、民族振兴", "C": "国家长治久安、社会安定有序", "D": "解放和增强社会活力"}, "answer": "A"}, {"id": "p3s-63", "num": 63, "type": "single", "stem": "改革、发展、稳定是我国社会主义现代化建设的三个重要支点。其中，发展是解决一切经济社\n会问题的关键。发展的根本目的是", "options": {"A": "消除绝对贫困", "B": "增进民生福祉", "C": "跳出历史周期率", "D": "促进社会稳定"}, "answer": "B"}, {"id": "p3s-64", "num": 64, "type": "single", "stem": "民生事关人民的生存生活生计，事关民心所向、民情所系、民意所指，决定党的事业成败和国\n家命运兴衰。保障和改善民生的重要方针是", "options": {"A": "坚持尽力而为、量力而行", "B": "坚守底线、突出重点", "C": "完善制度、引导预期", "D": "坚持人人尽责、人人享有"}, "answer": "A"}, {"id": "p3s-65", "num": 65, "type": "single", "stem": "改善民生、实现发展成果由人民共享最重要最直接的方式是", "options": {"A": "稳就业", "B": "城镇化", "C": "社会保障", "D": "收入分配\n新思想·单选\n新思想·单选"}, "answer": "B"}, {"id": "p3s-67", "num": 67, "type": "single", "stem": "经过接续奋斗。我国社会建设全面加强，人民安居乐业、社会安定有序的良好局面不断巩固发\n展，人民对美好生活的向往不断变为现实。新时代加强社会建设的重要着力点是", "options": {"A": "健全和完善社会保障体系", "B": "正确把握民生和发展的关系", "C": "全面推进健康中国建设", "D": "防范化解重大风险\n第十二章 建设社会主义生态文明"}, "answer": "A"}, {"id": "p3s-68", "num": 68, "type": "single", "stem": "生态环境变化直接影响文明的兴衰演替。生态环境问题归根到底是", "options": {"A": "政府与市场的关系问题", "B": "人与社会的关系问题", "C": "人与人的关系问题", "D": "经济发展方式和生活方式问题"}, "answer": "D"}, {"id": "p3s-69", "num": 69, "type": "single", "stem": "生态兴则文明兴，生态衰则文明衰。生态环境是人类生存最为基础的条件，生态文明建设是关\n系中华民族永续发展的根本大计。解决生态环境问题的治本之策是", "options": {"A": "资源循环利用", "B": "绿色低碳发展", "C": "产业结构优化升级", "D": "严守生态保护红线"}, "answer": "B"}, {"id": "p3s-70", "num": 70, "type": "single", "stem": "实现碳达峰碳中和，是中国站在对人类文明负责的高度，基于实现可持续发展的内在要求作出\n的重大决策部署。实现碳达峰碳中和的关键是", "options": {"A": "大力推进循环经济", "B": "实施节能降碳增效行动", "C": "能源绿色低碳转型", "D": "巩固提升碳汇能力\n第十三章 维护和塑造国家安全"}, "answer": "C"}, {"id": "p3s-71", "num": 71, "type": "single", "stem": "总体国家安全观，既回答了如何解决好大国发展进程中面临的共性安全问题，同时又回答了如\n何解决好中华民族伟大复兴关键时期面临的特殊安全问题，系统提出了一系列具有原创性、时\n代性的重要观点，为破解我国国家安全面临的难题、推进新时代国家安全工作提供了基本遵循。\n新时代中国国家安全的生命线是", "options": {"A": "人民安全", "B": "政治安全", "C": "坚守维护国家利益准则", "D": "防范化解国家安全风险"}, "answer": "B"}, {"id": "p3s-72", "num": 72, "type": "single", "stem": "构建新发展格局是事关全局的系统性、深层次变革，是立足当前、着眼长远的战略谋划，是适\n应我国发展新阶段要求、塑造国际合作和竞争新优势的必然选择。构建新发展格局的重要前提\n和保障是", "options": {"A": "主动塑造于我有利的外部安全环境", "B": "夯实我国经济发展的根基", "C": "统筹维护国家安全各类要素、各个领域、各方资源、各种手段", "D": "牢牢守住安全发展这条底线"}, "answer": "D"}, {"id": "p3s-73", "num": 73, "type": "single", "stem": "构建新安全格局是应对国家安全形势新变化、新趋势的战略选择。要坚定不移走中国特色国家\n安全道路，加快构建统筹各领域安全的新安全格局。应对各领域安全风险挑战的首要任务是", "options": {"A": "维护国土安全", "B": "维护政治安全", "C": "维护社会安全", "D": "维护粮食安全"}, "answer": "B"}, {"id": "p3s-74", "num": 74, "type": "single", "stem": "总体国家安全观以人民安全为宗旨，以政治安全为根本，实现政治安全、人民安全、国家利益\n至上有机统一。其中，居于中心地位的是", "options": {"A": "政治安全", "B": "人民安全", "C": "国家利益至上", "D": "确保实现党的长期执政、人民安居乐业、国家长治久安"}, "answer": "B"}, {"id": "p3s-75", "num": 75, "type": "single", "stem": "构建新安全格局是全面彻落实总体国家安全观的重大举措。构建统筹各领域安全的新安全格\n局的主阵地、主战场是", "options": {"A": "维护意识形态安全", "B": "维护制度安全", "C": "维护政权安全", "D": "维护重点领域国家安全\n第十四章 建设巩固国防和强大人民军队"}, "answer": "D"}, {"id": "p3s-76", "num": 76, "type": "single", "stem": "2025年9月3日，纪念中国人民抗日战争暨世界反法西斯战争胜利80周年大会在首都北京隆\n重举行。人民军队光荣接受党和人民检阅。阅兵场上，一系列先进装备震撼亮相：新型坦克、\n步兵战车等新一代传统陆战兵器，无人、水下、网电等领域新型作战装备，高超声速导弹、战\n略导弹等国之重器⋯⋯“以武止戈、砥定乾坤”,彰显的是新时代中国发展进步的硬核实力，展\n现的是人民军队捍卫和平的强大能力。“能战方能止战，准备打才可能不必打，越不能打越可能\n挨打。”这说明，强军兴军，核心是", "options": {"A": "听党指挥", "B": "能打胜仗", "C": "作风优良", "D": "艰苦奋斗"}, "answer": "B"}, {"id": "p3s-77", "num": 77, "type": "single", "stem": "坚持党对人民军队绝对领导的根本制度和根本实现形式是", "options": {"A": "支部建在连上", "B": "政治委员制", "C": "军委主席负责制", "D": "首长分工负责制"}, "answer": "C"}, {"id": "p3s-78", "num": 78, "type": "single", "stem": "党的十八大以来，我们深入推进政治建军理论探索和实践创造，形成了新时代政治建军方略，\n明确政治建军是", "options": {"A": "掌握一切领导的基础", "B": "人民军队立军之本", "C": "我军胜利法宝", "D": "我军的生命线\n第十五章 坚持“一国两制”和推进祖国完全统一"}, "answer": "B"}, {"id": "p3s-79", "num": 79, "type": "single", "stem": "“一国两制”是中国共产党领导人民实现祖国和平统一的伟大构想。“一国两制”方针的最高原\n则是", "options": {"A": "维护国家主权、安全、发展利益", "B": "实现祖国和平统一", "C": "确保中华民族伟大复兴进程不被迟滞甚至中断", "D": "政权必须掌握在爱国者手中"}, "answer": "A"}, {"id": "p3s-80", "num": 80, "type": "single", "stem": "新时代党解决台湾问题的总体方略内涵丰富、逻辑严密、系统完备，深刻回答了推进祖国统一\n的一系列重大理论和实践问题，是我们党对台大政方针的继承发展和集大成。其中，作为统一\n的历史方位的是", "options": {"A": "坚持在祖国大陆发展进步基础上解决台湾问题", "B": "坚持一个中国原则和“九二共识”", "C": "坚持推动两岸关系和平发展、融合发展", "D": "坚持在中华民族伟大复兴进程中推进祖国统一\n新思想·单选\n新思想·单选"}, "answer": "D"}, {"id": "p3s-81", "num": 81, "type": "single", "stem": "在新时代党解决台湾问题的总体方略中，作为统一的战略支撑的是", "options": {"A": "坚持决不承诺放弃使用武力", "B": "坚持粉碎“台独”分裂图谋", "C": "坚持团结台湾同胞、争取台湾民心", "D": "坚持反对外部势力干涉\n第十六章 中国特色大国外交和推动构建人类命运共同体"}, "answer": "A"}, {"id": "p3s-85", "num": 85, "type": "single", "stem": "把党的建设作为一项伟大工程来推进，是我们党的一大创举，是我们党领导人民进行伟大社会\n革命的重要法宝。党的建设的一贯要求和根本方针是", "options": {"A": "坚持思想建党和制度治党相统一", "B": "坚持党内监督和群众监督相统一", "C": "自我净化、自我完善、自我革新、自我提高", "D": "党要管党、从严治党"}, "answer": "D"}, {"id": "p3s-86", "num": 86, "type": "single", "stem": "把党的建设作为一项伟大工程来推进，是我们党的一大创举，是我们党领导人民进行伟大社会\n革命的重要法宝。深入推进党的建设，作为统领的是", "options": {"A": "政治建设", "B": "思想建设", "C": "作风建设", "D": "制度建设"}, "answer": "A"}, {"id": "p3s-87", "num": 87, "type": "single", "stem": "党内政治生活的首要任务是", "options": {"A": "保证全党服从中央", "B": "维护党中央权威和集中统一领导", "C": "营造良好政治生态、提高政治能力", "D": "加强思想教育和理论武装"}, "answer": "D"}, {"id": "p3s-88", "num": 88, "type": "single", "stem": "一颗苹果，照鉴党的优良作风，映照为民造福的初心。2025年春节前夕，习近平在辽宁考察时\n再次提起一个关于苹果的红色故事：辽沈战役期间，锦州乡间的苹果熟了，解放军战士行军路\n过，虽然饥渴难耐，却一个都没有摘。“毛主席说，‘不吃是很高尚的，而吃了是很卑鄙的，因\n为这是人民的苹果’。”总书记的话意味深长，“这样的苹果，我们现在也不能吃。”由此可见，\n作风问题的核心是", "options": {"A": "党同人民群众的关系问题", "B": "“不忘初心、牢记使命”", "C": "抓住领导干部这个“关键少数”", "D": "推进作风建设常态化长效化"}, "answer": "A"}, {"id": "p3s-89", "num": 89, "type": "single", "stem": "全面从严治党永远在路上，党的自我革命永远在路上。最彻底的自我革命是", "options": {"A": "党风廉政建设", "B": "让人民来监督政府", "C": "建立不忘初心、牢记使命的长效制度", "D": "反腐败"}, "answer": "D"}, {"id": "p3s-90", "num": 90, "type": "single", "stem": "治国必先治党，党兴才能国强。党的十八大以来，以习近平同志为核心的党中央以刀刃向内、\n刮骨疗毒的勇气，打出了一套自我革命的“组合拳”。开启新时代中国共产党人再塑自身形象的\n“第一行动”是", "options": {"A": "开展反腐败斗争", "B": "全面从严治党", "C": "中央八项规定", "D": "加强党中央对重大工作的领导"}, "answer": "C"}, {"id": "p3s-91", "num": 91, "type": "single", "stem": "中国共产党区别于其他政党的显著标志，也是我们党最大的优势、最鲜明的品格的是", "options": {"A": "勇于自我革命", "B": "密切联系群众", "C": "独立自主", "D": "守正创新"}, "answer": "A"}, {"id": "p3s-92", "num": 92, "type": "single", "stem": "习近平总书记在二十届中央纪委三次全会上发表重要讲话，系统阐述党的自我革命的重要思想，\n科学回答党的自我革命“为什么要”“为什么能”“怎样推进”的重大问题，特别是明确提出\n“九个以”的实践要求，为新时代新征程深入推进党的自我革命提供了强大思想武器和科学行动\n指南。党的自我革命的根本目的是", "options": {"A": "跳出历史周期率", "B": "解决大党独有难题", "C": "引领伟大社会革命", "D": "正风肃纪反腐"}, "answer": "C"}, {"id": "p3s-93", "num": 93, "type": "single", "stem": "以伟大自我革命引领伟大社会革命是新时代中国特色社会主义发展的显著特点。实现伟大自我\n革命的重要途径是", "options": {"A": "自我净化、自我完善、自我革新、自我提高", "B": "自我管理、自我服务、自我教育、自我监督", "C": "道路自信、理论自信、制度自信、文化自信", "D": "政治意识、大局意识、核心意识、看齐意识"}, "answer": "A"}]}, {"id": "p3m", "title": "第三部分 习概 · 多选", "part": 3, "type": "multiple", "questions": [{"id": "p3m-1", "num": 1, "type": "multiple", "stem": "习近平新时代中国特色社会主义思想是马克思主义基本原理同中国具体实际相结合、同中华优秀\n传统文化相结合的重大成果，是坚持“两个结合”的光辉典范。“两个结合”", "options": {"A": "是我们党在探索中国特色社会主义道路中得出的规律性认识", "B": "让中国特色社会主义道路有了更加宏阔深远的历史纵深", "C": "拓展了中国特色社会主义道路的文化根基", "D": "开辟了广阔的理论和实践创新空间"}, "answer": "ABC"}, {"id": "p3m-12", "num": 12, "type": "multiple", "stem": "坚定中国特色社会主义道路自信、理论自信、制度自信，说到底是要坚定文化自信。文化自信是", "options": {"A": "更基础、更广泛、更深厚的自信", "B": "改革开放以来我们取得一切成绩和进步的根本原因", "C": "我们坚定“四个自信”的理论支撑和根本依据", "D": "一个国家、一个民族发展中最基本、最深沉、最持久的力量"}, "answer": "AD"}, {"id": "p3m-13", "num": 13, "type": "multiple", "stem": "经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的历史方位。中国特色社会\n主义进入了新时代有着充分的依据，它是", "options": {"A": "我国社会主要矛盾发生新变化的反映", "B": "党的主要任务发生新变化的反映", "C": "中国和世界关系发生新变化的反映", "D": "我国进入新发展阶段的反映"}, "answer": "ABC"}, {"id": "p3m-14", "num": 14, "type": "multiple", "stem": "中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和\n不平衡不充分的发展之间的矛盾。新时代我国社会主要矛盾的变化", "options": {"A": "是在社会主义初级阶段中发生的变化", "B": "是关系全局的历史性变化", "C": "没有改变我国仍处于并将长期处于社会主义初级阶段的基本国情", "D": "正确反映了我国全面建成小康社会之后的新特点"}, "answer": "ABC"}, {"id": "p3m-15", "num": 15, "type": "multiple", "stem": "新时代的伟大变革，在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具\n有的里程碑意义主要有", "options": {"A": "中国共产党在革命性锻造中更加坚强有力", "B": "中国人民的前进动力更加强大、奋斗精神更加昂扬、必胜信念更加坚定", "C": "实现中华民族伟大复兴进入不可逆转的历史进程", "D": "科学社会主义在21世纪的中国焕发出新的蓬勃生机\n第二章 以中国式现代化全面推进中华民族伟大复兴"}, "answer": "ABCD"}, {"id": "p3m-16", "num": 16, "type": "multiple", "stem": "中国共产党团结带领中国人民追求民族复兴的历史，也是一部不断探索现代化道路的历史。在\n新中国成立特别是改革开放以来长期探索和实践基础上，经过党的十八大以来在理论和实践上\n的创新突破，我们成功推进和拓展了中国式现代化。中国式现代化", "options": {"A": "既基于自身国情、又借鉴各国经验", "B": "既传承历史文化、又融合现代文明", "C": "是具有中国特色、符合中国实际的现代化", "D": "是强国建设、民族复兴的唯一正确道路\n新思想·多选\n新思想·多选"}, "answer": "ABCD"}, {"id": "p3m-17", "num": 17, "type": "multiple", "stem": "中国式现代化是中国共产党领导的社会主义现代化。中国共产党领导的社会主义现代化，是对\n中国式现代化的定性，是管总、管根本的。党的领导直接关系中国式现代化的根本方向、前途\n命运、最终成败。党的领导", "options": {"A": "决定中国式现代化的根本性质", "B": "确保中国式现代化锚定奋斗目标行稳致远", "C": "激发建设中国式现代化的强劲动力", "D": "凝聚建设中国式现代化的磅礴力量"}, "answer": "ABCD"}, {"id": "p3m-18", "num": 18, "type": "multiple", "stem": "中国式现代化是中国共产党领导人民长期探索和实践的重大成果。中国式现代化", "options": {"A": "深深植根于中华优秀传统文化", "B": "体现科学社会主义的先进本质", "C": "借鉴吸收一切人类优秀文明成果", "D": "代表人类文明进步的发展方向"}, "answer": "ABCD"}, {"id": "p3m-19", "num": 19, "type": "multiple", "stem": "习近平深刻指出：“我们将不断提高人民物质生活和精神生活水平，做到家家仓廪实衣食足，又\n让人人知礼节明荣辱。”这番话启示我们", "options": {"A": "先抓物质富足、再抓精神富有是社会主义现代化的根本要求", "B": "只有坚持“两个文明”协调发展，才能不断满足人民日益增长的美好生活需要", "C": "“两个文明”协调发展，根植于中华优秀传统文化的深厚土壤", "D": "物质文明和精神文明相协调，是中国式现代化的重要特征"}, "answer": "BCD"}, {"id": "p3m-20", "num": 20, "type": "multiple", "stem": "习近平指出：“中国式现代化，是我们为如何唤醒‘睡狮’、实现民族复兴这个重大历史课题所\n给出的答案，是选择自己的道路、做自己的事情。”中国式现代化创造了人类文明新形态，是一\n种全新的人类文明形态。中国式现代化", "options": {"A": "打破了“现代化=西方化”的迷思，展现了不同于西方现代化模式的新图景", "B": "是对西方式现代化理论和实践的重大超越", "C": "为广大发展中国家提供了全新选择", "D": "是当代中国共产党人回答和解决关乎人类前途命运的时代之问的中国方案\n第三章 坚持党的全面领导"}, "answer": "ABC"}, {"id": "p3m-21", "num": 21, "type": "multiple", "stem": "中国最大的国情就是中国共产党的领导。中国共产党领导", "options": {"A": "是中国人民和中华民族能够扭转近代以后的历史命运、取得今天伟大成就的最根本原因", "B": "是人民当家作主的可靠保障", "C": "关系中国特色社会主义的性质、方向和命运", "D": "是实现中华民族伟大复兴的根本保证"}, "answer": "ABCD"}, {"id": "p3m-22", "num": 22, "type": "multiple", "stem": "中国共产党领导是中国特色社会主义制度的最大优势，这是因为", "options": {"A": "党的自身优势是中国特色社会主义制度优势的主要来源", "B": "党能够集中全党全国力量、凝聚全民族共同意志，确保中国特色社会主义制度的显著优势充\n分彰显", "C": "党的领导是全面的、系统的、整体的，事无巨细都去管", "D": "党在实践中不断推进马克思主义中国化时代化，为坚持和完善中国特色社会主义制度提供强\n大理论优势"}, "answer": "ABD"}, {"id": "p3m-23", "num": 23, "type": "multiple", "stem": "党的领导是党和国家的根本所在、命脉所在，是全国各族人民的利益所系、命运所系。中国共\n产党是最高政治领导力量，这是", "options": {"A": "在历史发展中形成的", "B": "由我国国家性质决定的", "C": "由我国的政治制度体系决定的", "D": "由中华民族伟大复兴事业决定的"}, "answer": "ABCD"}, {"id": "p3m-24", "num": 24, "type": "multiple", "stem": "坚持党的全面领导，必须依靠制度来保障。党的领导制度是", "options": {"A": "我国的根本政治制度", "B": "党的领导核心地位的必然反映和内在要求", "C": "中国特色社会主义制度体系的核心", "D": "国家治理体系和治理能力现代化的关键\n第四章 坚持以人民为中心"}, "answer": "BCD"}, {"id": "p3m-25", "num": 25, "type": "multiple", "stem": "人民是我们党的生命之根、执政之基、力量之源，人民性是马克思主义的本质属性和鲜明品格。\n人民对美好生活的向往就是党的奋斗目标，要坚持以人民为中心。以下说法正确的有", "options": {"A": "人民立场是中国共产党的根本政治立场", "B": "人民立场是我们党区别于其他政党的显著标志", "C": "人民是中国共产党执政的最大底气、最深厚的根基", "D": "坚持人民至上是新时代党治国理政的根本价值取向"}, "answer": "ABCD"}, {"id": "p3m-26", "num": 26, "type": "multiple", "stem": "2024年10月，习近平在福建东山县考察期间，专门参观了谷文昌纪念馆，了解谷文昌同志感\n人事迹。习近平指出：“‘先祭谷公，后拜祖宗’,这是老百姓发自内心的敬仰。人民心里有一本\n账，金杯银杯不如老百姓的口碑。”“‘为官一任，造福一方’,只有走这条路，才是人间正道。”\n必须牢固树立和践行为民造福的政绩观，这是因为", "options": {"A": "让群众满意是我们党做好一切工作的价值取向和根本标准", "B": "人民是党的工作的最高裁决者和最终评判者", "C": "中国共产党把为民办事、为民造福作为最重要的政绩", "D": "全心全意为人民服务是党的根本宗旨"}, "answer": "ABCD"}, {"id": "p3m-27", "num": 27, "type": "multiple", "stem": "我们正在向第二个百年奋斗目标迈进。适应我国社会主要矛盾的变化，更好满足人民日益增长\n的美好生活需要，必须推动全体人民共同富裕取得更为明显的实质性进展。实现共同富裕", "options": {"A": "不仅是经济问题，而且是关系党的执政基础的重大政治问题", "B": "首先要通过全国人民共同奋斗把“蛋糕”做大做好，然后通过合理的制度安排把“蛋糕”切\n好分好", "C": "是一个长期的历史过程", "D": "必须等实现了现代化再来解决"}, "answer": "ABC"}, {"id": "p3m-28", "num": 28, "type": "multiple", "stem": "共同富裕是中国特色社会主义的本质要求，是中国式现代化的重要特征。要从全局角度来把握\n共同富裕。共同富裕是", "options": {"A": "全体人民共同富裕", "B": "人民群众物质生活和精神生活都富裕", "C": "所有人都同时富裕", "D": "所有地区同时达到一个富裕水准"}, "answer": "AB"}, {"id": "p3m-29", "num": 29, "type": "multiple", "stem": "坚持以人民为中心的发展思想，真正做到发展成果由人民共享，就必须落实到扎实推进全体人\n民共同富裕上，在推动共同富裕过程中促进人的全面发展。扎实推进共同富裕必须坚持的原\n则是", "options": {"A": "鼓励勤劳创新致富", "B": "坚持基本经济制度", "C": "尽力而为、量力而行", "D": "坚持循序渐进\n第五章 全面深化改革开放"}, "answer": "ABCD"}, {"id": "p3m-30", "num": 30, "type": "multiple", "stem": "改革开放是党和人民大踏步赶上时代的重要法宝，是当代中国最显著的特征、最壮丽的气象。\n改革开放是", "options": {"A": "我们党的一次伟大觉醒", "B": "坚持和发展中国特色社会主义的必由之路", "C": "决定当代中国命运的关键一步", "D": "决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招\n新思想·多选\n新思想，多选"}, "answer": "ABD"}, {"id": "p3m-31", "num": 31, "type": "multiple", "stem": "党的十一届三中全会是划时代的，党的十八届三中全会也是划时代的。党的十八届三中全会", "options": {"A": "开启了改革开放和社会主义现代化建设新时期", "B": "对全面深化改革进行总体擘画，确定了全面深化改革的总目标和时间表、路线图", "C": "实现改革由局部探索、破冰突围到系统集成、全面深化的转变", "D": "实现了改革理论和政策的一系列新的重大突破"}, "answer": "BCD"}, {"id": "p3m-32", "num": 32, "type": "multiple", "stem": "全面深化改革开放改什么、怎么改，这是一个带有根本性的问题。习近平强调：“我们的改革开\n放是有方向、有立场、有原则的。”坚持全面深化改革开放的正确方向，必须", "options": {"A": "坚持和改善党的全面领导", "B": "坚持和完善中国特色社会主义制度", "C": "坚持以人民为中心，促进社会公平正义、增进人民福祉", "D": "有利于进一步解放思想、进一步解放和发展社会生产力、进一步解放和增强社会活力"}, "answer": "ABCD"}, {"id": "p3m-33", "num": 33, "type": "multiple", "stem": "党的十八届三中全会通过的《中共中央关于全面深化改革若干重大问题的决定》,提出全面深化\n改革的总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化。国\n家治理体系和国家治理能力的关系是", "options": {"A": "国家治理体系和国家治理能力是相辅相成的", "B": "国家治理体系越完备国家治理能力就一定越强", "C": "通过好的国家治理体系能够提高国家治理能力", "D": "通过提高国家治理能力能够充分发挥国家治理体系的效能"}, "answer": "ACD"}, {"id": "p3m-34", "num": 34, "type": "multiple", "stem": "正确处理好改革、发展、稳定的关系，是我国改革开放的一条重要经验。全面深化改革开放要\n统筹改革、发展、稳定，下列选项内容正确的有", "options": {"A": "改革是经济社会发展的强大动力", "B": "发展是解决一切经济社会问题的关键", "C": "稳定是改革发展的前提", "D": "改善人民生活是正确处理改革、发展、稳定关系的结合点"}, "answer": "ABCD"}, {"id": "p3m-35", "num": 35, "type": "multiple", "stem": "党的十八大以来，我们党及时总结新鲜经验，不断深化对改革的规律性认识，形成了习近平总\n书记关于全面深化改革的一系列新思想、新观点、新论断，为进一步全面深化改革提供了根本\n遵循。关于进一步全面深化改革，以下说法正确的有", "options": {"A": "要始终朝着总目标指引的方向前进，该改的坚决改，不该改的不改", "B": "要全面协调推进各方面改革，确保同时满足所有人的利益诉求", "C": "要做到重大改革于法有据，平等保护全体公民和法人的合法权益", "D": "要稳步扩大制度型开放，主动对接国际高标准经贸规则"}, "answer": "ACD"}, {"id": "p3m-36", "num": 36, "type": "multiple", "stem": "当前，国际形势变乱交织，单边主义、保护主义逆流涌动，对国际经贸秩序造成严重冲击。我\n国外贸企业出口承压，出口转内销成为不少企业解决当前困难的重要选择。加快内外贸一体化\n发展是构建新发展格局、推动高质量发展的内在要求，对促进经济发展、扩大内需、稳定企业\n具有重要作用。内外贸一体化发展有利于推动企业", "options": {"A": "更好利用两个市场、两种资源", "B": "实现在国内外市场相互促进、协调发展", "C": "彻底消除外部环境急剧变化的不确定性", "D": "提升抗风险能力和生产经营韧性"}, "answer": "ABD"}, {"id": "p3m-37", "num": 37, "type": "multiple", "stem": "对外开放是中国的基本国策，中国推进改革开放坚定不移，开放的大门只会越开越大。数据显\n示，中国连续15年吸引外资超1000亿美元。截至2025年7月，“十四五”时期我国实际使用\n外资累计7148.7亿美元，累计新设外资企业23.5万家。外资企业贡献了中国1/3的进出口额、\n1/4的工业增加值、1/7的税收，创造了3000多万个就业岗位。与此同时，外资准入负面清单\n从最早的190项缩减到现在的全国版29项和自贸试验区版27项，制造业领域已实现“清零”。\n这表明", "options": {"A": "外资企业在推动中国改革开放和现代化建设中发挥了重要作用", "B": "外资经济巳成为社会主义经济的重要组成部分", "C": "中国已经形成比较健全的利用外资法规政策体系和工作体系", "D": "中国将长期成为外资企业投资兴业的沃土"}, "answer": "ACD"}, {"id": "p3m-38", "num": 38, "type": "multiple", "stem": "新中国成立70多年特别是改革开放40多年来，创造了经济快速发展和社会长期稳定“两大奇\n迹”,靠的是中国共产党坚强领导和中国人民团结奋斗，这其中也离不开国际社会支持帮助，包\n括在华外资企业作出的贡献。改革开放使中国快速进入世界市场、大踏步赶上时代，重要一条\n就是积极利用外资。外商来华投资在中国发展中发挥的重要作用有", "options": {"A": "带动了中国经济增长和就业", "B": "促进了中国技术和管理进步", "C": "助推了中国改革开放", "D": "形成了资本主导的发展模式\n第六章 推动高质量发展"}, "answer": "ABC"}, {"id": "p3m-39", "num": 39, "type": "multiple", "stem": "党的十九届五中全会提出，全面建成小康社会、实现第一个百年奋斗目标之后，我们要乘势而\n上开启全面建设社会主义现代化国家新征程、向第二个百年奋斗目标进军，这标志着我国进入\n了一个新发展阶段。新发展阶段是", "options": {"A": "我国社会主义初级阶段历史进程中的一个重要阶段", "B": "全面建设社会主义现代化国家、向第二个百年奋斗目标进军的重要阶段", "C": "我们党带领人民迎来从站起来、富起来到强起来历史性跨越的新阶段", "D": "所有国家实现社会主义现代化必须经历的阶段"}, "answer": "ABC"}, {"id": "p3m-41", "num": 41, "type": "multiple", "stem": "高质量发展是全面建设社会主义现代化国家的首要任务。高质量发展，就是", "options": {"A": "能够很好满足人民日益增长的美好生活需要的发展", "B": "体现新发展理念的发展", "C": "创新成为第一动力、协调成为内生特点、绿色成为普遍形态、开放成为必由之路、共享成为\n根本目的的发展", "D": "从“有没有”转向“好不好”的发展"}, "answer": "ABCD"}, {"id": "p3m-42", "num": 42, "type": "multiple", "stem": "新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有高科技、高效\n能、高质量特征，符合新发展理念的先进生产力质态。催生新质生产力的是", "options": {"A": "技术革命性突破", "B": "上层建筑的大幅跃升", "C": "产业深度转型升级", "D": "生产要素创新性配置"}, "answer": "ACD"}, {"id": "p3m-43", "num": 43, "type": "multiple", "stem": "习近平提出，发展新质生产力是推动高质量发展的内在要求和重要着力点。关于新质生产力，\n以下理解正确的有", "options": {"A": "战略性新兴产业、未来产业是发展新质生产力的主阵地", "B": "传统产业通过转型升级，也能成为新质生产力的重要部分", "C": "科技创新是发展新质生产力的核心要素", "D": "发展新质生产力以劳动者、劳动资料、劳动对象及其优化组合的跃升为核心标志\n新思想·多选\n新思想·多选"}, "answer": "ABC"}, {"id": "p3m-44", "num": 44, "type": "multiple", "stem": "习近平指出，新质生产力“以全要素生产率大幅提升为核心标志，特点是创新，关键在质优，\n本质是先进生产力”。这告诉我们，理解新质生产力，一个重要视角是全要素生产率。然而，全\n要素生产率增长不足是全球性挑战。例如，美国最近20年全要素生产率年均增速只有约0.7%,\n英国、法国、德国等工业化国家的全要素生产率增速也都陆续降到1%以内。相较于其他工业化\n国家，我国在提升全要素生产率增速方面有许多有利因素。这些有利因素包括", "options": {"A": "我国不缺乏提升全要素生产率所需的大规模生产场景、技术创新和模式创新的应用场景", "B": "我国超大规模市场的优势已经形成，经济始终保持高速增长", "C": "我国拥有数字化和绿色化发展所带来的巨大生产率增长空间", "D": "我国进一步全面深化改革将形成一个庞大的制度红利空间，带来资源配置效率提升的巨大可能"}, "answer": "ACD"}, {"id": "p3m-45", "num": 45, "type": "multiple", "stem": "坚持和完善社会主义基本经济制度是实现高质量发展的保障。社会主义基本经济制度", "options": {"A": "是我国生产关系在制度上的体现", "B": "在经济制度体系中具有基础性决定性地位", "C": "是中国特色社会主义制度的重要支柱", "D": "是解放和发展社会生产力、改善人民生活、维护社会公平正义、推进共同富裕的制度基础"}, "answer": "ABCD"}, {"id": "p3m-46", "num": 46, "type": "multiple", "stem": "公有制经济是全体人民的宝贵财富，公有制主体地位不能动摇，国有经济主导作用不能动摇，\n这是我国各族人民共享发展成果的制度性保证，也是巩固党的执政地位、坚持我国社会主义制\n度的重要保证。国有企业是", "options": {"A": "中国特色社会主义的重要物质基础", "B": "中国特色社会主义的政治基础", "C": "我们党执政兴国的重要支柱", "D": "我们党执政兴国的依靠力量"}, "answer": "ABCD"}, {"id": "p3m-47", "num": 47, "type": "multiple", "stem": "我国非公有制经济是改革开放以来在中国共产党的方针政策指引下发展起来的，我们要毫不动\n摇鼓励、支持、引导非公有制经济发展。非公有制经济是", "options": {"A": "社会主义经济的重要组成部分和我国经济社会发展的重要基础", "B": "国家税收的重要来源和就业创业的重要领域", "C": "稳定经济的重要基础和金融发展的重要依托", "D": "技术创新的重要主体和经济持续健康发展的重要力量"}, "answer": "BCD"}, {"id": "p3m-48", "num": 48, "type": "multiple", "stem": "几十年来，关于对民营经济在改革开放和社会主义现代化建设事业中地位和作用的认识、党和\n国家对民营经济发展的方针政策，我们党理论和实践是一脉相承、与时俱进的。党和国家对民\n营经济发展的基本方针政策，概括起来就是", "options": {"A": "非公有制经济是我国社会主义市场经济的重要组成部分，受宪法和法律保护", "B": "毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展", "C": "保证各种所有制经济依法平等使用生产要素、公平参与市场竞争、同等受到法律保护", "D": "促进各种所有制经济优势互补、共同发展，促进非公有制经济健康发展和非公有制经济人士\n健康成长"}, "answer": "ABCD"}, {"id": "p3m-49", "num": 49, "type": "multiple", "stem": "迈上新征程，我国民营经济只能壮大，不能弱化，而且要走向更加广阔的舞台。民营经济是", "options": {"A": "非公有制经济的主要经济组织形式", "B": "推进中国式现代化的生力军", "C": "高质量发展的重要基础", "D": "推动我国全面建成社会主义现代化强国、实现第二个百年奋斗目标的重要力量"}, "answer": "ABCD"}, {"id": "p3m-50", "num": 50, "type": "multiple", "stem": "纵深推进全国统一大市场建设，基本要求是“五统一、一开放”,即统一市场基础制度、统一市\n场基础设施、统一政府行为尺度、统一市场监管执法、统一要素资源市场，持续扩大对内对外\n开放。在“五统一、一开放”中，“统一政府行为尺度”的首次提出，意义重大。“统一政府行\n为尺度”有助于", "options": {"A": "促进要素资源流动", "B": "破解不同地区之间的过度“内卷”", "C": "从根本上杜绝权力寻租和腐败行为", "D": "为各类经营主体创造更公平的市场竞争环境"}, "answer": "ABD"}, {"id": "p3m-51", "num": 51, "type": "multiple", "stem": "构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，是推动高质量发展的战略\n基点，是关系我国发展全局的重大战略任务。构建新发展格局，是", "options": {"A": "适应我国发展新阶段要求的必然选择", "B": "塑造国际合作和竞争新优势的必然选择", "C": "基于我国比较优势变化，审时度势作出的重大决策", "D": "把握未来发展主动权的先手棋"}, "answer": "ABCD"}, {"id": "p3m-52", "num": 52, "type": "multiple", "stem": "内需是拉动经济增长的主动力和稳定锚。习近平强调，“要积极扩大国内需求”,“创造更多消费\n场景，持续释放消费和投资潜力”。扩大内需不是权宜之计，而是战略之举，这是因为", "options": {"A": "大国经济的特征都是内需为主导、内部可循环", "B": "扩大内需是应对外部冲击的有效途径", "C": "扩大内需是全面建设社会主义现代化国家的实践要求", "D": "扩大内需是满足人民对美好生活向往的现实需要"}, "answer": "ABCD"}, {"id": "p3m-53", "num": 53, "type": "multiple", "stem": "建设农业强国，必须走中国特色社会主义乡村振兴道路，大力实施乡村振兴战略，全面推进乡\n村振兴。实施乡村振兴战略", "options": {"A": "农业农村现代化是总目标", "B": "坚持农业农村优先发展是总方针", "C": "产业兴旺、生态宜居、乡风文明、治理有效、生活富裕是总要求", "D": "建立健全城乡融合发展体制机制和政策体系是制度保障"}, "answer": "ABCD"}, {"id": "p3m-54", "num": 54, "type": "multiple", "stem": "强国必先强农，农强方能国强。农业强国是社会主义现代化强国的根基。加快建设农业强国，\n必须巩固和完善农村基本经营制度，牢牢守住底线。这个底线就是", "options": {"A": "土地公有制性质不改变", "B": "耕地红线不突破", "C": "农民利益不受损", "D": "农村土地经营权不流转"}, "answer": "ABC"}, {"id": "p3m-55", "num": 55, "type": "multiple", "stem": "京津冀地区是我国经济最具活力、开放程度最高、创新能力最强、吸纳人口最多的地区之一。\n京津冀协同发展，是习近平总书记亲自谋划、亲自部署、亲自推动的重大国家战略，对于促进\n区域协调发展、形成新增长极具有重要意义。推动京津冀协同发展有利于", "options": {"A": "解决北京“大城市病”问题，探索人口经济密集地区优化开发的新模式", "B": "完善城市群形态，打造具有较强影响力的世界级城市群", "C": "增强区域发展协调性平衡性，积极服务构建新发展格局", "D": "高标准建设好北京“新两翼”,推动京津冀成为高质量发展建设共同富裕示范区"}, "answer": "ACD"}, {"id": "p3m-57", "num": 57, "type": "multiple", "stem": "教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。全面建设社会主义\n现代化国家", "options": {"A": "教育是根本，科技是关键，人才是基础", "B": "必须坚持科技是第一生产力、人才是第一资源、创新是第一动力", "C": "必须坚持教育优先发展、科技自立自强、人才引领驱动", "D": "必须深入实施科教兴国战略、人才强国战略、创新驱动发展战略"}, "answer": "ABCD"}, {"id": "p3m-58", "num": 58, "type": "multiple", "stem": "教育是国之大计、党之大计，是民族振兴、社会进步的基石。建设教育强国是", "options": {"A": "全面建成社会主义现代化强国的战略先导", "B": "实现高水平科技自立自强的重要支撑", "C": "促进全体人民共同富裕的有效途径", "D": "以中国式现代化全面推进中华民族伟大复兴的基础工程"}, "answer": "ABCD"}, {"id": "p3m-59", "num": 59, "type": "multiple", "stem": "科技自立自强是国家强盛之基、安全之要。加快建设科技强国，必须坚持走中国特色自主创新\n道路，发挥新型举国体制优势，完善国家创新体系，加快关键核心技术攻关，实现高水平科技\n自立自强。要打赢关键核心技术攻坚战，这是因为", "options": {"A": "关键核心技术是要不来、买不来、讨不来的", "B": "关键核心技术是国之重器", "C": "关键核心技术必须掌握在自己手中", "D": "掌握最关键最核心的技术才能从根本上保障国家经济安全、国防安全和其他安全"}, "answer": "ABCD"}, {"id": "p3m-61", "num": 61, "type": "multiple", "stem": "千秋基业，人才为先。全面建设社会主义现代化国家，要聚天下英才而用之，推动我国由人才\n大国迈向人才强国。人才是", "options": {"A": "人力资源中能力和素质较高的劳动者", "B": "实现民族振兴、赢得国际竞争主动的战略资源", "C": "我们党执政的最大底气和最深厚的根基", "D": "引领发展的第一动力\n第八章 发展全过程人民民主"}, "answer": "AB"}, {"id": "p3m-62", "num": 62, "type": "multiple", "stem": "中国特色社会主义政治制度是由根本政治制度、基本政治制度、重要政治制度等组成的制度体\n系。我国的社会主义民主政治制度安排，能够", "options": {"A": "有效保证人民享有更加广泛、更加充实的权利和自由，保证人民广泛参加国家治理和社会治理", "B": "有效调节国家政治关系，增强民族凝聚力，形成安定团结的政治局面", "C": "集中力量办大事", "D": "有效维护国家独立自主，有力维护国家主权、安全、发展利益，维护中国人民和中华民族的福祉"}, "answer": "ABCD"}, {"id": "p3m-63", "num": 63, "type": "multiple", "stem": "人民民主是社会主义的生命，全过程人民民主", "options": {"A": "植根于我国社会主义民主的长期实践", "B": "尼社会主义民主政治的本质属性", "C": "是人民当家作主和依法治国的根本保证", "D": "是新时代我国民主政治领域具有重大创新意义的标志性成果"}, "answer": "ABD"}, {"id": "p3m-64", "num": 64, "type": "multiple", "stem": "全过程人民民主的提出、实践和发展，鲜明展示了我们党始终高举人民民主旗帜、实现人民当\n家作主的坚定立场，深刻彰显了我国人民民主的鲜明特色和显著优势，实现了", "options": {"A": "过程民主和成果民主相统一", "B": "程序民主和实质民主相统一", "C": "直接民主和间接民主相统一", "D": "人民民主和国家意志相统一"}, "answer": "ABCD"}, {"id": "p3m-65", "num": 65, "type": "multiple", "stem": "全过程人民民主，既有完整的制度程序，也有完整的参与实践，把民主选举、民主协商、民主\n决策、民主管理、民主监督贯通起来，涵盖经济、政治、文化、社会、生态文明等各个方面，\n聚焦国家发展大事、社会治理难事、百姓日常琐事，具有", "options": {"A": "时间上的连续性", "B": "内容上的整体性", "C": "运行上的协同性", "D": "人民参与上的广泛性和持续性"}, "answer": "ABCD"}, {"id": "p3m-66", "num": 66, "type": "multiple", "stem": "全过程人民民主，是中国共产党团结带领人民追求民主、发展民主、实现民主的伟大创造，是\n新时代我国民主政治领域具有重大创新意义的标志性成果。全过程人民民主是", "options": {"A": "全链条、全方位、全覆盖的民主", "B": "最广泛、最真实、最管用的民主", "C": "最纯粹、最先进、最好的民主", "D": "协商民主、选举民主、人人民主的统一"}, "answer": "AB"}, {"id": "p3m-67", "num": 67, "type": "multiple", "stem": "对“十五五”规划编制工作，习近平强调要坚持科学决策、民主决策、依法决策，加强调研论\n证，广泛凝聚共识，以多种方式听取人民群众和社会各界的意见建议，充分吸收干部群众在实\n践中创造的新鲜经验。为此，“十五五”规划编制工作开展了为期1个月的网络征求意见活动。\n在此期间，累计收到网民建言超过311.3万条，覆盖经济、社会、生态等各领域。“十五五”规\n划编制工作网络征求意见活动", "options": {"A": "反映了数字时代民意表达方式的升级", "B": "彰显了党和政府以人民为中心、在治国理政中更广泛倾听民意的行动", "C": "体现了顶层设计和问计于民的统一", "D": "是全过程人民民主的一次生动实践"}, "answer": "ABCD"}, {"id": "p3m-68", "num": 68, "type": "multiple", "stem": "人民代表大会制度是我国的根本政治制度。这一根本制度，是我们党领导人民在人类政治制度\n史上的伟大创造。人民代表大会制度是好制度，它", "options": {"A": "符合我国国情和实际", "B": "体现社会主义国家性质", "C": "保证人民当家作主", "D": "能够有效凝聚全体人民力量一道推进中国式现代化"}, "answer": "ABCD"}, {"id": "p3m-69", "num": 69, "type": "multiple", "stem": "改革开放40多年来，人民代表大会制度为党领导人民创造经济快速发展奇迹和社会长期稳定奇\n迹提供了重要制度保障。实践证明，人民代表大会制度是我们党领导人民在人类政治制度史上\n的伟大创造，是在我国政治发展史乃至世界政治发展史上具有重大意义的全新政治制度。人民\n代表大会制度", "options": {"A": "有效保证国家沿着社会主义道路前进", "B": "有效保证国家治理跳出治乱兴衰的历史周期率", "C": "有效保证全体人民直接参与国家管理", "D": "有效保证国家政冶生活既充满活力又安定有序"}, "answer": "ABD"}, {"id": "p3m-70", "num": 70, "type": "multiple", "stem": ",人民代表大会制度坚持党的领导、人民当家作主、依法治国有机统一，坚决维护党中央权威和\n集中统一领导，坚持党总揽全局、协调各方的领导核心作用，有利于从制度上法律上坚持和巩\n固党的领导地位和执政地位，确保", "options": {"A": "党的主张通过法定程序成为国家意志", "B": "党组织推荐的人选通过法定程序成为国家政权机关的领导人员", "C": "党内法规体系上升为全社会都必须遵守的法律规范体系", "D": "党通过国家政权机关实施对国家和社会的领导\n新思想·多选\n新思想·多选"}, "answer": "ABD"}, {"id": "p3m-71", "num": 71, "type": "multiple", "stem": "人大代表作用的发挥，直接关系人民代表大会制度的运行，直接关系人大工作质量和水平。人\n大代表参加行使国家权力的主要形式是", "options": {"A": "出席人民代表大会会议", "B": "参与重要法律法规的制定修改、计划预算的审查批准和重大事项的审议决定", "C": "依法参加选举、表决重要人事任免事项", "D": "提出议案和建议"}, "answer": "ABCD"}, {"id": "p3m-72", "num": 72, "type": "multiple", "stem": "中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度构成了我\n国的基本政治制度，反映了我国社会主义民主政治的独特优势，是保障各政党、各阶层、各民\n族和基层人民群众当家作主的重要基础。中国人民政治协商会议是", "options": {"A": "实行中国共产党领导的多党合作和政治协商制度的重要机构", "B": "我国政治生活中发扬社会主义民主、实践全过程人民民主的重要形式", "C": "社会主义协商民主的重要渠道和专门协商机构", "D": "国家治理体系的重要组成部分"}, "answer": "ABCD"}, {"id": "p3m-73", "num": 73, "type": "multiple", "stem": "70多年来的实践充分证明，人民政协在人类政治制度发展史上具有独特政治价值，已经并将不\n断展现出旺盛生命力。人民政协", "options": {"A": "作为多党派参政的国家权力机关，有利于贯彻民主集中制、保证国家政治
