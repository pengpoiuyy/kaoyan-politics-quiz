<style>
  :root {
    --paper: #f5f0e6;
    --card: #fffdf8;
    --ink: #20262b;
    --ink-soft: #465058;
    --muted: #81796b;
    --line: #ded4c3;
    --jade: #2f6b56;
    --jade-soft: #e4efe8;
    --red: #a44437;
    --red-soft: #f7e7e1;
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
    --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  button, select { font: inherit; }
  .topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 12px clamp(16px, 4vw, 48px); background: rgba(255,253,248,.94); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
  .seal { width: 44px; height: 44px; border-radius: 12px; background: var(--jade); color: #fffdf8; display: grid; place-items: center; font-family: var(--serif); font-size: 20px; text-decoration: none; flex: 0 0 auto; }
  .brand h1 { margin: 0; font-family: var(--serif); font-size: clamp(17px, 2.2vw, 22px); letter-spacing: .04em; }
  .brand p { margin: 3px 0 0; color: var(--muted); font-size: 10.5px; }
  .stats { margin-left: auto; display: flex; gap: 16px; }
  .stat b { display: block; font-family: var(--serif); font-size: 20px; font-weight: 500; text-align: right; }
  .stat small { color: var(--muted); font-size: 10px; }
  .stat .accent { color: var(--jade); }
  .actions { display: flex; align-items: center; gap: 8px; }
  .ghost-btn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 12px; color: var(--ink-soft); font-size: 12px; cursor: pointer; }
  .ghost-btn:hover { border-color: var(--jade); color: var(--jade); }
  #section-select { max-width: 240px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 10px; color: var(--ink); font-size: 12px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 18px clamp(12px, 3vw, 28px) 110px; }
  .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; margin: 4px 0 12px; color: var(--muted); font-size: 11px; }
  .meta strong { color: var(--ink); font-family: var(--serif); font-size: 18px; font-weight: 500; }
  .progress { height: 4px; background: #e7dfd1; border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--jade); transition: width .25s ease; }
  #quiz { display: grid; gap: 14px; }
  .q-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 15px 16px 14px; box-shadow: 0 8px 22px -18px rgba(32,38,43,.35); }
  .q-card.ok { border-color: #b9d5c4; }
  .q-card.bad { border-color: #e3bdb4; }
  .q-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .q-num { font-family: var(--serif); color: var(--jade); font-size: 15px; }
  .q-type { border-radius: 999px; background: var(--jade-soft); color: var(--jade); padding: 3px 8px; font-size: 10px; }
  .q-type.multi { background: #f3ead8; color: #8a6127; }
  .q-stem { margin: 0 0 11px; font-size: 14.5px; line-height: 1.9; }
  .options { display: grid; gap: 7px; }
  .option { display: flex; align-items: flex-start; gap: 9px; width: 100%; text-align: left; border: 1px solid var(--line); background: #fffefb; border-radius: 10px; padding: 9px 10px; color: var(--ink-soft); font-size: 13px; line-height: 1.65; cursor: pointer; transition: border-color .15s, background .15s; }
  .option:hover { border-color: #b9c7b8; background: #fbf8ef; }
  .option .letter { flex: 0 0 21px; height: 21px; border-radius: 50%; background: #f1eadc; color: var(--ink); display: grid; place-items: center; font-family: var(--serif); font-size: 12px; }
  .option.picked { border-color: var(--jade); background: #f1f7f2; }
  .option.picked .letter { background: var(--jade); color: #fff; }
  .option.correct { border-color: #a9cdb7; background: #edf7f0; }
  .option.correct .letter { background: var(--jade); color: #fff; }
  .option.wrong { border-color: #dfb1a6; background: var(--red-soft); }
  .option.wrong .letter { background: var(--red); color: #fff; }
  .option.locked { cursor: default; }
  .submit-row { display: flex; justify-content: flex-end; margin-top: 9px; }
  .submit-btn { border: 0; border-radius: 9px; background: var(--jade); color: #fff; padding: 8px 14px; font-size: 12px; cursor: pointer; }
  .feedback { margin-top: 10px; border-radius: 9px; padding: 8px 10px; font-size: 11.5px; line-height: 1.7; }
  .feedback.ok { background: var(--jade-soft); color: #245846; }
  .feedback.bad { background: var(--red-soft); color: #7d3329; }
  .feedback b { font-family: var(--serif); }
  .pager { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 25; display: flex; align-items: center; gap: 18px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,253,248,.96); box-shadow: 0 14px 30px -18px rgba(32,38,43,.5); backdrop-filter: blur(12px); }
  .pager button { border: 0; background: transparent; color: var(--ink-soft); font-size: 13px; cursor: pointer; padding: 5px 8px; }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pager span { color: var(--muted); font-size: 12px; }
  .pager b { color: var(--ink); font-family: var(--serif); font-size: 15px; }
  #empty { text-align: center; padding: 60px 16px; color: var(--muted); }
  dialog { width: min(92vw, 420px); border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); padding: 0; }
  dialog::backdrop { background: rgba(32,38,43,.35); }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sheet-head h3 { margin: 0; font-family: var(--serif); font-size: 17px; font-weight: 500; }
  .icon-btn { border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; }
  .confirm-body { padding: 16px; }
  .confirm-body p { margin: 0 0 16px; color: var(--ink-soft); font-size: 13px; line-height: 1.8; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn-cancel, .btn-danger { border: 1px solid var(--line); border-radius: 9px; padding: 8px 14px; background: transparent; color: var(--ink-soft); font-size: 12px; cursor: pointer; }
  .btn-danger { border-color: #d9b3a7; color: #8d3b2f; background: #fbf0ec; }
  @media (max-width: 700px) {
    .topbar { flex-wrap: wrap; padding: 10px 14px; gap: 9px; }
    .stats { margin-left: auto; gap: 10px; }
    .stat b { font-size: 16px; }
    .actions { order: 5; width: 100%; }
    #section-select { flex: 1; max-width: none; }
    .q-stem { font-size: 14px; }
    .pager { bottom: 8px; width: calc(100vw - 24px); justify-content: space-between; }
  }
</style>

<script>
const STORAGE_KEY = "kaoyan-politics-xiao1000-2027-v1";
const SECTIONS = [{"id": "p1s", "title": "第一部分 马原 · 单选", "part": 1, "type": "single", "questions": [{"id": "p1s-1", "num": 1, "type": "single", "stem": "1921年中国共产党的成立，是中华民族伟大复兴征程中的一大里程碑。100多年来，不管形势和\n任务如何变化，不管遇到什么样的惊涛骇浪，我们党都始终把握历史主动、锚定奋斗目标，沿着\n正确方向坚定前行。历史和实践充分证明，我们党坚定信仰信念、把握历史主动的根本所在是", "options": {"A": "拥有马克思主义科学理论指导", "B": "坚持不懈用党的创新理论凝心铸魂", "C": "始终把人民放在心中最高位置", "D": "科学社会主义提供了解决实际问题的正确答案"}, "answer": "A"}, {"id": "p1s-2", "num": 2, "type": "single", "stem": "马克思、恩格斯并不是先知先觉的圣人，他们从小面对的也是一个充满矛盾的现实世界，在家\n庭、学校和社会的影响下，也曾接受过那个时代的唯心主义和资产阶级民主主义思想。但是资本\n主义制度的弊端和劳动群众渴求解放的呼声，促使他们立志进行社会变革，并走上求索科学真理\n的道路。1844年2月，马克思、恩格斯发表在《德法年鉴》上的论文表明，他们\n①完成了从唯心主义向唯物主义的转变\n②完成了从革命民主主义向共产主义的转变\n③实现了历史观上的伟大变革\n④为创立马克思主义奠定了思想前提", "options": {"A": "①②③", "B": "②③④", "C": "①③④", "D": "①②④"}, "answer": "D"}, {"id": "p1s-3", "num": 3, "type": "single", "stem": "马克思主义产生于19世纪40年代，为马克思主义的创立提供了直接的理论来源的是", "options": {"A": "德国古典哲学、英国古典政治经济学、英法空想社会主义", "B": "细胞学说、能量守恒与转化定律、生物进化论", "C": "古希腊罗马哲学、文艺复兴运动的思想成果、法国复辟时期历史学家的进步思想", "D": "朴素唯物主义、近代形而上学唯物主义、概念辩证法"}, "answer": "A"}, {"id": "p1s-4", "num": 4, "type": "single", "stem": "1845年，恩格斯在给马克思的一封信中提出：“目前首先需要我们做的，就是写出几本较大的著\n作，以便给许许多多非常愿意干但自己又干不好的一知半解的人以一个必要的支点。”由此可见，\n马克思、恩格斯之所以要创立马克思主义，是为了", "options": {"A": "证明社会主义革命可能在一国或数国首先发生并取得胜利", "B": "适应无产阶级实际斗争的要求", "C": "推动无产阶级从自觉转向自发", "D": "将无产阶级夺取政权的成功经验推广到所有国家"}, "answer": "B"}, {"id": "p1s-5", "num": 5, "type": "single", "stem": "1844年8月底，马克思、恩格斯在巴黎会面。这次会面使他们发现彼此的基本观点完全一致，于\n是开始了在科学理论研究和革命活动中的长期合作。马克思、恩格斯第一次合作的著作是", "options": {"A": "《神圣家族》", "B": "《德意志意识形态》", "C": "《哲学的贫困》", "D": "《共产党宣言》"}, "answer": "A"}, {"id": "p1s-6", "num": 6, "type": "single", "stem": "在人类思想史上，马克思主义第一次站在人民的立场探求人类自由解放的道路，人民性是马克思\n主义的", "options": {"A": "本质属性", "B": "首要的和基本的观点", "C": "唯一特征", "D": "根本价值目标"}, "answer": "A"}, {"id": "p1s-7", "num": 7, "type": "single", "stem": "马克思主义具有鲜明的科学性、人民性、实践性、发展性，这些特征体现了马克思主义的本质和\n使命，也展现出马克思主义的理论形象。马克思主义的基本特征，如果用一句话来概括就是", "options": {"A": "人民性与实践性的统一", "B": "科学性与实践性的统一", "C": "科学性与革命性的统一", "D": "实践性与发展性的统一\n第一章 世界的物质性及发展规律"}, "answer": "C"}, {"id": "p1s-8", "num": 8, "type": "single", "stem": "辩证唯物主义是中国共产党人的世界观和方法论。辩证唯物主义最基本、最核心的观点是", "options": {"A": "对立统一规律", "B": "世界的物质统一性原理", "C": "资本主义必然灭亡，社会主义必然胜利", "D": "人民群众创造历史"}, "answer": "B"}, {"id": "p1s-9", "num": 9, "type": "single", "stem": "唯物主义和唯心主义这两个专门的哲学术语有着特定的含义和确定的标准，不能随意乱用，也不\n能另立标准，否则会造成混乱。这里所说的特定含义和确定标准是指", "options": {"A": "对世界本原究竟是物质还是精神的回答", "B": "对存在和思维是否具有同一性的回答", "C": "对社会存在与社会意识关系的回答", "D": "对世界是怎样存在的问题的回答"}, "answer": "A"}, {"id": "p1s-11", "num": 11, "type": "single", "stem": "物质和意识的对立只有在非常有限的范围内才具有绝对的意义，超出这个范围便是相对的了。\n这个范围是指", "options": {"A": "物质和意识何者为第一性", "B": "物质和意识是否具有同一性", "C": "物质和意识何者更重要", "D": "物质和意识何者与社会生活的关系更密切"}, "answer": "A"}, {"id": "p1s-12", "num": 12, "type": "single", "stem": "“少年安得长少年，海波尚变为桑田。”唐代诗人李贺的这一诗句体现了", "options": {"A": "运动具有一维性", "B": "运动是静止的衡量尺度", "C": "运动是物质的根本属性", "D": "运动是物质的唯一特性"}, "answer": "C"}, {"id": "p1s-13", "num": 13, "type": "single", "stem": "法国生命哲学家柏格森十分强调运动变化，以至于他的哲学被称为“变的哲学”。在柏格森看\n来，“事物和状态不过是我们的心灵所采取的一种观点，事物是不存在的，存在的只有动作。”\n这句话的错误在于否认了", "options": {"A": "世界万物是永恒发展的", "B": "运动形式具有多样性", "C": "运动是事物的存在方式和唯一属性", "D": "物质是运动的承担者"}, "answer": "D"}, {"id": "p1s-14", "num": 14, "type": "single", "stem": ",人们用来测量时间的单位年、月、日等是靠天体在空间中的运动来确定的，测定宇宙天体之间\n距离的单位是用光在真空中沿直线传播一年的距离(即“光年”)来衡量的。这说明", "options": {"A": "时空是一切运动的观念载体", "B": "时空与物质运动不可分割", "C": "物质运动是绝对的，时空是相对的", "D": "物质运动是客观的，时空是主观的"}, "answer": "B"}, {"id": "p1s-15", "num": 15, "type": "single", "stem": "古人从日光中意识到，“辉光所烛，万里同晷”。然而同是时间，有人感觉它如年轮，一圈圈积\n累成参天大树，也有人感觉它如流沙，飞流不止无可奈何。时间观不同，意义感就大不相同。\n同样的时间却可能有着不同的时间观，这是因为", "options": {"A": "时间的客观性是相对的", "B": "时间是意识和观念的产物", "C": "人无法认识时间的无限性", "D": "人对时间的认识具有能动性"}, "answer": "D"}, {"id": "p1s-16", "num": 16, "type": "single", "stem": "人类的出现，使世界发生了二重分化，即从自然界中分化出人类社会，从客观世界中分化出主\n观世界。自然界与人类社会、客观世界与主观世界相分化的关键是", "options": {"A": "人的实践活动", "B": "人的意识活动", "C": "语言文字的出现", "D": "人脑的出现"}, "answer": "A"}, {"id": "p1s-17", "num": 17, "type": "single", "stem": "人类的出现，特别是人类改造世界的实践活动，极大地改变了世界的面貌，便世界发生了二重\n分化，即从自然界中分化出人类社会，从客观世界中分化出主观世界。人类社会与自然界的不\n同主要在于", "options": {"A": "在自然界中一切都是自发产生的，而在人类社会中一切都打着人的意识的印记", "B": "自然界受自然规律支配，而人类社会的发展方向是由每一个参与历史的人决定的", "C": "在自然界中有“人化自然”,而在人类社会中则没有自然物质和自然力的运用", "D": "自然界属于客观世界，而人类社会属于主观世界"}, "answer": "A"}, {"id": "p1s-18", "num": 18, "type": "single", "stem": "不少人体验过这样的小测试：面对同一张人物肖像，有人看到了满脸皱纹的老太太，有人看到\n的却是正值青春妙龄的年轻姑娘。关注角度、聚焦方位不同，看到的图像竟也存在天壤之别。\n对同一张肖像的两种看法都是", "options": {"A": "客观事物的主观映象", "B": "对现实世界的歪曲反映", "C": "人脑中固有形象的表现形式", "D": "意识主观自生的产物"}, "answer": "A"}, {"id": "p1s-19", "num": 19, "type": "single", "stem": "毕加索是20世纪的艺术大师。一次，毕加索画一头公牛，他画的第一幅公牛十分写实，结构严\n谨而形态逼真。但他并不满足，又相继画了十次。从第一幅到第十一幅，形体逐渐概括，线条\n逐步简练，到最后一幅只剩下寥寥几根线条，但那些简单的线条，却精练地表现了公牛的形与\n神，看到这幅画的人依然可以轻易地看出这是一头公牛。以上事例说明", "options": {"A": "客观事物的存在依赖于我们对它的认识", "B": "艺术创作的认识过程是非理性因素独立作用的结果", "C": "事物的本质可以直接为人的感官所感知", "D": "意识活动是一个主动的创造性过程"}, "answer": "D"}, {"id": "p1s-20", "num": 20, "type": "single", "stem": "定期体检对预防和发现疾病十分重要。很多人都会有意识地参加体检。不过，多数情况下，体\n检的内容只包括身体检查，而不包括心理检查。事实上，一个人的健康，既包括身体上的健康，\n也包括心理上的健康，二者同样重要。在快节奏的生活、高强度的工作中，一些人面临着比较\n沉重的心理压力，如果得不到疏导，轻则影响工作效率，重则可能给身体带来负面影响。“心理\n体检”也应该得到重视，因为", "options": {"A": "感觉和心理是人区别于动物的根本标志", "B": "意识具有调控人的行为和生理活动的作用", "C": "主观世界与客观世界的发展具有完全同步性", "D": "人的本质属性是包括身体和心理在内的各种自然属性之和"}, "answer": "B"}, {"id": "p1s-21", "num": 21, "type": "single", "stem": "“10万个小时成就一个好医生”,这句医学领域被广泛认同的话，在人工智能强大的学习能力面\n前已经不再绝对。在影像科室，基于深度学习算法，人工智能阅片技术通过大量医学图像数据\n训练，已具备识别、分析、诊断病灶的能力，大大提升了诊断效率。比如，上海瑞金医院“胸\n部肺结节CT辅助诊断应用”已广泛覆盖超过80%的病例，将原本7分钟的诊断时间缩短至\n2分钟；冠状动脉CT血管成像辅助诊断的应用将诊断时间从25分钟缩短至3分钟。人工智能\n在医疗等领域取得的突破性成就说明", "options": {"A": "人工智能作为一种新的实践主体，能够独立推动认识发展", "B": "人类意识中的所有内容都可以被化约为数字信号", "C": "人工智能已经超越人类智能的层级，可以代替人们做出决策", "D": "人工智能不仅可以模拟，而且能够扩展人脑的某些活动\n)"}, "answer": "D"}, {"id": "p1s-23", "num": 23, "type": "single", "stem": "民间有一种迷信说法叫作“喜鹊叫喜，乌鸦叫丧”。这句话的错误在于否定了联系的", "options": {"A": "普遍性", "B": "多样性", "C": "客观性", "D": "条件性"}, "answer": "C"}, {"id": "p1s-24", "num": 24, "type": "single", "stem": "近年来，微生物处理技术在我国得到了越来越广泛的运用。巧用微生物技术，可以改善水质，\n推进资源化利用。传统的污水处理主要有重力沉降、混凝澄清等物理方法，以及化学沉淀、氧\n化还原等化学方法。利用微生物来吸附、分解、氧化污水中的有机物，把不稳定的有机物降解\n为稳定无害的物质，同样可以使污水得到净化。这意味着人为创造一个适合微生物菌群生长的\n生态系统，继而通过微生物之间的协同作用实现能量传递和物质循环。更好认识微生物的特性\n和功能，善加利用，可以在处理污水、改善水质上实现更好的效果。巧用微生物改善水环境蕴\n含的哲理是", "options": {"A": "把握自然规律是认识的根本目的", "B": "人们可以任意改变事物存在和发展的条件", "C": "事物之间的联系都是人为的", "D": "人们可以发现并利用规律来实现自己的目的"}, "answer": "D"}, {"id": "p1s-25", "num": 25, "type": "single", "stem": "异地借牧，指牧民秋冬时节将牛羊从山区草场迁至周边农区，租田放牧，利用农作物采收后留\n下的秸秆接羔育肥。时间一般从当年10月至次年3月。“借牧”看上去颇费周折，其实是一笔\n多赢的买卖。牧民为冬季的牛羊找到了稳定的饲料供应地；农户挣了笔租地款，还节省了秸秆\n处理费；草原上的植被也获得休养生息的机会，生态效益显著。草畜矛盾，秸秆处置，放到一\n时一地，可能都是不太容易解决的问题，但通过“借牧”这一经营模式的创新，实现种养结合，\n两方面的问题都迎刃而解。“借牧”模式实现了牧民、农户、生态“多赢”,这一成功实践说明", "options": {"A": "事物发展的根本动力在于外部矛盾的相互转化", "B": "任何本物之间都可以通过某一中介或一系列中介发生联系", "C": "科学的治理理念是正确发挥人的主观能动性的根本途径", "D": "自然界的因果关系是通过人的有目的的活动而实现出来的"}, "answer": "B"}, {"id": "p1s-26", "num": 26, "type": "single", "stem": "发展的实质是新事物的产生和旧事物的灭亡。新、旧事物的区别在于", "options": {"A": "出现时间的先后", "B": "形式的新旧", "C": "力量的大小对比", "D": "同历史前进方向是否符合"}, "answer": "D"}, {"id": "p1s-27", "num": 27, "type": "single", "stem": "这两年，因为与“呜呼，起飞”谐音，“芜湖起飞”成为一个网络热词。不过，这不只是一个谐\n音楔，也是一个真实的发展故事。从零开始，用“十年磨一剑”的精神，安徽芜湖已经形成了\n一条涵盖整机组装、螺旋桨、航电系统等各方面的航空产业链。发展传统产业也好，壮大新兴\n产业也罢，都是一件“难而正确”的事，都无法一蹴而就。芜湖有个“1%工作法”,令人印象\n深刻。它指的是围绕影响企业利润的技术、用工、物流、制度性交易成本等因素，千方百计帮\n助企业在原基础上再提高1%的利润。1%看似不多，但对企业而言，却是在激烈的市场竞争中\n站稳脚跟、实现长远发展的重要有利因素，由此带来的复利效应，将是持久且深远的。“十年磨\n一剑”的精神和“1%工作法”启示我们，事物的发展", "options": {"A": "是一个直线上升的过程", "B": "取决于外部力量的干预", "C": "是通过不断的自我否定进行的", "D": "有一个量变的积累过程"}, "answer": "D"}, {"id": "p1s-28", "num": 28, "type": "single", "stem": "习近平在《深入理解新发展理念，推进供给侧结构性改革》一文中指出：“没有需求，供给就无\n从实现，新的需求可以催生新的供给；没有供给，需求就无法满足，新的供给可以创造新的需\n求。”这一论断蕴含的哲学原理是", "options": {"A": "没有离开个性的共性，也没有离开共性的个性", "B": "矛盾的斗争性是有条件的、相对的", "C": "矛盾的同一性在事物发展中具有重要作用", "D": "主要矛盾的主要方面决定着事物的性质"}, "answer": "C"}, {"id": "p1s-29", "num": 29, "type": "single", "stem": "俗话说，甘蔗没有两头甜，然而云南临沧的甘蔗却通过循环利用甜了两头。初榨得糖为“第一\n甜”。糖厂榨糖后，产生的主要废弃物包括蔗渣、糖蜜和滤泥，这些经过处理可以成为化肥生产\n中的“宝贝”,蔗渣还可“变身”代塑餐具等创造“第二甜”。对废弃物循环利用可以实现甘蔗\n从田间到车间的“两头甜”,这一成功实践说明", "options": {"A": "矛盾双方相互贯通，并在一定条件下相互转化", "B": "事物的发展呈现出不断周而复始循环的总趋势", "C": "自然物质的存在和功能依赖于人们对它的认识", "D": "事物经过否定之否定的过程向原来出发点回复"}, "answer": "A"}, {"id": "p1s-30", "num": 30, "type": "single", "stem": "《百喻经》中有一则典故：有个人十分饥饿，就去买饼子吃，他一连吃了六个饼子还是不饱，\n就再买第七个吃，刚吃了半个，就觉得很饱了。于是这人非常后悔，说：“前头的六个饼子是多\n吃的，吃了一点没有用，我只吃这半个饼就饱了。如果早知如此，就应该先吃这半个饼啊!”这\n个人的错误在于没有认识到", "options": {"A": "可能与现实是相互转化的", "B": "事物的发展是前进性和曲折性的统一", "C": "量变是质变的必要准备", "D": "偶然要通过必然为自己开辟道路"}, "answer": "C"}, {"id": "p1s-31", "num": 31, "type": "single", "stem": "“君子以思患而豫防之”,有备才能无患。党的十八大以来，习近平总书记十分重视底线思维，\n强调凡事不能超越底线。如法律底线、政策底线、利益底线、道德底线等，一旦被突破，就会\n出现无法接受的坏结果。从哲学的角度分析，底线是指", "options": {"A": "联系的条件性", "B": "度的关节点", "C": "主要矛盾", "D": "事物发展的连续性"}, "answer": "B"}, {"id": "p1s-32", "num": 32, "type": "single", "stem": "恩格斯指出：“在化学中，燃素说经过上百年的实验工作才提供了一些材料。而拉瓦锡利用这种\n材料才在普利斯特列提取出来的氧气中发现了想象中的燃素的实在对立物，从而推翻了全部燃\n素说。但是燃素说者的实验成果决不因此就被抛弃。正好相反，这些成果依然存在，只不过其\n表述被颠倒过来，从燃素说的语言翻译成了现今通行的化学语言，因此仍然保持着自己的有效\n性。”这说明", "options": {"A": "辩证否定是一事物否定另一事物", "B": "新、旧事物是通过否定环节联系起来的", "C": "只要敢于否定一切，历史就会向前发展", "D": "辩证否定是事物之间的相互否定"}, "answer": "B"}, {"id": "p1s-33", "num": 33, "type": "single", "stem": "“鸡蛋从外面打破是食物，从内部打破是生命。”从哲学上讲，这说明", "options": {"A": "外因必须通过内因起作用", "B": "辩证否定是事物内部矛盾运动的结果", "C": "真理是主观性和相对性的辩证统一", "D": "必然产生于事物内部的根本矛盾"}, "answer": "B"}, {"id": "p1s-34", "num": 34, "type": "single", "stem": "“知人善察，难眩以伪。”现象有真象和假象之分，假象是", "options": {"A": "从反面歪曲表现本质的现象", "B": "人们在认识中产生的错觉", "C": "与本质无关的现象", "D": "人们主观自生的观念"}, "answer": "A"}, {"id": "p1s-37", "num": 37, "type": "single", "stem": "探月工程叫“嫦娥”、月球车叫“玉兔”、全球定位系统叫“北斗”、载人空间站叫“天宫”⋯⋯\n有人评价说，古人的浪漫在于妙想，科学家的浪漫在于实干。神舟飞天、嫦娥奔月，近年来，\n经过几代中国航天人的接续努力，中华民族的飞天梦、探月梦相继实现，以前在古老传说中才\n会有的情形都成为了现实。这对我们在哲学上的启示是", "options": {"A": "一个事物只要合乎发展的必然性迟早会变成现实", "B": "只要充分发挥主观能动性，不可能就会转化为可能", "C": "只有对人有利的可能性才会转化为现实", "D": "随着科技的发展，任何想象都会变为现实"}, "answer": "A"}, {"id": "p1s-38", "num": 38, "type": "single", "stem": "“概念的辩证法本身就变成只是现实世界的辩证运动的自觉的反映，从而黑格尔的辩证法就被\n倒转过来了。”这段话表明，主观辩证法与客观辩证法的关系是", "options": {"A": "反映与被反映的关系", "B": "唯心主义与唯物主义的关系", "C": "抽象与具体的关系", "D": "唯心辩证法与唯物辩证法的关系"}, "answer": "A"}, {"id": "p1s-39", "num": 39, "type": "single", "stem": "湖南蓝山县是候鸟迁飞的重要通道。之前，此地捕鸟风气盛行，如今，不仅捕鸟人不见了，他\n们还变成了当地的护鸟人。由“捕”变“护”是怎样实现的呢?思路一变天地宽。在以往重\n“整治”、严厉打击捕鸟行为的基础上，蓝山县更加关注“引导”,利用村民对山形地理、鸟类习\n性的了解，聘请他们成为职业护鸟人、候鸟科普宣传员等，保障捕鸟人转行就业。疏堵结合、\n双管齐下，取得了良好效果。由“捕”变“护”的成功说明", "options": {"A": "不仅要看到矛盾双方的对立，而且要看到矛盾双方的统一", "B": "评价结果与评价主体直接相关，事物的根本性质取决于评价主体的具体需要", "C": "矛盾双方融合成一个新事物是解决矛盾的唯一形式", "D": "新事物是在旧事物的“母体”中孕育成熟的，它保留了旧事物的一般特征"}, "answer": "A"}, {"id": "p1s-40", "num": 40, "type": "single", "stem": "习近平在贵州考察时指出：“要立足县域产业基础，注重分工协作，错位发展、串珠成链。”这\n一重要指示为各地区立足自身实际，促进县域经济高质量发展提供了科学指引和根本遵循。“串\n珠成链”就是将各具特色、优势互补的“珍珠”(县域特色产业)有效串联、协同整合，形成\n价值倍增的“项链”(区域产业集群或经济带),将分散的比较优势凝聚为区域整体竞争优势。\n“串珠成链”能够实现价值倍增，是因为", "options": {"A": "事物的发展是量变和质变的统一", "B": "矛盾普遍性通过特殊性表现出来", "C": "内部矛盾是事物发展的根本动力", "D": "要素的结构性变化引起了整体功能的优化"}, "answer": "D"}, {"id": "p1s-41", "num": 41, "type": "single", "stem": "过去一段时问，内蒙古自治区一些地方在改革中缺少协调配套，影响了保护治理的成效。以乌\n梁素海为例，此前巴彦淖尔市对其开展了30多项治理工程，但总体上还是“就湖治湖”,效果\n一般。从“治湖泊”转向“治流域”,必须勇于打破条块分割的职能边界，形成多元共治工作格\n局。内蒙古自治区成立乌梁素海综合治理工作领导小组，组建乌梁素海生态保护中心，开辟\n“生态警务”协作新模式，完善“河湖长+检察长”联动机制，并推出自治区第一部专门针对湖\n泊流域生态保护的地方性法规《巴彦淖尔市乌梁素海流域生态保护条例》。生态保护“一盘棋”,\n凝聚起各项改革举措的合力，让“塞外明珠”更加璀璨。从“治湖泊”转向“治流域”体现了", "options": {"A": "系统治理的思想", "B": "辩证否定的思想", "C": "量变质变的思想", "D": "底线思维"}, "answer": "A"}, {"id": "p1s-42", "num": 42, "type": "single", "stem": "学习和掌握唯物辩证法的科学思维方法，要求我们在实践中不断增强辩证思维能力。提高辩证\n思维能力，要自觉运用对立统一规律，掌握运用好辩证的逻辑思维方法。在这些思维方法中，\n人类思维从个别到一般，又由一般到个别的最常见的推理形式是", "options": {"A": "分析与综合", "B": "归纳与演绎", "C": "抽象与具体", "D": "逻辑与历史\n第二章 实践与认识及其发展规律"}, "answer": "B"}, {"id": "p1s-43", "num": 43, "type": "single", "stem": "马克思主义理论区别于其他理论的根本特征是", "options": {"A": "科学性", "B": "人民性", "C": "实践性", "D": "发展性"}, "answer": "C"}, {"id": "p1s-44", "num": 44, "type": "single", "stem": "马克思、恩格斯以前的中外哲学都使用过实践的概念。一些思想家对实践也有过不少论述，但\n他们都没有真正理解人类实践的本质，没有看到实践在社会生活和认识活动中的决定意义。马\n克思在他的著作中系统论述了实践的观点，揭示了科学实践观的基本内容。这个被称为“包含\n新世界观天才萌芽的第一个文件”的著作是", "options": {"A": "《德意志意识形态》", "B": "《反杜林论》", "C": "《关于费尔巴哈的提纲》", "D": "《路德维希·费尔巴哈和德国古典哲学的终结》"}, "answer": "C"}, {"id": "p1s-45", "num": 45, "type": "single", "stem": "数字孪生水利是指通过人工智能、5G、大模型等技术，把现实世界的自然水系和水利工程\n“搬”到互联网上，实现虚实物体之间仿真模拟，进而开展精准预报、超前预警、快速预演、制\n定预案。近年来，水利部门先行完成了94项数字孪生水利建设任务。三峡水利枢纽工程，大\n坝、大江和连绵群山——映射到虚拟空间，参数变动，为库容调度、冲淤提供精准方案；南水\n北调中线工程，电子围栏、远程控制系统护佑一渠清水北上，全天候监测1400多公里渠道⋯⋯\n将现实水利工程“搬”到互联网上构建数字孪生体，开展精准预演，这一做法说明", "options": {"A": "虚拟实践是实践活动的派生形式，同时又对现实的实践活动产生重大影响", "B": "意识不仅可以反映客观世界，还具有改变物质世界的直接现实性", "C": "人类可以凭借技术手段创造独立的虚拟世界，使其完全脱离物质世界的束缚", "D": "人们的思想、理论、计划和方案在实践中总是能够得到预想的结果"}, "answer": "A"}, {"id": "p1s-46", "num": 46, "type": "single", "stem": "中国脱贫攻坚的一个重要特点是，采取一系列有效举措，把扶贫与扶志扶智结合起来，高度重\n视精神脱贫、教育脱贫，增强贫困群众自我“造血”的能力与信心。习近平指出：“摆脱贫困首\n要并不是摆脱物质的贫困，而是摆脱意识和思路的贫困。”这给我们的启示是", "options": {"A": "从根本上说认识对实践具有决定作用", "B": "事物发展的根本原因在事物的外部", "C": "实践主体的能力既包括自然能力也包括精神能力", "D": "矛盾的次要方面也能起到支配作用\n)"}, "answer": "C"}, {"id": "p1s-47", "num": 47, "type": "single", "stem": "“不登高山，不知天之高也；不临深溪，不知地之厚也。”这说明", "options": {"A": "感性认识比理性认识更深刻", "B": "实践是改造世界的活动", "C": "认识总是落后于实践", "D": "认识来源于实践"}, "answer": "D"}, {"id": "p1s-49", "num": 49, "type": "single", "stem": "恩格斯在谈到欧洲文艺复兴时期自然科学的迅速发展时指出：“资产阶级为了发展工业生产，需\n要科学来查明自然物体的物理特性，弄清自然力的作用方式。”这段话说明", "options": {"A": "实践是认识发展的动力", "B": "认识对实践具有相对独立性", "C": "实践是检验认识是否具有真理性的标准", "D": "认识对实践具有决定作用"}, "answer": "A"}, {"id": "p1s-51", "num": 51, "type": "single", "stem": "近年来，为了向更多人更好地传播科学、艺术、文化等知识，很多地方把博物馆搬到了线上，\n借助技术手段，让知识可感、可视。通过虚拟现实技术，游览者可以与展品“零距离”接触。\n线上博物馆的发展说明", "options": {"A": "精神文化的生产是一个纯粹的意识过程", "B": "科学文化实践只能通过虚拟实践的方式实现", "C": "实践的发展过程是一个范围不断扩大、程度不断加深、效果不断提升的过程", "D": "认识关系是实践的主体和客体相互作用关系中最根本的关系"}, "answer": "C"}, {"id": "p1s-52", "num": 52, "type": "single", "stem": "从物到感觉和思想与从思想和感觉到物的对立，反映的是", "options": {"A": "可知论和不可知论的对立", "B": "经验论和唯理论的对立", "C": "唯物主义反映论与唯心主义先验论的对立", "D": "形而上学与辩证法的对立"}, "answer": "C"}, {"id": "p1s-53", "num": 53, "type": "single", "stem": "“调查研究是从实际出发的中心一环。没有调查就没有发言权，没有调查也没有决策权。”调查\n才能获得第一手材料，获得感性认识。感性认识的突出特点是\n①直接性\n②深刻性\n③具体性\n④间接性", "options": {"A": "①③", "B": "①②", "C": "②③", "D": "②④"}, "answer": "A"}, {"id": "p1s-54", "num": 54, "type": "single", "stem": "“具象化”这个词在当今的社交媒体中频繁出现。对于一些只在书本上看到过或者从别人口中\n听说过的概念，当人们在现实中碰到相关的真人实物时，往往会因为亲身感受的不同而对这些\n概念产生更加深刻的理解。“×××在这一刻具象化了”的句式正是用来形容这种将概念和实物对\n应起来比较的情况。“具象化”描述的这种情景体现了", "options": {"A": "感性认识和理性认识相互渗透", "B": "意识对物质的直观反映", "C": "情感在认识活动中的决定作用", "D": "认识的直接现实性"}, "answer": "A"}, {"id": "p1s-55", "num": 55, "type": "single", "stem": "感性认识和理性认识是统一的认识过程中的两个阶段，它们既有区别，又有联系。感性认识和\n理性认识的区别在于", "options": {"A": "感性认识反映事物的现象，理性认识反映事物的本质", "B": "感性认识来源于社会实践，理性认识来源于抽象思维", "C": "感性认识来源于感性具体，理性认识来源于理性具体", "D": "感性认识包含错误，理性认识则完全正确"}, "answer": "A"}, {"id": "p1s-57", "num": 57, "type": "single", "stem": "调查研究是谋事之基、成事之道。习近平指出，“要了解实际，就要掌握调查研究这个基本功”,\n强调“听真话、察真情，真研究问题、研究真问题，不能搞作秀式调研、盆景式调研、蜻蜓点\n水式调研”。这是因为", "options": {"A": "占有了真实的感性材料，就等于抓住了事物的本质", "B": "反映和创造是人类认识的两种不同的本质，只有以反映为基础才能创造出新的理论", "C": "作出科学合理的决策，需要大量客观、真实、有效的信息", "D": "感性中有理性，人的感觉是渗透着理性的感觉"}, "answer": "C"}, {"id": "p1s-58", "num": 58, "type": "single", "stem": "一位著名的石油地质学家说过，“我们曾无数次用老方法在新地方发现石油，我们也曾在老地方\n用新方法找到了石油，但从来没有在老地方用老方法发现石油。”这句话体现的哲理是", "options": {"A": "发展的实质就是数量的增减和场所的变更", "B": "在科学研究中，经验是不可靠的", "C": "真理与谬误之间没有原则的界限", "D": "认识需要随着实践的发展而发展"}, "answer": "D"}, {"id": "p1s-59", "num": 59, "type": "single", "stem": "中国是农业发达的文明古国，春耕、夏耘、秋收、冬藏是农业社会基本的生产实践活动。发轫\n于农耕文明的“二十四节气”,是古人观察时令、气候、物候等现象时总结出的时间知识体系，\n它能够准确反映自然节律变化，一直沿用至今。现代的人们仍能够通过“二十四节气”指导四\n时农耕，说明", "options": {"A": "理性认识是认识过程的终点", "B": "自然规律具有重复性和稳定性", "C": "一切真知都是从间接经验发源的", "D": "事物的根本性质是永恒不变的"}, "answer": "B"}, {"id": "p1s-62", "num": 62, "type": "single", "stem": "马克思主义真理精神表现为实践的精神。真理性认识的基础和动力是实践，检验真理的标准归\n根到底也是实践。实践是检验真理的唯一标准，这是因为", "options": {"A": "实践是人的本质", "B": "真理与实践都是绝对的", "C": "真理是抽象的，但实践是具体的", "D": "只有实践才能把主观认识与客观事物联系起来加以对照\n--\n69.实践作为检验真理的标准，既是确定的又是不确定的，其不确定性是因为"}, "answer": "D"}, {"id": "p1s-64", "num": 64, "type": "single", "stem": "习近平在主持召开高标准高质量推进雄安新区建设座谈会上指出：“雄安新区建设不是一天两天\n的事，不能当下都吃干榨尽，要留白、留有余地，为远期规划预留项目、地块。要适度超前，\n但不能过于超前，防止建成项目‘晒太阳',造成浪费。有的要大举实施，有的要待机而动，有\n的要与时俱进，既不能急于求成，也不能无所作为。”这段话说明", "options": {"A": "事物的根本性质随时随地都在变化，要坚持底线思维", "B": "人在一定条件下的认识总是有限度的，要不断深化", "C": "事物的变化发展是没有规律的，要全面地考虑各种情况", "D": "认识总是超前于直接的实践，要提高战略思维能力"}, "answer": "B"}, {"id": "p1s-65", "num": 65, "type": "single", "stem": "对于真理，不能说“它对谁来说是真理”;对于价值，则必须说“它对谁来说有价值”。这是因为", "options": {"A": "真理是抽象的，而价值是具体的", "B": "真理是一种客观实在，而价值是一种认识性的判断", "C": "真理是一元的，而价值是多元的", "D": "真理是永恒不变的，而价值是不断发展的"}, "answer": "C"}, {"id": "p1s-66", "num": 66, "type": "single", "stem": "一束花，能带来何种价值?这需要综合来看。对种花的人来说，一束花意味着收入；对买花的\n人来说，一束花表达了感情；对参与花卉交易的人来说，一束花意味着就业。我国是世界最大\n的花卉生产国。中国花卉协会统计数据显示，我国现有近22万家种苗花卉企业，花卉产业从业\n人员超534万人，年产值5200多亿元。鲜花连着产业与就业，也连着物质消费与精神需求。以\n上事例说明", "options": {"A": "价值是随主体、客体以及主客体关系的变化而变化的", "B": "认识和评价可以反映价值，也可以创造价值", "C": "价值关系是实践的主体和客体相互作用中最根本的关系", "D": "客体能否满足主体需要，是由人的主观愿望决定"}, "answer": "A"}, {"id": "p1s-67", "num": 67, "type": "single", "stem": "在四川成都街头漫步，多处小微公共空间改造创意十足。这些由城市中缺乏合理规划、未充分\n利用的剩余空间改造而来，可供市民休闲、娱乐、交往的高品质空间，在成都被称作“金角银\n边”。出地铁口，邂逅野趣盎然的口袋公园；穿行小巷，遇见与绿植融为一体的彩色墙绘；高架\n桥下，体验丰富的运动项目⋯⋯这些曾经未被科学利用的角落，正以一种意想不到的方式，重\n新定义城市空间的价值。没有真正的“无用空间”,只有尚未被发现的价值潜能。“金角银边”\n的设计说明", "options": {"A": "空间的存在与利用状况依赖于人的主观感觉", "B": "城市空间的价值通过主体的创造性体现出来", "C": "任何一个具体物质形态的时空都是无限的", "D": "人类实践的广度和深度不受客观条件的制约"}, "answer": "B"}, {"id": "p1s-68", "num": 68, "type": "single", "stem": "“自由不在于幻想中摆脱自然规律而独立，而在于认识这些规律，从而能够有计划地使自然规\n律为一定的目的服务。”这说明自由是", "options": {"A": "选择的随意性", "B": "活动的主动性", "C": "摆脱必然性", "D": "对必然的认识和对客观世界的改造\n第三章 人类社会及其发展规律"}, "answer": "D"}, {"id": "p1s-69", "num": 69, "type": "single", "stem": "马克思主义哲学创立后，开始出现了", "options": {"A": "唯物论与唯心论的对立", "B": "可知论与不可知论的对立", "C": "辩证法与形而上学的对立", "D": "唯物史观与唯心史观的对立"}, "answer": "D"}, {"id": "p1s-70", "num": 70, "type": "single", "stem": "全球超过30亿人的生计依赖于海洋和沿海的生物多样性，超过16亿人依靠森林和非木材林产\n品谋生。世界上50%以上的药物成分来源于天然动植物。然而，全球物种灭绝速度不断加快，\n生物多样性丧失和生态系统退化对人类生存和发展构成重大风险。一个物种就是一个基因库。\n如果物种基因还未开发就永远失去，损失无法估量。正是那几株在风中摇曳的青蒿，屠呦呦才\n会发现青蒿素，为世界带来全新抗疟药；正是有了野生稻基因留存，袁隆平才培育出杂交水稻，\n为中国人的口粮安全带来沉甸甸的保障，为世界粮食安全增添中国贡献。以上材料说明", "options": {"A": "自然地理环境是人类社会生存和发展永恒的、必要的条件", "B": "人类的任何实践活动都会受到自然界的报复", "C": "人们不当的实践方式正在改变自然界的客观实在性", "D": "保护生态环境是人类其他一切活动的首要前提"}, "answer": "A"}, {"id": "p1s-71", "num": 71, "type": "single", "stem": "人类自古逐水而居，人类文明伴水而生。但江河来水变幻不定，水多生洪灾，水少成旱灾。早\n期，人们在河流特定位置，零星修建水库，除水害、兴水利，但其功能单一。随着人们对水资\n源价值认识的不断深入，水库建设逐步从单一功能开发发展为多目标综合开发，实现“一水多\n用、一库多效”。比如，三峡水库具备防洪、发电、航运、供水等综合功能，同时与长江干支流\n水库群联合调度，实现效益倍增。人类对水资源价值的认识从单一走向综合，推动水库功能从\n“除害兴利”发展为“一库多效”,这一历程表明", "options": {"A": "实践具有社会历史性，其内容和水平受到特定社会条件的制约", "B": "自然地理环境是社会存在和发展的基础及决定力量", "C": "价值评价属于知识性认识，其结果的正确与否取决于人对客体属性和规律的认识", "D": "随着历史的发展，客体的潜在价值就会自动转变为现实的价值"}, "answer": "A"}, {"id": "p1s-73", "num": 73, "type": "single", "stem": "中国北方有句俗语：“没吃过猪肉，也见过猪跑”。这种略带戏谑的提法常用来比喻有些事情虽\n然人们没有亲身经历过，但是也听说过、见识过，略有了解。与物质资料匮乏的年代相比，在\n城镇化、农业现代化大力推进的当下，很多年轻人只“吃过猪肉”没“见过猪跑”,然而这句流\n传广泛的俗语依然能够被广大群众理解并继续使用。这一现象对我们的启示是", "options": {"A": "间接经验比直接经验更重要", "B": "语言文化具有绝对稳定性", "C": "意识具有调控人的行为和生理活动的作用", "D": "社会意识具有相对独立性"}, "answer": "D"}, {"id": "p1s-74", "num": 74, "type": "single", "stem": ",《新华字典》初版收字6800多个，而最新版收字约1.3万个，以字统词，《新华字典》收录的\n很多词语反映了时代的发展变迁和国家的文明进步。如2004年第10版收录了光纤、基因、克\n隆等，2011年第11版收录了福祉、愿景、民生等，2020年第12版收录了打卡、点赞、二维\n码等，以语词记录着共和国的发展变迁。第12版增补新词新例100多个，如“初”下新增\n“初心”,“粉”下新增“粉丝”,“截”下新增“截屏”,此外像“点赞”“二维码”“非物质文\n化遗产”“到付”“网购”等与当前生活密不可分的词语也有收录。《新华字典》的变化发展\n表明、", "options": {"A": "语言作为思维的物质外壳是人的认识产生和发展的基础", "B": "社会意识是随着时间的推移而自主变化的", "C": "社会存在是社会意识内容的客观来源", "D": "语言文字在社会生活和认识活动中具有决定意义"}, "answer": "C"}, {"id": "p1s-75", "num": 75, "type": "single", "stem": "我国古代文论家刘勰在《文心雕龙》中就认识到“时运交移，质文代变”,这是基于朴素唯物\n论的文艺观。今天，我们迎来一个伟大的变革时代。习近平指出：“一个时代有一个时代的文\n艺，一个时代有一个时代的精神。”“古今中外，文艺无不遵循这样一条规律：因时而兴，乘势\n而变，随时代而行，与时代同频共振。”我们的文艺工作者应正确认识文艺与时代的关系，在实\n践中丰峦和完善艺术理想，积极响应“为时代画像、为时代立传、为时代明德”的号召，拿出\n更多艺术精品献给人民和这个伟大的时代。一个时代有一个时代的文艺，一个时代有一个时代\n的精神，这说明社会意识对社会存在具有", "options": {"A": "相对独立性", "B": "继承性", "C": "不完全同步性", "D": "依赖性"}, "answer": "D"}, {"id": "p1s-76", "num": 76, "type": "single", "stem": "炎炎夏日，却不见“汗滴禾下土”。在智慧农场内，农业机器人穿梭田间、巡检苗情，各类传感\n器遍布其间，探测墒情、气象、病虫害等信息，并实时传输到后方的指挥中心。农田管理员坐\n镇指挥中心，手持平板电脑这个“新农具”,远程操控着整个农场的运行。“犁地不用牛，种地\n不跟楼，浇水不拿锨，喷药不进田，收麦不带镰，晒麦不用场，卖麦不用忙”的“新农谚”,成\n为乡村新写照。平板电脑变成“新农具”启示我们，区分社会经济时代的客观依据是", "options": {"A": "生产工具的状况", "B": "劳动者的素质", "C": "劳动对象的广度和深度", "D": "劳动产品的数量和质量"}, "answer": "A"}, {"id": "p1s-77", "num": 77, "type": "single", "stem": "科技创新是发展新质生产力的核心要素，能够极大拓展劳动对象的范围和类别，为加快形成新\n质生产力开辟广阔空间。人工智能、量子科技、生物科技、元宇宙、脑机接口、大数据等新技\n术的出现极大丰富了劳动对象的种类和形态，拓展了生产新边界，为生产力发展提供新动力。\n比如，数据作为新型生产要素成为重要劳动对象，既直接创造社会价值，又通过与其他生产要\n素的结合、融合进一步放大价值创造效应。劳动对象的范围和类别不断扩大说明", "options": {"A": "哪些客观事物能成为实践的客体完全取决于主体的意愿", "B": "人类可以通过劳动不断创造新的物质资料并转化为劳动对象", "C": "一切自然物质都是现实的劳动对象", "D": "科学技术是生产力中最活跃的因素"}, "answer": "B"}, {"id": "p1s-78", "num": 78, "type": "single", "stem": "马克思指出：“为了进行生产，人们相互之间便发生一定的联系和关系；只有在这些社会联系和\n社会关系的范围内，才会有他们对自然界的影响，才会有生产。”在生产关系中，区分不同生产\n方式、判定社会经济结构性质的客观依据是", "options": {"A": "生产中人与人的关系", "B": "产品分配关系", "C": "阶级关系", "D": "生产资料所有制关系"}, "answer": "D"}, {"id": "p1s-79", "num": 79, "type": "single", "stem": "习近平强调，发展新质生产力，必须进一步全面深化改革。要深化经济体制改革，着力打通束\n缚新质生产力发展的堵点卡点，建立高标准市场体系，创新生产要素配置方式，让各类先进优\n质生产要素向发展新质生产力顺畅流动。这一思想背后的哲学依据是", "options": {"A": "生产关系必须与生产力发展要求相适应", "B": "经济基础的变更必然引起上层建筑的变革，并决定其变革的方向", "C": "社会生产领域内形式对内容具有决定作用", "D": "改革是社会发展的唯一动力"}, "answer": "A"}, {"id": "p1s-80", "num": 80, "type": "single", "stem": "在整个上层建筑中，政治上层建筑居于主导地位，政治上层建筑的核心是", "options": {"A": "国家政权", "B": "政治法律思想", "C": "道德、艺术", "D": "政党"}, "answer": "A"}, {"id": "p1s-81", "num": 81, "type": "single", "stem": "唯物史观视域中的“世界历史”是指各民族、国家通过普遍交往，打破孤立隔绝的状态，进入\n相互依存、相互联系的世界整体化的历史。世界历史形成和发展的基础是", "options": {"A": "生产方式的发展变革", "B": "地理科学的逐渐完善", "C": "意识形态的普遍认同", "D": "信息技术的广泛应用"}, "answer": "A"}, {"id": "p1s-83", "num": 83, "type": "single", "stem": "人的发展是一个社会历史过程，既包括人类整体的发展，也包括人类个体的发展。人的发展指\n人的体力、智力、个性和交往能力等的发展，其中最根本的是", "options": {"A": "人的本质力量的对象化、现实化", "B": "人类智慧和认知能力的发展", "C": "人的自由程度的提高", "D": "人的文明程度的提高"}, "answer": "C"}, {"id": "p1s-84", "num": 84, "type": "single", "stem": "马克思指出，“社会形态发展是自然历史过程”,这是指", "options": {"A": "社会形态的发展与自然界的发展完全一样", "B": "社会形态的发展也是自发的过程", "C": "社会形态的发展是客观的、有规律的发展过程", "D": "社会形态的发展与主体的活动无关"}, "answer": "C"}, {"id": "p1s-85", "num": 85, "type": "single", "stem": "社会形态更替的必然性，主要是指社会形态依次更替的过程和规律是客观的，其发展的基本趋势\n是确定不移的。社会形态更替归根结底是社会基本矛盾运动的结果。其中具有最终决定意义的是", "options": {"A": "人民的意志和选择", "B": "生产资料所有权的归属", "C": "生产力的发展", "D": "对本民族特点的把握程度"}, "answer": "C"}, {"id": "p1s-86", "num": 86, "type": "single", "stem": "马克思认为，资本主义社会的产生有三条道路，即从封建制度的“衰亡”中产生；从奴隶制和\n农奴制的“解体”中产生；从原始公有制的“崩溃”中产生。这体现了", "options": {"A": "社会形态更替的多样性", "B": "社会形态跨越的随意性", "C": "社会发展规律的主观性", "D": "人类历史发展的曲折性"}, "answer": "A"}, {"id": "p1s-87", "num": 87, "type": "single", "stem": "一个时代有一个时代的文化，一个时代有一个时代的精神。在“中国国家版本馆首批网络数字\n版本入藏仪式”上，电视剧《扫黑风暴》、小说《大国重工》、音乐《沪侬江南》等作品入藏。\n版本，是记录历史、传承文明的“金种子”。从龟甲金石到竹简布帛，从雕版刻印到活字印刷，\n从铅字排印到激光照排，从有形载体到虚拟载体，版本的迭代见证着文明的进步。中华文明的\n传承，如同长江黄河一样奔腾不息。每一次新版本的诞生都为这条大江大河注入新的水源，赋\n予它更加充沛的力量。以上材料说明", "options": {"A": "文化是推动社会发展的决定力量", "B": "社会存在与社会意识具有完全同步性", "C": "精神追求是人类其他一切活动的首要前提", "D": "文明反映了人类社会实践活动的积极成果"}, "answer": "D"}, {"id": "p1s-88", "num": 88, "type": "single", "stem": "人类同疾病较量最有力的武器就是科学技术，人类战胜大灾大疫离不开科学发展和技术创新。\n马克思主义认为，科学技术是", "options": {"A": "社会形态变革的决定力量", "B": "社会存在和发展的基础及决定力量", "C": "先进生产力的集中体现和主要标志", "D": "区分社会经济时代的客观依据"}, "answer": "C"}, {"id": "p1s-89", "num": 89, "type": "single", "stem": "冬枣一般在每年10月至11月份自然成熟，而在陕西省大荔县，冬枣最早在5月就已上市，变\n成“夏枣”,其最高价格是正常成熟冬枣的30多倍。近几年，市场对冬枣的需求迅猛增长。为\n破解冬枣供应期短的难题，科研团队持续攻关，突破了日光温室(温棚)栽培技术，解决了冬\n枣提早成熟的难题，并形成了日光温室、钢架棉被棚、双膜冷棚和普通冷棚等栽培模式，冬枣\n的成熟供应期从10月提早到5月，由露地栽培的40天延长到6个月。此后，科研团队运用现\n代科技手段发现了冬枣品质形成机制和成熟生理特征，为其优质高效生产奠定了基础。“冬枣变\n夏枣”的成功说明", "options": {"A": "人们可以充分发挥主观能动性去改变现有的自然规律", "B": "人们在正确认识客观事物运动发展规律性的基础上可以摆脱必然性的制约", "C": "科学技术的发展标志着人类改造自然能力的增强", "D": "主体的需要是真理与价值统一的基础"}, "answer": "C"}, {"id": "p1s-91", "num": 91, "type": "single", "stem": "恩格斯在《路德维希·费尔巴哈和德国古典哲学的终结》中明确指出，“在社会历史领域内进行\n活动的，是具有意识的、经过思虑或凭激情行动的、追求某种目的的人；任何事情的发生都不\n是没有自觉的意图，没有预期的目的的。”这说明", "options": {"A": "社会历史发展是人主观意志的结果", "B": "社会发展的过程同自然界的发展过程是一样的", "C": "历史是无数个追求着自己目的的人的活动的合力", "D": "社会发展总是符合人们的预期的"}, "answer": "C"}, {"id": "p1s-92", "num": 92, "type": "single", "stem": "“中华民族伟大复兴势不可挡!”习近平总书记在天安门城楼上的庄严宣示，是历史昭示的真\n理，是团结奋进的强音。今天，在全面推进中国式现代化的新征程上，我们比历史上任何时期\n都更接近、更有信心和能力实现中华民族伟大复兴的目标，同时必须准备付出更为艰巨、更为\n艰苦的努力。推进中华民族伟大复兴历史进程，要求我们增强历史主动、发扬实干精神，这是\n因为", "options": {"A": "每一个人都是历史的创造者", "B": "人能够按照自己的需要去认识规律和改造规律", "C": "历史规律只有通过人的有目的、有意识的活动才能实现", "D": "人们在自己选定的条件下创造历史"}, "answer": "C"}, {"id": "p1s-93", "num": 93, "type": "single", "stem": "恩格斯说过，恰巧拿破仑做了法国的军事独裁者，是因为当时的法国需要这样的人。假如没有\n拿破仑这个人，那么就会有别人来扮演这个角色。这句话蕴含的哲学思想是", "options": {"A": "任何历史人物的出现都体现了必然性与偶然性的统一", "B": "杰出人物的出现纯粹是偶然的", "C": "社会历史发展是没有规律的", "D": "历史人物都能起到推动社会前进的积极作用"}, "answer": "A"}, {"id": "p1s-94", "num": 94, "type": "single", "stem": ",唯物史观就是“关于现实的人及其历史发展的科学”。只有把人看作现实的人，才能正确把握人\n的本质，把握人与社会历史的关系。人的本质是", "options": {"A": "从所有个体的人身上抽象出来的共同性", "B": "单个人天生就具有的东西", "C": "一切社会关系的总和", "D": "人的自然属性和社会属性的综合\n第四章 资本主义的本质及规律"}, "answer": "C"}, {"id": "p1s-97", "num": 97, "type": "single", "stem": "马克思说：“一个物可以是使用价值而不是价值。在这个物并不是由于劳动而对人有用的情况下\n就是这样。”这说明", "options": {"A": "价值和使用价值互为前提", "B": "使用价值与价值不可兼得", "C": "劳动产品一定是商品", "D": "商品一定是劳动产品"}, "answer": "D"}, {"id": "p1s-98", "num": 98, "type": "single", "stem": "“我们从小麦的滋味中尝不出种植小麦的人是俄国的农奴，法国的小农，还是英国的资本家。使\n用价值虽然是社会需要的对象，因而处在社会联系之中，但是并不反映任何社会生产关系。”马\n克思的这段话表明", "options": {"A": "商品的使用价值在质上是一样的", "B": "商品的使用价值与具体劳动无关", "C": "使用价值是历史范畴", "D": "使用价值是商品的自然属性"}, "answer": "D"}, {"id": "p1s-101", "num": 101, "type": "single", "stem": "马克思指出：“如果物没有用，那么其中包含的劳动也就没有用，不能算作劳动，因此不形成\n价值。”这段话说明", "options": {"A": "价值的存在以物的有用性为前提", "B": "价值的存在与物的有用性互为前提", "C": "物只要有用就有价值", "D": "物越是有用就越有价值"}, "answer": "A"}, {"id": "p1s-105", "num": 105, "type": "single", "stem": "商品是劳动产品，生产商品的劳动具有二重性，即具体劳动和抽象劳动。具体劳动和抽象劳动\n是对立统一的关系，二者的区别体现在", "options": {"A": "具体劳动和抽象劳动是各自独立存在的两种劳动", "B": "具体劳动反映人与自然的关系，抽象劳动反映商品生产者的社会关系", "C": "具体劳动和抽象劳动必须在空间上并存、时间上继起", "D": "具体劳动创造商品的质，抽象劳动形成商品的量"}, "answer": "B"}, {"id": "p1s-107", "num": 107, "type": "single", "stem": "“既然商品的价值由生产商品所耗费的劳动量来决定，那么一个人越懒，越不熟练，他的商品\n就越有价值，因为他制造商品需要花费的时间越多。”这个说法的错误在于混淆了", "options": {"A": "具体劳动时间和抽象劳动时间", "B": "简单劳动时间和复杂劳动时间", "C": "必要劳动时间和剩余劳动时间", "D": "个别劳动时间和社会必要劳动时间"}, "answer": "D"}, {"id": "p1s-108", "num": 108, "type": "single", "stem": "生产商品所需要的社会必要劳动时间随着劳动生产率的变化而变化。劳动生产率是指", "options": {"A": "劳动者的劳动强度", "B": "劳动者生产使用价值的效率", "C": "劳动者生产剩余价值的效率", "D": "劳动在整个生产中所占的比例"}, "answer": "B"}, {"id": "p1s-110", "num": 110, "type": "single", "stem": "马克思在《资本论》中指出：“不管生产力发生了什么变化，同一劳动在同样的时间内提供的\n价值量总是相同的。但它在同样的时间内提供的使用价值量会是不同的：生产力提高时就多\n些，生产力降低时就少些。”这表明，提高劳动生产率会使单位时间内生产的商品数量和个别\n商品的价值量发生变化，即", "options": {"A": "商品数量增加，个别商品的价值量增大", "B": "商品数量增加，单位时间内生产的总价值量增大", "C": "商品数量增加，个别商品的价值量不变", "D": "商品数量增加，个别商品的价值量减少"}, "answer": "D"}, {"id": "p1s-111", "num": 111, "type": "single", "stem": ",俗话说：“一分钱一分货”,但是在实际的商品交换过程中，既有“一分钱二分货”的现象，\n也有“一分钱半分货”的现象。这说明", "options": {"A": "价格并不反映价值", "B": "价格的变化都是价值变化的表现", "C": "价格围绕商品的价值自发波动", "D": "供求关系变动决定商品的价值量"}, "answer": "C"}, {"id": "p1s-112", "num": 112, "type": "single", "stem": "近年来，数字货币的概念越来越火热，引起了人们对货币本质的新一轮讨论。有专家指出，随\n着经济的发展和技术的进步，货币在发展过程中被不同的价值符号所代表，从金属货币、纸\n币、电子货币到数字货币不断转变。每种不同的货币形式代表了人们不同的信任形式。马克思\n主义认为，货币是", "options": {"A": "能够带来剩余价值的价值", "B": "资本的唯一物质形态", "C": "商品特有的社会属性", "D": "固定充当一般等价物的商品"}, "answer": "D"}, {"id": "p1s-114", "num": 114, "type": "single", "stem": "消费者的下列经济行为中，属于货币执行价值尺度职能的是", "options": {"A": "缴纳房屋契税9000元", "B": "购买商品房，合同约定房价30万元", "C": "在装饰材料市场现购材料5万元", "D": "按购房合同约定，第二年付房款10万元"}, "answer": "B"}, {"id": "p1s-115", "num": 115, "type": "single", "stem": "商品的使用价值和价值的矛盾、生产商品的具体劳动和抽象劳动的矛盾，根源于", "options": {"A": "生产社会化和生产资料资本主义私人占有之间的矛盾", "B": "商品和货币的矛盾", "C": "简单劳动和复杂劳动的矛盾", "D": "私人劳动和社会劳动的矛盾"}, "answer": "D"}, {"id": "p1s-116", "num": 116, "type": "single", "stem": "在以私有制为基础的商品经济中，商品生产者的劳动具有两重性：既是具有社会性质的社会劳\n动，又是具有私人性质的私人劳动。商品生产者的劳动的社会性质是由", "options": {"A": "生产者的阶级地位决定的", "B": "社会分工决定的", "C": "生产资料所有制决定的", "D": "国家法律制度规定的"}, "answer": "B"}, {"id": "p1s-117", "num": 117, "type": "single", "stem": "经济学关于价值的理论，除了马克思的劳动价值论，还有其他几种典型的价值理论，其中就包\n括要素价值论。要素价值论认为商品的价值是由各种生产要素共同创造的，土地创造地租，劳\n动创造工资，资本创造利润或利息。这种价值论试图用价值分配来解释价值创造，混淆了", "options": {"A": "价值形成的源泉和价值形成的条件之间的关系", "B": "利润和平均利润之间的关系", "C": "私人劳动和社会劳动之间的关系", "D": "资本技术构成和资本价值构成之间的关系"}, "answer": "A"}, {"id": "p1s-118", "num": 118, "type": "single", "stem": "在资本主义条件下，劳动是否是生产性的，取决于", "options": {"A": "劳动是生产物质产品还是提供服务", "B": "劳动能否为资本家带来剩余价值", "C": "具体劳动能否还原为抽象劳动", "D": "劳动力是否为社会生产发展所绝对需要"}, "answer": "B"}, {"id": "p1s-119", "num": 119, "type": "single", "stem": "商品经济是以交换为目的而进行生产的经济形式，它是一定社会历史条件的产物。以私有制为\n基础的商品经济的基本矛盾是", "options": {"A": "生产社会化和生产资料资本主义私人占有之间的矛盾", "B": "私人劳动和社会劳动的矛盾", "C": "无产阶级和资产阶级的矛盾", "D": "商品使用价值和价值之间的矛盾"}, "answer": "B"}, {"id": "p1s-120", "num": 120, "type": "single", "stem": "商品经济的发展经历了简单商品经济与发达商品经济两个阶段，资本主义商品经济是商品经济\n的高级或发达形态。简单商品生产发展到资本主义商品生产的新阶段的标志是", "options": {"A": "货币的产生和存在", "B": "机器大工业代替工场手工业", "C": "劳动力成为商品", "D": "社会生产划分为两大部类"}, "answer": "C"}, {"id": "p1s-121", "num": 121, "type": "single", "stem": "在资本总公式“G—W—G′”中，W代表商品，G代表的不是一般意义上的货币，而是作为资\n本的货币，G′代表的是价值增殖后的货币。从形式上看，资本总公式与商品交换的原则是矛盾\n的。价值规律要求商品交换遵循等价交换原则，交换领域不能创造新价值，但资本总公式却表\n明，资本在流通中创造了新价值。理解这一矛盾的关键在于", "options": {"A": "价值规律", "B": "等价交换原则", "C": "劳动力成为商品", "D": "利润转化为平均利润\n马■·单选\n)"}, "answer": "C"}, {"id": "p1s-123", "num": 123, "type": "single", "stem": "资本主又的生产过程具有二重杵，其中，作为盔本主又生产过程的主要方面的是", "options": {"A": "价值瑁殖过程", "B": "补惶劳动力的价值形成过程", "C": "资本家国督下的努动过程", "D": "创出演足人们某种西要的使用价值的过程"}, "answer": "A"}, {"id": "p1s-124", "num": 124, "type": "single", "stem": "在资本主又生产过程中，劳动力的价值是助于", "options": {"A": "具体劳动转移到新产品中", "B": "呜食劳动转移到惫产品中", "C": "具体劳动再生产出来而理殖", "D": "的食芳动再生产出来而瑁殖"}, "answer": "D"}, {"id": "p1s-125", "num": 125, "type": "single", "stem": "货币所有者只有购买到劳动力这种殊痕品，负币才堡转化为资本、这是因为", "options": {"A": "劳动力商品具有使用价值和价值", "B": "实际生产过程中所耗费的生严资料和前费资料必须得到实物的替换", "C": "劳动力鹤品是资本的本质", "D": "劳动力商品在消毁过程中能够创造出比自身价值更大的价值"}, "answer": "D"}, {"id": "p1s-127", "num": 127, "type": "single", "stem": "在不同的国家或在同—国家的不同历史时期，劳动力价值的最低界限是有区别的。一旦劳动力价\n值降低到这个最低界限以下，劳动力就只能在蔓笼的状态下维书。劳动力价值的最低界限是由", "options": {"A": "资本家上观的剥倒息愿决定的", "B": "劳助者的最征劳动强度决定的", "C": "资本循环中能够维持生产的不变资本的价值决定的", "D": "生活上不可缺少的生活资料的价值决定的"}, "answer": "D"}, {"id": "p1s-131", "num": 131, "type": "single", "stem": "资本家提高对工人剥削程度的方法是多种多样的，最基本的方法有两种，即绝对痢余价值的生\n产和相对剩余价值的生产。绝对剩余价值的生产和相对剩余价值的生产都是依靠", "options": {"A": "延长工作日获得的", "B": "提高劳动生产率获得的", "C": "缩短工人的必要劳动时间获得的", "D": "延长工人的剩余劳动时间获得的"}, "answer": "D"}, {"id": "p1s-132", "num": 132, "type": "single", "stem": "剩余价值产生的唯一源泉是", "options": {"A": "雇佣劳动者的剩余劳动", "B": "雇佣劳动者的必要劳动", "C": "雇佣劳动者的具体劳动", "D": "雇佣劳动者的抽象劳动"}, "answer": "A"}, {"id": "p1s-137", "num": 137, "type": "single", "stem": "马克思在谈到资本主义生产方式时指出：“生产剩余价值或赚钱，是这个生产方式的绝对规\n律。”生产剩余价值有两种基本方法：绝对剩余价值生产和相对剩余价值生产。资本家普遍获\n得相对剩余价值是", "options": {"A": "各个资本家普遍延长雇佣工人工作日的结果", "B": "各个资本家普遍提高雇佣工人劳动强度的结果", "C": "各个资本家追求超额剩余价值的结果", "D": "个别企业提高劳动生产率的结果"}, "answer": "C"}, {"id": "p1s-139", "num": 139, "type": "single", "stem": "马克思关于资本积累的学说深刻地阐明了资本主义制度必然灭亡的历史命运。资本积累是指", "options": {"A": "剩余价值的资本化", "B": "货币的资本化", "C": "资本集中", "D": "商品的资本化"}, "answer": "A"}, {"id": "p1s-140", "num": 140, "type": "single", "stem": "资本家为了进一步扩大和加强对工人的剥削和统治，不断地利用无偿占有的工人创造的剩余价\n值来扩大自己的资本规模，这就是资本积累的本质。马克思关于资本积累的学说认为，资本积\n累的源泉是", "options": {"A": "资本积聚和资本集中", "B": "工人创造的剩余价值", "C": "用暴力手段掠夺货币财富", "D": "资本主义扩大再生产"}, "answer": "B"}, {"id": "p1s-141", "num": 141, "type": "single", "stem": "资本的价值构成是指", "options": {"A": "固定资本与流动资本这两部分资本价值之间的比例", "B": "货币资本与生产资本之间的比例", "C": "劳动力和劳动对象之间的比例", "D": "不变资本和可变资本这两部分资本价值之间的比例"}, "answer": "D"}, {"id": "p1s-142", "num": 142, "type": "single", "stem": "在其他条件不变的情况下，以下选项中会提高资本有机构成的是", "options": {"A": "生产所用的原材料价格上涨", "B": "自动化程度提高导致的裁员", "C": "劳动者接受教育和训练所支出的费用增加", "D": "为追求更多利润而增加工人的劳动时间"}, "answer": "B"}, {"id": "p1s-145", "num": 145, "type": "single", "stem": "在英国，从14世纪末到18世纪中叶这段时期，政府曾经颁布过各种劳工法令，强迫工人延长\n工作日。在18世纪后期至19世纪上半叶，资本家依然强迫工人每日劳动12、14、16个小时，\n有的时候甚至达到18个小时以上。通过这种方式资本家获得的是", "options": {"A": "超额剩余价值", "B": "相对剩余价值", "C": "绝对剩余价值", "D": "垄断剩余价值"}, "answer": "C"}, {"id": "p1s-149", "num": 149, "type": "single", "stem": "在生产技术水平不断提高的条件下，随着资本积累的增长，必然伴随着资本的积聚和集中，使\n个别资本的规模日益增大。资本集中是指个别资本通过结合而形成较大的资本。资本集中最强\n有力的杠杆是", "options": {"A": "竞争和信用", "B": "投资和借贷", "C": "资本原始积累", "D": "生产自动化"}, "answer": "A"}, {"id": "p1s-151", "num": 151, "type": "single", "stem": ",资本家瓜分到剩余价值后，如果将其完全用于个人消费，则生产就在原有规模的基础上重复进\n行，这叫资本主义简单再生产。资本主义简单再生产，就其实质而言，是", "options": {"A": "劳动过程和价值形成过程的统一", "B": "劳动过程和价值增殖过程的统一", "C": "物质资料再生产与资本主义生产关系再生产的统一", "D": "再生产物质资料价值与转移劳动力价值的统一"}, "answer": "C"}, {"id": "p1s-152", "num": 152, "type": "single", "stem": "社会生产是连续不断地进行的，这种连续不断重复的生产就是再生产。社会再生产的核心问题是", "options": {"A": "两大部类在总量上的比例问题", "B": "社会总产品的价值补偿和实物补偿问题", "C": "工资与剩余价值的分配问题", "D": "劳动过程和价值增殖过程的统一问题"}, "answer": "B"}, {"id": "p1s-154", "num": 154, "type": "single", "stem": "利润平均化规律，反映了在瓜分剩余价值上，资本家之间虽然存在竞争和矛盾，但在加强对工\n人阶级的剥削以榨取更大量的剩余价值这一点上，资本家之间有着共同的阶级利益。平均利润\n的出现是", "options": {"A": "同一部门内不同企业之间竞争的结果", "B": "不同部门之间竞争的结果", "C": "国际上同类企业之间竞争的结果", "D": "不同行业之间工人联合斗争的结果"}, "answer": "B"}, {"id": "p1s-157", "num": 157, "type": "single", "stem": "资本主义制度下的工资之所以掩盖了资本主义剥削关系，是因为", "options": {"A": "工资表现为“劳动的价格”", "B": "工资表现为劳动力的价值", "C": "工资模糊了个别劳动时间和社会必要劳动时间的界限", "D": "工资的价值只计算了转移到新产品中去的那一部分"}, "answer": "A"}, {"id": "p1s-158", "num": 158, "type": "single", "stem": "资本主义经济危机爆发的根本原因是资本主义的基本矛盾。经济危机的抽象的一般的可能性首\n先是由", "options": {"A": "社会的绝对的消费能力引起的", "B": "货币作为流通手段和支付手段引起的", "C": "商品价格和价值之间量的不一致引起的", "D": "社会总产品两大部类比例失衡引起的"}, "answer": "B"}, {"id": "p1s-159", "num": 159, "type": "single", "stem": "2025年10月，美国联邦政府时隔近7年再度“停摆”。随着联邦政府“停摆”持续，其对美\n国社会的影响已从政府系统蔓延至民众日常生活，多项公共服务陷入停滞，弱势群体首当其\n冲。在发达资本主义的美国出现的种种社会问题，从一个侧面反映了资本主义固有的、内在的\n基本矛盾，即", "options": {"A": "生产社会化和生产资料资本主义私人占有之间的矛盾", "B": "无产阶级与资产阶级之间的矛盾", "C": "个别企业内部生产的有组织性和整个社会生产的无政府状态之间的矛盾", "D": "生产无限扩大的趋势与劳动人民有支付能力的需求相对缩小的矛盾"}, "answer": "A"}, {"id": "p1s-161", "num": 161, "type": "single", "stem": "经济危机实际上是资本主义条件下以强制的方式解决社会再生产的实现问题的途径。资本主义\n经济危机具有周期性，这是由", "options": {"A": "社会资本再生产的周期性决定的", "B": "资本主义基本矛盾运动的阶段性决定的", "C": "工人运动进入低潮和重新高涨的周期运动决定的", "D": "货币资本、生产资本、商品资本三种职能形式在时间上的继起性决定的"}, "answer": "B"}, {"id": "p1s-162", "num": 162, "type": "single", "stem": "资本主义国家的对内职能，主要是", "options": {"A": "社会管理职能", "B": "政治统治的职能", "C": "管理通信、交通、水利等事业的职能", "D": "管理文教、卫生保健、社会福利等事业的职能"}, "answer": "B"}, {"id": "p1s-165", "num": 165, "type": "single", "stem": "在资本主义的自由竞争中，在剩余价值规律、竞争规律和资本积累规律的作用下，必然引起生\n产集中和资本集中，生产集中和资本集中发展到一定阶段必然引起垄断，这是资本主义发展的\n客观规律。资本集中是指", "options": {"A": "国家政权和私人垄断资本融合在一起的过程", "B": "大资本吞并小资本，或由许多小资本合并而成大资本的过程", "C": "工业垄断资本和银行垄断资本融合在一起的过程", "D": "个别资本通过剩余价值的资本化来增大资本的总量"}, "answer": "B"}, {"id": "p1s-167", "num": 167, "type": "single", "stem": "金融资本是由工业垄断资本和银行垄断资本融合在一起而形成的一种垄断资本。金融资本的形\n成主要是通过", "options": {"A": "金融联系、资本参与和人事参与", "B": "参与制、个人联合、建立政策咨询机构", "C": "生产集中、资本集中和金融联系", "D": "人事参与、金融创新和金融自由化"}, "answer": "A"}, {"id": "p1s-168", "num": 168, "type": "single", "stem": "金融寡头是指操纵国民经济命脉，并在实际上控制国家政权的少数垄断资本家或垄断资本家集\n团。金融寡头在经济领域中的统治主要是通过“参与制”实现的。所谓“参与制”是指金融寡头", "options": {"A": "通过把自己的代理人送进政府或议会来为其垄断统治服务", "B": "通过建立政策咨询机构等方式参与政府的政策制定", "C": "通过掌握一定数量的股票来层层控制企业", "D": "私人与国家共同投资开办合营企业"}, "answer": "C"}, {"id": "p1s-169", "num": 169, "type": "single", "stem": "垄断资本的实质在于获取垄断利润，垄断利润是垄断资本家凭借其在社会生产和流通中的垄断\n地位而获得的超过平均利润的高额利润。垄断利润的形成，关键在于", "options": {"A": "垄断组织能够把包罗万象的社会生产全部包下来", "B": "垄断消除了产生竞争的经济条件", "C": "垄断条件下的竞争采取的完全是非经济的手段", "D": "垄断组织在经济生活中起了决定性作用"}, "answer": "D"}, {"id": "p1s-170", "num": 170, "type": "single", "stem": "第二次世界大战后，在所有发达资本主义国家，国家垄断资本主义无论在广度上还是在深度上\n都有了更迅速、更普遍的发展，国家干预深入到资本主义的生产、流通、分配和消费的各个环\n节。国家垄断资本主义尽管有各种不同的具体形式，其实质都是", "options": {"A": "国家政权取代私人垄断资本的一种新型垄断资本主义", "B": "国家运用财政政策、货币政策等经济手段，对社会总供求进行调节", "C": "私人垄断资本利用国家机器来为其发展服务的手段", "D": "国家与私人共有、合营企业"}, "answer": "C"}, {"id": "p1s-171", "num": 171, "type": "single", "stem": "随着资本输出的不断增加和垄断资本势力范围的迅速扩大，各国之间的经济联系日益密切，同\n时，彼此间的竞争更为激烈，矛盾和冲突也更为突出。在这一背景下，各资本主义国家的垄断\n组织，通过订立协议建立起国际垄断资本的联盟，即国际垄断同盟，以便在世界范围形成垄\n断，并在经济上瓜分世界。当代国际垄断同盟的主要形式是", "options": {"A": "国家垄断资本主义的国际联盟", "B": "国际卡特尔", "C": "国际托拉斯", "D": "国际康采恩"}, "answer": "A"}, {"id": "p1s-172", "num": 172, "type": "single", "stem": "经济全球化是当代世界经济的重要特征之一，也是世界经济发展的重要趋势。为经济全球化提\n供了坚实的物质基础和根本的推动力的是", "options": {"A": "科学技术的进步和生产力的发展", "B": "跨国公司在全球范围内的迅速发展", "C": "各国经济体制的变革和国际经济组织的发展", "D": "金融自由化与金融创新"}, "answer": "A"}, {"id": "p1s-173", "num": 173, "type": "single", "stem": "第二次世界大战后，由于多种社会因素的影响，资本主义发生了一系列变化。在劳资关系方\n面，劳动对资本的隶属从资本主义发展初期的形式上的隶属逐渐成为实质上的隶属。之所以发\n生这种变化，是因为", "options": {"A": "资本家与雇佣工人的关系从“自由平等”变为人身依附", "B": "终身雇佣和职工持股等方式使得劳动者成为资本家的代理人", "C": "劳动者个人的技能不再对生产过程和结果具有决定意义", "D": "雇佣劳动者的剩余劳动不再是剩余价值的唯一源泉"}, "answer": "C"}, {"id": "p1s-174", "num": 174, "type": "single", "stem": "进入21世纪以来，随着经济全球化的深入发展，新一轮科技革命和产业变革进入空前密集括\n跃期，社会化大生产在世界范围内更大规模、更广范围、更深层次展开，世界格局深度调整，\n资本主义呈现出一些新变化、新特征。当代资本主义最突出、最鲜明、最主要的特征是", "options": {"A": "社会阶级层级结构呈现复杂性、多样化", "B": "科技创新加速资本主义生产方式变化", "C": "国际金融资本的垄断", "D": "发达资本主义国家在世界范围内推行霸权主义和强权政治\n第六章 社会主义的发展及其规律"}, "answer": "C"}, {"id": "p1s-175", "num": 175, "type": "single", "stem": "从空想社会主义诞生到《共产党宣言》问世，其间空想社会主义经历了330多年的发展历程。\n空想社会主义的开山之作是", "options": {"A": "《太阳城》", "B": "《乌托邦》", "C": "《自然法典》", "D": "《论法制或法律的原则》"}, "answer": "B"}, {"id": "p1s-176", "num": 176, "type": "single", "stem": "从莫尔1516年发表《乌托邦》到现在，社会主义已经有500多年的历史了。社会主义发展史\n上的第一次历史性飞跃是指", "options": {"A": "19世纪中叶，社会主义从空想发展到科学", "B": "20世纪初，社会主义从理论发展到建立社会主义制度的实践", "C": "社会主义从一国实践发展到多国实践", "D": "20世纪70年代末开始的社会主义改革"}, "answer": "A"}, {"id": "p1s-177", "num": 177, "type": "single", "stem": "空想社会主义的发展经历了三个阶段，其中成为科学社会主义的直接思想来源的是", "options": {"A": "16—17世纪的早期空想社会主义", "B": "18世纪的空想平均共产主义", "C": "19世纪初期批判的空想社会主义", "D": "20世纪的空想社会主义"}, "answer": "C"}, {"id": "p1s-178", "num": 178, "type": "single", "stem": "无产阶级夺取政权的第一次伟大尝试是", "options": {"A": "1848年欧洲革命", "B": "1864年国际工人协会(第一国际)的成立", "C": "1871年爆发的巴黎公社革命", "D": "1889年第二国际的诞生"}, "answer": "C"}, {"id": "p1s-179", "num": 179, "type": "single", "stem": "经济和政治发展的不平衡是资本主义的绝对规律，由此应当得出的结论是", "options": {"A": "无产阶级革命至少将在几个主要的资本主义国家同时发生", "B": "社会主义可能在经济文化相对落后的俄国首先取得胜利", "C": "社会主义可能首先在少数甚至在单独一个资本主义国家内获得胜利", "D": "社会主义可能在经济文化相对发达的国家首先取得胜利"}, "answer": "C"}, {"id": "p1s-181", "num": 181, "type": "single", "stem": "马克思、恩格斯在创立科学社会主义理论并用以指导国际工人运动的过程中，逐步形成了科学\n社会主义基本原则。这些原则在后来的社会主义革命和建设中得到了证实、丰富和发展。科学\n社会主义的核心命题是", "options": {"A": "无产阶级是最先进、最革命的阶级，肩负着推翻旧世界、建设新世界的历史使命", "B": "无产阶级政党是无产阶级的先锋队，社会主义事业必须始终坚持无产阶级政党的领导", "C": "共产主义是人类最美好的社会制度，实现共产主义是共产党人的最高理想", "D": "资本主义必然灭亡，社会主义必然胜利"}, "answer": "D"}, {"id": "p1s-182", "num": 182, "type": "single", "stem": "社会主义的发展道路必然呈现出多样性的特点。造成社会主义发展道路多样性的现实原因是", "options": {"A": "无产阶级政党自身成熟程度的不同", "B": "历史文化传统的差异性", "C": "时代和实践的不断发展", "D": "自然地理环境的影响\n第七章 共产主义崇高理想及其最终实现"}, "answer": "C"}, {"id": "p1s-183", "num": 183, "type": "single", "stem": "马克思主义与空想社会主义在展望未来社会的问题上的根本区别在于", "options": {"A": "是否坚持科学的立场观点方法", "B": "是否正确预见未来", "C": "是否提出未来社会的具体方案", "D": "是否批判资本主义旧世界"}, "answer": "A"}]}, {"id": "p1m", "title": "第一部分 马原 · 多选", "part": 1, "type": "multiple", "questions": [{"id": "p1m-1", "num": 1, "type": "multiple", "stem": "习近平深刻指出：“中国共产党为什么能，中国特色社会主义为什么好，归根到底是马克思主义\n行，是中国化时代化的马克思主义行。”马克思主义的当代价值在于，它是", "options": {"A": "观察当代世界变化的认识工具", "B": "指引当代中国发展的行动指南", "C": "引领人类社会进步的科学真理", "D": "指导革命、建设、改革的现成方案"}, "answer": "ABC"}, {"id": "p1m-2", "num": 2, "type": "multiple", "stem": "马克思主义主要由哲学、政治经济学、科学社会主义三大组成部分构成。这三大组成部分分别来\n源于德国古典哲学、英国古典政治经济学、英法空想社会主义，最终升华为马克思主义。最终升\n华的根本原因在于", "options": {"A": "马克思对所处的时代和世界的深入考察", "B": "马克思拥有优良的家庭背景和教育经历", "C": "马克思对人类社会发展规律的深刻把握", "D": "马克思出生和生活的德国、英国、法国是当时最为发达的资本主义国家\n第一章 世界的物质性及发展规律"}, "answer": "ABD"}, {"id": "p1m-6", "num": 6, "type": "multiple", "stem": "马克思、恩格斯科学总结了哲学和自然科学发展的成果，继承了以往唯物主义关于世界物质性的\n基本观点，同时批判了旧唯物主义对物质世界的直观、消极、机械的理解，强调要", "options": {"A": "用辩证的观点把握世界", "B": "从意识对于物质的独立性和根源性中把握和规定物质", "C": "从实践出发去把握现实世界", "D": "从自然存在和社会存在的统一中把握世界的物质性"}, "answer": "ACD"}, {"id": "p1m-7", "num": 7, "type": "multiple", "stem": "马克思主义物质观认为，客观实在性是物质的唯一特性，既肯定了哲学物质范畴同自然科学物质\n结构理论的联系，又把它们区别开来，体现了唯物论和辩证法的统一，克服了形而上学唯物主义\n的缺陷。马克思主义物质观所体现的唯物辩证法是指", "options": {"A": "从个性中看到共性", "B": "从相对中找到绝对", "C": "从暂时中发现永恒", "D": "从局部中看到整体"}, "answer": "ABC"}, {"id": "p1m-8", "num": 8, "type": "multiple", "stem": "当今时代，量子信息技术发展突飞猛进，给人们传统的物质观念带来很大冲击。“量子”概念的\n确立，意味着微观粒子的运动不再像宏观物体运动那样有确定的轨迹，其运行具有概率性质，其\n能量释放和传播是不连续的。曾经相互作用过的两个粒子，不管分离之后相距多远，始终会神秘\n地联系在一起，其中一方发生变化，就会立即引发另一方产生相应的变化(这种现象被称为“量\n子纠缠”)。量子力学的发展表明，在微观领域内不能像经典物理学那样理解“实在”。以下说法\n正确的有", "options": {"A": "量子的特性并没有否定物质的客观实在性", "B": "量子纠缠作为一种精神现象也有其客观性", "C": "客观实在的“客观”是在不依赖于人的意识而存在的意义上讲的", "D": "物质的具体形态和具体结构是可变的、相对的"}, "answer": "ACD"}, {"id": "p1m-9", "num": 9, "type": "multiple", "stem": "物质和意识的对立只是在非常有限的范围内才有绝对的意义，超出这个范围，其对立便是相对\n的。这是因为", "options": {"A": "意识根源于物质", "B": "意识是物质的反映", "C": "意识是物质的固有属性和存在形式", "D": "意识可以转化为物质"}, "answer": "ABD"}, {"id": "p1m-10", "num": 10, "type": "multiple", "stem": "鲁迅说过：“描神画鬼，毫无对证，本可以专靠神思，所谓‘天马行空’地挥写了。然而他们写\n出来的却是三只眼、长颈子，也就是在正常的人体身上增加了眼睛一只，拉长了颈子二三尺而\n已。”这段话说明，人们头脑中的鬼神观念", "options": {"A": "是头脑中主观自生的", "B": "是人脑对客观世界的歪曲反映", "C": "是人脑对鬼神的虚幻反映", "D": "可以从人世间找到它的原型"}, "answer": "BD"}, {"id": "p1m-11", "num": 11, "type": "multiple", "stem": "我国是非物质文化遗产大国，从传统技艺到传统礼仪、节庆，非遗是中华优秀传统文化在当代\n的活态呈现。如何理解非物质文化遗产中的“非物质”?有专家指出，非遗是一个整体性的文化\n概念，代表了一种文化生态。非遗中的“非物质”并不是说与物质无关，多数非遗以物质为依\n托，通过物质的媒介或载体反映其精神、价值、意义。在非遗保护工作中，进一步加强非遗的\n物质认同很有必要，透过“物质”看“非遗”,而不可偏废一端。透过“物质”看“非遗”\n说明", "options": {"A": "世界的统一性在于它的物质性", "B": "精神文化的生产不是一个纯粹的意识过程", "C": "物质和精神是不可分割的，二者互为前提", "D": "文化产品的全部价值都体现在其物质载体的经济价值之中"}, "answer": "AB"}, {"id": "p1m-12", "num": 12, "type": "multiple", "stem": "在早期网络社交中，人们只能依靠文字传递信息，而表情包的出现让人们在网络交流时得以更\n加直观、快捷地表达此时此刻的情感和态度。当一个表情包被数量足够多的用户、差异性足够\n大的群体共同使用时，这个表情包往往折射出一定时期内人们的共同关注和相似体验，因此表\n情包的变化历史一定程度上折射出了人们现实生活的发展变迁。还有些时候，同一个表情包对\n不同群体、不同人来说，含义可能并不相同。例如“微笑”的表情，在一些人眼中表示内心的\n愉悦，在另一些人看来则是礼貌性的社交回应。发送者和接收者身处不同的社会地位或文化语\n境，在对表情包的“编码—解码”转义过程中就有可能产生不同的理解。以上材料说明", "options": {"A": "人的意识活动具有能动性和创造性", "B": "人们的意识随着社会生活的变化而变化", "C": "同一内容可以通过多种形式来体现", "D": "事物的性质取决于人们观察的角度"}, "answer": "ABC"}, {"id": "p1m-13", "num": 13, "type": "multiple", "stem": "马克思说：“蜘蛛的活动和织工的活动相似，蜜蜂建筑蜂房的本领使人间的许多建筑师感到惭\n愧。但是最蹩脚的建筑师比最灵巧的蜜蜂高明的地方，是他在用蜂蜡建筑蜂房前，已经在自己\n的头脑中把它建成了。”这句话说明", "options": {"A": "主观能动性是人区别于动物的特征", "B": "人的实践活动是有目的、有意识的", "C": "人以自己的活动来改造世界，而动物只能以本能来适应环境", "D": "意识先于物质、决定物质"}, "answer": "ABC"}, {"id": "p1m-14", "num": 14, "type": "multiple", "stem": "北斗卫星导航系统作为我国重要的“时空基础设施”,主要的两大功能就是代表“时”的精准\n授时和代表“空”的空间定位。精准授时与国计民生息息相关，体现在看得见摸得着的日常生\n活中，就是飞机起飞、乘坐地铁、证券交易，都需要分秒不差。而在定位领域，比如我们熟悉\n的共享单车，就搭载了国产北斗高精度定位芯片。北斗的高精度定位技术，结合电子围栏技术，\n可以实现判定单车停放区域、入栏结算、停车指引、禁停区划设、定点停放等功能。可以说，\n时空信息服务已经渗透到我们生活的每一个角落，北斗无处不在，无时不在。北斗作为“时空\n基础设施”的应用说明", "options": {"A": "具体物质形态的时间和空间既是无限的也是有限的", "B": "物质、运动、时间、空间具有内在的统一性", "C": "时间和空间是运动着的物质的基本存在形式", "D": "离开时间和空间的物质运动是暂时的、有条件的"}, "answer": "BC"}, {"id": "p1m-15", "num": 15, "type": "multiple", "stem": "狭义相对论揭示了牛顿力学所没有的新现象，如运动的尺子会缩短，运动的时钟会变慢。根据\n相对论的公式，尺子的长度在不同的运动着的物质体系中是不一样的，它沿着运动方向的长度\n随着运动速度的增加而缩短，运动的速度越快，长度就变得越短。这说明", "options": {"A": "时间和空间与物质运动不可分割", "B": "物质运动时间和空间的具体特性是相对的", "C": "时间和空间是物质的根本属性", "D": "时间和空间是人们观察的结果"}, "answer": "AB"}, {"id": "p1m-16", "num": 16, "type": "multiple", "stem": "物质世界是运动变化着的，并从中分化出多样化的特别是更高级的事物和运动形式。人类的出\n现，特别是人类改造世界的实践活动，极大地改变了世界的面貌，使世界发生了二重分化，即", "options": {"A": "从自然界中分化出人类社会", "B": "从客观世界中分化出主观世界", "C": "从必然王国中分化出自由王国", "D": "从现实世界中分化出虚拟世界"}, "answer": "AB"}, {"id": "p1m-17", "num": 17, "type": "multiple", "stem": "自然情况下，树叶落地后会经历一个生化分解的过程。这个过程主要由细菌和真菌等微生物，\n以及蚯蚓等小型无脊椎动物参与。它们分解落叶中的有机物质，将其转化为氮、磷、钾等营养\n元素，释放出二氧化碳和水。这个过程符合自然生态系统物质循环和能量流动的基本规律，体\n现了生态环境的自我修复和更新机制，对于维护生态系统平衡具有重要意义。近几年，顺应公\n众愿望，北京、上海、杭州等城市在落叶季纷纷倡导“落叶不扫”或“落叶缓扫”。或是划定景\n观道，或是在环卫工作中有选择地清扫，让落叶“多停留一会儿”,既彰显自然之美，又凸显人\n文关怀，也是将生态文明理念融入城市管理和人居环境建设的体现。以上材料给我们的启示有", "options": {"A": "自然界与人类社会是交叉重叠和相互作用的", "B": "顺应自然就是不要对自然的事物做任何改动", "C": "自然与社会的统一是一个动态的历史的过程", "D": "世界上的一切联系都具有“人化”的特点"}, "answer": "AC"}, {"id": "p1m-19", "num": 19, "type": "multiple", "stem": "日前，国内首个Al(人工智能)儿科医生在北京儿童医院正式“上岗”。这款专家型AI 儿科医\n生整合了大量医学语料知识，深度学习了300多位知名儿科专家的临床经验和高质量病历数据，\n可以担任不同领域儿科专家的临床科研助理，输出符合临床思维路径的诊疗建议，辅助医生进\n行疑难罕见病的诊断和治疗，提升临床决策效率。在专家看来，医生与Al的关系不是竞争，而\n是协同。在AI儿科医生与专家“双医并行”的会诊模式中，医生仍是决策者。AI儿科医生与专\n家“双医并行”说明，建立在大数据与不断升级的各种算法技术基础上的现代人工智能", "options": {"A": "是人的意识能动性的一种特殊表现", "B": "还无法代替人们以知情意统一为基础的整体决策", "C": "已经可以取代或超越人类智能", "D": "与使用者共同构成物质生产实践的主体"}, "answer": "AB"}, {"id": "p1m-20", "num": 20, "type": "multiple", "stem": "一个成熟的人工智能大模型，算法、算力、数据3方面缺一不可。其中，大量高质量的数据有\n助于不断提高大模型的准确率，这离不开训练师的努力。他们通过清洗、整合、标注等操作，\n生成满足机器学习训练要求的可读数据编码。大模型在收到训练师的反馈后，会以此调整算法\n参数权重，不断优化生成结果。对普通用户而言，随着大模型不断优化，他们会发现人工智能\n越来越“懂”人类。除了专业知识，训练师的审美、性格、思考方式等，都会对人工智能产生\n影响。例如一款大模型的定位是用户的“伙伴”,那么人们会优先考虑让具有温柔、开朗等性格\n特征的员工参与训练。通过训练师的工作让人工智能更“懂”人类，说明", "options": {"A": "人类的情感、信念、意志、创造性思维等已经可以被还原为数据信息及其基本算法", "B": "人工智能在一定程度上可以承担某种社会功能，但不可能真正具备人类的社会属性", "C": "主体的本质力量可以通过实践活动积淀、凝聚和物化在客体中", "D": "人工智能是人的头脑反映和把握物质世界的精神活动的总和"}, "answer": "BC"}, {"id": "p1m-21", "num": 21, "type": "multiple", "stem": "2025年，“具身智能”被首次写入《政府工作报告》。这种被喻为“有了物理身体的智能”,相\n比善于思考的语言大模型，更强调与现实世界的动态交互。随着心理学、认知科学的发展，越\n来越多的观点认为，人的智慧并非独立依赖思维而产生，而是在长期进化中对外部世界的适应，\n是大脑、身体、环境交织作用的结果。具身智能，某种程度上是让机器像人类一样学习和思考，\n打破抽象思维的桎梏，通过具象的互动与反馈不断优化决策与行动。具身智能让机器像人类一\n样学习和思考，说明", "options": {"A": "意识活动及其规律是可以被认识的", "B": "人的本质力量可以对象化、现实化", "C": "机器人已经真正具备自立、自主、自觉的社会活动", "D": "意识的产生可以脱离人脑这一物质器官"}, "answer": "AB"}, {"id": "p1m-22", "num": 22, "type": "multiple", "stem": "供应链是指生产及流通过程中，涉及将产品或服务提供给最终用户活动的上游与下游企业所形\n成的网链结构。在专业分工商度精细化的当今社会，一个企业的外部可能存在着与企业相关的\n生产和流通过程中涉及的原材料供应商、生产厂商、储运商、零售商等在内的庞大供霜网络。\n在这个网络中任何一环出现问题，都可能导致“牵一发而动全身”的连锁反应，前几年席卷汽\n车、通讯、家电等多个制造行业的“芯片荒”就是一个典型的例子。以上材料给我们的启示有", "options": {"A": "任何小物之间都存在着直接联系", "B": "整个世界是相互联系的统一整体", "C": "要用系统思维的方法分析和处理问题", "D": "偶然要通过必然来为自己开辟道路"}, "answer": "BC"}, {"id": "p1m-23", "num": 23, "type": "multiple", "stem": "生态是统一的自然系统，是相互依存、紧密联系的有机链条。山水林田湖草沙等生态系统各要\n素，既有各自内在的结构、功能和变化规律，又与其他要素相互耦合、相互影响。治山、治水、\n治林、治田、治湖、治草、治沙任何一个环节的动作，都会影响到其他环节，乃至影响生态系\n统全局。这一材料说明", "options": {"A": "任何事物都具有一定的外部联系和内部联系", "B": "面对系统时要从整体上把握事物并实现事物结构与功能的优化", "C": "亦物之间的普遍联系只有通过人这一中介才能实现", "D": "人类改造自然的任何行为都会遭到大自然的报复和惩罚"}, "answer": "AB"}, {"id": "p1m-24", "num": 24, "type": "multiple", "stem": "唯物辩证法就其本质来说是批判的、革命的，因为它", "options": {"A": "认为凡是现存的都是应当灭亡的", "B": "对每一种既成的形式都从其暂时性方面去理解和对待", "C": "认为事物变化发展只有间断性，没有连续性", "D": "在对现存事物的肯定理解中包含对现存事物的否定理解"}, "answer": "ABD"}, {"id": "p1m-25", "num": 25, "type": "multiple", "stem": "下列命题中，包含辩证法思想的有", "options": {"A": "“穷则变，变则通，通则久”", "B": "“祸兮福之所倚，福兮祸之所伏”", "C": "“道之大原出于天，天不变，道亦不变”", "D": "“天下之势，循则极，极则反”"}, "answer": "ABD"}, {"id": "p1m-26", "num": 26, "type": "multiple", "stem": "绿水青山就是金山银山、冰天雪地也是金山银山。习近平强调，要充分利用东北地区的独特资\n源和优势，推进寒地冰雪经济加快发展。黑龙江“多轮驱动”,“冰天雪地”向“金山银山”加\n速转化。在黑河市寒区试车高新技术产业园，“黑河全季节测试基地项目”施工正酣。在不久的\n将来，这里将成为业界领先的低温反季节汽车测试基地。据统计，上个冰雪季，试车经济为当\n地直接创造收入1.7亿元，间接带动服务收入4.3亿元。从“冷资源”里挖掘“热产业”,这\n一事例体现的哲学原理是", "options": {"A": "要坚持“两点论”,一分为二看问题", "B": "联系具有条件性，经过努力可以化不利条件为有利条件", "C": "矛盾着的对立面相互贯通，在一定条件下可以相互转化", "D": "价值具有多维性，客体能否满足主体需要是由人的主观愿望决定的"}, "answer": "ABC"}, {"id": "p1m-27", "num": 27, "type": "multiple", "stem": "“和实生物，同则不继，以它平它谓之和，故能丰长而物归之。”这里包含的辩证法思想有", "options": {"A": "矛盾的同一是包含差别的同一", "B": "对立面的统一是事物发展的动力", "C": "不包含内部差别的事物就不能存在和发展", "D": "矛盾的一方只有克服另一方才能达到统一\n2027考研政治1000 题>》试题分册"}, "answer": "ABC"}, {"id": "p1m-28", "num": 28, "type": "multiple", "stem": "近年来，我国不断放宽外商投资准入限制，有人担心外资的大量涌入会对一些国产品牌实力较\n弱的行业带来冲击，但也有人认为高水平的外资进入中国会产生“鲇鱼效应”,倒逼国产品牌加\n速提升竞争力。以新能源汽车行业为例，在特斯拉落户上海并国产化之后，国内的新能源汽车\n品牌迅速成长，也推出了较高竞争力的产品并占据了一定的市场份额。从长期来看，这种良性\n竞争有利于我国新能源汽车行业的健康发展。以上材料给我们的启示有", "options": {"A": "斗争性是事物存在和发展的前提", "B": "矛盾双方可以相互吸取有利于自身的因素而获得发展", "C": "矛盾双方既对立又统一，由此推动事物发展", "D": "矛盾一方的发展以另一方的发展为条件"}, "answer": "BCD"}, {"id": "p1m-29", "num": 29, "type": "multiple", "stem": "先试点再推广，是我们推进改革的成功做法。一项改革特别是重大改革，先在基层、在个别地\n区试点，有利于取得经验、规避风险，也有利于科学决策。以上海浦东为例，30多年来，浦东\n敢闯敢试、先行先试，诞生了第一个金融贸易区、第一个保税区、第一个自由贸易试验区及临\n港新片区、第一家外商独资贸易公司等一系列“全国第一”。如今，自由贸易区等试点成果已经\n成功推广到全国各地。“先试点再推广”说明", "options": {"A": "个性在一定条件下能够转化为共性", "B": "通过实践的检验，正确的理论才能得到证实", "C": "在个别之中存在着一般", "D": "规律因人们的意图和愿望而存在并发生作用"}, "answer": "ABC"}, {"id": "p1m-30", "num": 30, "type": "multiple", "stem": "据媒体爆料，日前某事业单位的公开招聘中，笔试、面试均为第一的硕士却被拒录，理由令人\n哭笑不得：报考者所学的“比较文学与世界文学”属于“中国语言文学类”,但不是招聘要求\n的“中国语言文学”,“差一个字都不行”。此前在另一事业单位的招聘中也出现过“世界史不\n是历史学”的笑话。从哲学上讲，这种“白马非马”式招聘的错误在于割裂了", "options": {"A": "一般与个别的关系", "B": "共性与个性的关系", "C": "整体与部分的关系", "D": "普遍与特殊的关系"}, "answer": "ABD"}, {"id": "p1m-31", "num": 31, "type": "multiple", "stem": "“天下难事，必作于易；天下大事，必作于细。”下列选项中与老子这句话蕴含的哲理相似的是", "options": {"A": "“不积跬步，无以至千里；不积小流，无以成江海”", "B": "“善不积不足以成名，恶不积不足以灭身”", "C": "“掌握火候”“过犹不及”", "D": "“见善如不及，见不善如探汤”"}, "answer": "AB"}, {"id": "p1m-32", "num": 32, "type": "multiple", "stem": "习近平指出，“环境就是民生，青山就是美丽，蓝天也是幸福”。《2025年北京市生态环境状况\n公报》显示，2025年北京市空气质量优良天数达到311天，优良天数比率达到85.2%,首次超\n过85%,是有监测以来最多的一年。通过多年的努力，北京的空气质量已经实现了从“APEC\n蓝”到“常态蓝”的历史性转变。北京空气质量的巨大转变，得益于北京持续深化的“一微\n克”行动。顾名思义，“一微克”行动是一项针对北京大气污染防治的长期任务，强调细颗粒物\n治理要一个微克一个微克去抠，综合运用科技、执法、管理等手段，实施大气污染精准治理。\n2025年，北京市PM2.5年均浓度为27.0微克/立方米，同比下降11.5%,为有监测以来首次\n低于“30微克”,北京市大气污染治理取得里程碑式突破。久久为功的“一微克”行动给我们\n的启示是", "options": {"A": "事物发展是一个直线上升的过程", "B": "从实际出发是正确发挥人的主观能动性的前提", "C": "证变达到一定程度必然引起质变", "D": "人的主观意志规定着事物的发展方向"}, "answer": "BC"}, {"id": "p1m-33", "num": 33, "type": "multiple", "stem": "恩格斯说，任何一门科学的真正完善在于数学工具的广泛应用。这说明", "options": {"A": "只有精确地认识量，才能更深刻地把握质", "B": "认识事物的证是认识的深化和精确化", "C": "量和事物的存在是直接同一的", "D": "考察量是认识质的前提，区分质是认识量的深化"}, "answer": "AB"}, {"id": "p1m-34", "num": 34, "type": "multiple", "stem": "公元前5世纪到公元前4世纪，古希腊麦加拉学派哲学家欧布利德提出了著名的“谷堆”“秃\n顶”论证。“谷堆”论证认为，一粒谷子不能形成谷堆，再加上一粒也不能形成谷堆，如果每次\n都加一粒谷子，而每增加的一粒又都不能形成谷堆，那怎么能形成谷堆呢?“秃顶”论证认为，\n掉一根头发不能成为秃顶，再掉一根也不能成为秃顶，如果每次掉一根，而掉的每一根又不能\n形成秃顶，那么何时形成秃顶?很明显，上述两个论证与事实不相符，它们的错误就在于", "options": {"A": "割裂了质和量之间的联系", "B": "混淆了事物共性和个性之间的区别", "C": "不了解量和质的统一在度中得到体现", "D": "否认了运动的相对性和稳定性"}, "answer": "AC"}, {"id": "p1m-35", "num": 35, "type": "multiple", "stem": "增强忧患意识、坚持底线思维，是我们党的优良传统和宝贵经验。在党的七大上，毛泽东同志\n提出全党要“准备吃亏”,强调“要在最坏的可能性上建立我们的政策”。改革开放后，邓小平\n同志强调：“我们要把工作的基点放在出现较大的风险上，准备好对策。”党的十八大以来，\n习近平总书记反复强调坚持底线思维，告诫全党要“坚持底线思维、增强忧患意识，有效防范\n和化解前进道路上的各种风险”。坚持底线思维蕴含的哲学原理是", "options": {"A": "要坚持“两点论”,不能只看到有利的一面、忽视不利的一面", "B": "要充分发挥主观能动性，将事物的发展永远控制在量变的范围内", "C": "要以积极的态度研判风险、防患于未然，变挑战为机遇，追求最佳结果", "D": "要认清事物发生质变的临界点，自觉把握事物量变引起质变的“度”"}, "answer": "ACD"}, {"id": "p1m-36", "num": 36, "type": "multiple", "stem": "“是就是，不是就不是；除此之外，都是鬼话。”形而上学否定观的错误在于", "options": {"A": "它只承认克服，不承认保留", "B": "它只看到了事物之间的联系，没有看到事物之间的区别", "C": "它在绝对不相容的对立中进行思维", "D": "它认为否定是绝对的否定，是不包含肯定的否定"}, "answer": "ACD"}, {"id": "p1m-37", "num": 37, "type": "multiple", "stem": "对于中华优秀传统文化，我们既要注重传承，又要根据时代要求实现创造性转化和创新性发展。\n对于其他民族的文化成果，我们既不照搬，也不应一概排斥，而要批判地吸收其合理的因素，\n为我所用。从哲学上说，这是因为", "options": {"A": "辩证否定观反对简单地肯定一切或否定一切", "B": "事物内部所包含的否定方面始终是处于优势和支配地位的", "C": "我们对待一切事物都要采取科学分析的态度", "D": "分析事物时既要把握住它的现存状态又要把握住它的发展趋向"}, "answer": "ACD"}, {"id": "p1m-38", "num": 38, "type": "multiple", "stem": "以下属于否定之否定规律的有", "options": {"A": "团结—批评—团结", "B": "实践一认识一再实践", "C": "古代朴素辩证法—形而上学—唯物辩证法", "D": "奴隶社会一封建社会一资本主义社会"}, "answer": "ABC"}, {"id": "p1m-39", "num": 39, "type": "multiple", "stem": "法国1789—1794年资产阶级革命之后，经历了资产阶级和贵族的反复较量，旧王朝两次复辟，\n资产阶级为了取得政治统治，进行了三次革命斗争。这说明", "options": {"A": "新水物必定取代旧事物", "B": "社会发展的基本趋势是可以改变的", "C": "发展是前进性和曲折性的统一", "D": "社会形态更替具有必然性"}, "answer": "ACD"}, {"id": "p1m-40", "num": 40, "type": "multiple", "stem": "“一语不能践，万卷徒空虚”,在“不忘初心、牢记使命”主题教育工作会议上，习近平强调力\n戒形式主义、官僚主义。2024年8月，中共中央办公厅、国务院办公厅印发《整治形式主义为\n基层减负若干规定》,这是首次以党内法规形式制定出台为基层减负的制度规范，以更加具体精\n准的条文规定为整治形式主义提供了有力制度支撑。从哲学的角度分析，之所以要反对形式主\n义，是因为", "options": {"A": "内容决定形式，形式是为内容服务的", "B": "形式脱离内容就失去了自己存在的价值和意义", "C": "当内容相对稳定时，形式对于内容是可有可无的", "D": "同一内容可以有多种形式，而同一种形式无法表现不同的内容"}, "answer": "AB"}, {"id": "p1m-41", "num": 41, "type": "multiple", "stem": "列宁曾经把现象比作河水上面的泡沫，而把本质比作下面的深流。这一比喻形象地说明了本质\n与现象的关系，以下说法正确的有", "options": {"A": "本质只有通过理性思维才能把握", "B": "现象离不开本质，但本质可以离开现象", "C": "现象是多变易逝的，本质是相对稳定的", "D": "真象和本质是同一的，假象和本质不是同一的"}, "answer": "AC"}, {"id": "p1m-42", "num": 42, "type": "multiple", "stem": "近期，全国多地密集发放消费券，餐饮、购物、文旅⋯⋯各种类型应有尽有，涵盖了衣食住行\n的方方面面。除了直接用于消费外，消费券还能通过乘数效应带动更广泛的经济活动。例如，\n餐饮消费券能增加商家收入、带动周边商铺客流同时惠及上游农户、食材供应商；电影券不仅\n带动了票房收入、拉动了饮料零食销售，还能促进文化市场的繁荣；家电消费券可以带动上游\n钢铁、塑料、电子元件等行业，同时拉动物流、安装等下游服务业。所以消费券往往能产生远\n超其面值的经济效益，实现政府、商家与消费者的多方共赢，堪称“四两拨千斤”。通过发放消\n费券产生远超其面值的经济效益，说明", "options": {"A": "世界上的万事万物都处于普遍联系之中", "B": "要用联系和发展的眼光把握事物的本质和发展规律", "C": "原因与结果的辩证关系能够指导我们的认识和实践活动", "D": "经济运行的规律是人们在实践中创造的"}, "answer": "ABC"}, {"id": "p1m-43", "num": 43, "type": "multiple", "stem": "钱钟书在《围城》中写道：“天下就没有偶然，那不过是化了妆的、戴了面具的必然。”“偶然\n是化了妆的必然”的哲理在于", "options": {"A": "没有纯粹的偶然", "B": "偶然和必然产生和形成的原因相同", "C": "偶然背后隐藏着必然", "D": "偶然是不存在的"}, "answer": "AC"}, {"id": "p1m-45", "num": 45, "type": "multiple", "stem": "《孙子兵法》中有这样一条法则：“投入亡地然后存，陷入死地而后生。”韩信据此背水一战，\n大败赵军；马谡据此屯兵山上，痛失街亭。这说明", "options": {"A": "只有正确的认识可以反作用于实践", "B": "真理的存在与否依赖于谁掌握它和谁怎样对待它", "C": "具体问题具体分析是解决矛盾的关键", "D": "既要看到矛盾的普遍性，又要重视矛盾的特殊性\n在兆深"}, "answer": "CD"}, {"id": "p1m-46", "num": 46, "type": "multiple", "stem": "古人云：“智者虑事，虽处利地，必思所以害；虽处害地，必思所以利。”从哲学的角度来说，\n这是因为", "options": {"A": "矛盾双方相互依存、相互贯通", "B": "事物的本质是多样易变的", "C": "事物内部的否定方面始终处于优势和支配地位", "D": "辩证法要求全面、发展地看问题"}, "answer": "AD"}, {"id": "p1m-47", "num": 47, "type": "multiple", "stem": "作为全国首个减量发展的超大城市，北京坚持内外发力，以疏为进、以减提质，打开了发展新\n局面。减量发展，腾挪出的是高质量发展新空间。做减法不易，一旦做好，往往事半功倍。这\n就必须看长远、算大账。此前35万平方米的北京动物园服装批发市场，年税收约6000万元，\n转型为国家级金融科技示范区后的第二年，1万平方米能创造税收1.2亿元。再从整体上看北\n京，科技、商务、信息等高精尖产业新设经营主体占比由2013年的40.7%升至2023年的\n66.1%。无论做减法还是做加法，京畿大地上的协同发展如同“结构重塑”,着眼的是大局、是\n整体。以上事例说明", "options": {"A": "减与加并非简单对立，而是辩证统一的", "B": "没有同一性就没有斗争性，同一性在事物发展过程中始终处于主要方面", "C": "坚持系统观念，要把握好全局与局部、当前与长远的关系", "D": "同一内容只能通过一种形式来体现，内容发生了变化则形式也要发生相应的变化"}, "answer": "AC"}, {"id": "p1m-48", "num": 48, "type": "multiple", "stem": "进一步全面深化改革是一项复杂的系统工程。抓好改革落实，既要在全面上下功夫，善于“弹\n钢琴”,使各项改革相互配合、协同高效；也要抓重点、抓关键，善于“牵牛鼻子”,以重点突\n破带动改革整体推进。有的时候要抓大放小、以大兼小，有的时候又要以小带大、小中见大。有\n的时候要统筹兼顾、综合平衡，有的时候又要突出重点、带动全局。上述材料体现的哲学思想有", "options": {"A": "坚持系统思维和全局观念", "B": "坚持事物发展是直线式前进和螺旋式上升相统一的观点", "C": "坚持“两点论”与“重点论”相统一", "D": "坚持在对立中把握统一、在统一中把握对立"}, "answer": "ACD"}, {"id": "p1m-50", "num": 50, "type": "multiple", "stem": "习近平多次强调坚持底线思维，强调“凡事从坏处准备，努力争取最好的结果，这样才能有备\n无患、遇事不慌，牢牢把握主动权”。以下论述体现底线思维的有", "options": {"A": "“守乎其低而得乎其高”", "B": "“备豫不虞，为国常道”", "C": "“明镜所以照形，古事所以知今”", "D": "“不谋全局者，不足谋一域”\n第二章 实践与认识及其发展规律"}, "answer": "AB"}, {"id": "p1m-51", "num": 51, "type": "multiple", "stem": "人的意识是一种精神力量，要使它得到实现，必须通过实践活动。一种活动能否被称为实践活\n动，关键看它是否", "options": {"A": "超出了纯粹的意识活动", "B": "以客观世界作为客体", "C": "改变了除实践主体的意识状态之外的其他存在物的状态", "D": "具有目的性"}, "answer": "AC"}, {"id": "p1m-52", "num": 52, "type": "multiple", "stem": "“元宇宙”作为全球科技领域关注的焦点，正在为产业带来深刻变革，昭示着数字化未来的无\n限可能性。元宇宙到底是什么,目前尚无统一定义。有人认为，元宇宙是平行于现实世界的、\n始终存在的虚拟世界；有人认为，元宇宙是现实世界和虚拟世界的无缝融合；还有人认为，元\n宇宙是对现实世界的一种超越。无论大家在理解上有何不同，从哲学上看，元宇宙", "options": {"A": "是对虚幻世界的摹写与反映", "B": "依然是人的实践活动的产物", "C": "归根到底是现实世界的一种延伸和拓展", "D": "不是一个完全不同于现实世界的“第三世界”"}, "answer": "BCD"}, {"id": "p1m-53", "num": 53, "type": "multiple", "stem": "在戈壁、盐碱地上发展农业，在大海上耕海牧渔，在寒冷的冬季种植反季节蔬菜⋯⋯设施农业\n在一定程度上可以让农业突破对自然条件的依赖。解决吃饭问题，不能光盯着有限的耕地。“向\n设施农业要食物”逐步成为现实：日光温室、植物工厂和集约化畜禽养殖持续发展，陆基和深\n远海养殖渔场建设不断推进，农业生产空间领域正在拓宽。“向设施农业要食物”逐步成为现实\n表明", "options": {"A": "人类智慧和能力的发展决定着对物质资源开发的深度和广度", "B": "实践的发展过程是一个范围不断扩大、程度不断加深、效果不断提升的过程", "C": "实践的需要推动人类的科学发现和技术发明", "D": "自然地理环境不再是人类社会生存和发展必要的条件"}, "answer": "ABC"}, {"id": "p1m-54", "num": 54, "type": "multiple", "stem": "对于无法直接观察到的物质存在形态，如“暗物质”“反物质”等，人们可以通过实验设备观\n察可见物质受到的影响来推断其存在，进而在一定程度上对其加以认识。这说明", "options": {"A": "未知世界是由已知世界派生而来的", "B": "物质这一客观实在是可以被认识的对象", "C": "实践的主体和客体必须依靠中介系统来相互作用", "D": "本质可以直接为人的感官所感知"}, "answer": "BC"}, {"id": "p1m-55", "num": 55, "type": "multiple", "stem": "防灾减灾是事关人民群众生命财产安全的一项重要工作。由于农业灌溉等原因，甘肃黑方台地\n区频繁发生滑坡灾害。为此，长安大学灾害监测预警研究团队在这一地区的地质灾害隐患点布\n设了北斗高精度监测设备。该设备能实时捕捉到毫米级的滑坡位移变化，同时得益于北斗三号\n全球卫星导航系统的组网成功，该监测精度也进一步提高，通过对高精度的滑坡位移监测序列\n进行分析，可以得到滑坡的运动状态，进而分析出滑坡所处的变形阶段，从而发出准确预警。\n利用北斗系统监测滑坡位移变化从而发出滑坡灾害预警，这一事例说明", "options": {"A": "人们已经完全掌握了自然界的运行规律", "B": "实践不仅产生了认识的需要，而且为认识的发展提供了手段", "C": "物质运动总是在一定的时间和空间中进行的", "D": "事物的变化和发展是一个过程"}, "answer": "BCD"}, {"id": "p1m-56", "num": 56, "type": "multiple", "stem": "自然界中只有山川、河流、湖泊等自然物质，并没有火车、飞机、轮船、桥梁、水库等符合人\n需要的现成形式。这些形式的出现，表明了人的认识活动的能动性。辩证唯物主义认识论认为，\n认识是主体在实践基础上对客体的能动反映。这种能动反映的基本特点是", "options": {"A": "慕写性", "B": "创造性", "C": "重复性", "D": "规律性"}, "answer": "AB"}, {"id": "p1m-57", "num": 57, "type": "multiple", "stem": "“高冷”的黑洞，总不缺乏热切的关注目光。对黑洞的好奇和认知，牵引着人类对宇宙“进化”\n的无限好奇。从“恒星葬礼”,到宇宙“巨无霸”,黑洞几乎与宇宙中所有的剧烈爆发事件相\n关，却又因其神秘性让人难以理解。从爱因斯坦的纸笔推演开始，黑洞研究就像一场跨越百年\n的宇宙解谜游戏。在解谜的过程中，技术的发展是人类最大的助力。引力波探测器让我们“听\n声辨位”,捕捉黑洞并合的“时空涟漪”;事件视界望远镜则像一台“宇宙相机”,成功拍下了\n黑洞的“剪影”。黑洞不仅是宇宙的谜题，更是人类探索未知的象征。尽管前路漫漫，但幸运\n的是，我们已经“看见”“听见”了黑洞，在揭开宇宙隐藏奥秘的路上不断前行。人类对黑洞\n的探索历程表明", "options": {"A": "满足人类的好奇心和求知欲是认识的最终目的", "B": "实践为认识发展提供日益先进的工具和手段", "C": "事物的本质总是通过一定的现象表现自己的存在", "D": "世界上只有尚未认识之物，没有不可认识之物"}, "answer": "BCD"}, {"id": "p1m-58", "num": 58, "type": "multiple", "stem": "我国是稀土资源大国，然而现代高科技和新能源发展需要的中重稀土相对稀缺。到哪里去找中\n重稀土矿，成为最大的挑战。传统找矿方法就像大海捞针，往往要花十几年时间。在云南红河\n哈尼族彝族自治州，红土植被覆盖区，中重稀土深藏于地下，传统方法难以识别，而微纳米地\n球化学勘查技术却能“透视”大地，精准揭示其分布规律。在楚雄的山谷中，无人机螺旋桨的\n“嗡嗡”声取代了地质锤的敲击声。算法结合运动恢复结构技术可以高效构建三维地质模型，能\n将陡峭的岩壁、交错的断层转化为可交互的数字场景，协助研究人员识别与分析肉眼难以察觉\n的细节。找矿方法的革命性变革表明", "options": {"A": "先进的认识工具延伸了人类的认识器官，是推动认识发展的强大动力", "B": "只要能观察到大量的现象，就等于把握住了事物的本质和规律", "C": "技术手段可以改变物质固有的联系，使不可见的事物变为可见", "D": "现代科技革命对生产方式产生了深刻影响，也对人的思维方式产生了重要影响"}, "answer": "AD"}, {"id": "p1m-59", "num": 59, "type": "multiple", "stem": "在认识的本质问题上，各种哲学派别有着不同的观点。其中，旧唯物主义认识论的缺陷在于", "options": {"A": "没有坚持从物到感觉和思想的认识路线", "B": "不了解实践对认识的决定作用", "C": "看不到主观和客观之间的矛盾及其相互作用", "D": "没有把认识看作一个不断发展的过程"}, "answer": "BCD"}, {"id": "p1m-60", "num": 60, "type": "multiple", "stem": "马克思主义哲学在批判继承前人认识论成果的基础上，把实践观点引入认识论，把辩证法应用\n于反映论，创立了能动的革命的反映论。马克思主义认识论揭示的认识的辩证过程是", "options": {"A": "从直接经验到间接经验的转化", "B": "从感性认识到理性认识，再从理性认识到实践", "C": "实践、认识、再实践、再认识的循环往复和无限发展", "D": "从抽象到具体再到抽象"}, "answer": "BC"}, {"id": "p1m-61", "num": 61, "type": "multiple", "stem": ",对于同一棵大树，在木匠的眼中是木材，画家看到的是色彩和色调，植物学家看到的是它的形\n态特征，这是由于", "options": {"A": "人的感觉受理性指导", "B": "人的认识具有能动性", "C": "理性认识是感性认识的基础", "D": "已有的认识影响感觉活动"}, "answer": "ABD"}, {"id": "p1m-62", "num": 62, "type": "multiple", "stem": "信息技术迅猛发展，催生了一个信息爆炸、思想奔涌的时代。海量信息以前所未有的速度与密\n度涌入社会认知领域，深度浸润青年一代。如何在纷繁复杂的信息海洋中保持清醒?人们需要\n批判性思维。辩证唯物主义揭示了“实践、认识、再实践、再认识”的螺旋式上升规律，而批\n判性思维正是实现这一认识飞跃的关键枢纽。它要求以实践为标准，不断检验、修正和发展认\n识，防止思想僵化。具备批判性思维的青年，就如同拥有穿透迷雾的“理性之眼”,能够洞察事\n物本质与发展规律，在复杂社会现象前保持头脑冷静，作出明智判断与理性决策。在认识和实\n践活动中，批判性思维体现在", "options": {"A": "对感性材料加以去粗取精、去伪存真", "B": "在认识活动中避免任何非理性因素的作用", "C": "在对现存事物的肯定的理解中同时包含对现存事物的否定的理解", "D": "在实践中不断推翻以往的真理并建立新的真理"}, "answer": "AC"}, {"id": "p1m-63", "num": 63, "type": "multiple", "stem": "面对浩瀚空天，我们的先人认为那里除了点点星光，可能空无一物，因此称之为“太空”。后\n来，人们通过观测工具和实验数据逐渐认识到太空其实并不空，而是充满了等离子体、宇宙射线、\n电磁场等物质，存在各种复杂的物理现象。随着1957年世界上第一颗人造卫星发射成功，人类开\n始进入并利用太空，太空与人类生产生活的关系越发紧密。人类对太空的认识和利用说明", "options": {"A": "人的认识过程是一个在实践基础上不断深化的发展过程", "B": "事物的本质随着人们认识的变化而改变", "C": "一切客观存在的事物都是人们现实的实践客体", "D": "实践的主体、客体和中介是不断变化发展的"}, "answer": "AD"}, {"id": "p1m-64", "num": 64, "type": "multiple", "stem": "为学之实，固在践履。在学习贯彻习近平新时代中国特色社会主义思想主题教育工作会议上，\n习近平总书记对主题教育各项工作作出全面部署，对开展主题教育的总要求作出深刻阐释，其\n中一个方面就是“重实践”。从哲学的角度来看，强调“重实践”是因为", "options": {"A": "从认识到实践的第二次飞跃比实践到认识的第一次飞跃更重要", "B": "理论的威力只有付诸实践才能发挥出来", "C": "学习的成果要靠实践成效来检验", "D": "一个人的多数知识还是来自直接经验"}, "answer": "ABC"}, {"id": "p1m-65", "num": 65, "type": "multiple", "stem": "在我国黄海离岸120多海里的青岛国家深远海绿色养殖试验区，全球第一座全潜式深海渔业养\n殖装备“深蓝1号”近期成功收获我国首批深远海大西洋鲑，这是全球首次低纬度养殖大西洋\n鲑获得丰收，探索出一种可复制的深远海养殖新模式，推动海洋渔业由“近海”走向“深蓝”,\n有利于满足我国居民对海产品“量”的需求和“质”的追求。以上事例说明", "options": {"A": "自然规律起作用的条件是可以通过实践改变的", "B": "任何成功的实践都是真理尺度和价值尺度的统一", "C": "人类主体总是受着目的性和能动性的驱使，要求外部客观世界满足自身的需要", "D": "进行中间实验是实现由认识向实践飞跃所需要的中介环节"}, "answer": "BCD"}, {"id": "p1m-67", "num": 67, "type": "multiple", "stem": "浮力消失、液桥演示、水油分离⋯⋯在中国空间站的“天宫课堂”上，充满奇思妙想的太空实\n验，让科学的种子在亿万青少年的心里生根发芽。为何万里迢迢飞去太空做实验?因为飘浮的\n空间站与地表差别很大，特别是具有地面实验室无法模拟的长期失重环境。在太空微重力条件\n下，我们在地面上的一些“常识”被打破，物质运动的规律发生了很多变化，出现了在地面无\n法观测到的一些奇特现象，这是因为", "options": {"A": "虽然规律是客观的，但真理是主观的", "B": "实践对真理的检验具有相对性、有限性", "C": "现象是多变易逝的，无法直接为人的感官所感知", "D": "任何真理都是在一定范围内、一定条件下才能够成立"}, "answer": "BD"}, {"id": "p1m-68", "num": 68, "type": "multiple", "stem": "诺贝尔经济学奖获得者斯蒂格利茨曾戏盲说：“一个经济学家只有在他的理论被证明是错误的时\n候，才会获得这个奖。”对于真理，以下说法正确的有", "options": {"A": "多数人认同的不一定是真理", "B": "真理是由相对到绝对再到相对的永无止境的过程", "C": "真理在任何条件下都可以转化成谬误", "D": "真理是发展的，具有历史性"}, "answer": "AD"}, {"id": "p1m-69", "num": 69, "type": "multiple", "stem": "毛泽东曾经形象地把真理的绝对性与相对性的关系比喻为“长河”与“河段”“水滴”的关系。\n他说：“马克思主义者承认，在绝对的总的宇宙发展过程中，各个具体过程的发展都是相对的，\n因而在绝对真理的长河中，人们对于在各个一定发展阶段上的具体过程的认识只具有相对的真\n理性。无数相对的真理之总和，就是绝对的真理。”以下说法正确的有", "options": {"A": "任何真理性的认识都是由真理的相对性向绝对性转化过程中的一个环节", "B": "真理的绝对性与相对性根源于认识世界的能力的无限性与有限性、绝对性与相对性的矛盾", "C": "真理的绝对性通过真理的相对性表现出来", "D": "绝对真理和相对真理是对同一真理的不同表述方式"}, "answer": "ABC"}, {"id": "p1m-70", "num": 70, "type": "multiple", "stem": "如何发掘、研究化石，是古生物学研究的重要课题。一块块化石诉说着地球的演变，承载着远\n古的奥秘。过去，挖化石如同“拆盲盒”。如今，在新技术的助力下，古生物学研究正加速破解\n更多生命密码。你能想象吗?一块大小不到4平方厘米的琥珀，能揭示一个热带海岸森林的滨\n海环境。研究人员利用CT扫描技术，重建白垩纪中期一块缅甸克钦琥珀中各类化石的三维图\n像。他们发现，这枚琥珀保存了异常丰富的化石类群，包括1个菊石、4个螺类、4个等足虫、\n23个螨虫、1个蜘蛛、1个马陆和至少12个昆虫，以及一些砂粒、植物碎屑。这为揭示周围\n4平方公里乃至40平方公里的森林生态提供了重要证据。借助新技术，从一块琥珀，可以“看\n见”一片热带森林，这说明人的认识能力", "options": {"A": "以人的感觉器官生理阈限为界限", "B": "是无限性和有限性的统一", "C": "可以通过实践得到锻炼和提高", "D": "随着时代的发展而发展"}, "answer": "BCD"}, {"id": "p1m-71", "num": 71, "type": "multiple", "stem": "习近平强调：“要在全社会积极营造鼓励大胆创新、勇于创新、包容创新的良好氛围，既要重视\n成功，更要宽容失败。”许多重大科技创新，都是在经历一次次失败后最终取得成功。如果整个\n社会只愿为成功喝彩，对失败难以接受，就会压制科技工作者创新的勇气和热情。“既要重视成\n功，更要宽容失败”是因为", "options": {"A": "总结失败的教训，是获得真理、消除谬误的重要途径和方法", "B": "在批判谬误中发展真理，是谬误向真理转化的一种形式", "C": "真理和谬误、成功与失败没有原则界限", "D": "正确的东西总是在同错误的东西作斗争的过程中发展起来的"}, "answer": "ABD"}, {"id": "p1m-72", "num": 72, "type": "multiple", "stem": "在实践检验真理的过程中，逻辑证明", "options": {"A": "能够取代实践作为检验认识真理性的标准", "B": "是对实践标准的一个重要的补充", "C": "是探索和论证真理的方式", "D": "必须服从实践检验的最后结果"}, "answer": "BCD"}, {"id": "p1m-73", "num": 73, "type": "multiple", "stem": "由中国科学院国家天文台等单位科研人员组成的中国脉冲星测时阵列研究团队，利用“中国天\n眼”FAST,探测到了纳赫兹引力波存在的关键性证据，这表明我国纳赫兹引力波研究与国际同\n步达到领先水平。产生纳赫兹引力波是超大质量黑洞并合的独有预言。这个期待已久的预言，\n终于被中国脉冲星测时阵列研究团队通过“中国天眼”获得了观测证据。关于纳赫兹引力波的\n预言得到证实说明", "options": {"A": "实践对真理的检验是人类社会历史的实践对真理的检验", "B": "实践的水平、广度、深度和发展过程，都受着客观条件的制约和客观规律的支配", "C": "正是依靠观测工具等中介系统，实践的主体和客体才能够相互作用", "D": "认识的反复性和无限性决定了客观事物的复杂性"}, "answer": "ABC"}, {"id": "p1m-74", "num": 74, "type": "multiple", "stem": "广西马山县属于典型的喀斯特地貌，石山丛立、土壤瘠薄，产业发展一度十分困难。以前，村\n民们看着大山直犯愁，想的是怎么把山打掉、把石头卖掉。没想到，现在这石头山竟成了“香\n饽饽”。得益于优良的自然岩壁条件以及户外极限运动的逐渐兴起，马山县找到了发展方向。马\n山县下的三甲屯举办了中国东盟攀岩精英赛、中国东盟山地户外体育旅游大会攀岩大师赛等一\n系列国际国内攀岩赛事，马山县攀岩小镇的名声越来越响。从因山而困到建起特色体育小镇，\n从默默无闻到竖起金字招牌，马山县找到了自己的“出路”。石头山变成“香饽饽”体现了", "options": {"A": "价值的社会历史性", "B": "矛盾双方的相互贯通、相互转化", "C": "主观和客观的具体的、历史的统一", "D": "自然地理环境在社会历史发展中的决定作用"}, "answer": "ABC"}, {"id": "p1m-75", "num": 75, "type": "multiple", "stem": "近年来，不少消费者养成了购物下单前先在网络上看“第三方测评”的消费习惯。然而，不少\n“第三方测评”账号本身就经不起测评，不同博主对于同一款商品可能有不同的评价甚至是截然\n相反的结论，同一博主在不同时期测评同类型相关产品时也可能得出不一样的结论。还有一些\n“第三方测评”账号发布的信息并非原创，可信度和科学性有待商榷。因此，消费者要综合比较\n信息的真实性，理性看待商品测评类营销信息。需要理性看待“第三方测评”的结果，是因为", "options": {"A": "主体的需要、特点以及情感、兴趣和爱好等直接影响评价结果", "B": "判断外在客体有无价值，必须明确“是对谁的价值”和“以谁的需要为尺度”", "C": "价值评价有科学与非科学之别，但评价结果没有正确与错误之分", "D": "评价作为一种价值判断活动，是一种主观随意的认识活动"}, "answer": "AB"}, {"id": "p1m-76", "num": 76, "type": "multiple", "stem": "“谷子”是英文单词“goods(商品)”的谐音，泛指由漫画、动画、游戏等领域版权作品衍\n生出来的周边产品，例如徽章、角色立牌、色纸、小挂件等。相关数据显示，2023年中国“谷\n子经济”市场规模1201亿元，2024年迅速飙升至1689亿元，预计2029年整体市场规模有望\n达3089亿元。“谷子经济”火爆的背后蕴藏着青年消费者对优秀动漫、动画等文化作品的认\n同，折射出从“实用”到“情绪价值”的消费需求转变。年轻人情绪消费的崛起并非偶然，其\n本质是物质需求饱和后，精神需求升级的结果。年轻人愿意为“情绪”买单，有收入水平提高\n的原因，也是放松精神、休闲娱乐的现实需要。虽然有人无法理解年轻人对“谷子”的喜爱，\n但也不得不承认，“情绪价值”也是一种价值。从“实用”到“情绪价值”的消费需求转变\n说明", "options": {"A": "价值是一种客观存在，独立于人们对它的认识和评价", "B": "客体能否满足主体需要，是由人的主观愿望决定的", "C": "人们在处理价值关系时，应对客体的价值作全面的考察和理性的选择", "D": "价值直接与主体相联系，始终以主体为中心"}, "answer": "ACD"}, {"id": "p1m-77", "num": 77, "type": "multiple", "stem": "人工影响天气是指用科学手段对局部大气的物理过程进行人工影响，便天气现象朝着人们预定\n的方向转化。人工影响天气可以增雨，但不能凭空造雨、降丽。必须找到有降水潜力的云，有\n水汽输送和上升气流区，然后在合适时机对符合条件的云进行催化剂播撒作业，从而达到增雨\n的目的。除了人工降雨，人工影响天气还可以进行人工防雹、人工消雾、人工防霜等。以上材\n料说明", "options": {"A": "人们在认识自然规律的同时也在改造着自然规律", "B": "正确发挥人的主观能动性需要一定的前提和条件", "C": "人类自身需要的内在尺度推动着人们不断发现新的真理", "D": "任何成功的实践都是合规律性和合目的性的统一"}, "answer": "BCD"}, {"id": "p1m-78", "num": 78, "type": "multiple", "stem": "智能跟车、自动超车、代客泊车⋯⋯如今，能提升驾驶效率和舒适度的辅助驾驶系统，成了很\n多汽车尤其是新能源汽车的标配。这既是科技创新的重要成果，也为汽车产业开辟了新增长点。\n然而，辅助驾驶技术也带来了事故责任认定、数据隐私泄露等风险和问题。因此，各国在推进\n该技术应用时都制定了严格的监管法规。人类审慎发展辅助驾驶技术的原因在于", "options": {"A": "人的实践活动要遵循真理尺度与价值尺度的统一", "B": "新事物依然保留了旧事物中无法适应新条件的因素", "C": "技术应用的社会效果完全取决于研发者的主观意愿", "D": "科学技术有时表现为异己的、敌对的力量"}, "answer": "AD"}, {"id": "p1m-79", "num": 79, "type": "multiple", "stem": "在多地景区，游客们惊喜发现，登山 口因素要受社会生产状况和社会制度的制约"}, "answer": "ACD"}, {"id": "p1m-89", "num": 89, "type": "multiple", "stem": "挖掘“三农”特色，打造“稻田+”产业，可以为游客观光休闲提供新选择。在一些地方，集\n赏稻收、品文化、尝美食、听音乐、做直播于一体的乡村旅游新场景，成为挖掘消费潜力、激\n发乡村市场活力的新引擎。如今的稻田，不仅能长出庄稼，还可以催生美食集市、文创产品小\n店、乡村音乐会等。丰收的不仅是稻谷，还有农耕文化；富了的不仅是农民的口袋，还有农民\n和游客的“脑袋”;强了的不仅是线下的村集体经济，还有线上的直播经济、电商经济。现代文\n旅消费和乡村自然风光的“联姻”,将谱写一曲农文旅深度融合的农业农村现代化之歌。“丰收\n的不仅是稻谷，还有农耕文化”说明", "options": {"A": "在同一条件下对于特定的认识客体的真理性认识不止一个", "B": "社会意识是对以实践为基础的不断变化发展的现实世界的反映", "C": "所有的客观事物对人都具有现实的价值", "D": "精神文化的生产是在物质生产实践基础上产生和发展的\n乌原，多选"}, "answer": "BD"}, {"id": "p1m-90", "num": 90, "type": "multiple", "stem": "创作生产出无愧于这个伟大时代的优秀作品，把最好的精神食粮奉献给人民，是广大文化文艺\n工作者的光荣使命。伴随中国社会发展向前，在深入开掘现实、彰显时代精神的同时，更要勇\n于突破，锐意创新。习近平曾多次引用古文诗句指明文艺创作的方向，例如“文章合为时而著,\n歌诗合为事而作”“诗文随世运，无日不趋新”“文变染乎世惰，兴废系乎时序”等。这些诗句\n蕴含的哲理有", "options": {"A": "社会存在是社会意识内容的客观来源", "B": "社会意识是具体的、历史的", "C": "随着社会存在的发展，社会意识也相应地或迟或早地发生变化和发展", "D": "社会意识始终对社会发展起着积极的促进作用"}, "answer": "ABC"}, {"id": "p1m-91", "num": 91, "type": "multiple", "stem": "近年来，“元宇宙”成为热门话题，越来越频繁地出现在人们的视野里。元宇宙概念的走红，背\n后有着相应的技术支撑和社会生活因素。一方面，经过多年的发展，虚拟现实、人工智能、区\n块链、5G通讯、可穿戴设备等底层技术的应用日渐成熟；另一方面，因为疫情等原因，线上办\n公、线上课程逐渐普及，人们在虚拟空间的停留时间更长，线上生活所占的比例不断升高。在\n一些具体的场景中，人们捕捉到元宇宙可能给生活带来的改变。从在游戏中参加虚拟演唱会，\n到在虚拟空间以虚拟形象参加会议，且会上可以用语音和动作进行实时交互，这些已经成为现\n实的案例，一定程度上打破了虚拟与现实的界限。“元字宙”的出现和发展说明", "options": {"A": "社会意识不再依赖于社会存在", "B": "科学技术日益成为生产发展的决定性因素", "C": "虚拟实践为人的生存与发展提供了多样的自由空间", "D": "人们之间的社会交往是人类最基本的实践活动"}, "answer": "BC"}, {"id": "p1m-92", "num": 92, "type": "multiple", "stem": "社会意识既依赖于社会存在，又有其相对独立性。社会意识的相对独立性表现在", "options": {"A": "社会经济发展水平较高的国家或地区，其社会意识的发展水平未必都更高", "B": "社会意识对社会存在具有能动的反作用", "C": "“经济上落后的国家在哲学上仍然能够演奏第一提琴”", "D": "社会意识内部各种形式之间存在相互影响且各自具有历史继承性"}, "answer": "ABCD"}, {"id": "p1m-93", "num": 93, "type": "multiple", "stem": "马克思说：“手推磨产生的是封建主的社会，蒸汽磨产生的是工业资本家的社会。”这句话说明", "options": {"A": "历史上的各种生产关系都是适应一定的生产力发展需要而产生的", "B": "生产力状况是生产关系形成的客观前提和物质基础", "C": "生产力和生产关系共同组成生产的社会形式", "D": "社会形态更替归根结底是科技进步的结果"}, "answer": "AB"}, {"id": "p1m-94", "num": 94, "type": "multiple", "stem": "习近平总书记在二十届中央政治局第十一次集体学习时强调，要根据科技发展新趋势，优化高\n等学校学科设置、人才培养模式，为发展新质生产力、推动高质量发展培养急需人才。培养更\n高素质的劳动者对于发展新质生产力尤为重要，这是因为", "options": {"A": "在现代生产中，脑力劳动者的质量和数量日益具有决定性的意义", "B": "在高新技术领域，脑力劳动和体力劳动具有相互独立的趋势", "C": "劳动者是生产力中最活跃的因素", "D": "人类智慧和能力的发展决定着对物质资源开发的深度和广度"}, "answer": "ACD"}, {"id": "p1m-95", "num": 95, "type": "multiple", "stem": "以下选项中属于上层建筑的有", "options": {"A": "宗教、哲学", "B": "语言", "C": "道德、艺术", "D": "法庭、监狱"}, "answer": "ACD"}, {"id": "p1m-96", "num": 96, "type": "multiple", "stem": "以下选项中属于观念上层建筑的有", "options": {"A": "政治法律思想", "B": "道德", "C": "艺术", "D": "政党"}, "answer": "ABC"}, {"id": "p1m-97", "num": 97, "type": "multiple", "stem": "恩格斯说，国家“照例是最强大的、在经济上占统治地位的阶级的国家，这个阶级借助于国家\n而在政治上也成为占统治地位的阶级，因而获得了镇压和剥削被压迫阶级的新手段”。国家是", "options": {"A": "一个历史范畴", "B": "阶级矛盾不可调和的产物", "C": "社会存在的核心", "D": "一个阶级统治另一个阶级的工具"}, "answer": "ABD"}, {"id": "p1m-98", "num": 98, "type": "multiple", "stem": "“法与时转则治，治与世宜则有功。”经济社会在不断发展，生活方式在不断变化，社会关系在\n不断调整，调节社会关系的民法也需要与时俱进。2020年5月28日，十三届全国人大三次会\n议通过《中华人民共和国民法典》。这是一部顺应时代发展要求的民法典，对已经不适应现实\n情况的规定进行修改完善，对经济社会生活中出现的新情况、新问题作出有针对性的新规定。\n从哲学上讲，民法典的制定体现的原理是", "options": {"A": "经济基础的变更必然引起上层建筑的变革", "B": "上层建筑一定要适合经济基础状况", "C": "建立在一定经济基础之上的政治法律制度的先进性是衡量社会进步的根本尺度", "D": "上层建筑只要为自己的经济基础服务，就是推动社会发展的进步力量"}, "answer": "AB"}, {"id": "p1m-99", "num": 99, "type": "multiple", "stem": "习近平主席在中国—中亚峰会上的主旨讲话中提到：“2100多年前，中国汉代使者张骞自长安\n出发，出使西域，打开了中国同中亚友好交往的大门。千百年来，中国同中亚各族人民一道推\n动了丝绸之路的兴起和繁荣，为世界文明交流交融、丰富发展作出了历史性贡献。”交往是唯物\n史观的重要范畴，是人类实践活动的重要组成部分。交往对社会生活的重要影响，在于促进", "options": {"A": "生产力的发展", "B": "社会关系的进步", "C": "文化的发展与传播", "D": "人的全面发展"}, "answer": "ABCD"}, {"id": "p1m-100", "num": 100, "type": "multiple", "stem": "今天，人类交往比以往任何时候都更加深入和广泛，国家之间的相互联系和依存比以往任何时\n候都更加频繁和紧密。马克思的世界历史理论为我们观察、分析当今世界发展特别是全球化问\n题提供了科学的理论指导。下列选项内容正确的有", "options": {"A": "生产方式的发展变革是世界历史形成和发展的基础", "B": "普遍交往是世界历史的基本特征", "C": "世界历史的形成与发展为共产主义的实现提供了条件和路径", "D": "没有矛盾的和谐世界是世界历史发展的最终方向"}, "answer": "ABC"}, {"id": "p1m-101", "num": 101, "type": "multiple", "stem": "人的发展程度构成了社会进步的重要标志。唯物史观从社会进步和人的发展的内在联系出发，\n把人的发展从低级到高级依次概括为", "options": {"A": "人的依赖关系占统治地位的阶段", "B": "以物的依赖关系为基础的人的独立性的阶段", "C": "自由个性的阶段", "D": "民主个性的阶段"}, "answer": "ABC"}, {"id": "p1m-103", "num": 103, "type": "multiple", "stem": "“国之称富者、在乎丰民。”共同富裕是社会主义的本质要求，也是中国共产党人的不懈追求。\n习近平指出：“共同富裕是一个长远目标，需要一个过程，不可能一蹴而就，对其长期性、艰\n巨性、复杂性要有充分估计，办好这件事，等不得，也急不得。”从马克思主义哲学的角度来\n说，共同富裕“不可能一蹴而就”是因为", "options": {"A": "任何事物的发展都有一个从量变到质变的过程", "B": "经济社会发展有其自身的客观规律", "C": "生产关系的变革和社会制度的更替会随着生产力的发展自发地实现和完成", "D": "人在社会规律面前是无能为力的"}, "answer": "AB"}, {"id": "p1m-107", "num": 107, "type": "multiple", "stem": "关于人的本质，马克思说，“在其现实性上，它是一切社会关系的总和”。其内涵有", "options": {"A": "人的本质是单个人所固有的抽象物", "B": "人的本质属性是社会属性", "C": "人的本质是自由", "D": "人的本质是变化发展的"}, "answer": "BD"}, {"id": "p1m-110", "num": 110, "type": "multiple", "stem": "从“外卖诗人”王计兵到“沂蒙二姐”吕玉霞，再到由各行各业劳动者构成的东莞新大众文\n艺群体⋯⋯以“素人写作”为代表的新大众文艺现象，展现了这样一个图景——普通人不再只\n是被书写的客体，也是执笔的创作主体。新大众文艺背后的动力，源于时代发展与社会心态的\n共振。王计兵的诗集《赶时间的人》销量破10万册，草根作家单小花的散文《洋芋，洋芋》\n获孙犁散文奖，吕玉霞的“乡土诗歌”在全网获近千万点赞⋯⋯他们的写作沾泥土、带露珠，\n能够引发更多情感共鸣。有评论指出，“素人写作”戳中了某种时代刚需，人们更愿意为身边\n的奋斗鼓掌，更喜欢“同频共振的心跳”。新大众文艺正在回应“何为文学”“谁来书写”的\n时代命题。当建筑工地的敲打声、厨房的翻炒声、键盘的敲击声都成为时代的韵脚，我们见证\n的不仅是文学创作群体的扩容，更是文化活力的激荡。“素人写作”作为新大众文艺现象，其\n产生和走红背后蕴含着深刻的历史唯物主义原理，对此理解正确的有", "options": {"A": "社会存在决定社会意识，普通劳动者的创作源于其真实的生活实践", "B": "人民群众不仅是物质财富的创造者，也是精神文化的创造主体", "C": "社会意识具有相对独立性，优秀的“素人”作品能够反作用于社会存在", "D": "文化发展是社会进步的根本动力，“素人写作”推动了社会形态变革"}, "answer": "ABC"}, {"id": "p1m-111", "num": 111, "type": "multiple", "stem": "习近平指出：“历史充分证明，江山就是人民，人民就是江山，人心向背关系党的生死存亡。”\n这生动体现了我们党对唯物史观的科学认识、对共产党执政规律的深刻把握。如何认识人民群\n众在历史中的作用，是社会历史观的重大问题。唯物史观认为", "options": {"A": "人民群众的总体意愿和行动代表了历史发展的方向", "B": "人民群众的社会实践最终决定历史发展的结局", "C": "杰出人物特别是无产阶级的领袖人物可以改变历史发展的基本方向", "D": "每一个人无论作用大小都是历史的创造者"}, "answer": "AB"}, {"id": "p1m-112", "num": 112, "type": "multiple", "stem": "19世纪英国历史学家托马斯·卡莱尔宣称，世界史“实际上是一部在地球上建立功业的伟大\n人物的历史”。这是一种典型的英雄史观的看法。与之相对的唯物史观则认为", "options": {"A": "历史人物的作用性质取决于他们的思想、行为是否符合社会发展规律，是否符合人民群众\n的意愿", "B": "即使是杰出人物也无法对社会进程产生影响", "C": "任何历史人物的出现都体现了必然性与偶然性的统一", "D": "人人创造历史"}, "answer": "AC"}, {"id": "p1m-113", "num": 113, "type": "multiple", "stem": "唯物史观从人民群众创造历史这一基本前提出发，既明确了人民群众是历史的创造者，也不否\n认个人在历史上的作用。以下说法正确的有", "options": {"A": "剥削阶级的政治代表在任何条件下都起着阻碍历史前进的反动作用", "B": "历史人物有时能够决定个别历史事件的结局", "C": "同一个历史人物在不同的历史时期可能会有不同的历史作用", "D": "历史人物的作用会受到所属阶级的制约\n第四章 资本主义的本质及规律"}, "answer": "BCD"}, {"id": "p1m-114", "num": 114, "type": "multiple", "stem": "马克思指出：“资本主义生产方式占统治地位的社会财富，表现为‘庞大的商品堆积’,单个的\n商品表现为这种财富的元素形式。”商品是", "options": {"A": "用来交换的、能满足人们某种需要的劳动产品", "B": "使用价值和价值的矛盾统一体", "C": "价值和交换价值的矛盾统一体", "D": "伴随人类社会始终的"}, "answer": "AB"}, {"id": "p1m-115", "num": 115, "type": "multiple", "stem": "使用价值不同的商品之所以能按一定比例相交换，就是因为它们都具有价值。商品的价值在质\n上是相同的，因而它们可以相互比较。商品的价值是劳动创造的，其实质是凝结在商品中的无\n差别的一般人类劳动。由此可见", "options": {"A": "商品交换实际上是商品生产者之间相互交换劳动的关系", "B": "商品的价值在本质上体现了生产者之间一定的社会关系", "C": "使用价值寓于价值之中并通过价值表现出来", "D": "劳动是一切社会财富的唯一源泉"}, "answer": "AB"}, {"id": "p1m-116", "num": 116, "type": "multiple", "stem": "以下正确反映商品使用价值、交换价值、价值之间关系的有", "options": {"A": "使用价值是交换价值的物质承担者", "B": "价值是交换价值的基础", "C": "使用价值是商品的价值实体", "D": "交换价值是价值的表现形式"}, "answer": "ABD"}, {"id": "p1m-117", "num": 117, "type": "multiple", "stem": "具体劳动和抽象劳动是同一劳动的两种规定。以下说法正确的有", "options": {"A": "具体劳动创造商品的使用价值，抽象劳动形成商品的价值", "B": "具体劳动反映人与自然的关系，抽象劳动反映商品生产者的社会关系", "C": "具体劳动转移不变资本的价值，抽象劳动转移可变资本的价值", "D": "具体劳动和抽象劳动的矛盾是商品经济其他一切矛盾的基础"}, "answer": "AB"}, {"id": "p1m-119", "num": 119, "type": "multiple", "stem": "劳动生产率指的是劳动者生产使用价值的效率。影响劳动生产率的主要因素有", "options": {"A": "劳动者的平均劳动熟练程度", "B": "科学技术的发展水平及其在生产中的应用程度", "C": "生产过程的社会结合", "D": "生产资料的规模和效能以及自然条件"}, "answer": "ABCD"}, {"id": "p1m-121", "num": 121, "type": "multiple", "stem": "商品的价值形式是不断发展演变的。从历史上看，商品价值形式的发展经历了四个阶段，即简\n单的或偶然的价值形式、总和的或扩大的价值形式、一般价值形式、货币形式。由此可见", "options": {"A": "货币是在长期交换过程中形成的固定充当一般等价物的商品", "B": "货币是商品经济内在矛盾发展的产物", "C": "货币的本质体现一种社会关系", "D": "货币的出现标志着简单商品生产发展到资本主义商品生产的新阶段"}, "answer": "ABC"}, {"id": "p1m-122", "num": 122, "type": "multiple", "stem": "对于价值规律的表现形式，马克思有这样一段描述：“价格和价值量之间的量的不一致的可能\n性，或者价格偏离价值量的可能性，已经包含在价格形式本身中。但这并不是这种形式的缺\n点，相反地，却使这种形式成为这样一种生产方式的适当形式，在这种生产
