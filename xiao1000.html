日三省吾身”(曾子),这属于中国传统道德修养方法中的", "options": {"A": "省察克治", "B": "学思并重", "C": "慎独自律", "D": "积善成德"}, "answer": "A"}, {"id": "p5s-37", "num": 37, "type": "single", "stem": "东汉安帝时，昌邑县令王密为感谢杨震的提聚之恩，夜里怀金十斤馈赠，被杨震拒绝。王密说：\n“暮夜无知者。”杨震答道：“天知，神知，我知，子知。何谓无知!”王密听后“愧而出”。个\n人加强道德修养，应借鉴历史上思想家们所提出的各种积极有效的道德修养方法，并结合当今\n社会发展的需要和当代人道德修养的实践经验，身体力行。这个故事告诉我们，个人加强道德\n修养，要采取", "options": {"A": "学思并重的方法", "B": "省察克治的方法", "C": "慎独自律的方法", "D": "积善成德的方法"}, "answer": "C"}, {"id": "p5s-39", "num": 39, "type": "single", "stem": "法律规范区别于道德规范、纪律规范等其他社会规范的一个重要特征是", "options": {"A": "法律规范具有国家强制性", "B": "法律是统治阶级意志的体现", "C": "法律由社会物质生活条件决定", "D": "法律所体现的统治阶级意志是统治阶级意志的全部"}, "answer": "A"}, {"id": "p5s-41", "num": 41, "type": "single", "stem": "法律的运行是一个从创制、实施到实现的过程。这个过程主要包括法律制定(立法)、法律执行\n(执法)、法律适用(司法)、法律遵守(守法)等环节。法律实施和实现的基本途径是", "options": {"A": "法律制定", "B": "法律遵守", "C": "法律执行", "D": "法律适用"}, "answer": "B"}, {"id": "p5s-42", "num": 42, "type": "single", "stem": "法律运行的关键性(起始性)环节是", "options": {"A": "法律制定", "B": "法律遵守", "C": "法律执行", "D": "法律适用"}, "answer": "A"}, {"id": "p5s-43", "num": 43, "type": "single", "stem": "国家司法机关及其公职人员依照法定职权和程序适用法律处理案件的专门活动，称为", "options": {"A": "法律执行", "B": "法律制裁", "C": "法律遵守", "D": "法律适用"}, "answer": "D"}, {"id": "p5s-44", "num": 44, "type": "single", "stem": "法律的实施包括法律适用和法律执行。其中，狭义上的法律执行的主体是", "options": {"A": "国家司法机关及其公职人员", "B": "国家行政机关及其公职人员", "C": "国家立法机关及其公职人员", "D": "社会团体及其公职人员"}, "answer": "B"}, {"id": "p5s-45", "num": 45, "type": "single", "stem": "推进全面依法治国的根本保证是", "options": {"A": "党的领导", "B": "中国特色社会主义制度", "C": "中国特色社会主义法治理论", "D": "依宪治国、依宪执政"}, "answer": "A"}, {"id": "p5s-46", "num": 46, "type": "single", "stem": "我国的法治同西方资本主义国家的法治最大的区别是", "options": {"A": "坚持党的领导", "B": "坚持以人民为中心", "C": "坚持中国特色社会主义制度", "D": "坚持中国特色社会主义法治理论"}, "answer": "A"}, {"id": "p5s-47", "num": 47, "type": "single", "stem": "全面推进依法治国是一个系统工程，是国家治理领域一场广泛而深刻的革命，涉及立法、执法、\n司法、守法等各个方面，在实际工作中必须有一个总揽全局、牵引各方的总抓手。全面依法治\n国的总抓手是", "options": {"A": "坚持科学立法、严格执法、公正司法、全民守法", "B": "保障和促进社会公平正义", "C": "建设中国特色社会主义法治体系", "D": "坚持依法治国和以德治国相结合"}, "answer": "C"}, {"id": "p5s-48", "num": 48, "type": "single", "stem": "建设中国特色社会主义法治体系，就是在中国共产党领导下，坚持中国特色社会主义制度，贯\n彻中国特色社会主义法治理论，形成完备的法律规范体系、高效的法治实施体系、严密的法治\n监督体系、有力的法治保障体系，形成完善的党内法规体系。其中，建设中国特色社会主义法\n治体系的重点是建设", "options": {"A": "完备的法律规范体系", "B": "高效的法治实施体系", "C": "有力的法治保障体系", "D": "严密的法治监督体系"}, "answer": "B"}, {"id": "p5s-49", "num": 49, "type": "single", "stem": "全面依法治国是国家治理的一场深刻革命，关系党执政兴国，关系人民幸福安康，关系党和国\n家长治久安。推进全面依法治国，根本目的是", "options": {"A": "依法保障人民权益", "B": "加强党对国家的全面领导", "C": "建设法治国家", "D": "保证法律面前人人平等"}, "answer": "A"}, {"id": "p5s-50", "num": 50, "type": "single", "stem": "全面依法治国是一个系统工程，要整体谋划，更加注重系统性、整体性、协同性。推进全面依\n法治国，要坚持依法治国、依法执政、依法行政共同推进，坚持法治国家、法治政府、法治社\n会一体建设。其中，构筑法治国家的基础是", "options": {"A": "法治政府", "B": "依法执政", "C": "法治社会", "D": "依法行政"}, "answer": "C"}, {"id": "p5s-51", "num": 51, "type": "single", "stem": "支持重大改革、护航国家发展，新时代我国立法更具针对性、有效性、可操作性。制定国家安\n全法、香港国安法、网络安全法等，坚决维护国家安全与核心利益，以宪法为统帅的中国特色\n社会主义法律体系不断完善。立法是", "options": {"A": "法治的龙头环节", "B": "法治的生命线", "C": "治国理政的基本方式", "D": "法律实施和实现的基本途径和重要环节"}, "answer": "A"}, {"id": "p5s-52", "num": 52, "type": "single", "stem": "习近平曾指出，要懂得“100-1=0”的道理。一个错案的负面影响，足以摧毁九十九个公平裁\n判积累起来的良好形象。执法司法中万分之一的失误，对当事人就是百分之百的伤害。这说明\n了公正司法的重要性。公正司法是", "options": {"A": "法治社会的基础工程", "B": "法治的龙头环节", "C": "维护社会公平正义的最后一道防线", "D": "维护社会公平正义的决定因素"}, "answer": "C"}, {"id": "p5s-53", "num": 53, "type": "single", "stem": "法治思维是指以法治价值和法治精神为导向，运用法律原则、法律规则、法律方法思考和处理\n问题的思维模式。法治思维以法律原则和法律规则为依据来指导人们的社会行为，这是在强调，\n法治思维是一种", "options": {"A": "正当性思维", "B": "规范思维", "C": "逻辑思维", "D": "底线思维"}, "answer": "B"}, {"id": "p5s-54", "num": 54, "type": "single", "stem": "习近平指出，党纪国法不能成为“橡皮泥”“稻草人”,无论是因为“法盲”导致违纪违法，还\n是故意违规违法，都要受到追究，否则就会形成“破窗效应”。任何人不论权力大小、职位高\n低，只要有违法犯罪行为，就要受到法律制裁，这体现的是法律的", "options": {"A": "普遍适用", "B": "优先适用", "C": "不可违反", "D": "阶级属性"}, "answer": "C"}, {"id": "p5s-55", "num": 55, "type": "single", "stem": "所有国家机关、社会组织和公民个人都必须遵守法律，依法享有和行使法定职权与权利，承担\n和履行法定职与义务，这体现的是法律的", "options": {"A": "不可违反", "B": "优先适用", "C": "权力制约", "D": "普遍适用"}, "answer": "D"}, {"id": "p5s-57", "num": 57, "type": "single", "stem": "《中华人民共和国民法典》是新中国成立以来第一部以“法典”命名的法律，被誉为“保障民\n事权利的宣言书”。权利保障主要是指对公民权利的法律保障，具体包括公民权利的宪法保障、\n立法保障、行政保障和司法保障。权利保障的关键环节是", "options": {"A": "宪法保障", "B": "立法保障", "C": "行政保障", "D": "司法保障"}, "answer": "C"}, {"id": "p5s-58", "num": 58, "type": "single", "stem": "程序正当是法治思维的基本内容之一。程序的正当，表现在程序的合法性、中立性、参与性、\n公开性、时限性等方面。正义不应缺席，也不应迟到，迟到的正义是有瑕疵的正义。这实际上\n指的是程序必须具有", "options": {"A": "中立性", "B": "参与性", "C": "公开性", "D": "时限性"}, "answer": "D"}, {"id": "p5s-59", "num": 59, "type": "single", "stem": "按照程序做事情，才能防止主观任性、无序混乱。程序运行合乎法律的规定，有关机关或个人\n不得违反或变相违反，这是程序的", "options": {"A": "中立性", "B": "公开性", "C": "参与性", "D": "合法性"}, "answer": "D"}, {"id": "p5s-60", "num": 60, "type": "single", "stem": "马克思主义权利观与其他权利观的根本区别在于", "options": {"A": "强调社会的物质生活条件对权利的制约和决定作用", "B": "强调公民的权利和义务是平等的", "C": "强调公民的权利和义务是统一的", "D": "强调权利和义务关系是社会关系的核心部分"}, "answer": "A"}, {"id": "p5s-61", "num": 61, "type": "single", "stem": "法律权利是指由一定的社会物质生活条件所制约的行为自由，是法律所允许的权利人为了满足\n自己的利益而采取的、由其他人的法律义务所保障的法律手段。法律权利区别于其他权利的根\n本所在是", "options": {"A": "受社会物质生活条件的制约", "B": "由国家强制力保障其实现", "C": "源于现实需要", "D": "随着历史的发展变化而变化"}, "answer": "B"}, {"id": "p5s-62", "num": 62, "type": "single", "stem": "我国《立法法》明文规定，限制公民人身和财产权利的法律必须由国家立法机关制定，行政机\n关即政府不得制定限制公民人身或财产权利的法规。党的十八届四中全会决定指出，行政机关\n要“坚持法无授权不得为”,不得通过行政法规减损公民的权利。这体现的法律义务的特点是", "options": {"A": "法律义务是历史的", "B": "法律义务源于现实需要", "C": "法律义务必须依法设定", "D": "法律义务可能发生变化"}, "answer": "C"}, {"id": "p5s-63", "num": 63, "type": "single", "stem": "我国宪法法律规定了公民享有一系列权利，主要包括政治权利、宗教信仰自由、人身权利、财\n产权利、社会经济权利及文化教育权利等。公民参加国家政治、经济与社会生活的基础是", "options": {"A": "表达权利", "B": "人身权利", "C": "社会经济权利", "D": "文化教育权利"}, "answer": "B"}, {"id": "p5s-65", "num": 65, "type": "single", "stem": "我国宪法法律规定了公民享有一系列权利。人享有其他各项权利的前提是", "options": {"A": "生命权", "B": "健康权", "C": "人身自由权", "D": "人格尊严权"}, "answer": "A"}, {"id": "p5s-66", "num": 66, "type": "single", "stem": ",“法律既不是铭刻在大理石上，也不是铭刻在铜表上，而是铭刻在公民们的内心里。”卢梭这句\n话强调的是", "options": {"A": "法律必须被信仰，否则形同虚设", "B": "要用实际行动保障法律实施", "C": "应当拥护法律的规定，接受法律的约束", "D": "对违法犯罪行为要敢于揭露、敢于抵制"}, "answer": "A"}]}, {"id": "p5m", "title": "第五部分 思法 · 多选", "part": 5, "type": "multiple", "questions": [{"id": "p5m-11", "num": 11, "type": "multiple", "stem": "比较客观、公正、准确地评价社会成员人生价值的大小，除了要掌握科学的标准外、还需要掌\n握恰当的评价方法，坚持", "options": {"A": "既要看贡献的大小，也要看尽力的程度", "B": "既要尊重物质贡献，也要尊重精神贡献", "C": "既要注重社会贡献，也要注重自身完善", "D": "既要注重社会地位，也要注重社会影响"}, "answer": "ABC"}, {"id": "p5m-12", "num": 12, "type": "multiple", "stem": "“文王拘而演《周易》;仲尼厄而作《春秋》;屈原放逐，乃赋《离骚》;左丘失明，厥有《国\n语》;孙子膑脚，《兵法》修列；不韦迁蜀，世传《吕览》;韩非囚秦，《说难》《孤愤》;《诗》\n三百篇，大底圣贤发愤之所为作也。”司马迁这段话对我们辩证对待人生矛盾，树立正确顺逆观\n的启发有", "options": {"A": "顺境和逆境是人生历程中两种不同的境遇", "B": "在人生旅途中没有永远的顺境，也没有永远的逆境", "C": "受磨难而奋进，这是身处逆境的学问", "D": "有多少逆境，就会有多少顺境"}, "answer": "ABC"}, {"id": "p5m-13", "num": 13, "type": "multiple", "stem": "辩证对待人生矛盾，要树立正确的荣辱观。中国古人向来注重荣与辱。以下名言体现出中国古\n人注重荣与辱的有", "options": {"A": "“知耻近乎勇”", "B": "“无羞恶之心，非人也”", "C": "“礼义廉耻，国之四维”", "D": "“舍生取义”\n第二章 追求远大理想 坚定崇高信念"}, "answer": "ABC"}, {"id": "p5m-14", "num": 14, "type": "multiple", "stem": "漫漫人生，唯有激流勇进、奋力拼搏，方能中流击水，抵达理想的彼岸。科学的理想信念，既\n是指引人们穿越迷雾、辨识航向的灯塔，也是激励人们乘风破浪、搏击沧海的风帆。以下关于\n理想信念表述正确的有", "options": {"A": "理想和信念都是人类特有的精神现象", "B": "理想是信念所指的对象，信念是理想实现的保障", "C": "理想信念不是思想认识问题，而是一个实践问题", "D": "理想和信念总是相互依存"}, "answer": "ABD"}, {"id": "p5m-15", "num": 15, "type": "multiple", "stem": "理想是人们在实践中形成的、有实现可能性的、对未来社会和自身发展目标的向往与追求，是\n人们的世界观、人生观和价值观在奋斗目标上的集中体现。关于理想，以下内容正确的选项有", "options": {"A": "理想具有实践性", "B": "理想受时代条件的制约", "C": "理想源于现实，又超越现实", "D": "理想具有时代性"}, "answer": "ABCD"}, {"id": "p5m-16", "num": 16, "type": "multiple", "stem": "信念是人们在一定的认识基础上确立的对某种思想或事物坚信不疑并身体力行的精神状态。以\n下选项内容正确的有", "options": {"A": "信念是认知、情感和意志的有机统一体", "B": "信念具有不同的层次和类型", "C": "信念是最高层次的信仰", "D": "信念一旦形成就不会轻易改变"}, "answer": "ABD"}, {"id": "p5m-17", "num": 17, "type": "multiple", "stem": "习近平总书记在上海瞻仰中共一大代表群像浮雕时，曾对着浮雕——列数中共一大13名代表的\n姓名，感叹英雄辈出，也感叹大浪淘沙。个人坚守理想信念力量的强弱决定着人生命运的方向。\n理想信念的作用和意义在于", "options": {"A": "昭示奋斗目标", "B": "催生前进动力", "C": "提供精神支柱", "D": "提高精神境界"}, "answer": "ABCD"}, {"id": "p5m-18", "num": 18, "type": "multiple", "stem": "在追求理想的过程中，人们常常会感受到理想与现实之间的矛盾。因此，正确认识理想与现实\n的关系，是追求理想的过程中必须解决的问题。理想与现实的关系是", "options": {"A": "理想与现实之间的矛盾与冲突属于“应然”和“实然”的矛盾", "B": "理想受现实的规定和制约，是在对现实认识的基础上发展起来的", "C": "现实中包含着理想的因素，理想中也包含着现实", "D": "在一定条件下，理想可以转化为未来的现实"}, "answer": "ABCD"}, {"id": "p5m-19", "num": 19, "type": "multiple", "stem": "习近平在国家勋章和国家荣誉称号颁授仪式上的讲话中强调，要胸怀强国之志，以国家富强为\n念，以人民幸福为盼，忠心爱国、矢志报国，把个人小我融入国家大我，在为国尽责、为民服\n务中实现个人价值、展现人生风采。在整个理想体系中，社会理想是最根本、最重要的，而个\n人理想则从属于社会理想。这是因为", "options": {"A": "个人理想的确立要以社会理想为导向", "B": "个人理想的实现依赖于社会理想的指引", "C": "从根本上说个人理想是由社会理想规定的", "D": "社会理想是个人理想的叠加"}, "answer": "ABC"}, {"id": "p5m-20", "num": 20, "type": "multiple", "stem": "习近平在纪念周恩来同志诞辰120周年座谈会上的讲话中深切缅怀了周恩来为党、人民、国家\n和人民军队建立的卓著功勋，并指出，青少年时期的周恩来，面对国家危难和人民困苦，决心\n“为了中华之崛起”而读书，誓言“险夷不变应尝胆，道义争担敢息肩”,立下“面壁十年图破\n壁”的远大志向。周恩来的光辉一生启示我们", "options": {"A": "立鸿鹄志，做奋斗者", "B": "青年时期是理想形成的重要时期，也是立志的关键阶段", "C": "青年要以国家民族的命运为己任，而不要以个人的荣华富贵为人生的理想", "D": "心怀“国之大者”,敢于担当\n第三章 继承优良传统 弘扬中国精神"}, "answer": "ABCD"}, {"id": "p5m-21", "num": 21, "type": "multiple", "stem": "中华民族在5000多年的历史进程中，不仅创造出光辉灿烂、享誉世界的中华文明，也塑造出独\n特的精神气质和精神品格，形成了崇尚精神的优秀传统。中华民族崇尚精神的优秀传统表现为", "options": {"A": "对物质生活与精神生活相互关系的独到理解", "B": "对理想的不懈追求", "C": "对品格养成的重视", "D": "对法治精神的推崇"}, "answer": "ABC"}, {"id": "p5m-22", "num": 22, "type": "multiple", "stem": "在几千年的历史进程中，中国人民用勤劳和智慧书写了辉煌的中华历史，也培育铸就了独特的\n中国精神，为中国发展和人类文明进步提供了强大的精神动力。中国精神的内涵是", "options": {"A": "伟大创造精神", "B": "伟大奋斗精神", "C": "伟大团结精神", "D": "伟大梦想精神"}, "answer": "ABCD"}, {"id": "p5m-23", "num": 23, "type": "multiple", "stem": "中国精神是兴国强国之魂，是", "options": {"A": "推进复兴伟业的精神支柱", "B": "凝聚中国力量的精神纽带", "C": "激发创新创造的精神动力", "D": "政治文明建设的重要内容"}, "answer": "ABC"}, {"id": "p5m-24", "num": 24, "type": "multiple", "stem": "从“把我们的血肉，筑成我们新的长城”,到“这是英雄的祖国，是我生长的地方”,再到“我\n和我的祖国，一刻也不能分割”,这些歌声激励着中国人民百折不挠向前进的壮丽征程，也激荡\n着当代中国强国复兴的澎湃动力。历史的天空里，家国情怀的光芒熠熠生辉；时间的长河中，\n家国情怀的源流绵绵不断。爱国主义是", "options": {"A": "中华民族的民族心、民族魂", "B": "中华民族最重要的精神财富", "C": "调节个人与祖国之间关系的道德要求、政治原则和法律规范", "D": "中国人民和中华民族维护民族独立和民族尊严的强大精神动力"}, "answer": "ABCD"}, {"id": "p5m-25", "num": 25, "type": "multiple", "stem": "中华民族有着源远流长的爱国主义传统。以下关于爱国主义说法正确的有", "options": {"A": "爱国主义揭示了个人对祖国的依存关系", "B": "爱国主义是具体的", "C": "爱国主义是永恒的", "D": "爱国主义是现实的"}, "answer": "ABD"}, {"id": "p5m-26", "num": 26, "type": "multiple", "stem": "爱国主义的基本内涵是", "options": {"A": "爱祖国的大好河山", "B": "爱自己的骨肉同胞", "C": "爱祖国的灿烂文化、爱自己的国家", "D": "爱社会主义"}, "answer": "ABC"}, {"id": "p5m-27", "num": 27, "type": "multiple", "stem": "“河山只在我梦萦⋯⋯长江长城，黄山黄河，在我心中重千斤。”这一首歌体现了人们对祖国大\n好河山的热爱之情。爱祖国的大好河山是爱国主义的基本内涵之一，这是因为", "options": {"A": "祖国的河山在人们的心中占据着至高无上的地位", "B": "祖国的山山水水滋养哺育着她的子子孙孙", "C": "祖国的大好河山是自然风光，更是主权、财富、民族发展和进步的基本载体", "D": "祖国的大好河山是涵养民族心理、民族个性、民族精神的摇篮"}, "answer": "ABC"}, {"id": "p5m-28", "num": 28, "type": "multiple", "stem": "2023年10月24日，第十四届全国人大常委会第六次会议表决通过了《中华人民共和国爱国主\n义教育法》,自2024年1月1日起施行。制定该法的目的是加强新时代爱国主义教育，传承和\n弘扬爱国主义精神，凝聚全面建设社会主义现代化国家、全面推进中华民族伟大复兴的磅礴力\n量。爱国主义是中华民族精神的核心。中国特色社会主义进入新时代，实现中华民族伟大复兴\n的中国梦是新时代爱国主义的鲜明主题。大力弘扬新时代爱国主义，必须", "options": {"A": "坚持爱国爱党爱社会主义相统一", "B": "维护祖国统一和民族团结", "C": "尊重和传承中华民族历史文化", "D": "坚持立足中国又面向世界"}, "answer": "ABCD"}, {"id": "p5m-31", "num": 31, "type": "multiple", "stem": "人类社会发展的历史表明，对一个民族、一个国家来说，最持久、最深沉的力量是全社会共同\n认可的核心价值观。核心价值观", "options": {"A": "承载着一个民族、一个国家的精神追求", "B": "体现着一个社会评判是非曲直的价值标准", "C": "是一定社会形态、社会性质的集中体现，在整个上层建筑中处于主导地位", "D": "体现着社会制度的阶级属性、社会运行的基本原则和社会发展的基本方向"}, "answer": "ABD"}, {"id": "p5m-32", "num": 32, "type": "multiple", "stem": "社会主义核心价值观", "options": {"A": "是当代中国精神的集中体现", "B": "凝结着全体人民共同的价值追求", "C": "集中体现社会主义的本质属性", "D": "是整个上层建筑的核心"}, "answer": "ABC"}, {"id": "p5m-33", "num": 33, "type": "multiple", "stem": "社会主义核心价值观的基本内容是富强、民主、文明、和谐，自由、平等、公正、法治，爱国、\n敬业、诚信、友善。自由、平等、公正、法治回答了建设什么样的社会的重大问题，与实现国\n家治理体系和治理能力现代化的要求相契合，揭示了社会主义社会发展的价值取向。以下选项\n内容正确的有", "options": {"A": "自由是社会活力之源，是社会主义的价值理想", "B": "平等是人类追求的普世价值", "C": "公正是人类社会进步的标尺，是社会主义制度的本质要求", "D": "法治是人类政治文明的重要成果，是现代社会的主要特征"}, "answer": "ACD"}, {"id": "p5m-34", "num": 34, "type": "multiple", "stem": "国家艺术基金资助项目、新编历史晋剧《日昇昌票号》里有这样的情节：当饥寒交迫的魏老太\n拿着被水浸过的汇票来兑银子，伙计难辨数额怎么办?日昇昌票号大掌柜雷履泰责人详查账目\n底簿，当机立断，兑!当伙计忽略差价少给客商兑了七两八钱银子怎么办?雷履泰斩钉截铁，\n补齐!正是靠着这种诚信精神，日昇昌票号实现了分号遍布全国几十个城市、商埠重镇，以\n“汇通天下”著称于世。诚信是社会主义核心价值观的重要内容，是", "options": {"A": "个人立身处世的基本价值规范", "B": "社会存续发展的重要价值基石", "C": "社会主义职业道德的基本规范之一", "D": "中华传统美德的根本要求"}, "answer": "ABC"}, {"id": "p5m-35", "num": 35, "type": "multiple", "stem": "社会主义核心价值观与社会主义核心价值体系具有内在的一致性，两者", "options": {"A": "都体现了社会主义意识形态的本质要求", "B": "都体现了社会主义制度在思想和精神层面的质的规定性", "C": "都把涉及国家、社会、公民的价值要求融为一体", "D": "都是全面建成社会主义现代化强国、实现第二个百年奋斗目标的价值引领"}, "answer": "ABD"}, {"id": "p5m-36", "num": 36, "type": "multiple", "stem": "爱国、敬业、诚信、友善，这一价值追求回答了我们要培育什么样的公民的重大问题，是每一\n个公民都应当遵守的价值规范。爱国、敬业、诚信、友善，涵盖了", "options": {"A": "社会公德", "B": "职业道德", "C": "家庭美德", "D": "个人品德"}, "answer": "ABCD"}, {"id": "p5m-37", "num": 37, "type": "multiple", "stem": "真理的力量加上道义的力量，才能行之久远。社会主义核心价值观站在人类道义制高点，彰显\n出独特而强大的价值观优势。因为社会主义核心价值观具有", "options": {"A": "先进性", "B": "人民性", "C": "普适性", "D": "真实性"}, "answer": "ABD"}, {"id": "p5m-38", "num": 38, "type": "multiple", "stem": "社会主义核心价值观具有超越以往一切社会核心价值观的先进性。社会主义核心价值观", "options": {"A": "体现社会主义的本质属性", "B": "扎根中华优秀传统文化土壤", "C": "吸纳世界文明有益成果", "D": "是反映人类社会发展进步的价值理念"}, "answer": "ABCD"}, {"id": "p5m-39", "num": 39, "type": "multiple", "stem": "2014年5月4日，习近平在北京大学考察时提出，青年时期的价值观养成十分重要，“人生的\n扣子从一开始就要扣好。”2019年3月18日，习近平在学校思想政治理论课教师座谈会上再次\n强调，要给学生心灵埋下真善美的种子，引导学生扣好人生第一粒扣子。习近平之所以反复强\n调要扣好人生第一粒扣子，是因为", "options": {"A": "有什么样的价值观就有什么样的人生观，而人生观又决定世界观", "B": "青年的价值取向决定着未来整个社会的价值取向", "C": "青年人成长成才和全面发展离不开正确价值观的引领", "D": "青年处在价值观形成和确立的时期，最需要精心引导和栽培\n第五章 遵守道德规范 锤炼道德品格"}, "answer": "BCD"}, {"id": "p5m-40", "num": 40, "type": "multiple", "stem": "马克思主义道德观是科学世界观、人生观、价值观在道德领域的反映与体现。下列观点符合马\n克思主义道德观的有", "options": {"A": "劳动是道德起源的首要前提", "B": "道德是人们为实现情感欲望而形成的行为要求", "C": "道德是适应社会关系尤其是利益关系调节的需要而产生的", "D": "道德观念是动物本能的延续"}, "answer": "AC"}, {"id": "p5m-41", "num": 41, "type": "multiple", "stem": "马克思主义在人类思想史上第一次科学而全面地论述了道德的起源问题，为正确认识和理解道\n德的本质奠定了基础。以下说法正确的有", "options": {"A": "道德是一种特殊的社会意识形态", "B": "道德在阶级社会里不可避免地具有阶级性", "C": "不同阶级之间的道德是完全不同的", "D": "道德是社会利益关系的特殊调节方式"}, "answer": "ABD"}, {"id": "p5m-42", "num": 42, "type": "multiple", "stem": "作为社会意识的道德一经产生，便有相对独立性。这种相对独立性表现为", "options": {"A": "道德的历史继承性", "B": "道德对社会发展具有能动的反作用", "C": "在阶级社会里道德具有阶级性", "D": "道德随着社会经济关系的变化而变化"}, "answer": "AB"}, {"id": "p5m-43", "num": 43, "type": "multiple", "stem": "道德属于上层建筑的范畴，是一种特殊的社会意识形态。道德以善恶为评价方式，发挥作用主\n要是依靠", "options": {"A": "社会舆论", "B": "传统习俗", "C": "内心信念", "D": "国家强制"}, "answer": "ABC"}, {"id": "p5m-44", "num": 44, "type": "multiple", "stem": "道德的功能，一般是指道德作为社会意识的特殊形式对于社会发展所具有的功效与作用。在道\n德的功能系统中，最基本的功能是", "options": {"A": "认识功能", "B": "规范功能", "C": "调节功能", "D": "表达功能"}, "answer": "ABC"}, {"id": "p5m-45", "num": 45, "type": "multiple", "stem": "道德功能的发挥和实现所产生的社会影响及实际效果，就是道德的作用。道德的作用主要表现在", "options": {"A": "巩固特定社会的经济基础和上层建筑", "B": "提高人的精神境界", "C": "促进人的自我完善", "D": "推动人的全面发展"}, "answer": "ABCD"}, {"id": "p5m-46", "num": 46, "type": "multiple", "stem": "道德功能的发挥和实现所产生的社会影响及实际效果，就是道德的作用。道德", "options": {"A": "是维系社会稳定、促进国家发展的重要因素", "B": "是激励人们改造客观世界和主观世界的一种精神力量", "C": "在本质上是知行合一的", "D": "对社会的发展和人的素质的提高总是起着积极的推动作用"}, "answer": "ABC"}, {"id": "p5m-47", "num": 47, "type": "multiple", "stem": "与以往社会的道德形态相比，社会主义道德具有显著的先进性特征。这种先进性主要体现在，\n社会主义道德", "options": {"A": "是社会主义经济基础的反映", "B": "是对人类优秀道德资源的批判继承和创新发展", "C": "克服了以往阶级社会道德的片面性和局限性", "D": "是调节社会一切行为规范的准则"}, "answer": "ABC"}, {"id": "p5m-48", "num": 48, "type": "multiple", "stem": "1949年春，毛泽东在宴请九三学社的朋友时说，“我和各位都是新中国的‘长工’,我们的主人\n是谁呢?不是地主老财或资本家，而是人民，四万万五千万中国人民，我们要全心全意为他们\n服务!”全心全意为人民服务是", "options": {"A": "贯穿中国革命道德始终的一根红线", "B": "社会主义道德观的集中体现", "C": "社会主义道德的原则", "D": "先进性要求和广泛性要求的统一"}, "answer": "ABD"}, {"id": "p5m-49", "num": 49, "type": "multiple", "stem": "马克思说：“我们知道个人是微弱的，但是我们也知道整体就是力量。”在我国革命、建设、改\n革的历程中，在我国抗疫、抗震、抗灾等斗争中，集体主义从未缺席。长期以来，集体主义已\n经成为调节国家利益、社会整体利益和个人利益关系的基本原则。集体主义", "options": {"A": "强调国家利益、社会整体利益和个人利益的辩证统一", "B": "强调国家利益、社会整体利益高于个人利益", "C": "强调抑制个人利益来发展国家利益、社会整体利益", "D": "重视和保障个人的正当利益"}, "answer": "ABD"}, {"id": "p5m-50", "num": 50, "type": "multiple", "stem": "根据我国现阶段经济社会生活和人们思想道德的实际，对公民最基本的集体主义的道德要求是", "options": {"A": "无私奉献、一心为公", "B": "先公后私、先人后己", "C": "顾全大局、遵纪守法", "D": "热爱祖国、诚实劳动"}, "answer": "CD"}, {"id": "p5m-51", "num": 51, "type": "multiple", "stem": "加强社会主义道德建设必须吸收借鉴优秀道德成果，传承中华传统美德。中华传统美德", "options": {"A": "是中华文化的精髓", "B": "蕴含着丰富的思想道德资源", "C": "是社会主义道德建设的源头活水", "D": "是人类文明发展的重要精神财富"}, "answer": "ABCD"}, {"id": "p5m-52", "num": 52, "type": "multiple", "stem": "2024年10月，习近平在福建省漳州市东山县考察时，来到谷文昌纪念馆，强调“学习谷文昌\n同志，不仅要高山仰止，还要见贤思齐，像他那样做人、为政”。“见贤思齐”是中华传统美德\n中强调道德修养，注重道德践履的体现。中国古代的思想家大都认为，在修身养性的过程中，\n最重要的就是要使社会的道德原则和规范转换为自身的思想品德和行为实践，通过切磋践履不\n断养成良好的道德习惯，形成完善的道德人格。以下选项中，体现了中华传统美德强调道德修\n养，注重道德践履的有", "options": {"A": "“修已”“克已”和“慎独”", "B": "“善养吾浩然之气”", "C": "“明于庶物，察于人伦”", "D": "“察色修身”"}, "answer": "ABD"}, {"id": "p5m-53", "num": 53, "type": "multiple", "stem": "2024年10月17日，习近平来到安徽省安庆桐城市考察。地处城中的六尺巷，因清代大学士张\n英与邻居吴家互相退让三尺地基而成，是中国邻里和谐礼让的典范。习近平指出，人民内部矛\n盾要用调解的办法解决。六尺巷体现了先人化解矛盾的历史智慧，要作为弘扬中华优秀传统文\n化的教育场所，发挥好中华民族讲求礼让、以和为贵传统美德的作用，营造安居乐业的和谐社\n会环境。推崇仁爱、崇尚和谐是中华民族的优良传统和高尚品德。以下选项中，体现了中华传\n统美德推崇仁爱原则，注重以和为贵的有", "options": {"A": "“已欲立而立人，己欲达而达人”", "B": "“亲亲而仁民，仁民而爱物”", "C": "“仁、义、礼、智、信”", "D": "“兼相爱，交相利”"}, "answer": "ABD"}, {"id": "p5m-54", "num": 54, "type": "multiple", "stem": "中国革命道德内容丰富、历久弥新，是中国共产党领导全体人民实现民族独立、人民解放的精\n神支撑，对于我们走好新时代的长征路，实现中华民族伟大复兴仍然具有极其重要的现实意义。\n中国革命道德的当代价值在于，发扬革命道德、传承红色基因，有利于", "options": {"A": "加强和巩固社会主义和共产主义的理想信念", "B": "培育和践行社会主义核心价值观", "C": "引导人们树立正确的道德观", "D": "培育良好的社会道德风尚"}, "answer": "ABCD"}, {"id": "p5m-55", "num": 55, "type": "multiple", "stem": "中国特色社会主义进入新时代，加强公民道德建设、提高全社会道德水平，具有十分重要的意\n义。新时代加强公民道德建设，作为着力点的是", "options": {"A": "社会公德建设", "B": "职业道德建设", "C": "家庭美德建设", "D": "个人品德建设"}, "answer": "ABCD"}, {"id": "p5m-56", "num": 56, "type": "multiple", "stem": "新时代公民道德建设的重点任务是", "options": {"A": "筑牢理想信念之基", "B": "培育和践行社会主义核心价值观", "C": "传承中华传统美德", "D": "弘扬民族精神和时代精神"}, "answer": "ABCD"}, {"id": "p5m-57", "num": 57, "type": "multiple", "stem": "当代公共生活的特征主要表现在", "options": {"A": "活动范围的广泛性", "B": "活动内容的开放性", "C": "交往对象的复杂性", "D": "活动方式的多样性"}, "answer": "ABCD"}, {"id": "p5m-58", "num": 58, "type": "multiple", "stem": "网络空间同现实社会一样，既要提倡自由，也要保持秩序。公共生活需要公共秩序，有序的公\n共生活是", "options": {"A": "调整和规范人际关系的行为准则", "B": "社会生产活动的重要基础", "C": "提高社会成员生活质量的基本保障", "D": "社会文明的重要标志"}, "answer": "BCD"}, {"id": "p5m-59", "num": 59, "type": "multiple", "stem": "公共生活中的道德规范即社会公德。以下对社会公德理解正确的有", "options": {"A": "社会公德是指人们在社会交往和公共生活中应该遵守的行为准则", "B": "遵纪守法是全体公民都必须遵循的基本行为准则", "C": "社会公德是维护公共利益、公共秩序、社会和谐稳定的起码的道德要求", "D": "社会公德的最高层次的要求是奉献社会"}, "answer": "ABC"}, {"id": "p5m-61", "num": 61, "type": "multiple", "stem": "“人与人交往在于盲而有信，国与国相处讲究诚信为本。”诚实守信在我国思想道德建设中具有\n特殊重要的作用。诚实守信是", "options": {"A": "中华民族的传统美德", "B": "我国公民道德建设的重点", "C": "社会主义道德的核心", "D": "社会主义核心价值观的一条重要准则"}, "answer": "ABD"}, {"id": "p5m-62", "num": 62, "type": "multiple", "stem": "职业道德中的诚实守信，要求从业者在职业活动中", "options": {"A": "诚实劳动", "B": "合法经营", "C": "信守承诺", "D": "讲求信誉"}, "answer": "ABCD"}, {"id": "p5m-63", "num": 63, "type": "multiple", "stem": "“怒发冲冠，凭栏处、潇潇雨歇。”抗金名将岳飞留给我们的，除了气吞山河的壮烈，莫须冤死\n的悲戚，还有一段精忠报国的热血家训。习近平曾多次讲过岳母刺字的故事，强调家风是社会\n风气的重要组成部分，父母应引导孩子成为对国家和人民有用的人。之所以要注重家教、家风，\n是因为", "options": {"A": "家庭是人生的第一个课堂，父母是孩子的第一任老师", "B": "良好的家风，对家庭成员的个人修养产生着重要的作用", "C": "良好的家风，对整个社会道德风尚的形成产生着重要的影响", "D": "家教是新时代公民道德建设的重点任务"}, "answer": "ABC"}, {"id": "p5m-64", "num": 64, "type": "multiple", "stem": "为深入学习贯彻习近平总书记关于注重家庭家教家风建设的重要论述，中央宣传部、全国妇联\n于2026年5月向全社会发布2026年“最美家庭”,10户家庭光荣入选2026年“最美家庭”。\n家是最小国，国是千万家，家庭的命运同国家和民族的前途命运紧密相连，要以“最美家庭”\n为榜样，大力弘扬社会主义家庭文明新风尚。社会主义家庭文明新风尚的内容是", "options": {"A": "爱国爱家", "B": "相亲相爱", "C": "向上向善", "D": "共建共享"}, "answer": "ABCD"}, {"id": "p5m-65", "num": 65, "type": "multiple", "stem": "在2025年五四青年节到来之际，习近平给新疆克孜勒苏柯尔克孜自治州阿图什市哈拉峻乡谢依\n特小学戍边支教西部计划志愿者服务队全体队员回信。回信指出，这些年，越来越多年轻人选\n择到西部、到乡村、到基层志愿服务，无私奉献，展现了新时代中国青年昂扬向上的精神风貌\n和强国有我的责任担当。志愿服务", "options": {"A": "是培育和弘扬社会主义核心价值观的重要载体", "B": "已经成为衡量地区社会文明程度、社会治理水平的根本标准", "C": "归根结底是一种先进文化现象", "D": "已成为大学生参与社会实践、成长成才的重要舞台\n第六章 学习法治思想 提升法治素养"}, "answer": "ACD"}, {"id": "p5m-66", "num": 66, "type": "multiple", "stem": "法律是由国家创制和实施的行为规范。法律不但由国家制定和认可，而且由国家强制力保证实\n施。也就是说，法律具有国家强制性。法律的国家强制性表现为", "options": {"A": "国家对违法行为的否定和制裁", "B": "国家对合法行为的肯定和保护", "C": "法律的每一个实施过程都要借助于国家的强制力", "D": "国家强制力是保证法律实施的唯一力量\n87.2026年3月，《生态环境法典(草案)》提请十四届全国人大四次会议审议并获得通过。这是\n《民法典》之后我国第二部以“法典”命名的法律，将为美丽中国建设提供坚实法治保障。我\n国社会主义法律"}, "answer": "AB"}, {"id": "p5m-68", "num": 68, "type": "multiple", "stem": "法律的运行是一个从创制、实施到实现的过程。这个过程主要包括法律制定(立法)、法律执行\n(执法)、法律适用(司法)、法律遵守(守法)等环节。其中，把法律规范转化为法律实践，\n把法定的权利和义务转化为现实的权利和义务是法律运行环节中的", "options": {"A": "法律制定", "B": "法律执行", "C": "法律适用", "D": "法律遵守"}, "answer": "BCD"}, {"id": "p5m-69", "num": 69, "type": "multiple", "stem": "我国大部分的法律法规都是由行政机关执行的。行政执法是法律实施和实现的重要环节，必须\n坚持的基本原则有", "options": {"A": "合法性", "B": "合理性", "C": "信赖保护", "D": "效率"}, "answer": "ABCD"}, {"id": "p5m-70", "num": 70, "type": "multiple", "stem": "2020年11月，中央全面依法治国工作会议正式提出习近平法治思想。习近平法治思想", "options": {"A": "是新时代全面依法治国的指导思想和根本遵循", "B": "是马克思主义法治理论中国化时代化的最新成果", "C": "是顺应实现中华民族伟大复兴时代要求应运而生的重大理论创新成果", "D": "深刻回答了新时代为什么实行全面依法治国、怎样实行全面依法治国等一系列重大问题"}, "answer": "ABCD"}, {"id": "p5m-72", "num": 72, "type": "multiple", "stem": "习近平强调：“改革和法治如鸟之两翼、车之两轮。”改革的“破”和“变”,与法治的“立”\n和“稳”,只有相辅相成才能相得益彰。耕好改革“试验田”,需要把在法治轨道上推进改革和\n在改革进程中完善法治有机结合起来，发挥好立法引导、推动、规范、保障改革的“稳定器”\n作用。为此，要做到", "options": {"A": "立法主动适应改革需要，确保改革于法有据", "B": "实践证明行之有效的举措和经验，应及时上升为法律法规", "C": "对不适应改革要求的现行法律法规，能修改的则及时修改，宜废止的则及时废止", "D": "改革创新要大胆试、大胆闯，相关立法活动不受法定程序限制"}, "answer": "ABC"}, {"id": "p5m-73", "num": 73, "type": "multiple", "stem": "把党的领导贯彻到依法治国全过程和各方面，是我国社会主义法治建设的一条基本经验。我国\n是人民民主专政的社会主义国家，党的领导是", "options": {"A": "全面依法治国的关键", "B": "社会主义法治最根本的保证", "C": "中国特色社会主义法治之魂", "D": "我们的法治同西方资本主义国家的法治最大的区别"}, "answer": "BCD"}, {"id": "p5m-74", "num": 74, "type": "multiple", "stem": "中国特色社会主义法治道路的一个鲜明特点，就是坚持依法治国和以德治国相结合。坚持依法\n治国和以德治国相结合，就要", "options": {"A": "运用法治手段解决道德领域突出问题", "B": "强化道德对法治的支撑作用", "C": "在立法、执法、司法中都体现社会主义道德要求", "D": "让思想道德和法律在调节领域上保持完全一致"}, "answer": "ABC"}, {"id": "p5m-75", "num": 75, "type": "multiple", "stem": "走中国特色社会主义法治道路，必须坚持从中国实际出发，坚持", "options": {"A": "中国共产党的领导", "B": "人民主体地位", "C": "法律面前人人平等", "D": "依法治国和以德治国相结合"}, "answer": "ABCD"}, {"id": "p5m-76", "num": 76, "type": "multiple", "stem": "坚持党的领导，是社会主义法治的根本要求，是全面依法治国的题中应有之义。坚持党的领导，\n体现在党", "options": {"A": "领导立法", "B": "保证执法", "C": "支持司法", "D": "带头守法"}, "answer": "ABCD"}, {"id": "p5m-77", "num": 77, "type": "multiple", "stem": "平等是社会主义法律的基本属性，是社会主义法治的基本要求。坚持法律面前人人平等，有利于", "options": {"A": "增强人民群众的主人翁意识和责任感", "B": "预防特权思想和各种潜规则的侵蚀", "C": "贯彻执行“以事实为根据，以法律为准绳”的司法原则", "D": "维护法律权威、健全社会主义法治，确保实现全面依法治国的总目标"}, "answer": "ABCD"}, {"id": "p5m-78", "num": 78, "type": "multiple", "stem": "坚持全面依法治国，是中国特色社会主义国家制度和国家治理体系的显著优势。我国社会主义\n法治凝聚着我们党治国理政的理论成果和实践经验，是制度之治最基本最稳定最可靠的保障。\n法治兴则国兴，法治强则国强。法治是", "options": {"A": "解决一切问题的总钥匙", "B": "治国理政的基本方式", "C": "国家治理体系和治理能力的重要依托", "D": "国家核心竞争力的重要内容"}, "answer": "BCD"}, {"id": "p5m-79", "num": 79, "type": "multiple", "stem": "每一条法治道路底下都有一种政治立场，每一种法治模式当中都有一种政治逻辑。中国特色社\n会主义法治道路的核心要义，就是要", "options": {"A": "坚持党的领导", "B": "坚持以人民为中心", "C": "坚持中国特色社会主义制度", "D": "贯彻中国特色社会主义法治理论"}, "answer": "ACD"}, {"id": "p5m-81", "num": 81, "type": "multiple", "stem": "党的十八届四中全会提出和确立了建设中国特色社会主义法治体系、建设社会主义法治国家的\n总目标，开启了建设社会主义法治国家的新征程。建设中国特色社会主义法治体系就是要形成\n完备的法律规范体系、高效的法治实施体系、严密的法治监督体系、有力的法治保障体系，形\n成完善的党内法规体系。完备的法律规范体系是", "options": {"A": "中国特色社会主义法治体系的前提", "B": "法治国家、法治政府、法治社会的制度基础", "C": "宪法法律有效实施的重要保障", "D": "全面依法治国的重要依托"}, "answer": "AB"}, {"id": "p5m-82", "num": 82, "type": "multiple", "stem": "“100-1=0”。“一个错案的负面影响足以摧毁99个公正裁判积累起来的良好形象。执法司法中\n万分之一的失误，对当事人就是百分之百的伤害。”党的二十大报告指出，要严格公正司法，深\n化司法体制综合配套改革，全面准确落实司法责任制，加快建设公正高效权威的社会主义司法\n制度，努力让人民群众在每一个司法案件中感受到公平正义。公正是", "options": {"A": "法治的生命线", "B": "司法活动最高的价值追求", "C": "全面依法治国的前提", "D": "社会主义法治最根本的保证"}, "answer": "AB"}, {"id": "p5m-83", "num": 83, "type": "multiple", "stem": "必须坚持宪法的国家根本法地位，是对我国宪法制度建设的规律性认识之一。宪法集中体现了\n党和人民的统一意志和共同愿望，是国家意志的最高表现形式，具有", "options": {"A": "根本性", "B": "全局性", "C": "稳定性", "D": "长期性"}, "answer": "ABCD"}, {"id": "p5m-84", "num": 84, "type": "multiple" "type": "multiple", "stem": "马克思说：“没有无义务的权利，也没有无权利的义务。”法律权利与法律义务的关系，就像一\n枚硬币的两面，不可分割，相互依存。以下选项内容正确的有", "options": {"A": "法律权利的实现必须以相应法律义务的履行为条件", "B": "法律义务的设定和履行必须以法律权利的行使为根据", "C": "一个行为不可以同时是权利行为和义务行为", "D": "每个人既是享受法律权利的主体，又是承担法律义务的主体"}, "answer": "ABD"}]}];
const SECTION_BY_ID = new Map(SECTIONS.map(s => [s.id, s]));
const PAGE_SIZE = 10;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
let state = { section: SECTIONS[0].id, page: 1, answers: {} };
let pending = new Map();
let chatQid = null;

function esc(v) {
  return String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && saved.answers && typeof saved.answers === "object") state.answers = saved.answers;
    if (saved && SECTION_BY_ID.has(saved.section)) state.section = saved.section;
    if (saved && Number.isFinite(saved.page)) state.page = saved.page;
  } catch (e) { console.warn(e); }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { console.warn(e); }
}
function currentSection() { return SECTION_BY_ID.get(state.section) || SECTIONS[0]; }
function allQuestions() { return currentSection().questions; }
function totalPages() { return Math.max(1, Math.ceil(allQuestions().length / PAGE_SIZE)); }
function clampPage() { state.page = Math.min(Math.max(1, state.page), totalPages()); }
function pageQuestions() {
  const p = state.page;
  return allQuestions().slice((p - 1) * PAGE_SIZE, p * PAGE_SIZE);
}
function recordFor(q) { return state.answers[q.id] || null; }
function answerLetters(q) { return String(q.answer).split("").filter(Boolean).sort(); }
function picksFor(q, rec) { return rec ? rec.picks : [...(pending.get(q.id) || [])]; }
function isCorrect(q, picks) {
  const a = answerLetters(q), b = [...picks].sort();
  return a.length === b.length && a.every((x, i) => x === b[i]);
}
function stats() {
  const list = allQuestions();
  const answered = list.filter(q => recordFor(q)).length;
  const correct = list.filter(q => recordFor(q) && recordFor(q).correct).length;
  return { answered, correct, accuracy: answered ? Math.round(correct / answered * 100) : 0 };
}
function optionClass(q, letter, rec) {
  if (!rec) return (pending.get(q.id) || new Set()).has(letter) ? "picked" : "";
  if (answerLetters(q).includes(letter)) return "correct";
  if (rec.picks.includes(letter)) return "wrong";
  return "";
}
function cardHTML(q, index) {
  const rec = recordFor(q);
  const picks = picksFor(q, rec);
  const cls = rec ? (rec.correct ? "ok" : "bad") : "";
  const opts = ["A", "B", "C", "D"].map(letter => {
    const c = optionClass(q, letter, rec);
    const picked = picks.includes(letter);
    return `<button type="button" class="option ${c} ${rec ? "locked" : ""}" data-qid="${q.id}" data-letter="${letter}" aria-pressed="${picked}">
      <span class="letter">${letter}</span><span>${esc(q.options[letter] || "")}</span>
    </button>`;
  }).join("");
  const canSubmit = q.type === "multiple" && !rec && (pending.get(q.id) || new Set()).size > 0;
  const feedback = rec ? `<div class="feedback ${rec.correct ? "ok" : "bad"}">${rec.correct ? "✓ 回答正确" : "✕ 回答错误"} · 正确答案 <b>${esc(q.answer)}</b>${rec.correct ? "" : ` · 你的选择 ${rec.picks.join("")}`}</div>` : "";
  return `<article class="q-card ${cls}" data-card="${q.id}">
    <div class="q-head"><span class="q-num">${String(index + 1).padStart(2, "0")}</span><span class="q-type ${q.type}">${q.type === "multiple" ? "多选" : "单选"}</span></div>
    <p class="q-stem">${esc(q.stem)}</p>
    <div class="options">${opts}</div>
    ${canSubmit ? '<div class="submit-row"><button class="submit-btn" type="button" data-submit="' + q.id + '">提交答案</button></div>' : ""}
    ${feedback}
  </article>`;
}
function render() {
  clampPage();
  const sec = currentSection();
  const list = allQuestions();
  const pg = pageQuestions();
  const st = stats();
  $("#section-title").textContent = sec.title;
  $("#stat-answered").textContent = st.answered;
  $("#stat-accuracy").textContent = st.accuracy + "%";
  $("#stat-accuracy").style.color = st.answered ? "var(--jade)" : "";
  $("#progress-fill").style.width = (list.length ? st.answered / list.length * 100 : 0) + "%";
  $("#page-label").textContent = state.page;
  $("#page-total").textContent = totalPages();
  const answeredOnPage = pg.filter(q => recordFor(q)).length;
  $("#page-progress").textContent = `本页已答 ${answeredOnPage} / ${pg.length}`;
  $("#prev").disabled = state.page <= 1;
  $("#next").disabled = state.page >= totalPages();
  const quiz = $("#quiz");
  const empty = $("#empty");
  if (!pg.length) {
    quiz.innerHTML = "";
    quiz.hidden = true;
    empty.hidden = false;
  } else {
    quiz.hidden = false;
    empty.hidden = true;
    if (!chatQid || !pg.some(q => q.id === chatQid)) chatQid = pg[0].id;
    const offset = (state.page - 1) * PAGE_SIZE;
    quiz.innerHTML = pg.map((q, i) => cardHTML(q, offset + i)).join("");
  }
  if (window.refreshPoliticsChatContext) window.refreshPoliticsChatContext();
}
function commit(qid, letters) {
  const q = allQuestions().find(x => x.id === qid);
  if (!q || recordFor(q)) return;
  const picks = [...new Set(letters)].filter(x => q.options[x]).sort();
  if (!picks.length) return;
  state.answers[qid] = { picks, correct: isCorrect(q, picks) };
  pending.delete(qid);
  save();
  render();
}
function getChatContext() {
  const q = allQuestions().find(x => x.id === chatQid) || pageQuestions()[0];
  if (!q) return { label: currentSection().title, promptText: "【考研政治知识点答疑】当前部分：" + currentSection().title + "。请直接回答学生的考研政治问题。" };
  const opts = ["A", "B", "C", "D"].map(l => `${l}. ${q.options[l] || ""}`).join("\n");
  return {
    label: `${currentSection().title} · ${q.stem.slice(0, 26)}`,
    promptText: `【考研政治知识点答疑】当前部分：${currentSection().title}。当前题目：${q.stem}\n${opts}\n正确答案：${q.answer}。请围绕当前题目和考研政治知识点回答。`
  };
}
function goPage(p) {
  state.page = Math.min(Math.max(1, p), totalPages());
  pending.clear();
  save();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function resetPage() {
  const pg = pageQuestions();
  for (const q of pg) { delete state.answers[q.id]; pending.delete(q.id); }
  save();
  $("#reset-dialog").close();
  render();
}
function bind() {
  $("#quiz").addEventListener("click", e => {
    const card = e.target.closest("[data-card]");
    if (card) { chatQid = card.dataset.card; if (window.refreshPoliticsChatContext) window.refreshPoliticsChatContext(); }
    const opt = e.target.closest(".option");
    if (opt) {
      const q = allQuestions().find(x => x.id === opt.dataset.qid);
      if (!q || recordFor(q)) return;
      if (q.type === "single") commit(q.id, [opt.dataset.letter]);
      else {
        const set = pending.get(q.id) || new Set();
        if (set.has(opt.dataset.letter)) set.delete(opt.dataset.letter); else set.add(opt.dataset.letter);
        pending.set(q.id, set);
        render();
      }
      return;
    }
    const sub = e.target.closest("[data-submit]");
    if (sub) { const qid = sub.dataset.submit; commit(qid, [...(pending.get(qid) || [])]); }
  });
  $("#prev").addEventListener("click", () => goPage(state.page - 1));
  $("#next").addEventListener("click", () => goPage(state.page + 1));
  $("#section-select").addEventListener("change", e => {
    state.section = e.target.value;
    state.page = 1;
    pending.clear();
    save();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("#btn-reset").addEventListener("click", () => {
    const pg = pageQuestions();
    $("#reset-desc").textContent = `只会清空当前第 ${state.page} 页的 ${pg.length} 道题，不影响其他页。此操作不可撤销。`;
    $("#reset-dialog").showModal();
  });
  $("#confirm-reset").addEventListener("click", resetPage);
  $$("[data-close]").forEach(btn => btn.addEventListener("click", () => document.getElementById(btn.dataset.close).close()));
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea, select")) return;
    if ($("#reset-dialog").open) return;
    if (e.key === "ArrowLeft") goPage(state.page - 1);
    if (e.key === "ArrowRight") goPage(state.page + 1);
  });
}
function init() {
  load();
  const sel = $("#section-select");
  sel.innerHTML = SECTIONS.map(s => `<option value="${s.id}">${esc(s.title)}（${s.questions.length}题）</option>`).join("");
  if (!SECTION_BY_ID.has(state.section)) state.section = SECTIONS[0].id;
  sel.value = state.section;
  bind();
  render();
  if (window.initPoliticsChat) window.initPoliticsChat({ getContext: getChatContext });
}
init();
</script>
</body>
