<style>

const STORAGE_KEY = "kaoyan-politics-xiaoba-2027-v1";
const SECTIONS = [{"id": "b1", "title": "第1套", "questions": [{"id": "b1-1", "num": 1, "type": "single", "stem": "“竹外桃花三两枝，春江水暖鸭先知。”苏轼这句优美的诗句描绘了春回大地、万物复苏之间的 关系，竹林、桃花、江水、鸭子等诸多事物共同构成了一幅春天的画卷。从唯物辩证法的角度 看，这一诗句蕴含的哲理是", "options": {"A": "世界是一个普遍联系的有机整体", "B": "任何两个事物之间都存在着因果关系", "C": "事物之间的联系都是人们感知之后才形成的", "D": "多样的事物之间存在着普遍的、无条件的联系"}}, {"id": "b1-2", "num": 2, "type": "single", "stem": "夏日炎炎，海南三亚崖州湾，田间的南繁季已结束，而“数据田”里的育种仍在进行。走进海南 大学南繁学院基因组与大数据育种实验室，不见培养皿与种苗圃，只有运转不息的机房。人工 智能(AI)生物信息科学家智能体与大模型，能在虚拟农田里“算”出作物长什么样，帮育种科 研人员节省时间。田间南繁，须守农时。每年9月到次年5月，北方的育种科研人员如候鸟南 下海南岛南部，利用充足光热资源开展种子加代繁育，压缩育种周期。选种、种植、收获，重复 6到7轮、花上8到10年，才能找出性状稳定、表现优良的品种。而工作人员将积累的作物基 因数据“喂”给AI,让它预测作物未来的样子，提前淘汰掉不合格品种，精准锁定最具潜力、最 能适应环境变化的“种子选手”。在一定条件下，相关技术能帮育种人员节约近一半时间。从\n“数据田”育出“种子选手”表明", "options": {"A": "虚拟预测可以完全代替田间试验", "B": "人工智能已经成为独立的认识主体", "C": "数据已成为整个世界的最基本构成力量", "D": "科技创新能够延伸人的认识器官、变革认识方式"}}, {"id": "b1-3", "num": 3, "type": "single", "stem": "在资本主义商品生产条件下，单个资本家改进技术、改善管理的主观动机是", "options": {"A": "增加必要劳动时间", "B": "降低资本有机构成", "C": "追求超额剩余价值", "D": "获取相对剩余价值"}}, {"id": "b1-4", "num": 4, "type": "single", "stem": "金融寡头是指操纵国民经济命脉，并在实际上控制国家政权的少数垄断资本家或垄断资本家集 团。金融寡头在经济领域中的统治主要是通过“参与制”实现的。所谓参与制是指金融寡头", "options": {"A": "通过把自己的代理人送进政府或议会来为其垄断统治服务", "B": "通过建立政策咨询机构等方式参与政府的政策制定", "C": "通过掌握一定数量的股票来层层控制企业", "D": "私人与国家共同投资开办合营企业"}}, {"id": "b1-5", "num": 5, "type": "single", "stem": "毛泽东指出；“我们要从国内外，者内外、县内外、区内外的实际情况出发，从其中引出其固有 的面不是能造的规律性，即投出圃围事变的内部联系，作为我们行动的向导。”这实际上是要 求我们", "options": {"A": "密切联系群众", "B": "坚持实事求是", "C": "反对党八股", "D": "整顿党的作风"}}, {"id": "b1-6", "num": 6, "type": "single", "stem": "党的十一届三中全会以后，邓小平多次强调，要坚持和健全民主集中制，在谈到°党员个人股 从党的组织，少数服从多数，下级组织服从上级组织，企觉各个组织和全体党员服从党的全篱 代表大会和中央委员会”这一民主集中制的基本原则时，邓小平指出这几条里面，最重要的 献是", "options": {"A": "个人服从组织", "B": "少数服从多数", "C": "下饭服从上级", "D": "全党服从中央"}}, {"id": "b1-7", "num": 7, "type": "single", "stem": "2026年10月26日至29日，中国共产党第二十届中央委员会第五次全体会议胜利举行。全会 保刺总结新时代全面从严治党伟大成就和宝责经脸，审议通过了《中共中央关于持之以恒推 进全面从严治党若干重大问题的决定),就持之以恒推进全面从严洽凳作出战略部署。《决 定>明确指出，全面从严治党的根本性任务是", "options": {"A": "从严治吏", "B": "增强党性", "C": "正风肃纪", "D": "加强党内法规制度建设"}}, {"id": "b1-8", "num": 8, "type": "single", "stem": "生态安全是总体国家安全翼的重要组成部分，关乎民族水续生存、经济社会可持续发展及全球 生态稳定。在维护国家生态安全中，居于首要地位的是", "options": {"A": "碳达峰碳中和", "B": "自然保护地", "C": "生物多样性保护", "D": "大规模国土绿化"}}, {"id": "b1-9", "num": 9, "type": "single", "stem": "我国国土广爽、地理复杂、气候多样，自然灾害易发多发。当前，我国防灾减灾救灾工作面临不 少新情况新问题。要站在统筹高质量发展和高水平安全的战略高度，充分认识做好防灾减灾 救灾工作的极端重要性，不断提高防芭应对各类自然灾害的能力和水平，切实维护人民群众生 命财产安全和社会稳定，确保中国式现代化行稳致远。降低灾害风险，减轻灾害损失，要推动 灾害治理", "options": {"A": "向事前预防转型", "B": "向科技支撑转型", "C": "从单一管理为主转向分散管理为主", "D": "从政府监督为主转向市场监督为主"}}, {"id": "b1-10", "num": 10, "type": "single", "stem": "从1840年鸦片战争以来，资本-帝国主义列强发动了一次又一次的侵华战争。帝国主义侵略 中国的最终目的，是要", "options": {"A": "迫使中国采用资产阶级的生产方式", "B": "从文化和宗教上同化中国", "C": "将中国变为人侵亚洲的跳板和桥头堡", "D": "瓜分中国、灭亡中国"}}, {"id": "b1-11", "num": 11, "type": "single", "stem": "近代中国的社会性质和主要矛盾，决定了中国革命仍然是资产阶级民主革命。但中国资产 阶级民主革命不同于一般的资产阶级民主革命，经历了从旧民主主义革命向新民主主义革 命的转变，具有鲜明的时代特征。标志着中国资产阶级民主革命的时代背景发生了根本转 换的历史事件是", "options": {"A": "辛亥革命的爆发", "B": "中国共产党成立", "C": "俄国十月革命", "D": "护法运动的失败"}}, {"id": "b1-12", "num": 12, "type": "single", "stem": "1947年6月底，根据中共中央的决策和部署，刘伯承、邓小平率领的晋冀鲁豫野战军主力，实 施中央突破，千里跃进大别山。随后，陈毅、粟裕指挥的华东野战军主力为东路，挺进苏鲁豫 皖地区。陈赓、谢富治指挥的晋冀鲁豫野战军一部为西路，挺进豫西。三路大军相互策应，机 动歼敌，这标志着", "options": {"A": "蒋介石20年反革命统治由发展到消灭的转折点", "B": "人民解放战争战略进攻的序幕由此揭开", "C": "人民解放军在数量上已经超过国民党军队", "D": "100多年来帝国主义在中国的统治由发展到消灭的转折点"}}, {"id": "b1-13", "num": 13, "type": "single", "stem": "1984年10月，党的十二届三中全会通过《中共中央关于经济体制改革的决定》。会后，经济 体制改革以城市为重点全面展开。改革的中心环节是", "options": {"A": "完善家庭联产承包责任制", "B": "全面推进价格改革", "C": "确认私营经济的法律地位", "D": "增强全民所有制企业的活力"}}, {"id": "b1-14", "num": 14, "type": "single", "stem": "相传清朝康熙年间，时任文华殿大学士兼礼部尚书的张英，收到了一封来自桐城老家的家 书，信中说家人与邻居吴家发生土地纠纷，请他相助。张英在家书中写道：“一纸书来只为 墙，让他三尺又何妨?”张家人收到回信，主动让出三尺；吴家人深受感动，也退让三尺。六尺 巷的故事由此传为佳话。六尺巷的古老智慧体现的中华民族的传统美德是", "options": {"A": "注重人伦关系，重视道德义务", "B": "推崇仁爱原则，注重以和为贵", "C": "追求精神境界，向往理想人格", "D": "重视整体利益，强调责任奉献"}}, {"id": "b1-15", "num": 15, "type": "single", "stem": "2026年7月8日，习近平总书记出席国家科学技术奖励大会、中国科学院第二十二次院士大 会和中国工程院第十八次院 : {"A": "辛亥革命", "B": "五四运动", "C": "一二 ·九运动", "D": "新文化运动"}}, {"id": "b2-13", "num": 13, "type": "single", "stem": "1950年至1953年春，土地改革在新解放区进行。《中华人民共和国土地改革法》规定了这次 土改的目的，是废除地主阶级封建剥削的土地所有制，实行农民的土地所有制，解放农村生 产力，发展农业生产，为新中国的工业化开辟道路。与解放战争时期的土改相比，这次土改在 政策上的一个大的变化是", "options": {"A": "由实行减租减息政策改变为实现“耕者有其田”的政策", "B": "由“没收一切土地”改为“没收一切公共土地及地主阶级的土地”", "C": "由对富农征收多余的土地财产改变为保存富农经济", "D": "由削弱封建剥削向变革封建土地关系、废除封建剥削制度过渡"}}, {"id": "b2-14", "num": 14, "type": "single", "stem": "法治宣传教育是全面依法治国的长期基础性工作。2026年7月，中共中央、国务院转发了\n《中央宣传部、司法部关于开展法治宣传教育的第九个五年规划(2026—2030年)》,对法治 宣传教育作出新的全面部署。《规划》指出，“九五”普法的首要任务是", "options": {"A": "推动习近平法治思想深人人心", "B": "贯彻实施法治宣传教育法", "C": "繁荣发展社会主义法治文化", "D": "健全法治宣传教育工作体系"}}, {"id": "b2-15", "num": 15, "type": "single", "stem": "2026年3月12日，第十四届全国人民代表大会第四次会议批准了《中华人民共和国国民经济和 社会发展第十五个五年规划纲要》(“十五五”规划)。“十五五”规划编制最鲜明的特点是", "options": {"A": "坚持问题导向", "B": "坚持从实际出发", "C": "把加强顶层设计和坚持问计于民统一起来", "D": "坚持党的领导、人民当家作主、依法治国有机统一"}}, {"id": "b2-16", "num": 16, "type": "single", "stem": "2026年9月12日，国家主席习近平在金砖国家领导人第十八次会晤第一阶段会议上发表的 题为《共担时代责任勇做先锋力量》的讲话中指出，2026年是金砖国家合作20周年。20年 来，金砖合作机制不断发展壮大，展现出蓬勃生机活力，成为当今世界最具影响力的新兴市 场和发展中国家合作平台。二十年风雨兼程，始终是金砖事业发展力量之源的是", "options": {"A": "尊重彼此核心关切", "B": "团结合作", "C": "坦诚相待", "D": "求同存异\n二、多项选择题：第17~33小题，每小题2分，共34分。下列每小题给出的四个选项中， 至少有两个选项是符合题目要求的。多选、少选或错选均不得分。"}}, {"id": "b2-17", "num": 17, "type": "multiple", "stem": "科技装备强是农业强国的重要特征。田间一线，农民有新烦恼：“‘大家伙’有劲儿，但开不上丘陵田”“种特色瓜果蔬菜，没有好机子，还得靠人工”。缺趁手的“微农机”、特色农机，折射出农机装备的供需错配。从哲学上看，解决这一问题的关键在于", "options": {"A": "能够满足人们生产劳动资料的需要", "B": "本质上是由认识决定并支配的客观过程", "C": "可以把人脑中观念的存在变为现实的存在", "D": "仅限于生产活动这一种具体形式"}, "answer": "AC", "explain": "简析物质生产实践是人类最基本的实践活动，它解决人与自然的矛盾，满足人们的物质生 活资料和生产劳动资料的需要。A正确。实践能够引起客观世界的某种变化，可以把人脑中 观念的存在变为现实的存在，给人们提供现实的成果。实践的这一特征，把它同人的主观认 识活动区别开来。C正确。人的实践活动是以改造客观世界为目的的客观过程。辩证唯物 主义认为，在实践和认识之间，实践是认识的基础，实践在认识活动中起着决定性的作用。B 错误。人类的社会生活色彩斑斓，实践活动在形式上是丰富多样的。毛泽东指出，“人的社 会实践，不限于生产活动一种形式，还有多种其他的形式，阶级斗争，政治生活，科学和艺术 的活动”。D 错误。"}, {"id": "b2-18", "num": 18, "type": "multiple", "stem": "在重庆南川区，面对“一刀切”难以解决流动摊贩管理问题且易造成居民、商贩 . 结合材料回答问题：\n2026年3月12日，十四届全国人大四次会议表决通过《中华人民共和国民族团结进步 促进法》,国家主席习近平签署第七十一号主席令予以公布，自7月1日起施行。这是党的统 一战线和民族工作历史上具有里程碑意义的一件大事，是铸牢中华民族共同体意识、推进中 华民族共同体建设的重大法治举措。要深入学习领会法律精神，全面贯彻实施法律规定，推 动全国各族人民为以中华民族大团结促进中国式现代化共同奋斗。\n制定民族团结进步促进法，是以习近平同志为核心的党中央着眼新时代新征程党的民 族工作的历史方位，部署的重大政治任务和立法任务。要从深刻领悟“两个确立”的决定性 意义、坚决做到“两个维护”的高度，充分认识制定民族团结进步促进法的重大意义，准确把 握该法独特的法律定位与法治功能。\n摘编自《人民日报》(2026年4月27日)\n(1 )说明制定《中华人民共和国民族团结进步促进法》的重大意义。\n(2)制定和实施《中华人民共和国民族团结进步促进法》是铸牢中华民族共同体意识、推 进中华民族共同体建设的重大法治举措。为什么要铸牢中华民族共同体意识?\n36. 结合材料回答问题：\n材料1\n“制定和实施五年规划是我们党治国理政一条重要经验，是中国特色社会主义制度一个 重要政治优势”。\n回望新中国成立以来的奋斗历程，我国制定和实施了14个五年规划(计划),从积贫积 弱的农业国发展成为世界第二大经济体并向全面建成社会主义现代化强国目标迈进，何其 艰难、何其勇毅!\n回望历史，从在一穷二白的基础上建立起独立的比较完整的工业体系，到取得“两弹一 星”、探月工程等重大科技突破，从完成三峡工程、西气东输、南水北调等重大项目建设，到党 的十八大以来集中力量打赢脱贫攻坚战、历史性地解决了绝对贫困问题，建成世界上规模最 大的教育体系、社会保障体系、医疗卫生体系……\n通过制定和实施五年规划，分阶段部署一批重大任务、重大项目、重大工程，调动各方面 资源和力量按期完成，有力支撑了经济社会发展和国家各方面建设。\n摘编自《人民日报》(2026年1月21日)\n材料2\n用中长期规划指导经济社会发展是我们党治国理政的重要方式。党的十八大以来，以 习近平同志为核心的党中央高度重视国家发展规划工作。党的二十大提出，健全宏观经济 治理体系，发挥国家发展规划的战略导向作用；党的二十届三中全会提出，健全国家经济社 会发展规划制度体系，强化规划衔接落实机制；党的二十届四中全会提出，强化国家发展规 划战略导向作用，强化规划实施监测评估和监督。\n国家发展规划法是以宪法为依据，规范国家发展规划制定、保障国家发展规划实施的基 本法律。党中央对加快出台国家发展规划法、强化规划编制实施的法治保障提出明确要求。 深入贯彻习近平新时代中国特色社会主义思想，落实党中央重大决策部署，有必要认真总结 长期以来国家发展规划工作的成功经验，制定国家发展规划法，对国家发展规划工作应当坚 持的指导思想和原则理念予以明确，对国家发展规划的编制、审查和批准、实施及其监督等 具体程序作出全面系统规定，为在法治轨道上科学编制和有效实施国家发展规划提供有力 制度保障。\n摘编自《人民日报》(2026年3月6日)\n(1) 如何理解制定和实施五年规划是“中国特色社会主义制度一个重要政治优势”?\n(2)结合《中华人民共和国国家发展规划法》的制定，说明为什么要坚定制度自信。\n37. 结合材料回答问题：\n在五四青年节到来之际，中共中央总书记、国家主席、中央军委主席习近平给中国青年 五四奖章暨新时代青年先锋奖获奖者代表回信。习近平在回信中说，你们牢记党的嘱托，扎 根科技创新、乡村振兴、社会服务、卫国戍边等基层一线，以实干担当书写无悔青春，展现了 新时代中国青年自信自强、昂扬向上的良好风貌。\n习近平强调，今年是“十五五”开局之年，青年建功正当其时。希望你们胸怀远大理想， 矢志拼搏奋斗，带动广大青年把个人追求融入国家发展大局，立足各自岗位不断创造新业 绩，在新征程上贡献青春力量。\n摘编自《人民日报》(2026年5月4日)\n(1)新时代青年为什么要“把个人追求融人国家发展大局”?\n(2)新时代青年应当如何选择职业并“立足各自岗位不断创造新业绩，在新征程上贡献青 春力量”?\n38.结合材料回答问题：\n材料1\n5月1日起，中国对53个非洲建交国全面实施零关税举措。这是中国扩大高水平对外 开放的新举措，将为中非携手迈向现代化注入新动能。在经济全球化遭遇逆流，单边主义、 保护主义愈演愈烈的背景下，中国进一步主动向非洲国家敞开超大规模市场大门，是“减法” 更是“加法”,以关税之“减”,撬动发展之“增”,串联市场之“通”,实现价值之“融”,充分彰显 中国“计利当计天下利”的大国胸襟与责任担当。\n非洲联盟委员 }}, {"id": "b4-5", "num": 5, "type": "single", "stem": "马克思主义中国化时代化的理论成果是一脉相承又与时俱进的关系。它们都是\n①关于中国革命、建设、改革的正确的理论原则和经验总结\n②马克思列宁主义在中国的运用和发展\n③全国各族人民团结奋斗的共同思想基础\n④党和国家必须长期坚持的指导思想", "options": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④"}}, {"id": "b4-6", "num": 6, "type": "single", "stem": "在邓小平指导下，党的十一届三中全会重新确立解放思想、实事求是的思想路线，停止使用 “以阶级斗争为纲”的错误提法，作出把党和国家工作中心转移到经济建设上来、实行改革开 放的历史性决策，开启了改革开放和社会主义现代化建设新时期，实现了党的历史上具有深远 意义的伟大转折。党在改革开放和社会主义现代化建设新时期实现的最根本的拨乱反正是", "options": {"A": "坚持四项基本原则", "B": "坚持改革开放", "C": "坚持以经济建设为中心", "D": "坚持中国特色社会主义"}}, {"id": "b4-7", "num": 7, "type": "single", "stem": "中国特色社会主义进人新时代，是长期以来特别是党的十八大以来我们党领导人民不懈奋斗 的必然结果，是我们党在科学把握形势和实践发展变化基础上作出的重大判断。新时代是我 国发展新的历史方位，标志着中国特色社会主义事业进人了新的发展阶段。中国特色社会主 义进人新时代重大判断的基本依据是", "options": {"A": "我国社会主要矛盾发生新变化", "B": "党的主要任务发生新变化", "C": "中国和世界关系发生新变化", "D": "发展理念和思路发生新变化"}}, {"id": "b4-8", "num": 8, "type": "single", "stem": "构建新安全格局是全面贯彻落实总体国家安全观的重大举措。构建统筹各领域安全的新安全 格局的主阵地、主战场是", "options": {"A": "维护意识形态安全", "B": "维护制度安全", "C": "维护政权安全", "D": "维护重点领域国家安全"}}, {"id": "b4-9", "num": 9, "type": "single", "stem": "习近平党建思想是加强新时代党的建设的根本遵循。学习贯彻习近平党建思想，要深人学习 领会习近平党建思想的科学内涵，深刻领会“坚持党中央集中统一领导”是", "options": {"A": "党的优势所在、力量所在", "B": "党的领导的最高原则", "C": "新时代党的建设的根本要求", "D": "新时代党的建设的战略方针"}}, {"id": "b4-10", "num": 10, "type": "single", "stem": "从鸦片战争开始，外国资本-帝国主义不断人侵中国。但是，帝国主义列强始终不能灭亡和 瓜分中国。帝国主义列强不能灭亡和瓜分中国的根本原因是", "options": {"A": "帝国主义列强之间的矛盾", "B": "晚清政府的军事抵抗", "C": "中华民族进行的不屈不挠的反侵略斗争", "D": "中国资产阶级开始登上历史舞台"}}, {"id": "b4-11", "num": 11, "type": "single", "stem": "在中国早期马克思主义者的队伍中，李大钊是代表人物。1919年8月，李大钊在《再论问题 与主义》一文中指出：“一个社会主义者，为使他的主义在世界上发生一些影响，必须要研究 怎么可以把他的理想尽量应用于环绕着他的实境。”在《我的马克思主义观》一文中，他一方 面肯定马克思主义是“世界改造原动的学说”,具有普遍意义；另一方面又指出，“马氏的学 说，实在是一个时代的产物”,我们不可以不考虑我们的环境“就那样整个拿来，应用于我们 生存的社会”。这说明，中国早期马克思主义者", "options": {"A": "开始认识到必须把改造国民性置于优先地位", "B": "已在实际上初步形成了马克思主义应当与中国具体实际相结合的思想", "C": "仍然在马克思主义与社会民主主义等流派中进行反复比较", "D": "明确提出马克思主义时代化的任务"}}, {"id": "b4-12", "num": 12, "type": "single", "stem": "1945年4月23日至6月11日，中国共产党第七次全国代表大会在延安举行。中共七大制定 了新民主主义国家在政治、经济、文化方面的纲领，并提出了", "options": {"A": "完整的新民主主义革命的总路线", "B": "实现“四个现代化”的宏伟目标", "C": "实现中国工业化的宏伟任务", "D": "“ 马克思主义的中国化”的命题"}}, {"id": "b4-13", "num": 13, "type": "single", "stem": "1979年3月30日，邓小平在党的理论工作务虚会上发表《坚持四项基本原则》的讲话。他指 出：坚持社会主义道路，坚持人民民主专政，坚持共产党的领导，坚持马克思列宁主义、毛泽东 思想这四项基本原则，“是实现四个现代化的根本前提”。“如果动摇了这四项基本原则中的 任何一项，那就动摇了整个社会主义事业，整个现代化建设事业。”他还提出一个重要思想：\n“现在搞建设，也要适合中国情况，走出一条中国式的现代化道路。”这表明", "options": {"A": "中国共产党所领导的改革开放从一开始就具有明确的社会主义方向", "B": "中国式现代化只能基于自身国情，不能借鉴他国经验", "C": "“中国特色社会主义”从此成为我们党的全部理论和实践创新的主题", "D": "马克思主义同中国实际“第二次结合”任务的正式提出"}}, {"id": "b4-14", "num": 14, "type": "single", "stem": "中国革命道德是指中国共产党人、人民军队、一切先进分子和人民群众在中国革命、建设、改 革中所形成的优秀道德，是马克思主义与中国革命、建设、改革的伟大实践相结合的产物，是 中华民族极其宝贵的道德财富。中国革命道德的灵魂是", "options": {"A": "坚持社会主义和共产主义理想信念", "B": "全心全意为人民服务", "C": "始终把革命利益放在首位", "D": "修身自律、保持节操"}}, {"id": "b4-15", "num": 15, "type": "single", "stem": "2026年10月9日，《中共中央国务院关于发展新质生产力的意见》公开发布。《意见》提出 发展新质生产力要坚持创新主导、改革为要、因地制宜、先立后破。坚持创新主导，就是要把 创新作为发展新质生产力的", "options": {"A": "逻辑起点", "B": "关键一招", "C": "实践准则", "D": "方法路径"}}, {"id": "b4-16", "num": 16, "type": "single", "stem": "2026年6月，中国国务院新闻办公室发布《构建更加公正合理的全球治理体系：中国的理念、 倡议与行动》白皮书。白皮书强调，中国提出全球治理倡议，旨在推动构建更加公正合理的 全球治理体系。落实全球治理倡议，最关键的是", "options": {"A": "坚定维护联合国的权威和地位", "B": "大国展现责任担当", "C": "各国团结合作", "D": "弥补和平与发展赤字\n二、多项选择题：第17~33小题，每小题2分，共34分。下列每小题给出的四个选项中， 至少有两个选项是符合题目要求的。多选、少选或错选均不得分。"}}, {"id": "b4-17", "num": 17, "type": "multiple", "stem": "习近平总书记指出，科技突破的程度，很大程度上决定未来产业发展的速度、广度、深度。要 充分发挥新型举国体制优势，坚持“产业出题、科技答题”,加大重点领域关键核心技术攻关 力度，加强基础研究战略性、前瞻性、体系化布局，加快科技成果转化应用。“产业出题、科技 答题”从一个侧面说明", "options": {"A": "实践是认识发展的动力", "B": "认识是实践的源头活水", "C": "认识与实践具有完全同步性", "D": "认识世界是为了改造世界"}}, {"id": "b4-18", "num": 18, "type": "multiple", "stem": "2026年初，一款嘴巴缝反了的“哭哭马”毛绒玩偶悄然走红，成为许多消费者争相人手的“心 头好”。这匹小马没有复杂的功能，却以憨态可掬、略带委屈的形象，精准触动人们心中柔软 的一角，引发情感共鸣和消费热潮。从“缝制失误品”变身全网追捧的“情绪搭子”,这一现象 看似偶然，实则折射出悦己消费蓬勃兴起，彰显其作为新型消费的强劲增长势头。从“缝制 失误品”变身全网追捧的“情绪搭子”表明", "options": {"A": "事物的矛盾运动是一个动态的过程，次要矛盾也可以对事物发展起决定作用", "B": "偶然性是必然性的表现形式，个别产品走红背后有消费趋势的必然性", "C": "价值评价结果与主体直接 全国代表大会上的讲话》\n(1) 结合我国发展的内外部环境变化，说明加强基础研究的重大意义。\n(2)如何理解推动科技创新和产业创新深度融合是“以高水平科技自立自强引领发展新质 生产力的关键”?\n36.结合材料回答问题：\n材料1\n110年前，以孙中山先生为代表的革命党人发动了震惊世界的辛亥革命，推翻了清朝政 府，结束了在中国延续几千年的君主专制制度，近代以来中国发生的深刻社会变革由此拉开 了序幕。这是中国人民和中国先进分子为实现民族独立、人民解放进行的一次伟大而艰辛 探索。\n历史发展总是螺旋式上升、波浪式前进的。由于历史进程和社会条件的制约，由于没有 找到解决中国前途命运问题的正确道路和领导力量，辛亥革命没有改变旧中国半殖民地半 封建的社会性质和中国人民的悲惨境遇，没有完成实现民族独立、人民解放的历史任务。辛 亥革命之后，在这场革命中接受洗礼的中国人民和中国先进分子继续探寻救国救民道路。 十月革命一声炮响，给中国送来了马克思列宁主义，促进了中国人民的伟大觉醒，在马克思 列宁主义同中国工人运动的紧密结合中，中国共产党应运而生。中国共产党一经诞生，就把 为中国人民谋幸福、为中华民族谋复兴确立为自己的初心和使命，点亮了实现中华民族伟大 复兴的灯塔。\n摘自习近平《在纪念辛亥革命110周年大会上的讲话》\n材料2\n105年不懈奋斗，开辟了实现中华民族伟大复兴的正确道路。在革命、建设、改革和新时 代的伟大实践中，我们党领导人民历尽千辛万苦，成功开辟和坚持了中国特色社会主义道 路，仅用几十年时间就走完发达国家几百年走过的工业化历程，创造了经济快速发展和社会 长期稳定两大奇迹。今天，中华民族伟大复兴势不可挡，展现出前所未有的光明前景。\n摘自习近平《在庆祝中国共产党成立105周年大会上的讲话》(《求是》2026年第14期)\n(1)为什么说辛亥革命是“中国人民和中国先进分子为实现民族独立、人民解放进行的一 次伟大而艰辛探索”?\n(2)如何理解“今天，中华民族伟大复兴势不可挡”?\n37. 结合材料回答问题：\n材料1\n平凡铸就伟大，英雄来自人民。“许许多多无怨无悔、倾情奉献的无名英雄，他们以普通 人的平凡书写了不平凡的人生。”\n摘编自《人民日报》(2026年1月5日)\n材料2\n在贵州毕节大山深处，华中农业大学“本禹志愿服务队”研究生支教团成员将运算符号 融入小游戏中，引导孩子们在互动中学习新知识；在西藏日喀则，中央音乐学院“新时代文艺 宣讲师”志愿者用音乐传播思想、用艺术播撒梦想；在京高校近万名志愿者积极参与重大活 动，累计服务时长达40万余小时。\n志愿服务是社会文明进步的重要标志，也是青年学生成长成才的生动课堂。对青年来 说，参加志愿服务不仅是对社会的回馈，也是陶冶情操、锤炼本领的重要过程。对重大活动 中的志愿者，人们也喜欢用“小海豚”“小叶子”“小橘灯”“小青荷”等昵称称呼他们，对他们 以“小我”点亮“大我”的善意善举表示钦佩和感谢。\n青年是参与志愿服务的重要群体。高校肩负立德树人的重要使命，理应主动担当作为， 将志愿服务深度融入育人体系，吸引更多青年加入其中，让青春因志愿服务而闪光，为志愿 服务事业注入蓬勃活力。\n摘编自《光明日报》(2026年4月3日)\n(1) 如何理解“平凡铸就伟大”?\n(2)为什么要鼓励青年参与志愿服务，让青春在志愿服务中闪光?\n38. 结合材料回答问题：\n材料1\n今年5月，习近平主席同特朗普总统在北京举行历史性会晤，共同确立了构建中美建设 性战略稳定关系的两国关系新定位，明确两国朝着合作为主、竞争有度、分歧可控、和平可期 的方向携手努力，探索新时代大国正确相处之道。\n构建中美建设性战略稳定关系，树立正确的战略认知是必须扣好的“第一粒纽扣”。\n摘编自《人民日报》(2026年9月22日)\n材料2\n我们要和平共处。我多次讲，中美两个大国合则两利、斗则俱伤。中美不必讳言竞争，但 竞争应该是良性的、有边界的，应该是你追我赶的赛跑，而不是你输我赢的角斗。中美双方 必须守住不冲突、不对抗的底线，也一定能走出一条两个大国在这个星球上的正确相处之 道。两国军队要保持常态化对话，完善危机沟通和预防机制。“修昔底德陷阱”是可以跨 越的。\n摘自习近平《在白宫欢迎仪式上的致辞》(2026年9月24日，华盛顿)\n(1)如何理解“构建中美建设性战略稳定关系，树立正确的战略认知是必须扣好的‘第一 粒纽扣 ’”?\n(2)为什么说“‘修昔底德陷阱’是可以跨越的”?"}}]}, {"id": "b5", "title": "第5套", "questions": [{"id": "b5-1", "num": 1, "type": "single", "stem": "所谓非共识项目，通常是指在基础研究 油科研多年，常有人问，创新有没有秘诀?要我说，如何快速成功，不太清楚；但怎 么跟失败打交道，我倒是攒了一肚子话。槁科研，谁没摔过跟头?可摔倒了能不能爬起来，还 敢不敢接着跑，才是分出高低的地方。创新果实，往往就藏在屡试屡败后还能“再试一次”的 咬牙坚持里。\n石油开采，并不是有石油就能采得出来、采得充分。我们的使命，就是跟石头缝较劲，通 过创新技术，把岩层深处的油“赶”出来。这条“取油路”,面对的不止81难，而是427难。当 时，我们先后布局3条技术路线，可实验结果始终不及预期。不知多少人来劝过，“别钻牛角 尖了”,但大家始终憋着一股劲。失败不可怕，被失败吓住，那才真的完了。科研就像沙里淘 金，99%的过程都是在筛选杂质，剩下的1%才是梦寐以求的成果。挫折，是在帮助我们别除 错误答案。为激励大家，我在实验室的白板上写下：“第427次失败——但离成功又近了 一步”。\n学会接纳失败，更要从失败中有所得、有所悟。之后，我们没有盲目继续实验，而是沉下 心来，将海量数据逐一梳理、复盘，像破案一般抽丝剥茧，查找漏洞。通过一遍遍论证优化、革 新工艺，最终成功研发出新型驱油剂。如今回望，正是数百次试错让我们摸清了化学剂的反 应规律，为后续技术突破筑牢了根基。做科研，有时就得做个“慢人”。慢，不是等，而是练就 一身“静气”,不急不躁，更不气馁。怕慢，可能就找不到对的路。\n科研，光有韧劲还不够，灵感也必不可少。所谓灵感一现，不是天上掉惊喜，而是来自日 积月累的沉淀。以提升驱油剂稳定性的过程为例，有一次，我偶然看到小石头掉在墙角蜘蛛 网上，打断了几根蛛丝，但蜘蛛网还是整体。新型驱油剂的分子结构，不就如同一张网吗?若 是优化得如蜘蛛网般致密均匀，难题会不会迎刃而解?正是这个灵感，打开了我们的思路。\n看似不经意的灵感，实则源于全身心的投入。为提升化学剂驱油效果，我们在实验室一 待就是十几个小时；为验证一个思路，经常研讨至深夜，甚至梦里都在推演公式。所有努力， 都在为那个瞬间打基础，即使没有蜘蛛网的偶然触动，也会有下一次的灵感涌现。是扎根心 底的痴守，成就了技术突破。团队成功跨越技术壁垒，研发出耐温达85摄氏度的新型黏弹性 颗粒驱油剂。这段经历也让我坚信，努力一定有回报。或许某一天，它就会以灵感的形式悄 然而至。\n摘编自《人民日报》(2026年6月2日)\n(1) 分析“失败不可怕”“学会接纳失败，更要从失败中有所得、有所悟”所体现的真理 与谬误的关系。\n(2)为什么说“即使没有蜘蛛网的偶然触动，也会有下一次的灵感涌现”?\n35.结合材料回答问题：\n材料1\n中共中央总书记、国家主席、中央军委主席习近平近日就建设更高水平平安中国作出重 要指示指出，党的十八大以来，平安中国建设取得显著成效，人民安居乐业、社会安定有序的 良好局面更加巩固，我国成为世界上最安全的国家之一。\n习近平强调，新征程上，要以习近平新时代中国特色社会主义思想为指导，坚定不移贯 彻总体国家安全观，坚持和加强党的全面领导，统筹发展和安全，注重惩防并举、标本兼治， 强化法治支撑、科技赋能，加强国家安全体系和能力建设，提高公共安全治理水平，完善社会 治理体系，防范化解各类风险，在国家更加安全、社会更加有序、治理更加有效、人民更加满 意上持续用力，以更高水平平安中国建设保障中国式现代化行稳致远。\n摘编自《人民日报》(2026年9月29日)\n材料2\n促进社会发展，必须抓好社会治理。党的二十大以来，党中央把社会治理摆在更加重要 的位置。各级党委和政府要适应我国社会发展变化，坚持党建引领，强化法治保障，夯实基 层基础，切实提高社会治理水平。\n安全是发展的前提。必须统筹发展和安全，深入贯彻总体国家安全观，健全国家安全体 系，不断增强经济和社会韧性，有效防范化解各类风险，全力维护国家安全和社会稳定。\n摘自习近平《在省部级主要领导干部学习贯彻党的二十届四中全会精神专题研讨班上的讲话》\n(《求是》2026年第9期)\n(1)为什么“必须统筹发展和安全”?\n(2)如何理解“切实提高社会治理水平”?\n36.结合材料回答问题：\n材料1\n我们党在新民主主义革命时期的历史共有28年，这28年以遵义会议为界，正好可以划 分为前14年和后14年。前14年，我们党犯了一次右倾、三次“左”倾的错误，中国革命遭受 了两次重大挫折，一次是大革命的失败，一次是中央革命根据地第五次反“围剿”的失败，红 军被迫进行战略转移；后14年，从遵义会议开始，我们党重新奋起，团结带领人民克服了一个 又一个艰险、战胜了一个又一个挑战，先是取得了长征的胜利，度过了最艰难的时期，开创了 中国革命新局面，尔后又陆续取得了抗日战争的胜利、解放战争的胜利，推翻帝国主义、封建 主义、官僚资本主义三座大山，最终建立中华人民共和国，实现了民族独立、人民解放，开启 中国历史发展的新纪元。在这样的前后对比中，我们可以清晰地看到，遵义会议是一个重要 的标识和转折。遵义会议后，党和红军转危为安、化险为夷，中国革命斗争的局面从被动转 向主动，从此中国革命事业就不断从胜利走向新的更大的胜利。\n摘编自《人民日报》(2025年1月7日)\n材料2\n党确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主 义思想的指导地位，反映了全党全军全国各族人民共同心愿，对新时代党和国家事业发展、 对推进中华民族伟大复兴历史进程具有决定性意义。\n摘自《中共中央关于党的百年奋斗重大成就和历史经验的决议》\n(1)遵义会议前后中国革命事业发生天翻地覆历史巨变的原因何在?\n(2)如何理解“两个确立”“对新时代党和国家事业发展、对推进中华民族伟大复兴历史 进程具有决定性意义”?\n37.结合材料回答问题：\n材料1\n2026年是“十五五”开局之年。锐始者必图其终，成功者先计于始。我们要锚定目标任 务，坚定信心、乘势而上，扎实推动高质量发展，进一步全面深化改革开放，推进全体人民共 同富裕，续写中国奇迹新篇章。\n山海寻梦，不觉其远；前路迢迢，阔步而行。让我们拿出跃马扬鞭的勇气，激发万马奔腾 的活力，保持马不停蹄的干劲，一起为梦想奋斗、为幸福打拼，把宏伟愿景变成美好现实。\n摘自习近平《二○二六年新年贺词》\n材料2\n今天的中国，是赓续民族精神的中国。\n伟大奋斗精神是中华民族最宝贵的精神财富、最丰沛的精神力量。\n困难面前豁得出，关键时候顶得上。在地震、洪水、干旱、山火等自然灾害面前，“一幕幕 舍生取义、守望相助的场景感人至深，英雄的事迹永远铭记在我们心中”。\n大道如砥，奋斗如歌。\n新时代是奋斗者的时代。有了奋斗精神的强大支撑，才有“当惊世界殊”的发展成就、 “平视世界”的从容自信、“没有任何力量能够阻挡”的战略定力。\n时间属于奋进者，历史属于奋进者。我们通过奋斗，披荆斩棘，走过了万水千山。我们还 要继续奋斗，勇往直前，创造更加灿烂的辉煌!\n摘编自《人民日报》(2026年1月5日)\n材料3\n“奋斗是青春最亮丽的底色，行动是青年最有效的磨砺。”\n对于广大青年朋友，习近平总书记饱含期许，他叮嘱青年“心有所信，方能行远”“人生的 扣子从一开始就要扣好”;寄语青年“青春由磨砺而出彩，人生因奋斗而升华”“奋斗是青春最 亮丽的底色”;勉励青年要有“自找苦吃”的精气神、“把个人的理想追求融入党和国家事业 之中 ”。\n“五四”青年节到来之际，让我们重温习近平总书记对青年朋友的殷殷寄语，勇担时代责 任，以奋斗姿态激扬青春、追逐梦想。\n摘编自央视网(2026年5月4日)\n(1) 如何理解“伟大奋斗精神是中华民族最宝贵的精神财富、最丰沛的精神力量”?\n(2) 如何理解“奋斗是青春最亮丽的底色”?\n38.结合材料回答问题：\n材料1\n2026年7月，中华人民共和国商务部发布《关于所谓“产能过剩”问题的中方立场》的文 件，文件指出：\n经济全球化为世界经济增长提供了强劲动力，促进了商品和资本流动、科技和文明进 步、各国人民交往，是不可阻挡的历史大势。\n中方始终认为，看待产能问题，要坚持全面、客观、公正的态度，既要历史地看、也要辨证 地看，秉持开放合作、互利共赢，共同化解矛盾和分歧。\n中国现代化产业发展对世界不是“中国冲击2.0”而是“中国机遇2.0”。\n美国等西方国家谬称中国产业发展威胁西方国家垄断地位，挤压南方国家发展空间，抛 出了所谓“中国冲击2.0”论调。这不符合事实，是站不住脚的。\n摘编自《人民日报》(2026年7月29日)\n材料2\n不久前，中方携手各方推动成立了世界人工智能合作组织，并面向金砖国家等建设国际 人工智能应用合作中心，为全球尤其是全球南方国家加强人工智能合作搭建了重要平台，欢 迎金砖各国积极参与。在此，我提出金砖国家人工智能赋能新型工业化倡议，愿同各方共同 打造更多研发和应用成果，深化产业链供应链合作。事实必将证明，“脱钩断链”阻碍不了我 们的发展进程，“小院高墙”只会禁锢自己、割裂世界。\n摘自习近平《共担时代责任勇做先锋力量——在金砖国家领导人\n第十八次会晤第一阶段会议的讲话》\n(1) 为什么说“中国现代化产业发展对世界不是‘中国冲击2.0’而是‘中国机遇2.0'”?\n(2) 分析“‘脱钩断链’阻碍不了我们的发展进程，‘小院高墙’只会禁锢自己、割裂世界”。"}}]}, {"id": "b6", "title": "第6套", "questions": [{"id": "b6-1", "num": 1, "type": "single", "stem": "“加快构建应用场景和生态体系”“实施新技术新产品新场景大规模 n三、材料分析题：第34~38小题，每小题10分，共50分。要求结合所学知识分析材料回 答问题。\n34. 结合材料回答问题：\n海南三亚南繁育种基地内，科研人员干劲十足，一身汗一脚泥……不久前，由中国科学 院院士钱前领衔培育的新型水稻“小薇”,在试验田里迎来丰收，实现亩产超400公斤。这种 身高不足30厘米的超矮秆水稻，蕴含着巨大潜力：不仅适合高密度的工厂化“垂直农场”,更 在问天实验舱完成了太空旅行，为未来的“太空农场”播下了希望。从一株奇特的“小矮稻”, 到广袤宇宙的“太空农场”,这背后，是钱前在水稻种质资源领域四十余载的漫漫求索。\n追求完美的基因——更高产、更健壮，在传统种质研究中似乎是天经地义的。但在钱前 的试验田里，他却对那些“病歪歪”“瘦弱”“奇形怪状”的植株情有独钟。“经常有人开玩笑， 说别人的水稻都又高又壮，你怎么净挑这些不起眼的?”但在钱前看来，这些性状各异的“异 类”,却是基因多样性最直观的体现。他举例说：“经典病例往往是某个医学领域的突破口。\n农学也是如此，一株水稻如果长得很健康，反而找不到研究的抓手。但通过精细研究‘奇形 怪状’的突变体，就能知道是哪个基因出了问题，从而理解它的正常功能。一个突变体就是 一把钥匙，能打开一扇基因功能的大门。”\n从与众不同的视角出发，钱前带领团队年复一年地在田间实践，最终创制了包含近5万 份材料的水稻突变体库。“它就像一个巨型的图书馆，珍藏着水稻几万个基因的神奇故事， 能让科研人员快速找到研究抓手，把复杂的性状拆解开来。”钱前说。\n为什么要如此执着于收集和创造这些千奇百怪的“基因”呢?\n“地球曾经历过无数次灾难，但生命总能延续，奥秘就在于基因的多样性。”钱前解释说。 在他看来，每一个看似微不足道的基因，都可能蕴含着应对某种未知挑战的独特密码——有 的能抵御干旱，有的能耐受盐碱。守护和丰富基因多样性，就是在为未来可能出现的各种危\n机储备宝贵的解题方案。\n“我们不知道未来会面临什么,但应对方案很可能就藏在这些看似不起眼的基因里。”钱 前说。\n摘编自《人民日报》(2026年4月22日)\n(1) 指出从“奇形怪状”的植株人手打造基因宝库所涉及的唯物辩证法基本范畴。\n(2)“从与众不同的视角出发”对我们增强辩证思维能力和创新思维能力有何启示?\n35. 结合材料回答问题：\n为深入抓好习近平党建思想学习贯彻工作，中央党的建设工作领导小组印发《关于学习\n贯彻习近平党建思想的通知》(以下简称《通知》)。\n《通知》指出，党的十八大以来，以习近平同志为核心的党中央围绕建设什么样的长期执 政的马克思主义政党、怎样建设长期执政的马克思主义政党的重大时代课题，提出一系列管 党治党、兴党强党新理念新思想新战略，形成习近平党建思想。\n《通知》强调，要深入学习领会习近平党建思想的科学内涵。深刻领会“坚持党的领导是 中国特色社会主义最本质的特征”;深刻领会“坚持党中央集中统一领导”是党的领导的最高 原则；深刻领会“坚持全面从严治党”是新时代党的建设的战略方针；深刻领会“坚持不忘初 心、牢记使命”是党的宗旨立场和价值取向；深刻领会“坚持以党的政治建设为统领”是新时 代党的建设的根本要求；深刻领会“坚持用党的创新理论凝心铸魂”是党的思想建设的根本 任务；深刻领会“坚持锤炼坚强党性”是党员、干部的终身课题；深刻领会“坚持健全上下贯 通、执行有力的组织体系”是党的优势所在、力量所在；深刻领会“坚持建设堪当民族复兴重 任的高素质干部队伍”是关系党和国家事业的关键性问题；深刻领会“坚持推进作风建设常 态化长效化”是保持党同人民群众血肉联系的有效途径；深刻领会“坚持用严明的纪律管全 党治全党”是全面从严治党的治本之策；深刻领会“坚持一体推进不敢腐不能腐不想腐”是全\n面从严治党的重要方略和反腐败斗争的基本方针；深刻领会“坚持制度治党、依规治党”是全 面从严治党的长远和根本之策；深刻领会“坚持落实管党治党政治贵任”是全面从严治党需 要牢牢牵住的“牛鼻子”。\n摘编自《人民日报》(2026年6月19日)\n(1) 如何认识习近平党建思想的地位与作用?\n(2)怎样深刻领会“坚持以党的政治建设为统领”是新时代党的建设的根本要求?\n36.结合材料回答问题：\n材料1\n孙中山先生的伟大，不仅在于他领导了辛亥革命，而且在于他为了实现革命理想，与时 俱进完善自己的革命理念和斗争方略，毫不妥协同逆时代潮流而动的各种势力进行斗 争……毛泽东同志把三民主义纲领、统一战线政策、艰苦奋斗精神并称为孙中山先生“留给 我们的最中心最本质最伟大的遗产”,是“对于中华民族最伟大的贡献”。\n中国共产党人是孙中山先生革命事业最坚定的支持者、最忠诚的合作者、最忠实的继 承者。\n摘自习近平《在纪念孙中山先生诞辰150周年大会上的讲话》\n材料2\n2026年11月12日是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱孙 中山先生诞辰160周年纪念日。为缅怀孙中山先生为民族独立、社会进步、人民幸福所建立 的不朽功勋，学习、继承和发扬孙中山先生的爱国思想、革命意志和进取精神，巩固和发展海 内外中华儿女大团结，巩固和发展最广泛的爱国统一战线，推动两岸关系和平发展、推进祖 国统一大业，最大限度地把全民族的力量凝聚起来，为以中国式现代化全面推进强国建设、 民族复兴伟业而不懈奋斗，中国人民政治协商会议第十四届全国委员会常务委员会决定届 时举行隆重的纪念活动。\n摘编自《人民日报》(2025年11月2日)\n(1)孙中山先生为了实现革命理想，如何“与时俱进完善自己的革命理念和斗争方略，毫 不妥协同逆时代潮流而动的各种势力进行斗争”?\n(2)结合中国共产党在大革命中的作用，说明中国共产党人是孙中山先生革命事业最坚定 的支持者、最忠诚的合作者。\n37.结合材料回答问题； 材料1\n清明假期，各地干部群众前往革命老区、革命纪念馆、烈士陵园等瞻仰凭吊，回望峥嵘岁 月、汲取信仰力量，弘扬红色文化、赓续英烈精神。\n抚今追昔，一场场深情的告慰，让历史的丰碑于追忆中愈显巍峨。\n英雄是民族最闪亮的坐标。祭英，是为了铭记永不磨灭的荣光。\n4月5日上午，上海市龙华烈士陵园，晨光斜照花岗岩广场。9时整，国歌声起，五星红旗 冉冉升起。面向巍然矗立的无名烈士墓，礼兵缓步上前，敬献花篮。全体人员肃立默哀，向英 雄烈士行三鞠躬礼。\n今年清明，上海在龙华烈士陵园等烈士纪念设施开展主题祭扫活动。活动现场，秦鸿钓 烈士后人秦岭在石碑前动情追忆先辈英勇事迹。少先队员们诵读着《青松礼赞》,稚嫩的声 音透着坚定。不少市民俯下身，掏出白毛巾擦拭墓碑。\n英魂永驻，浩气长存，家国情怀在追思传承中历久弥坚。\n摘编自《人民日报》(2026年4月6日)\n材料2\n平凡岗位可建不凡之功，无名坚守可成不朽之名。\n刘腊梨脑、刘早狗子、吴细豆子……江西瑞金革命烈士陵园，一个个“不像名字的名字” 静静镌刻在墙壁之上。这些稚气的名字，属于长征路上年少殉国的红军烈士。按当地旧俗， 没成年的孩子，不起大名。这群连大名都没有的孩子，却扛起了山河的重量。\n乳名质朴，信仰如山；生命平凡，气节如钢。回望长征路，牺牲者万千。一部长征史诗，犹 如普通群众、红军将士以血肉铺就的精神之途。读懂长征，最动人的底色，便是以无名之身 躯，筑有名之山河。\n何谓无名?姓名不载史册，事迹鲜为人知。长征之途漫漫，处处有牺牲。\n湘江血战惊天地，年轻战士前仆后继、浴血突围，将生命永远留在了江河两岸。“三年不 饮湘江水，十年不食湘江鱼”,成为老百姓对英烈朴素又深切的缅怀。\n过雪山草地，单衣草鞋的战士逆风前行，“管做饭的饿死了，管衣服的冻死了，有力气的 累死了”。长征路上铸丰碑，漫天风雪见证红军的信仰与本色。\n多少年少战士、工农子弟、担架卫士，来不及留下只言片语，便用血肉之躯撕开封锁线、 铺就前行路。平凡到渺小、普通到无名，却纯粹到赤诚、坚定如磐石。真正的无名，不是平庸 无闻，而是为大义隐身、为家国埋名。\n何谓有名?精神永续、山河铭记、时代传承。个人名号会湮灭，精神丰碑将长存。\n摘编自《人民日报》(2026年10月20日)\n(1) 为什么要祟尚英雄、缅怀先烈?\n(2) 结合英雄的“无名”与“有名”,说明新时代青年应当怎样更好地实现人生价值、升 华人生境界。\n38.结合材料回答问题：\n材料1\n最近，两则与绿色发展有关的新闻，耐人寻味。\n一则是“车”。\n今年6月，中国车企占欧洲插电式混合动力汽车交付量的34%,创下历史新高；中国主要 电动踏板车生产商的海外销售，今年预计增长约70%。“中国车”正引领全球绿色出行新 风尚。\n一则是“法”。\n8月15日，生态环境法典将正式施行。这部习近平生态文明思想法治化、系统化、制度 化的集大成之作，也是新时代推进全面依法治国的标志性成果，将为全球环境治理送上“独 特的中国礼物”。\n“在当前一些国家重新强化高碳发展路径的背景下，中国持续推进生态环境制度建设， 更凸显了中国在全球环境治理中的引领作用。”墨西哥城自治大学国际政治研究员爱德华 多 ·齐利如是说。\n去年7月，《习近平生态文明文选》第一卷出版发行。\n全面把握习近平生态文明思想对全球生态文明建设作出的原创性贡献，深刻领悟这一 重要思想的世界意义，既要从文献原著中汲取智慧，也要在现实探索中寻找答案。从“参与 者”“贡献者”“引领者”三个视角，更能感悟中国绿色发展何以造福世界。\n摘编自《人民日报》(2026年8月14日)\n材料2\n“我们要坚持独立自主的和平外交政策，推动落实四大全球倡议，推动构建人类命运共 同体，为变乱交织的世界注入更多确定性和正能量。”\n在庆祝中华人民共和国成立77周年招待会上，习近平总书记铿锵有力的话语，展现中国 共产党人为人类谋进步、为世界谋大同的天下情怀，彰显中国与世界共享机遇、共谋发展的 大国担当。\n“我们有坚定推进中国式现代化的决心，也有以高水平对外开放同世界共享发展机遇的 胸怀，将以自身发展为全球经济增长注入信心和动力。”这是古老东方大国一步步迈向伟大 复兴给世界带来的新气象、新塑造。\n摘编自《人民日报》(2026年10月4日)\n(1) 从“参与者”“贡献者”“引领者”的视角，说明“中国绿色发展何以造福世界”。\n(2)如何理解中国“为变乱交织的世界注人更多确定性和正能量”?"}}]}, {"id": "b7", "title": "第7套", "questions": [{"id": "b7-1", "num": 1, "type": "single", "stem": "马克思指出：“人类始终只提出自己能够解决的任务，因为只要仔细考察就可以发现，任务本 身，只有在解决它的物质条件已经存在或者至少是在生成过程中的时候，才会产生。”这一论 断契合了", "options": {"A": "“物质生活的生产方式制约着整个社会生活、政治生活和精神生活的过程”的观点", "B": "“政治状态是经济状况的决定性的原因”的观点", "C": "“ 凡是合乎理性的都是现实的”的观点", "D": "“ 历史是自由意识的进展”的观点"}}, {"id": "b7-2", "num": 2, "type": "single", "stem": "2026年7月8日，北京人民大会堂群星闪耀、荣光汇聚。习近平总书记为国家最高科学技术奖 获得者等颁奖并发表重要讲话。“科技创新要突出应用导向”“产业创新要提出科学问题”,给 出了科技创新与产业创新深度融合的方向指引。“产业创新要提出科学问题”这一要求蕴含 的哲学道理主要是", "options": {"A": "实践水平的提高有赖于认识水平的提高", "B": "实践是认识发展的动力", "C": "认识总是超前于实践", "D": "认识活动是客观规律性与主观能动性统一的基础"}}, {"id": "b7-3", "num": 3, "type": "single", "stem": "某资本家投资100万元，其预付资本的有机构成是4:1,每次投资的剩余价值率为150%,该 资本家每次投资的利润为", "options": {"A": "20 万元", "B": "25 万元", "C": "30万元", "D": "35万元"}}, {"id": "b7-4", "num": 4, "type": "single", "stem": "在生产技术水平不断提高的条件下，随着资本积累的增长，必然伴随着资本的积聚和集中，使 个别资本的规模日益增大。资本集中是指个别资本通过结合而形成较大的资本。资本集中最 强有力的杠杆是", "options": {"A": "投资和借贷", "B": "竞争和信用", "C": "资本原始积累", "D": "生产自动化"}}, {"id": "b7-5", "num": 5, "type": "single", "stem": "认清中国国情，是解决中国革命问题的基本前提。1939年毛泽东在《中国革命和中国共产党》 中指出，中国是在许多帝国主义国家的统治或半统治之下，实际上处于长期的不统一状态，再\n加上土地广大，其结果是", "options": {"A": "帝国主义侵略势力日益成为直接统治中国的决定性力量", "B": "封建经济在社会经济生活中占着显然的优势", "C": "经济、政治和文化的发展表现出极端的不平衡", "D": "资产阶级成为资本-帝国主义压迫、奴役中国人民的社会基础"}}, {"id": "b7-6", "num": 6, "type": "single", "stem": "1957年2月，毛泽东作了《关于正确处理人民内部矛盾的问题》的报告，指出：“在社会主义社 会中，基本的矛盾仍然是生产关系和生产力之间的矛盾，上层建筑和经济基础之间的矛盾。” 社会主义社会的基本矛盾同以往社会的基本矛盾“具有根本不同的性质和情况”。这里所说 的“不同的”“情况”是指", "options": {"A": "社会主义社会的矛盾反映在政治上可以划分为敌我矛盾和人民内部矛盾", "B": "社会主义社会基本矛盾运动是“又相适应又相矛盾”", "C": "社会主义社会的基本矛盾既是对抗性的又是非对抗性的", "D": "社会主义社会的所有矛盾都必须采用民主的方法来解决"}}, {"id": "b7-7", "num": 7, "type": "single", "stem": "新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有高科技、高效 能、高质量特征，符合新发展理念的先进生产力质态。新质生产力的显著特点是创新，这种创 新包括\n①生产资料所有制和产品分配层面的创新\n②技术和业态模式层面的创新\n③管理和制度层面的创新\n④价值观和意识形态层面的创新", "options": {"A": "①②", "B": "①③", "C": "②④", "D": "②③"}}, {"id": "b7-8", "num": 8, "type": "single", "stem": "新时代以来，以习近平同志为核心的党中央高度重视服务业的发展。目前，服务业已经成为我 国国民经济第一大产业，对外开放水平也持续提升，由此带动我国服务贸易跃居世界前列、服 务业成为吸收外资主要渠道。努力开创服务业高质量发展新局面，要深刻认识和把握科学方 法与基本路径。促进服务业优质高效发展的基本路径是", "options": {"A": "科技赋能", "B": "需求牵引", "C": "改革攻坚", "D": "扩能提质"}}, {"id": "b7-9", "num": 9, "type": "single", "stem": "建设美丽中国是全面建设社会主义现代化国家的重要目标。“十五五”时期是美丽中国建设 承前启后、扩面提质，实现生态环境根本好转的关键阶段。美丽中国建设，作为牵引的是", "options": {"A": "碳达峰碳中和", "B": "健全生态文明制度体系", "C": "统筹产业结构调整、污染治理、生态保护、应对气候变化", "D": "协同推进降碳、减污、扩绿、增长"}}, {"id": "b7-10", "num": 10, "type": "single", "stem": "洋务运动是在19世纪60年代初第二次鸦片战争结束后，在清政府镇压太平天国起义与捻军 起义的过程中兴起的。维新运动发生于19世纪90年代。维新运动与洋务运动的主要不同 点在于", "options": {"A": "洋务运动实现了预期目标，维新运动昙花一现", "B": "洋务运动维护封建统治，维新运动否定封建主义", "C": "洋务运动只学习西方技术，维新运动主张学习西方政治制度", "D": "洋务运动依靠封建统治阶级中的部分成员，维新运动依靠下层群众"}}, {"id": "b7-11", "num": 11, "type": "single", "stem": "在新民主主义革命时期，中国共产党与国民党实行过两次合作，第一次是建立国民革命联合 战线，第二次是建立抗日民族统一战线。以下选项中正确反映第一次国共合作的是", "options": {"A": "广泛的民族性和复杂的阶级矛盾", "B": "国共双方有政权有军队的合作", "C": "合作双方采取党外合作的组织形式", "D": "合作双方具有共同的政治基础"}}, {"id": "b7-12", "num": 12, "type": "single", "stem": "1956年9月15日至27日，中国共产党第八次全国代表大会在北京举行。中共八大正确分析 了国内形势和主要矛盾的变化，明确提出新形势下党和人民的主要任务。大会肯定“三个主 体，三个补充”思想，即以国家经营和集体经营、计划生产、国家市场三者为主体，以个体经 营、自由生产、自由市场三者为补充。这", "options": {"A": "在理论上完全突破了苏联计划经济模式", "B": "为克服苏联模式弊端提供了重要启示", "C": "初步形成了社会主义市场经济体制", "D": "对过渡时期总路线的提出具有重要意义"}}, {"id": "b7-13", "num": 13, "type": "single", "stem": "中国共产党作为马克思主义执政党，不但要有强大的真理力量，而且要有强大的人格力量。 人格力量集中体现为党的", "options": {"A": "正确理论", "B": "群众路线", "C": "优良作风", "D": "牺牲精神"}}, {"id": "b7-14", "num": 14, "type": "single", "stem": "《习近平法治思想学习纲要(2025年版)》将“坚持依法治国和依规治党有机统一”作为习近平法 治思想核心要义的“第十二个坚持”,进一步丰富了习近平法治思想的科学内涵。“坚持依法 治国和依规治党有机统一”的根本政治前提是", "options": {"A": "“党的领导和社会主义法治是一致的”", "B": "“既依据宪法法律治国理政，又依据党内法规管党治党、从严治党”", "C": "“ 发挥依法治国和依规治党的互补性作用”", "D": "“坚持依法治国与制度治党、依规治党统筹推进、一体建设”"}}, {"id": "b7-15", "num": 15, "type": "single", "stem": "《中华人民共和国生态环境法典》于2026年3月12日第十四届全国人民代表大会第四次会 议通过，自2026年8月15日起施行。生态环境法典的魂和纲是", "options": {"A": "坚持以人民为中心", "B": "绿色低碳发展", "C": "新发展理念", "D": "习近平生态文明思想"}}, {"id": "b7-16", "num": 16, "type": "single", "stem": "2026年9月1日，国家主席习近平在比什凯克召开的“上海合作组织+”会议上发表题为《共 同倡导平等有序的世界多极化实现更加公正合理的全球治理》的讲话。讲话强调，中国作为 负责任大国，积极倡导平等有序的世界多极化。平等有序的世界多极化的根本原则是", "options": {"A": "主权平等、相互尊重", "B": "均衡有序、遵守法治", "C": "多边主义、对话协商", "D": "互利共赢、普惠包容\n二、多项选择题：第17~33小题，每小题2分，共34分。下列每小题给出的四个选项中， 至少有两个选项是符合题目要求的。多选、少选或错选均不得分。"}}, {"id": "b7-17", "num": 17, "type": "multiple", "stem": "纳米是非常小的长度单位，1纳米等于十亿分之一米。当物质进入纳米尺度后，我们熟悉的 许多材料会展现出完全不同的性质。比如纳米大小的黄金颗粒，颜色可以从红色到紫色发 生变化，还表现出极强的催化活性。微观世界里，颜色不是来自金本身的金属光泽，而是量 子效应与表面效应在起作用。简单来说，进入纳米世界后，材料不只是“变小了”,还拥有了\n新的能力。在这样的微观世界里，科学家可以操控原子和分子，设计制造具有特殊性能的新 材料、新器件，这就是纳米制造。纳米尺度上物质发生的新变化表明", "options": {"A": "世界的物质统一性是多样性的统一", "B": "事物的性质是由其所处的外部时空决定的", "C": "物质的具体形态和具体结构是可变的、相对的", "D": "认识就是在不断推翻先前的真理中不断发展的"}}, {"id": "b7-18", "num": 18, "type": "multiple", "stem": "相传北宋诗文大家王安石看到南方一位诗人的两句诗：“明月当空叫，黄犬卧花心”,觉得可 笑，明月怎么会叫?黄犬又怎么卧花心? 他不去了解作者这样写的原委，不知道作者家乡有 一种小鸟名叫“明月”,有一种昆虫名叫“黄犬”,而是想当然地改成“明月当空照，黄犬卧花 荫”。这样虽然句子合乎常理，但与作者表达的原意相去甚远了。王安石的错误说明", "options": {"A": "真理是多元的，不同主体有不同真理", "B": "矛盾具有特殊性，必须具体问题具体分析", "C": "由实践到认识的第一次飞跃比认识到实践的第二次飞跃更重要", "D": "认识主体已有的知识结构会影响认识结果"}}, {"id": "b7-19", "num": 19, "type": "multiple", "stem": "资本主义生产的目的是获得利润。不同生产部门的资本家之间为了得到尽可能多的利润必 然展开激烈的竞争从而导致利润平均化。平均利润形成后", "options": {"A": "商品价值就转化为生产价格", "B": "每一个部门获得的利润都等于该部门生产的剩余价值", "C": "价值规律的实现形式发生了变化", "D": "每个资本家所得利润的多少不再与他对本企业工人的剥削程度有关"}}, {"id": "b7-20", "num": 20, "type": "multiple", "stem": "第二次世界大战后，资本主义国家为尽快恢复国民经济，在继续发挥市场机制主导性作用的 同时，开始对经济进行全面干预。但是，从20世纪70年代起，随着资本主义经济陷人滞胀和 新自由主义思潮的泛滥，西方国家普遍走上强化市场调节、弱化政府干预的道路，即", "options": {"A": "通过国有企业私有化来提升经济竞争力", "B": "通过福利制度改革，减少政府的财政负担", "C": "通过强化贸易保护，减少贸易逆差", "D": "通过放松对经济和金融的管制，释放经济活力"}}, {"id": "b7-21", "num": 21, "type": "multiple", "stem": "19世纪中叶，马克思、恩格斯把社会主义由空想变为科学。为这一飞跃奠定理论基础的是", "options": {"A": "阶级斗争学说", "B": "劳动价值论", "C": "唯物史观", "D": "剩余价值学说"}}, {"id": "b7-22", "num": 22, "type": "multiple", "stem": "中国共产党在各个历史时期都高度重视管党治党，勇于坚持真理、修正错误，在依靠自身力 量和人民支持解决自身问题中不断强大，成为党和人民事业的坚强领导核心。在新民主主 义革命时期，中国共产党把党的建设作为伟大工程，在加强自身建设中积累了丰富的经验， 归纳起来主要有", "options": {"A": "必须把思想建设始终放在党的建设的首位", "B": "必须在任何时候都重视党的组织建设", "C": "必须重视党的作风建设", "D": "必须联系党的政治路线加强党的建设"}}, {"id": "b7-23", "num": 23, "type": "multiple", "stem": "中国式现代化是全体人民共同富裕的现代化。这是中国式现代化区别于西方现代化的显著 标志。浙江是我国高质量发展建设共同富裕示范区，在共同富裕的探路征程上不断迈出新 步伐、取得新成效。浙江在共同富裕的探路征程上紧扣的主攻方向是", "options": {"A": "缩小地区差距", "B": "缩小城乡差距", "C": "缩小收入差距", "D": "缩小工农差距"}}, {"id": "b7-24", "num": 24, "type": "multiple", "stem": "公有制经济是全体人民的宝贵财富。坚持公有制主体地位不能动摇，国有经济主导作用不 能动摇，这是我国各族人民共享发展成果的制度性保证，也是巩固党的执政地位、坚持我国 社会主义制度的重要保证。国有企业是", "options": {"A": "中国特色社会主义的重要物质基础和政治基础", "B": "我们党执政兴国的重要支柱和依靠力量", "C": "社会主义市场经济中资源配置的决定性力量", "D": "中国特色社会主义经济的“顶梁柱”"}}, {"id": "b7-25", "num": 25, "type": "multiple", "stem": "打太极、包饺子、学汉语曾经是传播中华文化的“老三样”,而今天，网络文学、网络影视剧、网 络游戏这“新三样”,正以惊人的速度走向世界，成为中国文化出海的生力军。从中华道义到 水墨意境，从历史史诗到现代故事，海外观众在追剧、阅读和游戏中，不仅看到了中国的文化 符号，更感受到其中的精神气质和创新活力。文化“新三样”出海有利于", "options": {"A": "中国文化传播从“走出去”向“走进去”转变", "B": "提高国家文化软实力和中华文化影响力", "C": "为传播力、影响力的真正触达提供新路径", "D": "向世界展现真实、立体、全面的中国"}}, {"id": "b7-26", "num": 26, "type": "multiple", "stem": "习近平总书记指出：“我们捍卫和平、维护安全、慑止战争的手段和选择有多种多样，但军事 手段始终是保底手段。”只有以强大军事实力为后盾", "options": {"A": "政治安全、国土安全等其他安全才能托底", "B": "国家的总体安全和人民的幸福生活才有保障", "C": "实现国家繁荣富强的主动权才能牢牢掌握在自己手中", "D": "当代中国价值观念才能走向世界"}}, {"id": "b7-27", "num": 27, "type": "multiple", "stem": "1931年11月，中华苏维埃第一次全国代表大会在江西瑞金召开。大会通过了《中华苏维埃 共和国宪法大纲》以及土地法令、劳动法等，选举产生了中华苏维埃共和国中央执行委员会， 成立了中华苏维埃共和国临时中央政府，毛泽东当选为主席。中华苏维埃共和国", "options": {"A": "是中国历史上第一个全国性的各个革命阶级联合专政的政权", "B": "是中国共产党在局部地区执政的重要尝试", "C": "扩大了党和红色政权的影响，一定程度上加强了对处于被分割状态的各根据地的中枢指 挥作用", "D": "推动了各根据地的政权、经济、文化教育和党的自身建设，开创了土地革命战争新局面"}}, {"id": "b7-28", "num": 28, "type": "multiple", "stem": "全民族抗战伊始，中共中央就提出必须在统一战线中坚持独立自主原则。为此，共产党必须 保持在思想上、政治上和组织上的独立性，放手发动群众，壮 步推向更深处。换句话说，好奇心是科学的起点。\n好奇心是在问“为什么是这样”,想象力则在追问“为什么不能是那样”。如果说好奇心 提出问题，想象力则为回答问题提供蓝图。\n科学并不是被动地等待现实自己开口。面对同样的事实，真正拉开人与人距离的，是有 人能够在现有经验之外，再往前跨出一步，在头脑中构造出一种新的可能。没有这一步，很 多科学史上的突破根本不会发生。\n伽利略以思想实验突破亚里士多德物理学的长期束缚。自由落体思想实验，成为广义 相对论等效原理的思想雏形；斜坡滚球的思想实验，则揭示了惯性运动的基本规律，为牛顿 第一定律奠定基础。他不是靠“看见了什么新现象”才前进了一步，而是靠想象力，在头脑中 先搭出一个情境，再用逻辑把旧观念逼到矛盾之中。\n科学的想象力，很多时候就是这样工作的。它不是脱离现实的幻想，而是在现实还没有 直接展开之前，先在思想中开辟一条路。这种以想象构建理想场景进行严谨的逻辑推演，成 为现代科学研究的重要范式。\n爱因斯坦16岁时反复想过一个问题：如果我追着一束光一起跑，会看到什么?按经典物 理学，这束光在他眼里似乎应该“静止”下来；可麦克斯韦方程又不允许出现这种情况。这便 是他提出狭义相对论的起点。1907年，爱因斯坦又拓展了他的想象力：一个人在密闭房间 里，究竟怎么区分自己是站在地球上，还是在太空中被加速“往上推”?这便是等效性原理的 引子，成为广义相对论的关键入口。\n摘编自《人民日报》(2026年3月27日)\n(1)从真理的绝对性和相对性辩证关系的视角看，为什么需要“对既有认识的质疑”?\n(2)说明认识活动中非理性因素对科学创新有何重要意义。\n35. 结合材料回答问题：\n材料1\n新时代以来，随着我国社会主要矛盾发生历史性变化，我国经济发展的空间结构发生深 刻变化，中心城市和城市群正在成为承栽发展要素的主要空间形式。习近平总书记精准杞 握我国社会主要矛盾变化在空间维度的集中反映，创造性地将区域协调发展作为破解发展 不平街不充分问题的重要抓手，亲自谋划、亲自部署、亲自推动京津冀协同发展、长江经济带 发展、粤港澳大湾区建设、长三角一体化发展、黄河流域生态保护和高质量发展等重大战略 实施，推动海南自由贸易港全岛封关运行，一以贯之推进实施东部率先发展、中部崛起、西部 大开发、东北全面振兴战略，引领我国区域协调发展取得历史性成就。\n摘编自《人民日报》(2026年2月24日)\n材料2\n开展东西部协作，是党中央着眼推动区域协调发展、促进共同富裕作出的重大决策。 习近平总书记对常态化做好东西部协作工作作出重要指示强调，“东西部协作开展30年来， 在助力脱贫攻坚、促进区域协调发展等方面发挥了重要作用，彰显了我们党的政治优势和我 国社会主义制度的优越性”。这一重要指示指明了东西部协作的重要意义和价值取向，为常 态化做好东西部协作工作提供了根本遵循。新征程上，必须深入学习贯彻习近平总书记对 常态化做好东西部协作工作的重要指示精神，不断提升协作质效，实现互利共赢、共同发展。\n摘编自《光明日报》(2026年9月9日)\n(1)为什么要促进区域协调发展?\n(2) 东西部协作如何“彰显了我们党的政治优势和我国社会主义制度的优越性”?\n36.结合材料回答问题：\n材料1\n一百多年来，我们党从小到大、由弱到强，从最初50多名党员发展为拥有1亿多名党员 的世界第一大执政党；从小小红船到领航“中国号”的巍巍巨轮，党的建设一以贯之、与时 俱进。\n革命战争年代，1927年三湾改编，将党的支部建在连上。1929年古田会议，确立思想建 党、政治建军的原则。1939年，毛泽东同志提出党的建设“伟大的工程”这一重大命题。新中 国初期，中共中央即决定成立中央及各级党的纪律检查委员会，严厉惩处党内腐败分子。党 的十一届三中全会后，提出“执政党应该是一个什么样的党，执政党的党员应该怎样才合格， 党怎样才叫善于领导”的重大问题。1994年，党的十四届四中全会提出党的建设“新的伟大 的工程 ”。\n将全面从严治党纳入“四个全面”战略布局，深入推进新时代党的建设新的伟大工程。\n党的十八大以来，以习近平同志为核心的党中央围绕建设什么样的长期执政的马克思主义 政党、怎样建设长期执政的马克思主义政党的重大时代课题，提出一系列新理念新思想新战 略，形成习近平党建思想，为加强新时代党的建设提供了根本遵循。\n摘编自《光明日报》(2026年7月1日)\n材料2\n“用延安作风打败西安作风”一语，出自延安时期毛泽东同志与党内同志的一场经典谈 话。1940年秋，延安马列学院特地安排邓力群等四位同志前往杨家岭迎接毛泽东同志来作 报告。毛泽东同志得知来意之后摇摇手说：“我们是共产党人……就万万不能沾染官僚习 气……我们要养成一种新的风气，延安作风。我们要用延安作风打败西安作风。”在毛泽东 同志的谈话中，“延安作风”是指清正廉洁、密切联系群众、理论联系实际等共产党作风，“西 安作风”是指奢侈浮华、贪图享乐、脱离群众等国民党作风。\n摘编自《光明日报》(2025年7月7日)\n材料3\n坚持推进作风建设常态化长效化，是习近平党建思想“十四个坚持”的科学内涵之一。\n党的十八大以来，以习近平同志为核心的党中央高度重视、持续推进党的作风建设，在科学 总结新时代作风建设实践经验的基础上，进一步回答了新形势下党的作风建设抓什么、怎么 抓的问题。深入学习贯彻习近平党建思想，必须深刻把握坚持推进作风建设常态化长效化 的重要意义、理论内涵和实践路径，以永远在路上的坚韧和执着打好作风建设攻坚战、持久 战，以作风建设新成效为强国建设、民族复兴伟业提供有力保障。\n摘编自《人民日报》(2026年9月16日)\n(1) 联系党的建设“伟大的工程”,说明“延安作风”为什么能够打败“西安作风”。\n(2)为什么要把“坚持推进作风建设常态化长效化”作为习近平党建思想“十四个坚持” 的科学内涵之一?\n37. 结合材料回答问题：\n材料1\n如何让社会主义核心价值观转化为人们的思想认同和行为习惯?2025年，西藏日喀则 康马县在49个村建起“新时代文明实践积分超市”。村民参与村级事务、志愿服务、遵守村 规，都能赚积分，并用于兑换实实在在的生活用品——洗衣液、热水瓶、酥油茶壶等。这就好 比设立一套“行为账户”,好习惯能“增值”,旧陋习会“扣分”。2025年，全县共攒下53289 分，兑换了价值20.6万元的物品。和谐、敬业、诚信、友善等价值观念融入日常生活，刻进各 族群众心里。社会主义核心价值观不断深入人心，中华民族共有精神家园必将生机勃勃、欣 欣向荣。\n摘编自《人民日报》(2026年1月15日)\n材料2\n家风家救是一个家庭最宝贵的财富，家庭文明是杜会文明的基石。\n“一纸书来只为墙，让他三尺又何妨?”安徽桐城文昌街道六尺巷社区党总支书记、居委 会主任张耘家庭把“礼让”“和为贵”融入基层治理，续写百年家风的时代新篇。\n作为非遗“六尺巷传说”省级代表性传承人，张耘参与打造“六尺巷工作法”,化解邻里纠 纷近700件，组建志愿讲解服务队、开设公益小课堂，传播谦和礼让理念。夫妻二人诗书传 家、笃学向善，常态化开展读书分享、亲子朗读活动，以书香涵养家风，带动邻里共建和睦文 明社区。\n优良家风在传承中滋养人心、浸润社会。\n山西太原杏花岭区实验幼儿园原园长中芸深耕幼教领域数十年，坚守诚信向善家训，积 极投身公益服务。她制作公益微课超200期，惠及万名幼教工作者；组建志愿讲师团，开展公 益宣讲90余场。在她的言传身教和丈夫的坚定支持下，女儿、女婿、外孙主动投身志愿服务， 让善意代代相传。\n摘编自《人民日报》(2026年5月16日)\n(1) 结合材料，说明社会主义核心价值观为什么必须融人社会生活才能真正发挥作用。\n(2)为什么要让优良家风“在传承中滋养人心、浸润社会”?\n38.结合材料回答问题：\n材料1\n多边主义、对话协商是关键路径。少数国家主导国际事务是历史不公，一国独霸、几方 共治、集团政治不是真正的多边主义。\n摘自习近平《共同倡导平等有序的世界多极化实现更加公正合理的全球治理—\n在“上海合作组织+”会议上的讲话》\n材料2\n当前，世界百年变局加速演进，全球南方卓然壮大，世界多极化不可阻挡。与此同时，单 边主义、强权政治逆流涌动，多边主义和国际秩序受到冲击，和平赤字、发展赤字、安全赤字、 治理赤字有增无减。我提出全球发展倡议、全球安全倡议、全球文明倡议、全球治理倡议，就 是为了破解这些赤字，推动建设一个更加美好的世界。金砖国家要坚定站在历史正确一边， 勇做时代先锋，引领国际秩序朝着更加公正合理的方向发展，携手推动构建人类命运共同体。\n摘自习近平《共担时代责任勇做先锋力量— 在金砖国家领导人第十八次会晤第一阶段会议的讲话》\n(1)为什么说“一国独霸、几方共治、集团政治不是真正的多边主义”?\n(2)如何理解“提出全球发展倡议、全球安全倡议、全球文明倡议、全球治理倡议”,就 是为了“推动建设一个更加美好的世界”?"}}]}, {"id": "b8", "title": "第8套", "questions": [{"id": "b8-1", "num": 1, "type": "single", "stem": "谈及创新发展，人们总会想到“从0到1”的颠覆性、跃迁式创造突破。这种创新开辟新域、引 领潮流，能显著推动社会进步。除此之外，在已有的“1”之上，再精进“0.01”,这种微末处的功 夫，同样值得重视。从0到1,解决的是“有没有”的问题；从1到1.01,解决的是“好不好”的问 题。既要有拓界之创新，也应有精进之创新。“从0到1”之上的“0.01”的精进同样重要，这体 现了", "options": {"A": "在新质的基础上事物又开始新的量变", "B": "事物的发展是直线上升的永不停歇的过程", "C": "必然与偶然在一定条件下相互转化", "D": "新事物在完整继承旧事物的基础上添加新内容"}}, {"id": "b8-2", "num": 2, "type": "single", "stem": "交往是人类实践活动的重要组成部分，对社会生活有着重要的影响。马克思、恩格斯指出：\n“某一个地域创造出来的生产力，特别是发明，在往后的发展中是否会失传，完全取决于交往 扩展的情况。”对这一论断理解正确的是", "options": {"A": "地理环境在生产力发展中起主导作用", "B": "生产力成果的保存有赖于交往的扩大", "C": "信息交往是物质交往的基础和根源", "D": "科学文化交往是人类最基本的实践活动 3.资本家提高对工人剥削程度的方法是多种多样的，最基本的方法有两种，即绝对剩余价值的生\n产和相对剩余价值的生产。绝对剩余价值的生产和相对剩余价值的生产都是依靠"}}, {"id": "b8-3", "num": 3, "type": "single", "stem": "资本家提高对工人剥削程度的方法是多种多样的，最基本的方法有两种，即绝对剩余价值的生产和相对剩余价值的生产。绝对剩余价值的生产和相对剩余价值的生产都是依靠", "options": {"A": "延长工作日获得的", "B": "提高劳动生产率获得的", "C": "缩短工人的必要劳动时间获得的", "D": "延长工人的剩余劳动时间获得的"}, "answer": "D", "explain": "简析 绝对剩余价值是指在必要劳动时间不变的条件下，由于延长工作日的长度或提高劳动 强度而生产的剩余价值。在必要劳动时间既定的条件下，工作日越长，剩余劳动时间越长，剩 余价值率越高。相对剩余价值是指在工作日长度不变的条件下，通过缩短必要劳动时间而相 对延长剩余劳动时间所生产的剩余价值。缩短必要劳动时间是通过提高全社会的劳动生产率 实现的。由于社会劳动生产率的提高，降低了劳动力的价值，从而缩短了必要劳动时间，相对 延长了剩余劳动时间。全社会劳动生产率的提高是资本家追逐超额剩余价值的结果。所以， 绝对剩余价值生产和相对剩余价值生产都是依靠延长工人的剩余劳动时间获得的，D正确。 相对剩余价值生产不延长工作日，A错误。绝对剩余价值生产不依靠提高劳动生产率，也不缩 短工人的必要劳动时间，B、C错误。"}, {"id": "b8-4", "num": 4, "type": "single", "stem": "经济全球化是当代世界经济的重要特征之一，也是世界经济发展的重要趋势。为经济全球化提供了坚实的物质基础和根本的推动力的是", "options": {"A": "科学技术的进步和生产力的发展", "B": "国际分工的进一步深化", "C": "跨国公司在全球范围内的迅速发展", "D": "金融自由化与金融创新"}, "answer": "A", "explain": "简析 导致经济全球化迅猛发展的因素主要有三点：一是科学技术的进步和生产力的发展为 经济全球化提供了坚实的物质基础和根本的推动力。二是跨国公司的发展为经济全球化提供 了适宜的企业组织形式。三是各国经济体制的变革和国际经济组织的发展是经济全球化的体 制与组织保障。A正确。"}, {"id": "b8-5", "num": 5, "type": "single", "stem": "1945年，毛泽东在中共七大《论联合政府》的政治报告中指出：“房子是应该经常打扫的，不打 扫就会积满了灰尘；脸是应该经常洗的，不洗也就会灰尘满面。我们同志的思想，我们党的工 作，也会沾染灰尘的，也应该打扫和洗涤。”毛泽东在此强调“打扫和洗涤”是在说明", "options": {"A": "党员干部要密切联系群众，在基层工作中积累工作经验", "B": "必须经常开展批评和自我批评，及时纠正思想和工作中的错误", "C": "对于政治思想领域的人民内部矛盾，要实行“百花齐放、百家争鸣”的方针", "D": "只有保持清正廉洁，才能赢得人民群众的信任"}}, {"id": "b8-6", "num": 6, "type": "single", "stem": "中共中央在1952年底开始酝酿并于1953年正式提出党在过渡时期的总路线。这条总路线的 主要内容可概括为“一化三改”,又称“一体两翼”。在社会主义改造的过程中，改造资本主义 工商业和逐步完成向社会主义过渡的必经之路是", "optio function picksFor(q, rec) { return rec ? rec.picks : [...(pending.get(q.id) || [])]; }

}
function commit(qid, letters) {
  const q = allQuestions().find(x => x.id === qid);
  if (!q || recordFor(q)) return;
  const picks = [...new Set(letters)].filter(x => q.options[x]).sort();
  if (!picks.length) return;
  state.answers[qid] = { picks, correct: isCorrect(q, picks) };
  pending.delete(qid);
  save();
  render();
}
function getChatContext() {
  const q = allQuestions().find(x => x.id === chatQid) || pageQuestions()[0];
  if (!q) return { label: currentSection().title, promptText: "【考研政治知识点答疑】当前部分：" + currentSection().title + "。请直接回答学生的考研政治问题。" };
  const opts = ["A", "B", "C", "D"].map(l => `${l}. ${q.options[l] || ""}`).join("\n");
  return {
    label: `${currentSection().title} · ${q.stem.slice(0, 26)}`,
    promptText: `【考研政治知识点答疑】当前部分：${currentSection().title}。当前题目：${q.stem}\n${opts}\n正确答案：${q.answer}。请围绕当前题目和考研政治知识点回答。`
  };
}
function goPage(p) {
  state.page = Math.min(Math.max(1, p), totalPages());
  pending.clear();
  save();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function resetPage() {
  const pg = pageQuestions();
  for (const q of pg) { delete state.answers[q.id]; pending.delete(q.id); }
  save();
  $("#reset-dialog").close();
  render();
}
function bind() {
  $("#quiz").addEventListener("click", e => {
    const card = e.target.closest("[data-card]");
    if (card) { chatQid = card.dataset.card; if (window.refreshPoliticsChatContext) window.refreshPoliticsChatContext(); }
    const opt = e.target.closest(".option");
    if (opt) {
      const q = allQuestions().find(x => x.id === opt.dataset.qid);
      if (!q || recordFor(q)) return;
      if (q.type === "single") commit(q.id, [opt.dataset.letter]);
      else {
        const set = pending.get(q.id) || new Set();
        if (set.has(opt.dataset.letter)) set.delete(opt.dataset.letter); else set.add(opt.dataset.letter);
        pending.set(q.id, set);
        render();
      }
      return;
    }
    const sub = e.target.closest("[data-submit]");
    if (sub) { const qid = sub.dataset.submit; commit(qid, [...(pending.get(qid) || [])]); }
  });
  $("#prev").addEventListener("click", () => goPage(state.page - 1));
  $("#next").addEventListener("click", () => goPage(state.page + 1));
  $("#section-select").addEventListener("change", e => {
    state.section = e.target.value;
    state.page = 1;
    pending.clear();
    save();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("#btn-reset").addEventListener("click", () => {
    const pg = pageQuestions();
    $("#reset-desc").textContent = `只会清空当前第 ${state.page} 页的 ${pg.length} 道题，不影响其他页。此操作不可撤销。`;
    $("#reset-dialog").showModal();
  });
  $("#confirm-reset").addEventListener("click", resetPage);
  $$("[data-close]").forEach(btn => btn.addEventListener("click", () => document.getElementById(btn.dataset.close).close()));
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea, select")) return;
    if ($("#reset-dialog").open) return;
    if (e.key === "ArrowLeft") goPage(state.page - 1);
    if (e.key === "ArrowRight") goPage(state.page + 1);
  });
}
function init() {
  load();
  const sel = $("#section-select");
  sel.innerHTML = SECTIONS.map(s => `<option value="${s.id}">${esc(s.title)}（${s.questions.length}题）</option>`).join("");
  if (!SECTION_BY_ID.has(state.section)) state.section = SECTIONS[0].id;
  sel.value = state.section;
  bind();
  render();
  if (window.initPoliticsChat) window.initPoliticsChat({ getContext: getChatContext });
}
init();
</script>
</body>
</html>
