认识更趋全面，对资本规律的把握更加深入，对资本运行的治理能力不断提高。我们对社会主义市场经济条件下的资本已经形成的认识主要有（）", "options": {"A": "资本是带动各类生产要素集聚配置的重要纽带，是促进社会生产力发展的重要力量", "B": "规范和约束资本的逐利本性，防止对经济社会发展带来不可估量的危害", "C": "完善我国资本市场基础制度，为各类资本发展释放出更大空间", "D": "既注重保障资本参与社会分配获得增殖和发展，更注重维护按劳分配的主体地位"}, "answer": "ABCD", "explain": ""}, {"id": "y2023-24", "num": 24, "type": "multiple", "chapter": "", "stem": "开放是人类文明进步的重要动力，是世界繁荣发展的必由之路。面对世界范围内保护主义抬头、逆全球化趋势加剧的现实，中国于2018—2022年连续五年举办了五届世界上首个以进口为主题的国家级国际进口博览会。前四届有120多家世界级500强及行业龙头企业连续参赛，累计意向成交额达2700多亿美元。今年参加的第五届中国国际进口博览会的世界500强和行业龙头超过280家，回头率近90%，累计意向成交735.2亿美元。中国国际进口博览会的成功举办充分表明，它正成为（）", "options": {"A": "世界经济增长的引擎", "B": "我国构建新发展格局的窗口", "C": "我国接近高水平对外开放的平台", "D": "全球共享的国际公共产品"}, "answer": "BCD", "explain": ""}, {"id": "y2023-25", "num": 25, "type": "multiple", "chapter": "", "stem": "湿地保护是生态文明建设的重要内容。古往今来人类逐水而居，文明伴水而生，人类生产生活同湿地有着密切联系。十年来，我国大力推进生态文明建设，加强湿地保护修复，构建保护制度体系，出台《湿地保护法》，使湿地生态状况得以持续改善。目前，我国湿地面积达到5635万公顷。在《湿地公约》认定的43个国际湿地城市中，我国13个城市入选，是全球入选国际湿地城市数量最多的国家。湿地保护有利于（）", "options": {"A": "促进人与自然和谐共生", "B": "推行草原、森林、河流、湖泊、湿地休养生息", "C": "提升生态系统多样性、稳定性、持续性", "D": "发挥湿地功能，推进持续发展，应对气候变化"}, "answer": "ABCD", "explain": ""}, {"id": "y2023-26", "num": 26, "type": "multiple", "chapter": "", "stem": "坚持和发展马克思主义，必须同中华优秀传统文化相结合。中华优秀传统文化源远流长，博大精深，是中华文明的智慧结晶，蕴含着天下为公、民为邦本、为政以德、革故鼎新、任人唯贤、天人合一、自强不息、厚德载物、讲信修睦、亲仁善邻等思想观念，这些（）", "options": {"A": "与马克思主义理论一脉相承", "B": "同科学社会主义价值观主张具有高度契合性", "C": "完整体现了马克思主义的立场观点和方法", "D": "体现着中国人民的宇宙观、天下观、社会观、道德观"}, "answer": "BD", "explain": ""}, {"id": "y2023-27", "num": 27, "type": "multiple", "chapter": "", "stem": "1905年至1907年间，围绕中国社会变革问题，资产阶级革命派与改良派分别以《民报》《新民丛报》为主要舆论阵地，展开了一场论战。这场论战（）", "options": {"A": "聚焦要不要以革命手段推翻清王朝", "B": "实质上是资产阶级思想与封建主义思想的交锋", "C": "传播了民主革命思想，促进了革命形势的发展", "D": "暴露了革命派在思想理论方面的弱点"}, "answer": "ACD", "explain": ""}, {"id": "y2023-28", "num": 28, "type": "multiple", "chapter": "", "stem": "《反对本本主义》是毛泽东在土地革命战争时期为反对当时红军中的教条主义思想而写的重要著作。毛泽东在这篇著作中提出的重要思想有（）", "options": {"A": "关心群众，注意工作方法", "B": "把城市工作和根据地工作提到同样重要的地位", "C": "没有调查，没有发言权", "D": "中国革命的胜利要靠中国同志了解中国情况"}, "answer": "CD", "explain": ""}, {"id": "y2023-29", "num": 29, "type": "multiple", "chapter": "", "stem": "党的十一届三中全会标志着中国共产党重新确立了马克思主义的思想路线、政治路线、组织路线，实现了新中国成立以来党的历史上具有深远意义的伟大转折，开启了我国改革开放和社会主义现代化建设的新时期。全会作出实行改革开放的历史性决策，是基于（）", "options": {"A": "对党和国家前途命运的深刻把握", "B": "对社会主义革命和建设实践的深刻总结", "C": "对时代潮流的深刻洞察", "D": "对人民群众期盼和需要的深刻体悟"}, "answer": "ABCD", "explain": ""}, {"id": "y2023-30", "num": 30, "type": "multiple", "chapter": "", "stem": "社会主义道德是崭新类型的道德，与以往的社会道德形态相比，社会主义道德具有显著的先进性特征。先进性主要体现在（）", "options": {"A": "它是对人类优秀道德资源的批判继承和创新发展", "B": "它克服了以往阶级社会道德的片面性和局限性", "C": "它是调节社会一切行为规范的准则", "D": "它是社会主义经济基础的反映"}, "answer": "ABD", "explain": ""}, {"id": "y2023-31", "num": 31, "type": "multiple", "chapter": "", "stem": "法律义务是指由一定的社会物质生活条件所制约的社会责任，是保证法律所规定的义务人按照权利人要求从事一定行为或不从事一定行为以满足权利人权益的法律手段。关于法律义务的表述，正确的有（）", "options": {"A": "法律义务必须依法设定", "B": "法律义务是一成不变的", "C": "法律义务源于现实需要", "D": "法律义务是义务人自主实施的行为"}, "answer": "AC", "explain": ""}, {"id": "y2023-32", "num": 32, "type": "multiple", "chapter": "", "stem": "2022年8月10日，国务院台湾事务办公室、国务院新闻办公室发表《台湾问题与新时代中国统一事业》白皮书。该白皮书发表有利于（）", "options": {"A": "揭批“台独”分裂势力和外部势力勾连挑衅，企图损害中国主权和领土完整，阻挠破坏中国统一进程的恶劣言行", "B": "最大限度争取两岸同胞、国际社会的理解和支持", "C": "展现中国共产党和中国政府愿继续以最大诚意、尽最大努力争取和平统一的立场和态度", "D": "提振全党全国各族人民矢志追求国家统一的精气神，增强岛内和海外反“独”促统力量的信心和勇气"}, "answer": "ABCD", "explain": ""}, {"id": "y2023-33", "num": 33, "type": "multiple", "chapter": "", "stem": "2022年11月15日，二十国集团领导人第十七次峰会在印度尼西亚巴厘岛举行，国家主席习近平出席并发表题为《共迎时代挑战，共建美好未来》的重要讲话，倡议推动（）", "options": {"A": "更具竞争的全球发展", "B": "更加包容的全球发展", "C": "更加普惠的全球发展", "D": "更有韧性的全球发展"}, "answer": "BCD", "explain": ""}]}, {"id": "y2024", "title": "2024年真题", "questions": [{"id": "y2024-1", "num": 1, "type": "single", "chapter": "", "stem": "习近平新时代中国特色社会主义思想是推进理论创新的光辉典范。新时代谱写马克思主义中国化时代化新篇章，要坚守理论创新的基础和前提，坚守好理论创新的“魂”和“根”。中国化时代化的马克思主义的“魂脉”和“根脉”是（）", "options": {"A": "马克思主义和中华优秀传统文化", "B": "共产主义社会理想和“天下大同”理想", "C": "全人类共同价值和社会主义核心价值观", "D": "共产主义远大理想和中国特色社会主义共同理想"}, "answer": "A", "explain": ""}, {"id": "y2024-2", "num": 2, "type": "single", "chapter": "", "stem": "一个地方的气候主要取决于纬度、海陆位置、地形，以及大气环流和洋流等因素。纬度、海陆位置、地形等因素在一定时期内基本保持不变，大气环流与洋流二者相互作用就形成相对稳定的气候状态，但当其中一个因素突然“掉链子”，就会发生厄尔尼诺之类的异常现象。厄尔尼诺现象不仅推高全球变暖幅度，更可能导致频次更多、范围更广、强度更大的极端天气，进而影响全球气候。厄尔尼诺现象对全球气候的影响表明，偶然因素是（）", "options": {"A": "决定事物发展趋势的根本性因素", "B": "事物发展中可有可无的影响因素", "C": "事物发展中不可忽视的影响因素", "D": "事物发展过程中确定不移的因素"}, "answer": "C", "explain": ""}, {"id": "y2024-3", "num": 3, "type": "single", "chapter": "", "stem": "除了几十颗卫星编织的“天上一张网”，还有地基增强系统构成的“地上一张网”，北斗卫星导航系统开启了高精度定位技术进步的“加速度”。有了“天上一张网”，为什么还要再建“地上一张网”？传统的卫星导航系统能提供的精度仅为5～10米，而北斗卫星导航系统可以实现提供实时米级、分米级、厘米级的更高精度的定位服务。从农林牧渔到吃穿住行，随着北斗卫星导航芯片或模块越来越多嵌入生产生活，每一个人都愈发清晰地感知到北斗的力量。北斗卫星导航系统在发展中应用、在应用中发展表明，技术进步的根本动力是（）", "options": {"A": "科学研究的规范", "B": "实践主体的意志", "C": "认识主体的兴趣", "D": "社会实践的需要"}, "answer": "D", "explain": ""}, {"id": "y2024-4", "num": 4, "type": "single", "chapter": "", "stem": "列宁在谈到未来社会时写道，“生产力将以什么样的速度向前发展，将以什么样的速度发展到打破分工、消灭脑力劳动和体力劳动的对立、把劳动变为‘生活的第一需要’，这都是我们所不知道而且也不可能知道的”，“我们只能谈国家消亡的必然性，同时着重指出这个过程是长期的，指出它的长短将取决于共产主义高级阶段的发展速度，而把消灭的日期或消亡的具体形式作为悬案，因为现在还没有可供解决这些问题的材料”。这表明，列宁在展望未来社会时（）", "options": {"A": "揭示了社会历史发展的各项措施、方式、方法", "B": "认为不存在适用于各种社会形态发展的普遍规律", "C": "没有提出未来社会发展的方向、原则和基本特征", "D": "不对历史发展的各种细节作具体描绘"}, "answer": "D", "explain": ""}, {"id": "y2024-5", "num": 5, "type": "single", "chapter": "", "stem": "随着我国生产资料私有制社会主义改造的基本完成，国内的社会矛盾和阶级关系发生重大变化。在此背景下，毛泽东在1957年2月作《关于正确处理人民内部矛盾的问题》的报告，明确提出把正确处理人民内部矛盾作为我国政治生活的主题，其根本着眼点是（）", "options": {"A": "调动一切积极因素为社会主义建设服务", "B": "扩大社会主义民主，健全社会主义法制", "C": "维护社会稳定，实现长治久安", "D": "消除社会矛盾，实现民族大团结"}, "answer": "A", "explain": ""}, {"id": "y2024-6", "num": 6, "type": "single", "chapter": "", "stem": "习近平总书记指出：“实践发展永无止境，解放思想永无止境，改革开放也永无止境，改革开放只有进行时、没有完成时。”新时代坚持和发展中国特色社会主义，根本动力仍然是全面深化改革开放。改革开放的鲜明特征和首要任务是（）", "options": {"A": "解放和发展社会生产力", "B": "形成更加成熟更加定型的制度", "C": "处理好政府和市场的关系", "D": "促进社会公平正义、增进人民福祉"}, "answer": "A", "explain": ""}, {"id": "y2024-7", "num": 7, "type": "single", "chapter": "", "stem": "社会治理是国家治理的重要领域，关系国家长治久安、社会安定有序、人民安居乐业。二十世纪60年代浙江枫桥干部群众创造了依靠群众就地化解矛盾的“枫桥经验”。今年是毛泽东同志批示学习推广“枫桥经验”60周年，也是习近平总书记指示坚持和发展“枫桥经验”20周年。11月6日，习近平总书记在会见全国“枫桥式工作法”入选单位代表时，再次强调要坚持和发展好新时代“枫桥经验”。新时代“枫桥经验”最突出的特点是（）", "options": {"A": "加强社会治理的顶层设计", "B": "最大限度把矛盾风险防范化解在基层", "C": "把人文关怀和心理疏导有机结合起来", "D": "有效发挥政府的主导作用"}, "answer": "B", "explain": ""}, {"id": "y2024-8", "num": 8, "type": "single", "chapter": "", "stem": "我国是一个有十四亿多人口的大国，无论社会现代化程度有多高，解决好吃饭问题，始终是治国理政的头等大事。保障我国粮食安全的关键在于（）", "options": {"A": "健全种粮农民收益保障机制", "B": "推进农业供给侧结构性改革", "C": "落实藏粮于地、藏粮于技战略", "D": "完善主产区利益补偿制度"}, "answer": "C", "explain": ""}, {"id": "y2024-9", "num": 9, "type": "single", "chapter": "", "stem": "中国是全国各族人民共同缔造的统一的多民族国家。中国上下五千年的历史，就是一个统一的多民族国家形成和不断发展的历史。对中华民族形成起决定作用的是（）", "options": {"A": "对种族和血缘的认同", "B": "对中华民族共同体的认同", "C": "对宗教信仰的认同", "D": "对共同生活地域的认同"}, "answer": "B", "explain": ""}, {"id": "y2024-10", "num": 10, "type": "single", "chapter": "", "stem": "鸦片战争前的中国社会是封建社会。鸦片战争以后，独立的中国逐步变成半殖民地的中国，封建的中国逐步变成半封建的中国。所谓“半封建”是指（）", "options": {"A": "封建经济占整个经济的一半", "B": "中国出现了资本主义生产关系", "C": "中国丧失完全独立的地位", "D": "封建剥削制度的根基彻底动摇"}, "answer": "B", "explain": ""}, {"id": "y2024-11", "num": 11, "type": "single", "chapter": "", "stem": "孙中山先生是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱。1894年11月，在檀香山召开的兴中会成立大会通过了由孙中山起草的《兴中会章程》。在章程中，孙中山提出了（）", "options": {"A": "“振兴中华”的口号", "B": "“建立民国”的口号", "C": "“反帝反封”的口号", "D": "“民主自由”的口号"}, "answer": "A", "explain": ""}, {"id": "y2024-12", "num": 12, "type": "single", "chapter": "", "stem": "1937年7月7日，日本帝国主义发动了卢沟桥事变，企图以武力吞并全中国。卢沟桥事变的发生（）", "options": {"A": "揭开了抗日战争的序幕", "B": "成为中国人民抗日战争的起点", "C": "标志着中国进入全民族抗战阶段", "D": "标志着世界反法西斯同盟的正式建立"}, "answer": "C", "explain": ""}, {"id": "y2024-13", "num": 13, "type": "single", "chapter": "", "stem": "1948年，解放战争形势已经有了极大的进展，许多解放区已经连成一片，许多城市已经解放或者即将解放，人民解放军和人民解放战争的正规性程度大为提高，全国胜利已经在望。这种情况要求党迅速克服存在于党内和军队内的任何无纪律无政府状态，把一切必须和可能集中的权力集中于中央。为此，中共中央决定建立（）", "options": {"A": "精兵简政制度", "B": "请示报告制度", "C": "民主协商制度", "D": "党外通报制度"}, "answer": "B", "explain": ""}, {"id": "y2024-14", "num": 14, "type": "single", "chapter": "", "stem": "习近平总书记在党的二十大报告中深刻指出：“全面依法治国是国家治理的一场深刻革命，关系党执政兴国，关系人民幸福安康，关系党和国家长治久安。必须更好发挥法治固根本、稳预期、利长远的保障作用，在法治轨道上全面建设社会主义现代化国家。”全面依法治国，关键在于（）", "options": {"A": "加快形成严密的法治监督体系", "B": "坚持依法治国与以德治国相结合", "C": "坚持党领导立法、保证执法、支持司法、带头守法", "D": "深入开展法治宣传教育"}, "answer": "C", "explain": ""}, {"id": "y2024-15", "num": 15, "type": "single", "chapter": "", "stem": "党和国家历来重视基础研究工作。中共中央政治局2023年2月21日就加强基础研究进行第三次集体学习。中共中央总书记习近平在主持学习时强调，加强基础研究是实现高水平科技自立自强的迫切要求，是建设世界科技强国的必由之路。加强基础研究，归根到底要靠（）", "options": {"A": "体制机制", "B": "国际合作平台", "C": "学科建设布局", "D": "高水平人才"}, "answer": "D", "explain": ""}, {"id": "y2024-16", "num": 16, "type": "single", "chapter": "", "stem": "2023年9月18日至26日，第78届联合国大会高级别周在联合国总部进行。相比以往，本届联大将更多目光投向了“全球南方”，议程主要着眼于“全球南方”国家提出的需求，讨论气候变化、主权债务减免、如何帮助陷入困境的国家实现联合国在繁荣、健康、发展、教育、性别平等方面的发展目标。中国作为世界上最大的发展中国家，在本届联大期间出席多场会议，表达“全球南方”天然成员的诉求与主张。“全球南方”国家的声音更响亮，是本届联大的亮点。这表明（）", "options": {"A": "全球南北对话的僵局已经破解", "B": "“全球南方”国家在国际组织中的话语权和影响力占据了主导地位", "C": "南方国家改变国际秩序游戏规则的议题成为了国际社会的普遍共识", "D": "国际力量对比正在发生深刻变化，百年变局正在深入发展演进"}, "answer": "D", "explain": ""}, {"id": "y2024-17", "num": 17, "type": "multiple", "chapter": "", "stem": "随着新一代人工智能技术的发展，基于大模型的生成式人工智能（AIGC）在快速回答提问、创作代码、翻唱经典歌曲等方面取得了新的突破。但是，随着技术迭代，人工智能高效地应用于各行各业时，其带来的风险也不容忽视，比如人工智能生成近似原画的内容、构图，可能侵犯原创作者的知识产权；人工智能技术被恶意使用，可能用来从事制造虚假信息、诈骗等违法活动。守住法律和伦理底线，推动人工智能朝着科技向善的方向发展，关键还在于人们更智慧地使用人工智能工具。“更智慧地使用人工智能工具”意味着（）", "options": {"A": "技术进步要以维护人民的根本利益为最高标准", "B": "人类活动能够实现合目的性与合规律性的统一", "C": "科技发展是由主观意志决定的客观物质活动", "D": "成功的实践是真理尺度与价值尺度的统一"}, "answer": "ABD", "explain": ""}, {"id": "y2024-18", "num": 18, "type": "multiple", "chapter": "", "stem": "茶叶，采自天然；茶器，匠心独具；茶艺，彬彬有礼。饮茶品茶，陶冶性情；以茶会友，品味人生。从山间一片叶，到万家杯中茶，茶叶的生长与旅行，讲述着关于文明与生活的故事，沉淀着中华文明独特的价值理念。有人说“离开了茶文化，茶叶就仅仅只是一片叶子”。从“一片叶子”到“茶文化”表明（）", "options": {"A": "观念的东西不外是移入人脑并经过人脑改造过的物质的东西而已", "B": "世界上一切事物所具有的特定意义只是经验外化于对象的意义", "C": "客体潜在的价值转化为现实的价值，依赖于实践基础上的主体创造", "D": "客体的价值及价值大小，取决于客体的属性及满足主体需要的程度"}, "answer": "ACD", "explain": ""}, {"id": "y2024-19", "num": 19, "type": "multiple", "chapter": "", "stem": "习近平指出：“人类文明多样性是世界的基本特征，也是人类进步的源泉。世界上有200多个国家和地区、2500多个民族、多种宗教。不同历史和国情，不同民族和习俗，孕育了不同文明，使世界更加丰富多彩。”唯物史观关于社会形态的理论中，内在地包含着文明多样性的思想。下列关于人类文明多样性表述正确的有（）", "options": {"A": "独特的生产方式和生活方式决定着文明发展的不同样态", "B": "各种文明都具有独自的比其他文明更优越、更强大的文化基因", "C": "每一种文明都代表着一方文化的独特性，是人类文明的重要组成部分", "D": "每一种文明都是在与其他文明相隔离的状态下独自产生、发展和演变的"}, "answer": "AC", "explain": ""}, {"id": "y2024-20", "num": 20, "type": "multiple", "chapter": "", "stem": "商品经济是社会经济发展到一定阶段的产物。在资本主义社会之前的发展阶段，商品经济只是一种简单商品经济，这一阶段商品经济发展的基础是（）", "options": {"A": "生产资料公有制", "B": "个体劳动", "C": "生产资料私有制", "D": "雇佣劳动"}, "answer": "BC", "explain": ""}, {"id": "y2024-21", "num": 21, "type": "multiple", "chapter": "", "stem": "习近平指出：“经济全球化是社会生产力发展的客观要求和科技进步的必然结果，不是哪些人、哪些国家人为制造出来的。经济全球化为世界经济增长提供了强劲动力，促进了商品和资本流动、科技和文明进步、各国人民交往。”导致经济全球化迅猛发展的因素有（）", "options": {"A": "信息技术革命打破了生产要素的地域限制，使整个世界生产连成一片", "B": "国际分工和生产要素全球流动的比较优势，促进了产业链深度融合", "C": "发达国家主导制定的贸易和竞争规则，使广大发展中国家成为主要受益者", "D": "国际经济组织成员国对本国或本地区市场控制的放松，加快了贸易投资自由化"}, "answer": "ABD", "explain": ""}, {"id": "y2024-22", "num": 22, "type": "multiple", "chapter": "", "stem": "毛泽东在谈到党对民主革命规律的认识时指出，从党的建立到抗日时期，我们经过了两次胜利两次失败。“在抗日时期，我们才制定了合乎情况的党的总路线和一整套具体政策。这时候，中国民主革命这个必然王国才被我们认识，我们才有了自由”。这表明（）", "options": {"A": "党已完全掌握了新民主主义革命的发展规律", "B": "马克思主义必须与中国革命具体实际相结合", "C": "党对民主革命规律的认识必须有一个过程", "D": "新民主主义革命理论是总结正反两方面经验形成的"}, "answer": "BCD", "explain": ""}, {"id": "y2024-23", "num": 23, "type": "multiple", "chapter": "", "stem": "今年以来，我国经济持续回升向好，高质量发展扎实推进，我国仍是全球增长最大引擎。据权威部门统计，前三季度我国国内生产总值同比增长5.2%；全国居民人均可支配收入同比实际增长5.9%；高技术产业投资增长11.4%。前10个月社会物流总额同比增长4.9%，物流需求恢复向好，行业提质升级加速。总体上看，我国经济长期向好的基本面没有变也不会变，因为我国具有（）", "options": {"A": "超大规模市场的需求优势", "B": "产业体系配套完整的供给优势", "C": "社会主义市场经济的体制优势", "D": "大量高素质劳动者和企业家的人才优势"}, "answer": "ABCD", "explain": ""}, {"id": "y2024-24", "num": 24, "type": "multiple", "chapter": "", "stem": "2023年5月29日，习近平总书记在二十届中央政治局第五次集体学习时指出，当今时代，人才是第一资源，科技是第一生产力，创新是第一动力，要把建设教育强国、科技强国、人才强国有机结合起来，一体统筹推进，形成推动高质量发展的倍增效应。在全面建设社会主义现代化国家进程中，坚持教育、科技、人才一体推进是因为（）", "options": {"A": "教育、科技、人才三者之间具有一致性和相互支撑性", "B": "教育、科技、人才在综合国力竞争中的关键性地位更加凸显", "C": "教育、科技、人才是全面建设社会主义现代化国家的基础性和战略性支撑", "D": "把教育、科技、人才摆在经济社会发展重要位置是社会主义现代化建设的历史经验"}, "answer": "ABCD", "explain": ""}, {"id": "y2024-25", "num": 25, "type": "multiple", "chapter": "", "stem": "党的二十大以来，习近平总书记到不同省区市深入考察时，多次强调各地要立足自身实际牢牢把握在国家发展大局中的战略定位。比如，要求浙江“要在以科技创新塑造发展新优势上走在前列”，强调内蒙古发展的重中之重是“做大做强国家重要能源基地”，指出黑龙江“要当好国家粮食安全‘压舱石’”，等等。习近平总书记的重要指示，为中国式现代化的地方实践提供了根本遵循。准确把握各地区在国家发展大局中的战略定位有利于（）", "options": {"A": "发挥各地比较优势，塑造我国发展新优势", "B": "优化区域经济布局，拓展我国发展动力源", "C": "统筹发展和安全，掌握我国发展主动权", "D": "同步实现共同富裕，推动我国发展迈上新台阶"}, "answer": "ABC", "explain": ""}, {"id": "y2024-26", "num": 26, "type": "multiple", "chapter": "", "stem": "加快发展数字经济是我国建设现代化产业体系的重要内容。根据《中国互联网发展报告2023》，截至2022年底，中国数据产量和算力总规模均居世界第二。十年间，中国数字经济规模从11万亿元增长到50.2万亿元，占国内生产总值比重达到41.5%。数字经济的快速发展充分表明（）", "options": {"A": "数据已成为新的生产要素", "B": "数字经济正在成为新一轮国际竞争的重点领域", "C": "数字经济已取代实体经济", "D": "数字经济是稳增长促转型的重要引擎"}, "answer": "ABD", "explain": ""}, {"id": "y2024-27", "num": 27, "type": "multiple", "chapter": "", "stem": "1924年至1927年由国共两党合作发动的大革命，在中国大地上掀起了反帝反封建的伟大斗争，在中国革命史上写下了光荣的一页。与辛亥革命相比，大革命（）", "options": {"A": "斗争的规模更加宏伟", "B": "革命的社会内涵更为深刻", "C": "斗争的形式更加隐蔽", "D": "群众的动员程度更为广泛"}, "answer": "ABD", "explain": ""}, {"id": "y2024-28", "num": 28, "type": "multiple", "chapter": "", "stem": "社会主义改造基本完成以后，中国共产党面临如何进行社会主义建设的问题。毛泽东明确提出：“现在是社会主义革命和建设时期，我们要进行第二次结合，找出在中国怎样建设社会主义的道路。”1956年，以毛泽东同志为主要代表的中国共产党人提出了一系列关于社会主义建设的重要方针，其中包括（）", "options": {"A": "在经济建设上实行“既反保守又反冒进”的方针", "B": "在对外关系上实行“一边倒”的方针", "C": "在科学文化工作中实行“百花齐放、百家争鸣”的方针", "D": "在党与民主党派的关系上实行“长期共存、互相监督”的方针"}, "answer": "ACD", "explain": ""}, {"id": "y2024-29", "num": 29, "type": "multiple", "chapter": "", "stem": "1939年10月，毛泽东在《〈共产党人〉发刊词》中，把党的建设称为“伟大工程”。2022年10月，习近平总书记在党的二十大报告中指出，必须持之以恒推进全面从严治党，深入推进新时代党的建设新的伟大工程，以党的自我革命引领社会革命。下列关于党的自我革命的正确表述有（）", "options": {"A": "勇于自我革命是中国共产党区别于其他政党的显著标志", "B": "自我革命精神是党永葆青春活力的强大支撑", "C": "所有政党都是在不断自我革命中淬炼而成的", "D": "自我革命是我们党跳出历史周期率的第二个答案"}, "answer": "ABD", "explain": ""}, {"id": "y2024-30", "num": 30, "type": "multiple", "chapter": "", "stem": "中华传统美德蕴含着丰富的思想道德资源，对于我们今天的道德建设具有重要价值。习近平总书记指出：“要继承和弘扬我国人民在长期实践中培养和形成的传统美德，坚持马克思主义道德观、坚持社会主义道德观，在去粗取精、去伪存真的基础上，坚持古为今用、推陈出新，努力实现中华传统美德的创造性转化、创新性发展”。中华传统美德的“创造性转化、创新性发展”体现为（）", "options": {"A": "对中华传统美德中具有当代价值的道德精神加以挖掘", "B": "赋予中华传统美德新的时代内涵", "C": "用中华传统美德滋养社会主义道德建设", "D": "形成以中国传统文化为主体的道德体系"}, "answer": "ABC", "explain": ""}, {"id": "y2024-31", "num": 31, "type": "multiple", "chapter": "", "stem": "《中华人民共和国爱国主义教育法》由中华人民共和国第十四届全国人民代表大会常务委员会第六次会议于2023年10月24日通过，自2024年1月1日起施行。这是新时代加强爱国主义教育，传承和弘扬爱国主义精神，实现中华民族伟大复兴中国梦的必然要求。下列关于爱国主义教育法表述正确的有（）", "options": {"A": "爱国主义教育法是社会主义核心价值观入法的具体体现", "B": "爱国主义教育法有利于维护国家统一和民族团结", "C": "爱国主义教育法是惩治危害国家安全、荣誉和利益行为的法律武器", "D": "爱国主义教育法为加强新时代爱国主义教育提供了法治保障"}, "answer": "ABCD", "explain": ""}, {"id": "y2024-32", "num": 32, "type": "multiple", "chapter": "", "stem": "2023年4月3日，学习贯彻习近平新时代中国特色社会主义思想主题教育工作会议在北京召开。会议强调，这次主题教育要牢牢把握“学思想、强党性、重实践、建新功”的总要求。要全面学习领会习近平新时代中国特色社会主义思想，全面系统掌握这一思想的基本观点、科学体系，把握好这一思想的世界观、方法论，坚持好、运用好贯穿其中的立场观点方法，不断增进对党的创新理论的（）", "options": {"A": "政治认同", "B": "思想认同", "C": "理论认同", "D": "情感认同"}, "answer": "ABCD", "explain": ""}, {"id": "y2024-33", "num": 33, "type": "multiple", "chapter": "", "stem": "在中方支持下，2023年3月6日至10日，沙特阿拉伯与伊朗在北京举行对话。3月10日，中沙伊三方签署并发表联合声明，宣布沙伊双方同意恢复外交关系。这是党的二十大后中国外交的“大手笔”。中方推动沙伊握手言和的重要意义表现在（）", "options": {"A": "创造了调解冲突的新范式，为其他地区热点问题的解决提供了新思路", "B": "使沙伊矛盾得以最终解决", "C": "助力中东地区实现和平、稳定与安全", "D": "为国际社会注入和平合作的正能量"}, "answer": "ACD", "explain": ""}]}, {"id": "y2025", "title": "2025年真题", "questions": [{"id": "y2025-1", "num": 1, "type": "single", "chapter": "", "stem": "习近平强调，要“树立大农业观、大食物观，向耕地草原森林海洋、向植物动物微生物要热量、要蛋白，全方位多途径开发食物资源”，“既向陆地要食物，也向海洋要食物，耕海牧渔，建设海上牧场、‘蓝色粮仓’”，构建多元化食物供给体系。“大农业观”“大食物观”突出体现的思维方式是（）", "options": {"A": "极限思维", "B": "历史思维", "C": "系统思维", "D": "逆向思维"}, "answer": "C", "explain": ""}, {"id": "y2025-2", "num": 2, "type": "single", "chapter": "", "stem": "马克思认为：“对人类生活形式的思索，从而对这些形式的科学分析，总是采取同实际发展相反的道路。这种思索是从事后开始的，就是说，是从发展过程的完成的结果开始的。”这种“从后思索法”所揭示的内涵是，历史的发展总是按照时间顺序从过去到现在以至未来，而对历史的认识则要遵循相反的顺序。下列表述与“从后思索法”相一致的是（）", "options": {"A": "我思故我在", "B": "人体解剖对于猴体解剖是一把钥匙", "C": "逻辑与历史在各具体环节上具有一致性", "D": "历史发展的一般进程拒斥个别发展阶段的特殊性"}, "answer": "B", "explain": ""}, {"id": "y2025-3", "num": 3, "type": "single", "chapter": "", "stem": "唯物史观从人民群众创造历史这一基本前提出发，既明确了人民群众是历史的创造者，也不否认个人在历史上的作用。习近平在纪念毛泽东同志诞辰120周年座谈会上，对如何评价历史人物作了精辟论述：“不能把历史顺境中的成功简单归功于个人，也不能把历史逆境中的挫折简单归咎于个人。不能用今天的时代条件、发展水平、认识水平去衡量和要求前人，不能苛求前人干出只有后人才能干出的业绩来。”这一论述表明（）", "options": {"A": "杰出个人与人民群众的历史作用是同等重要的", "B": "杰出人物的智慧和性格能够改变历史发展的基本方向", "C": "杰出人物在逆境时发挥的历史作用比在顺境时更大", "D": "要从特定的历史条件出发对历史人物作具体全面的考察和评价"}, "answer": "D", "explain": ""}, {"id": "y2025-4", "num": 4, "type": "single", "chapter": "", "stem": "1916年，列宁在《无产阶级革命的军事纲领》一文中指出，社会主义“将首先在一个或者几个国家内获得胜利，而其余的国家在一段时间内将仍然是资产阶级的或资产阶级以前的国家”。列宁得出这一结论的依据是（）", "options": {"A": "世界各国无产阶级的国际大联盟已经形成", "B": "资本主义的普选制为社会主义革命创造了新条件", "C": "资本主义的发展在各个国家是极不平衡的", "D": "工人阶级的革命意识与经济发展水平呈正相关性"}, "answer": "C", "explain": ""}, {"id": "y2025-5", "num": 5, "type": "single", "chapter": "", "stem": "独立自主是毛泽东思想活的灵魂。毛泽东在《反对本本主义》一文中指出：“中国革命斗争的胜利要靠中国同志了解中国情况。”这是独立自主思想最初的明确表述。毛泽东当时作出这一表述，主要是为了（）", "options": {"A": "巩固和发展统一战线", "B": "反对党内存在的教条主义倾向", "C": "防止各种非无产阶级思想的侵蚀", "D": "改变红军中残留的旧军队的不良作风"}, "answer": "B", "explain": ""}, {"id": "y2025-6", "num": 6, "type": "single", "chapter": "", "stem": "邓小平理论作为中国特色社会主义理论体系的开篇之作，第一次比较系统地初步回答了建设中国特色社会主义的一系列基本问题。其中为建设中国特色社会主义提供总依据的是（）", "options": {"A": "社会主义根本任务和发展战略理论", "B": "社会主义本质理论", "C": "社会主义初级阶段理论", "D": "社会主义社会矛盾学说"}, "answer": "C", "explain": ""}, {"id": "y2025-7", "num": 7, "type": "single", "chapter": "", "stem": "任何文化要立得住、行得远，要有引领力、凝聚力、塑造力、辐射力，就必须有自己的主体性。习近平总书记指出：“中国共产党历来重视文化，新时代我们在道路自信、理论自信、制度自信的基础上增加了文化自信。文化自信就来自我们的文化主体性。”新时代这一主体性最有力的体现是（）", "options": {"A": "创立习近平新时代中国特色社会主义思想", "B": "实现中华优秀传统文化创造性转化、创新性发展", "C": "铸牢中华民族共同体意识", "D": "把握中华文明发展规律"}, "answer": "A", "explain": ""}, {"id": "y2025-8", "num": 8, "type": "single", "chapter": "", "stem": "开放是中国式现代化的鲜明标识。在世界变局加速演进的背景下，开放不仅是推动我国高质量发展的必然选择，也是实现中华民族伟大复兴的关键一招。我国坚定不移扩大高水平对外开放，发展更高水平开放型经济，不断以中国新发展为世界提供新机遇。当前我国的高水平对外开放主要是指（）", "options": {"A": "全局性开放", "B": "要素型开放", "C": "政策性开放", "D": "制度型开放"}, "answer": "D", "explain": ""}, {"id": "y2025-9", "num": 9, "type": "single", "chapter": "", "stem": "经过接续奋斗，我国社会建设全面加强，幼有所育、学有所教、劳有所得、病有所医、老有所养、住有所居、弱有所扶得到更好实现，人民对美好生活的向往不断变为现实。新时代加强社会建设的重要着力点是（）", "options": {"A": "健全和完善社会保障体系", "B": "加强城乡社区治理", "C": "建立健全第三次分配机制", "D": "建设更高水平的平安中国"}, "answer": "A", "explain": ""}, {"id": "y2025-10", "num": 10, "type": "single", "chapter": "", "stem": "鸦片战争后，随着资本—帝国主义的侵入，中国社会经济发生了很大的变化。毛泽东在《中国革命和中国共产党》一文中指出，外国资本主义的侵入，破坏了中国自给自足的自然经济的基础，为中国资本主义生产的发展造成了某些客观的条件和可能，这是变化的一个方面；还有和这个变化同时存在的另一个方面，这就是（）", "options": {"A": "封建地主的土地所有制遭到彻底破坏", "B": "帝国主义勾结中国封建势力压迫中国资本主义的发展", "C": "地方性农业经济的破坏和统一的资本主义经济的形成", "D": "中国在政治经济上完全成为西方的附庸"}, "answer": "B", "explain": ""}, {"id": "y2025-11", "num": 11, "type": "single", "chapter": "", "stem": "实现中华民族伟大复兴是中华民族近代以来最伟大的梦想。在近代中国，一些爱国人士提出“实业救国”的主张，并为此付出了巨大的努力，但并没有实现救国的目标。近代中国“实业救国”的道路之所以走不通，是因为（）", "options": {"A": "民族独立和人民解放尚未实现", "B": "工业基础落后，工人阶级人数不多", "C": "各地区政治、经济、文化发展不平衡", "D": "农民日益贫困化以至大批破产"}, "answer": "A", "explain": ""}, {"id": "y2025-12", "num": 12, "type": "single", "chapter": "", "stem": "1945年4月23日至6月11日，中国共产党第七次全国代表大会在延安举行。这是一次团结的大会，胜利的大会。七大的历史性贡献是（）", "options": {"A": "把毛泽东思想确立为党的指导思想并写入党章", "B": "正式提出了民主集中制的组织原则", "C": "制定了反帝反封建的民主革命纲领", "D": "确立了思想建党政治建军原则"}, "answer": "A", "explain": ""}, {"id": "y2025-13", "num": 13, "type": "single", "chapter": "", "stem": "1981年6月，党的十一届六中全会通过了《关于建国以来党的若干历史问题的决议》。《决议》彻底否定了“文化大革命”，对十一届三中全会以来逐步确立的适合中国情况的建设社会主义现代化的正确道路作了概括，强调（）", "options": {"A": "党和国家的工作重心从农村转向城市", "B": "党的各项工作都必须服从和服务于经济建设", "C": "在经济建设中优先发展重工业", "D": "必须彻底克服教条主义和经验主义的思想"}, "answer": "B", "explain": ""}, {"id": "y2025-14", "num": 14, "type": "single", "chapter": "", "stem": "互联网是人们获取信息和交流沟通的重要渠道，深刻影响着每个人的生活、工作、学习。移动支付信息、信用卡消费记录等，都是足以“定义”个体的数据信息。一旦这些信息被非法使用，会侵害当事人的隐私。《民法典》规定任何组织或者个人不得以刺探、侵扰、泄露、公开等方式侵害他人的隐私权。隐私权属于（）", "options": {"A": "生命健康权", "B": "民主管理权", "C": "人格尊严权", "D": "通信自由权"}, "answer": "C", "explain": ""}, {"id": "y2025-15", "num": 15, "type": "single", "chapter": "", "stem": "中国共产党第二十届中央委员会第三次全体会议于2024年7月15日至18日在北京举行。全会审议通过了《中共中央关于进一步全面深化改革、推进中国式现代化的决定》。全会提出，中国式现代化的基础性、战略性支撑是（）", "options": {"A": "高水平社会主义市场经济体制", "B": "科学的宏观调控、有效的政府治理", "C": "相互协调的物质文明和精神文明", "D": "教育、科技、人才"}, "answer": "D", "explain": ""}, {"id": "y2025-16", "num": 16, "type": "single", "chapter": "", "stem": "2024年9月4日至6日，中非合作论坛北京峰会成功举行。习近平主席出席峰会开幕式并发表主旨讲话。本次峰会的重要成果之一是首次提出（）", "options": {"A": "支持非盟成为20国集团成员", "B": "欢迎更多非洲国家加入“金砖大家庭”", "C": "在非洲启动建设农业发展与减贫示范村", "D": "在非洲打造全球安全倡议“合作示范区”"}, "answer": "D", "explain": ""}, {"id": "y2025-17", "num": 17, "type": "multiple", "chapter": "", "stem": "在病毒的持久斗争和协同进化，是人类演化的重要推动力之一。一方面，病毒在使人类饱受疾病甚至死亡的困扰中，不断地对人类基因组织进行利用和改造。另一方面，人类自身的免疫系统在积极对抗病毒入侵时，或有效清除外来微生物，或使得整合到人类基因组中的病毒序列逐渐被宿主细胞的遗传调控系统接管，以实现协同进化。从人类与病毒的关系可以类推出人类与自然关系的正确判断有（）", "options": {"A": "人与自然的关系纯粹是自然界的生物演变过程", "B": "人类社会活动的规律由生物进化的规律所决定", "C": "人与自然的和谐共生以自然界的客观规律为基础", "D": "人的活动的选择性与自然界的先在性是动态统一的"}, "answer": "CD", "explain": ""}, {"id": "y2025-18", "num": 18, "type": "multiple", "chapter": "", "stem": "戴上驱动气动手套，稳稳握住水杯，拿起、喝水、放下，截瘫患者自主“脑控”喝水……脑机接口技术在生物医学、智能机器人等领域取得重大进展。脑机接口建立了大脑与计算机或其他外部设备之间的直接通信通道，使个体无需经过传统的肌肉运动或神经系统，直接用大脑活动来控制外部设备或应用。用脑电活动控制动作这些过去只在科幻小说里出现的技术，现在正逐步成为现实。脑机接口技术的发展和应用表明，人类意识（）", "options": {"A": "能够通过智能机器实现对象化现实化", "B": "能够被具有情感、意念、意志的智能机器所代替", "C": "能够还原为数据信息并取代人类社会交往的真情实感", "D": "能够物化为机器的物理运动从而延伸意识器官的功能"}, "answer": "AD", "explain": ""}, {"id": "y2025-19", "num": 19, "type": "multiple", "chapter": "", "stem": "竹的浑身都是宝。苏东坡曾经感叹：“食者竹笋，庇者竹瓦，载者竹筏，爨者竹薪，衣者竹皮，书者竹纸，履者竹鞋，真可谓一日不可无此君也耶？”竹的多样化功能表明，事物的价值（）", "options": {"A": "随着主体、客体及其相互关系的变化而变化", "B": "随着主体的欲望、情感和兴趣的转移而变化", "C": "随着实践发展而由潜在价值转化为现实价值", "D": "随着客体属性的自然显露而转化为社会价值"}, "answer": "AC", "explain": ""}, {"id": "y2025-20", "num": 20, "type": "multiple", "chapter": "", "stem": "在分析商品使用价值与价值时，马克思指出：“一个物可以有用，而且是人类劳动产品，但不是商品。”下列选项中符合马克思所说的“一个物”的有（）", "options": {"A": "中世纪农民为封建主生产作为代役租的粮食", "B": "农民为养活家人而生产并消费的农副产品", "C": "农业资本家为获取利润而生产的农产品", "D": "封建社会时期佃农生产并上缴给地主的地租"}, "answer": "ABD", "explain": ""}, {"id": "y2025-21", "num": 21, "type": "multiple", "chapter": "", "stem": "随着工业中现代化、自动化服务和新工艺的广泛采用，新的生产管理方法和生产组织形式的广泛实行，当代资本主义社会的工人越来越多的在生产过程中从事监督者、调节者和操作者的工作，实现了从传统劳动方式向现代劳动方式的转变。这表明（）", "options": {"A": "资本主义生产资料所有制性质正在发生根本的转变", "B": "资本主义生产关系也要适应生产力发展要求而调整", "C": "资本主义社会的阶级结构和社会阶层发生了新变化", "D": "资产阶级不对生产工具和生产关系进行革命，就不能生存"}, "answer": "BC", "explain": ""}, {"id": "y2025-22", "num": 22, "type": "multiple", "chapter": "", "stem": "党的历史是一部不断推进马克思主义中国化时代化的历史，在这一历史进程中产生了毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想。马克思主义中国化时代化的理论成果是一脉相承又与时俱进的关系，这主要体现在（）", "options": {"A": "都面对共同的时代主题和历史任务", "B": "都贯穿实事求是、群众路线、独立自主的立场观点和方法", "C": "都科学回答了时代提出的重大理论和实践课题", "D": "都以独创性的理论成果丰富和发展了马克思主义"}, "answer": "BCD", "explain": ""}, {"id": "y2025-23", "num": 23, "type": "multiple", "chapter": "", "stem": "民营经济是我国非公有制经济的重要经济组织形式，是推动我国全面建成社会主义现代化强国的重要力量。截止2024年9月底，我国实有民营经济主体量已达1.8亿户，占经营主体总量的96.37%。十余年间增长超过四倍，民营经济的迅速发展充分说明（）", "options": {"A": "非公有制经济发展的政策制度环境不断优化", "B": "促进非公有制经济发展壮大的体制机制不断完善", "C": "非公有制经济在国民经济中的主导作用不断强化", "D": "非公有制经济发展活力不断提升"}, "answer": "ABD", "explain": ""}, {"id": "y2025-24", "num": 24, "type": "multiple", "chapter": "", "stem": "人民当家作主，必须通过一定的制度予以保障。在上海虹桥街道古北市民中心有幅漫画：一道绚丽的“彩虹桥”悬挂天空。这一头是虹桥街道，那一头是全国人大。一只白鸽把信从这头捎到那头。虹桥街道是全国人大常委会法工委首批设立的四个基层立法联系点之一。设立基层立法联系点有利于（）", "options": {"A": "健全汇集民智工作机制", "B": "完善民意表达平台载体", "C": "践行全过程人民民主", "D": "丰富中国特色社会主义民主形式"}, "answer": "ABCD", "explain": ""}, {"id": "y2025-25", "num": 25, "type": "multiple", "chapter": "", "stem": "近些年，我国每年主要电器产品报废量超2亿台，手机废弃量达4亿部以上，其中蕴藏着大量有色金属、塑料、橡胶等资源。加快发展方式绿色转型，必须更加重视资源的再生循环利用，加快构建废弃物循环利用体系。据预测，到2030年，我国固废分类资源化利用的产值规模将达7—8万亿元。推动废弃物循环利用，有利于（）", "options": {"A": "形成节约集约循环利用的资源观", "B": "转变资源利用方式，提高资源利用效率", "C": "实现生产系统和生活系统循环链接", "D": "科学推进水土流失综合治理"}, "answer": "ABC", "explain": ""}, {"id": "y2025-26", "num": 26, "type": "multiple", "chapter": "", "stem": "推动高质量发展，文化是重要支点。近年来，我国文化产业蓬勃发展，文化消费活力进一步增强，文化在经济活动中的作用越来越突出。文化之所以能够成为推动高质量发展的重要支点，是因为（）", "options": {"A": "文化能为经济社会发展提供价值指引和精神力量", "B": "文化建设是解决新时代我国社会主要矛盾的根本途径", "C": "文化融入经济活动有助于激发社会动能、提升发展品质", "D": "文化繁荣有助于促进社会创新创造的活力动力"}, "answer": "ACD", "explain": ""}, {"id": "y2025-27", "num": 27, "type": "multiple", "chapter": "", "stem": "1921年7月23日，中国共产党第一次全国代表大会在上海召开，宣告中国共产党正式成立。中国共产党成立的历史特点有（）", "options": {"A": "从一开始就是一个以马克思列宁主义理论为基础的党", "B": "是在半封建半殖民地中国的农民运动基础上产生的政党", "C": "从一开始就是一个重视与其他党派或政治力量合作的党", "D": "是区别于第二国际旧式社会改良党的新型工人阶级革命政党"}, "answer": "AD", "explain": ""}, {"id": "y2025-28", "num": 28, "type": "multiple", "chapter": "", "stem": "党的六届六中全会是在抗日战争即将进入新阶段时召开的一次重要会议。毛泽东曾说过：“六中全会是决定中国之命运的。”下列关于六届六中全会表述正确的有（）", "options": {"A": "会上毛泽东明确提出“马克思主义的中国化”命题", "B": "会议提出了由新民主主义社会向社会主义社会转变的发展方向", "C": "会议纠正了王明的右倾错误，统一了全党的思想和步调", "D": "会议指明了党内小资产阶级思想的来源、表现及纠正方法"}, "answer": "AC", "explain": ""}, {"id": "y2025-29", "num": 29, "type": "multiple", "chapter": "", "stem": "1992年1月18日至2月21日，邓小平先后到武昌、深圳、珠海、上海等地视察，发表了重要谈话。他在谈话中提出的重要论断有（）", "options": {"A": "“革命是解放生产力，改革也是解放生产力”", "B": "“走自己的道路，建设有中国特色的社会主义”", "C": "“计划多一点还是市场多一点，不是社会主义与资本主义的本质区别”", "D": "“在整个改革开放的过程中，必须始终注意坚持四项基本原则”"}, "answer": "ACD", "explain": ""}, {"id": "y2025-30", "num": 30, "type": "multiple", "chapter": "", "stem": "法治思维的要义是把对法治的尊崇、对法律的敬畏转化成思维方式和行为方式。法治思维内容十分丰富，其中之一是法律至上。法律至上表现为（）", "options": {"A": "法律必须遵守，违反法律要受到惩罚", "B": "按照法律的逻辑来分析和解决一切社会问题", "C": "法律在本国主权范围内对所有人具有普遍的约束力", "D": "当同一项社会关系同时受到多种社会规范的调整而多种社会规范又相互矛盾时，要优先考虑法律规范的适用"}, "answer": "ACD", "explain": ""}, {"id": "y2025-31", "num": 31, "type": "multiple", "chapter": "", "stem": "集体主义是社会主义道德的原则，是调节国家利益、社会整体利益和个人利益关系的基本原则。集体主义强调（）", "options": {"A": "个人利益应当无条件服从集体利益", "B": "国家利益高于个人利益", "C": "集体利益是个人所有利益的总和", "D": "重视和保障个人的正当利益"}, "answer": "BD", "explain": ""}, {"id": "y2025-32", "num": 32, "type": "multiple", "chapter": "", "stem": "2024年6月21日，最高人民法院、最高人民检察院、公安部、国家安全部、司法部联合发布《关于依法惩治“台独”顽固分子分裂国家、煽动分裂国家犯罪的意见》，自发布之日起施行。其意义和作用体现在（）", "options": {"A": "明确了各类“台独”分裂行径的犯罪性质、刑事责任和惩处程序", "B": "回应了两岸最大多数民众的诉求与期盼", "C": "彰显了捍卫国家主权、统一和领土完整的坚定立场", "D": "充实了反“台独”、反干涉的法律工具箱"}, "answer": "ABCD", "explain": ""}, {"id": "y2025-33", "num": 33, "type": "multiple", "chapter": "", "stem": "金砖合作机制诞生于新兴市场和发展中国家群体性崛起的历史大潮中，牵动着世界格局演变和国际力量对比。成立18年来，金砖不断发展壮大，金砖国家的人口占全球近一半，经济总量占世界比重超过三成，对世界经济增长贡献率超过50%。2024年10月22日至24日，金砖国家领导人第十六次会晤在喀山举行，决定邀请新一批国家成为金砖伙伴国。金砖机制持续壮大，金砖合作常葆活力，关键在于（）", "options": {"A": "以开放包容为襟怀", "B": "以合作共赢为目标", "C": "以公平正义为追求", "D": "以构建同盟为路径"}, "answer": "ABC", "explain": ""}]}, {"id": "y2026", "title": "2026年真题", "questions": [{"id": "y2026-1", "num": 1, "type": "single", "chapter": "", "stem": "“十五五”时期在基本实现社会主义现代化进程中具有承前启后的重要地位。习近平总书记在《关于〈中共中央关于制定国民经济和社会发展第十五个五年规划的建议〉的说明》中指出：“实现社会主义现代化是一个阶梯式递进、不断发展进步的历史过程，需要不懈努力、接续奋斗。”“阶梯式递进、不断发展进步”的过程是一个（）\n①前进性与曲折性相统一的过程\n②规律性与能动性相统一的过程\n③连续性与非连续性相统一的过程\n④直线性与循环性相统一的过程", "options": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④"}, "answer": "A", "explain": ""}, {"id": "y2026-2", "num": 2, "type": "single", "chapter": "", "stem": "一般认为，在重力的作用下，当树叶飘离枝头坠落地面时，密度大的叶片正面更容易朝下着地。科学研究表明，叶片的下落过程并非简单的直线下落，因为叶片形状并非完全对称，加之空气阻力、涡流和风等因素影响，叶片以翻滚和旋转的复杂运动形态下落。内部结构差异与外在形态变化在一定程度上影响着叶片的飘落状态，旋转动能和空气阻力也是影响叶片在下降过程中朝向的因素。叶片下落的过程表明，事物运动的规律（）", "options": {"A": "取决于外在因素作用的大小", "B": "是纯粹偶然因素作用的结果", "C": "取决于物质形态变化的概率", "D": "是各种因素相互作用的结果"}, "answer": "D", "explain": ""}, {"id": "y2026-3", "num": 3, "type": "single", "chapter": "", "stem": "《孙子兵法》将变化视作军事运行的常态，认为“兵无常势，水无常形”，要使战争主动权始终掌握在自己手中，就要根据不同的情况作灵活的应对。由此可知，“兵无常势，水无常形”契合了（）", "options": {"A": "“原则是研究的出发点”的观点", "B": "“理性是衡量一切的唯一尺度”的观点", "C": "“意志自由只是借助于对事物的认识来作出决定”的观点", "D": "“思维的本质在于把意识的因素联合为一个统一体”的观点"}, "answer": "C", "explain": ""}, {"id": "y2026-4", "num": 4, "type": "single", "chapter": "", "stem": "列宁在谈到未来社会时写道：“我们可以绝对有把握地说，剥夺资本家一定会使人类社会的生产力蓬勃发展。但是，生产力将以什么样的速度向前发展，将以什么样的速度发展到打破分工、消灭脑力劳动和体力劳动的对立、把劳动变为‘生活的第一需要’，这都是我们所不知道而且也不可能知道的。”这段话表明，对未来社会可以预见的是（）", "options": {"A": "生产力发展的具体方式", "B": "生产力将有更大的发展", "C": "劳动成为生活的唯一需要", "D": "每个人获得无差别的全面的发展"}, "answer": "B", "explain": ""}, {"id": "y2026-5", "num": 5, "type": "single", "chapter": "", "stem": "毛泽东在谈到中国革命经验时指出：“党的领导机关，包括全国性的、省的和县的负责同志，也要亲自调查一两个农村，解剖一两个‘麻雀’。这就叫做‘解剖学’。”毛泽东在此强调“解剖麻雀”的实际意义在于（）", "options": {"A": "理论只有彻底，才能说服人", "B": "反对经验主义、尾巴主义和机会主义", "C": "没有革命的理论就不会有革命的实践", "D": "全面深入了解本国实际，发现本国革命的规律"}, "answer": "D", "explain": ""}, {"id": "y2026-6", "num": 6, "type": "single", "chapter": "", "stem": "1987年3月25日，邓小平在审阅《关于草拟十三大报告大纲的设想》时，对《设想》提出十三大报告全篇拟以社会主义初级阶段作为立论的根据作出批示：“这个设计好。”《设想》的设计思路好就好在，它首次（）", "options": {"A": "系统阐明了社会主义与共产主义的关系", "B": "提出我们的社会主义制度还是处在社会主义初级阶段", "C": "明确了社会主义初级阶段是制定路线方针政策的出发点和根本依据", "D": "明确了发展生产力是社会主义现代化的根本任务"}, "answer": "C", "explain": ""}, {"id": "y2026-7", "num": 7, "type": "single", "chapter": "", "stem": "中国特色社会主义制度是党和人民长期实践探索形成的，既具有社会主义的性质，又吸收了古今中外制度建设的有益成果。它是一个严密完整的科学制度体系，其中具有统领地位的是（）", "options": {"A": "民族区域自治制度", "B": "党的领导制度", "C": "社会主义基本经济制度", "D": "全过程人民民主制度"}, "answer": "B", "explain": ""}, {"id": "y2026-8", "num": 8, "type": "single", "chapter": "", "stem": "完善公共安全体系，推动公共安全治理模式转型，是提高公共安全治理水平的一项重要内容。我国公共安全治理模式的转型主要是指（）", "options": {"A": "从分散管理为主转向单一管理为主", "B": "从政府监管为主转向市场监管为主", "C": "从事后处置为主转向事前预防为主", "D": "从危机疏导为主转向危机干预为主"}, "answer": "C", "explain": ""}, {"id": "y2026-9", "num": 9, "type": "single", "chapter": "", "stem": "绿色发展是中国式现代化的鲜明底色。环保曾经是企业的“加分项”，而今却是生存的“及格线”；曾经无处堆放的工业废物，如今许多已成为可以生财的宝贝。消费者的思维也发生了潜移默化的转变：外卖选择无需餐具，出行采用共享单车，买家电选一级能效……这些看得见摸得着的变化充分说明，生态环境问题的解决归根到底取决于（）", "options": {"A": "国土空间开发布局的优化", "B": "经济发展方式和生活方式的转变", "C": "生态文明制度体系的完善", "D": "山水林田湖草沙一体化保护和系统治理"}, "answer": "B", "explain": ""}, {"id": "y2026-10", "num": 10, "type": "single", "chapter": "", "stem": "1840年，英国发动的鸦片战争以清政府的失败而告终。此后，西方列强通过一系列不平等条约在中国攫取了大量特权，中国历史的发展因此发生重大转折，这主要表现为（）", "options": {"A": "中国出现资本主义因素", "B": "中国社会性质发生改变", "C": "地主阶级退出历史舞台", "D": "清朝统治集团发生分化"}, "answer": "B", "explain": ""}, {"id": "y2026-11", "num": 11, "type": "single", "chapter": "", "stem": "毛泽东在《中国共产党在民族战争中的地位》一文中指出：“遵义会议纠正了在第五次反‘围剿’斗争中所犯的‘左’倾机会主义性质的严重的原则错误，团结了党和红军，使得党中央和红军主力胜利地完成了长征，转到了抗日的前进阵地，执行了抗日民族统一战线的新政策。”遵义会议之所以成为党的历史上一个生死攸关的转折点，是因为这次会议（）", "options": {"A": "制定了抗日民族统一战线的策略总方针", "B": "确立了马克思主义建党建军原则", "C": "开辟了农村包围城市、武装夺取政权的道路", "D": "开启了中国共产党独立自主解决中国革命实际问题的新阶段"}, "answer": "D", "explain": ""}, {"id": "y2026-12", "num": 12, "type": "single", "chapter": "", "stem": "1948年秋，中国人民解放军先后发动辽沈、淮海、平津三大战役，三大战役历时四个多月，取得决定性胜利，这表明（）", "options": {"A": "国民党的主要军事力量基本上被摧毁", "B": "中国革命重心已经从农村转向城市", "C": "延续22年之久的国民党统治已经覆灭", "D": "人民解放军立刻转入全国性反攻的形势已经成熟"}, "answer": "A", "explain": ""}, {"id": "y2026-13", "num": 13, "type": "single", "chapter": "", "stem": "1992年邓小平南方谈话和党的十四大召开后，我国的现代化建设事业进入从计划经济体制向社会主义市场经济体制转变的新阶段。这一阶段，建立社会主义市场经济体制的中心环节是（）", "options": {"A": "价格体制改革", "B": "财政制度改革", "C": "国有企业改革", "D": "流通体制改革"}, "answer": "C", "explain": ""}, {"id": "y2026-14", "num": 14, "type": "single", "chapter": "", "stem": "习近平强调：“我为什么要对青年讲讲社会主义核心价值观这个问题？是因为青年的价值取向决定了未来整个社会的价值取向，而青年又处在价值观形成和确立的时期，抓好这一时期的价值观养成十分重要，这就像穿衣服扣扣子一样，如果第一粒扣子扣错了，剩余的扣子都会扣错。人生的扣子从一开始就要扣好。”习近平以人生的扣子“从一开始”就要扣好作比喻，主要强调了（）", "options": {"A": "核心价值观是青年成长的关键", "B": "对青年的价值观教育需抓早抓实", "C": "青年健康成长需要核心价值观引领", "D": "核心价值观教育是青年立身之本"}, "answer": "B", "explain": ""}, {"id": "y2026-15", "num": 15, "type": "single", "chapter": "", "stem": "2025年10月24日，十四届全国人大常委会第十八次会议经表决，通过了关于设立台湾光复纪念日的决定，以法律形式将10月25日设立为台湾光复纪念日。与“台湾光复纪念日”相关的历史事件是指，1945年10月25日（）", "options": {"A": "中国战区台湾省受降仪式在台北举行", "B": "中、美、英等国发表《开罗宣言》和《波茨坦公告》", "C": "日本无条件投降仪式在密苏里号战列舰上举行", "D": "日本天皇发布《终战诏书》"}, "answer": "A", "explain": ""}, {"id": "y2026-16", "num": 16, "type": "single", "chapter": "", "stem": "2025年6月16日，联合国大会表决通过一项决议，宣布每年12月4日为“反对单边强制措施国际日”。其目的在于（）", "options": {"A": "敦促各国不采取、不颁布、不实行任何单边经济、金融或贸易措施", "B": "促进国际社会联合起来反对美国发动的单边“关税战”", "C": "彻底消除国际关系中的“单边主义”现象", "D": "重新确立指导国家间和平关系的规范和原则"}, "answer": "A", "explain": ""}, {"id": "y2026-17", "num": 17, "type": "multiple", "chapter": "", "stem": "20世纪30年代以来，一系列天文观测显示，宇宙中存在大量产生引力却不发光的“暗物质”。暗物质和可见世界的物质不同，它不参与电磁相互作用，不发光。不过科学家基于暗物质引力效应，能够测绘其在宇宙中的分布，进而探索宇宙的结构演化和星系形成。人们对暗物质的认识表明（）", "options": {"A": "物质存在的客观性只有通过人们具体的感知而得以确证", "B": "物质不依赖于人的意识而存在，并能为人类的意识所反映", "C": "物质世界是外在于人类的、直观的、机械的、自在的对象", "D": "物质世界不是超越于人类理性所能理解的现象之外的“物自体”"}, "answer": "BD", "explain": ""}, {"id": "y2026-18", "num": 18, "type": "multiple", "chapter": "", "stem": "中国科学家发现，马铃薯中约40%的基因来自番茄祖先“茄小姐”，另外60%的基因则来自类马铃薯植物“薯先生”。这种杂交不仅形成了一个新物种，还催生出一个全新的器官——块茎。根据这一发现，科学家提出一种新的育种路径：利用番茄作为遗传底盘，导入块茎形成关键基因，培育出能“地下结土豆，地上长番茄”的新型作物。科学家能够利用基因技术进行新型作物的培育，是因为（）", "options": {"A": "对客观事物规律的把握是人们正确活动的基础", "B": "事物之间的联系通常都是人们主观意志赋予的", "C": "改造客观世界的前提是人们必须先改造主观世界", "D": "人类改造世界的能力随着科学实践的发展而发展"}, "answer": "AD", "explain": ""}, {"id": "y2026-19", "num": 19, "type": "multiple", "chapter": "", "stem": "人类的知识和认知能力是建立在人的理性本身之上还是建立在外部感官经验基础之上，是一个长期争论的问题。有科学家认为，人的智慧并非独立依赖思维而产生，而是在长期进化中对外部世界的适应，是大脑、身体、环境交织作用的结果。随着人工智能的发展，具身智能通过具象的互动与反馈不断优化决策与行动，某种程度上实现了让机器像人类一样学习和思考的认知革新。这表明，人类认知能力（）", "options": {"A": "随着生活实践的发展而发展", "B": "随着具身智能的发展而系统退化", "C": "随着认识工具的变革而深化", "D": "随着人与外部世界互动的加深而演进"}, "answer": "ACD", "explain": ""}, {"id": "y2026-20", "num": 20, "type": "multiple", "chapter": "", "stem": "杨振宁对科学美，尤其对物理和数学之美，有过长期的关注和深入的思考。他在《美与理论物理学》一文中说道：“如果把不同科学家的工作拿来比较一下，就会发现他们的取舍方针很不同，他们对于自然现象里的规律和其美与妙的了解不同，这就决定了他们的风格，也由此而决定了他们的工作的重要性。”科学家对“科学美”的感受能够影响其研究视角和研究风格，这表明（）", "options": {"A": "感性认识在认识过程中起着决定性的作用", "B": "科学研究中的创新思维既包括感性认识也包括理性认识", "C": "审美观照最能够揭示自然界事物发展的本质规律和发展趋势", "D": "审美情感等非理性因素对于人的认识活动具有激活、驱动作用"}, "answer": "BD", "explain": ""}, {"id": "y2026-21", "num": 21, "type": "multiple", "chapter": "", "stem": "探索文明源流不能无视河流，黄河、长江、尼罗河、幼发拉底河、底格里斯河，都是文明的重要源头。河流对人类文明的作用不仅表现在物质方面，也显示于精神方面。所谓“同饮一江水”，说的就是长期生活在同一河畔、同一流域的人类群体，形成诸多共同的文化要素，进而产生共同的文化心态。河流对人类文明的作用表明（）", "options": {"A": "文明之间的沟通交流主要是通过河流完成的", "B": "每一种文明都生长于特定的自然环境和民族传统", "C": "自然地理环境的优劣能加速或者延缓文明的进步", "D": "地理环境在文明形态的形成发展中起着决定性作用"}, "answer": "BC", "explain": ""}, {"id": "y2026-22", "num": 22, "type": "multiple", "chapter": "", "stem": "1956年8月24日，毛泽东在同音乐工作者谈话时说：“作为中国人，不提倡中国的民族音乐是不行的。但是军乐队总不能用唢呐、胡琴……地球上有二十七亿人，如果唱一种曲子是不行的……演些外国音乐，不要害怕。隋朝、唐朝的九部乐、十部乐，多数是西域音乐，还有高丽、印度来的外国音乐。演外国音乐并没有使我们自己的音乐消亡了，我们的音乐继续在发展……应该越搞越中国化，而不是越搞越洋化。”毛泽东在这里借谈音乐问题阐述的处理中外文化关系的基本观点是（）", "options": {"A": "要尊重文化多样性", "B": "要有自己的文化自信", "C": "对外国的东西一概排斥或者全盘吸收都是错误的", "D": "要学习外国的长处，创造出有自己民族风格的东西"}, "answer": "ABCD", "explain": ""}, {"id": "y2026-23", "num": 23, "type": "multiple", "chapter": "", "stem": "有效市场和有为政府相结合是中国特色社会主义市场经济的鲜明特征，也是我国在长期发展实践中积累的宝贵经验。有为政府的作用，是指政府在科学的宏观调控和有效的政府治理方面能（）", "options": {"A": "弥补市场不足", "B": "直接干预各领域经济活动", "C": "引导市场更好发挥作用", "D": "规范市场竞争秩序"}, "answer": "ACD", "explain": ""}, {"id": "y2026-24", "num": 24, "type": "multiple", "chapter": "", "stem": "2025年12月18日，海南自由贸易港正式启动全岛封关。高标准建设海南自由贸易港是以习近平同志为核心的党中央着眼新时代全面深化改革开放作出的重大决策。高标准建设海南自由贸易港有利于（）", "options": {"A": "引领新时代高水平对外开放", "B": "助力全国构建新发展格局", "C": "打造形态多样的开放高地", "D": "推动我国自由贸易试验区建设"}, "answer": "ABCD", "explain": ""}, {"id": "y2026-25", "num": 25, "type": "multiple", "chapter": "", "stem": "民营经济是社会主义市场经济的重要组成部分，是推进中国式现代化的生力军，是高质量发展的重要基础。2025年5月20日，《中华人民共和国民营经济促进法》正式施行。该法的施行在我国民营经济发展史上的意义体现在（）", "options": {"A": "它是我国第一部专门关于民营经济发展的基础性法律", "B": "它首次将“毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展”写进法律", "C": "它首次明确外商投资经济的法律地位", "D": "它首次在法律中规定“促进民营经济持续、健康、高质量发展，是国家长期坚持的重大方针政策”"}, "answer": "ABD", "explain": ""}, {"id": "y2026-26", "num": 26, "type": "multiple", "chapter": "", "stem": "习近平总书记指出：“统一战线是党克敌制胜、执政兴国的重要法宝，是团结海内外全体中华儿女实现中华民族伟大复兴的重要法宝，必须长期坚持。”尽管统一战线在不同时期担负的历史任务有所不同，团结联合的范围对象有所变化，但始终不变的是（）", "options": {"A": "大团结大联合的本质要求", "B": "凝聚人心、汇聚力量的作用", "C": "求同存异的原则", "D": "统战工作的政策策略"}, "answer": "ABC", "explain": ""}, {"id": "y2026-27", "num": 27, "type": "multiple", "chapter": "", "stem": "2018年5月2日，习近平总书记在北京大学考察时说：“中国共产党的主要创始人和一些早期著名活动家，正是在北大工作或学习期间开始阅读马克思主义著作，传播马克思主义的，并推动了中国共产党的建立。”符合这一论述的史实是（）", "options": {"A": "陈独秀创办《青年杂志》", "B": "李大钊组织成立马克思学说研究会", "C": "邓中夏在长辛店开办劳动补习学校", "D": "陈望道翻译《共产党宣言》"}, "answer": "BC", "explain": ""}, {"id": "y2026-28", "num": 28, "type": "multiple", "chapter": "", "stem": "80年前，中国人民赢得了抗日战争的伟大胜利。党的十八大以来，习近平总书记多次鲜明指出“中国共产党的中流砥柱作用是中国人民抗日战争胜利的关键”“中国人民抗日战争胜利是中国共产党发挥中流砥柱作用的伟大胜利”。中国共产党的中流砥柱作用体 const SECTION_BY_ID = new Map(SECTIONS.map(s => [s.id, s]));
const PAGE_SIZE = 10;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
let state = { section: SECTIONS[0].id, page: 1, answers: {} };
let pending = new Map();
let chatQid = null;

function esc(v) {
  return String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && saved.answers && typeof saved.answers === "object") state.answers = saved.answers;
    if (saved && SECTION_BY_ID.has(saved.section)) state.section = saved.section;
    if (saved && Number.isFinite(saved.page)) state.page = saved.page;
  } catch (e) { console.warn(e); }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { console.warn(e); }
}
function currentSection() { return SECTION_BY_ID.get(state.section) || SECTIONS[0]; }
function allQuestions() { return currentSection().questions; }
function totalPages() { return Math.max(1, Math.ceil(allQuestions().length / PAGE_SIZE)); }
function clampPage() { state.page = Math.min(Math.max(1, state.page), totalPages()); }
function pageQuestions() {
  const p = state.page;
  return allQuestions().slice((p - 1) * PAGE_SIZE, p * PAGE_SIZE);
}
function recordFor(q) { return state.answers[q.id] || null; }
function answerLetters(q) { return String(q.answer).split("").filter(Boolean).sort(); }
function picksFor(q, rec) { return rec ? rec.picks : [...(pending.get(q.id) || [])]; }
function isCorrect(q, picks) {
  const a = answerLetters(q), b = [...picks].sort();
  return a.length === b.length && a.every((x, i) => x === b[i]);
}
function stats() {
  const list = allQuestions();
  const answered = list.filter(q => recordFor(q)).length;
  const correct = list.filter(q => recordFor(q) && recordFor(q).correct).length;
  return { answered, correct, accuracy: answered ? Math.round(correct / answered * 100) : 0 };
}
function optionClass(q, letter, rec) {
  if (!rec) return (pending.get(q.id) || new Set()).has(letter) ? "picked" : "";
  if (answerLetters(q).includes(letter)) return "correct";
  if (rec.picks.includes(letter)) return "wrong";
  return "";
}
function cardHTML(q, index) {
  const rec = recordFor(q);
  const picks = picksFor(q, rec);
  const cls = rec ? (rec.correct ? "ok" : "bad") : "";
  const opts = ["A", "B", "C", "D"].map(letter => {
    const c = optionClass(q, letter, rec);
    const picked = picks.includes(letter);
    return `<button type="button" class="option ${c} ${rec ? "locked" : ""}" data-qid="${q.id}" data-letter="${letter}" aria-pressed="${picked}">
      <span class="letter">${letter}</span><span>${esc(q.options[letter] || "")}</span>
    </button>`;
  }).join("");
  const canSubmit = q.type === "multiple" && !rec && (pending.get(q.id) || new Set()).size > 0;
  const feedback = rec ? `<div class="feedback ${rec.correct ? "ok" : "bad"}">${rec.correct ? "✓ 回答正确" : "✕ 回答错误"} · 正确答案 <b>${esc(q.answer)}</b>${rec.correct ? "" : ` · 你的选择 ${rec.picks.join("")}`}</div>` : "";
  return `<article class="q-card ${cls}" data-card="${q.id}">
    <div class="q-head"><span class="q-num">${String(index + 1).padStart(2, "0")}</span><span class="q-type ${q.type}">${q.type === "multiple" ? "多选" : "单选"}</span>${q.chapter ? `<span class="q-chapter">${esc(q.chapter)}</span>` : ""}<button class="ai-mini" type="button" data-ai="${q.id}">AI解析</button></div>
    <p class="q-stem">${esc(q.stem)}</p>
    <div class="options">${opts}</div>
    ${canSubmit ? '<div class="submit-row"><button class="submit-btn" type="button" data-submit="' + q.id + '">提交答案</button></div>' : ""}
    ${feedback}${rec && q.explain ? `<div class="explain"><b>解析</b>${esc(q.explain)}</div>` : ""}
  </article>`;
}
function render() {
  clampPage();
  const sec = currentSection();
  const list = allQuestions();
  const pg = pageQuestions();
  const st = stats();
  $("#section-title").textContent = sec.title;
  $("#stat-answered").textContent = st.answered;
  $("#stat-accuracy").textContent = st.accuracy + "%";
  $("#stat-accuracy").style.color = st.answered ? "var(--jade)" : "";
  $("#progress-fill").style.width = (list.length ? st.answered / list.length * 100 : 0) + "%";
  $("#page-label").textContent = state.page;
  $("#page-total").textContent = totalPages();
  const answeredOnPage = pg.filter(q => recordFor(q)).length;
  $("#page-progress").textContent = `本页已答 ${answeredOnPage} / ${pg.length}`;
  $("#prev").disabled = state.page <= 1;
  $("#next").disabled = state.page >= totalPages();
  const quiz = $("#quiz");
  const empty = $("#empty");
  if (!pg.length) {
    quiz.innerHTML = "";
    quiz.hidden = true;
    empty.hidden = false;
  } else {
    quiz.hidden = false;
    empty.hidden = true;
    if (!chatQid || !pg.some(q => q.id === chatQid)) chatQid = pg[0].id;
    const offset = (state.page - 1) * PAGE_SIZE;
    quiz.innerHTML = pg.map((q, i) => cardHTML(q, offset + i)).join("");
  }
  if (window.refreshPoliticsChatContext) window.refreshPoliticsChatContext();
}
function commit(qid, letters) {
  const q = allQuestions().find(x => x.id === qid);
  if (!q || recordFor(q)) return;
  const picks = [...new Set(letters)].filter(x => q.options[x]).sort();
  if (!picks.length) return;
  state.answers[qid] = { picks, correct: isCorrect(q, picks) };
  pending.delete(qid);
  save();
  render();
  if (window.showStudyAI) setTimeout(() => window.showStudyAI(q), 220);
}
function getChatContext() {
  const q = allQuestions().find(x => x.id === chatQid) || pageQuestions()[0];
  if (!q) return { label: currentSection().title, promptText: "【考研政治知识点答疑】当前部分：" + currentSection().title + "。请直接回答学生的考研政治问题。" };
  const opts = ["A", "B", "C", "D"].map(l => `${l}. ${q.options[l] || ""}`).join("\n");
  return {
    label: `${currentSection().title} · ${q.stem.slice(0, 26)}`,
    promptText: `【考研政治知识点答疑】当前部分：${currentSection().title}。当前题目：${q.stem}\n${opts}\n正确答案：${q.answer}。请围绕当前题目和考研政治知识点回答。`
  };
}
function goPage(p) {
  state.page = Math.min(Math.max(1, p), totalPages());
  pending.clear();
  save();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function resetPage() {
  const pg = pageQuestions();
  for (const q of pg) { delete state.answers[q.id]; pending.delete(q.id); }
  save();
  $("#reset-dialog").close();
  render();
}
function bind() {
  $("#quiz").addEventListener("click", e => {
    const card = e.target.closest("[data-card]");
    if (card) { chatQid = card.dataset.card; if (window.refreshPoliticsChatContext) window.refreshPoliticsChatContext(); }
    const ai = e.target.closest("[data-ai]");
    if (ai) {
      const aq = allQuestions().find(x => x.id === ai.dataset.ai);
      if (aq && window.showStudyAI) window.showStudyAI(aq);
      return;
    }
    const opt = e.target.closest(".option");
    if (opt) {
      const q = allQuestions().find(x => x.id === opt.dataset.qid);
      if (!q || recordFor(q)) return;
      if (q.type === "single") commit(q.id, [opt.dataset.letter]);
      else {
        const set = pending.get(q.id) || new Set();
        if (set.has(opt.dataset.letter)) set.delete(opt.dataset.letter); else set.add(opt.dataset.letter);
        pending.set(q.id, set);
        render();
      }
      return;
    }
    const sub = e.target.closest("[data-submit]");
    if (sub) { const qid = sub.dataset.submit; commit(qid, [...(pending.get(qid) || [])]); }
  });
  $("#prev").addEventListener("click", () => goPage(state.page - 1));
  $("#next").addEventListener("click", () => goPage(state.page + 1));
  $("#section-select").addEventListener("change", e => {
    state.section = e.target.value;
    state.page = 1;
    pending.clear();
    save();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("#btn-reset").addEventListener("click", () => {
    const pg = pageQuestions();
    $("#reset-desc").textContent = `只会清空当前第 ${state.page} 页的 ${pg.length} 道题，不影响其他页。此操作不可撤销。`;
    $("#reset-dialog").showModal();
  });
  $("#confirm-reset").addEventListener("click", resetPage);
  $$("[data-close]").forEach(btn => btn.addEventListener("click", () => document.getElementById(btn.dataset.close).close()));
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea, select")) return;
    if ($("#reset-dialog").open) return;
    if (e.key === "ArrowLeft") goPage(state.page - 1);
    if (e.key === "ArrowRight") goPage(state.page + 1);
  });
}
function init() {
  load();
  const params = new URLSearchParams(location.search);
  const secParam = params.get("section");
  if (secParam && SECTION_BY_ID.has(secParam)) state.section = secParam;
  const qParam = params.get("q");
  let flashId = null;
  if (qParam) {
    const idx = allQuestions().findIndex(x => x.id === qParam);
    if (idx >= 0) { state.page = Math.floor(idx / PAGE_SIZE) + 1; flashId = qParam; }
  }
  const sel = $("#section-select");
  sel.innerHTML = SECTIONS.map(s => `<option value="${s.id}">${esc(s.title)}（${s.questions.length}题）</option>`).join("");
  if (!SECTION_BY_ID.has(state.section)) state.section = SECTIONS[0].id;
  sel.value = state.section;
  bind();
  render();
  if (flashId) setTimeout(() => {
    const el = document.querySelector(`[data-card="${flashId}"]`);
    if (el) { el.classList.add("flash"); el.scrollIntoView({ behavior: "smooth", block: "center" }); }
  }, 250);
  if (window.initPoliticsChat) window.initPoliticsChat({ getContext: getChatContext });
}
init();
</script>
</body>
