<style>
  :root {
    --paper: #f5f0e6;
    --card: #fffdf8;
    --ink: #20262b;
    --ink-soft: #465058;
    --muted: #81796b;
    --line: #ded4c3;
    --jade: #2f6b56;
    --jade-soft: #e4efe8;
    --red: #a44437;
    --red-soft: #f7e7e1;
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
    --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  button, select { font: inherit; }
  .topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 12px clamp(16px, 4vw, 48px); background: rgba(255,253,248,.94); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
  .seal { width: 44px; height: 44px; border-radius: 12px; background: var(--jade); color: #fffdf8; display: grid; place-items: center; font-family: var(--serif); font-size: 20px; text-decoration: none; flex: 0 0 auto; }
  .brand h1 { margin: 0; font-family: var(--serif); font-size: clamp(17px, 2.2vw, 22px); letter-spacing: .04em; }
  .brand p { margin: 3px 0 0; color: var(--muted); font-size: 10.5px; }
  .stats { margin-left: auto; display: flex; gap: 16px; }
  .stat b { display: block; font-family: var(--serif); font-size: 20px; font-weight: 500; text-align: right; }
  .stat small { color: var(--muted); font-size: 10px; }
  .stat .accent { color: var(--jade); }
  .actions { display: flex; align-items: center; gap: 8px; }
  .ghost-btn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 12px; color: var(--ink-soft); font-size: 12px; cursor: pointer; }
  .ghost-btn:hover { border-color: var(--jade); color: var(--jade); }
  #section-select { max-width: 240px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 10px; color: var(--ink); font-size: 12px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 18px clamp(12px, 3vw, 28px) 110px; }
  .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; margin: 4px 0 12px; color: var(--muted); font-size: 11px; }
  .meta strong { color: var(--ink); font-family: var(--serif); font-size: 18px; font-weight: 500; }
  .progress { height: 4px; background: #e7dfd1; border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--jade); transition: width .25s ease; }
  #quiz { display: grid; gap: 14px; }
  .q-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 15px 16px 14px; box-shadow: 0 8px 22px -18px rgba(32,38,43,.35); }
  .q-card.ok { border-color: #b9d5c4; }
  .q-card.bad { border-color: #e3bdb4; }
  .q-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .q-num { font-family: var(--serif); color: var(--jade); font-size: 15px; }
  .q-type { border-radius: 999px; background: var(--jade-soft); color: var(--jade); padding: 3px 8px; font-size: 10px; }
  .q-type.multi { background: #f3ead8; color: #8a6127; }
  .q-chapter { color: var(--muted); font-size: 10px; border-left: 2px solid var(--line); padding-left: 7px; }
  .ai-mini { margin-left: auto; border: 1px solid var(--line); background: #fffefb; color: var(--jade); border-radius: 999px; padding: 4px 9px; font-size: 10px; cursor: pointer; }
  .ai-mini:hover { border-color: var(--jade); background: var(--jade-soft); }
  @keyframes flashCard { 0%,100% { box-shadow: 0 0 0 0 rgba(47,107,86,0); } 40% { box-shadow: 0 0 0 5px rgba(47,107,86,.18); } }
  .q-card.flash { animation: flashCard 1.1s ease 2; }
  .q-stem { margin: 0 0 11px; font-size: 14.5px; line-height: 1.9; }
  .options { display: grid; gap: 7px; }
  .option { display: flex; align-items: flex-start; gap: 9px; width: 100%; text-align: left; border: 1px solid var(--line); background: #fffefb; border-radius: 10px; padding: 9px 10px; color: var(--ink-soft); font-size: 13px; line-height: 1.65; cursor: pointer; transition: border-color .15s, background .15s; }
  .option:hover { border-color: #b9c7b8; background: #fbf8ef; }
  .option .letter { flex: 0 0 21px; height: 21px; border-radius: 50%; background: #f1eadc; color: var(--ink); display: grid; place-items: center; font-family: var(--serif); font-size: 12px; }
  .option.picked { border-color: var(--jade); background: #f1f7f2; }
  .option.picked .letter { background: var(--jade); color: #fff; }
  .option.correct { border-color: #a9cdb7; background: #edf7f0; }
  .option.correct .letter { background: var(--jade); color: #fff; }
  .option.wrong { border-color: #dfb1a6; background: var(--red-soft); }
  .option.wrong .letter { background: var(--red); color: #fff; }
  .option.locked { cursor: default; }
  .submit-row { display: flex; justify-content: flex-end; margin-top: 9px; }
  .submit-btn { border: 0; border-radius: 9px; background: var(--jade); color: #fff; padding: 8px 14px; font-size: 12px; cursor: pointer; }
  .feedback { margin-top: 10px; border-radius: 9px; padding: 8px 10px; font-size: 11.5px; line-height: 1.7; }
  .feedback.ok { background: var(--jade-soft); color: #245846; }
  .feedback.bad { background: var(--red-soft); color: #7d3329; }
  .feedback b { font-family: var(--serif); }
  .explain { margin-top: 8px; border-top: 1px dashed rgba(222,212,195,.9); padding-top: 8px; color: var(--ink-soft); font-size: 11.5px; line-height: 1.85; }
  .explain b { color: var(--jade); font-family: var(--serif); margin-right: 4px; }
  .pager { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 25; display: flex; align-items: center; gap: 18px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,253,248,.96); box-shadow: 0 14px 30px -18px rgba(32,38,43,.5); backdrop-filter: blur(12px); }
  .pager button { border: 0; background: transparent; color: var(--ink-soft); font-size: 13px; cursor: pointer; padding: 5px 8px; }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pager span { color: var(--muted); font-size: 12px; }
  .pager b { color: var(--ink); font-family: var(--serif); font-size: 15px; }
  #empty { text-align: center; padding: 60px 16px; color: var(--muted); }
  dialog { width: min(92vw, 420px); border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); padding: 0; }
  dialog::backdrop { background: rgba(32,38,43,.35); }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sheet-head h3 { margin: 0; font-family: var(--serif); font-size: 17px; font-weight: 500; }
  .icon-btn { border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; }
  .confirm-body { padding: 16px; }
  .confirm-body p { margin: 0 0 16px; color: var(--ink-soft); font-size: 13px; line-height: 1.8; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn-cancel, .btn-danger { border: 1px solid var(--line); border-radius: 9px; padding: 8px 14px; background: transparent; color: var(--ink-soft); font-size: 12px; cursor: pointer; }
  .btn-danger { border-color: #d9b3a7; color: #8d3b2f; background: #fbf0ec; }
  @media (max-width: 700px) {
    .topbar { flex-wrap: wrap; padding: 10px 14px; gap: 9px; }
    .stats { margin-left: auto; gap: 10px; }
    .stat b { font-size: 16px; }
    .actions { order: 5; width: 100%; }
    #section-select { flex: 1; max-width: none; }
    .q-stem { font-size: 14px; }
    .pager { bottom: 8px; width: calc(100vw - 24px); justify-content: space-between; }
  }
</style>

<script>
const STORAGE_KEY = "kaoyan-politics-zhenti-2017-2026-v1";
const SECTIONS = [{"id": "y2017", "title": "2017年真题", "questions": [{"id": "y2017-1", "num": 1, "type": "single", "chapter": "", "stem": "某地区进入供暖季后常常出现雾霾，而一旦出现大风天气或等到春暖花开后，雾霾就会散去或减少。从该地区较长时间的数据变化看，经过人们努力治霾，污染物排放总量在持续走低；但在某些时段，环境空气质量污染指数会迅速攀升，甚至“爆表”。这种看似“矛盾”的现象凸显了大气污染防治的一个特点：天帮忙很重要，但人努力才是根本。“人努力”与“天帮忙”之间的关系对我们正确处理主观能动性和客观规律性之间辩证关系的启示是", "options": {"A": "尊重事物的客观规律是正确发挥主观能动性的前提", "B": "人类有意识的思想活动是掌握客观规律的根本前提", "C": "认识活动是客观规律性与主观能动性相统一的基础", "D": "尚未认识的外在自然规律对人的实践活动起着至关重要的作用"}, "answer": "A", "explain": ""}, {"id": "y2017-2", "num": 2, "type": "single", "chapter": "", "stem": "有人认为，既然人的意识是对客观外部世界的反映，那么人脑里的“鬼”、“神”意识就是对外在世界上鬼、神真实存在的反映。这种观念的错误在于", "options": {"A": "夸大了意识的能动作用", "B": "把意识看成是物质的产物", "C": "认为意识是对存在的直观反映", "D": "混淆了人类意识自然演化的阶段"}, "answer": "C", "explain": ""}, {"id": "y2017-3", "num": 3, "type": "single", "chapter": "", "stem": "某企业投资汽车生产，生产一辆汽车所耗费的生产资料价值为15万元、支付给工人的工资为5万元，假定市场的平均利润率为10%,那么，在自由竞争条件下，该汽车的生产价格是", "options": {"A": "20万元", "B": "20.5万元", "C": "21.5万元", "D": "22万元"}, "answer": "D", "explain": ""}, {"id": "y2017-4", "num": 4, "type": "single", "chapter": "", "stem": "从历史发展的角度看，资本主义生产资料所有制是不断演进和变化的。当今资本主义社会居主导地位的资本所有制形式是", "options": {"A": "私人资本所有制", "B": "法人资本所有制", "C": "私人股份资本所有制", "D": "垄断资本私人所有制"}, "answer": "B", "explain": ""}, {"id": "y2017-5", "num": 5, "type": "single", "chapter": "", "stem": "从中华人民共和国成立到社会主义改造基本完成，是我国从新民主主义到社会主义的过渡时期。这一时期，个体经济向社会主义集体经济过渡的形式是", "options": {"A": "国营经济", "B": "私人资本主义经济", "C": "合作社经济", "D": "国家资本主义经济"}, "answer": "C", "explain": ""}, {"id": "y2017-6", "num": 6, "type": "single", "chapter": "", "stem": "2016年是“十三五”规划开局之年，也是推进供给侧结构性改革的攻坚之年。推进供给侧结构性改革是适应我国经济发展新常态的重大决策，其根本目的是", "options": {"A": "加快政府职能转变", "B": "提高供给质量满足需要", "C": "深化价格、财税、金融、社保等领域基础性改革", "D": "推进“去产能、去库存、去杠杆、降成本、补短板”"}, "answer": "B", "explain": ""}, {"id": "y2017-7", "num": 7, "type": "single", "chapter": "", "stem": "协调推进“四个全面'‘战略布局，是党的十八大以来党中央从实现“两个一百年”奋斗目标、实现中华民族伟大复兴的中国梦的战略高度，统筹国内国际两个大局，把握我国发展新特征确定的治国理政新方略。在“四个全面”战略布局中居于引领地位的是", "options": {"A": "全面建成小康社会", "B": "全面深化改革", "C": "全面依法治国", "D": "全面从严治党"}, "answer": "A", "explain": ""}, {"id": "y2017-8", "num": 8, "type": "single", "chapter": "", "stem": "随着工业化、城镇化的深入推进，大量农民转向非农产业，我国农村土地流转现象日益普遍，农业经营方式发生深刻变化。截至2016年6月，全国家庭承包经营耕地流转已超过30%,流转土地4.6亿亩。当前，为解决拥有土地承包经营权的人不再种地、种地的人又没有相应权利这一突出问题，我国在深化农村改革方面作出的重大制度创新是", "options": {"A": "实行农村集体经营性建设用地入市", "B": "实行农村土地所有权、承包权、经营权分置", "C": "实行农村家庭联产承包责任制", "D": "实行农村耕地保护制度"}, "answer": "B", "explain": ""}, {"id": "y2017-9", "num": 9, "type": "single", "chapter": "", "stem": "帝国主义侵略中国的最终目的，是要瓜分中国、灭亡中国。1895年中国在甲午战争中战败后，列强掀起了瓜分中国的狂潮，这集中表现在", "options": {"A": "竞相租借港湾和划分势力范围", "B": "设立完全由外国人直接控制和统治的租界", "C": "外国资本在中国近代工业中争夺垄断地位", "D": "从侵占中国周边邻国发展到蚕食中国边疆地区"}, "answer": "A", "explain": ""}, {"id": "y2017-10", "num": 10, "type": "single", "chapter": "", "stem": "第一次世界大战，德国战败。1918年12月，陈独秀在《每周评论》的发刊词中说，大战结果是“公理战胜强权”，并把美国总统威尔逊称作“现在世界上第一个好人”。然而，陈独秀在1919年5月4日出版的《每周评论》上的一篇文章中又写道：“什么公理,什么永久和平，什么威尔逊总统十四条宣言，都成了一文不值的空话。”导致陈独秀认识发生变化的直接原因是", "options": {"A": "中国在巴黎和会上外交失败", "B": "日本对德宣战，出兵山东", "C": "苏俄宣布废除从前同中国签订的一切不平等条约", "D": "美国不愿放弃在华种种特权"}, "answer": "A", "explain": ""}, {"id": "y2017-11", "num": 11, "type": "single", "chapter": "", "stem": "毛泽东思想是马克思主义中国化的第一大理论成果，是在中国革命和建设的实践中逐步形成和发展起来的。在土地革命战争后期和抗日战争时期，毛泽东思想得到多方面展开而达到成熟，其标志是", "options": {"A": "农村包围城市、武装夺取政权理论的科学概括", "B": "新民主主义理论的系统阐明", "C": "人民民主专政理论的完整论述", "D": "思想政治工作和文化工作理论的系统提出"}, "answer": "B", "explain": ""}, {"id": "y2017-12", "num": 12, "type": "single", "chapter": "", "stem": "1947年6月底，根据中共中央的决策和部署，刘伯承、邓小平率领的晋冀鲁豫野战军主力，实施中央突破，千里跃进大别山；陈毅、粟裕指挥的华东野战军主力为东路，挺进苏鲁豫皖地区；陈處、谢富治指挥的晋冀鲁豫野战军一部为西路，挺进豫西。三路大军相互策应，机动歼敌，迫使国民党军处于被动地位。这表明", "options": {"A": "人民解放战争进入战略相持阶段", "B": "人民解放战争战略进攻的序幕由此揭开", "C": "人民解放军同国民党军队进行战略决战的时机已经成熟", "D": "人民解放军在数量上已经超过国民党军队"}, "answer": "B", "explain": ""}, {"id": "y2017-13", "num": 13, "type": "single", "chapter": "", "stem": "信念是认知、情感和意志的有机统一体，是人们在一定的认识基础上确立的对某种思想或事物坚信不疑并身体力行的心理态度和精神状态。信念是人们追求理想目标的强大动力，决定事业的成败。信念有不同的层次和类型，其中", "options": {"A": "高层次的信念决定低层次的信念", "B": "低层次的信念代表了一个人的基本信仰", "C": "相同社会环境中生活的人们的信念始终一致", "D": "各种信念没有科学与非科学之分"}, "answer": "A", "explain": ""}, {"id": "y2017-14", "num": 14, "type": "single", "chapter": "", "stem": "社会主义核心价值观为人们确定和实现人生价值提供了基本遵循。人生价值评价主要是看一个人的人生活动是否符合社会的客观规律，其评价的根本尺度是", "options": {"A": "历史标准", "B": "经济标准", "C": "政治标准", "D": "文化标准"}, "answer": "A", "explain": ""}, {"id": "y2017-15", "num": 15, "type": "single", "chapter": "", "stem": "自2016年5月20日台湾地区新领导人就职以来，两岸制度化沟通和协商谈判机制中断。其根本原因在于", "options": {"A": "台湾在美国测试新的导弹防御系统", "B": "美国高规格“礼遇”台湾当局领导人过境", "C": "台湾当局减少了赴台旅游大陆游客的配额", "D": "台湾当局没有明确承认“九二共识”及其核心意涵"}, "answer": "D", "explain": ""}, {"id": "y2017-16", "num": 16, "type": "single", "chapter": "", "stem": "第二次世界大战后，中东经历了长期和频繁的战争与冲突，是世界最动荡的地区，被称为“火药库”。2016年11月29日，联合国举行“声援巴勒斯坦人民国际日”纪念大会，中国国家主席习近平向大会致贺电，表示中国作为联合国安理会常任理事国，愿同国际社会一道，为早日实现中东全面、公正、持久和平作出不懈努力。中东问题的核心是", "options": {"A": "伊朗核问题", "B": "教派冲突问题", "C": "恐怖主义问题", "D": "巴勒斯坦问题"}, "answer": "D", "explain": ""}, {"id": "y2017-17", "num": 17, "type": "multiple", "chapter": "", "stem": "生物学史，可以说是显微镜的发展史。17世纪中叶，英国科学家使用诞生不久的显微镜观察软木塞，发现了植物细胞，开启了近现代生物学的大门。此后，显微镜的放大能力和成像质量不断提升，人类对细胞的认知也随之深刻和全面。20世纪中叶，科学家们利用X射线晶体学发现了DNA（脱氧核糖核酸）双螺旋结构，人类的观察极限从亚细胞结构推向了分子结构。我国科学家的重要科研成果“剪接体的高分辨率三维结构”的背后，也站着一个默默无闻的英雄一一冷冻电子显微镜。显微镜在生物科学发现中的作用表明", "options": {"A": "探索未知世界的科学实验是人类最基本的实践活动", "B": "实践的主体和客体正是依靠中介系统才能够相互作用", "C": "人类认识水平的提高与实践条件的进步有着直接的关系", "D": "实践主体、客体和中介三者的有机统一构成实践的基本结构"}, "answer": "BCD", "explain": ""}, {"id": "y2017-18", "num": 18, "type": "multiple", "chapter": "", "stem": "唯物史观在坚持人民群众是历史的创造者这一基本前提下，高度重视个人在历史上的作用。历史人物是一定历史事件的主要倡导者、组织领导者或思想理论、科学文化的重要代表人物。下列关于历史人物历史作用的正确认识是", "options": {"A": "历史人物对历史发展的作用都是积极的", "B": "历史人物会因其智慧、性格等因素对社会进程发生影响", "C": "具有进步意义的历史人物往往能够首先发现或提出历史进程中新的历史任务", "D": "历史人物不论发挥什么样的作用都不能决定和改变历史发展的总进程和总方向"}, "answer": "BCD", "explain": ""}, {"id": "y2017-19", "num": 19, "type": "multiple", "chapter": "", "stem": "马克思指出，所谓资本原始积累“只不过是生产者和生产资料分离的历史过程。这个过程所以表现为'原始的'，因为它形成资本及与之相适应的生产方式的前史。”资本原始积累的主要途径有", "options": {"A": "用暴力手段剥夺农民土地", "B": "用剥削手段榨取剩余价值", "C": "用野蛮手段进行殖民掠夺", "D": "用资本手段获取市场暴利"}, "answer": "AC", "explain": ""}, {"id": "y2017-20", "num": 20, "type": "multiple", "chapter": "", "stem": "当今世界正处在新科技革命和产业革命的交汇点，以机器人技术为代表的科技产业发展十分迅速。机器人在生产过程中的广泛使用，使资本有机构成不断提高。然而，就一般意义而言，资本有机构成的提高实际上是", "options": {"A": "由资本的本性决定的", "B": "不以人的意志为转移的一般趋势", "C": "社会产生相对过剩人口的一个重要原因", "D": "一个社会增长财富和消除贫困的根本途径"}, "answer": "ABC", "explain": ""}, {"id": "y2017-21", "num": 21, "type": "multiple", "chapter": "", "stem": "1921年3月，俄共（布）召开十大，决定从战时共产主义政策过渡到新经济政策。在实施新经济政策期间，列宁对苏维埃俄国如何建设社会主义进行了深刻的理论思考，提出了许多精辟的论述，其主要内容包括", "options": {"A": "允许多种经济成分并存，可以利用商品、货币和市场发展经济", "B": "把大力发展生产力、提高劳动生产率放在首要地位", "C": "把建设社会主义作为一个长期探索、不断实践的过程", "D": "可以利用资本主义来建设社会主义"}, "answer": "ABCD", "explain": ""}, {"id": "y2017-22", "num": 22, "type": "multiple", "chapter": "", "stem": "在庆祝中国共产党成立95周年大会上，习近平总书记强调指出：“坚持不忘初心、继续前进，要坚持党的基本路线不动摇，不断把中国特色社会主义伟大事业推向前进。”改革开放以来，党和国家领导人一再强调要毫不动摇地坚持党的基本路线，这主要是因为，实践已经证明党的基本路线是", "options": {"A": "党和国家的生命线、人民的幸福线", "B": "兴国、立国、强国的重大法宝", "C": "实现科学发展的政治保证", "D": "思想路线的核心"}, "answer": "ABC", "explain": ""}, {"id": "y2017-23", "num": 23, "type": "multiple", "chapter": "", "stem": "“一带一路”倡议提出三年来，已经有100多个国家和国际组织参与其中，我国同沿线30多个国家签署共建合作协议，与20多个国家开展了国际产能合作，一批有影响力的标志性项目逐步落地。截至2016年7月，我国对“一带一路”相关国家的投资累计已达511亿美元，占同期对外直接投资总额的12%;与沿线国家新签承包工程合同1.25万份，累计合同额2790亿美元。我国推进“一带一路”建设旨在", "options": {"A": "统筹国内国际两个大局", "B": "促进沿线各国共同繁荣", "C": "打造开放、包容、均衡、普惠的区域经济合作架构", "D": "探索国际合作及全球治理新模式"}, "answer": "ABCD", "explain": ""}, {"id": "y2017-24", "num": 24, "type": "multiple", "chapter": "", "stem": "2016年7月以来，中央陆续派出环保督察组进驻各地进行现场督察，掀起了一场新的治污问责风暴。环保督察，从环保部门牵头到中央主导，从以查企业为主转变为“查督并举，以督政为主”，这是我国环境监管模式的重大变革和完善生态文明制度体系的重要举措。建立环保督察工作机制有利于", "options": {"A": "处理好政府与市场的关系", "B": "落实环境保护主体责任", "C": "强化领导责任和监管责任", "D": "完善领导干部目标责任考核制度"}, "answer": "BCD", "explain": ""}, {"id": "y2017-25", "num": 25, "type": "multiple", "chapter": "", "stem": "党的十八届五中全会提出“创新、协调、绿色、开放、共享”的新发展理念，把创新作为引领发展的第一动力。在这一新发展理念的指导下，2016年5月党中央和国务院颁布了《国家创新驱动发展战略纲要》。把创新作为引领发展的第一动力是", "options": {"A": "分析世界发展历程和总结我国改革开放实践得岀的结论", "B": "构建和谐世界的内在要求", "C": "引领经济发展新常态的根本之策", "D": "提高核心竞争力的必然选择"}, "answer": "ACD", "explain": ""}, {"id": "y2017-26", "num": 26, "type": "multiple", "chapter": "", "stem": "严肃党内政治生活是我们党的优良传统和政治优势，也是全面从严治党的基础。党的十八届六中全会审议通过了《关于新形势下党内政治生活的若干准则》和《中国共产党党内监督条例》，提出了新形势下加强和规范党内政治生活的新要求，其主婆内容是", "options": {"A": "着力增强党内政治生活的政治性、时代性、原则性、战斗性", "B": "着力增强党自我净化、自我完善、自我革新、自我提高能力", "C": "着力提高党的领导水平和执政水平、增强拒腐防变和抵御风险能力", "D": "着力维护党中央权威、保证党的团结统一、保持党的先进性和纯洁性"}, "answer": "ABCD", "explain": ""}, {"id": "y2017-27", "num": 27, "type": "multiple", "chapter": "", "stem": "在半殖民地半封建社会的条件下，中国不可能在独立的基础上与外国发生经济往来，资本—帝国主义列强同中国发生经济关系，不是为了推动中国经济的发展，而是为了控制中国的经济。列强控制中国经济的方式有", "options": {"A": "在中国设立出版机构宣传西学", "B": "在中国设立银行", "C": "控制中国的关税和盐税", "D": "控制中国的交通运输业"}, "answer": "BCD", "explain": ""}, {"id": "y2017-28", "num": 28, "type": "multiple", "chapter": "", "stem": "孙中山先生是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱，一生以革命为己任，立志救国救民，为中华民族作出了彪炳史册的贡献。孙中山先生的伟大表现在", "options": {"A": "领导了辛亥革命", "B": "发动了以推翻北洋军阀统治为目标的北伐战争", "C": "重新解释三民主义并提出了联俄、联共、扶助农工三大政策", "D": "坚定维护民主共和制度和国家完整统一"}, "answer": "ACD", "explain": ""}, {"id": "y2017-29", "num": 29, "type": "multiple", "chapter": "", "stem": "1978年12月18日到22日，党的十一届三中全会在北京召开。会议的主要任务是确定把全党工作重点转移到社会主义现代化建设上来。这次全会是新中国成立以来党的历史上具有深选意义的伟大转折。全会结束了粉碎“四人帮”后两年党和国家工作在徘徊中前进的扃面，标志着中国共产党", "options": {"A": "重新确立了马克思主义的思想路线、政治路线、组织路线", "B": "开始了在思想、政治、组织等领域的全面拨乱反正", "C": "形成了以邓小平为核心的党的中央领导集体", "D": "揭开了社会主义改革开放的序幕"}, "answer": "ABCD", "explain": ""}, {"id": "y2017-30", "num": 30, "type": "multiple", "chapter": "", "stem": "我国法律文化有悠久的历史和传承，据《说文解字》阐释，汶语中“法“的古体是“濾七“渡，刑也，平之如水，从水；麻，所以触不直者去之，从去。”在古代，“法”主要表现为“刑”或“刑律”，“刑”既有刑戮、罚罪之意，也有规范之意；“鳥”也称“獺笏”,是神话中的独角兽，它公正不阿，善断是非曲直。上述材料表明，在传统文化中人们对法律的理解和诉求是", "options": {"A": "法律具有至高无上的地位", "B": "法律体现了君权神授的思想", "C": "法律富含着公平如水、正义神圣的深刻意蕴", "D": "法律寄托着惩恶扬善、匡扶正义的价值追求"}, "answer": "CD", "explain": ""}, {"id": "y2017-31", "num": 31, "type": "multiple", "chapter": "", "stem": "公共生活中个人权利与他人权利发生冲突在所难免，比如学生宿舍里有人看书，有人休息，有人婆听音乐……对解决权利冲突要有正确的认识，虽然每个人都有行使个人权利的自由，但也要尊重他人的权利。这是因为", "options": {"A": "尊重他人权利是公民权利意识的重要内容", "B": "尊重他人权利既是一项法律义务，也是一项道德义务", "C": "权利实现的内在动力是人们彼此之间对各自权利的相互尊重", "D": "不尊重他人权利，就可能丧失自己的权利"}, "answer": "ABCD", "explain": ""}, {"id": "y2017-32", "num": 32, "type": "multiple", "chapter": "", "stem": "中国人民解放军战区成立大会于2016年2月1日在北京隆重举行。中共中央总书记、国家.主席、中央军委主席习近平向东部战区、南部战区、西部战区、北部战区、中部战区授予军旗并发布训令。建立五大战区及组建战区联合作战指挥机构是", "options": {"A": "为实现中国梦强军梦作出的战略决策", "B": "构建我军联合作战体系的历史性进展", "C": "加强国际军事合作与交流的重大步骤", "D": "全面实施改革强军战略的标志性举措"}, "answer": "ABD", "explain": ""}, {"id": "y2017-33", "num": 33, "type": "multiple", "chapter": "", "stem": "2016年6月23日，英国举行脱离欧盟全民公投，脱欧阵营以51.9%对留欧阵营48.1%的微弱得票优势胜出，英国成为首个投票脱离欧盟的国家，为欧洲一体化进程带来变数。导致英国“脱欧”的因素主要有", "options": {"A": "英国“疑欧主义”传统", "B": "英国始终反对欧洲一体化", "C": "欧洲遭遇史上最大难民潮冲击", "D": "英国不愿受欧盟某些监管规则束缚"}, "answer": "ACD", "explain": ""}]}, {"id": "y2018", "title": "2018年真题", "questions": [{"id": "y2018-1", "num": 1, "type": "single", "chapter": "", "stem": "马克思主义的产生具有深刻的社会根源、阶级基础和思想渊源。其创始人马克思1818年5月5日出生在德国特利尔城的一个律师家庭，恩格斯1820年11月28日出生在德国巴门市的一个工厂主家庭，他们放弃了舒适安逸的生活，毅然选择了充满荆棘坎坷的革命道路，创立了科学社会主义。马克思、恩格斯之所以能够创立科学社会主义，主要是因为", "options": {"A": "德国是当时最为发达的资本主义国家", "B": "他们对时代有着超越常人的认知能力", "C": "社会历史条件和个人努力的相互作用", "D": "他们拥有优良的家庭背景和教育经历"}, "answer": "C", "explain": ""}, {"id": "y2018-2", "num": 2, "type": "single", "chapter": "", "stem": "\"马者所以命形也；白者所以命色也。命色者非命形也，故曰白马非马。”从唯物辩证法的观点看，“白马非马”这一命题的错误在于", "options": {"A": "模糊了事物本质和现象之间的联系", "B": "割裂了事物共性和个性之间的联系", "C": "混淆了事物内容和形式之间的区别", "D": "颠倒了事物形态和功能之间的关系"}, "answer": "B", "explain": ""}, {"id": "y2018-3", "num": 3, "type": "single", "chapter": "", "stem": "坚持以人民为中心，就必须坚持人民主体地位，坚持立党为公、执政为民，践行全心全意为人民服务的根本宗旨，把党的群众路线贯彻到治国理政全部活动之中，把人民对美好生活的向往作为奋斗目标。“坚持以人民为中心”的理论基础是唯物史观关于", "options": {"A": "人民群众是历史的创造者的原理", "B": "人的本质是一切社会关系的总和的原理", "C": "人民群众的活动受到社会历史条件制约的原理", "D": "总体的人在总体的历史过程中的主体地位的原理"}, "answer": "A", "explain": ""}, {"id": "y2018-4", "num": 4, "type": "single", "chapter": "", "stem": "《资本论》（德文版）第一卷于1867年9月在汉堡出版，其影响力历经150年风雨而不衰，至今对我们分析、理解现实经济问题依然具有很强的指导意义。马克思主义政治经济学的理论十分丰富，其中“理解政治经济学的枢纽”的理论是", "options": {"A": "商品二因素理论", "B": "价值规律理论", "C": "劳动二重性理论", "D": "剩余价值理论"}, "answer": "C", "explain": ""}, {"id": "y2018-5", "num": 5, "type": "single", "chapter": "", "stem": "经济建设是全党的中心工作，坚持以经济建设为中心不动摇，就必须坚持以经济体制改革为重点不动摇。当前，我国深化经济体制改革的重点是", "options": {"A": "完善产权制度和要素市场化配置", "B": "扩大优质增量供给，实现供需动态平衡", "C": "加快培育国际经济合作和竞争新优势", "D": "建立更加有效的区域协调发展新机制"}, "answer": "A", "explain": ""}, {"id": "y2018-6", "num": 6, "type": "single", "chapter": "", "stem": "实行人民民主，保证人民当家作主，实现形式是丰富多样的。经过长期探索，我国在通过依法选举让人民的代表来参与国家生活和社会生活管理的同时，找到了一种保证人民在日常政治生活中有广泛持续深入参与权利的特有民主形式，这一特有民主形式是", "options": {"A": "谈判民主", "B": "协商民主", "C": "票决民主", "D": "竞争性民主"}, "answer": "B", "explain": ""}, {"id": "y2018-7", "num": 7, "type": "single", "chapter": "", "stem": "党的十八大以来，我国大力实施创新驱动发展战略，加快创新型国家建设步伐，成果丰硕，天宫、蛟龙、天眼、悟空、墨子、大飞机等重大科技成果相继问世。我国实施创新驱动发展战略所坚持的方针是", "options": {"A": "集中力量、重点突破、实现跨越式发展", "B": "企业为主体、市场为导向、产学研相结合", "C": "自主创新、重点跨越、支撑发展、引领未来", "D": "原始创新、集成创新、引进消化吸收再创新"}, "answer": "C", "explain": ""}, {"id": "y2018-8", "num": 8, "type": "single", "chapter": "", "stem": "解决台湾问题、实现祖国完全统一，是全体中华儿女共同愿望，是中华民族根本利益所在。党的十八大以来，在以习近平同志为核心的党中央坚强领导下，在两岸同胞共同努力下，两岸关系取得重要积极成果。两岸关系和平发展的政治基础是", "options": {"A": "坚持“九二共识”，反对“台独”", "B": "相互尊重，求同存异", "C": "增强两岸同胞的民族认同、文化认同、国家认同", "D": "深化两岸利益融合，共创两岸互利双赢，增进两岸同胞福祉"}, "answer": "A", "explain": ""}, {"id": "y2018-9", "num": 9, "type": "single", "chapter": "", "stem": "近代中国半殖民地半封建社会的矛盾，呈现出错综复杂的状况。其中，贯穿整个中国半殖民地半封建社会的始终，并对中国近代社会的发展变化起着决定性作用的最主要的矛盾是", "options": {"A": "农民阶级和地主阶级的矛盾", "B": "无产阶级和资产阶级的矛盾", "C": "封建主义和人民大众的矛盾", "D": "帝国主义和中华民族的矛盾"}, "answer": "D", "explain": ""}, {"id": "y2018-10", "num": 10, "type": "single", "chapter": "", "stem": "19世纪60年代到90年代，清朝统治阶级内部的洋务派兴办近代企业，建立新式海陆军，创办新式学堂，派遣留学生。洋务派兴办洋务新政的主要目的是", "options": {"A": "发展资本主义", "B": "维护封建统治", "C": "对抗顽固派", "D": "迎合帝国主义"}, "answer": "B", "explain": ""}, {"id": "y2018-11", "num": 11, "type": "single", "chapter": "", "stem": "中国共产党在领导人民革命的过程中，积累了丰富的经验，锻造出了有效的克敌制胜的武器。武装斗争就是中国共产党在中国革命中战胜敌人的重要法宝之一，其实质是", "options": {"A": "工人阶级领导的农民战争", "B": "资产阶级领导的反封建战争", "C": "工农联合的反军阀战争", "D": "无产阶级领导的反帝国主义战争"}, "answer": "A", "explain": ""}, {"id": "y2018-12", "num": 12, "type": "single", "chapter": "", "stem": "20世纪40年代前期，为了提高广大党员的思想理论水平，增强党的凝聚力和战斗力，中国共产党在全党范围内开展了一场整风运动。这场整风运动最主要的任务是", "options": {"A": "反对主观主义以整顿学风", "B": "反对宗派主义以整顿党风", "C": "反对党八股以整顿文风", "D": "反对享乐主义以整顿作风"}, "answer": "A", "explain": ""}, {"id": "y2018-13", "num": 13, "type": "single", "chapter": "", "stem": "社会公德是指人们在公共生活和社会交往中应该遵守的行为准则，是维护公共利益、公共秩序、社会和谐稳定的起码道德要求。社会公德最基本的要求是", "options": {"A": "文明礼貌", "B": "助人为乐", "C": "爱护公物", "D": "遵纪守法"}, "answer": "D", "explain": ""}, {"id": "y2018-14", "num": 14, "type": "single", "chapter": "", "stem": "习近平总书记在《关于〈中共中央关于全面推进依法治国若干重大问题的决定〉的说明》中引用英国哲学家培根的一段话：“一次不公正的审判，其恶果甚至超过十次犯罪。因为犯罪虽是无视法律——好比污染了水流，而不公正的审判则毁坏法律——好比污染了水源。”这说明公正司法的重要性。公正司法是", "options": {"A": "社会公正的唯一标准", "B": "社会公正的最终目标", "C": "维护社会公平正义的最后一道防线", "D": "维护社会公平正义的决定因素"}, "answer": "C", "explain": ""}, {"id": "y2018-15", "num": 15, "type": "single", "chapter": "", "stem": "2017年中央一号文件继续聚焦“三农”工作，提出新的历史阶段我国农业农村工作的主线是", "options": {"A": "改善农业生态环境", "B": "发展农村新产业新业态", "C": "确保国家粮食安全", "D": "深入推进农业供给侧结构性改革"}, "answer": "D", "explain": ""}, {"id": "y2018-16", "num": 16, "type": "single", "chapter": "", "stem": "2017年12月1日，中国共产党与世界政党高层对话会在北京开幕，来自120多个国家近300个政党和政治组织的领导人分享治党治国经验,共商合作发展大计。本次对话会的主题是", "options": {"A": "中国改革:执政党的角色", "B": "构建人类命运共同体、共同建设美好世界:政党的责任", "C": "从严治党:执政党的使命", "D": "为完善全球经济治理贡献政党智慧和力量"}, "answer": "B", "explain": ""}, {"id": "y2018-17", "num": 17, "type": "multiple", "chapter": "", "stem": "2017年6月，我国科学家利用“墨子号”量子科学实验卫星在国际上率先成功实现了千公里级的星地双向量子纠缠分发。“量子纠缠”就是两个（或多个）粒子共同组成的量子状态，无论粒子之间相隔多远，测量其中一个粒子必然会影响其他粒子。“量子纠缠”现象虽然未被完全认知，但它仍然能够说明", "options": {"A": "物质世界联系的客观性和普遍性", "B": "事物联系的主观性和偶然性", "C": "事物联系的复杂性和多样性", "D": "世界的真正统一性在于它的物质性"}, "answer": "ACD", "explain": ""}, {"id": "y2018-18", "num": 18, "type": "multiple", "chapter": "", "stem": "社会形态的更替具有客观性和必然性，但这并不否定人们历史活动的能动性，并不排斥人们在遵循社会发展规律的基础上，对于某种社会形态的历史选择性。人们历史活动的能动性和选择性主要体现在", "options": {"A": "社会发展的客观必然性为人们的历史选择提供了基础、范围和可能性空间", "B": "社会形态更替的过程是主体能动性与客观规律性相统一的过程", "C": "人们的历史选择性归根结底是人民群众的选择性", "D": "社会发展的客观过程由每一个参与历史活动的个人的主观意志所决定"}, "answer": "ABC", "explain": ""}, {"id": "y2018-19", "num": 19, "type": "multiple", "chapter": "", "stem": "为了追逐最大化的利润，资本家总是想方设法地进行资本积累，而资本积累的源泉是剩余价值。一般而言，资本积累规模的大小取决于", "options": {"A": "资本家对工人的剥削程度", "B": "劳动生产率的高低", "C": "资本家垫付资本的大小", "D": "所用资本与所费资本之间的差额"}, "answer": "ABCD", "explain": ""}, {"id": "y2018-20", "num": 20, "type": "multiple", "chapter": "", "stem": "与第二次世界大战之前的资本主义相比，当代资本主义生产关系中的社会阶层、阶级结构发生了许多新的变化，主要表现在", "options": {"A": "高级职业经理成为资本主义社会大公司经营活动的实际控制者", "B": "资本家由从前的直接生产经营者变成了以剪息票为生的食利者", "C": "职工持股和参与决策使得劳动者成为资本家集团的重要力量", "D": "知识型和服务型劳动者数量随科技革命不断深入而持续地增加"}, "answer": "ABD", "explain": ""}, {"id": "y2018-21", "num": 21, "type": "multiple", "chapter": "", "stem": "列宁指出：“一切民族都将走向社会主义，这是不可避免的，但是一切民族的走法却不会完全一样,在民主的这种或那种形式上，在无产阶级专政的这种或那种形态上,在社会生活各方面的社会主义改造的速度上,每个民族都会有自己的特点。”这一论述从历史唯物主义的高度揭示了各民族发展道路的多样性的内涵。下列关于社会主义发展道路多样性特点的正确观点有", "options": {"A": "各国生产力发展状况和社会发展阶段决定了社会主义发展道路具有不同的特点", "B": "历史文化传统的差异性是造成不同国家社会主义发展道路多样性的重要条件", "C": "各国民族因素和地理环境的不同是造成社会主义发展道路多样性的决定因素", "D": "时代和实践的不断发展是造成社会主义发展道路多样性的现实原因"}, "answer": "ABD", "explain": ""}, {"id": "y2018-22", "num": 22, "type": "multiple", "chapter": "", "stem": "从现在到2020年，是全面建成小康社会的决胜期，也是确保实现第一个百年目标、为第二个百年目标打好基础的关键阶段。面对各种严峻复杂的挑战，如期全面建成小康社会必须打好的攻坚战有", "options": {"A": "精准脱贫", "B": "污染防治", "C": "产业结构调整", "D": "防范化解重大风险"}, "answer": "ABD", "explain": ""}, {"id": "y2018-23", "num": 23, "type": "multiple", "chapter": "", "stem": "积极发展混合所有制经济，是完善我国基本经济制度的重要途径。2017年9月11日，我国首条由民营资本控股的高铁——杭绍台高铁项目在浙江杭州签约。该项目预计总投资超过400亿元，其中民营联合体占比51%,中国铁路总公司占比15%,各级地方政府合计占比34%。本项目坚持风险分担、利益共享原则，构建政府和社会资本都能接受的投资回报机制。这是我国发展混合所有制经济的一个典型案例。发展混合所有制经济有利于", "options": {"A": "各种所有制企业公平参与市场竞争", "B": "各种所有制资本取长补短、互相促进、共同发展", "C": "发挥国有资本的带动力和影响力", "D": "改善企业股权结构和公司治理结构"}, "answer": "ABCD", "explain": ""}, {"id": "y2018-24", "num": 24, "type": "multiple", "chapter": "", "stem": "维护河湖健康生命，实现河湖功能永续利用，需要进一步加强河湖管理保护工作，落实属地责任，健全长效机制。2016年11月28日，中共中央办公厅、国务院办公庁联合印发《关于全面推行河长制的意见》。2017年11月20日召开的中央全面深化改革领导小组会议审议通过了《关于在湖泊实施湖长制的指导意见》。全面推行河长制、湖长制是建设生态文明制度体系的重要举措。我国生态文明制度体系建设主要包括", "options": {"A": "完善经济社会发展考核评价体系", "B": "完善生态环境损害责任终身追究制度", "C": "完善生态环境保护管理制度", "D": "完善部门职责分散交叉的环保监督体系"}, "answer": "ABC", "explain": ""}, {"id": "y2018-25", "num": 25, "type": "multiple", "chapter": "", "stem": "党的十九大提出以党的政治建设为统领，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，并特别强调把党的政治建设摆在首位。之所以要把党的政治建设摆在首位，是因为", "options": {"A": "政治属性是政党的第一属性", "B": "坚定政治立场是党的根本宗旨", "C": "政治建设是党的根本性建设，决定党的建设方向和效果", "D": "旗帜鲜明讲政治是我们党作为马克思主义政党的根本要求"}, "answer": "ACD", "explain": ""}, {"id": "y2018-26", "num": 26, "type": "multiple", "chapter": "", "stem": "全面提高对外开放水平，需要实施更为主动的开放战略。近年来，我国坚持引进来和走出去并重，全面开放进一步深化。据统计,2016年中国企业对外直接投资1832亿美元，连续两年位列世界第二；中国境外企业销售额1.5万亿美元，向所在国缴纳税费400亿美元，雇佣外方员工150万人;我国高技术服务业实际使用外资超过955亿元人民币，同比增长86%,在全球引资东道主中排名第三位，高附加值以及服务行业的外国直接投资流入量持续增长。这表明", "options": {"A": "我国国际投资合作水平进一步提高", "B": "我国防范经济风险和外部冲击的能力已经形成", "C": "我国吸引外资的结构和质量正在不断优化", "D": "我国对外直接投资已经完全转向高端"}, "answer": "AC", "explain": ""}, {"id": "y2018-27", "num": 27, "type": "multiple", "chapter": "", "stem": "忠诚于党、听党指挥是我军的光荣传统。1929年12月下旬，红四军党的第九次代表大会在福建上杭县古田村召开。这次会议史称古田会议。会议通过的毛泽东起草的决议案，确立了思想建党、政治建军原则，规定红军是一个执行革命的政治任务的武装集团，必须", "options": {"A": "绝对服从共产党的领导", "B": "担负打仗、筹款和做群众工作的任务", "C": "加强政治工作", "D": "实行全国军事的总动员"}, "answer": "ABC", "explain": ""}, {"id": "y2018-28", "num": 28, "type": "multiple", "chapter": "", "stem": "抗日民主根据地是认真贯彻和实现中国共产党全面抗战路线、坚持抗战和争取胜利的坚强阵地。中国共产党高度重视抗日民主根据地的政权建设，其主要举措有", "options": {"A": "抗日民主政府在工作人员分配上实行“三三制”原则", "B": "各级抗日民主政权机构领导人通过人民选举产生", "C": "实行工农兵代表大会制度", "D": "在少数民族聚居地区试行民族区域自治"}, "answer": "ABD", "explain": ""}, {"id": "y2018-29", "num": 29, "type": "multiple", "chapter": "", "stem": "从1953年开始，在过渡时期总路线的指引下，中国共产党领导人民开始进行有计划的社会主义建设和有系统的社会主义改造。当时中国之所以要着力进行和可能进行社会主义改造，主要是因为", "options": {"A": "社会主义性质的国营经济力量相对来说比较强大", "B": "资本主义经济力量弱小，发展困难", "C": "对个体农业进行社会主义改造,是实现国家工业化的一个必要条件", "D": "资本主义国家的封锁和遏制，社会主义国家的同情和援助"}, "answer": "ABCD", "explain": ""}, {"id": "y2018-30", "num": 30, "type": "multiple", "chapter": "", "stem": "“天下之事，不难于立法，而难于法之必行。”法律的生命力在于实施，法律的权威也在于实施，守法是法律实施和实现的基本途径。对守法的正确理解是", "options": {"A": "守法的主体是一切组织和个人", "B": "守法是行使法定的权利，履行法定的义务", "C": "守法意味着一切组织和个人严格依法办事的活动和状态", "D": "守法是遵守宪法和法律"}, "answer": "ABCD", "explain": ""}, {"id": "y2018-31", "num": 31, "type": "multiple", "chapter": "", "stem": "我国民法通则、合同法、物权法中，都有要求民事主体在进行民事活动时应当尊重社会公德，不得损害公共利益和经济秩序的内容，已经具有“公序良俗”的含义。2017年10月1日起施行的民法总则明确规定“民事主体从事民事活动，不得违反法律，不得违背公序良俗”，从民法基本原则的高度确立了禁止违反公序良俗的原则。这一规定体现了", "options": {"A": "依法治国和以德治国的有机统一", "B": "对传统民法上的公序良俗原则的继承和发展", "C": "法律为道德建设提供制度保障", "D": "道德为法律提供价值基础"}, "answer": "ABCD", "explain": ""}, {"id": "y2018-32", "num": 32, "type": "multiple", "chapter": "", "stem": "2017年4月1日，中共中央、国务院发布通知，决定设立河北雄安新区。这是以习近平同志为核心的党中央作出的一项重大的历史性战略选择，是千年大计、国家大事。雄安新区的设立有利于", "options": {"A": "探索人口经济密集地区优化开发新模式", "B": "调整优化京津冀城市布局和空间结构", "C": "探索沿海和内地对外开放新模式", "D": "集中疏解北京的非首都功能"}, "answer": "ABD", "explain": ""}, {"id": "y2018-33", "num": 33, "type": "multiple", "chapter": "", "stem": "2017年9月5日，新兴市场国家与发展中国家对话会在金砖国家领导人厦门会晤期间举行。金砖国家领导人和受邀的埃及、几内亚、墨西哥、塔吉克斯坦、泰国五国领导人出席会议，开启了“金砖+”合作模式，其重大意义在于", "options": {"A": "破解了南北对话的僵局", "B": "对南南合作形成了有机补充", "C": "进一步推动了全球治理体系的改善", "D": "全面提升了金砖机制的代表性和影响力"}, "answer": "BCD", "explain": ""}]}, {"id": "y2019", "title": "2019年真题", "questions": [{"id": "y2019-1", "num": 1, "type": "single", "chapter": "", "stem": "马克思、恩格斯始终站在革命斗争的最前沿，他们的一生是为推翻旧世界，建立新世界而不息战斗的一生。马克思、恩格斯领导创建的世界上第一个无产阶级政党是", "options": {"A": "国际工人协会", "B": "正义者联盟", "C": "共产主义者同盟", "D": "社会主义工人国际"}, "answer": "C", "explain": ""}, {"id": "y2019-2", "num": 2, "type": "single", "chapter": "", "stem": "“橘生淮南则为橘，生为淮北则为枳，叶徒相似，其实味不同。所以然者何？水土异也。”橘逾淮为枳说明了", "options": {"A": "事物的发展变化以时间地点和条件为转移", "B": "事物的普遍联系是通过中介来实现的", "C": "任何实体事物都是普遍联系之间的一个网结", "D": "事物的变化和发展是一个过程"}, "answer": "A", "explain": ""}, {"id": "y2019-3", "num": 3, "type": "single", "chapter": "", "stem": "马克思指出，判断一个变革时代不能以该时代的意识为依据，相反，这个意识必须从物质生活的矛盾中去解释。这里的“物质生活的矛盾”从根本上说是", "options": {"A": "社会生产力和生产关系的现存冲突", "B": "经济基础与上层建筑的现存冲突", "C": "人类社会与自然界的现存冲突", "D": "社会存在与社会意识的现存冲突"}, "answer": "A", "explain": ""}, {"id": "y2019-4", "num": 4, "type": "single", "chapter": "", "stem": "在以私有制经济为基础的商品经济中，商品生产者的私人劳动生产的产品是否与社会的需求相适应，作为具体劳动的有用性质能否为社会所承认，商品的使用价值和价值之间的矛盾是否能得到解决，决定着商品生产者的命运。以私有制为基础的商品经济的基本矛盾是", "options": {"A": "使用价值和价值之间的矛盾", "B": "私人劳动和社会劳动之间的矛盾", "C": "具体劳动和抽象劳动的矛盾", "D": "脑力劳动和体力劳动的矛盾"}, "answer": "B", "explain": ""}, {"id": "y2019-5", "num": 5, "type": "single", "chapter": "", "stem": "习近平新时代中国特色社会主义思想是对马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想，科学发展观的继承和发展，是马克思主义中国化最新成果，是党和人民实践经验和集体智慧的结晶，是中国特色社会主义理论体系的重要组成部分，是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南。这一思想的核心要义是", "options": {"A": "坚持和发展中国特色社会主义", "B": "实现社会主义现代化", "C": "推进马克思主义中国化时代化大众化", "D": "坚持以经济建设为中心"}, "answer": "A", "explain": ""}, {"id": "y2019-6", "num": 6, "type": "single", "chapter": "", "stem": "党的十八大以来，为了更好的适应我国国家安全面临的新形势新任务实现国家长治久安，我们党明确提出了总体国家安全观。总体国家安全观的宗旨是", "options": {"A": "政治安全", "B": "经济安全", "C": "人民安全", "D": "军事、文化、社会安全"}, "answer": "C", "explain": ""}, {"id": "y2019-7", "num": 7, "type": "single", "chapter": "", "stem": "高度重视和不断加强党的自身建设，是中国共产党从小到大、由弱变强，从挫折中奋起，在战胜困难中不断成熟的一大法宝，也是党领导的伟大事业不断取得胜利的根本保证。中国特色社会主义进入新时代，党的建设的根本方针是", "options": {"A": "全面加强党的执政本领", "B": "坚持党要管党、全面从严治党", "C": "坚持解放思想、改革创新", "D": "全面推进党的政治建设"}, "answer": "B", "explain": ""}, {"id": "y2019-8", "num": 8, "type": "single", "chapter": "", "stem": "党的十九大提出实施乡村振兴战略，是以习近平同志为核心的党中央着眼党和国家事业全局，深刻把握现代化建设规律和城乡关系变化特征，顺应亿万农民对美好生活的向往，对“三农”工作作出的重大决策部署，是新时代做好“三农”工作的总抓手。实施乡村振兴战略的根本目的是", "options": {"A": "确保国家粮食安全", "B": "建立新型土地承包关系", "C": "转移农村剩余劳动力", "D": "推进农业农村现代化"}, "answer": "D", "explain": ""}, {"id": "y2019-9", "num": 9, "type": "single", "chapter": "", "stem": "由于民族危机越来越严重，在维新派的推动和策划下，1898年6月11日，光绪皇帝颁布了“明定国是”谕旨，宣布开始变法，并在此后的103天中，接连发布了一系列推行新政的政令，史称“戊戌变法”，又称“百日维新”。戊戌维新是一场资产阶级性质的改良运动，这是因为变法的政令", "options": {"A": "触及封建制度根本", "B": "采纳了维新派提出的开国会等政治主张", "C": "一定程度上反映了资产阶级的政治和经济诉求", "D": "带有彻底性和不妥协性"}, "answer": "C", "explain": ""}, {"id": "y2019-10", "num": 10, "type": "single", "chapter": "", "stem": "中国共产党成立后积极发动工农群众开展革命斗争，中国共产党第一次独立领导并取得完全胜利的工人斗争是", "options": {"A": "安源路矿工人罢工", "B": "香港海员罢工", "C": "京汉铁路工人罢工", "D": "开滦五矿工人罢工"}, "answer": "A", "explain": ""}, {"id": "y2019-11", "num": 11, "type": "single", "chapter": "", "stem": "1936年12月12日，张学良、杨虎城发动“兵谏”，扣留了蒋介石。这就是震惊中外的西安事变。事变发生后，中共中央确定了促成事变和平解决的基本方针，其原因是中国共产党", "options": {"A": "为了团结国民党共同抗日", "B": "不赞成张学良、杨虎城的主张", "C": "工作重心转向城市斗争", "D": "接受了共产国际的指示"}, "answer": "A", "explain": ""}, {"id": "y2019-12", "num": 12, "type": "single", "chapter": "", "stem": "1945年8月29日，重庆《大公报》就毛泽东赴重庆谈判发表了《毛泽东先生来了！》的社评，其中写道：“毛泽东先生来了，中国人听了高兴，世界人听了高兴，无疑问的大家都认为这是中国的一件大喜事。”毛泽东赴重庆谈判的目的是", "options": {"A": "结束国共内战", "B": "商讨联合抗日", "C": "寻求外国援助", "D": "争取和平民主"}, "answer": "D", "explain": ""}, {"id": "y2019-13", "num": 13, "type": "single", "chapter": "", "stem": "2018年9月10日，全国教育大会在北京召开。习近平在讲话中指出，培养什么人是教育的首要问题，我国是中国共产党领导的社会主义国家，这就决定了我们的教育必须", "options": {"A": "把推进教育现代化作为根本任务", "B": "把建设教育强国作为根本任务", "C": "把全面深化教育体制改革作为根本任务", "D": "把培养社会主义建设者和接班人作为根本任务"}, "answer": "D", "explain": ""}, {"id": "y2019-14", "num": 14, "type": "single", "chapter": "", "stem": "马克思说：“人只有为同时代人的完美、为他们的幸福而工作，自己才能达到完美。如果一个人只为自己劳动，他也许能够成为著名的学者、伟大的哲人、卓越的诗人，然而他永远不能成为完美的、真正伟大的人物。”这表明", "options": {"A": "实现自我价值是创造社会价值的原因", "B": "人生价值是自我价值和社会价值的统一", "C": "人生社会价值可以代替自我价值", "D": "个人价值的实现取決于他人的认可"}, "answer": "B", "explain": ""}, {"id": "y2019-15", "num": 15, "type": "single", "chapter": "", "stem": "2018年9月，中华人民共和国国务院新闻办公室发布了《关于中美经贸摩擦的事实与中方立场》白皮书。白皮书指出，中美两国经济发展阶段、经济制度不同，存在经贸摩擦是正常的，关键是", "options": {"A": "如何增进互信、促进合作、管控分歧", "B": "如何增加出口、降低关税、管控分歧", "C": "如何増加进口、消除逆差、管控分歧", "D": "如何加强合作、加征关税、管控分岐"}, "answer": "A", "explain": ""}, {"id": "y2019-16", "num": 16, "type": "single", "chapter": "", "stem": "2018年4月27日，朝鲜国务委员会委员长金正恩与韩国总统文在寅在板门店韩方一侧的“和平之家”举行会晤。本次两国首脑会晤最重要的成果是共同签署并发表了", "options": {"A": "《北南共同宣言》", "B": "《北南关系发展与和平繁荣宣言》", "C": "《（板门店宣言）军事领域履行协议》", "D": "《为促进朝鲜半岛和平、繁荣、统一的板门店宣言》"}, "answer": "D", "explain": ""}, {"id": "y2019-17", "num": 17, "type": "multiple", "chapter": "", "stem": "虚拟现实技术是一种运用计算机仿真系统创建多源信息融合的交互式三维动态视景以及动作仿真的技术，可以给使用者提供沉浸性、多感知性、交互性的互动体验，虚拟现实技术所构造的虚拟环境说明", "options": {"A": "物质世界不再具有客观实在性", "B": "物质世界的存在形式具有多样性", "C": "信息是独立于物质和意识的第三种存在状态", "D": "人们可以通过实践创造出自然界原本不存在的现实状态"}, "answer": "BD", "explain": ""}, {"id": "y2019-18", "num": 18, "type": "multiple", "chapter": "", "stem": "基因编辑是应对遗传性疾病的一种潜在治疗办法，但其技术运用极具争议，这不仅是因为基因的变化会传给后代并最终有可能影响整个基因库，而且更重要的是基因编辑会产生长远而深刻的社会影响，可能衍生出一系列棘手的伦理、法律和安全难题。正因如此，许多国家对人类基因编辑技术制定了相应的伦理、法律规范。人类严格控制基因编辑行为的原因在于", "options": {"A": "人的实践活动要遵循真理尺度与价值尺度的统一", "B": "基因编辑技术可能突破人类的伦理道德底线", "C": "科学技术有时表现为异己的、敌对的力量", "D": "人的实践活动是合规律性与合目的性的统一"}, "answer": "ABCD", "explain": ""}, {"id": "y2019-19", "num": 19, "type": "multiple", "chapter": "", "stem": "资本主义的生产目的是追逐利润最大化。为了获得尽可能多的利润，分布在不同部门（行业）的资本家之间必然展开激烈的竞争，而竞争的结果必将导致利润率的平均化。利润率平均化的过程意味着", "options": {"A": "某企业工人创造的剩余价值有被其他资本家侵占的可能", "B": "各部门内不同资本家的等量投资所得到的利润大体上均等", "C": "各部门资本家在加强对工人阶级的剥削上有着共同的阶级利益", "D": "不从事直接生产的银行资本家所获得的利润总是低于平均利润"}, "answer": "ABC", "explain": ""}, {"id": "y2019-20", "num": 20, "type": "multiple", "chapter": "", "stem": "资本主义必然为社会主义所代替，并不意味着资本主义将在短期内自行消亡。资本主义向社会主义的过渡必然是一个复杂的、长期的历史过程，其原因在于", "options": {"A": "任何社会形态的存在都有绝对稳定性", "B": "资本主义的发展具有不平衡性", "C": "资本主义社会具有一定的自我调节能力", "D": "当代资本主义的发展还显示出生产关系对生产力容纳的空间"}, "answer": "BCD", "explain": ""}, {"id": "y2019-21", "num": 21, "type": "multiple", "chapter": "", "stem": "习近平指出：“当代中国的伟大社会变革，不是简单延续我国历史文化的母版，不是简单套用马克思主义经典作家设想的模板，不是其他国家社会主义实践的再现，不是国外现代化发展的翻版「'这对我们理解科学社会主义一般原则的启示是", "options": {"A": "科学社会主义绝不是一成不变的教条", "B": "科学社会主义与资本主义生产方式没有必然的联系", "C": "科学社会主义是人类优秀文化传统的历史延续.", "D": "科学社会主义在不同的时代具有不同的内容和形式"}, "answer": "ACD", "explain": ""}, {"id": "y2019-22", "num": 22, "type": "multiple", "chapter": "", "stem": "中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。但是，我国社会主要矛盾的变化没有改变我们对我国社会主义所处历史阶段的判断，依据是", "options": {"A": "我国总体上仍处于不发达阶段", "B": "我国仍然面临极其复杂的国际环境", "C": "我国仍然是世界上最大的发展中国家", "D": "我国社会主要矛盾的变化只是社会主义初级阶段这个历史阶段中的变化"}, "answer": "ACD", "explain": ""}, {"id": "y2019-23", "num": 23, "type": "multiple", "chapter": "", "stem": "改革开放40年来，我国民营经济从小到大、从弱到强，不断发展壮大。截至2017年底，我国民营企业数量超过2700万家，个体工商户超过6500万户，注册资本超过165万亿元。概括起来说，民营经济具有“五六七八九”的特征，即贡献了50%以上的税收，60%以上的国内生产总值,70%以上的技术创新成果，80%以上的城镇劳动就业，90%以上的企业数量。我国经济发展能够创造中国奇迹，民营经济功不可没。这表明，民营经济已成为", "options": {"A": "实现中华民族伟大复兴中国梦的重要力量", "B": "推动社会主义市场经济发展的重要力量", "C": "建设现代化经济体系的重要主体", "D": "控制国民经济命脉的主导力量"}, "answer": "ABC", "explain": ""}, {"id": "y2019-24", "num": 24, "type": "multiple", "chapter": "", "stem": "国家治理体系是在党领导下管理国家的制度体系，是一整套紧密相连、相互协调的国家制度；国家治理能力则是运用国家制度管理社会各方面事务的能力。二者的关系主要表现为", "options": {"A": "国家治理体系和治理能力是相辅相成的有机整体", "B": "好的国家治理体系可以提高国家治理能力", "C": "提高国家治理能力可以充分发挥国家治理体系的效能", "D": "国家治理体系越完备国家治理能力就一定越强"}, "answer": "ABC", "explain": ""}, {"id": "y2019-25", "num": 25, "type": "multiple", "chapter": "", "stem": "全面准确的理解和把握“一国”与“两制”的关系，应在坚持“一国”基础上，实现“两制”之间的和谐相处、相互促进。为此，必须做到", "options": {"A": "把利用国际有利条件和发挥港澳优势有机结合起来", "B": "把坚持“一国”原则和尊重“两制”差异有机结合起来", "C": "把维护中央权力和保障特别行政区高度自治权有机结合起", "D": "把发挥祖国内地坚强后盾作用和提高港澳自身竞争力有机结合起来"}, "answer": "BCD", "explain": ""}, {"id": "y2019-26", "num": 26, "type": "multiple", "chapter": "", "stem": "坚定文化自信，是事关国运兴衰，事关文化安全、事关民族精神独立性的大问题。坚定中国特色社会主义道路自信、理论自信、制度自信，说到底就是要坚定文化自信。讲文化自信，我们有充足的理由和充足底气，因为中国特色社会主义文化", "options": {"A": "源自于博大精深的中华优秀传统文化", "B": "承继于激昂向上的革命文化", "C": "熔铸于生机勃勃的社会主义先进文化", "D": "植根于中国特色社会主义伟大实践"}, "answer": "ABCD", "explain": ""}, {"id": "y2019-27", "num": 27, "type": "multiple", "chapter": "", "stem": "1927年10月，毛泽东率领湘赣边界秋收起义的工农革命军，开始创建以宁冈为中心的井冈山农村革命根据地，走农村包围城市、武装夺取政权的革命新道路。毛泽东确定在井冈山建立根据地，是因为这个地区", "options": {"A": "有较好的群众基础", "B": "地势险要且易守难攻", "C": "易于部队筹款筹粮", "D": "敌人的统治力量比较薄弱"}, "answer": "ABCD", "explain": ""}, {"id": "y2019-28", "num": 28, "type": "multiple", "chapter": "", "stem": "1949年10月1日，首都军民30万人齐集北京天安门广场，欢庆中华人民共和国的诞生。中华人民共和国的成立，标志着", "options": {"A": "新民主主义革命取得了基本的胜利", "B": "半殖民地半封建社会的结束", "C": "中国共产党的地位发生了根本性的变化", "D": "社会主义基本制度的确立"}, "answer": "ABC", "explain": ""}, {"id": "y2019-29", "num": 29, "type": "multiple", "chapter": "", "stem": "我国经济体制的改革首先在农村取得突破性进展。党的十一届三中全会曾指出：“我国农业近二十年来的发展速度不快，它同人民的需要和四个现代化的需要之间存在着极其尖锐的矛盾。”当时我国农业和农村经济发展面临的主要问题有", "options": {"A": "农民的温饱问题尚未完全解决", "B": "农村的土地改革尚未完成", "C": "人民公社体制亟待改革", "D": "乡镇企业管理体制亟待改革"}, "answer": "AC", "explain": ""}, {"id": "y2019-30", "num": 30, "type": "multiple", "chapter": "", "stem": "2018年4月，十三届全国人民代表大会第一次会议通过《宪法修正案》。把国家倡导的社会主义核心价值观正式写入宪法，进一步凸显了社会主义核心价值观的重大意义。社会主义核心价值观是", "options": {"A": "坚持和发展中国特色社会主义的价值遵循", "B": "构建人类命运共同体的行动指南", "C": "增进社会团结和谐的最大公约数", "D": "提高国家文化软实力的迫切要求"}, "answer": "ACD", "explain": ""}, {"id": "y2019-31", "num": 31, "type": "multiple", "chapter": "", "stem": "中国特色社会主义法制道路的一个鲜明特点，就是坚持依法治国和以德治国相结合。法治和德治，是治国理政不可或缺的两种方式。这是因为法治和德治", "options": {"A": "发挥作用方式不同", "B": "调整范围不同", "C": "所处地位不同", "D": "实现途径不同"}, "answer": "ABCD", "explain": ""}, {"id": "y2019-32", "num": 32, "type": "multiple", "chapter": "", "stem": "2018年6月22日至23日，中央外事工作会议在北京召开，习近平总书记在会上发表重要讲话，强调要深入分析世界转型过渡期国际形势的演变规律，准确把握历史交汇期，我国外部环境的基本特征，统筹谋划和推进对外工作，其基本要求是", "options": {"A": "既要把握国际环境总体稳定的大势，又要重视国际安全挑战错综复杂的局面", "B": "既要把握经济全球化持续发展的大势，又要重视世界经济格局深刻演变的动向", "C": "既要把握世界多极化加速推进的大势，又要重视大国关系深入调整的态势", "D": "既要把握各种文明交流互鉴的大势，又要重视不同思想文化相互激荡的态势"}, "answer": "ABCD", "explain": ""}, {"id": "y2019-33", "num": 33, "type": "multiple", "chapter": "", "stem": "2018年是中日和平友好条约缔结40周年，日本首相安倍晋三于10月25日至27日对中国进行正式访问。习近平主席、李克强总理分别与其进行了会晤、会谈。中日双方就改善、发展两国关系及共同关心的国际和地区问题交换了意见，在政治、经济、安全及其他国际问题上达成诸多共识，取得务实成果，这些成果主要有", "options": {"A": "双方一致确认将恪守中日四个政治文件的各项原则", "B": "签署了中日两国海上搜寻救助合作协定", "C": "签署了中日双边本币互换协议", "D": "双方一致同意将2019年作为“中日青少年交流促进年”"}, "answer": "ABCD", "explain": ""}]}, {"id": "y2020", "title": "2020年真题", "questions": [{"id": "y2020-1", "num": 1, "type": "single", "chapter": "", "stem": "恩格斯于1820年11月28日出生在德国巴门市的一个工厂主家庭。他称自己一生所作的事就是“拉第二小提琴”。恩格斯不仅与马克思一起创立马克思主义,参加并指导国际工人运动，而且在传播和发展马克思主义方面作出了杰出的贡献。恩格斯全面阐述马克思主义理论体系的著作是", "options": {"A": "《共产党宣言》", "B": "《家庭、私有制和国家的起源》", "C": "《反杜林论》", "D": "《自然辩证法》"}, "answer": "C", "explain": ""}, {"id": "y2020-2", "num": 2, "type": "single", "chapter": "", "stem": "逐渐“飞人寻常百姓家”的人工智能对人类的社会生活产生了巨大影响。对此技术乐观派认为人工智能为人类发展更新了“发动机”；技术悲观派则认为人工智能的发展可能导致“人类的终结”。对人工智能社会效用的评价是", "options": {"A": "对客观事物发展规律的真理性评价", "B": "对主体需要发展程度的认知性评价", "C": "受主体情感、兴趣和爱好者的主观性评价", "D": "对客观事物的属性及其满足主体需要的价值性评价"}, "answer": "D", "explain": ""}, {"id": "y2020-3", "num": 3, "type": "single", "chapter": "", "stem": "在相同的劳动时间里，复杂劳动创造的价值大于简单劳动创造的价值。在以私有制为基础的商品经济条件下,复杂劳动转化为简单劳动", "options": {"A": "是商品生产者自觉计算出来的", "B": "是市场管理部门事先规定的", "C": "是商品生产者协商出来的", "D": "是商品交换过程中市场机制自发实现的"}, "answer": "D", "explain": ""}, {"id": "y2020-4", "num": 4, "type": "single", "chapter": "", "stem": "十月革命之前，列宁总结当时变化了的新情况，得出“社会主义可能首先在少数甚至在单独一个资本主义国家内获得胜利”的结论。列宁得出这个结论的理论依据是", "options": {"A": "资本主义经济和政治发展不平衡规律", "B": "资本主义国家的不断衰落", "C": "科学社会主义理论的广泛传播", "D": "无产阶级力量的不断壮大"}, "answer": "A", "explain": ""}, {"id": "y2020-5", "num": 5, "type": "single", "chapter": "", "stem": "“什么是社会主义、怎样建设社会主义”是邓小平在领导改革开放和现代化建设这一新的革命过程中,不断提出和反复思考的首要的基本的理论问题。搞清楚这一问题的关键是", "options": {"A": "在认清基本国情的基础上，进一步把握我国社会主义的发展阶段", "B": "在正确分析我国社会主要矛盾的基础上，进一步明确社会主义的根本任务", "C": "在坚持社会主义基本制度的基础上，进一步认清社会主义的本质", "D": "在总结我国社会主义历史经验的基础上，进一步揭示社会主义社会发展的一般规律"}, "answer": "C", "explain": ""}, {"id": "y2020-6", "num": 6, "type": "single", "chapter": "", "stem": "实体经济是一国经济的立身之本和财富之源，是国家强盛的重要支柱。党的十九大报告指出：建设现代化经济体系必须着力发展实体经济，全面提升实体经济发展水平。我国全面提升实体经济的重点是", "options": {"A": "加快发展先进制造业", "B": "深化要素市场化配置改革", "C": "加快人力资本培养力度", "D": "持续推进“三去一降一补”"}, "answer": "A", "explain": ""}, {"id": "y2020-7", "num": 7, "type": "single", "chapter": "", "stem": "2019年9月20日，习近平在中央政协工作会议暨庆祝中国人民政治协商会议成立70周年大会上的讲话中，提出了新时代加强和改进人民政协工作的总体要求，指出新时代做好人民政协工作的中心环节是", "options": {"A": "提高政治协商、民主监督、参政议政水平", "B": "加强思想政治引领，广泛凝聚共识", "C": "发挥人民政协专门协商机构作用", "D": "强化政协委员责任担当"}, "answer": "B", "explain": ""}, {"id": "y2020-8", "num": 8, "type": "single", "chapter": "", "stem": "1979年1月1日，全国人民代表大会常务委员会发表《告台湾同胞书》，郑重宣示争取祖国和平统一的大政方针，揭开了两岸关系发展新的历史篇章。2019年1月2日，习近平在《告台湾同胞书》发表40周年纪念会上的讲话中指出：“在一个中国原则基础上，台湾任何政党、团体同我们的交往都不存在障碍。以对话取代对抗，以合作取代争斗，以双赢取代零和，两岸关系才能行稳致远。”影响两岸关系行稳致远的总根子是", "options": {"A": "两岸对历史现状缺乏认同", "B": "两岸长期存在的政治分歧", "C": "“台独”分裂势力的存在", "D": "外部势力的干涉"}, "answer": "B", "explain": ""}, {"id": "y2020-9", "num": 9, "type": "single", "chapter": "", "stem": "近代以来中华民族面临着争取民族独立、人民解放和实现国家富强、人民富裕两大历史任务。近代中国的历史表明,要争得民族独立和人民解放，必须首先", "options": {"A": "发展教育提高国民素质", "B": "废除封建地主土地所有制", "C": "改变经济技术落后的面貌", "D": "进行反帝反封建的民主革命"}, "answer": "D", "explain": ""}, {"id": "y2020-10", "num": 10, "type": "single", "chapter": "", "stem": "1905年至1907年间，资产阶级革命派和改良派进行了一场大论战，双方论战的焦点是", "options": {"A": "要不要以革命手段推翻清王朝", "B": "要不要推翻帝制，实行共和", "C": "要不要进行社会革命", "D": "要不要发动广大民众"}, "answer": "A", "explain": ""}, {"id": "y2020-11", "num": 11, "type": "single", "chapter": "", "stem": "中国共产党一经成立，中国革命就展现了新的面貌。不久中国共产党就开始采取民族资产阶级、小资产阶级的政党和政治派别没有采取过、也不可能采取的革命方法，即", "options": {"A": "土地革命的方法", "B": "群众路线的方法", "C": "统一战线的方法", "D": "武装斗争的方法"}, "answer": "B", "explain": ""}, {"id": "y2020-12", "num": 12, "type": "single", "chapter": "", "stem": "1956年社会主义改造基本完成，随着中国建立了社会主义基本政治制度，社会主义基本经济制度也建立了起来。社会主义基本制度的确立，标志着中国", "options": {"A": "进入开始全面建设社会主义的历史阶段", "B": "半殖民地半封建社会的结束", "C": "社会主义工业化已经初步实现", "D": "新民主主义革命基本胜利"}, "answer": "A", "explain": ""}, {"id": "y2020-13", "num": 13, "type": "single", "chapter": "", "stem": "全面推进依法治国，涉及立法、执法、司法、守法等各个方面，涉及中国特色社会主义事业“五位一体”总体布局的各个领域，必须加强顶层设计、统筹谋划，在实际工作中必须有一个总揽全局、牵引各方的总抓手。全面依法治国的总抓手是", "options": {"A": "坚持依法治国和以德治国相结合", "B": "建设中国特色社会主义法治体系", "C": "坚持有法可依、有法必依、执法必严、违法必究", "D": "坚持科学立法、严格执法、公正司法、全民守法"}, "answer": "B", "explain": ""}, {"id": "y2020-14", "num": 14, "type": "single", "chapter": "", "stem": "习近平在纪念五四运动100周年大会上的讲话中指出：“爱国主义是我们民族精神的核心，是中华民族团结奋斗、自强不息的精神纽带。“对每一个中国人来说，爱国是本分，也是职责，是心之所系、悄之所归。对新时代中国青年来说，热爱祖国是立身之本、成才之基。当代中国爱国主义的本质就是", "options": {"A": "坚持爱国和爱党、爱社会主义高度统一", "B": "维护社会和谐和民族平等的统一", "C": "对民族和文化的归属感、认同感的统一", "D": "坚持立足民族和面向世界的统一"}, "answer": "A", "explain": ""}, {"id": "y2020-15", "num": 15, "type": "single", "chapter": "", "stem": "2019年11月，中共中央、国务院印发的《新时代爱国主义教存实施纲要》指出，爱国主义是中华民族的民族心、民族魂，是中华民族最重要的精神财富，是中国人民和中华民族维护民族青少年进行爱国主义教育的主阵地是", "options": {"A": "手机和互联网", "B": "精品读物", "C": "思想政治理论课", "D": "传统节日纪念活动"}, "answer": "C", "explain": ""}, {"id": "y2020-16", "num": 16, "type": "single", "chapter": "", "stem": "2019年8月2日，美国宣布正式退出《中导条约》（全称《苏联和美国消除两国中程和中短程导弹条约》），其真实原因是", "options": {"A": "俄罗斯首先违约", "B": "谋求全球战略平衡与稳定", "C": "自我松绑谋求绝对军事优势", "D": "其他国家不受条约限制"}, "answer": "C", "explain": ""}, {"id": "y2020-17", "num": 17, "type": "multiple", "chapter": "", "stem": "2019年4月10日21时，全球多国科研人员合作的“事件视界望远镜”项目在全球六地同步举行新闻发布会，发布了世界上首张黑洞图像，公布了人类首次拍到的黑洞照片。这是继2015年人类通过引力波探测“听到”两个黑洞合体之后，证明黑洞存在的直接“视界”证据。有科学家认为，这张看起来有点模糊的照片意义非凡，它再次验证了爱因斯坦广义相对论的预言是对的，并将进一步帮助科学家解答星系演化等一系列宇宙本质问题。人类首次“看到”黑洞正面照表明", "options": {"A": "空间的性质依赖于物质的分布及其运动状态", "B": "世界是物质的统一体", "C": "物质世界的客观存在与人的实践和认识水平有关", "D": "空间的观念随人的认识发展而拓展"}, "answer": "ABD", "explain": ""}, {"id": "y2020-18", "num": 18, "type": "multiple", "chapter": "", "stem": "2019年10月24日，中共中央政治局就区块链技术发展现状和趋势进行集体学习。习近平在主持学习时指出，“我们要提高运用和管理区块链技术能力，使区块链技术在建设网络强国、发展数字经济、助力经济社会发展等方面发挥更大作用。”有专家认为基于区块链技术，人们可以构建在没有中介辅助下多个参与方之间的资产交易、价值传递的网络，通过建立执行智能合约，推动契约关系和规则的维护和履行，降低信用建立成本，营造良好市场环境。区块链技术所实现的人与人之间相互联系的延伸和变化，表明人们的现实社会关系", "options": {"A": "是一种单纯的经济和商业关系", "B": "具有多样性和复杂性的特征", "C": "归根到底受生产关系的制约", "D": "是由信息技术构造的虚拟关系"}, "answer": "BC", "explain": ""}, {"id": "y2020-19", "num": 19, "type": "multiple", "chapter": "", "stem": "一方水土孕育一方文化。很早以前，人们就在平原、高原、山地、河谷、海域等广阔的地理空间发展出农耕、渔猎、游牧等不同经济形态，进而形成具有明显地域差别的文化。高铁、互联网等虽然极大地消除了不同地域空间之间的界限，加速了地域文化的同质性转化，但地域文化并没有消失，且还在待续对当代社会发展产生重要影响。“一方水土孕育一方文化”表明", "options": {"A": "社会经济状况决定文化发展形态", "B": "自然地理空间影响文化的外在特征", "C": "文化是人类社会发展的决定力蜇", "D": "不同形态文化的发展具有相对独立性"}, "answer": "ABD", "explain": ""}, {"id": "y2020-20", "num": 20, "type": "multiple", "chapter": "", "stem": "资本循环是资本实现价值增殖的重要前提。所谓资本循环，是指资本从一种形式出发，经过一系列形式的变化，又回到原来出发点的运动。产业资本循环过程中在空间上同时存在的资本形式有", "options": {"A": "货币资本", "B": "借贷资本", "C": "生产资本", "D": "商品资本"}, "answer": "ACD", "explain": ""}, {"id": "y2020-21", "num": 21, "type": "multiple", "chapter": "", "stem": "为了加强对各国垄断资本的协调和制约，第二次世界大战后，国际垄断资本建立了国际货币基金组织、世界银行和世界贸易组织等国际经济机构。这些国际经济机构在协调和合作的基础上促进了经济全球化的发展，主要表现在", "options": {"A": "加强了各国和各经济体之间的联系", "B": "推动了商品和服务贸易额的迅速增加", "C": "有效应对全球性经济波动和经济危机", "D": "加快了资本和技术等要素的国际流动"}, "answer": "ABD", "explain": ""}, {"id": "y2020-22", "num": 22, "type": "multiple", "chapter": "", "stem": "中国特色社会主义进入新时代，人民群众的新期待内容更广泛，不仅关注“有没有”，更关注“好不好”；不仅包括既有的物质文化需求，更包括在此基础上衍生出来的获得感、幸福感、安全感及尊严、权利等新需求。这一变化表明", "options": {"A": "我国社会主要矛盾发生了历史性变化", "B": "我国已经满足了人民“从有到优”的需求", "C": "人民群众对日益增长的物质文化需要出现了阶段性新特征", "D": "我国不平衡不充分的发展已成为制约满足人民需要的主要根源"}, "answer": "ACD", "explain": ""}, {"id": "y2020-23", "num": 23, "type": "multiple", "chapter": "", "stem": "深圳经济特区是我国改革开放的排头兵和重要窗口。2019年8月，中共中央、国务院印发《关千支持深圳建设中国特色社会主义先行示范区的意见》，要求将深圳建设成为高质量发展高地、法治城市示范、城市文明典范、民生幸福标杆、可待续发展先锋。支持深圳建设中国特色社会主义先行示范区，有利于", "options": {"A": "在更高起点、更高层次、更高目标上推进改革开放", "B": "更好实施粤港澳大湾区战略，丰富“一国两制”事业发展新实践", "C": "率先探索全面建设社会主义现代化强国新路径", "D": "破解制约建成小康社会的重点难点问题"}, "answer": "ABC", "explain": ""}, {"id": "y2020-24", "num": 24, "type": "multiple", "chapter": "", "stem": "消除贫困，改善民生，逐步实现共同富裕，是社会主义的本质要求，是我们党的重要使命。新中国成立70年来，我国已有7亿多人摆脱贫困，占全球减贫人口的70%以上。中国是第一个完成联合国千年发展目标中减贫目标的发展中国家，也是唯一实现了经济较快增长与大规模减贫同步、综合国力增强与人民生活水平提高同步这一历史性跨越的发展中国家。进入新时代，为了确保到2020年现行标准下农村贫困人口实现脱贫、贫困县全部摘帽的目标，我国采取的重要举措是", "options": {"A": "坚持精准扶贫、精准脱贫", "B": "强化党政一把手负总责的责任制", "C": "注重扶贫同扶志、扶智相结合", "D": "重点攻克深度贫困地区脱贫任务"}, "answer": "ABCD", "explain": ""}, {"id": "y2020-25", "num": 25, "type": "multiple", "chapter": "", "stem": "从1956年我国建立第一个自然保护区鼎湖山保护区，到目前为止全国已拥有2750个自然保护区，面积147万平方公里，约占陆域国土面积的15%。自党的十八届三中全会决定“建立国家公园体制”以来，国家公园体制试点快速推进，目前全国共有10处国家公园体制试点单位，涉及12个省，总面积约22.29万平方公里。我国建立以国家公园为主体的自然保护地体系的意义是", "options": {"A": "推进自然生态保护，建设美丽中国", "B": "保护重要的自然生态系统和独特的自然遗产", "C": "促进人与自然和谐共生", "D": "维护国家生态安全"}, "answer": "ABCD", "explain": ""}, {"id": "y2020-26", "num": 26, "type": "multiple", "chapter": "", "stem": "“一国两制”是实现祖国和平统一的一项重要制度，是中国特色社会主义的一个伟大创举。2019年11月，国家主席习近平在巴西利亚出席金砖国家领导人第十一次会晤时，针对香港出现的街头暴力犯罪行为发表重要讲话。习近平指出，香港持续发生的激进暴力犯罪行为，严重践踏法治和社会秩序，严重破坏香港繁荣稳定，严重挑战“一国两制”原则底线。止暴制乱、恢复秩序是香港当前最紧迫的任务。贯彻落实“一国两制”方针，绝不能允许触碰的原则底线是", "options": {"A": "危害国家主权安全", "B": "干扰内地与香港的民间交流", "C": "挑战中央权力和香港特别行政区基本法权威", "D": "利用香港对内地进行渗透破坏"}, "answer": "ACD", "explain": ""}, {"id": "y2020-27", "num": 27, "type": "multiple", "chapter": "", "stem": "鸦片战争以后，资本－帝国主义列强通过发动侵略战争，强迫中国签订一系列不平等条约，破坏中国的领土主权、领海主权、关税主权、司法主权等，使中国丧失了完全独立的地位。但列强也没能如英国在印度那样，对中国实行直接的殖民统治，这是因为", "options": {"A": "中国入民顽强、持久的反抗", "B": "列强间争夺中国的矛盾无法协调", "C": "中国的封建势力拒绝与列强合作", "D": "中国长期以来是一个统一的大国"}, "answer": "ABD", "explain": ""}, {"id": "y2020-28", "num": 28, "type": "multiple", "chapter": "", "stem": "在北洋军阀反动统治的艰难环境中，以李大钊为代表的早期马克思主义者掀起了一场研究、传播马克思主义的运动。这场运动从一开始就", "options": {"A": "重视对马克思主义基本理论的学习", "B": "注意从中国的实际出发，学习运用马克思主义理论", "C": "提出知识分子应当同劳动群众相结合的思想", "D": "明确提出马克思主义与中国实际相结合的命题"}, "answer": "ABC", "explain": ""}, {"id": "y2020-29", "num": 29, "type": "multiple", "chapter": "", "stem": "1950年6月，朝鲜战争煤发，美国宣布武装援助南朝鲜，同时命令其海军第七舰队开入台湾海峡，“阻止对台湾的任何进攻”，公然干涉中国内政。中国政府在美国把战火烧到鸭绿江边的时候，毅然做出抗美援朝的决策。中朝两国人民及其军队经过艰苦作战以及谈判斗争，终于在1953年7月迫使美国代表在停战协定上签字。克拉克后来在回忆录中沮丧地写道：“我是美国历史上第一个在没有取得胜利的停战协定上签字的司令官。”抗美援朝战争的胜利", "options": {"A": "提高了新中国的国际威望，为新中国赢得了相对稳定的和平环境", "B": "打退了美国侵略扩张的势头，结束了美国在东方的霸权", "C": "保卫了中国的国家安全，为维护亚洲和世界和平做出了贡献", "D": "打破了美国军队不可战胜的神话，增强了中国人民的民族自信心和自豪感"}, "answer": "ACD", "explain": ""}, {"id": "y2020-30", "num": 30, "type": "multiple", "chapter": "", "stem": "2019年10月，中共中央、国务院印发的《新时代公民道德建设实施纲要》是在中国特色社会主义进入新时代的背景下，推动我国精神文明建设再上新高度，为实现中华民族伟大复兴中国梦凝心铸魂的指导性文件。新时代公民道德建设的重点任务是", "options": {"A": "筑牢理想信念之基", "B": "培育和践行社会主义核心价值观", "C": "传承中华传统美德", "D": "弘扬民族精神和时代精神"}, "answer": "ABCD", "explain": ""}, {"id": "y2020-31", "num": 31, "type": "multiple", "chapter": "", "stem": "法律规定公民有表达权，但权利要依法行使，尤其是“自媒体时代”，人人都有“麦克风”，处处都是“直播间”，这支“麦克风”并不是可以随心所欲使用的，应以法律的相关规定为界限。对行使法律权利界限的正劭理解是", "options": {"A": "权利行使要有目的的正当性", "B": "权利行使的方式具有唯一性", "C": "权利行使不能超过法定的限度", "D": "权利行使要遵循程序正当的原则"}, "answer": "ACD", "explain": ""}, {"id": "y2020-32", "num": 32, "type": "multiple", "chapter": "", "stem": "2019年1月3日10时26分，嫦娥四号探测器成功着陆月球背面预选着陆区，并通过“鹊桥”中继星传回了月背影像图，揭开了古老月背的神秘面纱。这次月球探测", "options": {"A": "开启了我国太空站建设的序幕", "B": "实现了人类探测器首次月背软着陆", "C": "实现了首次月背与地球的中继通信", "D": "开启了人类月球探测新篇章"}, "answer": "BCD", "explain": ""}, {"id": "y2020-33", "num": 33, "type": "multiple", "chapter": "", "stem": "2019年是中俄建交70周年，应俄罗斯总统普京邀请，6月5日至7日，习近平主席对俄罗斯进行国事访问并出席第二十三届圣彼得堡国际经济论坛。在中俄建交70周年纪念大会的讲话中，习近平对“新时代的中俄关系”提出的主张是", "options": {"A": "要始终以互信为基石，巩固彼此战略依托", "B": "耍着力深化利益交融，拉紧共同利益纽带", "C": "要大力促进民心相通，夯实世代友好的民意基础", "D": "要更加担当有为，携手维护世界和平安宁"}, "answer": "ABCD", "explain": ""}]}, {"id": "y2021", "title": "2021年真题", "questions": [{"id": "y2021-1", "num": 1, "type": "single", "chapter": "", "stem": "1844 年8 月底，马克思和恩格斯在巴黎会面。这次会面使他们发现彼此的基本观点完全一致，于是开始了在科学理论研究和革命活动中的长期合作。马克思和恩格斯首次系统阐述历史唯物主义基本观点的著作是", "options": {"A": "《德意志意识形态》", "B": "《神圣家族》", "C": "《哲学的贫困》", "D": "《共产党宣言》"}, "answer": "A", "explain": ""}, {"id": "y2021-2", "num": 2, "type": "single", "chapter": "", "stem": "习近平强调，“历史是最好的教科书”，“历史的经验值得注意，历史的教训更应引以为戒”，“中国革命历史是最好的营养剂”。人们能够从历史中汲取经验教训，是因为", "options": {"A": "历史规律和自然规律存在着惊人的相似性", "B": "人类历史发展存在着不以人的意志为转移的规律", "C": "历史总是在循环往复中不断向前发展", "D": "人类已经完全掌握了历史发展的内在规律"}, "answer": "B", "explain": ""}, {"id": "y2021-3", "num": 3, "type": "single", "chapter": "", "stem": "智能生物识别等人工智能新技术快速走进老百姓的生活。然而，在新技术快速发展应用的同时，也因法律法规相对滞后而引发人们对信息安全和隐私保护的担忧。有专家呼吁，在发展新技术时，要划定法律禁区制定行业规范，构建一个新技术健康发展的法律法规体系。从社会意识和社会存在的关系看，法律法规", "options": {"A": "总是阻碍新技术的健康发展", "B": "只能落后于新技术发展", "C": "与新技术发展具有不平衡性", "D": "归根到底是新技术发展的内在动力"}, "answer": "C", "explain": ""}, {"id": "y2021-4", "num": 4, "type": "single", "chapter": "", "stem": "马克思指出，资本主义生产在“发展社会劳动的生产力”的同时，也“不自觉地创造着一种更高级的生产形式的物质条件。”这表明", "options": {"A": "资本主义生产方式能够无限制地解放和发展社会生产力", "B": "资本越发展越有利于巩固资本主义", "C": "资本越扩张越不利于创造更多的物质财富", "D": "资本主义生产是一种历史的、过渡性的生产方式"}, "answer": "D", "explain": ""}, {"id": "y2021-5", "num": 5, "type": "single", "chapter": "", "stem": "毛泽东思想作为马克思主义中国化的第一个重大理论成果，是由一系列相互联系的重要理论观点所构成的完整的科学思想体系。这一科学思想体系所围绕的主题是", "options": {"A": "中国社会性质和阶级状况", "B": "中国革命和建设", "C": "中国命运和前途", "D": "中国改革和发展"}, "answer": "B", "explain": ""}, {"id": "y2021-6", "num": 6, "type": "single", "chapter": "", "stem": "构建新发展格局，是以习近平同志为核心的党中央积极应对国际国内形势变化、与时俱进提升我国经济发展水平、塑造国际经济合作和竞争新优势作出的战略抉择。这一新发展格局是", "options": {"A": "以国内大循环为主体、国内国际双循环相互促进", "B": "以体制机制创新为主体、利用好国际国内两个市场", "C": "以维护产业链、供应链稳定为主体、促进国内经济复苏", "D": "以发展先进制造业为主体、促进产业结构优化升级"}, "answer": "A", "explain": ""}, {"id": "y2021-7", "num": 7, "type": "single", "chapter": "", "stem": "改革开放以来，我们党总结正反两方面经验，确立了公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，社会主义市场经济体制等社会主义基本经济制度。在这一基本经济制度中，坚持公有制的主体地位，是因为", "options": {"A": "生产资料所有制决定社会的基本性质和发展方向", "B": "公有制是我国经济社会发展的重要基础", "C": "公有制经济是社会主义市场经济的重要组成部分", "D": "由生产资料所有制决定的分配方式能使一切社会成员实现全面发展"}, "answer": "A", "explain": ""}, {"id": "y2021-8", "num": 8, "type": "single", "chapter": "", "stem": "创新是引领发展的第一动力，必须把创新摆在我国现代化建设全局的核心地位。2020年9 月11日，习近平在《在科学家座谈会上的讲话》中指出，我国经济社会发展和民生改善比过去任何时候都更加需要增强创新这个第一动力，努力实现更多“从0到1”的突破。实现这一突破需要摆在更加突出位置的是", "options": {"A": "强化企业创新主体地位", "B": "加快推进引进消化吸收再创新", "C": "提升原始创新能力", "D": "改善科技创新生态"}, "answer": "C", "explain": ""}, {"id": "y2021-9", "num": 9, "type": "single", "chapter": "", "stem": "洋务运动时期，官督商办民用企业，基本上是", "options": {"A": "封建主义性质的企业", "B": "半封建性质的企业", "C": "资本主义性质的企业", "D": "社会性质的企业"}, "answer": "C", "explain": ""}, {"id": "y2021-10", "num": 10, "type": "single", "chapter": "", "stem": "中国人民抗日战争胜利的关键是", "options": {"A": "世界反法西斯力量的同情和支持", "B": "反侵略战争的正义性和进步性", "C": "民族意识的觉醒和全民族抗战", "D": "中国共产党的中流砥柱的作用"}, "answer": "D", "explain": ""}, {"id": "y2021-11", "num": 11, "type": "single", "chapter": "", "stem": "人民政协是中国共产党把马克思列宁主义统一战线理论、政党理论、民主政治理论同中国实际相结合的伟大成果，是中国共产党领导各民主党派、无党派人士、人民团体和各族各界人士在政治制度上进行的伟大创造。1949年9月21日，中国人民政治协商会议第一届全体会议在北平开幕。人民政协的召开，标志着中国", "options": {"A": "人民代表会议制度的确立", "B": "工农兵代表大会制度的确立", "C": "民族区域自治制度的确立", "D": "新型政党制度的确立"}, "answer": "D", "explain": ""}, {"id": "y2021-12", "num": 12, "type": "single", "chapter": "", "stem": "邓小平在谈到我国对资本主义工商业进行社会主义改造时说：“我国资本主义工商业社会主义改造的胜利完成，是我国和世界社会主义历史上最光辉的胜利之一。这个胜利的取得，是由于中国共产党领导全体工人阶级执行了毛泽东同志根据我国情况制定的马克思主义政策，同时，资本家阶级中的进步分子和大多数人在接受改造方面也起了有益的配合作用。”我国对资本主义工商业的社会主义改造执行的是", "options": {"A": "和平赎买的政策", "B": "调整巩固的政策", "C": "互助合作的政策", "D": "剥夺没收的政策"}, "answer": "A", "explain": ""}, {"id": "y2021-13", "num": 13, "type": "single", "chapter": "", "stem": "人是社会的人，每一个人都存在和活动于具体的、基于特定历史的现实社会当中。个人与社会是对立统一的关系，两者相互依存、相互制约、相互促进。个人与社会的关系最根本的是", "options": {"A": "个人价值与社会价值的关系", "B": "个人利益与社会利益的关系", "C": "个人理想与社会理想的关系", "D": "个人存在与社会存在的关系"}, "answer": "B", "explain": ""}, {"id": "y2021-14", "num": 14, "type": "single", "chapter": "", "stem": "中国特色社会主义进入新时代。为了大力弘扬爱国主义精神，中共中央、国务院印发了《新时代爱国主义教育实施纲要》，明确规定新时代爱国主义教育的着力点是", "options": {"A": "坚持维护祖国统一和民族团结", "B": "坚持依法治国和以德治国相结合", "C": "坚持实现中华民族伟大复兴的中国梦", "D": "坚持立足中国又面向世界"}, "answer": "A", "explain": ""}, {"id": "y2021-15", "num": 15, "type": "single", "chapter": "", "stem": "2020 年7 月31 日，中共中央总书记、国家主席、中央军委主席习近平出席北斗三号全球卫星导航系统建成暨开通仪式，宣布北斗三号全球卫星导航系统正式开通。北斗三号全球卫星导航系统建成并开通服务，标志着", "options": {"A": "世界所有国家都已使用我国北斗导航系统", "B": "我国成为世界上第三个独立拥有全球卫星导航系统的国家", "C": "我国卫星导航系统实现了零的突破", "D": "我国全球卫星导航系统建设实现了第二步目标"}, "answer": "B", "explain": ""}, {"id": "y2021-16", "num": 16, "type": "single", "chapter": "", "stem": "2020 年中国国际服务贸易交易会(服贸会)于9 月4 日至9 日在北京成功举办。作为新冠疫情发生以来我国在线下举办的第一场重大国际经贸活动。本届服贸会受到全球瞩目，具有非同寻常的重大意义，也为世界经济注入了中国动力。本届服贸会的主题是", "options": {"A": "齐心协力携手前行", "B": "全球服务互惠共享", "C": "文化融合创新发展", "D": "开放包容团结合作"}, "answer": "B", "explain": ""}, {"id": "y2021-17", "num": 17, "type": "multiple", "chapter": "", "stem": "最近，科学家利用字宙三维地图发现了迄今为止最大的字宙结构之一——包含了数十万个星系、长达14亿光年的“南极墙”。类似于“南极墙”的宇宙大尺度结构，是宇宙中一些密度较高的区域。中国科学家表示，由于万有引力，密度较高的区域会产生较强的引力，将周围物质吸引过来，逐渐形成了星系以及更大尺度的结构。现代宇宙学表明，宇宙是由暗物质、暗能量主导的，但暗物质究竟是什么，目前不得而知，在“南极墙”等宇宙大尺度结构中，很可能藏匿着大量的暗物质，这是研究宇宙演化历史的重要探针。“南极墙”的发现表明", "options": {"A": "整个物质世界的时间和空间是有限的", "B": "世界的本原是暗物质暗能量", "C": "未知世界与已知世界都是客观存在的", "D": "世界上只有尚未认识之物，没有不可认识之物"}, "answer": "CD", "explain": ""}, {"id": "y2021-18", "num": 18, "type": "multiple", "chapter": "", "stem": "人的身体是抗击病毒的“机器”。当病原体进入人体，人会发烧，升高的体温刺激免疫系统打败病毒。在理想的情况下，热量创造了一个环境，让病原体难以生存。科学家研究发现，随着自然界的温度不断升高，病原体生存的环境也在整体升温，在这种情况下，它们更加能够适应人体发烧的体温。一旦病原体适应更高的温度，人的免疫系统就无法发挥作用。人的免疫系统与自然环境之间的关系表明", "options": {"A": "自然环境对人类发展具有决定性作用", "B": "自然环境是人类生存和发展的重要前提", "C": "人类只能适应自然环境变化而不能改变自然环境", "D": "人类在受自然环境制约的同时也改变自然环境"}, "answer": "BD", "explain": ""}, {"id": "y2021-19", "num": 19, "type": "multiple", "chapter": "", "stem": "商品经济是一定社会历史条件的产物。商品经济得以产生的社会历史条件有", "options": {"A": "社会分工的出现及其存在", "B": "商品具有了使用价值与价值两个因素", "C": "生产资料和劳动产品属于不同的所有者", "D": "交换过程中形成了充当一般等价物的商品"}, "answer": "AC", "explain": ""}, {"id": "y2021-20", "num": 20, "type": "multiple", "chapter": "", "stem": "某服装厂为了实现更高的盈利，将原本依靠人工进行生产的流水线改造成了完全依靠机器进行生产的流水线。与此同时，由于受经济危机的影响，该服装厂从市场上采购的布料等生产原料价格也出现了大幅度的下降。在这种情况下，该服装厂资本构成会发生变化的是", "options": {"A": "资本积累构成", "B": "资本技术构成", "C": "资本有机构成", "D": "资本价值构成"}, "answer": "BCD", "explain": ""}, {"id": "y2021-21", "num": 21, "type": "multiple", "chapter": "", "stem": "1871 年爆发的巴黎公社革命，是无产阶级夺取政权的第一次伟大尝试。马克思、恩格斯深刻总结了巴黎公社的经验，高度评价了巴黎公社的意义。马克思、恩格斯总结的巴黎公社的经验主要有", "options": {"A": "必须打碎旧的国家机器，建立无产阶级的新型国家", "B": "无产阶级革命取得成功并保持胜利果实的首要条件是要有革命的武装", "C": "无产阶级政权是为人民服务的机关", "D": "必须建立无产阶级政党，发挥党的政治领导作用"}, "answer": "ABCD", "explain": ""}, {"id": "y2021-22", "num": 22, "type": "multiple", "chapter": "", "stem": "社会主义基本制度确立以后，如何在中国这样一个经济文化比较落后的东方大国建设和巩固社会主义，是党面临的一项崭新课题。为找到一条适合中国国情的社会主义建设道路，党带领人民进行了艰难曲折的初步探索。这一初步探索的意义主要体现在", "options": {"A": "丰富了科学社会主义的理论和实践", "B": "巩固和发展了我国的社会主义制度", "C": "实现了马克思主义中国化的第二次飞跃", "D": "为开创中国特色社会主义提供了宝贵经验、理论准备和物质基础"}, "answer": "ABD", "explain": ""}, {"id": "y2021-23", "num": 23, "type": "multiple", "chapter": "", "stem": "培育壮大发展新动能是促进经济增长、推动结构调整、实现高质量发展的重要支撑。2019年我国新产业、新业态、新商业模式经济增加值超过16万亿元，占GDP比重为16.3%;数字经济增加值规模达35.8万亿元，占GDP比重达36.2%。我国经济发展新动能的持续壮大表明", "options": {"A": "供给侧结构性改革取得了显著成效", "B": "数字经济已成为我国经济高质量发展的新引擎", "C": "创新驱动引领作用进一步增强", "D": "现代化经济体系已经形成"}, "answer": "ABC", "explain": ""}, {"id": "y2021-24", "num": 24, "type": "multiple", "chapter": "", "stem": "“十三五”时期，我国大气污染治理取得明显成效。来自生态环境部的数据显示，与2015年相比，2019年细颗粒物（PM2.5)未达标地级及以上城市年均浓度下降23.1%，全国337个地级及以上城市年均优良天数比例达到82%。2020年1月至8月，这一比例达到86.7% ，PM2.5浓度为31微克/立方米，同比下降11.4%，蓝天白云的好天气正在成为常态。我国大气污染治理取得明显成效，主要得益于", "options": {"A": "把突出环境问题作为生态文明建设的着力点", "B": "构建生态廊道和生物多样性保护网络", "C": "坚持全民共治、源头防治", "D": "不断完善生态环境保护制度和强化环保督察"}, "answer": "ABCD", "explain": ""}, {"id": "y2021-25", "num": 25, "type": "multiple", "chapter": "", "stem": "就业，一头牵着千万家庭，一头连着经济大势，是最大的民生工程，是社会稳定的重要保障。近五年，我国城镇新增就业累计超过6000万人。目前全国依托互联网平台就业约7800万人。在力促“好就业”“稳就业”的基础上，我国还不断在“就好业”方面下功夫，推动实现更高质量就业。我国提高就业质量的主要举措是", "options": {"A": "提供全方位公共就业服务", "B": "开展大规模职业技能培训、", "C": "构建和谐劳动关系", "D": "使失业率保持在合理区间"}, "answer": "ABC", "explain": ""}, {"id": "y2021-26", "num": 26, "type": "multiple", "chapter": "", "stem": "党的十八大以来，习近平总书记多次强调，要“促进各民族像石榴籽一样紧紧抱在一起”，这句话还被郑重写入党的十九大报告。“促进各民族像石榴籽一样紧紧抱在一起” 旨在", "options": {"A": "建设各民族共有精神家园", "B": "铸牢中华民族共同体意识", "C": "巩固和发展平等团结互助和谐的社会主义民族关系", "D": "使各民族在中华民族大家庭中手足相亲、守望相助"}, "answer": "ABCD", "explain": ""}, {"id": "y2021-27", "num": 27, "type": "multiple", "chapter": "", "stem": "1840 年，英国发动了鸦片战争，中国历史的发展从此发生重大转折。鸦片战争成为中国近代史的起点，这是因为，随着西方列强的入侵", "options": {"A": "中国开始落后于西方资本主文国家", "B": "中国的封建社会逐步变成了半殖民地半封建社会", "C": "中国人民逐渐开始了反帝反封建的资产阶级民主革命", "D": "无产阶级与资产阶级的矛盾上升为占支配地位的主要矛盾"}, "answer": "BC", "explain": ""}, {"id": "y2021-28", "num": 28, "type": "multiple", "chapter": "", "stem": "五四运动以后，社会主文思潮在中国蓬勃兴起，马克思主义开始在知识界得到传播。中国早期信仰马克思主义的人物，就类型而言，主要包括", "options": {"A": "五四运动的左翼骨干", "B": "五四以前的新文化运动的精神领袖", "C": "原中国同盟会会员、辛亥革命时期的活动家", "D": "工人群众中的活跃分子"}, "answer": "ABC", "explain": ""}, {"id": "y2021-29", "num": 29, "type": "multiple", "chapter": "", "stem": "中国从开始全面建设社会主义到1976 年，尽管经历过严重的曲折，但从总体上说，社会主义建设取得的成就是巨大的。这主要体现在", "options": {"A": "人民生活水平的提高与文化、教育、医疗、科技事业的发展", "B": "独立的、比较完整的工业体系和国民经济体系的建立", "C": "国际地位的提高与国际环境的改善", "D": "探索中形成的建设社会主义的若干重要原则"}, "answer": "ABCD", "explain": ""}, {"id": "y2021-30", "num": 30, "type": "multiple", "chapter": "", "stem": "2020 年颁布的《中华人民共和国民法典》是新中国第一部以法典命名的法律。这部法典共7 编1260 条，包括总则、物权、合同、人格权、婚姻家庭、继承、侵权责任以及附则，被称为“社会生活的百科全书”。它系统地整合了新中国成立70 多年来司法实践中形成的民事法律规范，汲取和借鉴了中外优秀法治文明建设的有益成果，是一部具有鲜明中国特色、实践特色、时代特色的民法典，开创了我国法典编纂立法的先河。编纂民法典的重大意义是", "options": {"A": "坚持和完善中国特色社会主义制度的现实需要", "B": "推进全面依法治国、推进国家治理体系和治理能力现代化的重大举措", "C": "坚持和完善社会主义基本经济制度、推动经济高质量发展的客观要求", "D": "增进人民福祉、维护最广大人民根本利益的必然要求"}, "answer": "ABCD", "explain": ""}, {"id": "y2021-31", "num": 31, "type": "multiple", "chapter": "", "stem": "法律权威是指法律在社会生活中的作用力、影响力和公信力，是法律应有的尊严和生命。法律是否具有权威取决于", "options": {"A": "法律本身的科学程度", "B": "法律在国家和社会治理体系中的地位和作用", "C": "法律在实践中的实施程度", "D": "法律被国际社会认可和尊崇的程度"}, "answer": "ABC", "explain": ""}, {"id": "y2021-32", "num": 32, "type": "multiple", "chapter": "", "stem": "2020 年6 月30 日，十三届全国人大常委会第二十次会议表决通过的《中华人民共和国香港特别行政区维护国家安全法》，是新形势下坚持和完善“一国两制”制度体系的标志性法律。其重大作用在于", "options": {"A": "确保国家主权在香港受到严格保护", "B": "弥补香港国安方面的立法缺失", "C": "有效应对各种反中乱港势力", "D": "保障香港长治久安和长期繁荣稳定"}, "answer": "ABCD", "explain": ""}, {"id": "y2021-33", "num": 33, "type": "multiple", "chapter": "", "stem": "2020 年11 月15 日，东盟10 国与中国、日本、韩国、澳大利亚和新西兰正式签署《区域全面经济伙伴关系协定》(RCEP)，全球最大自贸区诞生。其重要意义主要体现在", "options": {"A": "开启了区域经济一体化新篇章", "B": "全球贸易投资自由化、便利化取得压倒性优势", "C": "将为区域乃至全球经济复苏注入新动能", "D": "将更好地发挥中国作为亚太地区价值链中心节点的作用"}, "answer": "ACD", "explain": ""}]}, {"id": "y2022", "title": "2022年真题", "questions": [{"id": "y2022-1", "num": 1, "type": "single", "chapter": "", "stem": "中国共产党坚持马克思上义基本原理，坚持实事求是，从中国实际出发，洞察时代大势，把握历中主动，进行艰辛探索，不推进马克思主义中国化时代化，指导人民不断推进伟大社会革命。习近平总书记指出，“中国共产党为什么能，由特色社会主义为什么好，归根到底是因为马克思主义行!\"马克思主义之所以根本原因在于", "options": {"A": "马克思主义具有鲜明的政治立场", "B": "马克思主义具有自觉的历史担当", "C": "马克思主义是科学的世界观和方法论", "D": "马克思主义是无产阶级政党自我革命的武器"}, "answer": "C", "explain": ""}, {"id": "y2022-2", "num": 2, "type": "single", "chapter": "", "stem": "党的十八大以来，我国从中西部22 个省份有劳动能力的建档立卡贫困人口中选聘了110.2 万名生态护林员，走出了一条生态补偿脱贫的新路子，实现了生态保护和脱贫增收“双赢”，充分体现了“人不负青山，青山定不负人”的深刻哲理。“人不负青山，青山定不负人”表明", "options": {"A": "人与自然是同一的，自然能够自发满足人的要求", "B": "生产力包括自然要素，合理开发自然能促进社会发展", "C": "人是自然的一部分，人的发展只能适应自然的变化", "D": "人能动改造自然，白然能动补人的劳动"}, "answer": "B", "explain": ""}, {"id": "y2022-3", "num": 3, "type": "single", "chapter": "", "stem": "马克思在《资本论》中指出：“一个商品占有者出售他现有的商品，而另一个商品占有者却只是作为货币的代表或作为未来货币的代表来购买这种商品。卖者成为债权人，买者成为债务人。由于商品的形态变化或商品的价值形式的发展在这里起了变化，货币也就取得了另一种职能”。这里所论述的货币“另一种职能”指的是", "options": {"A": "价值尺度", "B": "流通手段", "C": "贮藏手段", "D": "支付手段"}, "answer": "D", "explain": ""}, {"id": "y2022-4", "num": 4, "type": "single", "chapter": "", "stem": "当代资本社会，大公司经营活动的主要控制者是", "options": {"A": "高级职业经理", "B": "股东大会", "C": "监事会", "D": "董事长"}, "answer": "A", "explain": ""}, {"id": "y2022-5", "num": 5, "type": "single", "chapter": "", "stem": "共同富裕是社会主义的本质要求，是中国式现代化的重要特征。党的十九届五中全会对扎实推动共同富裕作出重大战略部署，明确指出了推进共同富裕的2035年远景目标。这一目标是", "options": {"A": "全体人民共同富裕基本实现", "B": "全体人民共同富裕取得更为明显的实质性进展", "C": "全体人民共同富裕全面实现", "D": "全体人民共同富裕同步实现"}, "answer": "B", "explain": ""}, {"id": "y2022-6", "num": 6, "type": "single", "chapter": "", "stem": "新发展格局是经济现代化的路径选择，是关系我国发展全局的重大战略任务，立足新发展阶段，贯彻新发展理念，要致力于构建以国内大循环为主体，国内国际双循环相互促进的新发展格局。构建新发展格局的关键在于", "options": {"A": "经济循环的畅通无阻", "B": "市场主体的活力", "C": "高水平的自立自强", "D": "产业链供应链的优化升级"}, "answer": "A", "explain": ""}, {"id": "y2022-7", "num": 7, "type": "single", "chapter": "", "stem": "解决好“三农”问题始终是全党工作的重中之重。新时代脱贫攻坚目标任务完成以后，“三农”工作重心将历史性地转向全面推进乡村振兴。2021 年的中央一号文件对全面推进乡村振兴，加快农业农村现代化作了进一步的部署。根据这一部署，“十四五”时期“三农”工作摆在首要位置的是", "options": {"A": "依托乡村特色优势资源，打造农业全产业链", "B": "扩大农村需求，畅通城乡经济循环", "C": "补齐农业农村短板弱项，推动城乡协调发展", "D": "巩固拓展脱贫攻坚成果，守住防止规模性返贫底线"}, "answer": "D", "explain": ""}, {"id": "y2022-8", "num": 8, "type": "single", "chapter": "", "stem": "文化软实力集中体现了一个国家基于文化而具有的凝聚力和生命力，以及由此产生的吸引力和影响力。提高国家文化软实力需要强大的国际传播能力。我国加强国际传播能力建设的重要任务是", "options": {"A": "加快发展新型文化业态", "B": "推进中华传统文化创造性转化、创新性发展", "C": "推进社会主义先进文化深入人心，激发全民族文化创造活力", "D": "讲好中国故事，传播好中国声音，展示真实、立体、全面的中国"}, "answer": "D", "explain": ""}, {"id": "y2022-9", "num": 9, "type": "single", "chapter": "", "stem": "戊成维新运动是一次爱国救亡运动，也是一次资产阶级性质的政治改良运动。维新派尽管不敢从根本上否定封建主义，但突破了洋务派“中体西用”思想的局限，主张", "options": {"A": "用君主立宪制取代君主专制制度", "B": "用民主共和制度取代封建专制制度", "C": "用总统共和制取代君主立宪制", "D": "用议会共和制取代君主立宪制"}, "answer": "A", "explain": ""}, {"id": "y2022-10", "num": 10, "type": "single", "chapter": "", "stem": "大革命失败后，要不要坚持革命?如何坚持革命?这是摆在中国共产党面前的两个带根本性的问题。党从残酷的现实中认识到，没有革命的武装就无法战胜武装的反革命，就无法夺取中国革命胜利，就无法改变中国人民和中华民族的命运，必须以武装的革命反对武装的反革命。南昌起义打响了武装反抗国民党反动派的第一枪， 这是中国共产党", "options": {"A": "实施土地革命和武装起义方针的开始", "B": "建设无产阶级领导的新型人民军队的开端", "C": "实行工农武装割据的开始", "D": "独立领导革命战争、创建人民军队和武装夺取政权的开端"}, "answer": "D", "explain": ""}, {"id": "y2022-11", "num": 11, "type": "single", "chapter": "", "stem": "1949 年3 月23 日上午，中共中央离开西拍坡向北平进发。临行前，毛泽东把进北平比作“进京赶考”，说“我们决不当李自成，我们都希望考个好成绩。3 月25 日，毛泽东等中共中央领导人与中央机关、人民解放军总部进驻北平香山，标志着", "options": {"A": "旧民主主义革命向新民主主义革命转变", "B": "新民主主义社会开始向社会主义社会过渡", "C": "中国革命重心从农村转向城市", "D": "民族民主革命任务的完成"}, "answer": "C", "explain": ""}, {"id": "y2022-12", "num": 12, "type": "single", "chapter": "", "stem": "1956 年4 月，毛泽东提出把马克思列宁主义基本原理同中国具体实际进行“第二次结合”，其目的是", "options": {"A": "加强中国共产党的自身建设", "B": "为社会主义改造创造条件", "C": "找出在中国怎样建设社会主义的道路", "D": "全面建设社会主义现代化强国"}, "answer": "C", "explain": ""}, {"id": "y2022-13", "num": 13, "type": "single", "chapter": "", "stem": "中华传统美德是中华优秀文化的重要组成部分，其内容博大精深、源远流长。从《诗经》中的“夙夜在公”到《尚书》中的“以公灭私”，从西汉贾谊《治安策》中的“国而忘家，公而忘私”到宋代范仲淹《岳阳楼记》中的“先天下之忧而忧，后天下之乐而乐”，再到清代林则徐的“苟利国家生死以，岂因祸福避趋之”，贯穿其中的传统美德是", "options": {"A": "强调知行合一，注重躬行实践", "B": "推崇“仁爱”原则，注重以和为贵", "C": "重视整体利益，强调责任奉献", "D": "提倡人伦价值，重视道德义务"}, "answer": "C", "explain": ""}, {"id": "y2022-14", "num": 14, "type": "single", "chapter": "", "stem": "法律作为上层建筑的重要组成部分，不是凭空产生的，也不是永恒存在的，是由一定的社会物质生活条件所决定的。决定法律本质、内容和发展方向的根本因素是", "options": {"A": "地理环境", "B": "物质资料的生产方式", "C": "人口素质", "D": "统治阶级的意志"}, "answer": "B", "explain": ""}, {"id": "y2022-15", "num": 15, "type": "single", "chapter": "", "stem": "2021 年9 月27 日至28 日，中央人才工作会议在北京举行。中共中央总书记、国家主席，中央军委主席习近平出席会议并发表重要讲话，强调要坚持党管人才，坚持面向世界科技前沿、面向经济主战场、面向国家重大需求、面向人民生命健康，深入实施新时代人才强国战略，全方位培养、引进、用好人才，加快建设", "options": {"A": "世界重要人才中心和创新高地", "B": "北京、上海、粤港澳大湾区高水平人才高地", "C": "一批国家实验室和新型研发机构", "D": "中心城市吸引和聚集人才的平台"}, "answer": "A", "explain": ""}, {"id": "y2022-16", "num": 16, "type": "single", "chapter": "", "stem": "《中华人民共和国反外国制裁法》于2021 年6 月10 日起施行。这是一部指向性、针对性颇强的专门法律，共有16 条。这部法律主要针对的是", "options": {"A": "西方某些大国近年来对我国的“贸易战”", "B": "少数国家操纵国际组织挑起的“货币战”", "C": "资本主义大国对社会主义国家的“新冷战\"", "D": "外国干涉中国内政的所谓“单边制裁”"}, "answer": "D", "explain": ""}, {"id": "y2022-17", "num": 17, "type": "multiple", "chapter": "", "stem": "在深入推动黄河流域生态保护和高质量发展座谈会上，习近平总书记谈及水资源和发展的关系时，以传统名吃“羊肉泡馍”作形象比喻，强调要全方位贯彻“四水四定”(以水定城、以水定地、以水定人、以水定产)原则，精打细算用好水资源，“有多少汤泡多少馍\"，让水资源用在最该用的地方。“有多少汤泡多少馍\"蕴含的哲学道理是", "options": {"A": "创造条件，充分发挥意识能动性", "B": "一切从实际出发，实事求是", "C": "因地制宜，因时制宜", "D": "尊重规律，把握适度原则"}, "answer": "BCD", "explain": ""}, {"id": "y2022-18", "num": 18, "type": "multiple", "chapter": "", "stem": "人类历史上的每一次科技革命都与材料的发展息息相关，而新材料的研制却是颇为不易的。人工智能可以借助数据共享，对先进材料的物理化学性质进行预测筛选，从而加快新材料的合成和生产。作为人工智能的一个分支，机器学习算法在辅助新材料设计时尤为“得力”，其工作过程主要包括“描述符”生成、模型构建和验证、材料预测、实验验证等步骤。人工智能辅助新材料研发的过程表明", "options": {"A": "科学研究能够任意改变物质的性质和结构", "B": "人工智能能够取代人类对物质世界的认识", "C": "人类对于物质的认识是一个不断深化的过程", "D": "具体的物质结构和性质的变化并不改变世界的物质性"}, "answer": "CD", "explain": ""}, {"id": "y2022-19", "num": 19, "type": "multiple", "chapter": "", "stem": "时间是万事万物存在的刻度。1 秒钟，电影放映24 帧画面，猎豹在草原上飞奔28 米，蜂鸟振动翅膀55 次： 1 分钟，登山队员攀登珠峰顶峰58.3 厘米，“复兴号”前进5833 米。时间创造无限可能。有人努力奔跑，用全力以赴的冲刺突破极限;有人砥砺前行，以日复一日的坚守辛勤耕耘。原本匀速流动的时间，正是在生生不息的奋斗中，在昂扬奋发的进取中，确定意义、体现价值，进而定义生命的精彩、定格历史的脉动。人们在奋斗中“定义\"时间，说明时间是", "options": {"A": "测量事物运动的客观尺度", "B": "物质运动的存在形式", "C": "事物运动的主观联想", "D": "与物质运动不可分割的"}, "answer": "ABD", "explain": ""}, {"id": "y2022-20", "num": 20, "type": "multiple", "chapter": "", "stem": "如今，“逆袭”“超燃”“躺平”“凡尔赛”YYDS\"等网络热词令人目不暇接，了解这些网络话的意思用法，几乎成了网上冲浪的必修课。嵌入日常生活交流的网络热词，为语言的发展带来新语料，也能够让人们一窥当下的社会生活和社会心态。网络热词流行的现象表明", "options": {"A": "社会心态是社会生产和生活的反映", "B": "社会意识随着社会存在的发展而变化", "C": "社会意识是主体对社会生活的自发反映", "D": "社会心态的差异性决定社会生活的多样性"}, "answer": "AB", "explain": ""}, {"id": "y2022-21", "num": 21, "type": "multiple", "chapter": "", "stem": "马克思、恩格斯在(共产党宣言》中指出：“资产阶级在它的不到一百年的阶级统治中所创造的生产力，比过去一切世代创造的全部生产力还要多，还要大。自然力的征服，机器的采用，化学在工业和农业中的应用，轮船的行驶，铁路的通行，电报的使用，整个整个大陆的开垦，河川的通航，仿佛用法术从地下呼唤出来的大量人口一一过去哪一个世纪料想到在社会劳动里蕴藏有这样的生产力呢?”资本主义社会生产力迅速发展的主要原因是", "options": {"A": "资本追逐剩余价值的内在动力", "B": "市场激烈竞争的外在压力", "C": "无产阶级反对资产阶级的斗争", "D": "资本主义国家对市场的全面控制"}, "answer": "AB", "explain": ""}, {"id": "y2022-22", "num": 22, "type": "multiple", "chapter": "", "stem": "发展数字经济是把握新一轮科技革命和产业变革新机遇的战略选择。据2021 年8 月2 日中国信息通信研究院发布的《全球数字经济白皮书》统计显示，2020 年我国数字经济规模近5.4 万亿美元，居世界第二位：同比增长9.6%，增速位于全球第一。我国数字经济健康发展有利于", "options": {"A": "推动建设现代化经济体系", "B": "推动构建新发展格局", "C": "推动化解发展中的根本制约因素", "D": "推动构筑国家竞争新优势"}, "answer": "ABD", "explain": ""}, {"id": "y2022-23", "num": 23, "type": "multiple", "chapter": "", "stem": "2021 年是中国加入世界贸易组织20 周年。20 年来，中国经济总量从世界第六位上升到第二位，货物贸易从世界第六位上升到第一位，服务贸易从世界第十一位上升到第二位，利用外资稳居发展中国家首位，对外直接投资从世界第二十六位上升到第一位。目前，中国已成为50 多个国家和地区的最大贸易伙伴、120 多个国家和地区的前三大贸易伙伴。中国入世20 年的历史充分证明", "options": {"A": "我国经济已经实现了由高速增长向高质量发展转变", "B": "以开放促改革、促发展是我国现代化建设的重要法宝", "C": "坚持开放合作才能获得更多发展机遇和更大发展空间", "D": "我国是多边贸易体制的坚定支持者、积极参与者和重要贡献者"}, "answer": "BCD", "explain": ""}, {"id": "y2022-24", "num": 24, "type": "multiple", "chapter": "", "stem": "中国共产党自成立以来不断探索和发展适合中国国情的民主道路，使人民民主在东方大国落地生根、繁荣发展。党的十八大以来，我们党不断深化对民主政治发展规律的认识，践行以人民为中心的发展思想，积极发展全过程人民民主。全过程人民民主", "options": {"A": "是完整制度程序和完整参与实践有机统一的民主", "B": "是全链条、全方位、全覆盖的民主", "C": "是最广泛、最真实、最管用的社会主义民主", "D": "实现了过程民主和成果民主、程序民主和实质民主、直接民主和间接民主、人民民主和国家意志相统一"}, "answer": "ABCD", "explain": ""}, {"id": "y2022-25", "num": 25, "type": "multiple", "chapter": "", "stem": "生态文明的核心是坚持人与自然和谐共生。2021 年4 月，一群栖息在云南西双版纳国家级自然保护区的野生亚洲象，一路向北到达昆明，走过稻田、穿过城镇，历时110 多天，行进1000 多公里。8 月上旬，北移的15 头亚洲象全部安全南返。亚洲象群的迁移引起国内外和社会各界广泛关注。习近平主席在《生物多样性公约》第十五次缔约方大会领导人峰会上的主旨讲话中特别指出：“云南大象的北上及返回之旅，让我们看到了中国保护野生动物的成果。”中国政府一贯高度重视生物多样性保护，不断加强和创新生物多样性保护举措。这些举措主要有", "options": {"A": "划定生态保护红线", "B": "加大自然资源的开发利用", "C": "建立生物安全风险防控和治理体系", "D": "构建以国家公园为主体的自然保护地体系"}, "answer": "ACD", "explain": ""}, {"id": "y2022-26", "num": 26, "type": "multiple", "chapter": "", "stem": "人类各种文明之间的交流是推动世界和平发展的重要动力。习近平主席曾经在比利时布鲁日欧洲学院演讲时指出：“我们要建设文明共荣之桥，把中欧两大文明连接起来。......正如中国人喜欢茶而比利时人喜爱啤酒一样，茶的含蓄内敛和酒的热烈奔放代表了品味生命、解读世界的两种不同方式。但是，茶和清并不是不可兼容的，既可以酒逢知己千杯少，也可以品茶品味品人生。”习近平主席以茶酒巧喻不同文明之间的关系，旨在阐明", "options": {"A": "人类文明多样性是世界的基本特征", "B": "文明因多样而交流，因交流而互鉴，因互鉴而发展", "C": "不同文明凝聚着不同民族的智慧和贡献，没有高低优劣之分", "D": "文明差异不应成为世界冲突的根源，而应成为人类文明进步的动力"}, "answer": "ABCD", "explain": ""}, {"id": "y2022-27", "num": 27, "type": "multiple", "chapter": "", "stem": "1935 年1 月中共中央政治局在长征途中召开的遵义会议，是党的历史上一个生死攸关的转折点。这次会议（）", "options": {"A": "全面讨论了政治路线的是非问题", "B": "解决了当时党内所面临的迫切的组织问题和军事问题", "C": "结束了“左“倾教条主义错误在党中央的统治地位", "D": "开始确立以毛泽东在中共中央和红军的领导地位"}, "answer": "BCD", "explain": ""}, {"id": "y2022-28", "num": 28, "type": "multiple", "chapter": "", "stem": "1981 年6 月党的十一届六中全会通过的《关于建党以来党的若干历史问题的决议》，科学评价了毛泽东和毛泽东思想的历史地位，把毛泽东思想活的灵魂概括为（）", "options": {"A": "群众路线", "B": "独立自主", "C": "武装斗争", "D": "实事求是"}, "answer": "ABD", "explain": ""}, {"id": "y2022-29", "num": 29, "type": "multiple", "chapter": "", "stem": "2013 年11 月，党的十八届三中全会在北京举行。全会审议通过的《中共中央关于全面深化改革若干重大问题的决定》，对全面深化改革作出项层设计和总体规划。《中共中央关于党的百年奋斗重大成就和历史经验的决议》指出，党的十一届三中全会是划时代的，党的十八届三中全会也是划时代的。党的十八届三中全会之所以也是划时代的，是因为这次全会（）", "options": {"A": "实现改革由局部探索、破冰突围到系统集成、全面深化的转变", "B": "开启了改革开放和社会主义现代化建设新时期", "C": "开创了我国改革开放新局面", "D": "确定建立社会主义市场经济体制"}, "answer": "AC", "explain": ""}, {"id": "y2022-30", "num": 30, "type": "multiple", "chapter": "", "stem": "2020 年我国颁布的民法典具有鲜明道德导向。如第7 条“民事主体从事民事活动，应当遵循诚信原则，乘持诚实，恪守承诺。”第8 条“民事主体从事民事活动，不得违反法律，不得违背公序良俗。”第184 条“因自愿实施紧急救助行为造成受助人损害的，救助人不承担民事责任。”法律对道德的导向主要表现为（）", "options": {"A": "法律助推个人品德养成", "B": "法律决定道德传承的效果", "C": "法律助推社会公德水平提升", "D": "法律为弘扬美德提供保障"}, "answer": "ACD", "explain": ""}, {"id": "y2022-31", "num": 31, "type": "multiple", "chapter": "", "stem": "习近平法治思想是全面依法治国的根本遵循和行动指南。2020 年11 月，习近平在中央全面依法治国工作会议上，用“十一个坚持”对全面依法治国进行了系统阐释、部署，从全面依法治国的政治方向、战略地位、工作布局、主要任务、重大关系、重要保障等方面提出了一系列新理念新观点新论断。其中关于全面依法治国政治方向的是（）", "options": {"A": "坚持党对全面依法治国的领导", "B": "坚持以人民为中心", "C": "坚持中国特色社会主义法治道路", "D": "坚持统筹推进国内法制和涉外法治"}, "answer": "ABC", "explain": ""}, {"id": "y2022-32", "num": 32, "type": "multiple", "chapter": "", "stem": "2021 年5 月15 日7 时18 分，天向一号探测器成功着陆于火星乌托邦平原南部预选着陆区，我国首次火星探测任务着陆火星取得成功。其重要意义表现在（）", "options": {"A": "我国在行星探测领域进入世界先进行列", "B": "我国首次自主执行了火星探测任务", "C": "为探索宇宙奥秘、增进对火星演化的认知、了解生命起源作出了中国贡献", "D": "我航天事业发展取得了又一具有里程碑意义的进展"}, "answer": "ABCD", "explain": ""}, {"id": "y2022-33", "num": 33, "type": "multiple", "chapter": "", "stem": "2021 年11 月16 日，中国国家主席习近平同美国总统拜登举行视频会晤，双方就事关中美关系发展的战略性、全局性、根本性问题以及共同关心的其他重要问题进行了充分、深入的沟通和交流。习近平强调，新时期中美相处应该坚持的原则是（）", "options": {"A": "相互尊重", "B": "和平共处", "C": "合作共赢", "D": "结伴不结盟"}, "answer": "ABC", "explain": ""}]}, {"id": "y2023", "title": "2023年真题", "questions": [{"id": "y2023-1", "num": 1, "type": "single", "chapter": "", "stem": "习近平主席在为《复兴文库》所写的序言中指出：“修史立典，存史启智，以文化人是中华民族延续几千年的一个传统，编纂《复兴文库》大型历史文献丛书，重点就是要通过对近代以来重要思想文献的选编，述录先人的开拓，启迪来者的奋斗。历史是最好的教科书，一切向前走，都不能忘记走过的路。走的再远，走向再辉煌的未来，也不能忘记走过的过去。”这说明（）", "options": {"A": "历史、现实、未来是共通的", "B": "一切历史就是现代史", "C": "历史过程不存在任何偶然的因素", "D": "历史事件往往可以完整重复和再现"}, "answer": "A", "explain": ""}, {"id": "y2023-2", "num": 2, "type": "single", "chapter": "", "stem": "社会形态是关于社会运动的具体形式，发展阶段和不同质态的范畴，是同生产力发展一定阶段相适应的经济基础和上层建筑的统一体。人类历史社会划分为原始社会、奴隶社会、封建社会、资本主义社会、共产主义社会（社会主义社会是其第一阶段）五种社会形态，其依据是（）", "options": {"A": "生产工具的质量和数量", "B": "统治集团的阶级和政治属性", "C": "经济基础特别是生产关系的性质", "D": "人们社会交往的分工范围和水平"}, "answer": "C", "explain": ""}, {"id": "y2023-3", "num": 3, "type": "single", "chapter": "", "stem": "马克思在《资本论》中提出：“不管生产力如何变化，同一劳动在同样的时间内提供的价值量总是相同的，但在同样的时间内提供的使用价值量是不同的，生产力提高就多一些，生产力降低就少一些。”这说明生产力变化（）", "options": {"A": "不影响同一劳动在同样的时间内生产的产品数量", "B": "不改变同一劳动在同样的时间内的生产效率", "C": "影响同一劳动在同样的时间内生产的单个产品价值量", "D": "改变同一劳动在同样的时间内产生的价值总量"}, "answer": "C", "explain": ""}, {"id": "y2023-4", "num": 4, "type": "single", "chapter": "", "stem": "垄断组织依靠制定垄断制度获取垄断利润。在市场交易过程中，垄断利润高低受多重因素影响。为了不遭受净亏损，垄断组织能接受的最低价格是（）", "options": {"A": "成本价格", "B": "生产价格", "C": "垄断低价", "D": "垄断高价"}, "answer": "B", "explain": ""}, {"id": "y2023-5", "num": 5, "type": "single", "chapter": "", "stem": "“什么是社会主义、如何建设社会主义”是邓小平在领导改革开放和现代化建设过程中，多次提出和反复思考的基本理论问题。搞清楚这一基本理论问题，关键是要（）", "options": {"A": "科学分析我国社会的主要矛盾", "B": "廓清不适应时代进步和社会发展规律的模糊观念", "C": "系统总结社会主义社会发展的概念", "D": "坚持社会主义基本制度基础上认清社会主义本质"}, "answer": "D", "explain": ""}, {"id": "y2023-6", "num": 6, "type": "single", "chapter": "", "stem": "共同富裕是中国特色社会主义的本质要求，分配制度是促进共同富裕的基础性制度。坚持按劳分配为主体，多种所有分配方式并存，构建初次分配、再分配、第三次分配协调配套的制度体系，对于处理效率与公平关系，逐步缩小收入差距具有非常重要的意义。在这一制度体系中，除了健全完善初次分配、再分配机制外，还要重视发挥第三次分配的作用，当前，要发挥好第三次分配的作用需要做的是（）", "options": {"A": "提高劳动报酬在分配中的比重", "B": "加大税收、社保、转移支付等的调节力度", "C": "引导、支持有意愿的有能力的企业、社会组织和个人参与公益慈善事业", "D": "健全劳动、资本、土地等生产要素按贡献决定报酬机制"}, "answer": "C", "explain": ""}, {"id": "y2023-7", "num": 7, "type": "single", "chapter": "", "stem": "坚持总体国家安全观，必须坚持国家利益至上，以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、科技、文化、社会安全为保障，以促进国际安全为依托，统筹外部安全与内部安全、国家安全和国民安全、传统安全和非传统安全、自身安全和共同安全，统筹维护国家安全和塑造国家安全。坚持总体国家安全观，归根到底是为了（）", "options": {"A": "顺应世界变化发展的新趋势", "B": "增强全民国家安全意识", "C": "破解我国国家安全面临的难题", "D": "确保中华民族伟大复兴进程不被停滞甚至中断"}, "answer": "D", "explain": ""}, {"id": "y2023-8", "num": 8, "type": "single", "chapter": "", "stem": "作为一个无产阶级政党，如何永远得到人民拥护和支持，如何跳出治乱兴衰的历史周期律，实现长期执政，是中国共产党必须回答好、解决好的根本性问题。对于这一历史之问、时代之问，毛泽东同志在延安窑洞里给出了第一个答案：“只有让人民来监督政府，政府才能不松懈；只有人人起来负责，才不会人亡政息。”经过党的十八大以来的不懈努力，我们党找到了第二个答案，那就是（）", "options": {"A": "坚定理想", "B": "自我革命", "C": "把权力关进制度的笼子", "D": "增强忧患意识"}, "answer": "B", "explain": ""}, {"id": "y2023-9", "num": 9, "type": "single", "chapter": "", "stem": "中国是一个文明古国，为人类文明作出了不可磨灭的贡献。经过了工业革命，到19世纪中叶，西方资本主义强国经济和技术飞速发展。中国错失了工业革命的机遇，大幅落后时代。导致中国落后于时代的原因是（）", "options": {"A": "中国的封建统治者夜郎自大、闭关锁国", "B": "资本—帝国主义国家对华进行资本输出", "C": "中国社会的阶级关系发生了深刻变动", "D": "中国被纳入世界资本主义体系"}, "answer": "A", "explain": ""}, {"id": "y2023-10", "num": 10, "type": "single", "chapter": "", "stem": "大革命失败后，白色恐怖笼罩全国。在生死考验面前，中国共产党人坚持革命的理想信念，表现出大无畏的英雄气概。为了挽救革命，1927年8月7日，中共中央在汉口召开紧急会议，史称“八七会议”。这次会议（）", "options": {"A": "批评了大革命后期存在的“左”倾错误", "B": "阐明了党的工作重心由城市转移到乡村的必要性", "C": "提出了组织湘、鄂、粤、赣四省农民秋收暴动", "D": "确定了土地革命和武装起义的方针"}, "answer": "D", "explain": ""}, {"id": "y2023-11", "num": 11, "type": "single", "chapter": "", "stem": "延安是中国革命的圣地。从1935年到1948年，党中央和毛泽东倡导老一辈革命家在延安生活和战斗了13年，领导中国革命事业从低潮走向高潮，实现历史性转折，扭转了中国前途命运。2022年10月27日，习近平总书记带领中共中央政治局常委专程从北京前往延安，瞻仰延安革命纪念地，宣示新一届中央领导集体将继承和发扬延安时期形成的优良革命传统和作风。延安精神所体现的党的宗旨是（）", "options": {"A": "全心全意为人民服务", "B": "坚定正确的政治方向", "C": "解放思想实事求是", "D": "自力更生艰苦奋斗"}, "answer": "A", "explain": ""}, {"id": "y2023-12", "num": 12, "type": "single", "chapter": "", "stem": "社会主义革命和建设时期，党面临的主要任务是，实现从新民主主义到社会主义的转变，进行社会主义革命，推进社会主义建设，为实现中华民族伟大复兴奠定根本政治前提和制定基础。中国进入社会主义社会最主要的标志是（）", "options": {"A": "社会主义政治制度的确立", "B": "社会主义经济制度的确立", "C": "民主革命遗留任务的完成", "D": "人民民主专政国家政权的建立"}, "answer": "B", "explain": ""}, {"id": "y2023-13", "num": 13, "type": "single", "chapter": "", "stem": "公民道德建设对于提高人民思想觉悟、道德水平、文明素养、提高全社会文明程度，具有至关重要的作用。适应新时代新要求，党中央根据变化了的形势和公民道德建设的新需要，于2019年颁布了《新时代公民道德建设实施纲要》，明确强调新时代公民道德建设的着力点是（）", "options": {"A": "弘扬民族精神和时代精神", "B": "推动理想信念教育常态化、制度化", "C": "推进社会公德、职业道德、家庭美德、个人品德建设", "D": "传承孝老爱亲、扶危济困、见义勇为等中华美德"}, "answer": "C", "explain": ""}, {"id": "y2023-14", "num": 14, "type": "single", "chapter": "", "stem": "党的二十大报告指出：“我们要坚持走中国特色社会主义法治道路，建设中国特色社会主义法治体系，建设社会主义法治国家，围绕保障和促进社会公平正义，坚持依法治国、依法执政、依法行政共同推进，坚持法治国家、法治政府、法治社会一体建设，全面推进科学立法、严格执法、公正司法、全民守法，全面推进国家各方面工作法治化。”坚持全面依法治国首先要（）", "options": {"A": "坚持依宪治国", "B": "坚持依法行政", "C": "坚持依法执政", "D": "坚持公正司法"}, "answer": "A", "explain": ""}, {"id": "y2023-15", "num": 15, "type": "single", "chapter": "", "stem": "2022年4月8日，北京冬奥会、冬残奥会总结表彰大会在北京举行，习近平总书记强调，伟大事业孕育伟大精神，伟大精神推进伟大事业，我国广大参与者珍惜伟大时代赋予的机遇，在冬奥申办、筹办、举办的过程中共同创造了北京冬奥精神。北京冬奥精神是（）", "options": {"A": "更快、更高、更强、更团结", "B": "胸怀大局、自信开放、迎难而上、追求卓越、共创未来", "C": "勇气、决心、激励、平等", "D": "一起向未来"}, "answer": "B", "explain": ""}, {"id": "y2023-16", "num": 16, "type": "single", "chapter": "", "stem": "2022年11月11日，第二十五次中国—东盟领导人会议在柬埔寨首都金边举行，发表了中国和东盟国家就南海问题达成的又一份重要文件，这份文件是（）", "options": {"A": "《中国和东盟国家外交部长关于全面有效落实〈南海各方行为宣言〉的联合声明》", "B": "《落实〈南海各方行为宣言〉指导方针》", "C": "《纪念〈南海各方行为宣言〉签署十周年联合声明》", "D": "《纪念〈南海各方行为宣言〉签署二十周年联合声明》"}, "answer": "D", "explain": ""}, {"id": "y2023-17", "num": 17, "type": "multiple", "chapter": "", "stem": "马克思、恩格斯在领导无产阶级斗争的实践中，始终强调领袖权威的必要性和重要性。马克思说过，一个单独的提琴手自己指挥自己，一个乐队就需要一个乐队指挥。恩格斯也指出，“没有权威就不可能有任何的一致行动”，并以大海航行的例子说明权威的重要性。在总结巴黎公社失败的经验教训时，马克思深刻指出，革命胜利后组织新政权、维护新政权、建设新政权都需要权威。恩格斯则明确指出，巴黎公社遭到灭亡，就是由于缺乏集中和权威。这表明，无产阶级领袖在历史上能够（）", "options": {"A": "引领社会发展的方向", "B": "影响历史事件的进程", "C": "凝聚人民群众的力量", "D": "创造人类社会的历史"}, "answer": "ABC", "explain": ""}, {"id": "y2023-18", "num": 18, "type": "multiple", "chapter": "", "stem": "苏轼在《题西林壁》中写道“横看成岭侧成峰，远近高低各不同”。人们之所以对同一个事物会有横侧、远近、高低等评价差异，是因为（）", "options": {"A": "评价客体没有自身固有的本质与特性", "B": "评价过程与评价主体有着直接的关系", "C": "评价没有正确与错误、善恶的区别", "D": "评价结果随着客体的相互关系而改变"}, "answer": "BD", "explain": ""}, {"id": "y2023-19", "num": 19, "type": "multiple", "chapter": "", "stem": "马克思的平均利润理论深刻阐明了资本主义社会利润转换为平均利润以及剩余价值被进一步分割的原理。在利润率平均化的过程中，仍然能获得平均利润的资本有（）", "options": {"A": "产业资本", "B": "农业资本", "C": "商业资本", "D": "借贷资本"}, "answer": "ABC", "explain": ""}, {"id": "y2023-20", "num": 20, "type": "multiple", "chapter": "", "stem": "自20世纪70年代由美国主导的布雷顿森林体系崩溃以来，资本主义国家的金融垄断资本获得了快速发展。金融垄断得以形成和壮大的重要制度条件是（）", "options": {"A": "金融创新", "B": "金融市场监管加强", "C": "金融自由化", "D": "金融危机频繁发生"}, "answer": "AC", "explain": ""}, {"id": "y2023-21", "num": 21, "type": "multiple", "chapter": "", "stem": "十月革命胜利后，为捍卫年轻的苏维埃政权，列宁领导的苏维埃政权从1918年夏到1921年春实行了战时共产主义政策。战时共产主义政策是苏维埃俄国面临帝国主义武装干涉和国内战争被迫采取的一种临时性政策。战时共产主义政策主要内容有（）", "options": {"A": "余粮收集制", "B": "取消商品货币关系", "C": "发展多种所有制", "D": "支持农民耕种自留地"}, "answer": "AB", "explain": ""}, {"id": "y2023-22", "num": 22, "type": "multiple", "chapter": "", "stem": "中国共产党的历史，是一部不断推进马克思主义中国化、时代化的历史，是一部不断推进理论创新、进行理论创造的历史。在这一历程中，毛泽东是马克思主义中国化的伟大开拓者和毛泽东思想的主要创立者，其主要贡献是（）", "options": {"A": "第一次明确提出了“马克思主义中国化”的科学命题和重大任务", "B": "深刻论证了马克思主义中国化的必要性和重要性", "C": "系统阐述了马克思主义中国化的科学内涵", "D": "全面清除了马克思主义中国化认识上的各种障碍"}, "answer": "ABC", "explain": ""}, {"id": "y2023-23", "num": 23, "type": "multiple", "chapter": "", "stem": "资本是社会主义市场经济的重要生产要素。党的十八大以来，我们对资本性质的理解逐步深化，对资本作用的
